<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>우완좌완 야구 매니저</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1015; --panel:#161b22; --panel2:#1d232c; --line:#2a323d;
  --ink:#e9e4d8; --dim:#8b95a3; --gold:#c9a227; --clay:#b4553a;
  --turf:#2f7a58; --red:#d2544a; --blue:#4a8fd2;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:78px;max-width:560px;margin:0 auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
.muted{color:var(--dim);font-size:12.5px;line-height:1.65;margin:8px 0 0}

/* 헤더 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:baseline;gap:8px}
.topbar h1{font-size:15px;margin:0;letter-spacing:-.02em;font-weight:800}
.topbar span{font-size:11px;color:var(--dim)}
.topbar .ver{margin-left:auto;font-size:10px;font-weight:700;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;letter-spacing:.02em}
.topbar .ver.new{color:#0d1015;background:var(--gold);border-color:var(--gold)}

#view{padding:14px 14px 20px}

/* 히어로 */
.hero{background:linear-gradient(160deg,#1b2530,#12171e);border:1px solid var(--line);
  border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;inset:auto -30% -60% -30%;height:160px;
  background:radial-gradient(ellipse at center,rgba(201,162,39,.10),transparent 70%)}
.hero-tag{font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.hero-name{font-size:34px;font-weight:900;letter-spacing:.1em;color:var(--gold);margin:6px 0 0;line-height:1}
.hero-sub{font-size:13px;color:var(--dim);letter-spacing:.32em;margin-top:4px}
.record{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-top:18px;position:relative}
.record>div{display:flex;flex-direction:column;align-items:center}
.record b{font-size:22px;font-weight:800;line-height:1}
.record span{font-size:10px;color:var(--dim);margin-top:3px}
.rsep{width:1px;height:26px;background:var(--line);align-self:center}
.progress{height:4px;background:#232a33;border-radius:2px;margin-top:18px;overflow:hidden}
.progress .bar{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
.hero-foot{font-size:11px;color:var(--dim);margin-top:7px}

/* 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.card-h{font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.opp-name{font-size:20px;font-weight:800;letter-spacing:-.02em}
.opp-ops{font-size:12px;color:var(--dim);margin-top:3px}
.scout{font-size:12px;color:#a9b4c2;line-height:1.65;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:700;margin:6px 0}
.vs b{color:var(--dim);font-size:12px;font-weight:600}

/* 버튼 */
.btn{display:block;width:100%;padding:14px;margin-top:12px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);border-radius:11px;font-size:14.5px;font-weight:700}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--gold);color:#14181e;border-color:var(--gold)}
.btn.danger{background:transparent;color:var(--red);border-color:#4a2b28}
.btn.small{padding:11px;font-size:13px}
.btn-row{display:flex;gap:9px}
.btn-row .btn{margin-top:12px}

/* 팀 성향 */
.tend-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.tn{font-size:12px;width:34px;color:var(--dim)}
.tbar{flex:1;height:6px;background:#232a33;border-radius:3px;overflow:hidden}
.tbar div{height:100%;background:var(--clay)}
.tv{font-size:11.5px;width:34px;text-align:right;color:var(--dim)}

/* 최근 결과 */
.res-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.res-row:first-of-type{border-top:0}
.badge{font-size:11px;font-weight:800;width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center}
.badge.w{background:rgba(47,122,88,.25);color:#5fd39c}
.badge.l{background:rgba(210,84,74,.2);color:#e08078}
.badge.t{background:#252c35;color:var(--dim)}
.res-opp{flex:1;font-size:13.5px}
.res-score{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* 라인업 */
.lineup{margin-bottom:12px}
.lp-row{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:7px}
.lp-n{width:22px;height:22px;border-radius:6px;background:var(--panel2);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.lp-main{flex:1;min-width:0}
.lp-name{font-size:14.5px;font-weight:700}
.lh{font-size:9px;background:var(--blue);color:#0d1015;padding:1px 4px;border-radius:3px;margin-left:5px;vertical-align:middle;font-weight:800}
.lp-stat{font-size:11px;color:var(--dim);margin-top:2px}
.lp-rate{font-size:10px;color:#6f7986;text-align:right;white-space:nowrap}
.pos-badge{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-size:11.5px;font-weight:700;padding:7px 9px;border-radius:8px;flex:none;min-width:44px}
.warn{background:rgba(180,85,58,.14);border:1px solid #4a2f26;color:#e0a08f;
  font-size:12px;padding:11px;border-radius:10px;margin-bottom:12px}

/* 투수 */
.pt-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.pt-row:first-child{border-top:0}
.pt-n{font-size:10.5px;color:var(--gold);width:30px;font-weight:700;flex:none}
.pt-main{flex:1;min-width:0}
.pt-name{font-size:14px;font-weight:700}
.pt-stat{font-size:10.5px;color:var(--dim);margin-top:2px}
.pt-rate{font-size:9.5px;color:#6f7986;text-align:right;line-height:1.45;flex:none}
.pt-ctl{display:flex;flex-direction:column;gap:3px;flex:none}
.pt-ctl button{width:30px;height:22px;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:5px;font-size:9px}
.pt-ctl button:disabled{opacity:.28}

/* 시트 */
#sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
#sheet.open{pointer-events:auto}
#sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .22s}
#sheet.open #sheet-bg{opacity:1}
#sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
  background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--line);
  max-height:78vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
#sheet.open #sheet-panel{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:14px;font-weight:800}
#sheet-close{background:none;border:0;color:var(--dim);font-size:22px;padding:0 4px;line-height:1}
#sheet-body{overflow-y:auto;padding:8px 10px 26px;-webkit-overflow-scrolling:touch}
.pick-row{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:12px 8px;text-align:left;color:var(--ink)}
.pick-row.cur{background:rgba(201,162,39,.10)}
.pick-row.used{opacity:.45}
.pk-name{font-size:14px;font-weight:700}
.pk-note{font-size:10.5px;color:var(--dim);margin-top:2px;max-width:190px}
.pk-r{text-align:right;flex:none}
.pk-rate{font-size:10.5px;color:#6f7986}
.pk-stat{font-size:13px;font-weight:700;margin-top:2px}

/* 경기 */
.stage{margin-top:4px}
.scoreboard{display:flex;align-items:center;justify-content:space-between;
  background:#0a0d11;border:1px solid var(--line);border-radius:13px;padding:15px}
.sb-team{display:flex;flex-direction:column;align-items:center;flex:1;gap:5px}
.sb-team span{font-size:11px;color:var(--dim);text-align:center}
.sb-team b{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.sb-mid{font-size:11px;color:var(--gold);width:78px;text-align:center;font-weight:700}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  margin-top:11px;padding:11px;max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fl{font-size:12.5px;padding:5px 3px;border-bottom:1px solid rgba(42,50,61,.5);color:#c3ccd7}
.fl.inn{color:var(--gold);font-weight:800;margin-top:5px;font-size:11.5px;border:0}
.fl.sub{color:var(--blue);font-size:11.5px}
.fl.hit{color:#7fd6a5}
.fl.hr{color:var(--gold);font-weight:800}
.fl.score{color:#7fd6a5;font-weight:700}
.fl.err{color:#e0a08f}
.fl.bb{color:#9fb4cc}
.fl.sb{color:#8fc9e8}
.fl.out{color:#79838f}
/* 내가 고른 선수 관련 플레이 강조 */
.fl.me{border-left:2px solid var(--gold);padding-left:7px;background:rgba(201,162,39,.07)}
.fl.meline{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:-.2px}
/* 고진선 특수 이벤트 */
.fl.gojin{color:#ffb4a8;font-weight:700;border-left:2px solid #7a3b34;padding-left:7px;
  background:rgba(122,59,52,.12)}
.fl.fric{color:#ffd08a;font-weight:700;border-left:2px solid #7a5b28;padding-left:7px;
  background:rgba(122,91,40,.12)}
.fl.mgr{color:#a9c8ff;font-weight:700;border-left:2px solid #2f4a7a;padding-left:7px;
  background:rgba(47,74,122,.14)}
/* 튜토리얼 */
.tut-body{font-size:13px;line-height:1.85;color:var(--ink);margin-top:4px}
.tut-body b{color:var(--gold)}
.tut-g{color:#7fd6a5;font-weight:800}
.tut-r{color:#e0a08f;font-weight:800}
.tut-dots{display:flex;gap:5px;justify-content:center;margin-top:14px}
.tut-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tut-dots i.on{background:var(--gold);width:16px;border-radius:3px}

.linescore{margin-top:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:11px;overflow-x:auto}
.linescore table{font-size:12px;min-width:100%}
.linescore th,.linescore td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}
.linescore th{color:var(--dim);font-size:10.5px;font-weight:600}
.linescore td.tn{text-align:left;font-weight:700;white-space:nowrap;font-size:11.5px}
.linescore .rr{color:var(--gold);font-weight:800}

table.box{font-size:12px}
table.box th{color:var(--dim);font-size:10px;font-weight:600;padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
table.box td{padding:7px 3px;text-align:center;border-bottom:1px solid rgba(42,50,61,.55)}
table.box td.nm{text-align:left;font-weight:700;white-space:nowrap}
table.box td.nm i{font-style:normal;color:var(--dim);font-size:9.5px;margin-left:4px}
table.box td.tm{color:var(--dim);font-size:10.5px}
.card table.wide{display:block;overflow-x:auto;white-space:nowrap}
tr.me td{background:rgba(201,162,39,.10)}
table.box th.sortable{cursor:pointer;-webkit-tap-highlight-color:transparent}
table.box th.sortable:active{color:var(--ink)}
table.box th.sortable.on{color:var(--gold);font-weight:800}

.fpcard{text-align:center}
.fp-num{font-size:44px;font-weight:900;line-height:1;margin:4px 0}
.fp-num.good{color:#5fd39c}
.fp-num.bad{color:var(--red)}

/* 순위 */
table.stand{font-size:12.5px}
table.stand th{color:var(--dim);font-size:10px;font-weight:600;padding:7px 3px;border-bottom:1px solid var(--line)}
table.stand td{padding:8px 3px;text-align:center;border-bottom:1px solid rgba(42,50,61,.55)}
table.stand td.nm{text-align:left;font-weight:700;font-size:12px}

/* 서브탭 */
.subtabs{display:flex;gap:7px;margin-bottom:12px}
.subtab{flex:1;padding:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);border-radius:9px;font-size:12.5px;font-weight:700}
.subtab.on{background:var(--panel2);color:var(--gold);border-color:#3c4450}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;
  background:rgba(13,16,21,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:0;color:var(--dim);font-size:10.5px;font-weight:700;
  padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .ic{font-size:16px;line-height:1}
.tab.on{color:var(--gold)}

#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);
  background:#e9e4d8;color:#14181e;padding:11px 18px;border-radius:22px;font-size:13px;
  font-weight:700;opacity:0;transition:all .24s;z-index:80;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:100;color:var(--dim);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pt-rate b.ok{color:#5fd39c;font-weight:700}
.pt-rate b.tired{color:var(--gold);font-weight:700}
.pt-rate b.dead{color:var(--red);font-weight:700}

/* ===== v2 추가 ===== */
.mor{display:flex;align-items:center;gap:8px;margin-top:14px;position:relative;font-size:11px;color:var(--dim)}
.morbar{flex:1;height:6px;background:#232a33;border-radius:3px;overflow:hidden}
.morbar div{height:100%;transition:width .3s}

.ev{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev-i{font-size:19px;flex:none;width:24px;text-align:center;line-height:1.3}
.ev-b{flex:1;min-width:0}
.ev-t{font-size:13.5px;font-weight:600;line-height:1.45}
.ev-d{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}
.ev-r{font-size:11.5px;color:var(--gold);margin-top:5px;line-height:1.5}
.ev.good .ev-t{color:#7fd6a5}
.ev.bad .ev-t{color:#e08078}
.ev.warn .ev-t{color:var(--gold)}
.ev-choice{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.ev-choice .btn{margin-top:0;padding:10px;font-size:12.5px}

.train-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.train{text-align:left;padding:11px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;color:var(--ink)}
.train b{display:block;font-size:13px;margin-bottom:3px}
.train span{font-size:10.5px;color:var(--dim);line-height:1.4;display:block}
.train.on{border-color:var(--gold);background:rgba(201,162,39,.12)}
.train.on b{color:var(--gold)}
.grow-list{margin-top:8px}
.grow-i{font-size:12px;color:#7fd6a5;padding:3px 0}

.squad{display:flex;flex-direction:column;gap:8px}
.sq-row{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px;color:var(--ink)}
.sq-row.out{opacity:.55}
.sq-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sq-name{font-size:15px;font-weight:800}
.sq-age{font-size:11px;color:var(--dim)}
.sq-val{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold)}
.sq-val.no{color:var(--red)}
.sq-val.ok{color:#7fd6a5}
.tag{font-size:9.5px;padding:2px 6px;border-radius:5px;background:var(--panel2);
  color:var(--dim);border:1px solid var(--line);font-weight:700}
.tag.lead{background:rgba(201,162,39,.18);color:var(--gold);border-color:#4a3f1e}
.tag.coach{background:rgba(74,143,210,.16);color:#8fc9e8;border-color:#26405a}
.tag.drink{background:rgba(180,85,58,.18);color:#e0a08f;border-color:#4a2f26}
.tag.moan{background:rgba(210,84,74,.16);color:#e08078;border-color:#4a2b28}
.tag.inj,.tag.out{background:rgba(210,84,74,.2);color:#e08078;border-color:#4a2b28}
.tag.warn2{background:rgba(201,162,39,.16);color:var(--gold);border-color:#4a3f1e}
.sq-stars{margin-top:6px;font-size:13px;letter-spacing:1px}
.sq-stars i{color:var(--dim);font-style:normal;margin:0 5px;font-size:11px}
.s{color:#333c47}
.s.full{color:var(--gold)}
.s.half{color:var(--gold);opacity:.5}
.pot .s.full{color:#5a6472}
.pot .s.half{color:#5a6472;opacity:.5}
.sq-bars{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.sq-bars span{font-size:10.5px;color:#8b95a3;background:var(--panel2);padding:2px 6px;border-radius:5px}
.sq-cond{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:var(--dim)}
.cbar{flex:1;height:5px;background:#232a33;border-radius:3px;overflow:hidden;min-width:36px}
.cbar div{height:100%}
.wt{color:#e08078}
.mil{padding:8px 0;border-top:1px solid var(--line)}
.mil:first-of-type{border-top:0}

.pdetail{padding:6px 4px}
.pd-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.pd-bio{font-size:12.5px;color:#a9b4c2;line-height:1.6;margin:0 0 12px}
.pd-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.pd-row span{color:var(--dim)}
.pd-h{font-size:11px;letter-spacing:.08em;color:var(--gold);font-weight:700;margin:14px 0 8px}
.pd-grid{display:flex;flex-direction:column;gap:7px}
.pd-cell{display:flex;align-items:center;gap:9px;font-size:11.5px}
.pd-cell>span{width:30px;color:var(--dim)}
.pd-bar{flex:1;height:7px;background:#232a33;border-radius:4px;position:relative;overflow:hidden}
.pd-bar .pot{position:absolute;left:0;top:0;height:100%;background:#39424e}
.pd-bar .cur{position:absolute;left:0;top:0;height:100%;background:var(--gold);z-index:2}
.pd-cell b{width:56px;text-align:right;font-size:12px}
.pd-cell b i{color:#7fd6a5;font-style:normal;font-size:10.5px;margin-left:2px}
.pos-train{display:flex;flex-wrap:wrap;gap:6px}
.poschip{padding:8px 11px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font-size:12px;font-weight:600}

.lp-ord{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.lp-ord span{font-size:12px;font-weight:800;color:var(--gold);line-height:1}
.ordb{width:26px;height:17px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);border-radius:4px;font-size:8px;padding:0}
.pos-badge.unfit{border-color:#4a2b28;color:#e08078}
.bench-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.bench-row:first-of-type{border-top:0}
.bn{font-size:13.5px;font-weight:700}
.bs{font-size:10.5px;color:var(--dim);margin-left:auto;text-align:right}

.tac-row{padding:9px 0;border-top:1px solid var(--line)}
.tac-row:first-of-type{border-top:0}
.tac-n{font-size:12px;color:var(--dim);margin-bottom:6px}
.tac-btns{display:flex;gap:6px}
.tacb{flex:1;padding:9px 4px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);border-radius:8px;font-size:12px;font-weight:700}
.tacb.on{background:rgba(201,162,39,.14);color:var(--gold);border-color:#4a3f1e}
.tac-d{font-size:10.5px;color:#6f7986;margin-top:5px}

.kakao{background:#8fa8bd;border-radius:12px;padding:12px 10px;margin-bottom:10px}
.kk{margin-bottom:9px}
.kk-who{font-size:10.5px;color:#2c3a47;margin-bottom:3px;font-weight:700}
.kk-bubble{display:inline-block;background:#fff;color:#111;padding:9px 11px;border-radius:3px 12px 12px 12px;
  font-size:13px;line-height:1.5;max-width:85%;word-break:break-word}
.kk-bubble.card2{background:#fffbe8;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:normal}
.kk-bubble.angry{background:#ffe3e0}
.kk-bubble.happy{background:#e6f7ec}
.kk-bubble.drunk{background:#fff0d9}
.kk-bubble.absent{background:#eceff2;color:#555}
.kk.sys{text-align:center;margin:10px 0}
.kk-sys{display:inline-block;background:rgba(0,0,0,.18);color:#fff;font-size:10.5px;
  padding:4px 10px;border-radius:10px}

.decision{margin-top:11px}
.dec-h{font-size:14px;font-weight:800;color:var(--gold);margin-bottom:5px}
.dec-i{font-size:12px;color:#a9b4c2;line-height:1.55;margin-bottom:9px}
.dec-btns{display:flex;flex-direction:column;gap:7px}
.dec-btns .btn{margin-top:0;text-align:left;padding:12px}
.dec-btns .btn i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:500}

.rain{text-align:center}
.rain-i{font-size:38px;margin-bottom:6px}

/* ===== v2 추가 ===== */
.tbar div.g{background:var(--turf)} .tbar div.r{background:var(--clay)}
.evt{border-left:3px solid var(--line);padding:9px 0 9px 11px;margin:9px 0}
.evt-rain{border-color:#4a8fd2}.evt-party{border-color:var(--gold)}
.evt-absent{border-color:var(--clay)}.evt-injury{border-color:var(--red)}
.evt-recover{border-color:var(--turf)}.evt-complain{border-color:var(--red)}
.evt-mitt{border-color:var(--gold)}.evt-field{border-color:var(--dim)}
.evt-t{font-size:13.5px;font-weight:800}
.evt-b{font-size:12px;color:#a9b4c2;margin-top:3px;line-height:1.6}
.evt-e{font-size:11px;color:var(--gold);margin-top:4px}

/* 선수 카드 */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.pcard.injured{border-color:#4a2b28}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc-id{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pc-name{font-size:16px;font-weight:800}
.pc-age{font-size:11px;color:var(--dim)}
.pc-val{font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
.tagx{font-size:9.5px;background:#3a2320;color:#e0a08f;padding:2px 6px;border-radius:4px;font-weight:700}
.pc-stars{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.pc-stars .lbl{font-size:10px;color:var(--dim)}
.stars{letter-spacing:-1px}
.stars .st{color:#333c47;font-size:13px}
.stars .st.full{color:var(--gold)}
.stars .st.half{color:var(--gold);opacity:.5}
.stars.dim .st.full,.stars.dim .st.half{color:#7a6a3a}
.pc-traits{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.trait{font-size:10px;background:var(--panel2);border:1px solid var(--line);color:#a9b4c2;
  padding:2px 7px;border-radius:20px}
.pc-bars{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.pc-bars>div{display:flex;align-items:center;gap:7px}
.pc-bars span{font-size:10.5px;color:var(--dim);width:38px}
.pc-bars b{font-size:10.5px;width:52px;text-align:right;color:#a9b4c2;font-weight:600}
.mini{flex:1;height:5px;background:#232a33;border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%}
.mini i.ok{background:var(--turf)}.mini i.mid{background:var(--gold)}
.mini i.low{background:var(--clay)}.mini i.bad{background:var(--red)}
.pc-rate{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:9px;font-size:10.5px;color:#7f8a96}
.pc-stat{font-size:11.5px;color:#a9b4c2;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pc-desc{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.55}
/* 면담 */
.pc-act{display:flex;gap:6px;margin-top:9px}
.pc-act .mbtn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:8px 6px;font-size:12px;font-weight:700}
.pc-act .mbtn:active{border-color:var(--gold)}
.pc-act .mbtn.hot{border-color:#7a3b34;color:#ffb4a8}
.pc-prom{font-size:11px;color:var(--gold);margin-top:6px;font-weight:700}
.meet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meet-lv{font-size:11px;color:var(--dim)}
.prom-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;
  padding:7px 0;border-bottom:1px solid var(--line)}
.prom-row:last-child{border-bottom:0}
.prom-row b{color:var(--gold);white-space:nowrap}
/* 훈련 — 집중 대상 · 참석자 */
.focus-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px}
.focus-row.miss{border-color:#7a3b34}
.fo-l b{display:block;font-size:14px;font-weight:800}
.fo-l span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.fo-r{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.att-chips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.achip{font-size:11px;padding:4px 8px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim)}
.achip.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.achip.inj{border-color:#4a2b28;color:#c98a80}
/* 용병 섭외 시트 안내 */
.sheet-note{font-size:11px;color:var(--dim);line-height:1.55;padding:4px 4px 10px}
.savestat{font-size:11px;color:var(--blue);background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;margin:8px 0}
.savestat.bad{color:#ffb4a8;border-color:#7a3b34}
.pt-big{font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--gold);margin:2px 0 6px}
.tapcard{cursor:pointer}

/* ---------- 선수 프로필 (OOTP 풍) ----------
   팀 유니폼 색을 그대로 가져왔다. 네이비 판때기에 등번호 주황.        */
.ot{--nv0:#08101d;--nv1:#0f1b2d;--nv2:#15243a;--nvl:#23374f;
    --or:#e8762c;--or2:#ff9a4d;--tx:#e2eaf5;--dm:#8194ad;
    font-size:12px;color:var(--tx)}
.ot-top{display:flex;gap:11px;padding:11px;margin-bottom:9px;
  background:linear-gradient(135deg,#16273f 0%,#0d1728 62%,#0a1220 100%);
  border:1px solid var(--nvl);border-left:3px solid var(--or);border-radius:6px}
.ot-pic{width:104px;flex:0 0 104px;aspect-ratio:3/4;border:1px solid var(--nvl);
  border-radius:4px;overflow:hidden;background:#101a29}
.pf-photo,.pf-clay{display:block;width:100%;height:100%;object-fit:cover}
.gear-row{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:8px 0;background:var(--panel2)}
.gr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gr-top b{font-size:13px}
.gr-lv{display:flex;align-items:center;gap:5px}
.gr-lv i{width:9px;height:9px;border-radius:2px;background:#2a323d;display:block}
.gr-lv i.on{background:var(--gold)}
.gr-lv em{font-style:normal;font-size:10px;color:var(--dim)}
.gr-d{font-size:11px;color:var(--dim);margin:4px 0 2px;line-height:1.5}
.gr-e{font-size:11px;color:var(--turf);margin-bottom:5px}
.gr-wear{height:5px;background:#0d1015;border-radius:3px;overflow:hidden;margin-bottom:3px}
.gr-wear>i{display:block;height:100%}
.gr-wear>i.ok{background:#2f7a58}.gr-wear>i.mid{background:#c9a227}.gr-wear>i.bad{background:#d2544a}
.gr-wl{font-size:10px;color:var(--dim);margin-bottom:6px}
.po-card{border-color:var(--gold)}
.po-seeds{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.po-seed{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:6px 4px;text-align:center}
.po-seed b{display:block;font-size:11px;color:var(--gold)}
.po-seed span{display:block;font-size:10px;color:var(--dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-seed.me{border-color:var(--gold);background:rgba(201,162,39,.14)}
.po-seed.me span{color:var(--ink)}
.po-log{font-size:11px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--line)}
.po-next{margin-top:8px;font-size:13px;font-weight:700;color:var(--gold)}
.po-fin{margin-top:8px;font-size:16px;font-weight:800;color:var(--gold)}
.ftag{font-size:12px;margin-left:4px}
.ot-no{font-style:normal;font-size:14px;font-weight:800;color:var(--or,#e8762c);
  letter-spacing:-.02em;margin-left:2px}
.pc-no{font-size:11px;font-weight:700;color:var(--gold);margin-left:4px}
.hall-pick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.hall-p{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:14px;padding:5px 10px;font-size:11px;font-family:inherit;cursor:pointer}
.hall-p.on{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.12)}
.hall-p em{font-style:normal;margin-left:4px;color:var(--gold);font-weight:700}
.tro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;padding:7px 9px}
.tro{background:linear-gradient(160deg,#1b2d47,#101c2e);border:1px solid #24374f;
  border-radius:7px;padding:9px 5px;text-align:center}
.tro-i{font-size:24px;line-height:1.1}
.tro-l{font-size:11px;font-weight:700;color:#f0d9c6;margin-top:3px}
.tro-v{font-size:10px;color:#8194ad;margin-top:1px}
.tro-w{font-size:9px;color:#5f7791;margin-top:3px}
.tut-guide{display:flex;align-items:flex-end;gap:10px;margin-bottom:-8px;padding:0 2px}
.tut-guide img{width:168px;flex:0 0 168px;display:block;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.tg-talk{flex:1 1 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px 12px 12px 3px;padding:11px 13px;margin-bottom:22px;position:relative}
.tg-nm{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:4px;
  display:flex;align-items:baseline;gap:6px}
.tg-nm span{font-size:9px;font-weight:600;color:var(--dim);letter-spacing:.02em}
.tg-talk p{margin:0;font-size:12.5px;line-height:1.6}
@media(max-width:390px){.tut-guide img{width:136px;flex:0 0 136px}}
@media(max-width:340px){.tut-guide img{width:112px;flex:0 0 112px}}
.award.lg{opacity:.72}
.award.lg.ours{opacity:1;border-left:2px solid var(--gold);padding-left:7px}
.ot-nm{flex:1 1 auto;min-width:0}
.ot-n1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ot-n1 b{font-size:12px;font-weight:800;color:var(--or2);
  border:1px solid rgba(232,118,44,.45);background:rgba(232,118,44,.12);
  border-radius:3px;padding:1px 6px;letter-spacing:0}
.ot-n2{font-size:11px;color:var(--dm);margin-top:3px}
.ot-ov{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.ot-ovi{display:flex;flex-direction:column;line-height:1.15}
.ot-ovi span{font-size:9.5px;color:var(--dm);letter-spacing:.06em}
.ot-ovi b{font-size:17px;font-weight:800;color:var(--or2);font-variant-numeric:tabular-nums}
.ot-ovi b.dim{color:#7fa6cc}
.ot-st{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.ot-alert{background:rgba(196,68,60,.14);border:1px solid #7a3b34;border-left:3px solid #c4443c;
  border-radius:5px;padding:7px 9px;font-size:11.5px;color:#ffb4a8;margin-bottom:9px}
.ot-grid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:680px){.ot-grid{grid-template-columns:1fr 1fr}}
.ot-sec{border:1px solid var(--nvl);border-radius:5px;overflow:hidden;background:var(--nv1)}
.ot-h{background:linear-gradient(90deg,#1b2d47,#122036);border-bottom:1px solid var(--nvl);
  border-left:3px solid var(--or);padding:6px 9px;font-size:11px;font-weight:800;
  letter-spacing:.05em;color:#f0d9c6;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ot-h span{font-size:9.5px;font-weight:600;color:var(--dm);letter-spacing:0}
.ot-b{padding:5px 0}
.ot-r{display:flex;justify-content:space-between;gap:10px;padding:4px 9px;
  font-size:11.5px;line-height:1.45}
.ot-r:nth-child(odd){background:rgba(255,255,255,.022)}
.ot-r>span{color:var(--dm);flex:0 0 auto}
.ot-r>b{font-weight:600;text-align:right}
.ot-r>b.hot{color:var(--or2)}
.ot-mini{height:5px;background:#0a1220;border-radius:3px;overflow:hidden;margin:1px 9px 5px}
.ot-mini>i{display:block;height:100%}
.ot-mini>i.ok{background:#3f9e63}.ot-mini>i.mid{background:#d8a72a}
.ot-mini>i.low{background:#dc8b3a}.ot-mini>i.bad{background:#c4443c}
.ot-rt{padding:3px 9px 5px}
.ot-rt-l{font-size:11px;color:var(--dm);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.ot-rt-l em{font-style:normal;font-size:10px;color:#5f7791}
.ot-rt-b{display:flex;align-items:center;gap:7px}
.ot-num{flex:0 0 58px;text-align:center;font-size:10.5px;font-weight:700;
  font-variant-numeric:tabular-nums;border-radius:3px;padding:2px 0;color:#08101d}
.ot-num.t4{background:#4aa3e0}.ot-num.t3{background:#3f9e63}
.ot-num.t2{background:#d8a72a}.ot-num.t1{background:#c4443c}
.ot-num.t0{background:#2b3a4e;color:var(--dm);font-size:9.5px}
.ot-bar{position:relative;flex:1 1 auto;height:11px;background:#0a1220;
  border:1px solid #1b2b40;border-radius:2px;overflow:hidden}
.ot-bar>u,.ot-bar>i{position:absolute;left:0;top:0;bottom:0;display:block;text-decoration:none}
.ot-bar>u{background:rgba(255,255,255,.11)}
.ot-bar>i.t4{background:#4aa3e0}.ot-bar>i.t3{background:#3f9e63}
.ot-bar>i.t2{background:#d8a72a}.ot-bar>i.t1{background:#c4443c}
.ot-bar>i.t0{background:#2b3a4e}
.ot-note{font-size:10.5px;color:var(--dm);line-height:1.55;padding:4px 9px 6px;margin:0}
.ot-adv{padding:6px 9px;border-left:2px solid var(--or);margin:6px 9px 8px;background:rgba(232,118,44,.05)}
.ot-adv b{display:block;font-size:12px;color:var(--or2)}
.ot-adv span{display:block;font-size:11px;color:var(--dm);line-height:1.5;margin-top:2px}
.ot-tr{display:flex;gap:8px;align-items:baseline;padding:4px 9px;font-size:11px}
.ot-tr:nth-child(odd){background:rgba(255,255,255,.022)}
.ot-tr b{flex:0 0 auto;color:var(--or2);border:1px solid rgba(232,118,44,.35);
  background:rgba(232,118,44,.10);border-radius:3px;padding:1px 6px;font-size:10.5px}
.ot-tr span{color:var(--dm);line-height:1.5}
.ot-tbl{overflow-x:auto;padding:0 0 4px;-webkit-overflow-scrolling:touch}
.ot-tbl table{border-collapse:collapse;width:100%;font-size:11px;
  font-variant-numeric:tabular-nums;min-width:max-content}
.ot-tbl th{background:#14243a;color:var(--dm);font-weight:700;font-size:9.5px;
  padding:4px 8px;border-bottom:1px solid var(--nvl);text-align:right;white-space:nowrap}
.ot-tbl td{padding:5px 8px;text-align:right;white-space:nowrap;color:var(--tx)}
.ot-tbl th:first-child,.ot-tbl td:first-child{text-align:left}
.ot-tbl tbody tr:nth-child(odd){background:rgba(255,255,255,.022)}
.pt-role{font-size:10px;color:var(--blue);margin-top:2px}
.pt-row.bad .pt-role{color:#c98a80}
.pt-ctl .rm{color:#c98a80}
.starter-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:8px 0}
.starter-row span{font-size:11px;color:var(--dim)}
.starter-row b{font-size:14px;font-weight:800;color:var(--gold)}
.starter-row i{font-style:normal;font-size:10px;color:var(--dim);flex-basis:100%}
.sendopt.bought{opacity:.55;border-color:var(--gold)}
.sendopt i.gfor{font-style:normal;color:#7fd6a5}
.sendopt i.gag{font-style:normal;color:#e0a08f}
.warnx{color:#ffb4a8;font-weight:700}
.pc-adv{font-size:11px;color:var(--blue);margin-top:3px}
.pc-adv b{color:var(--gold)}
.gdate i.gapx{font-style:normal;color:var(--blue);margin-left:6px;font-size:10.5px}
.pc-val i{font-style:normal;font-size:10px;margin-left:4px}
.pc-val i.vup{color:#7fd6a5}
.pc-val i.vdn{color:#e0a08f}
/* 경기 하이라이트 */
.hl-dec{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:9px}
.hl-lbl{font-size:10.5px;color:var(--dim);white-space:nowrap}
.hl-val{font-size:13px;font-weight:800}
table.hl-tbl td i{display:block;font-style:normal;font-size:9.5px;color:var(--dim)}
table.hl-tbl td.hl-hr{color:var(--gold);font-weight:800}
table.hl-tbl td.hl-x{color:#7fd6a5;font-weight:700}
table.hl-tbl td.hl-o{color:#c98a80}
.dimx{color:var(--dim);font-size:10.5px}

/* 라인업 추가 */
.lp-row.bad{opacity:.5;border-color:#4a2b28}
.lp-ctl{display:flex;flex-direction:column;gap:3px;flex:none}
.lp-ctl button{width:28px;height:20px;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:5px;font-size:8px;padding:0}
.bench-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.bench-row:first-of-type{border-top:0}
.bench-row.bad{opacity:.45}
.bench-row .bn{font-size:13.5px;font-weight:700;flex:none;width:64px}
.bench-row .bs{flex:1;font-size:11px;color:var(--dim)}
.pt-row.bad{opacity:.45}
.pick-row.bad{opacity:.4}

/* 전술 */
.tac-label{font-size:11px;color:var(--dim);margin:12px 0 6px}
.tac-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tac{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:10px 8px;text-align:left}

.tac span{display:block;font-size:9.5px;color:var(--dim);margin-top:2px}

.kbub.angry{background:#ffd9d4}
.kbub.sad{background:#e4e8ee}
.kbub.happy{background:#d9f5e4}

.diamond{position:relative;width:110px;height:110px;margin:12px auto 4px;transform:rotate(45deg)}
.base{position:absolute;width:17px;height:17px;background:#232a33;border:1px solid var(--line);border-radius:3px}

.b2{top:0;left:0}.b3{bottom:0;left:0}.b1{top:0;right:0}
.bh{bottom:0;right:0;background:#39414c}

.dec-g{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.decb{background:var(--panel2);border:1px solid var(--line);color:var(--ink);

.train-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

.gbar i{position:absolute;left:0;top:0;height:100%;background:var(--gold)}
.gv{font-size:10.5px;color:var(--dim);width:34px;text-align:right}

.aw-v{font-size:11.5px;color:var(--dim)}

/* ---------- 이름 생성 ---------- */
const SUR=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','전','홍','고','문','손','양','배','백','허','유','남','심'];
const GIV=['민수','성호','지훈','현우','준영','태양','승현','재우','성민','우진','건우','정호','상현','대호','기범','성진','영수','인성','종민','기훈','창우','명석','세영','한별','도현','수빈','재현','병철','원준','규성'];
function genName(rng,used){
  for(let i=0;i<80;i++){
    const n=SUR[(rng()*SUR.length)|0]+GIV[(rng()*GIV.length)|0];
    if(!used.has(n)){used.add(n);return n;}
  }
  const n='선수'+((rng()*9000+1000)|0); used.add(n); return n;
}

const POS9=['C','1B','2B','3B','SS','LF','CF','RF','DH'];

function opsToRatings(ops,rng){
  const base=clamp(50+(ops-0.95)*40,20,80);
  const sp=()=>(rng()-0.5)*13;
  return {
    con:Math.round(clamp(base+sp(),20,80)),
    pow:Math.round(clamp(base-3+sp(),20,80)),
    eye:Math.round(clamp(base*0.55+22+sp(),20,80)),
    spd:Math.round(clamp(44+sp()*1.7,20,80)),
    def:Math.round(clamp(46+sp(),20,76)),
    arm:Math.round(clamp(46+sp(),20,76)),
  };
}

function eraToPitcher(era, ip, k){
  // 구위 = 삼진율 기반 (있으면), 제구 = ERA 기반
  const e = era==null?7.5:era;
  const innings = ip||8;
  let stf;
  if(k!=null && innings>0){
    const kPerIp = k/innings;              // 리그 평균 약 0.8
    stf = clamp(38 + (kPerIp-0.8)*38, 22, 78);
  } else {
    stf = clamp(60-(e-1)*2.8, 24, 68);
  }
  const ctl = clamp(68-(e-1)*3.6, 16, 70);
  const sta = clamp(30+Math.min(40,innings)*0.7, 26, 64);
  return {stf:Math.round(stf),ctl:Math.round(ctl),sta:Math.round(sta)};
}

function buildAI(def,seed){
  const rng=makeRng(seed); const used=new Set(); const players=[];
  const real = (typeof REALDATA!=='undefined')?REALDATA:{rosters:{},pitchers:{}};
  const realRoster = real.rosters[def.id]||null;
  const realPit = real.pitchers[def.id]||null;
  const stars=def.stars.slice().sort((a,b)=>b[1]-a[1]);
  const starMap={}; stars.forEach(x=>starMap[x[0]]=x[1]);

  if(realRoster && realRoster.length>=9){
    // 실제 박스스코어 로스터 사용
    realRoster.forEach((rp,i)=>{
      used.add(rp.name);
      const ops = starMap[rp.name]!=null ? starMap[rp.name]
        : clamp(def.ops-0.05-rng()*0.30, 0.25, 1.5);
      const r=opsToRatings(ops,rng);
      players.push({id:def.id+'_'+i,name:rp.name,bats:rng()<0.14?'L':'R',
        con:r.con,pow:r.pow,eye:r.eye,spd:r.spd,def:r.def,arm:r.arm,
        pos:(rp.pos&&rp.pos.length?rp.pos:[POS9[i%9]]),pitch:null,real:null,ovr:ops,no:rp.no});
    });
    // 랭킹에만 있고 로스터에 없는 스타 보강
    stars.forEach((st,i)=>{
      if(used.has(st[0]))return;
      const r=opsToRatings(st[1],rng);
      used.add(st[0]);
      players.push({id:def.id+'_x'+i,name:st[0],bats:rng()<0.14?'L':'R',
        con:r.con,pow:r.pow,eye:r.eye,spd:r.spd,def:r.def,arm:r.arm,
        pos:[POS9[players.length%9]],pitch:null,real:null,ovr:st[1]});
    });
  } else {
    for(let i=0;i<11;i++){
      let name,ops;
      if(i<stars.length){name=stars[i][0];ops=stars[i][1];used.add(name);}
      else{name=genName(rng,used);ops=clamp(def.ops-0.12-rng()*0.26,0.25,1.5);}
      const r=opsToRatings(ops,rng);
      players.push({id:def.id+'_'+i,name,bats:rng()<0.14?'L':'R',
        con:r.con,pow:r.pow,eye:r.eye,spd:r.spd,def:r.def,arm:r.arm,
        pos:[POS9[i%9]],pitch:null,real:null,ovr:ops});
    }
  }

  let pitchers;
  if(realPit && realPit.length){
    pitchers = realPit.map((rp,i)=>{
      const g=eraToPitcher(rp.era, rp.ip, rp.k);
      return {id:def.id+'_p'+i,name:rp.name,stf:g.stf,ctl:g.ctl,sta:g.sta,era:rp.era};
    });
    if(pitchers.length<2){
      const b=def.aces[1]||def.aces[0];
      pitchers.push({id:def.id+'_pb',name:genName(rng,used),
        stf:Math.round(clamp(b[1]-6,20,70)),ctl:Math.round(clamp(b[2]-6,18,70)),
        sta:Math.round(clamp(38+rng()*12,25,58))});
    }
  } else {
    pitchers=def.aces.map((a,i)=>({id:def.id+'_p'+i,name:a[0],stf:a[1],ctl:a[2],sta:a[3]}));
  }
  pitchers.push({id:def.id+'_p9',name:genName(rng,used),
    stf:Math.round(clamp((pitchers[pitchers.length-1].stf||40)-6-rng()*6,20,70)),
    ctl:Math.round(clamp((pitchers[pitchers.length-1].ctl||40)-6-rng()*6,18,70)),
    sta:Math.round(clamp(38+rng()*12,25,58))});
  return finalizeTeam({id:def.id,name:def.name,ops:def.ops,avg:def.avg,
    tend:{k:def.t[0],bb:def.t[1],sb:def.t[2],babip:def.t[3],pow:def.t[4],err:def.err},
    players,pitchers,isUser:false});
}

function buildUser(){
  const players=WWZW.map(p=>({...p}));
  const pitchers=players.filter(p=>p.pitch).map(p=>({
    id:p.id,name:p.name,stf:p.pitch.stf,ctl:p.pitch.ctl,sta:p.pitch.sta,playerId:p.id}));
  const d=WWZW_TEND;

    tend:{k:d.t[0],bb:d.t[1],sb:d.t[2],babip:d.t[3],pow:d.t[4],err:d.err},
    players,pitchers,isUser:true});

/* 팀 내 평균을 계산해서 선수 계수를 팀 평균 기준으로 정규화 */
function finalizeTeam(team){
  // 실제 출전하는 주전 9명 기준으로 정규화 (벤치 포함 시 편향 발생)
  const core=team.players.slice().sort((a,b)=>
    (b.con+b.pow+b.eye+b.spd*0.4)-(a.con+a.pow+a.eye+a.spd*0.4)).slice(0,9);
  const n=core.length;
  const avg=k=>core.reduce((s,p)=>s+p[k],0)/n;
  team.mean={con:avg('con'),pow:avg('pow'),eye:avg('eye'),spd:avg('spd'),def:avg('def')};
  const all=team.players;
  team.defMean=all.reduce((s,p)=>s+p.def,0)/all.length;
  return team;
}

function buildAllTeams(){
  const out=[buildUser()];
  LEAGUE_DEFS.forEach((d,i)=>out.push(buildAI(d,10007+i*7919)));
  return out;
}

/* ---------- 타석 ---------- */
function simPA(bat,pit,offTeam,defTeam,rng,tac,cond,park){
  const m=offTeam.mean;
  tac = tac || {bat:'normal'};
  park = park || {hr:1,d2:1,d3:1,err:1,babip:1};
  const cf = (cond==null?70:cond);           // 컨디션 0~100 (70=기준)
  const cAdj = (cf-70)/100;                   // -0.7 ~ +0.3
  // 팀 평균 대비 선수 편차 → 배수
  const conE = bat.con + cAdj*14;
  const powE = bat.pow + cAdj*10;
  const spdE = bat.spd + cAdj*10;
  const fK   = Math.exp(-(conE-m.con)*0.020);
  const fBB  = Math.exp( (bat.eye-m.eye)*0.013);
  const fBip = Math.exp( ((conE-m.con)*0.0105 + (spdE-m.spd)*0.0050));
  const fPow = Math.exp( (powE-m.pow)*0.022);

  // 투수 (리그 평균 투수 stf 45 / ctl 43 기준)
  const pK  = Math.exp((pit.stf-45)*0.013);
  const pBB = Math.exp((43-pit.ctl)*0.013);
  const pBip= Math.exp(-(pit.stf-45)*0.005);

  const dFactor = Math.exp(-((defTeam._slotDef!=null?defTeam._slotDef:defTeam.mean.def)-46)*0.006);

  let tK=1, tBB=1, tBip=1, tPow=1;
  if(tac.bat==='patient'){ tK=1.18; tBB=1.45; tBip=0.97; }
  else if(tac.bat==='aggressive'){ tK=0.86; tBB=0.58; tBip=1.03; tPow=1.06; }
  else if(tac.bat==='contact'){ tK=0.74; tBB=0.92; tBip=1.02; tPow=0.86; }
  let kR  = clamp(LG.K  * offTeam.tend.k  * fK  * pK * tK , 0.01, 0.55);
  let bbR = clamp(LG.BB * offTeam.tend.bb * fBB * pBB * tBB, 0.01, 0.42);
  const hbpR = LG.HBP;

  let r=rng();
  if(r<kR) return {type:'K'};
  r-=kR;
  if(r<bbR) return {type:'BB'};
  r-=bbR;
  if(r<hbpR) return {type:'HBP'};

  const errR = clamp(LG.ERR_PER_BIP * defTeam.tend.err * dFactor * park.err * (defTeam._errMod||1), 0.01, 0.22);
  if(rng()<errR) return {type:'E'};

  const babip = clamp(LG.BABIP * offTeam.tend.babip * fBip * pBip * dFactor * tBip * park.babip, 0.15, 0.75);
  if(rng()>=babip) return {type:'OUT', gb: rng()<0.56};

  const pw = offTeam.tend.pow * fPow * tPow;
  let p2=LG.H2*pw*park.d2, p3=LG.H3*Math.pow(pw,0.4)*park.d3, phr=LG.HR*Math.pow(pw,1.7)*park.hr;
  const tot=p2+p3+phr;
  if(tot>0.85){const s=0.85/tot;p2*=s;p3*=s;phr*=s;}
  const rr=rng();
  if(rr<phr) return {type:'HR'};
  if(rr<phr+p3) return {type:'3B'};
  if(rr<phr+p3+p2) return {type:'2B'};
  return {type:'1B'};
}

/* ---------- 경기 ---------- */
function newBox(){return {pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}
function newPit(){return {outs:0,h:0,r:0,er:0,bb:0,k:0,hbp:0,sbA:0,bf:0};}

function simGame(home,away,opts){
  const rng=opts.rng||makeRng((Date.now()*7919)>>>0);
  const INN=opts.innings||7;
  const log=[],box={},pbox={};

  const S=[
    {team:away,slots:opts.awayLineup,rot:opts.awayRotation,home:false,
     tac:opts.awayTactics||{bat:'normal',run:'normal',hook:'normal'},cond:opts.awayCond||{}},
    {team:home,slots:opts.homeLineup,rot:opts.homeRotation,home:true,
     tac:opts.homeTactics||{bat:'normal',run:'normal',hook:'normal'},cond:opts.homeCond||{}},
  ];
  S.forEach(s=>{
    s.order=0;s.runs=0;s.hits=0;s.errs=0;s.bbs=0;s.sbAllowed=0;s.line=[];
    s.pIdx=0;
    const c=s.slots.find(x=>x.pos==='C');
    const cp=c?s.team.players.find(p=>p.id===c.id):null;
    s.cArm=(cp?cp.arm:45) - (s.team.isUser?(opts.gearPenalty||0):0);
    s.slots.forEach(sl=>{box[sl.id]=box[sl.id]||newBox();});
    s.rot.forEach(pid=>{pbox[pid]=pbox[pid]||newPit();});
  });

  const cur=s=>{
    const pid=s.rot[Math.min(s.pIdx,s.rot.length-1)];
    return s.team.pitchers.find(x=>x.id===pid)||s.team.pitchers[0];
  };
  function change(s,inn){
    const p=cur(s),l=pbox[p.id];
    const hk=s.tac?s.tac.hook:'normal';
    const mul = hk==='quick'?0.72:(hk==='long'?1.30:1);
    const lim=Math.round((6+(p.sta-28)*0.40)*mul);
    const bbLim = hk==='quick'?4:(hk==='long'?9:7);
    const rLim  = hk==='quick'?5:(hk==='long'?12:9);
    if((l.outs>=lim||l.bb+l.hbp>=bbLim||l.r>=rLim)&&s.pIdx<s.rot.length-1){
      s.pIdx++;
      log.push({t:'sub',inning:inn,text:`투수 교체 · ${s.team.name}: ${p.name} → ${cur(s).name}`});
    }
  }

  let over=false, inn=0, mercy=false;
  const maxInn=INN+3;

  while(!over && inn<maxInn){
    inn++;
    for(let half=0;half<2;half++){
      const off=S[half],def=S[1-half];
      if(half===1 && inn>=INN && S[1].runs>S[0].runs){ off.line.push(null); over=true; break; }
      if(inn>INN && half===0 && S[0].runs!==S[1].runs){ over=true; break; }

      let outs=0,bases=[null,null,null],ir=0;
      change(def,inn);
      log.push({t:'inning',inning:inn,half,
        text:`${inn}회 ${half===0?'초':'말'}${inn>INN?' (연장)':''} · ${off.team.name} 공격`});

      let guard=0;
      while(outs<3 && guard++<70){
        const pit=cur(def), pl=pbox[pit.id];
        const slot=off.slots[off.order%9];
        const bat=off.team.players.find(x=>x.id===slot.id);
        off.order++;
        pl.bf++;

        // 도루
        if(bases[0]&&!bases[1]){
          const rn=off.team.players.find(x=>x.id===bases[0]);
          if(rn){
            let runMul=1;
            if(off.tac.run==='aggressive')runMul=1.6;
            else if(off.tac.run==='hold')runMul=0.12;
            const att=clamp(LG.SB_PER_PA*5.64*off.team.tend.sb*runMul*Math.exp((rn.spd-46)*0.020),0.0,0.85);
            if(rng()<att){
              const su=clamp(LG.SB_SUCCESS+(rn.spd-50)*0.0030-(def.cArm-46)*0.0060,0.45,0.99);
              if(rng()<su){
                bases[1]=bases[0];bases[0]=null;box[rn.id].sb++;pl.sbA++;def.sbAllowed++;
                log.push({t:'play',inning:inn,half,text:`${rn.name} 2루 도루 성공`,cls:'sb'});
              }else{
                bases[0]=null;outs++;pl.outs++;box[rn.id].cs++;
                log.push({t:'play',inning:inn,half,text:`${rn.name} 도루 실패`,cls:'out'});
                if(outs>=3)break;
              }
            }
          }
        }

        const res=simPA(bat,pit,off.team,def.team,rng,off.tac,off.cond[bat.id],opts.park);
        const bl=box[bat.id]; bl.pa++;
        const score=(rid,e)=>{if(!rid)return;box[rid].r++;off.runs++;ir++;pl.r++;if(e)pl.er++;};
        const adv=(n,e)=>{for(let b=2;b>=0;b--){if(bases[b]){const nb=b+n;
          if(nb>=3){score(bases[b],e);bl.rbi++;}else bases[nb]=bases[b];bases[b]=null;}}};

        if(res.type==='K'){bl.ab++;bl.k++;pl.k++;pl.outs++;outs++;
          log.push({t:'play',inning:inn,half,text:`${bat.name} 삼진`,cls:'out'});}
        else if(res.type==='BB'||res.type==='HBP'){
          const isBB=res.type==='BB';
          if(isBB){bl.bb++;pl.bb++;off.bbs++;}else{bl.hbp++;pl.hbp++;}
          if(bases[0]&&bases[1]&&bases[2]){score(bases[2],true);bl.rbi++;bases[2]=bases[1];bases[1]=bases[0];}
          else if(bases[0]&&bases[1]){bases[2]=bases[1];bases[1]=bases[0];}
          else if(bases[0]){bases[1]=bases[0];}
          bases[0]=bat.id;
          log.push({t:'play',inning:inn,half,text:`${bat.name} ${isBB?'볼넷':'몸에 맞는 공'}`,cls:'bb'});}
        else if(res.type==='E'){bl.ab++;def.errs++;adv(1,false);bases[0]=bat.id;
          log.push({t:'play',inning:inn,half,text:`${bat.name} 상대 실책 출루`,cls:'err'});}
        else if(res.type==='OUT'){
          bl.ab++;pl.outs++;outs++;
          if(res.gb&&bases[0]&&outs<3&&rng()<0.16){bases[0]=null;pl.outs++;outs++;
            log.push({t:'play',inning:inn,half,text:`${bat.name} 병살타`,cls:'out'});}
          else if(bases[2]&&outs<3&&!res.gb&&rng()<0.30){score(bases[2],true);bl.rbi++;bases[2]=null;
            log.push({t:'play',inning:inn,half,text:`${bat.name} 희생플라이 · 1점`,cls:'score'});}
          else log.push({t:'play',inning:inn,half,text:`${bat.name} ${res.gb?'땅볼':'뜬공'} 아웃`,cls:'out'});}
        else{
          bl.ab++;bl.h++;pl.h++;off.hits++;
          if(res.type==='1B'){adv(rng()<0.35?2:1,true);bases[0]=bat.id;
            log.push({t:'play',inning:inn,half,text:`${bat.name} 안타`,cls:'hit'});}
          else if(res.type==='2B'){bl.d2++;adv(2,true);bases[1]=bat.id;
            log.push({t:'play',inning:inn,half,text:`${bat.name} 2루타`,cls:'hit'});}
          else if(res.type==='3B'){bl.d3++;adv(3,true);bases[2]=bat.id;
            log.push({t:'play',inning:inn,half,text:`${bat.name} 3루타`,cls:'hit'});}
          else{bl.hr++;let c=1;for(let b=0;b<3;b++)if(bases[b]){score(bases[b],true);c++;bases[b]=null;}
            score(bat.id,true);bl.rbi+=c;
            log.push({t:'play',inning:inn,half,text:`${bat.name} 홈런! ${c}점`,cls:'hr'});}}

        if(half===1&&inn>=INN&&S[1].runs>S[0].runs){over=true;break;}
      }
      off.line.push(ir);
      if(over)break;
    }
    // 콜드게임: 4회 이후 10점차 / 6회 이후 7점차
    const diff=Math.abs(S[0].runs-S[1].runs);
    if(!over && ((inn>=4&&diff>=10)||(inn>=6&&diff>=7))){ over=true; mercy=true; }
    if(inn>=INN && S[0].runs!==S[1].runs) over=true;
  }

  // 부상 판정 (경기당 팀별 최대 1건)
  const injuries=[];
  [S[0],S[1]].forEach(sd=>{
    if(!sd.team.isUser) return;
    if(rng()<0.085){
      const cands=sd.slots.map(x=>sd.team.players.find(p=>p.id===x.id)).filter(Boolean);
      const v=cands[(rng()*cands.length)|0];
      if(v) injuries.push({id:v.id, roll:rng()});
    }
  });

  const awayWin=S[0].runs>S[1].runs;
  const tie=S[0].runs===S[1].runs;
  const win=awayWin?S[0]:S[1], lose=awayWin?S[1]:S[0];

  return {
    away:{team:away,runs:S[0].runs,hits:S[0].hits,errs:S[0].errs,bbs:S[0].bbs,sbAllowed:S[0].sbAllowed,line:S[0].line},
    home:{team:home,runs:S[1].runs,hits:S[1].hits,errs:S[1].errs,bbs:S[1].bbs,sbAllowed:S[1].sbAllowed,line:S[1].line},
    box,pbox,log,tie,
    winner:tie?null:(awayWin?away.id:home.id),
    loser:tie?null:(awayWin?home.id:away.id),
    wp:tie?null:win.rot[0],
    lp:tie?null:lose.rot[Math.min(lose.pIdx,lose.rot.length-1)],
    innings:inn, mercy, injuries,
  };
}

/* ---------- 능력 ---------- */
function calcCA(p){
  return (p.con*1.3 + p.pow*1.1 + p.eye*0.8 + p.spd*0.7 + p.def*0.7 + p.arm*0.4)/5.0;
}
function calcPA(p, meta){
  const age = 2026 - (meta?meta.born:1999);
  const youth = age<=21?14:age<=24?10:age<=26?7:3;
  return Math.min(80, calcCA(p) + youth*0.6 + (meta?meta.pot:4));
}
function stars(v){
  /* FM 기준. 사회인 4부에서 리그 최상위가 3.5~4.0, 주전급 2~3.
     CA 20~72 구간을 눌러서 상위권만 별이 높게 나오게 한다. */
  const t = Math.max(0, Math.min(1, (v-20)/58));
  const s = Math.pow(t, 1.60) * 5.0;
  return Math.max(0.5, Math.min(5, Math.round(s*2)/2));
}
function starHTML(v, dim){
  const s=stars(v); let h='';
  for(let i=1;i<=5;i++){
    if(s>=i)h+='<span class="st full">★</span>';
    else if(s>=i-0.5)h+='<span class="st half">★</span>';
    else h+='<span class="st">★</span>';
  }
  return `<span class="stars${dim?' dim':''}">${h}</span>`;
}

/* 포지션 적합도 (0~80). 0이면 불가 */
/* 타고난 포지션 적합도 (훈련 전) */
function basePosFit(pid, pos){
  const m=META[pid];
  if(!m||!m.pos) return pos==='DH'?50:35;
  const v=m.pos[pos];
  return v===undefined?30:v;
}
/* 좌투수는 포수·2루·3루·유격을 볼 수 없다. 훈련으로도 안 된다.
   (송구 방향 때문에 물리적으로 불가능하다)                          */
const LEFTY_BLOCKED = ['C','2B','3B','SS'];
function posTrainCap(pid, pos){
  const m=META[pid];
  if(m && m.throws==='L' && LEFTY_BLOCKED.indexOf(pos)>=0) return 0;
  const base=basePosFit(pid,pos);
  // 원래 서던 자리는 최대 +25, 아예 안 서던 자리는 30이 한계다.
  // 훈련해도 "익숙하지 않다" 수준을 벗어나지 못한다 — FM 의 포지션 적응과 같다.
  return base>0 ? Math.min(70, base+25) : 30;
}
/* 실제 적용되는 적합도 = 타고난 값 + 훈련으로 올린 값 */
function posFit(pid, pos){
  const base=basePosFit(pid,pos);
  const cap=posTrainCap(pid,pos);
  if(cap<=0) return 0;
  const add=(typeof ST!=='undefined'&&ST&&ST.posTrain&&ST.posTrain[pid])?(ST.posTrain[pid][pos]||0):0;
  if(!add) return base;
  return Math.min(cap, base+add);
}
/* 훈련으로 얼마나 올렸는지 (UI 표시용) */
function posTrained(pid,pos){
  return (typeof ST!=='undefined'&&ST&&ST.posTrain&&ST.posTrain[pid])?(ST.posTrain[pid][pos]||0):0;
}
function canPlay(pid, pos){ return pos==='DH' || posFit(pid,pos)>0; }

/* ---------- 몸값 (현실 단위: 만원) ----------
   리그비 팀당 350만원 = 리그 전체 8,050만원
   선수 1명 최고가가 팀 회비 수준(100만원 초반)을 넘지 않게 설계
*/
function playerValue(p, meta, st){
  const ca=calcCA(p), pa=calcPA(p,meta);
  let v = Math.pow(Math.max(0,ca-14)/10, 2.15) * 1.15;
  v += Math.max(0,pa-ca)*0.12;
  if(meta&&meta.pos){
    if(meta.pos['C']>=55) v*=1.22;
    if(meta.pos['SS']>=50) v*=1.08;
    if(meta.pos['P']>=50) v*=1.16;
  }
  if(p.bats==='L') v*=1.08;
  /* 상을 받으면 값이 붙는다. 한 번에 3%씩, 최대 30%. */
  if(typeof ST!=='undefined'&&ST&&ST.awardBonus&&ST.awardBonus[p.id])
    v *= 1 + Math.min(0.30, ST.awardBonus[p.id]*0.03);
  if(meta&&meta.traits){
    if(meta.traits.includes('유리몸'))v*=0.86;
    if(meta.traits.includes('리더'))v*=1.06;
    if(meta.traits.includes('좌완'))v*=1.12;
  }
  const age=2026-(meta?meta.born:1999);
  if(age<=21)v*=1.15; else if(age>=30)v*=0.85;
  /* 성적에 따른 실시간 변동.
     경기를 치를수록 반영 폭이 커진다(표본이 쌓이니까).
     잘하면 최대 1.9배까지 뛰고 못하면 0.55배까지 떨어진다.           */
  if(st&&st.g>=1){
    const conf=Math.min(1, st.g/10);                 // 10경기면 완전 반영
    const o=(st.h+st.bb+st.hbp)/Math.max(1,st.pa)+(st.h+st.d2+st.d3*2+st.hr*3)/Math.max(1,st.ab);
    const raw=Math.max(0.55,Math.min(1.90,0.50+o*0.52));
    v*= 1 + (raw-1)*conf;
  }
  return Math.max(0.2, v);
}
function wonStr(v){
  if(v>=10) return v.toFixed(0)+'만원';
  if(v>=1) return v.toFixed(1)+'만원';
  return Math.round(v*10)+'천원';
}

/* ---------- 카풀 체계 ----------
   driver: 운전자 / riders: 동승자 / fallback: 운전자 결장 시 대체 운전자 순서
*/
const CARPOOL = [
  {driver:'lg',  riders:['khj','jms'],        fallback:['jms'],
   label:'이건 차'},
  // 김인규·김한규는 차가 없다. 이민혁도 없어서 셋이 김준희 차를 얻어 탄다.
  // 김준희가 못 나오면 김상훈 → 김선호 순으로 대신 태운다.
  {driver:'kjh', riders:['kig','khg','lmh'],  fallback:['ksn','ksh'],
   label:'김준희 차'},
  {driver:'lsm', riders:[],                   fallback:[],
   label:'이승민 차', pickup:2000},
];
// 각자 알아서 오는 사람 (차가 있거나 알아서 오는 쪽)
const SOLO = ['swm','yjh','ujh','ksh','ksn'];

function resolveCarpool(ST){
  /* 불만으로 카풀을 거부한 운전자는 이번 주 태워주지 않는다 */
  /* 결장자를 고려해 실제 배차를 만든다.
     운전자가 빠지면 fallback 순으로 대체. 아무도 없으면 riders가 이동 곤란. */
  const out=[], stranded=[];
  const refused=id=>!!(ST.noCar&&ST.noCar[id]);
  CARPOOL.forEach(cp=>{
    const riders=cp.riders.filter(id=>isAvailable(id));
    let driver = (isAvailable(cp.driver)&&!refused(cp.driver)) ? cp.driver : null;
    let replaced=false;
    if(!driver){
      driver = (cp.fallback||[]).find(id=>isAvailable(id)&&!refused(id)) || null;
      replaced=!!driver;
    }
    if(driver){
      const list=riders.filter(id=>id!==driver);
      if(list.length)
        out.push({driver,riders:list,label:cp.label,replaced,origin:cp.driver});
    } else {
      riders.forEach(id=>{ if(!SOLO.includes(id)) stranded.push(id); });
    }
  });
  /* 이승민은 00년생을 태워준다 */
  const lsmOk=isAvailable('lsm');
  if(lsmOk&&stranded.length){
    const young=stranded.filter(id=>META[id]&&META[id].born>=2000);
    if(young.length){
      out.push({driver:'lsm',riders:young,label:'이승민 차',replaced:false,origin:'lsm'});
      young.forEach(id=>{ const i=stranded.indexOf(id); if(i>=0)stranded.splice(i,1); });
    }
  }
  return {rides:out, stranded};
}

/* ---------- 일정 (2~9월, 주말 경기) ---------- */
const HOLIDAYS = [
  {md:'03-01', name:'삼일절'},
  {md:'06-06', name:'현충일'},
  {md:'08-15', name:'광복절'},
  {md:'10-01', name:'국군의 날'},
];
/* 실제 사회인리그 일정은 매주 꼬박꼬박 잡히지 않는다.
   다음 주에 바로 붙기도 하고, 대관이 안 되면 3주씩 비기도 한다.
   2026 실제 기록도 2/22 → 3/29(5주) → 4/12(2주) → 4/26(2주) → 5/17(3주)
   식으로 간격이 제각각이었다. 그 리듬을 그대로 흉내낸다.
   연도만 넣으면 항상 같은 일정이 나오도록 연도 기반 시드를 쓴다.       */
function seasonDates(year){
  const out=[];
  const d=new Date(year,1,1);
  while(d.getDay()!==0) d.setDate(d.getDate()+1);   // 2월 첫 일요일
  const END=new Date(year,9,20);                    // 10월 하순이 한계
  const TARGET=24;                                  // 22경기 + 여유 2

  /* 22경기를 2~9월에 넣으려면 평균 간격이 1.5주쯤 된다.
     그래서 '기본 1주'로 깔고, 남는 여유 주를 시즌 전체에 무작위로
     흩뿌린다. 앞에서부터 채우면 앞부분이 전부 연전이 돼버린다.       */
  const rng=makeRng((year*7919+104729)>>>0);
  for(let i=0;i<12;i++)rng();                       // 초기값 편향 제거
  const totalWeeks=Math.floor((END-d)/(7*86400000));
  const gaps=new Array(TARGET-1).fill(1);
  let extra=Math.max(0, totalWeeks-(TARGET-1));
  let guard=0;
  while(extra>0 && guard++<600){
    const i=(rng()*gaps.length)|0;
    if(gaps[i]>=4) continue;                        // 한 번에 4주 이상은 안 쉰다
    // 연속으로 길게 비는 건 드물게
    if(gaps[i]>=2 && rng()<0.55) continue;
    gaps[i]++; extra--;
  }
  out.push(new Date(d));
  for(let i=0;i<gaps.length;i++){
    d.setDate(d.getDate()+7*gaps[i]);
    if(d>END) break;
    out.push(new Date(d));
  }

  /* 기념일 주말에는 경기가 잡히도록 가장 가까운 일정을 당겨 붙인다.
     김선우(장교)가 삼일절·현충일·광복절·국군의 날에 각성하는데,
     그 날 경기가 아예 없으면 이벤트가 죽어버린다.                    */
  HOLIDAYS.forEach(h=>{
    const pp=h.md.split('-');
    const hd=new Date(year, Number(pp[0])-1, Number(pp[1]));
    const sun=new Date(hd);                       // 기념일에 가장 가까운 일요일
    const off=sun.getDay();
    if(off<=3) sun.setDate(sun.getDate()-off); else sun.setDate(sun.getDate()+(7-off));
    if(sun<out[0]||sun>END) return;
    // 이미 그 주에 경기가 있으면 놔둔다
    if(out.some(x=>Math.abs(x-sun)<86400000)) return;
    // 없으면 ±14일 안의 가장 가까운 일정을 그 일요일로 옮긴다
    let bi=-1, bd=1e15;
    out.forEach((x,i)=>{ const dd=Math.abs(x-sun); if(dd<bd&&dd<=14*86400000){bd=dd;bi=i;} });
    if(bi>=0){ out[bi]=new Date(sun); out.sort((a,b)=>a-b); }
  });
  return out;
}
/* 직전 경기와의 간격을 사람이 읽는 문장으로 */
function gapLabel(round, year){
  const dates=seasonDates(year||2026);
  if(round<=0||!dates[round]||!dates[round-1]) return '개막전';
  const wk=Math.round((dates[round]-dates[round-1])/(7*86400000));
  return wk<=1?'지난주에 이어 바로':(wk===2?'2주 만에':(wk===3?'3주 만에':`${wk}주 만에`));
}
function holidayFor(round, year){
  const y=year||2026;
  const dates=seasonDates(y);
  const dt=dates[Math.min(round, dates.length-1)]||new Date(y,7,1);
  const md=String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  let hol=null;
  HOLIDAYS.forEach(function(h){
    const p=h.md.split('-');
    const hdate=new Date(y, Number(p[0])-1, Number(p[1]));
    if(Math.abs(hdate-dt)<=4*86400000) hol=h.name;
  });
  return {date:y+'-'+md, holiday:hol, month:dt.getMonth()+1,
    label:(dt.getMonth()+1)+'월 '+dt.getDate()+'일 (일)'};
}

  let tot=0; keys.forEach(function(k){tot+=tbl[k];});
  let r=rng()*tot;

    if(r<=0){ const w=WEATHERS.find(function(x){return x.id===keys[i];}); if(w) return w; }

/* ---------- 말투 ---------- */
function speechOf(pid){ const m=META[pid]; return m?m.speech:'jon'; }

/* 화자 → 청자 관계에 따른 말투 판정
   ---------------------------------------------------------
   1. 00년생끼리는 서로 반말
   2. 99년생(형) → 00년생은 반말
   3. 00년생 → 99년생(형)은 존댓말
   4. 예외: 김인규·김한규는 누구에게든 반말
   5. 김인규·김한규는 쌍둥이라 서로 '형'이라 하지 않고 그냥 반말
   BAN_TO_ALL 에 넣으면 그 선수는 전원에게 반말이 된다.               */
const BAN_TO_ALL = ['kig','khg'];
function speechTo(from, to){
  const A=META[from], B=META[to];
  if(!A||!B) return 'jon';
  if(BAN_TO_ALL.indexOf(from)>=0) return 'ban';           // 인규·한규는 모두에게 반말
  if(A.rival===to || B.rival===from) return 'ban';        // 쌍둥이끼리
  if(A.born === B.born) return 'ban';                     // 동갑
  if(A.born < B.born) return 'ban';                       // 손위 → 손아래
  return 'jon';                                           // 손아래 → 손위
}
/* 상대를 부르는 호칭. 쌍둥이는 서로 '형'이라 부르지 않는다. */
function callName(from, to){
  const nm=nameOf(to);
  if(!META[from]||!META[to]) return nm;
  if(META[from].rival===to) return nm;                    // 쌍둥이 → 이름만
  if(META[from].born > META[to].born) return nm.slice(-2)+'형';
  return nm;
}

/* =========================================================
   대사 다양성 엔진
   ---------------------------------------------------------
   게임 안에 LLM 을 넣을 수는 없다(단일 HTML · 오프라인).
   대신 조합으로 가짓수를 늘린다.
     본문 N개 × 앞머리 M개 × 꼬리 K개 = N×M×K 가지
   여기에 성격(과묵·불만러·코치·리더)별 꼬리를 따로 붙여서
   같은 상황이라도 사람마다 다르게 말하게 만든다.
   ========================================================= */

/* 균등 셔플. sort(()=>Math.random()-0.5) 는 균등하지 않아서
   앞쪽 원소가 계속 뽑힌다 — "매번 같은 사람만 대답한다"의 원인이었다. */
function shuffled_(arr, rng){
  const r=rng||Math.random, a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(r()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* 앞머리 / 꼬리 조각 */
const LEAD_BAN = ['','','','','ㅋㅋ ','아 ','음 ','그래 ','야 ','오 ','아니 ','와 ','일단 ','솔직히 ','뭐 ','근데 ','ㅇㅇ ','자 '];
const LEAD_JON = ['','','','','ㅋㅋ ','아 ','음... ','네 ','오 ','와 ','일단 ','솔직히 ','근데 ','넵 '];
const TAIL_BAN = ['','','','','',' ㅋㅋ',' ㅎㅎ','...',' 진짜',' ㅇㅇ',' ㅋㅋㅋ',' ㄹㅇ',' 뭐',' 하 ',' 그치',' ㅜㅜ'];
const TAIL_JON = ['','','','','',' ㅋㅋ',' ㅎㅎ','...',' 진짜요',' ㅋㅋㅋ',' 그쵸',' ㅜㅜ',' 넵'];
/* 성격별 전용 꼬리 — 사람마다 말버릇이 다르게 보이도록 */
const TAIL_TRAIT = {
  '불만러': ['',' 아닌가',' 데이터상으로는',' 뭐 그렇다고',' 내 말이 틀렸냐',' 알아서 해라'],
  '과묵':   ['','','','','...',' ㅇㅇ'],
  '코치':   ['',' 기본이 중요하다',' 연습하면 된다',' 자세부터 보자',' 반복이 답이다'],
  '리더':   ['',' 가자',' 하자고',' 뭉치자',' 할 수 있다'],
  '분석가': ['',' 숫자로 보면 그렇다',' 기록에 다 나와 있다',' 표본이 적긴 하다'],
  '노력파': ['',' 더 하겠다',' 연습할게',' 다음엔 다르다'],
  '성실':   ['',' 나는 나온다',' 빠질 생각 없다'],
  '에이스': ['',' 내가 막는다',' 뒤는 맡겨라'],
  '안방마님':['',' 내가 앉는다',' 장비는 챙겼다'],
  '주루형': ['',' 뛰면 된다',' 다리는 안 죽는다'],
  '장타형': ['',' 하나 넘긴다',' 크게 치면 된다'],
  '유리몸': ['',' 몸만 버텨주면',' 조심해서 하겠다'],
  '철강':   ['',' 나는 멀쩡하다'],
  '금주':   ['',' 나는 물 마신다'],
  '농구':   ['',' 몸은 풀려 있다'],
};

/* 한 줄을 조합해서 만든다.
   pid=화자, to=청자(말투 판정), pool=[반말배열, 존댓말배열]            */
function line(pid, to, banPool, jonPool, rng){
  const r=rng||Math.random;
  const jon = to ? (speechTo(pid,to)==='jon') : (speechOf(pid)!=='ban');
  const body = pickOne(jon?jonPool:banPool, r);
  if(!body) return '';
  // 이미 꾸며진 문장(괄호 지문 등)은 그대로 둔다
  if(body.charAt(0)==='(') return body;
  const m=META[pid];
  let tailPool = jon?TAIL_JON:TAIL_BAN;
  if(m&&m.traits){
    const t=m.traits.find(x=>TAIL_TRAIT[x]);
    if(t && r()<0.45) tailPool = TAIL_TRAIT[t];
  }
  const lead = r()<0.55 ? pickOne(jon?LEAD_JON:LEAD_BAN, r) : '';
  const tail = r()<0.55 ? pickOne(tailPool, r) : '';
  return (lead+body+tail).trim();
}

/* 여러 명이 반응할 때 쓸 화자 목록.
   최근에 말한 사람은 뒤로 밀어서 같은 사람이 연속으로 나오지 않게 한다. */
function speakers(ST, exclude, n, rng){
  const us=TBYID['wwzw'];
  const recent=ST._recentSpeakers||[];
  let cands=us.players.filter(p=>p.id!==exclude&&isAvailable(p.id)&&!isMerc(p.id));
  if(!cands.length)return [];
  const fresh=shuffled_(cands.filter(p=>recent.indexOf(p.id)<0), rng);
  const used =shuffled_(cands.filter(p=>recent.indexOf(p.id)>=0), rng);
  const out=fresh.concat(used).slice(0,n);
  ST._recentSpeakers=out.map(p=>p.id).concat(recent).slice(0,6);
  return out;
}

/* 단톡방 기본 말투 (불특정 다수 대상) */
function say(pid, ban, jon){ return speechOf(pid)==='ban'?ban:jon; }

/* 특정 상대를 향한 말투 */
function sayTo(from, to, ban, jon){ return speechTo(from,to)==='ban'?ban:jon; }

/* ---------- 부상 ---------- */
const INJURIES=[
  {name:'햄스트링 근육통',min:1,max:2,sev:1},
  {name:'손목 염좌',min:1,max:3,sev:1},
  {name:'발목 접질림',min:2,max:4,sev:2},
  {name:'어깨 통증',min:2,max:5,sev:2},
  {name:'무릎 통증',min:3,max:6,sev:3},
  {name:'허리 담',min:1,max:2,sev:1},
  {name:'파울팁 타박상',min:1,max:1,sev:1},
];
function rollInjury(pid,roll){
  const m=META[pid];
  let idx=(roll*INJURIES.length)|0;
  if(m&&m.traits.includes('철강'))idx=Math.min(idx,1);
  if(m&&m.traits.includes('안방마님'))idx=Math.min(idx,2);
  if(m&&m.traits.includes('유리몸'))idx=Math.min(INJURIES.length-1,idx+2);
  const t=INJURIES[Math.max(0,Math.min(INJURIES.length-1,idx))];
  const games=t.min+(((roll*97)%(t.max-t.min+1))|0);
  return {name:t.name,games:Math.max(1,games),sev:t.sev};
}

<script>
/* =========================================================
   통산 기록 · 마일스톤 시스템
   ========================================================= */
'use strict';

/* 추적 항목 */
const MILESTONE_KEYS = [
  {k:'h',   label:'안타',   marks:[1,10,25,50,100,200]},
  {k:'d2',  label:'2루타',  marks:[1,5,10,25,50]},
  {k:'d3',  label:'3루타',  marks:[1,3,5,10]},
  {k:'hr',  label:'홈런',   marks:[1,3,5,10,20]},
  {k:'rbi', label:'타점',   marks:[1,10,25,50,100]},
  {k:'r',   label:'득점',   marks:[1,10,25,50,100]},
  {k:'sb',  label:'도루',   marks:[1,10,25,50,100]},
  {k:'bb',  label:'볼넷',   marks:[1,10,25,50]},
  {k:'k',   label:'삼진',   marks:[1,25,50,100]},
];
const PIT_MILESTONES = [
  {k:'k',    label:'탈삼진', marks:[1,10,25,50,100]},
  {k:'w',    label:'승',     marks:[1,3,5,10]},
  {k:'outs', label:'이닝',   marks:[3,30,60,150,300], div:3},
];
const TEAM_MILESTONES = [
  {k:'h',label:'팀 안타',marks:[1,50,100,200,500]},
  {k:'hr',label:'팀 홈런',marks:[1,5,10,25]},
  {k:'r',label:'팀 득점',marks:[1,50,100,300,500]},
  {k:'w',label:'팀 승리',marks:[1,5,10,25,50]},
  {k:'dp',label:'팀 병살',marks:[1,5,10,25]},
];

function blankCareer(){
  return {g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0,
    pg:0,pw:0,pl:0,pouts:0,ph:0,per:0,pbb:0,pk:0};
}
function blankTeamCareer(){
  return {g:0,w:0,l:0,t:0,h:0,d2:0,d3:0,hr:0,r:0,rbi:0,sb:0,bb:0,k:0,dp:0,seasons:0};
}

/* 마일스톤 판정 — 누적 전/후를 비교 */
function checkMilestones(ST, pid, before, after, ctx){
  const hits=[];
  const nm=nameOf(pid);
  MILESTONE_KEYS.forEach(({k,label,marks})=>{
    marks.forEach(m=>{
      if(before[k]<m && after[k]>=m){
        hits.push({scope:'player',pid,text:`${nm} 통산 ${m}${label==='삼진'?'번째 삼진':`호 ${label}`}`,
          label,mark:m,date:ctx.date});
      }
    });
  });
  return hits;
}
function checkPitMilestones(ST, pid, before, after, ctx){
  const hits=[];
  const nm=nameOf(pid);
  PIT_MILESTONES.forEach(({k,label,marks,div})=>{
    const bk = k==='outs'?'pouts':(k==='k'?'pk':(k==='w'?'pw':k));
    marks.forEach(m=>{
      if(before[bk]<m && after[bk]>=m){
        const val = div? (m/div) : m;
        hits.push({scope:'player',pid,text:`${nm} 통산 ${val}${label}`,label,mark:m,date:ctx.date});
      }
    });
  });
  return hits;
}
function checkTeamMilestones(ST, before, after, ctx){
  const hits=[];
  TEAM_MILESTONES.forEach(({k,label,marks})=>{
    marks.forEach(m=>{
      if(before[k]<m && after[k]>=m){
        hits.push({scope:'team',text:`구단 ${m}호 ${label.replace('팀 ','')}`,label,mark:m,date:ctx.date});
      }
    });
  });
  return hits;
}

/* 경기 결과를 통산에 반영 + 마일스톤 수집 */
function accrueCareer(ST, res, uSlots, won, tie, dpCount){
  const out=[];
  const date=`${ST.year||2026}-${String(ST.round+1).padStart(2,'0')}`;
  if(!ST.career)ST.career={};
  if(!ST.teamCareer)ST.teamCareer=blankTeamCareer();

  const tBefore={...ST.teamCareer};

  uSlots.forEach(s=>{
    const b=res.box[s.id]; if(!b)return;
    if(!ST.career[s.id])ST.career[s.id]=blankCareer();
    const c=ST.career[s.id];
    const before={...c};
    c.g++;
    ['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>c[k]+=b[k]||0);
    out.push(...checkMilestones(ST,s.id,before,c,{date}));
    ST.teamCareer.h+=b.h||0; ST.teamCareer.d2+=b.d2||0; ST.teamCareer.d3+=b.d3||0;
    ST.teamCareer.hr+=b.hr||0; ST.teamCareer.r+=b.r||0; ST.teamCareer.rbi+=b.rbi||0;
    ST.teamCareer.sb+=b.sb||0; ST.teamCareer.bb+=b.bb||0; ST.teamCareer.k+=b.k||0;
  });

  const gRot=(ST.gameRotation&&ST.gameRotation.length)?ST.gameRotation:ST.rotation;
  gRot.forEach(pid=>{
    const l=res.pbox[pid]; if(!l||!l.bf)return;
    if(!ST.career[pid])ST.career[pid]=blankCareer();
    const c=ST.career[pid];
    const before={...c};
    c.pg++; c.pouts+=l.outs; c.ph+=l.h; c.per+=l.er; c.pbb+=l.bb; c.pk+=l.k;
    if(res.wp===pid)c.pw++; if(res.lp===pid)c.pl++;
    out.push(...checkPitMilestones(ST,pid,before,c,{date}));
  });

  ST.teamCareer.g++; ST.teamCareer.dp+=dpCount||0;
  if(tie)ST.teamCareer.t++; else if(won)ST.teamCareer.w++; else ST.teamCareer.l++;
  out.push(...checkTeamMilestones(ST,tBefore,ST.teamCareer,{date}));

  /* 1호 기록 (구단 최초) */
  if(!ST.firsts)ST.firsts={};
  const firstDefs=[
    ['1호안타', s=>(res.box[s]||{}).h>0],
    ['1호2루타', s=>(res.box[s]||{}).d2>0],
    ['1호3루타', s=>(res.box[s]||{}).d3>0],
    ['1호홈런', s=>(res.box[s]||{}).hr>0],
    ['1호도루', s=>(res.box[s]||{}).sb>0],
    ['1호타점', s=>(res.box[s]||{}).rbi>0],
    ['1호볼넷', s=>(res.box[s]||{}).bb>0],
  ];
  firstDefs.forEach(([key,fn])=>{
    if(ST.firsts[key])return;
    const who=uSlots.map(s=>s.id).find(fn);
    if(who){ ST.firsts[key]={player:nameOf(who),date,game:ST.teamCareer.g};
      out.push({scope:'first',text:`구단 ${key} — ${nameOf(who)}`,date}); }
  });

  if(!ST.milestones)ST.milestones=[];
  out.forEach(m=>ST.milestones.push(m));
  if(ST.milestones.length>240)ST.milestones=ST.milestones.slice(-240);
  return out;
}

/* 병살 시너지 */
const DP_SYNERGY = [
  {pair:['ksh','khj'],name:'김선호-권혁준',label:'키스톤 시너지',bonus:0.012,
   note:'리틀 출신 지도를 받은 조합. 병살 확률 상승'},
  {pair:['ksh','ksw'],name:'김선호-김선우',label:'키스톤 시너지',bonus:0.010,
   note:'송구 안정성이 좋은 유격과의 조합'},
  {pair:['khg','ksn'],name:'김한규-김상훈',label:'코너내야 시너지',bonus:0.008,
   note:'3루-1루 코너 조합'},
];
function dpBonus(slots){
  let b=0, hit=null;
  DP_SYNERGY.forEach(s=>{
    const has = s.pair.every(id=>slots.some(x=>x.id===id));
    if(has && !hit){ b=s.bonus; hit=s; }
  });
  return {bonus:b, syn:hit};
}
