<script>
/* =========================================================
   LiveGame — 이닝 단위로 진행되며 판단 지점에서 멈춘다
   ========================================================= */
'use strict';

function newBoxL(){return {pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}
function newPitL(){return {outs:0,h:0,r:0,er:0,bb:0,k:0,hbp:0,sbA:0,bf:0};}

function LiveGame(cfg){
  this.INN = cfg.innings || 7;
  this.rng = cfg.rng;
  this.userIsHome = cfg.userIsHome;
  this.log = [];
  this.box = {}; this.pbox = {};
  this.injuries = [];
  this.over = false; this.mercy = false;
  this.inning = 1; this.half = 0;
  this.outs = 0; this.bases = [null,null,null];
  this.pending = null;
  this.usedPH = {};       // 대타 사용 기록
  this.park = cfg.park || {hr:1,d2:1,d3:1,err:1,babip:1};
  this.gearPenalty = cfg.gearPenalty||0;
  this.buff = cfg.buff||{};
  this.dpCount=0; this.assists=0; this.wp=0;
  this.hot = !!cfg.hot;
  this.timeouts = 5;      // 작전 지시 가능 횟수

  const mk = (team, slots, rot, tac, cond, isUser) => {
    const s = {team, slots: slots.map(x=>({...x})), rot: rot.slice(), tac:{...tac}, cond:cond||{},
      isUser, order:0, pIdx:0, runs:0, hits:0, errs:0, bbs:0, sbAllowed:0, line:[]};
    const c = s.slots.find(x=>x.pos==='C');
    const cp = c ? team.players.find(p=>p.id===c.id) : null;
    s.cArm = (cp ? cp.arm : 45) - (isUser?(cfg.gearPenalty||0):0);
    s.slots.forEach(sl=>{ this.box[sl.id]=this.box[sl.id]||newBoxL(); });
    s.rot.forEach(pid=>{ this.pbox[pid]=this.pbox[pid]||newPitL(); });
    return s;
  };
  this.away = mk(cfg.away, cfg.awayLineup, cfg.awayRotation, cfg.awayTactics, cfg.awayCond, !cfg.userIsHome);
  this.home = mk(cfg.home, cfg.homeLineup, cfg.homeRotation, cfg.homeTactics, cfg.homeCond, cfg.userIsHome);
  this.sides = [this.away, this.home];
  this.log.push({t:'inning', inning:1, half:0, text:`1회 초 · ${this.away.team.name} 공격`});
  this.startedInning = true;
  this.checkPitcherChange(this.home);
}

LiveGame.prototype.off = function(){ return this.sides[this.half]; };
LiveGame.prototype.def = function(){ return this.sides[1-this.half]; };
LiveGame.prototype.userSide = function(){ return this.userIsHome ? this.home : this.away; };
LiveGame.prototype.oppSide = function(){ return this.userIsHome ? this.away : this.home; };
LiveGame.prototype.curPitcher = function(s){
  const pid = s.rot[Math.min(s.pIdx, s.rot.length-1)];
  const p = s.team.pitchers.find(x=>x.id===pid) || s.team.pitchers[0];
  if(!p) return p;
  const mm = (typeof META!=='undefined') ? META[p.id] : null;
  if(s.isUser && mm && mm.traits.includes('더위약함') && this.hot){
    const outs = (this.pbox[p.id]||{}).outs||0;
    if(outs > 6) return {...p, stf: Math.round(p.stf*0.62), ctl: Math.round(p.ctl*0.78)};
  }
  return p;
};
LiveGame.prototype.batter = function(){
  const s=this.off(); const slot=s.slots[s.order%9];
  return s.team.players.find(p=>p.id===slot.id);
};

LiveGame.prototype.checkPitcherChange = function(s){
  const p=this.curPitcher(s), l=this.pbox[p.id];
  const hk=s.tac.hook||'normal';
  const mul = hk==='quick'?0.72:(hk==='long'?1.30:1);
  const lim=Math.round((6+(p.sta-28)*0.40)*mul);
  const bbLim = hk==='quick'?4:(hk==='long'?9:7);
  const rLim  = hk==='quick'?5:(hk==='long'?12:9);
  if((l.outs>=lim||l.bb+l.hbp>=bbLim||l.r>=rLim) && s.pIdx<s.rot.length-1){
    if(s.isUser){
      // 유저 팀이면 교체 여부를 물어본다
      this.pending={kind:'pitcherChange', side:s, from:p.name, to:this.curPitcherNext(s)};
      return true;
    }
    s.pIdx++;
    this.log.push({t:'sub',text:`투수 교체 · ${s.team.name}: ${p.name} → ${this.curPitcher(s).name}`});
  }
  return false;
};
LiveGame.prototype.curPitcherNext = function(s){
  const pid=s.rot[Math.min(s.pIdx+1,s.rot.length-1)];
  const p=s.team.pitchers.find(x=>x.id===pid);
  return p?p.name:'—';
};

/* 판단 지점 탐지 */
LiveGame.prototype.detectDecision = function(){
  if(this.pending) return this.pending;
  const off=this.off();
  if(!off.isUser) return null;
  if(this.timeouts<=0) return null;

  const us=this.userIsHome?this.home:this.away;
  const th=this.userIsHome?this.away:this.home;
  const diff = us.runs - th.runs;
  const risp = this.bases[1]||this.bases[2];
  const onBase = this.bases[0]||risp;
  const late = this.inning >= this.INN-2;
  const close = Math.abs(diff)<=4;

  // 득점권
  if(risp && this.outs<2){
    if(this.rng() < (close?0.55:0.30)) return {kind:'situation', label:'득점권 기회'};
  }
  // 주자 1루
  if(this.bases[0] && !this.bases[1] && this.outs<2){
    if(this.rng() < (late&&close?0.45:0.22)) return {kind:'situation', label:'주자 1루'};
  }
  // 후반 승부처
  if(late && close && this.outs<2){
    if(this.rng() < 0.25) return {kind:'situation', label:'승부처'};
  }
  // 이닝 선두타자
  if(!onBase && this.outs===0 && this.inning>=2){
    if(this.rng() < 0.14) return {kind:'situation', label:'이닝 선두타자'};
  }
  // 한 번도 안 썼으면 후반에 반드시 한 번
  if(this.timeouts===5 && this.inning>=this.INN-1 && this.outs<2){
    return {kind:'situation', label:'마지막 기회'};
  }
  return null;
};

/* 한 타석 진행 */
LiveGame.prototype.step = function(){
  if(this.over) return {done:true};
  if(this.pending) return {pending:this.pending};

  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  const bl=this.box[bat.id];
  const rng=this.rng;
  const events=[];

  // 도루
  if(this.bases[0] && !this.bases[1]){
    const rn=off.team.players.find(x=>x.id===this.bases[0]);
    if(rn){
      let runMul=1;
      if(off.tac.run==='aggressive')runMul=1.6;
      else if(off.tac.run==='hold')runMul=0.12;
      const att=clamp(LG.SB_PER_PA*5.64*off.team.tend.sb*runMul*Math.exp((rn.spd-46)*0.020),0,0.85);
      if(rng()<att){
        const su=clamp(LG.SB_SUCCESS+(rn.spd-50)*0.0030-(def.cArm-46)*0.0060,0.45,0.99);
        if(rng()<su){
          this.bases[1]=this.bases[0];this.bases[0]=null;
          this.box[rn.id].sb++;pl.sbA++;def.sbAllowed++;
          events.push({text:`${rn.name} 2루 도루 성공`,cls:'sb'});
        }else{
          this.bases[0]=null;this.outs++;this.box[rn.id].cs++;
          events.push({text:`${rn.name} 도루 실패`,cls:'out'});
          if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
        }
      }
    }
  }

  /* 폭투 — 주자가 있고 제구가 나쁠수록 */
  if((this.bases[0]||this.bases[1]||this.bases[2]) && rng() < clamp(0.009+(42-pit.ctl)*0.0009, 0.002, 0.038)){
    for(let b=2;b>=0;b--){
      if(!this.bases[b])continue;
      if(b===2){ this.box[this.bases[2]].r++; off.runs++; this.curIR++; pl.r++; pl.er++; this.bases[2]=null; }
      else { this.bases[b+1]=this.bases[b]; this.bases[b]=null; }
    }
    this.wp=(this.wp||0)+1;
    events.push({text:`${pit.name} 폭투`,cls:'err'});
  }

  pl.bf++; bl.pa++;
  const cond = off.cond[bat.id];
  let batE = bat;
  /* 포수부담 — 포수로 출전하면 타격이 떨어진다 */
  const mySlot = off.slots[(off.order)%9];
  const mm = (typeof META!=='undefined') ? META[bat.id] : null;
  if(off.isUser && mm && mm.traits.includes('포수부담') && mySlot && mySlot.pos==='C'){
    batE = {...batE, con: batE.con*0.86, pow: batE.pow*0.86};
  }
  const bf = off.isUser && this.buff ? this.buff[bat.id] : null;
  if(bf){
    batE = {...bat};
    if(bf.pow) batE.pow = Math.min(80, bat.pow*bf.pow);
    if(bf.spd) batE.spd = Math.min(80, bat.spd*bf.spd);
    if(bf.all){ batE.con=bat.con*bf.all; batE.pow=bat.pow*bf.all; batE.spd=bat.spd*bf.all; }
  }
  let pitE = pit;
  if(pit.heatFade && pl.outs>=6){
    const over=Math.min(12,pl.outs-6);
    pitE={...pit, stf:Math.max(14,pit.stf-8-over*1.6), ctl:Math.max(10,pit.ctl-5-over*1.1)};
  }
  const res = simPA(batE, pitE, off.team, def.team, rng, off.tac, cond, this.park);

  const score=(rid,e)=>{ if(!rid)return; this.box[rid].r++; off.runs++; this.curIR++; pl.r++; if(e)pl.er++; };
  const adv=(n,e)=>{ for(let b=2;b>=0;b--){ if(this.bases[b]){ const nb=b+n;
    if(nb>=3){score(this.bases[b],e);bl.rbi++;} else this.bases[nb]=this.bases[b]; this.bases[b]=null; } } };

  if(res.type==='K'){ bl.ab++;bl.k++;pl.k++;pl.outs++;this.outs++;
    events.push({text:`${bat.name} 삼진`,cls:'out'}); }
  else if(res.type==='BB'||res.type==='HBP'){
    const isBB=res.type==='BB';
    if(isBB){bl.bb++;pl.bb++;off.bbs++;}else{bl.hbp++;pl.hbp++;}
    if(this.bases[0]&&this.bases[1]&&this.bases[2]){score(this.bases[2],true);bl.rbi++;this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]){this.bases[1]=this.bases[0];}
    this.bases[0]=bat.id;
    events.push({text:`${bat.name} ${isBB?'볼넷':'몸에 맞는 공'}`,cls:'bb'});
  }
  else if(res.type==='E'){ bl.ab++;def.errs++;adv(1,false);this.bases[0]=bat.id;
    events.push({text:`${bat.name} 상대 실책 출루`,cls:'err'}); }
  else if(res.type==='OUT'){
    bl.ab++;pl.outs++;this.outs++;
    const dpB = def.isUser ? (typeof dpBonus==='function'?dpBonus(def.slots).bonus:0) : 0;
    if(res.gb&&this.bases[0]&&this.outs<3&&rng()<(0.030+dpB)){this.bases[0]=null;pl.outs++;this.outs++;
      this.dpCount=(this.dpCount||0)+1;
      events.push({text:`${bat.name} 병살타`,cls:'out'});}
    else if(this.bases[2]&&this.outs<3&&!res.gb&&rng()<0.30){
      // 홈보살 특성 보유 외야수가 있으면 잡아낸다
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(of && rng()<0.14){
        this.bases[2]=null; pl.outs++; this.outs++;
        events.push({text:`${bat.name} 뜬공 — ${of.name} 홈 보살! 주자 아웃`,cls:'sb'});
        this.assists=(this.assists||0)+1;
        this.assistBy=of.id;
      } else {
        score(this.bases[2],true);bl.rbi++;this.bases[2]=null;
        events.push({text:`${bat.name} 희생플라이 · 1점`,cls:'score'});
      }
    }
    else events.push({text:`${bat.name} ${res.gb?'땅볼':'뜬공'} 아웃`,cls:'out'});
  }
  else{
    bl.ab++;bl.h++;pl.h++;off.hits++;
    if(res.type==='1B'){
      // 3루 주자 홈 쇄도 — 홈보살 특성 판정
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(this.bases[2]&&of&&this.outs<2&&rng()<0.10){
        const r3=this.bases[2]; this.bases[2]=null;
        this.box[r3]&&(this.box[r3].cs=this.box[r3].cs);
        pl.outs++; this.outs++;
        this.assists=(this.assists||0)+1; this.assistBy=of.id;
        events.push({text:`${bat.name} 안타 — ${of.name} 홈 보살! 3루 주자 아웃`,cls:'sb'});
        if(this.outs<3){ adv(rng()<0.35?2:1,true); this.bases[0]=bat.id; }
      } else {
        adv(rng()<0.35?2:1,true);this.bases[0]=bat.id;
        events.push({text:`${bat.name} 안타`,cls:'hit'});
      }
    }
    else if(res.type==='2B'){bl.d2++;adv(2,true);this.bases[1]=bat.id;
      events.push({text:`${bat.name} 2루타`,cls:'hit'});}
    else if(res.type==='3B'){bl.d3++;adv(3,true);this.bases[2]=bat.id;
      events.push({text:`${bat.name} 3루타`,cls:'hit'});}
    else{bl.hr++;let c=1;for(let b=0;b<3;b++)if(this.bases[b]){score(this.bases[b],true);c++;this.bases[b]=null;}
      score(bat.id,true);bl.rbi+=c;
      events.push({text:`${bat.name} 홈런! ${c}점`,cls:'hr'});}
  }

  off.order++;
  events.forEach(e=>this.log.push({t:'play',...e}));

  // 끝내기
  if(this.half===1 && this.inning>=this.INN && this.home.runs>this.away.runs){
    this.finish(); return {events, done:true};
  }
  if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
  return {events};
};

LiveGame.prototype.endHalf = function(){
  const off=this.off();
  off.line.push(this.curIR||0);
  this.curIR=0;
  this.outs=0; this.bases=[null,null,null];

  if(this.half===0){
    this.half=1;
    // 홈팀 리드 중 마지막 이닝 말 스킵
    if(this.inning>=this.INN && this.home.runs>this.away.runs){ this.home.line.push(null); this.finish(); return; }
    this.log.push({t:'inning',inning:this.inning,half:1,
      text:`${this.inning}회 말${this.inning>this.INN?' (연장)':''} · ${this.home.team.name} 공격`});
    this.checkPitcherChange(this.away);
  } else {
    // 이닝 종료
    const diff=Math.abs(this.away.runs-this.home.runs);
    if((this.inning>=4&&diff>=10)||(this.inning>=6&&diff>=7)){ this.mercy=true; this.finish(); return; }
    if(this.inning>=this.INN && this.away.runs!==this.home.runs){ this.finish(); return; }
    if(this.inning>=this.INN+3){ this.finish(); return; }
    this.inning++; this.half=0;
    this.log.push({t:'inning',inning:this.inning,half:0,
      text:`${this.inning}회 초${this.inning>this.INN?' (연장)':''} · ${this.away.team.name} 공격`});
    this.checkPitcherChange(this.home);
  }
};

LiveGame.prototype.finish = function(){
  if(this.over) return;
  this.over=true;
  // 부상 판정
  const us=this.userSide();
  if(this.rng()<0.085){
    const cands=us.slots.map(x=>us.team.players.find(p=>p.id===x.id)).filter(Boolean);
    const v=cands[(this.rng()*cands.length)|0];
    if(v) this.injuries.push({id:v.id, roll:this.rng()});
  }
  const tie=this.away.runs===this.home.runs;
  const awayWin=this.away.runs>this.home.runs;
  const win=awayWin?this.away:this.home, lose=awayWin?this.home:this.away;
  this.result={
    away:{team:this.away.team,runs:this.away.runs,hits:this.away.hits,errs:this.away.errs,bbs:this.away.bbs,sbAllowed:this.away.sbAllowed,line:this.away.line},
    home:{team:this.home.team,runs:this.home.runs,hits:this.home.hits,errs:this.home.errs,bbs:this.home.bbs,sbAllowed:this.home.sbAllowed,line:this.home.line},
    box:this.box, pbox:this.pbox, log:this.log, tie,
    winner:tie?null:(awayWin?this.away.team.id:this.home.team.id),
    wp:tie?null:win.rot[0],
    lp:tie?null:lose.rot[Math.min(lose.pIdx,lose.rot.length-1)],
    innings:this.inning, mercy:this.mercy, injuries:this.injuries,
    dpCount:this.dpCount||0, assists:this.assists||0, assistBy:this.assistBy||null, wp:this.wp||0,
  };
};

/* 전술 적용 */
LiveGame.prototype.pitcherOptions = function(){
  const s=this.userSide();
  return s.rot.slice(this.userSide().pIdx+1);
};
LiveGame.prototype.applyDecision = function(choice){
  const s=this.userSide();
  const p=this.pending;
  this.pending=null;
  if(p && p.kind==='pitcherChange'){
    if(choice==='change'){
      const old=this.curPitcher(p.side).name;
      p.side.pIdx++;
      this.log.push({t:'sub',text:`투수 교체 · ${old} → ${this.curPitcher(p.side).name}`});
    } else {
      this.log.push({t:'sub',text:`교체 없이 계속 간다`});
      p.side._stay=(p.side._stay||0)+1;
    }
    return;
  }
  this.timeouts--;
  if(choice==='bunt'){
    s.tac.bat='contact'; this._bunt=true;
    this.log.push({t:'sub',text:'작전: 번트 · 진루타 지시'});
  } else if(choice==='steal'){
    s.tac.run='aggressive';
    this.log.push({t:'sub',text:'작전: 적극 주루 지시'});
  } else if(choice==='patient'){
    s.tac.bat='patient';
    this.log.push({t:'sub',text:'작전: 공 많이 보기'});
  } else if(choice==='swing'){
    s.tac.bat='aggressive';
    this.log.push({t:'sub',text:'작전: 초구부터 적극 타격'});
  } else if(choice==='hold'){
    s.tac.run='hold';
    this.log.push({t:'sub',text:'작전: 주루 자제'});
  } else if(choice==='normal'){
    s.tac.bat='normal'; s.tac.run='normal';
    this.log.push({t:'sub',text:'작전: 지시 해제'});
  }
};

/* 수비 위치 변경 */
LiveGame.prototype.swapPos = function(idxA, idxB){
  const s=this.userSide();
  const t=s.slots[idxA].pos; s.slots[idxA].pos=s.slots[idxB].pos; s.slots[idxB].pos=t;
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idxA)} ${POSNAMES[s.slots[idxA].pos]} / ${this.nameOfSlot(idxB)} ${POSNAMES[s.slots[idxB].pos]}`});
};
LiveGame.prototype.nameOfSlot = function(i){
  const s=this.userSide();
  const p=s.team.players.find(x=>x.id===s.slots[i].id);
  return p?p.name:'?';
};
LiveGame.prototype.movePos = function(idx, pos){
  const s=this.userSide();
  const other=s.slots.findIndex((x,i)=>i!==idx&&x.pos===pos);
  if(other>=0) s.slots[other].pos=s.slots[idx].pos;
  s.slots[idx].pos=pos;
  this.recalcDef();
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idx)} → ${POSNAMES[pos]}`});
};
LiveGame.prototype.recalcDef = function(){
  const s=this.userSide();
  const c=s.slots.find(x=>x.pos==='C');
  const cp=c?s.team.players.find(p=>p.id===c.id):null;
  s.cArm=(cp?cp.arm:45)-this.gearPenalty;
  if(typeof recalcTeamDefense==='function') recalcTeamDefense(s.team, s.slots, this.gearPenalty);
};

/* 대타 */
LiveGame.prototype.pinchHit = function(newId){
  const s=this.userSide();
  const idx=s.order%9;
  const oldId=s.slots[idx].id;
  const oldP=s.team.players.find(p=>p.id===oldId);
  const newP=s.team.players.find(p=>p.id===newId);
  s.slots[idx].id=newId;
  this.box[newId]=this.box[newId]||newBoxL();
  this.usedPH[oldId]=true;
  this.pending=null;
  this.log.push({t:'sub',text:`대타 · ${oldP.name} → ${newP.name}`});
};

</script>
<script>
/* =========================================================
   우완좌완 야구 매니저 v2 — UI
   ========================================================= */
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const POSNAMES = {C:'포수','1B':'1루','2B':'2루','3B':'3루',SS:'유격',LF:'좌익',CF:'중견',RF:'우익',DH:'지타',P:'투수'};
const ALLPOS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

let TEAMS=[], TBYID={}, ST=null, LIVE=null, playTimer=null, curView='home';
let MYID='ksh';

function avg(b){return b.ab?b.h/b.ab:0;}
function obp(b){return b.pa?(b.h+b.bb+b.hbp)/b.pa:0;}
function slg(b){const tb=b.h+b.d2+b.d3*2+b.hr*3;return b.ab?tb/b.ab:0;}
function ops(b){return obp(b)+slg(b);}
function fmt3(v){return v.toFixed(3).replace(/^0\./,'.');}
function era(p){return p.outs?(p.er*7)/(p.outs/3):0;}
function ipStr(p){return Math.floor(p.outs/3)+(p.outs%3?'.'+(p.outs%3):'');}
function blankBat(){return {g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}

function newSeason(){
  const seed=(Date.now()^(Math.random()*1e9))>>>0;
  const rng=makeRng(seed);
  const opps=TEAMS.filter(t=>t.id!=='wwzw').map(t=>t.id);
  for(let i=opps.length-1;i>0;i--){const j=(rng()*(i+1))|0;[opps[i],opps[j]]=[opps[j],opps[i]];}
  const schedule=opps.map((o,i)=>({round:i+1,opp:o,homeGame:i%2===0,played:false,result:null,park:PARKS[(i*7+3)%PARKS.length].id}));
  const stand={}; TEAMS.forEach(t=>stand[t.id]={w:0,l:0,t:0,rf:0,ra:0,g:0});
  const bat={},pit={},lgBat={},rest={};
  const us=TBYID['wwzw'];
  us.players.forEach(p=>bat[p.id]=blankBat());
  us.pitchers.forEach(p=>{pit[p.id]=blankPit();rest[p.id]=3;});
  TEAMS.forEach(t=>t.players.forEach(p=>lgBat[p.id]=blankBat()));
  const ps=initPlayerState();
  return {v:5,seed,round:0,schedule,stand,bat,pit,lgBat,rest,
    cond:ps.cond,morale:ps.morale,injury:ps.injury,ca:ps.ca,growth:ps.growth,
    lineup:null,rotation:null,

    budget:120,events:[],kakao:[],lastOrder:{},absent:{},weekDone:false,weekSeq:0,notices:[],injCount:0,
    trainFocus:'none',trainLog:[],seasonOver:false,mittMissing:false,scoutBlocked:false,
    fieldMod:{err:1,cond:0},signed:[],
    playerId:MYID, year:2026, seasonNo:1, discharged:false, justDischarged:false,
    useDH:true, park:'benamul', gearLevel:0, feud:null, pendingAbsent:{},
    unhappy:{}, career:{}, teamCareer:null, milestones:[], firsts:{}, weather:'clear',
    lastLineup:null, oppEvent:null, mystery:null, canParty:false, teamBuff:null,
    kakaoPost:[], partyDone:false, lastFreePass:0, awards:null,
    caStart:(function(){const o={};TBYID['wwzw'].players.forEach(p=>o[p.id]=calcCA(p));return o;})()};
}

function autoFixLineup(){
  if(!ST.lineup)return;
  const t=TBYID['wwzw'];
  const bad=ST.lineup.filter(s=>!isAvailable(s.id));
  if(!bad.length){ sanitizeRotation(); return; }
  const avail=t.players.filter(p=>isAvailable(p.id));
  if(avail.length>=9){
    const pool=avail.filter(p=>!ST.lineup.some(x=>x.id===p.id));
    bad.forEach(b=>{
      const i=ST.lineup.findIndex(x=>x.id===b.id);
      if(i<0)return;
      const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
      if(rep){ ST.lineup[i].id=rep.id; pool.splice(pool.indexOf(rep),1); }
    });
    // 포지션 적합도 재정리
    optimizePositions();
  }
  sanitizeRotation();
}

/* 라인업 인원 그대로 두고 포지션만 최적 배치 */
function optimizePositions(){
  const t=TBYID['wwzw'];
  const ids=ST.lineup.map(s=>s.id);
  const needP = !ST.useDH;
  const slots = needP ? ['P','C','1B','2B','3B','SS','LF','CF','RF']
                      : ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
  // 헝가리안 대신 탐욕: 적합도 높은 순으로 배정
  const pairs=[];
  ids.forEach(id=>slots.forEach(pos=>pairs.push({id,pos,v:pos==='DH'?30:posFit(id,pos)})));
  pairs.sort((a,b)=>b.v-a.v);
  const usedId=new Set(), usedPos=new Set(), assign={};
  pairs.forEach(p=>{
    if(p.v<=0)return;
    if(usedId.has(p.id)||usedPos.has(p.pos))return;
    assign[p.id]=p.pos; usedId.add(p.id); usedPos.add(p.pos);
  });
  // 남은 인원은 빈 자리에 강제 배치
  ids.forEach(id=>{
    if(assign[id])return;
    const free=slots.find(x=>!usedPos.has(x));
    if(free){assign[id]=free;usedPos.add(free);}
  });
  ST.lineup.forEach(s=>{ if(assign[s.id])s.pos=assign[s.id]; });
  syncStarter();
}

function recommendLineup(){
  const t=TBYID['wwzw'];
  const pool=t.players.filter(p=>isAvailable(p.id));
  const use=pool.length>=9?pool:t.players;
  const sc=p=>p.con*1.1+p.pow*0.9+p.eye*0.7+p.spd*0.5+(ST&&ST.cond?(ST.cond[p.id]-70)*0.25:0);
  const sorted=use.slice().sort((a,b)=>sc(b)-sc(a));
  const used=new Set(); const slots=[];
  const c=sorted.find(p=>p.pos.includes('C'));
  if(c){slots.push({id:c.id,pos:'C'});used.add('C');}
  for(const p of sorted){
    if(slots.length>=9)break;
    if(slots.some(s=>s.id===p.id))continue;
    const pos=p.pos.find(x=>x!=='P'&&!used.has(x))||ALLPOS.find(x=>!used.has(x));
    if(!pos)break; used.add(pos); slots.push({id:p.id,pos});
  }
  const byId=id=>t.players.find(p=>p.id===id);
  const pool2=slots.slice(); const order=[];
  const take=fn=>{let bi=0,bv=-1e9;pool2.forEach((s,i)=>{const v=fn(byId(s.id));if(v>bv){bv=v;bi=i;}});return pool2.splice(bi,1)[0];};
  order.push(take(p=>p.con*1.2+p.spd*1.4));
  order.push(take(p=>p.con*1.3+p.spd*1.0));
  order.push(take(p=>p.con*1.0+p.pow*1.2));
  order.push(take(p=>p.pow*1.6));
  order.push(take(p=>p.pow*1.2+p.con*0.7));
  while(pool2.length) order.push(take(p=>p.con+p.pow+p.eye*0.5));
  return order;
}
function buildPitcherPool(){
  // 사회인야구는 누구나 던진다. 포지션 등급 P를 기준으로 구위/제구/체력 산출
  const t=TBYID['wwzw'];
  t.pitchers = t.players.map(p=>{
    const m=META[p.id];
    const pf = m&&m.pos ? (m.pos['P']||25) : 25;
    if(p.pitch) return {id:p.id,name:p.name,stf:p.pitch.stf,ctl:p.pitch.ctl,sta:p.pitch.sta};
    return {id:p.id,name:p.name,
      stf:Math.round(clamp(pf*0.55+p.arm*0.45,18,75)),
      ctl:Math.round(clamp(pf*0.75+p.eye*0.25-8,15,70)),
      sta:Math.round(clamp(pf*0.6+22,22,62))};
  });
  return t.pitchers;
}
function recommendRotation(){
  const t=TBYID['wwzw'];
  buildPitcherPool();
  return t.pitchers.slice()
    .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
    .slice(0,6).map(p=>p.id);
}
function recalcTeamDefense(team, slots, gearPenalty){
  if(!team.isUser) return;
  let sum=0;
  slots.forEach(sl=>{
    const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const m=META[sl.id];
    const fit=posFit(sl.id, sl.pos);
    let penalty = fit<=0 ? 22 : Math.max(0,(45-fit)*0.55);
    if(m){
      /* 좁은 범위 — 내야에서 특히 손해 */
      if(m.traits.includes('좁은범위')&&['2B','3B','SS'].includes(sl.pos)) penalty+=9;
      /* 외야 미숙 */
      if(m.traits.includes('외야미숙')&&['LF','CF','RF'].includes(sl.pos)) penalty+=8;
    }
    sum += Math.max(15, p.def - penalty);
  });
  team._slotDef = sum/Math.max(1,slots.length);
  team._errMod = 1 + Math.max(0,(46-team._slotDef))*0.020 + (gearPenalty?0.05:0);
}

function aiLineup(team){
  const s=team.players.slice().sort((a,b)=>(b.con+b.pow+b.eye+b.spd*0.4)-(a.con+a.pow+a.eye+a.spd*0.4));
  const u=new Set(),o=[];
  for(const p of s){if(o.length>=9)break;const pos=p.pos.find(x=>!u.has(x))||ALLPOS.find(x=>!u.has(x));if(!pos)break;u.add(pos);o.push({id:p.id,pos});}
  // AI도 수비 배치에 따른 손실을 반영 (우리만 최적화 이득 보지 않게)
  let sum=0;
  o.forEach(sl=>{ const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const fit=(p.pos&&p.pos.indexOf(sl.pos)>=0)?50:32;
    sum+=Math.max(15,p.def-Math.max(0,(45-fit)*0.55)); });
  team._slotDef=sum/Math.max(1,o.length);
  return o;
}
function aiRotation(t){return t.pitchers.slice().sort((a,b)=>(b.stf+b.ctl+b.sta)-(a.stf+a.ctl+a.sta)).map(p=>p.id);}

/* ---------- 주간 ---------- */
function runWeek(){
  if(!ST.notices)ST.notices=[];
  ST.events=[];
  ST.weekSeq=(ST.weekSeq||0)+1;
  const rng=makeRng((ST.seed+ST.round*31337+ST.weekSeq*7717)>>>0);
  Object.keys(ST.injury).forEach(pid=>{
    const inj=ST.injury[pid]; if(!inj)return;
    inj.games--;
    if(inj.games<=0){ST.injury[pid]=null;
      ST.notices.push({type:'recover',title:`${nameOf(pid)} 복귀`,body:`${inj.name}에서 회복했다.`,effect:'출전 가능'});}
  });
  TBYID['wwzw'].players.forEach(p=>{
    const m=META[p.id];
    const rec=(m&&m.traits.includes('성실'))?11:7;
    ST.cond[p.id]=Math.min(100,ST.cond[p.id]+rec+((rng()*7)|0)-3);
    ST.morale[p.id]=Math.max(10,Math.min(100,ST.morale[p.id]+(ST.morale[p.id]<70?2:-1)));
  });
  ST.mittMissing=false; ST.scoutBlocked=false;
  // 지난 경기 갈등으로 예고된 결장 반영
  const pend=ST.pendingAbsent||{};
  const evs=rollWeekEvents(ST,rng);
  if(evs.some(e=>e.type==='discharge')) ST.justDischarged=true;
  ST.gameDate=(ST.calendar&&ST.calendar.label)||'';
  Object.keys(pend).forEach(id=>{
    if(ST.injury[id])return;
    evs.push({type:'absent',pid:id,title:`${nameOf(id)} 결장`,
      body:`${nameOf(id)}이(가) ${pend[id]} 안 나온다고 한다.`,effect:'이번 경기 출전 불가'});
  });
  ST.pendingAbsent={};
  const carried=(ST.notices||[]).slice();
  ST.notices=[];
  ST.events=carried.concat(evs);
  const rained=applyWeekEvents(ST,evs);
  // 결장자가 라인업에 있으면 자동 교체
  autoFixLineup();
  ST.kakao=[]; ST.kakaoPost=[]; ST.partyDone=false; ST.weekDone=true;
  ST.sentPre=false; ST.sentPost=false; ST.teamBuff=null; ST.canParty=false; ST.dropouts=[];
  const anId=TBYID['wwzw'].players.find(p=>META[p.id]&&META[p.id].traits.includes('분석가'));
  const anUn=anId?((ST.unhappy&&ST.unhappy[anId.id])?ST.unhappy[anId.id].level:0):9;
  ST.oppEvent = (anId&&isAvailable(anId.id)&&anUn<3&&!ST.scoutBlocked)
    ? rollOppEvent(ST,rng,TBYID[ST.schedule[ST.round].opp]) : null;
  ST.park=(ST.schedule[ST.round]||{}).park||'benamul';
  return rained;
}

function forfeit(){
  const sch=ST.schedule[ST.round];
  sch.played=true; sch.result={us:0,them:7};
  const u=ST.stand['wwzw'], t=ST.stand[sch.opp];
  u.g++;t.g++;u.l++;t.w++;u.ra+=7;t.rf+=7;
  TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-10));
  simOtherGames(sch.opp);
  ST.round++;ST.weekDone=false;ST.events=[];
  if(ST.round>=ST.schedule.length)ST.seasonOver=true;
  saveGame(true);go('home');toast('몰수패');
}

function scoutLine(opp){
  const b=[];
  if(opp.tend.pow>=1.2)b.push('장타력 상위');
  if(opp.tend.sb>=1.3)b.push('도루 극단적');
  else if(opp.tend.sb<=0.7)b.push('거의 안 뜀');
  if(opp.tend.bb>=1.2)b.push('볼넷 잘 골라냄');
  if(opp.tend.k<=0.7)b.push('삼진 안 당함');
  else if(opp.tend.k>=1.25)b.push('삼진 많음');
  if(opp.tend.err>=1.15)b.push('수비 불안');
  const a=opp.pitchers[0];
  b.push(`선발 ${a.name} (구위 ${a.stf}/제구 ${a.ctl})`);
  return b.join(' · ');
}
function leagueRank(id){
  const a=TEAMS.slice().sort((x,y)=>{
    const A=ST.stand[x.id],B=ST.stand[y.id];
    const pa=A.g?A.w/A.g:0,pb=B.g?B.w/B.g:0;
    if(pb!==pa)return pb-pa; return (B.rf-B.ra)-(A.rf-A.ra);
  });
  return a.findIndex(t=>t.id===id)+1;
}

      <div class="pc-traits">${m.traits.filter(t=>!['카풀','형제','좌투','금주'].includes(t)).map(t=>`<span class="trait">${t}</span>`).join('')}</div>
      <div class="pc-bars">

        <div><span>사기</span><div class="mini"><i class="${(ST.morale[p.id]||70)>=70?'ok':(ST.morale[p.id]||70)>=50?'mid':'bad'}" style="width:${ST.morale[p.id]||70}%"></i></div><b>${moraleLabel(ST.morale[p.id]||70)}</b></div>

      <div class="pc-stat">${b.pa?`${b.g}경기 ${fmt3(avg(b))} · OPS ${ops(b).toFixed(3)} · ${b.hr}홈런 ${b.rbi}타점 ${b.sb}도루`:'출전 기록 없음'}</div>

function syncStarter(){
  // 라인업에 투수 자리가 있으면 선발 투수를 자동으로 그 자리에 넣는다
  const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
  if(pIdx<0)return;
  const sp=ST.rotation[0];
  if(ST.lineup[pIdx].id===sp)return;
  const dup=ST.lineup.findIndex(s=>s.id===sp);
  if(dup>=0&&dup!==pIdx){
    const tmp=ST.lineup[pIdx].id;
    ST.lineup[pIdx].id=sp;
    ST.lineup[dup].id=tmp;
  } else {
    ST.lineup[pIdx].id=sp;
  }
}
function applyDHRule(){
  const t=TBYID['wwzw'];
  const sp=ST.rotation[0];
  const used=()=>ST.lineup.map(x=>x.pos);
  const freePos=(exclude)=>ALLPOS.concat(['P']).filter(x=>x!=='DH'&&!ST.lineup.some((s,i)=>i!==exclude&&s.pos===x));

  if(!ST.useDH){
    // 투수가 반드시 타순에 들어간다
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    const spIdx=ST.lineup.findIndex(s=>s.id===sp);
    if(spIdx>=0){
      // 이미 라인업에 있으면 그 자리를 P로
      if(pIdx>=0&&pIdx!==spIdx) ST.lineup[pIdx].pos=freePos(pIdx).find(x=>x!=='P')||'RF';
      ST.lineup[spIdx].pos='P';
    } else {
      // DH 자리를 투수로 교체, 없으면 마지막 타순
      let slot=ST.lineup.findIndex(s=>s.pos==='DH');
      if(slot<0) slot=8;
      ST.lineup[slot]={id:sp,pos:'P'};
    }
  } else {
    // DH 사용: P 포지션이 있으면 없앤다
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    if(pIdx>=0){
      const hasDH=ST.lineup.some(s=>s.pos==='DH');
      ST.lineup[pIdx].pos = hasDH ? (freePos(pIdx).find(x=>posFit(ST.lineup[pIdx].id,x)>0)||'RF') : 'DH';
    }
  }
  syncStarter();
  // DH 미사용인데 DH 슬롯이 남아 있으면 야수 자리로 전환
  if(!ST.useDH){
    ST.lineup.forEach((s,i)=>{
      if(s.pos!=='DH')return;
      const cand=ALLPOS.filter(x=>x!=='DH'&&!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos=cand.find(x=>posFit(s.id,x)>0)||cand[0]||'RF';
    });
  }
  // 포지션 중복 정리
  const seen={};
  ST.lineup.forEach((s,i)=>{
    if(seen[s.pos]){
      const cand=ALLPOS.concat(ST.useDH?[]:['P']).filter(x=>!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos = cand.find(x=>posFit(s.id,x)>0) || cand[0] || s.pos;
    }
    seen[s.pos]=true;
  });
}

function sanitizeRotation(){
  // 결장·부상자는 로테이션에서 제외한다
  const t=TBYID['wwzw'];
  let rot=(ST.rotation||[]).filter(id=>isAvailable(id)&&t.pitchers.some(p=>p.id===id));
  if(!rot.length){
    rot=t.pitchers.filter(p=>isAvailable(p.id))
      .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
      .slice(0,6).map(p=>p.id);
  }
  // 라인업에 투수 포지션이 있으면 그 선수를 선발로
  const pSlot=ST.lineup.find(x=>x.pos==='P');
  if(pSlot&&isAvailable(pSlot.id)){
    rot=[pSlot.id].concat(rot.filter(id=>id!==pSlot.id));
  }
  ST.rotation=rot;
  return rot;
}

function makeLive(){
  sanitizeRotation();
  const next=ST.schedule[ST.round];
  const opp=TBYID[next.opp];
  const raw=TBYID['wwzw'];
  const hotDay = ST.weather==='hot'||ST.weather==='humid';
  const us={...raw, pitchers: raw.pitchers.map(p=>{
    const r=ST.rest[p.id]!==undefined?ST.rest[p.id]:3;
    let f=r>=2?1:(r===1?0.86:0.70);
    let np = f===1?{...p}:{...p,stf:Math.round(p.stf*f),ctl:Math.round(p.ctl*f),sta:Math.round(p.sta*f)};
    const mm=META[p.id];
    if(hotDay&&mm&&mm.traits.includes('더위약함')){
      np.sta = Math.min(np.sta, 26);          // 약 2이닝에서 한계
      np.heatFade = true;
    }
    return np;
  })};
  const rng=makeRng((ST.seed+ST.round*7919+(Date.now()%100000))>>>0);
  const uLine=ST.lineup.map(s=>({id:s.id,pos:s.pos}));
  const cond={};
  raw.players.forEach(p=>{
    let cv=(ST.cond[p.id]||70)+((ST.morale[p.id]||70)-70)*0.18;
    if(ST.mittMissing&&p.id==='yjh')cv-=6;
    const mm=META[p.id];
    const sl=uLine.find(x=>x.id===p.id);
    if(mm&&sl&&mm.traits.includes('포수부담')&&sl.pos==='C') cv-=14;
    const bf=ST.buff&&ST.buff[p.id];
    if(bf){ if(bf.all)cv*=bf.all; if(bf.pow)cv+=(bf.pow-1)*40; if(bf.spd)cv+=(bf.spd-1)*30; }
    cond[p.id]=Math.max(20,Math.min(100,cv));
  });
  const neutral={bat:'normal',run:'normal',hook:'normal'};
  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const gearPenalty = ST.gearLevel===2?30:(ST.gearLevel===1?10:0);
  recalcTeamDefense(us, uLine, gearPenalty);
  us._errMod = (raw._errMod||1) * (ST.fieldMod?ST.fieldMod.err:1) * ((ST.teamBuff&&ST.teamBuff.err)||1);
  // 상대팀 변수 반영
  const oe=ST.oppEvent?ST.oppEvent.eff:null;
  const oppMod = {...opp};
  if(oe){
    oppMod.tend={...opp.tend};
    if(oe.oppB) oppMod.tend.babip=opp.tend.babip*(1+oe.oppB);
    if(oe.oppE) oppMod.tend.err=opp.tend.err*oe.oppE;
    if(oe.oppP){ oppMod.pitchers=opp.pitchers.map(p=>({...p,
      stf:Math.max(18,p.stf+oe.oppP), ctl:Math.max(15,p.ctl+Math.round(oe.oppP*0.6))})); }
    oppMod.mean=opp.mean; oppMod._errMod=opp._errMod;
  }
  return new LiveGame({
    innings:7,rng,userIsHome:next.homeGame,
    home: next.homeGame?us:oppMod,
    away: next.homeGame?oppMod:us,
    homeLineup: next.homeGame?uLine:aiLineup(oppMod),
    awayLineup: next.homeGame?aiLineup(oppMod):uLine,

function flushLog(){
  const feed=$('#feed'); if(!feed||!LIVE)return;
  const fresh=LIVE.log.slice(LIVE._logSeen||0);
  LIVE._logSeen=LIVE.log.length;
  fresh.forEach(l=>{
    const cls=l.t==='inning'?'inn':(l.t==='sub'?'sub':(l.cls||''));
    const d=el('div','fl '+cls); d.textContent=l.text; feed.appendChild(d);
  });
  while(feed.children.length>50)feed.removeChild(feed.firstChild);
  feed.scrollTop=feed.scrollHeight;
}

function runLive(){
  clearInterval(playTimer);
  if(!LIVE.manual){
    // 자동 진행: 즉시 계산
    let guard=0;
    while(!LIVE.over && guard++<2000){
      if(LIVE.pending) LIVE.applyDecision('change');
      LIVE.step();
    }
    flushLog(); updateLiveUI(); showResult(); return;
  }
  const speed=520;
  playTimer=setInterval(()=>{
    if(!LIVE){clearInterval(playTimer);return;}
    if(LIVE.over){clearInterval(playTimer);showResult();return;}
    if(LIVE.manual){
      const d=LIVE.pending||LIVE.detectDecision();
      if(d){clearInterval(playTimer);showDecision(d);return;}
    } else if(LIVE.pending){ LIVE.applyDecision('change'); }
    LIVE.step();
    flushLog(); updateLiveUI();
    if(LIVE.over){clearInterval(playTimer);showResult();}
  },speed);
}

function commitGame(res,usSide,thSide,uSlots){
  const sch=ST.schedule[ST.round];
  if(sch.played){go('home');return;}
  sch.played=true; sch.result={us:usSide.runs,them:thSide.runs};

  uSlots.forEach(s=>{
    const b=res.box[s.id]; if(!b)return;
    const acc=ST.bat[s.id]; if(!acc)return;
    acc.g++; ['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>acc[k]+=b[k]||0);
    const lg=ST.lgBat[s.id];
    if(lg){lg.g++;['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>lg[k]+=b[k]||0);}
    ST.cond[s.id]=Math.max(20,(ST.cond[s.id]||70)-(8+(b.pa||0)*1.2));
  });
  ST.rotation.forEach((pid,i)=>{
    const l=res.pbox[pid]; if(!l||!l.bf)return;
    const acc=ST.pit[pid]; if(!acc)return;
    acc.g++; if(i===0)acc.gs++;
    ['outs','h','r','er','bb','k','hbp','sbA'].forEach(k=>acc[k]+=l[k]||0);
    if(res.wp===pid)acc.w++; if(res.lp===pid)acc.l++;
  });

  const won=usSide.runs>thSide.runs, tie=usSide.runs===thSide.runs;
  TBYID['wwzw'].players.forEach(p=>{
    const played=uSlots.some(s=>s.id===p.id);
    let d=won?6:(tie?1:-4); if(!played)d-=1;
    ST.morale[p.id]=Math.max(10,Math.min(100,(ST.morale[p.id]||70)+d));
  });

  if(!ST.notices)ST.notices=[];
  (res.injuries||[]).forEach(iv=>{
    const inj=rollInjury(iv.id,iv.roll);
    ST.injury[iv.id]=inj;
    ST.injCount=(ST.injCount||0)+1;
    ST.notices.push({type:'injury',title:`${nameOf(iv.id)} 부상`,
      body:`경기 중 ${inj.name}이(가) 발생했다.`,effect:`${inj.games}경기 결장`});
  });

  TBYID['wwzw'].pitchers.forEach(p=>{ST.rest[p.id]=Math.min(4,(ST.rest[p.id]||3)+1);});
  ST.rotation.forEach(pid=>{
    const l=res.pbox[pid];
    if(l&&l.outs>=6)ST.rest[pid]=0; else if(l&&l.outs>0)ST.rest[pid]=1;
  });

  const u=ST.stand['wwzw'], t=ST.stand[sch.opp];
  u.g++;t.g++;u.rf+=usSide.runs;u.ra+=thSide.runs;t.rf+=thSide.runs;t.ra+=usSide.runs;
  if(tie){u.t++;t.t++;}else if(won){u.w++;t.l++;}else{u.l++;t.w++;}
  ST.budget+=won?9:(tie?6:4);

  ST.lastFreePass = ST.rotation.reduce((a,pid)=>a+((res.pbox[pid]&&res.pbox[pid].bb)||0),0)+usSide.sbAllowed+(res.wp||0);
  ST.lastLineup = uSlots.map(s=>({id:s.id,pos:s.pos}));
  updateUnhappy(ST, uSlots);
  if(ST.promise){ Object.keys(ST.promise).forEach(pid=>{ ST.promise[pid]--;
    if(ST.promise[pid]<=0)delete ST.promise[pid]; }); }
  const dpCount = res.dpCount||0;
  const miles = accrueCareer(ST,res,uSlots,won,tie,dpCount);
  ST.canParty = won;
  ST.kakaoPost = buildKakaoPost(ST,res,usSide,thSide,uSlots,miles);
  ST.sentPost=false;
  ST.partyDone = !won;
  ST.mystery = rollMysteryEvent(ST, uSlots);
  simOtherGames(sch.opp);
  applyTraining();
  ST.round++; ST.weekDone=false; ST.events=[];
  if(ST.round>=ST.schedule.length)ST.seasonOver=true;
  saveGame(true); LIVE=null;
  go('kakao'); toast(tie?'무승부':(won?'승리':'패배'));
}

function simOtherGames(exclude){
  const rest=TEAMS.filter(t=>t.id!=='wwzw'&&t.id!==exclude);
  const rng=makeRng((ST.seed+ST.round*104729)>>>0);
  for(let i=rest.length-1;i>0;i--){const j=(rng()*(i+1))|0;[rest[i],rest[j]]=[rest[j],rest[i]];}
  for(let i=0;i+1<rest.length;i+=2){
    const a=rest[i],h=rest[i+1];
    const r=simGame(h,a,{rng,innings:7,awayLineup:aiLineup(a),awayRotation:aiRotation(a),
      homeLineup:aiLineup(h),homeRotation:aiRotation(h)});
    const sa=ST.stand[a.id],sh=ST.stand[h.id];
    sa.g++;sh.g++;sa.rf+=r.away.runs;sa.ra+=r.home.runs;sh.rf+=r.home.runs;sh.ra+=r.away.runs;
    if(r.tie){sa.t++;sh.t++;}else if(r.away.runs>r.home.runs){sa.w++;sh.l++;}else{sh.w++;sa.l++;}
    for(const pid in r.box){const lg=ST.lgBat[pid];if(!lg)continue;const b=r.box[pid];
      if(b.pa>0)lg.g++;['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>lg[k]+=b[k]||0);}
  }
}

const TRAININGS=[
  {k:'none',n:'훈련 없음',d:'컨디션 회복에 집중',eff:'컨디션 +6'},
  {k:'bat',n:'타격 훈련',d:'배팅장에서 스윙을 다듬는다',eff:'컨택·파워 성장'},
  {k:'field',n:'수비 훈련',d:'펑고와 송구 반복',eff:'수비·어깨 성장'},
  {k:'run',n:'주루 훈련',d:'슬라이딩과 리드 연습',eff:'주루 성장'},
  {k:'eye',n:'선구안 훈련',d:'존 설정과 볼 판단',eff:'선구 성장'},
  {k:'pitch',n:'투구 훈련',d:'퀵모션과 제구 위주',eff:'투수 제구 성장'},
  {k:'hard',n:'강도 높은 전체 훈련',d:'전 부문을 몰아친다',eff:'성장 큼 · 부상 위험'},
];
function coachBonus(kind){
  // kind: 'inf'(내야수비) 'out'(외야수비) 'all'(전체수비) 'bat'(타격)
  const us=TBYID['wwzw'];
  let best=1;
  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||!m.coach||ST.injury[p.id])return;
    const v=m.coach[kind]||(kind!=='bat'?(m.coach.all||0):0);
    if(v) best=Math.max(best, 1+(v-40)/100);
  });
  return best;
}
function coachNames(kind){
  const us=TBYID['wwzw'];
  return us.players.filter(p=>{
    const m=META[p.id]; if(!m||!m.coach)return false;
    return m.coach[kind]||(kind!=='bat'&&m.coach.all);
  }).map(p=>p.name);
}
function applyTraining(){
  const f=ST.trainFocus||'none';
  const us=TBYID['wwzw'];
  const gains=[];
  const KN={con:'컨택',pow:'파워',eye:'선구',spd:'주루',def:'수비',arm:'어깨'};
  us.players.forEach(p=>{
    if(ST.injury[p.id])return;
    const pa=effPA(p.id), ca=effCA(p.id);
    if(ca>=pa)return;
    const m=META[p.id];
    let rate=0.30;
    if(f==='field'){
      // 내야/외야 구분해서 코치 효과 적용
      const mainPos=(ST.lineup.find(x=>x.id===p.id)||{}).pos||'RF';
      const isInf=['C','1B','2B','3B','SS','P'].includes(mainPos);
      rate*=coachBonus(isInf?'inf':'out');
    } else if(f==='bat'){
      rate*=coachBonus('bat');
    } else if(f==='hard'){
      rate*=coachBonus('all');
    }
    if(m&&m.traits.includes('노력파'))rate*=1.25;
    if(m&&m.traits.includes('미완성'))rate*=1.30;
    if(f==='none')rate*=0.30;
    if(f==='hard')rate*=1.9;
    rate*=((ST.morale[p.id]||70)/70);
    const g=Math.min(pa-ca, rate*(0.35+Math.random()*0.85));
    if(g<=0)return;
    const key=f==='bat'?(Math.random()<0.5?'con':'pow'):f==='field'?(Math.random()<0.6?'def':'arm')
      :f==='run'?'spd':f==='eye'?'eye':f==='pitch'?null:['con','pow','eye','spd','def'][(Math.random()*5)|0];
    if(key&&p[key]<80)p[key]=Math.min(80,p[key]+g);
    if(f==='pitch'&&p.pitch){
      p.pitch.ctl=Math.min(80,p.pitch.ctl+g*0.9);
      const pp=us.pitchers.find(x=>x.id===p.id); if(pp)pp.ctl=Math.round(p.pitch.ctl);
    }
    ST.ca[p.id]=calcCA(p);
    if(g>=0.45)gains.push(`${p.name} ${key?KN[key]:'제구'} 상승`);
  });
  if(f==='none')us.players.forEach(p=>ST.cond[p.id]=Math.min(100,(ST.cond[p.id]||70)+6));
  if(f==='hard'){
    us.players.forEach(p=>{
      ST.cond[p.id]=Math.max(20,(ST.cond[p.id]||70)-9);
      if(!ST.injury[p.id]&&Math.random()<0.045){
        const inj=rollInjury(p.id,Math.random());
        ST.injury[p.id]=inj;
        gains.push(`${p.name} 훈련 중 ${inj.name} (${inj.games}경기)`);
      }
    });
  }
  finalizeTeam(us);
  ST.trainLog=gains.slice(0,6);
}

      <div class="sc-r"><div class="sc-v">${wonStr(val*1.5)}</div><button class="sc-b">영입</button></div>`;
    row.querySelector('.sc-b').onclick=()=>tryScout(p,t,val);

function tryScout(p,fromTeam,val){
  const us=TBYID['wwzw'];
  if(us.players.length>=18){toast('로스터가 꽉 찼다 (18명)');return;}
  const cost=val*1.5;
  if(ST.budget<cost){toast(`운영비 부족 — ${wonStr(cost)} 필요`);return;}
  const st=ST.stand['wwzw'];
  const winPct=st.g?st.w/st.g:0.3;
  const avgM=us.players.reduce((s,x)=>s+(ST.morale[x.id]||70),0)/us.players.length;
  let ch=0.22+winPct*0.40+(avgM-60)/220;
  ch=Math.max(0.06,Math.min(0.85,ch));
  ST.budget-=cost;
  if(Math.random()<ch){
    const nid='new_'+p.id;
    if(us.players.some(x=>x.id===nid)){toast('이미 영입한 선수다');return;}
    const np={id:nid,name:p.name,bats:p.bats,con:p.con,pow:p.pow,eye:p.eye,spd:p.spd,def:p.def,arm:p.arm,
      pos:p.pos.slice(),pitch:null,real:null};
    us.players.push(np);
    ST.bat[nid]=blankBat(); ST.lgBat[nid]=blankBat();
    ST.cond[nid]=72; ST.morale[nid]=70; ST.injury[nid]=null;
    ST.ca[nid]=calcCA(np); ST.growth[nid]=0;
    META[nid]={born:1999,drink:2,loyal:70,pot:4,traits:['영입'],friends:[],rival:null,
      kakao:['잘 부탁드립니다','ㅇㅋ'],desc:`${fromTeam.name}에서 영입`};
    finalizeTeam(us);
    ST.signed.push(p.name);
    toast(`${p.name} 영입 성공`);
  } else {
    ST.budget+=cost*0.5;
    toast(`${p.name} 영입 실패 — 절반 반환`);
  }
  saveGame(true); renderScout();
}

        <span class="rec-t">${m.text}</span><span class="rec-d">${m.date||''}</span>`;
      mc.appendChild(r);
    });
    c.appendChild(mc);
    return;
  }

  /* ── 통산 ── */
  if(recTab==='career'){
    const card=el('div','card'); card.appendChild(el('div','card-h','개인 통산 · 타격'));
    const t=el('table','box wide');
    t.innerHTML='<tr><th>선수</th><th>G</th><th>타수</th><th>안타</th><th>2B</th><th>3B</th><th>HR</th><th>타점</th><th>득점</th><th>도루</th><th>볼넷</th><th>삼진</th><th>타율</th></tr>';
    let any=false;
    us.players.slice().sort((a,b)=>((ST.career[b.id]||{}).h||0)-((ST.career[a.id]||{}).h||0)).forEach(p=>{
      const c2=ST.career[p.id]; if(!c2||!c2.g)return; any=true;
      const tr=el('tr',isMe(p.id)?'me':'');
      tr.innerHTML=`<td class="nm">${p.name}</td><td>${c2.g}</td><td>${c2.ab}</td><td>${c2.h}</td><td>${c2.d2}</td><td>${c2.d3}</td><td>${c2.hr}</td><td>${c2.rbi}</td><td>${c2.r}</td><td>${c2.sb}</td><td>${c2.bb}</td><td>${c2.k}</td><td>${c2.ab?fmt3(c2.h/c2.ab):'—'}</td>`;
      t.appendChild(tr);
    });
    card.appendChild(t);
    if(!any)card.appendChild(el('p','muted','아직 기록이 없다.'));
    c.appendChild(card);

    const pc=el('div','card'); pc.appendChild(el('div','card-h','개인 통산 · 투구'));
    const pt=el('table','box wide');
    pt.innerHTML='<tr><th>투수</th><th>G</th><th>승</th><th>패</th><th>이닝</th><th>피안타</th><th>자책</th><th>볼넷</th><th>삼진</th><th>ERA</th></tr>';
    us.players.forEach(p=>{
      const c2=ST.career[p.id]; if(!c2||!c2.pg)return;
      const ipS=Math.floor(c2.pouts/3)+(c2.pouts%3?'.'+(c2.pouts%3):'');
      const e=c2.pouts?((c2.per*7)/(c2.pouts/3)).toFixed(2):'—';
      const tr=el('tr',isMe(p.id)?'me':'');
      tr.innerHTML=`<td class="nm">${p.name}</td><td>${c2.pg}</td><td>${c2.pw}</td><td>${c2.pl}</td><td>${ipS}</td><td>${c2.ph}</td><td>${c2.per}</td><td>${c2.pbb}</td><td>${c2.pk}</td><td>${e}</td>`;
      pt.appendChild(tr);
    });
    pc.appendChild(pt); c.appendChild(pc);
    return;
  }

  /* ── 구단 ── */
  const tc=ST.teamCareer||{};
  const card=el('div','card'); card.appendChild(el('div','card-h','구단 통산'));
  const rows=[['경기',tc.g||0],['승',tc.w||0],['패',tc.l||0],['무',tc.t||0],
    ['안타',tc.h||0],['2루타',tc.d2||0],['3루타',tc.d3||0],['홈런',tc.hr||0],
    ['득점',tc.r||0],['타점',tc.rbi||0],['도루',tc.sb||0],['병살',tc.dp||0]];
  const g2=el('div','tc-grid');
  rows.forEach(([k,v])=>{const b=el('div','tc');b.innerHTML=`<b>${v}</b><span>${k}</span>`;g2.appendChild(b);});
  card.appendChild(g2);
  card.appendChild(el('p','muted',`시즌 ${ST.seasonNo||1}년차 진행 중`));
  c.appendChild(card);

  const sc=el('div','card'); sc.appendChild(el('div','card-h','병살 시너지'));
  DP_SYNERGY.forEach(sy=>{
    const on=sy.pair.every(id=>ST.lineup.some(x=>x.id===id));
    const r=el('div','syn-row'+(on?' on':''));
    r.innerHTML=`<div class="sy-n">${sy.name}</div><div class="sy-l">${sy.label} +${(sy.bonus*100).toFixed(1)}%</div>
      <div class="sy-d">${sy.note}</div><div class="sy-s">${on?'현재 라인업에 있음':'미편성'}</div>`;
    sc.appendChild(r);
  });
  c.appendChild(sc);
}

/* ---------- 설정 ---------- */
function renderMore(){
  const c=$('#view'); c.innerHTML='';

  // 세이브/로드
  const sv=el('div','card');
  sv.appendChild(el('div','card-h','세이브 · 로드'));
  sv.appendChild(el('p','muted','브라우저를 바꾸거나 폰을 바꿔도 기록을 옮길 수 있다. 파일로 저장하는 쪽이 확실하다.'));
  const r1=el('div','btn-row');
  const e1=el('button','btn','파일로 저장'); e1.onclick=exportSave;
  const e2=el('button','btn','코드 복사'); e2.onclick=copySave;
  r1.appendChild(e1); r1.appendChild(e2); sv.appendChild(r1);

  const fileWrap=el('div','file-wrap');
  fileWrap.innerHTML='<label class="filelabel" for="savefile">세이브 파일 불러오기</label>';
  const fi=document.createElement('input');
  fi.type='file'; fi.id='savefile'; fi.accept='.json,application/json'; fi.className='fileinput';
  fi.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f)importSaveFile(f); };
  fileWrap.appendChild(fi);
  sv.appendChild(fileWrap);

  const ta=document.createElement('textarea');
  ta.className='savebox'; ta.placeholder='여기에 세이브 코드를 붙여넣고 아래 버튼을 눌러라';
  sv.appendChild(ta);
  const e3=el('button','btn','코드로 불러오기');
  e3.onclick=()=>{ if(!ta.value.trim()){toast('코드를 붙여넣어라');return;} importFromText(ta.value.trim()); };
  sv.appendChild(e3);
  c.appendChild(sv);

  const pcard=el('div','card');
  pcard.appendChild(el('div','card-h','플레이 선수'));
  pcard.appendChild(el('p','muted',`현재: <b>${nameOf(ST.playerId||MYID)}</b>`));
  pcard.lastChild.innerHTML=`현재: <b>${nameOf(ST.playerId||MYID)}</b>`;
  const pb=el('button','btn','선수 바꾸기'); pb.onclick=()=>go('pick');
  pcard.appendChild(pb);
  c.appendChild(pcard);

  const card=el('div','card');
  card.appendChild(el('div','card-h','데이터'));
  const r=el('div','btn-row');
  const b1=el('button','btn','자동 저장'); b1.onclick=()=>saveGame(false);
  const b2=el('button','btn danger','시즌 초기화');
  b2.onclick=async()=>{if(confirm('시즌 기록이 전부 사라진다. 진행할까?')){
    TEAMS=buildAllTeams();TBYID={};TEAMS.forEach(t=>TBYID[t.id]=t);buildPitcherPool();
    ST=newSeason();ST.lineup=recommendLineup();ST.rotation=recommendRotation();
    await saveGame(true);go('home');toast('새 시즌');}};
  r.appendChild(b1);r.appendChild(b2); card.appendChild(r);
  c.appendChild(card);

  const info=el('div','card');
  info.innerHTML=`<div class="card-h">이 게임에 대해</div><p class="muted">
    안산시야구소프트볼협회 4부리그 23팀의 실제 2026시즌 타격 기록에서 팀별 성향 계수를 역산해 만들었다.<br><br>
    <b>리그 기준선(실측)</b><br>삼진 15.3% · 볼넷 15.6% · BABIP .451<br>
    안타 분포 1루타 74.1% / 2루타 16.3% / 3루타 7.5% / 홈런 2.2%<br><br>
    우완좌완 14명의 능력치는 실제 개인 기록과 스프레이 차트에서 산출했다.<br>
    콜드게임은 4회 10점차 / 6회 7점차 — 8월 9일·16일 실제 경기로 검증했다.</p>`;
  c.appendChild(info);

  const pk=el('div','card');
  pk.appendChild(el('div','card-h','경기장'));
  PARKS.forEach(p=>{
    const row=el('div','park-row');
    row.innerHTML=`<div class="pk-n">${p.name}</div><div class="pk-d">${p.desc}</div>
      <div class="pk-e">홈런 ${(p.hr*100).toFixed(0)}% · 2루타 ${(p.d2*100).toFixed(0)}% · 3루타 ${(p.d3*100).toFixed(0)}% · 실책 ${(p.err*100).toFixed(0)}%</div>`;
    pk.appendChild(row);
  });
  c.appendChild(pk);

  const tr=el('div','card');
  tr.appendChild(el('div','card-h','특성 설명'));
  Object.keys(TRAIT_INFO).forEach(k=>{
    const row=el('div','trait-row');
    row.innerHTML=`<span class="trait">${k}</span><span class="td">${TRAIT_INFO[k]}</span>`;
    tr.appendChild(row);
  });
  c.appendChild(tr);
}

/* ---------- 네비 ---------- */
const VIEWS={home:renderHome,squad:renderSquad,lineup:renderLineup,kakao:renderKakao,
  game:renderGame,train:renderTrain,scout:renderScout,stand:renderStand,stats:renderStats,
  records:renderRecords,pick:renderPick,more:renderMore};
function go(v){
  clearInterval(playTimer);
  curView=v;
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
  (VIEWS[v]||renderHome)();
}

function normalizeState(){
  const us=TBYID['wwzw'];
  Object.keys(ST.bat||{}).forEach(id=>{
    if(id.startsWith('new_')&&!us.players.some(p=>p.id===id)){
      const srcId=id.slice(4);
      const src=TEAMS.flatMap(t=>t.players).find(p=>p.id===srcId);
      if(src){
        const np={id,name:src.name,bats:src.bats,con:src.con,pow:src.pow,eye:src.eye,
          spd:src.spd,def:src.def,arm:src.arm,pos:src.pos.slice(),pitch:null,real:null};
        us.players.push(np);
        META[id]={born:1999,speech:'jon',throws:'R',car:false,school:'-',drink:2,loyal:70,pot:4,
          traits:['영입'],friends:[],rival:null,coach:{},pos:PR({}),desc:'영입 선수'};
      }
    }
  });
  finalizeTeam(us);
  buildPitcherPool();
  TEAMS.forEach(t=>{ if(!ST.stand[t.id])ST.stand[t.id]={w:0,l:0,t:0,rf:0,ra:0,g:0};
    t.players.forEach(p=>{if(!ST.lgBat[p.id])ST.lgBat[p.id]=blankBat();}); });
  ['cond','morale','injury','ca','growth','rest','absent','pendingAbsent'].forEach(k=>{if(!ST[k])ST[k]={};});
  ['events','kakao','kakaoPost','signed','notices'].forEach(k=>{if(!ST[k])ST[k]=[];});
  us.players.forEach(p=>{
    if(!ST.bat[p.id])ST.bat[p.id]=blankBat();
    if(ST.cond[p.id]==null)ST.cond[p.id]=72;
    if(ST.morale[p.id]==null)ST.morale[p.id]=75;
    if(ST.injury[p.id]===undefined)ST.injury[p.id]=null;
    if(ST.ca[p.id]==null)ST.ca[p.id]=calcCA(p);
  });
  us.pitchers.forEach(p=>{if(!ST.pit[p.id])ST.pit[p.id]=blankPit();if(ST.rest[p.id]==null)ST.rest[p.id]=3;});
  if(!ST.tactics)ST.tactics={bat:'normal',run:'normal',hook:'normal'};
  if(ST.budget==null)ST.budget=120;
  if(ST.useDH==null)ST.useDH=true;
  if(!ST.park)ST.park='benamul';
  if(ST.gearLevel==null)ST.gearLevel=0;
  if(ST.weekSeq==null)ST.weekSeq=0;
  if(ST.injCount==null)ST.injCount=0;
  if(!ST.trainFocus)ST.trainFocus='none';
  if(!ST.caStart){ST.caStart={};us.players.forEach(p=>ST.caStart[p.id]=ST.ca[p.id]);}
  if(!ST.playerId)ST.playerId='ksh';
  if(!ST.unhappy)ST.unhappy={};
  if(!ST.career)ST.career={};
  if(!ST.teamCareer)ST.teamCareer=blankTeamCareer();
  if(!ST.milestones)ST.milestones=[];
  if(!ST.firsts)ST.firsts={};
  if(!ST.weather)ST.weather='clear';
  if(!ST.carpool)ST.carpool=null;
  if(!ST.dropouts)ST.dropouts=[];
  if(ST.lessonBoost==null)ST.lessonBoost=false;
  if(ST.lessonTarget===undefined)ST.lessonTarget=null;
  if(ST.year==null)ST.year=2026;
  if(ST.seasonNo==null)ST.seasonNo=1;
  if(ST.discharged==null)ST.discharged=false;
  ST.schedule.forEach((sc,i)=>{ if(!sc.park)sc.park=PARKS[(i*7+3)%PARKS.length].id; });
  if(!ST.lineup||ST.lineup.length<9||ST.lineup.some(s=>!us.players.some(p=>p.id===s.id)))
    ST.lineup=recommendLineup();
  if(!ST.rotation||!ST.rotation.length||ST.rotation.some(id=>!us.pitchers.some(p=>p.id===id)))
    ST.rotation=recommendRotation();
}

async function boot(){
  TEAMS=buildAllTeams();
  TEAMS.forEach(t=>TBYID[t.id]=t);
  buildPitcherPool();
  const saved=await loadGame();
  const us=TBYID['wwzw'];
  if(saved){
    ST=saved;
    normalizeState();
  } else {
    ST=newSeason();
    ST.lineup=recommendLineup();
    ST.rotation=recommendRotation();
  }

  MYID=ST.playerId||'ksh';
  $$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#sheet-close').onclick=closeSheet;
  $('#sheet-bg').onclick=closeSheet;
  $('#loading').style.display='none';
  go(saved?'home':'pick');
}
document.addEventListener('DOMContentLoaded',boot);

</script>
</body>
