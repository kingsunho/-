<script>
/* =========================================================
   이벤트 · 카톡 시스템 v4
   ========================================================= */
'use strict';

function pickOne(arr,rng){ return arr[(((rng||Math.random)())*arr.length)|0]; }
function uniqPush(msgs,m){
  if(msgs.some(x=>x.who===m.who&&x.text===m.text))return;
  msgs.push(m);
}

/* ================= 주간 이벤트 ================= */
function rollWeekEvents(ST, rng){
  const evts=[];
  const us=TBYID['wwzw'];
  const alive=us.players.filter(p=>!ST.injury[p.id]);
  ST.calendar=holidayFor(ST.round, ST.year||2026);

  /* 학생 야구부 대관으로 구장 사용 불가 */
  if(rng()<0.06){
    evts.push({type:'postpone',title:'구장 대관 취소',
      body:'중고등학교 야구부가 구장을 쓰게 되어 우리 경기가 밀렸다.',
      effect:'경기 연기 · 전원 컨디션 +5'});
    return evts;
  }
  if(rng()<0.10){
    evts.push({type:'rain',title:'우천 취소',
      body:'아침부터 비가 쏟아졌다. 그라운드 사정으로 경기가 순연됐다.',
      effect:'전원 컨디션 +8 · 투수 휴식 +1'});
    return evts;
  }

  /* 날씨 */
  const wx=rollWeather(rng, (ST.calendar&&ST.calendar.month)||5);
  ST.weather=wx.id;
  if(wx.cancel && rng()<wx.cancel){
    evts.push({type:'rain',title:wx.name+'으로 경기 취소',
      body:wx.desc+' 결국 경기가 순연됐다.',
      effect:'전원 컨디션 +8 · 투수 휴식 +1'});
    return evts;
  }
  if(wx.id!=='clear'){
    evts.push({type:'weather',title:`날씨 · ${wx.name}`,body:wx.desc,
      effect:`컨디션 ${wx.cond} · 실책 ${Math.round(wx.err*100-100)>0?'+':''}${Math.round(wx.err*100-100)}%`});
  }
  if(wx.risk==='탈수'&&rng()<0.30&&alive.length){
    const v=pickOne(alive,rng);
    evts.push({type:'dehydrate',pid:v.id,title:`${v.name} 탈수 증세`,
      body:`${v.name}이(가) 몸을 풀다 어지럽다고 했다.`,effect:'컨디션 대폭 하락'});
  }

  /* 기념일 — 김선우 장교 */
  const cal=ST.calendar;
  /* 김선우는 장교다. 나라 기념일이면 각을 잡고 나온다.
     삼일절·현충일·광복절·국군의 날 전부 해당한다.                    */
  if(cal.holiday==='삼일절'||cal.holiday==='광복절'
     ||cal.holiday==='현충일'||cal.holiday==='국군의 날'){
    if(isAvailable('ksw')){
      const KSW_LINE={
        '삼일절':['김선우가 태극기를 챙겨 왔다. "오늘은 의미가 다릅니다."', 1.30],
        '현충일':['김선우가 조용히 묵념부터 했다. "오늘은 진지하게 하겠습니다."', 1.26],
        '광복절':['김선우가 각 잡고 나타났다. "오늘은 좀 다릅니다."', 1.32],
        '국군의 날':['김선우가 군복 티셔츠를 입고 왔다. "오늘은 제 날입니다."', 1.36],
      };
      const L=KSW_LINE[cal.holiday]||['김선우가 각 잡고 나타났다.',1.30];
      evts.push({type:'holiday',pid:'ksw',title:`${cal.holiday} · 김선우 각성`,
        body:L[0], pow:L[1],
        effect:`김선우 파워 +${Math.round((L[1]-1)*100)}% · 팀 사기 상승`});
    } else evts.push({type:'holiday',title:cal.holiday,body:`${cal.holiday}이다.`,effect:'—'});
  }

  /* 음주 — 금주자 외 전원 랜덤 */
  const drunk=[], clubbed=[];
  alive.forEach(p=>{
    const m=META[p.id]; if(!m)return;
    if(m.traits.includes('금주'))return;          // 김선우·권혁준
    if(rng()<0.16){
      const clubP = p.id==='kig' ? 0.35 : 0.006;   // 김인규만 클럽 자주 간다
      if(rng()<clubP) clubbed.push(p.id);
      else drunk.push(p.id);
    }
  });
  if(clubbed.length){
    evts.push({type:'club',ids:clubbed,title:`${clubbed.map(nameOf).join(', ')} 클럽`,
      body:`${clubbed.map(nameOf).join(', ')}이(가) 새벽까지 클럽에 있었다. 잠을 못 자고 왔다.`,
      effect:'컨디션 대폭 하락 · 사기 소폭 상승'});
  }
  if(drunk.length>=4){
    evts.push({type:'party',ids:drunk,title:'전날 팀 회식',
      body:`${drunk.map(nameOf).join(', ')}이(가) 끝까지 남았다는 목격담이 있다.`,
      effect:'컨디션 하락 · 팀 사기 +4'});
  } else if(drunk.length){
    evts.push({type:'drink',ids:drunk,title:'전날 음주',
      body:`${drunk.map(nameOf).join(', ')}이(가) 어제 한잔했다고 한다.`,effect:'컨디션 하락'});
  }

  /* 음주 사고 */
  if((drunk.length+clubbed.length)>=2&&rng()<0.22){
    const pool=drunk.concat(clubbed);
    const a=pickOne(pool,rng);
    const drivers=us.players.filter(p=>META[p.id]&&META[p.id].car&&p.id!==a);
    if(drivers.length){
      const b=pickOne(drivers,rng).id;
      evts.push({type:'incident',ids:[a,b],title:'음주 사고',
        body:`${nameOf(a)}이(가) ${nameOf(b)} 차에서 토했다. 단톡방이 시끄럽다.`,
        effect:`${nameOf(a)}·${nameOf(b)} 컨디션·사기 하락`});
    }
  }

  /* 친구의 술 약속 — 플레이어에게 직접 오는 연락이다.
     수락하면 우정과 사기가 오르지만 다음 경기 컨디션이 깎인다.       */
  const meId=ST.playerId||'ksh';
  const meM=META[meId];
  if(meM && rng()<0.09){
    const pals=(meM.friends||[]).filter(f=>{
      const fm=META[f];
      return fm && !fm.traits.includes('금주') && us.players.some(p=>p.id===f)
        && !ST.injury[f] && !evts.some(e=>e.type==='absent'&&e.pid===f);
    });
    if(pals.length){
      const f=pickOne(pals,rng);
      evts.push({type:'drinkinvite',pid:f,title:`${nameOf(f)}에게서 연락`,
        body:sayTo(f,meId,...pickOne(DRINK_INVITE,rng)),
        effect:'수락 · 거절을 골라야 한다'});
    }
  }

  /* 축구 언해피 — 형제(김인규·김한규)가 야구보다 축구에 마음이 가 있다.
     개막하자마자 이 소리를 하면 아무 맥락이 없다. 3차전부터 나오게 막아두고,
     나와도 그 자리에서 불만이 되지는 않는다. 불씨로만 남았다가
     벤치·하위타순·대패 같은 게 겹치는 날 터진다.                         */
  if((ST.round||0)>=2){
    ['kig','khg'].forEach(pid=>{
      if(!us.players.some(p=>p.id===pid))return;
      if(ST.injury[pid])return;
      if(evts.some(e=>e.type==='soccer'))return;
      const mm=META[pid]||{traits:[]};
      let pr=(mm.traits||[]).includes('불만러')?0.055:0.032;
      const mo=(ST.morale&&ST.morale[pid]!=null)?ST.morale[pid]:70;
      if(mo>=78)pr*=0.35;          // 팀이 잘 굴러가면 축구 생각이 안 난다
      else if(mo<50)pr*=1.7;       // 재미가 없으면 딴 데로 눈이 간다
      if(rng()<pr){
        evts.push({type:'soccer',pid,title:`${nameOf(pid)} 축구`,
          body:sayTo(pid,ST.playerId||'ksh',...pickOne(SOCCER_LINES,rng)),
          effect:'사기 하락 · 불만 불씨 누적 (당장 불만 단계가 오르지는 않는다)'});
      }
    });
  }

  /* 타팀 영입 제안 — 잘하는데 대우를 못 받는 선수에게 온다 */
  if(rng()<0.06){
    const cands=us.players.filter(p=>{
      if(p.id===(ST.playerId||MYID))return false;   // 내 선수 영입 제안은 따로 다룬다
      if(!us.players.some(q=>q.id===p.id))return false;
      if(ST.injury[p.id])return false;
      if(ST.promise&&ST.promise[p.id])return false;        // 이미 약속한 선수는 빼준다
      const un=(ST.unhappy&&ST.unhappy[p.id])?ST.unhappy[p.id].level:0;
      const bond=(ST.bond&&ST.bond[p.id]!=null)?ST.bond[p.id]:50;
      return effCA(p.id)>=34 && (un>=1 || bond<45);
    });
    if(cands.length){
      const v=pickOne(cands,rng);
      const orderMax=3+((rng()*3)|0);                       // 1~5번 중 보장 요구
      evts.push({type:'poach',pid:v.id,orderMax:Math.min(5,orderMax),
        title:`${v.name} 타팀 영입 제안`,
        body:sayTo(v.id,ST.playerId||'ksh',...pickOne(POACH_LINES,rng)),
        effect:`${Math.min(5,orderMax)}번 타순 이상 보장을 요구한다`});
    }
  }

  /* 김준희 농구 */
  if(isAvailable('kjh')&&rng()<0.18){
    evts.push({type:'basket',pid:'kjh',title:'김준희 농구하고 옴',
      body:'김준희가 오전에 농구를 하고 왔다. 몸이 이미 풀려 있다.',
      effect:'주루 상승 · 체력 소모'});
  }

  /* 개인 사정 */
  const REASON_CAR=['차가 고장났다'];
  const REASON_COMMON=['가족 여행이 잡혔다','여자친구랑 약속이 있다','회사에 일이 생겼다',
    '결혼식 사회를 봐야 한다','장염에 걸렸다','전날 회식이 늦게 끝났다','몸살이 났다',
    '이사를 해야 한다','친구 결혼식에 간다'];
  const REASON_KSW=['부대에 일이 생겼다','당직 근무가 잡혔다','훈련 일정이 잡혔다',
    '휴가가 안 나왔다','비상소집이 걸렸다'];
  const reasonFor=(pid)=>{
    if(pid==='ksw') return pickOne(REASON_KSW,rng);
    const m2=META[pid];
    const pool = (m2&&m2.car) ? REASON_COMMON.concat(REASON_CAR) : REASON_COMMON;
    return pickOne(pool,rng);
  };
  alive.forEach(p=>{
    const m=META[p.id];
    const att = m&&m.attend!=null ? m.attend : 0.85;
    const missP = Math.max(0.02, Math.min(0.34, (1-att)*0.48));
    if(rng()<missP){
      evts.push({type:'absent',pid:p.id,title:`${p.name} 결장`,
        body:`${p.name}이(가) ${reasonFor(p.id)}고 한다.`,effect:'출전 불가'});
    }
  });

  /* 포수 장비 */
  const gm=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('장비담당'));
  if(gm){
    const out=ST.injury[gm.id]||evts.some(e=>e.type==='absent'&&e.pid===gm.id);
    if(out)evts.push({type:'gear',title:'포수 장비 없음',
      body:`포수 장비는 ${gm.name}이(가) 챙겨 오는데 오늘 못 나온다.`,
      effect:'포수 수비 대폭 하락 · 도루 저지 불가'});
    else if(rng()<0.06)evts.push({type:'gear',title:'포수 장비 일부 누락',
      body:`${gm.name}이(가) 레그가드를 빼놓고 왔다.`,effect:'포수 수비 하락'});
  }
  if(rng()<0.035&&isAvailable('yjh')&&!evts.some(e=>e.type==='absent'&&e.pid==='yjh')){
    evts.push({type:'mitt',pid:'yjh',title:'유지효 미트 미지참',
      body:'유지효가 1루 미트를 집에 두고 왔다.',effect:'유지효 수비 하락'});
  }

  /* 배차 — 결장자 반영 (임시 적용해서 판정) */
  const tmpAbsent={};
  evts.filter(x=>x.type==='absent').forEach(x=>tmpAbsent[x.pid]=1);
  const savedAbsent=ST.absent; ST.absent=Object.assign({},savedAbsent||{},tmpAbsent);
  const cp=resolveCarpool(ST);
  ST.absent=savedAbsent;
  ST.carpool=cp;
  const swapped=cp.rides.filter(r=>r.replaced);
  if(swapped.length){
    evts.push({type:'carswap',title:'배차 변경',
      body:swapped.map(r=>`${nameOf(r.origin)}이(가) 못 나와서 ${nameOf(r.driver)}이(가) 대신 태우고 온다.`).join(' '),
      effect:'이동에는 문제 없다'});
  }
  if(cp.stranded.length){
    evts.push({type:'car',ids:cp.stranded,title:'배차 부족',
      body:`${cp.stranded.map(nameOf).join(', ')}이(가) 탈 차가 없다. 대중교통으로 겨우 왔다.`,
      effect:'해당 선수 컨디션 하락'});
  }

  /* 전역 복귀 */
  if(ST.round===0){
    const dc=checkDischarge(ST);
    if(dc){ evts.push(dc); us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+8)); }
  }

  /* 불만 행동 — 보이콧·카풀 거부·장비 방치·분석 거부·단톡 저격 */
  rollSabotage(ST, evts, rng);

  /* 이적 요구 */
  us.players.forEach(p=>{
    if(p.id===(ST.playerId||MYID))return;      // 내 선수는 스스로 이적을 요구하지 않는다
    const u=ST.unhappy&&ST.unhappy[p.id];
    if(u&&u.level>=3&&rng()<0.30){
      evts.push({type:'transfer',pid:p.id,title:`${p.name} 이적 문의`,
        body:`${p.name}이(가) 다른 팀에서 연락이 왔다고 한다.`,effect:'면담이 필요하다'});
    }
  });

  return evts;
}

function applyWeekEvents(ST,evts){
  const us=TBYID['wwzw'];
  ST.absent={}; ST.fieldMod={err:1,cond:0}; ST.gearLevel=0; ST.mittMissing=false;
  ST.drunkIds=[];      // 전날 마신 사람들 — 경기 중 사고 확률에 쓴다
  ST.buff={}; ST.transferReq=null; ST.drinkInvite=null; ST.poach=null; ST.noCar={};
  let rained=false;
  const wx=WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0];
  ST.fieldMod.err*=wx.err;

  evts.forEach(e=>{
    switch(e.type){
      case 'postpone':
      case 'rain':
        rained=true;
        us.players.forEach(p=>ST.cond[p.id]=Math.min(100,ST.cond[p.id]+8));
        Object.keys(ST.rest).forEach(k=>ST.rest[k]=Math.min(4,ST.rest[k]+1));
        break;
      case 'weather':
        us.players.forEach(p=>ST.cond[p.id]=Math.max(20,ST.cond[p.id]+wx.cond));
        break;
      case 'party': case 'drink':
        (e.ids||[]).forEach(id=>{ if(ST.drunkIds.indexOf(id)<0)ST.drunkIds.push(id); });
        (e.ids||[]).forEach(id=>{
          const d=META[id]?META[id].drink:1;
          ST.cond[id]=Math.max(22,ST.cond[id]-(d>=3?20+((Math.random()*14)|0):d===2?11:5));
        });
        if(e.type==='party')us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+4));
        break;
      case 'club':
        (e.ids||[]).forEach(id=>{ if(ST.drunkIds.indexOf(id)<0)ST.drunkIds.push(id); });
        (e.ids||[]).forEach(id=>{ ST.cond[id]=Math.max(18,ST.cond[id]-34);
          ST.morale[id]=Math.min(100,ST.morale[id]+6); });
        break;
      case 'incident':
        (e.ids||[]).forEach(id=>{ ST.cond[id]=Math.max(18,ST.cond[id]-14);
          ST.morale[id]=Math.max(12,ST.morale[id]-16); });
        us.players.forEach(p=>ST.morale[p.id]=Math.max(12,ST.morale[p.id]-2));
        break;
      case 'dehydrate': ST.cond[e.pid]=Math.max(18,ST.cond[e.pid]-26); break;
      case 'holiday':
        if(e.pid){ ST.buff[e.pid]={pow:e.pow||1.30,label:'각성'};
          us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+3)); }
        break;
      case 'basket':
        ST.buff[e.pid]={spd:1.18,label:'몸 풀림'};
        ST.cond[e.pid]=Math.max(30,ST.cond[e.pid]-6);
        break;
      case 'absent': ST.absent[e.pid]='개인 사정'; break;
      case 'gear': ST.gearLevel=e.title.includes('없음')?2:1; break;
      case 'mitt': ST.mittMissing=true; break;
      case 'car':
        (e.ids||[]).forEach(id=>ST.cond[id]=Math.max(22,ST.cond[id]-11));
        break;
      case 'transfer': ST.transferReq=e.pid; break;
      case 'drinkinvite': ST.drinkInvite={pid:e.pid,line:e.body}; break;
      case 'poach': ST.poach={pid:e.pid,orderMax:e.orderMax,line:e.body}; break;
      case 'boycott':
        ST.absent[e.pid]='말없이 안 나옴';
        ST.morale[e.pid]=Math.max(10,(ST.morale[e.pid]||70)-4);
        us.players.forEach(q=>ST.morale[q.id]=Math.max(10,(ST.morale[q.id]||70)-4));
        break;
      case 'nocar':
        ST.noCar=ST.noCar||{}; ST.noCar[e.pid]=true;
        us.players.forEach(q=>ST.morale[q.id]=Math.max(10,(ST.morale[q.id]||70)-2));
        break;
      case 'nogear':
        ST.gearLevel=2;
        break;
      case 'noscout':
        ST.scoutBlocked=true;
        break;
      case 'snipe':
        us.players.forEach(q=>ST.morale[q.id]=Math.max(10,(ST.morale[q.id]||70)-5));
        /* 주변을 선동한다 — 친한 사람에게 불씨가 옮는다 */
        (META[e.pid]&&META[e.pid].friends||[]).forEach(f=>{
          if(us.players.some(q=>q.id===f)) addSpark(ST,f,'분위기',1);
        });
        break;
      case 'soccer':
        // 축구가 더 재밌다는 소리는 야구 의욕이 떨어졌다는 뜻이다.
        // 다만 이 한마디로 불만 단계를 올리지는 않는다. 불씨로만 남긴다.
        ST.morale[e.pid]=Math.max(10,(ST.morale[e.pid]||70)-6);
        addSpark(ST,e.pid,'축구',1);
        break;
    }
  });
  applyFormBuff(ST);          // 슬럼프·뜨거운 감각을 이번 주 버프에 얹는다
  return rained;
}

/* ================= 친분 연쇄 ================= */
function applyFriendship(ST){
  // 친분은 사기에만 조용히 작용한다. 남 결장에 대해 단톡에서 떠들지 않는다.
  const us=TBYID['wwzw'];
  const inL=new Set(ST.lineup.map(s=>s.id));
  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||!m.friends||!m.friends.length)return;
    if(!inL.has(p.id))return;
    const benched=m.friends.filter(f=>{
      const fp=us.players.find(x=>x.id===f);
      return fp && !inL.has(f) && isAvailable(f);
    }).length;
    const absent=m.friends.filter(f=>ST.absent&&ST.absent[f]).length;
    const together=m.friends.filter(f=>inL.has(f)).length;
    if(benched>=2) ST.morale[p.id]=Math.max(10,ST.morale[p.id]-3);
    if(absent>=2) ST.morale[p.id]=Math.max(10,ST.morale[p.id]-2);
    if(together>=2) ST.morale[p.id]=Math.min(100,ST.morale[p.id]+2);
  });
  return [];
}

/* ================= 불씨 =================
   불만은 한 번에 터지지 않는다. 축구 얘기 한 번 했다고 바로 이적 요구를 하지는 않는다.
   축구·벤치·하위타순·대패 같은 게 '불씨'로 조용히 쌓이다가,
   정작 마음에 안 드는 일이 또 생기는 날 한꺼번에 터진다.
   그래서 축구 이벤트는 불씨만 남기고, 터지는 판정은 경기가 끝난 뒤에 한다.       */
const SPARK_LABEL={축구:'축구',벤치:'벤치',하위타순:'하위 타순',대패:'대패',회비:'회비',
  이탈:'동료 이탈',분위기:'팀 분위기'};
function addSpark(ST,pid,why,amt){
  if(!ST.spark)ST.spark={};
  const sp=ST.spark[pid]||(ST.spark[pid]={n:0,why:[]});
  sp.n=Math.min(6,sp.n+(amt==null?1:amt));
  if(why){
    const i=sp.why.indexOf(why); if(i>=0)sp.why.splice(i,1);
    sp.why.push(why); if(sp.why.length>3)sp.why=sp.why.slice(-3);
  }
  return sp;
}
function sparkOf(ST,pid){
  return (ST&&ST.spark&&ST.spark[pid])?ST.spark[pid]:{n:0,why:[]};
}
/* 몇 개까지 참느냐. 불만러는 빨리 터지고, 성실한 쪽은 오래 참는다. */
function sparkFuse(pid){
  const m=META[pid]||{traits:[]};
  const tr=m.traits||[];
  if(tr.includes('불만러'))return 3;
  if(tr.includes('성실'))return 5;
  return 4;
}
function sparkLabel(sp){
  if(!sp||!sp.n)return '';
  return sp.why.map(w=>SPARK_LABEL[w]||w).join(' · ');
}

/* ================= 언해피 =================
   반환값은 단톡방에 올릴 메시지다. 경기 결과 처리 쪽에서 카톡에 붙인다.       */
function updateUnhappy(ST, uSlots, ctx){
  if(!ST.unhappy)ST.unhappy={};
  if(!ST.spark)ST.spark={};
  ctx=ctx||{};
  const msgs=[];
  const meId=ST.playerId||'ksh';
  const order={}; uSlots.forEach((s,i)=>order[s.id]=i+1);
  TBYID['wwzw'].players.forEach(p=>{
    const m=META[p.id]; if(!m)return;
    if(typeof isMerc==='function'&&isMerc(p.id))return;
    const played=uSlots.some(s=>s.id===p.id);
    const u=ST.unhappy[p.id]||{level:0,streak:0};
    const sp=ST.spark[p.id]||{n:0,why:[]};

    /* 오늘 마음에 안 들었던 것 — 하나만 잡는다 */
    let gripe=null;
    if(!played && !ST.injury[p.id] && !(ST.absent&&ST.absent[p.id])) gripe='벤치';
    else if(played && order[p.id]>=7 && effCA(p.id)>=45) gripe='하위타순';
    else if(played && ctx.blowout && sp.n>=1) gripe='대패';   // 대패는 이미 쌓인 게 있는 사람만 건드린다

    /* 연속 결장 누적 — 불씨와 별개로 도는 원래 규칙.
       불씨 쪽에서 터지는 길이 생겼으니 이쪽은 한 박자 느리게 잡는다. */
    if(played||ST.injury[p.id]){ u.streak=0; if(u.level>0&&Math.random()<0.4)u.level--; }
    else {
      u.streak++;
      const th=m.traits.includes('불만러')?3:(m.born>=2000?4:5);
      if(u.streak>=th){ u.level=Math.min(4,u.level+1); u.streak=0; }
    }

    if(gripe){
      sp.n=Math.min(6,sp.n+1);
      const i=sp.why.indexOf(gripe); if(i>=0)sp.why.splice(i,1);
      sp.why.push(gripe); if(sp.why.length>3)sp.why=sp.why.slice(-3);
    } else if(sp.n>0 && played && Math.random()<0.4){
      sp.n--;                                     // 제대로 쓰이면 조용히 가라앉는다
      if(sp.n<=0)sp.why=[];
    }

    const fuse=sparkFuse(p.id);
    if(gripe && sp.n>=fuse){
      /* 터진다 */
      const jump=sp.n>=fuse+2?2:1;
      u.level=Math.min(4,u.level+jump);
      ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-12);
      const pool=BLOWUP_LINES[gripe]||BLOWUP_LINES['벤치'];
      const pair=pickOne(pool);
      msgs.push({who:p.id,type:'talk',text:sayTo(p.id,meId,pair[0],pair[1]),mood:'angry'});
      msgs.push({who:p.id,type:'notice',
        text:`${p.name} 불만 폭발 — ${unhappyLabel(u.level)}\n쌓여 있던 것: ${sparkLabel(sp)||'—'}`});
      sp.n=0; sp.why=[];
    } else if(gripe && sp.n>=2 && Math.random()<0.45){
      /* 아직 참는 중 — 한마디만 흘린다 */
      const pool=GRUMBLE_LINES[gripe]||GRUMBLE_LINES['벤치'];
      const pair=pickOne(pool);
      msgs.push({who:p.id,type:'talk',text:sayTo(p.id,meId,pair[0],pair[1]),mood:'flat'});
    }

    ST.unhappy[p.id]=u; ST.spark[p.id]=sp;
  });
  return msgs;
}

/* 이 선수가 이번 주에 어떤 식으로 괴롭힐지 */
function sabotage(ST, pid, rng){
  const u=ST.unhappy&&ST.unhappy[pid];
  if(!u||u.level<2)return null;
  const m=META[pid]||{traits:[]};
  const r=rng||Math.random;
  const lv=u.level;
  const acts=[];
  /* 보이콧 — 3단계부터. 4단계면 확 올라간다 */
  if(lv>=3 && r() < (lv>=4?0.42:0.20)) acts.push('boycott');
  /* 카풀 거부 — 차 있는 사람만 */
  if(lv>=3 && m.car && r()<0.35) acts.push('carpool');
  /* 장비 방치 */
  if(lv>=3 && (m.traits||[]).includes('장비담당') && r()<0.40) acts.push('gear');
  /* 분석 거부 */
  if(lv>=2 && (m.traits||[]).includes('분석가') && r()<0.45) acts.push('scout');
  /* 단톡방 저격 — 2단계부터 */
  if(lv>=2 && r() < (lv>=3?0.45:0.25)) acts.push('snipe');
  return acts.length?acts:null;
}

/* 주간 이벤트에 불만 행동을 얹는다 */
function rollSabotage(ST, evts, rng){
  const us=TBYID['wwzw'];
  /* 보이콧이 한 주에 여러 명 겹치면 9명을 못 채워서 게임이 막힌다.
     괴롭히되 못 하게 만들지는 않는다 — 무단 결장은 주당 한 명까지. */
  let boycotted=false;
  const healthy=us.players.filter(p=>!isMerc(p.id)&&!ST.injury[p.id]).length;
  us.players.forEach(p=>{
    if(isMerc(p.id))return;
    if(ST.injury[p.id])return;
    let acts=sabotage(ST,p.id,rng);
    if(!acts)return;
    acts=acts.filter(a=>{
      if(a!=='boycott')return true;
      if(boycotted||healthy<=10)return false;   // 인원이 빠듯하면 안 터진다
      boycotted=true; return true;
    });
    acts.forEach(a=>{
      if(a==='boycott') evts.push({type:'boycott',pid:p.id,
        title:`${p.name} 무단 결장`,
        body:sayTo(p.id,ST.playerId||MYID,...pickOne(SABO_BOYCOTT,rng)),
        effect:'출전 불가 · 전원 사기 하락'});
      else if(a==='carpool') evts.push({type:'nocar',pid:p.id,
        title:`${p.name} 카풀 거부`,
        body:sayTo(p.id,ST.playerId||MYID,...pickOne(SABO_CARPOOL,rng)),
        effect:'태워 오던 사람들이 못 올 수 있다'});
      else if(a==='gear') evts.push({type:'nogear',pid:p.id,
        title:`${p.name} 장비 안 챙김`,
        body:sayTo(p.id,ST.playerId||MYID,...pickOne(SABO_GEAR,rng)),
        effect:'포수 장비 없음'});
      else if(a==='scout') evts.push({type:'noscout',pid:p.id,
        title:`${p.name} 분석 거부`,
        body:sayTo(p.id,ST.playerId||MYID,'스카우팅 안 한다. 알아서 해라','스카우팅 안 합니다. 알아서 하세요'),
        effect:'상대 정보 없음'});
      else if(a==='snipe') evts.push({type:'snipe',pid:p.id,
        title:`${p.name} 단톡방 저격`,
        body:sayTo(p.id,ST.playerId||MYID,...pickOne(SABO_SNIPE,rng)),
        effect:'전원 사기 하락 · 주변 선동'});
    });
  });
}

/* 최후통첩과 이탈.
   4단계에 도달하면 카운트다운이 돈다. 안 풀면 진짜 나간다.       */
function tickUltimatum(ST){
  const us=TBYID['wwzw'];
  const msgs=[];
  if(!ST.ultimatum)ST.ultimatum={};
  us.players.forEach(p=>{
    if(isMerc(p.id))return;
    const u=ST.unhappy&&ST.unhappy[p.id];
    const lv=u?u.level:0;
    if(lv>=4){
      if(ST.ultimatum[p.id]==null){
        ST.ultimatum[p.id]=3;
        msgs.push({who:p.id,text:sayTo(p.id,ST.playerId||MYID,...pickOne(ULTIMATUM)),mood:'angry'});
        msgs.push({who:'lg',type:'notice',
          text:`${p.name} 최후통첩 — 3경기 안에 못 풀면 팀을 나간다`});
      } else {
        ST.ultimatum[p.id]--;
        if(ST.ultimatum[p.id]<=0){
          msgs.push({who:p.id,text:sayTo(p.id,ST.playerId||MYID,...pickOne(LEAVE_LINE)),mood:'angry'});
          msgs.push(...leaveTeam(ST,p.id));
          return;
        }
        msgs.push({who:'lg',type:'notice',
          text:`${p.name} 남은 기회 ${ST.ultimatum[p.id]}경기`});
      }
    } else if(ST.ultimatum[p.id]!=null && lv<=2){
      delete ST.ultimatum[p.id];
      msgs.push({who:'lg',type:'notice',text:`${p.name} 이탈 얘기는 일단 들어갔다`});
    }
  });
  return msgs;
}

/* 진짜로 팀을 나간다 */
function leaveTeam(ST, pid){
  const us=TBYID['wwzw'];
  const nm=nameOf(pid);
  const msgs=[];
  const i=us.players.findIndex(p=>p.id===pid);
  if(i<0)return msgs;
  const m=META[pid]||{friends:[]};
  us.players.splice(i,1);
  if(ST.lineup)ST.lineup=ST.lineup.filter(s=>s.id!==pid);
  if(ST.lineup&&ST.lineup.length<9&&us.players.length>=9)ST.lineup=recommendLineup();
  if(ST.rotation)ST.rotation=ST.rotation.filter(x=>x!==pid);
  if(ST.rotation&&!ST.rotation.length)ST.rotation=recommendRotation();
  delete ST.unhappy[pid]; if(ST.ultimatum)delete ST.ultimatum[pid];
  if(ST.spark)delete ST.spark[pid];
  if(ST.promise)delete ST.promise[pid];
  finalizeTeam(us); buildPitcherPool();
  /* 남은 사람들이 흔들린다. 친했던 사람은 더 크게. */
  us.players.forEach(q=>{
    const close=(m.friends||[]).includes(q.id);
    ST.morale[q.id]=Math.max(10,(ST.morale[q.id]||70)-(close?16:8));
    if(close) addSpark(ST,q.id,'이탈',1);
  });
  ST.leftPlayers=ST.leftPlayers||[];
  ST.leftPlayers.push({pid,name:nm,round:ST.round,season:ST.seasonNo||1});
  msgs.push({who:'lg',type:'notice',
    text:`${nm} 팀 이탈\n로스터 ${us.players.length}명\n전원 사기 하락 · 친했던 선수는 더 크게 흔들린다`});
  return msgs;
}

    {t:'상대 전날 회식',b:'상대가 어제 회식을 했다는 얘기가 돈다.',eff:{oppB:-0.09,oppE:1.15}},

  const e=pickOne(pool,rng);
  return {title:`상대 정보 · ${e.t}`,body:e.b,eff:e.eff,team:opp.name};
}

/* ================= 카톡: 경기 전 ================= */

const BANTER_IDS=['ksh','khg'];
const BANTER=[
  '오늘 이길듯? 지면 똥무께',
  '느낌 좋다 오늘 3안타 침 ㅇㅇ',
  '지면 내가 밥 산다 근데 안 짐',
  '오늘 안타 못 치면 걸어서 집 감',
  '나 오늘 폼 미쳤음 ㄹㅇ',
  '상대 투수 누구임 그냥 다 침',
  '오늘 홈런 하나 침 ㅇㅇ 봐라',
  '3타수 3안타 예약함',
  '오늘 도루 3개 함 ㄱㄱ',
  '이거 지면 진짜 말 안 함',
  '아 오늘 진짜 각인데',
  '나 오늘 안타 못 치면 은퇴함',
  '오늘 이기면 내가 아이스크림 쏨',
  '지면 똥무께 ㄹㅇ로',
  '오늘 우리가 이김 ㅇㅇ 확정',
];
/* 지고 있거나 컨디션이 나쁠 때 쓰는 버전 */
const BANTER_LOW=[
  '몸이 좀 무거운데 그래도 이김 ㅇㅇ',
  '컨디션 별로긴 한데 뭐 어차피 침',
  '오늘 좀 애매한데 일단 가봄',
  '어제 잠을 못 잤는데 안타는 침',
];
const BANTER_HOT=[
  '나 지금 손 뜨거움 만지지 마셈',
  '요새 뭘 해도 맞음 ㄹㅇ',
  '오늘도 그냥 침 ㅇㅇ',
];
const BANTER_COLD=[
  '아 방망이가 왜 이러냐 진짜',
  '오늘은 하나만 치자 하나만',
  '슬럼프 온 듯 근데 오늘 깸',
];

function buildKakaoPre(ST){
  const us=TBYID['wwzw'];
  const msgs=[];
  const rng=Math.random;
  /* 방어: 주간 처리를 건너뛴 상태에서도 안전하게 동작해야 한다 */
  if(!ST.buff)ST.buff={};
  if(!ST.absent)ST.absent={};
  if(!ST.pendingAbsent)ST.pendingAbsent={};
  if(!ST.injury)ST.injury={};
  if(!ST.unhappy)ST.unhappy={};
  if(!ST.lastOrder)ST.lastOrder={};
  if(!ST.dropouts)ST.dropouts=[];
  resolveStarterField();          // 발표 전에 투수/야수 중복을 없앤다
  const idx=id=>ST.lineup.findIndex(s=>s.id===id);
  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const opp=TBYID[ST.schedule[ST.round].opp];
  const wx=WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0];

  msgs.push({who:'lg',type:'notice',text:
    `${opp.name}전 · ${park.name} · ${wx.name}\n\n`+
    ST.lineup.map((s,i)=>{
      const n=jerseyNo(s.id);
      return `${i+1}. ${n!=null?n+' ':''}${nameOf(s.id)} (${POSNAMES[s.pos]})`;
    }).join('\n')+
    `\n선발 ${nameOf((gameRotation()||[])[0]||ST.rotation[0])}`});

  if(ST.gearLevel===2){
    uniqPush(msgs,{who:'lg',text:'미안하다 포수 장비 내 차에 있는데 오늘 못 간다',mood:'sad'});
    const c=ST.lineup.find(s=>s.pos==='C');
    if(c)uniqPush(msgs,{who:c.id,text:say(c.id,'장비 없이 어떻게 앉냐','장비 없이 어떻게 앉나요...'),mood:'angry'});
  } else if(ST.gearLevel===1){
    uniqPush(msgs,{who:'lg',text:'레그가드 빼먹었다 미안',mood:'sad'});
  }
  if(ST.mittMissing)uniqPush(msgs,{who:'yjh',text:'미트 또 두고 왔다 ㅋㅋ 글러브로 볼게',mood:'flat'});

  us.players.forEach(p=>{
    const inj=ST.injury[p.id], abs=ST.absent&&ST.absent[p.id];
    if(inj)uniqPush(msgs,{who:p.id,text:say(p.id,
      pickOne([`${inj.name} 때문에 오늘 못 나간다 미안`,`${inj.name} 아직 안 나았다`,`${inj.name}이라 이번엔 쉴게`],rng),
      pickOne([`${inj.name} 때문에 오늘 못 갑니다 죄송합니다`,`${inj.name}이 아직 안 나았습니다`,`${inj.name}이라 이번엔 쉬겠습니다`],rng)),mood:'sad'});
    else if(abs)uniqPush(msgs,{who:p.id,text:say(p.id,
      pickOne(['오늘 일 있어서 못 간다 미안','미안하다 오늘은 못 갈 것 같다','이번 주는 빠질게 미안',
        '이번엔 못 간다 미안하다','다음 주엔 꼭 갈게','일정이 겹쳤다 미안'],rng),
      pickOne(['죄송합니다 오늘 개인 사정으로 못 갑니다','죄송합니다 이번 주는 못 갈 것 같습니다',
        '일이 생겨서 못 갑니다 죄송합니다','이번엔 못 갈 것 같습니다','다음 주엔 꼭 가겠습니다',
        '일정이 겹쳤습니다 죄송합니다'],rng)),mood:'sad'});
  });

  /* 김선호·김한규의 출사표 — 라인업에 들었으면 높은 확률로 한마디 한다 */
  BANTER_IDS.forEach(bid=>{
    if(!us.players.some(x=>x.id===bid))return;
    if(!isAvailable(bid))return;
    if(idx(bid)<0)return;
    if(rng()>=0.62)return;
    const tag=formTag(bid);
    let pool=BANTER;
    if(tag===FORM_HOT)pool=BANTER_HOT.concat(BANTER);
    else if(tag===FORM_COLD)pool=BANTER_COLD.concat(BANTER);
    else if((ST.cond[bid]||70)<48)pool=BANTER_LOW;
    uniqPush(msgs,{who:bid,text:pickOne(pool,rng),mood:'happy'});
  });

  const avail=us.players.filter(p=>isAvailable(p.id)).length;
  if(avail===9)uniqPush(msgs,{who:'lg',text:'딱 9명이다. 아무도 빠지지 마라',mood:'flat'});
  else if(avail<9)uniqPush(msgs,{who:'lg',text:`${avail}명밖에 안 된다. 이대로면 몰수패다`,mood:'angry'});

  const cp2=ST.carpool||resolveCarpool(ST);
  cp2.rides.forEach(r=>{
    if(!r.riders.length)return;
    if(r.replaced){
      // 배차가 바뀐 건 알려야 하니 높은 확률
      if(rng()<0.85) uniqPush(msgs,{who:r.driver,text:say(r.driver,
        pickOne([`${nameOf(r.origin)} 못 온대서 내가 ${r.riders.map(nameOf).join(', ')} 태우고 간다`,
          `오늘은 내가 태우고 갈게`,`${nameOf(r.origin)} 빠져서 내 차로 간다`],rng),
        pickOne([`${nameOf(r.origin)}님 못 오셔서 제가 태우고 가겠습니다`,
          `오늘은 제 차로 가겠습니다`],rng)),mood:'ok'});
    } else if(rng()<0.20){
      // 평상시 배차는 굳이 매번 말 안 한다
      uniqPush(msgs,{who:r.driver,text:say(r.driver,
        pickOne(['늦지 마라 기다린다','평소대로 간다','30분 전에 나와라','출발한다'],rng),
        pickOne(['평소대로 가겠습니다','시간 맞춰 가겠습니다','출발하겠습니다'],rng)),mood:'ok'});
    }
  });
  (cp2.stranded||[]).forEach(id=>{
    uniqPush(msgs,{who:id,text:say(id,'나 오늘 차 없는데 누가 좀 태워줘라','저 오늘 차가 없는데 태워주실 분 있나요'),mood:'sad'});
  });

  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||!isAvailable(p.id))return;
    const i=idx(p.id);
    const prev=ST.lastOrder?ST.lastOrder[p.id]:null;
    const jon=speechOf(p.id)==='jon';
    const un=(ST.unhappy&&ST.unhappy[p.id])?ST.unhappy[p.id].level:0;

    if(i<0){
      if(m.traits.includes('불만러')){
        uniqPush(msgs,{who:p.id,text:pickOne([
          '또 벤치네 ㅋ 알겠다','내가 뭘 잘못했는지 모르겠는데','이럴 거면 왜 부르냐',
          '분석은 내가 다 하는데','ㅇㅋ 구경이나 할게','언제까지 이럴 거냐'],rng),mood:'angry'});
        ST.morale[p.id]=Math.max(15,ST.morale[p.id]-12);
      } else if(un>=2){
        uniqPush(msgs,{who:p.id,text:jon?pickOne(['저는 계속 벤치인가요?','언제쯤 나갈 수 있을까요'],rng)
          :pickOne(['나 계속 벤치냐','언제 나가냐 진짜'],rng),mood:'angry'});
        ST.morale[p.id]=Math.max(15,ST.morale[p.id]-9);
      } else if(rng()< (m.traits.includes('과묵')?0.06:0.32)){
        uniqPush(msgs,{who:p.id,text:jon
          ?pickOne(['넵 준비하고 있겠습니다','대기하겠습니다','언제든 말씀하세요','넵 벤치에 있겠습니다',
            '몸은 풀어두겠습니다','필요하면 부르세요','응원하겠습니다','대타라도 준비하겠습니다',
            '오늘은 구경만 하겠습니다','다음엔 기회 주세요'],rng)
          :pickOne(['ㅇㅋ 대기할게','알겠다','부르면 나간다','벤치냐 ㅋㅋ 알겠다',
            '몸은 풀어둔다','필요하면 불러라','응원이나 할게','대타라도 준비할게',
            '오늘은 구경이다','다음엔 좀 넣어줘라'],rng),mood:'flat'});
        ST.morale[p.id]=Math.max(20,ST.morale[p.id]-4);
      }
      return;
    }
    const drop=prev!=null?i-prev:0;
    if(drop>=3){
      if(m.traits.includes('불만러')){
        uniqPush(msgs,{who:p.id,text:`왜 나 ${i+1}번임? 저번엔 ${prev+1}번이었는데`,mood:'angry'});
        ST.morale[p.id]=Math.max(15,ST.morale[p.id]-15);
      } else if(rng()<0.55){
        uniqPush(msgs,{who:p.id,text:jon
          ?pickOne([`${i+1}번이요? 알겠습니다...`,'제가 요즘 안 맞긴 했죠','더 잘하겠습니다','넵...',
            `${i+1}번이면 뭐 그것도 나쁘진 않죠`,'밑에서 조용히 치겠습니다','올라갈 수 있게 해보겠습니다'],rng)
          :pickOne([`나 ${i+1}번이야? ㅋㅋ 알겠다`,'요즘 안 맞긴 하지','뭐 알겠다','ㅋㅋ ㅇㅋ',
            `${i+1}번도 뭐 나쁘진 않지`,'밑에서 조용히 친다','다시 올라간다 두고 봐라'],rng),mood:'flat'});
        ST.morale[p.id]=Math.max(20,ST.morale[p.id]-(jon?8:5));
      }
    } else if(drop<=-3){
      uniqPush(msgs,{who:p.id,text:say(p.id,`${i+1}번 고맙다 잘해볼게`,`${i+1}번 감사합니다 잘해보겠습니다`),mood:'happy'});
      ST.morale[p.id]=Math.min(100,ST.morale[p.id]+8);
    } else if(ST.cond[p.id]<45){
      const LOWB=['컨디션이 좀 별론데 나갈게','몸이 좀 무겁다','어제 잠을 못 잤다',
        '오늘 살살 하자','일단 나가보고 안 되면 빼줘','허리가 좀 뻐근하네',
        '다리가 안 올라간다','어깨가 좀 뻐근한데 던질 수는 있다','몸살 기운이 있다',
        '어제 무리했나 보다','일단 뛰어는 본다','파스 붙이고 왔다'];
      const LOWJ=['컨디션이 좀 안 좋은데 나가겠습니다','몸이 좀 무겁습니다','어제 잠을 못 잤습니다',
        '일단 나가보겠습니다','안 되면 빼주세요','몸이 덜 풀렸습니다',
        '다리가 잘 안 올라갑니다','어깨가 뻐근한데 던질 수는 있습니다','몸살 기운이 있습니다',
        '어제 무리했나 봅니다','일단 뛰어보겠습니다','파스 붙이고 왔습니다'];
      uniqPush(msgs,{who:p.id,text:pickOne(jon?LOWJ:LOWB,rng),mood:'flat'});
    } else if(rng()< (m.traits.includes('과묵')?0.04:0.20)){
      const BAN=['ㅇㅋ','오늘 이기자','늦지들 마라','ㄱㄱ','ㅇㅇ','간다','몇 시까지지',
        '오늘 날씨 좋네','그라운드 상태 어떻냐','배트 하나 빌려줄 사람','스파이크 챙겼나',
        '오늘 심판 누구냐','물 좀 사갈게','ㅇㅋㅇㅋ',
        '아침에 일어나기 싫었다','커피 하나 사간다','오늘 몸이 좀 가볍네','장갑 두고 온 것 같은데',
        '주차 자리 있냐','오늘 몇 명 오냐','언더셔츠 챙겼나','어제 잠을 설쳤다',
        '아 오늘 진짜 하기 싫었는데 왔다','도착했다','거의 다 왔다','조금 늦을 것 같다',
        '스트레칭 좀 하고 시작하자','오늘 상대 어떤 팀이지','작년에 붙어본 팀인가',
        '나 배고픈데 끝나고 뭐 먹냐','헬멧 누가 챙겼냐','공 몇 개 있냐','오늘 바람 좀 부네',
        '몸 좀 풀고 있어라','손목이 좀 뻐근한데 괜찮다','오늘 잘 부탁한다'];
      const JON=['넵','알겠습니다','오늘 잘해보겠습니다','ㅇㅋ입니다','넵 가겠습니다',
        '몇 시까지 가면 되나요','오늘 잘 부탁드립니다','일찍 가서 몸 풀겠습니다',
        '커피 사갈까요','주차 자리 있나요','오늘 몇 분 오시나요','거의 다 왔습니다',
        '조금 늦을 것 같습니다 죄송합니다','도착했습니다','스트레칭하고 있겠습니다',
        '오늘 상대 어떤 팀인가요','공 챙겨갈까요','끝나고 뭐 드시나요','언더셔츠 챙겼습니다',
        '어제 잠을 좀 설쳤는데 괜찮습니다','오늘 바람이 좀 부네요','몸 풀고 있겠습니다',
        '물 좀 사가겠습니다','배트 빌릴 수 있을까요','넵넵'];
      uniqPush(msgs,{who:p.id,text:pickOne(jon?JON:BAN,rng),mood:'ok'});
    }
  });

  if(ST.justDischarged){
    uniqPush(msgs,{who:'sjm',text:'전역했습니다. 다시 잘 부탁드립니다',mood:'happy'});
    uniqPush(msgs,{who:'swm',text:'왔냐 ㅋㅋ 이제 좀 쉬겠네',mood:'happy'});
    uniqPush(msgs,{who:'lg',text:'정민이 돌아왔다. 마운드 숨통 트인다',mood:'happy'});
    ST.justDischarged=false;
  }
  if(ST.calendar&&(ST.calendar.holiday==='광복절'||ST.calendar.holiday==='현충일')&&isAvailable('ksw')){
    uniqPush(msgs,{who:'ksw',text:pickOne([
      `오늘 ${ST.calendar.holiday}입니다. 각 잡고 하겠습니다`,
      `${ST.calendar.holiday}이라 오늘은 좀 다릅니다`,
      '오늘만큼은 제대로 하겠습니다'],rng),mood:'happy'});
    if(rng()<0.45)uniqPush(msgs,{who:pickOne(['jms','lg','swm'],rng),
      text:pickOne(['선우 오늘 눈빛 다르다 ㅋㅋ','오늘 선우 믿는다','ㅋㅋ 각 잡혔네'],rng),mood:'happy'});
  }

  /* 분석가 */
  const an=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('분석가')&&isAvailable(p.id));
  if(an){
    const un=(ST.unhappy&&ST.unhappy[an.id])?ST.unhappy[an.id].level:0;
    if(ST.scoutBlocked||un>=3){
      uniqPush(msgs,{who:an.id,text:'이번엔 분석 안 했다. 알아서들 해라',mood:'angry'});
      ST.oppEvent=null;
    } else {
      if(rng()<0.22){
        uniqPush(msgs,{who:an.id,text:pickOne([
          `${park.name}은 ${park.note}`,
          `오늘 ${park.name}이다. ${park.note}`,
          `${park.note}. 참고해라`],rng),mood:'ok'});
      }
      if(ST.oppEvent&&rng()<0.75)uniqPush(msgs,{who:an.id,text:ST.oppEvent.body,mood:'ok'});
      // 안산유나이티드전이면 고진선을 미리 경고한다.
      // 김한규가 언해피 3단계 이상이면 분석 자체를 안 하므로 이 정보도 못 본다.
      if(opp.id==='ansanutd')
        uniqPush(msgs,{who:an.id,text:pickOne(GOJIN_SCOUT,rng),mood:'ok'});
      if(rng()<0.18){
        uniqPush(msgs,{who:an.id,text:pickOne([
          '상대 선발 볼넷 많다. 좀 봐도 된다',
          '상대 포수 어깨 약하다. 뛰어도 된다',
          '오늘 상대 4번 조심해라',
          '상대 수비 실책 많은 팀이다. 발 쓰자'],rng),mood:'ok'});
      }
    }
  }

  /* 친분 연쇄 */
  applyFriendship(ST);

  /* 형제 */
  const bro=rollBrotherEvent(ST,rng);
  ST.feud=null; ST.broGood=false;
  if(bro&&bro.kind==='good'){
    ST.broGood=true;
    bro.lines.forEach(([w,t])=>uniqPush(msgs,{who:w,text:t,mood:'happy'}));
    us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+9));
    ST.buff['kig']={all:1.08,label:'형제의 날'};
    ST.buff['khg']={all:1.08,label:'형제의 날'};
  } else if(bro&&bro.kind==='bad'){
    ST.feud=bro;
    bro.lines.forEach(([w,t])=>uniqPush(msgs,{who:w,text:t,mood:'angry'}));

    /* 중재 — 매번 다른 사람이 다른 말로 */
    const mediators=us.players.filter(p=>p.id!=='kig'&&p.id!=='khg'&&isAvailable(p.id));
    const shuffled=shuffled_(mediators,rng);
    const nMed=1+((rng()*2)|0);                       // 1~2명만 반응
    const MED_BAN=['또 시작이네 ㅋㅋ','둘이 나가서 하고 와라','밥이나 먹고 하자',
      '단톡 알림 좀 꺼야겠다','형제끼리 왜 그러냐','조용히 좀 해라 진짜',
      '이거 몇 번째냐','경기나 하자 제발'];
    const MED_JON=['또 시작이네요 ㅎㅎ','두 분 진정하시죠','밥 먹고 얘기하시죠',
      '알림 좀 꺼두겠습니다','형제끼리 왜 그러세요','경기 앞두고 이러지 마시죠',
      '이거 몇 번째인가요','좀 있다 얘기하시죠'];
    shuffled.slice(0,nMed).forEach(p=>{
      /* [버그 이력] 여기서 speechTo(p.id,'kig') 로 말투를 정하고 있었다.
         김인규는 00년생이라 동갑인 00년생들은 반말 판정이 났는데,
         이 말은 김인규한테가 아니라 단톡방 전체에 하는 말이다.
         그래서 00년생이 99년생 형들 앞에서 반말을 쓰는 꼴이 됐다.
         (이승민(00) 이 이민혁(99) 앞에서 반말하던 게 이것) */
      const jon = speechOf(p.id)!=='ban';
      uniqPush(msgs,{who:p.id,text:pickOne(jon?MED_JON:MED_BAN,rng),mood:'flat'});
    });

    /* 감독은 확률적으로만 개입 */
    if(rng()<0.45&&isAvailable('lg')){
      uniqPush(msgs,{who:'lg',text:pickOne([
        '둘 다 그만해라. 한 번만 더 하면 둘 다 뺀다',
        '경기 앞두고 뭐 하는 거냐 진짜',
        '오늘 둘이 따로 앉아라'],rng),mood:'angry'});
    }
    /* 에이스도 확률적으로 */
    if(rng()<0.35&&isAvailable('swm')){
      uniqPush(msgs,{who:'swm',text:pickOne(['적당히들 해라 진짜','그만하고 몸이나 풀어라'],rng),mood:'angry'});
    }

    /* 이탈 — 고정 2명이 아니라 사기 낮은 사람 중 확률적으로 */
    const fedUp=mediators
      .filter(p=>ST.morale[p.id]<72)
      .sort((a,b)=>ST.morale[a.id]-ST.morale[b.id]);
    if(fedUp.length&&rng()<0.55){
      const q=fedUp[0];
      uniqPush(msgs,{who:q.id,text:say(q.id,
        pickOne(['나 이런 분위기면 다음 경기 안 나간다','진짜 정 떨어지네','다음 주엔 빠질게'],rng),
        pickOne(['이런 분위기면 저 다음 경기 안 나가겠습니다','좀 힘드네요...','다음 주는 빠지겠습니다'],rng)),
        mood:'angry'});
      ST.pendingAbsent=ST.pendingAbsent||{};
      ST.pendingAbsent[q.id]='형제 싸움에 질려서';
      ST.morale[q.id]=Math.max(10,ST.morale[q.id]-14);
    }
    us.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-4));
    if(bro.battery){ ST.buff['kig']={all:0.90,label:'배터리 불화'};
      ST.buff['khg']={all:0.88,label:'배터리 불화'}; }
  }

  const avgM=us.players.reduce((s,p)=>s+ST.morale[p.id],0)/us.players.length;
  if(avgM<60){
    const ld=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('리더')&&isAvailable(p.id));
    if(ld){ uniqPush(msgs,{who:ld.id,text:'단톡에서 그만하고 경기장에서 얘기하자',mood:'ok'});
      us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+6)); }
  }

  /* 번복 불참 — 라인업 발표 뒤에 갑자기 못 온다는 사람 */
  ST.dropouts=[];
  const DROP_COMMON=[
    ['갑자기 회사에서 호출 왔다','회사에서 갑자기 호출이 왔습니다'],
    ['어제 마신 게 아직 안 깼다','어제 마신 게 아직 안 깨서요...'],
    ['허리가 삐끗했다','허리를 삐끗했습니다'],
    ['여자친구가 화났다','여자친구가 화가 나서...'],
    ['늦잠 잤다 미안하다','늦잠 잤습니다 죄송합니다'],
    ['배탈났다','배탈이 났습니다'],
    ['갑자기 일이 생겼다','갑자기 일이 생겼습니다'],
  ];
  const DROP_CAR=[['차가 시동이 안 걸린다','차 시동이 안 걸립니다']];
  const DROP_KSW=[['부대에서 비상 걸렸다','부대에서 비상이 걸렸습니다'],
    ['갑자기 당직으로 바뀌었다','갑자기 당직으로 바뀌었습니다']];
  ST.lineup.slice().forEach(sl=>{
    const p=us.players.find(x=>x.id===sl.id); if(!p)return;
    const mm=META[p.id]; if(!mm)return;
    const att=mm.attend!=null?mm.attend:0.85;
    const dp=Math.max(0.01,Math.min(0.12,(1-att)*0.20));
    if(rng()<dp){
      const pool2 = p.id==='ksw' ? DROP_KSW
        : (mm.car ? DROP_COMMON.concat(DROP_CAR) : DROP_COMMON);
      const r=pickOne(pool2,rng);
      uniqPush(msgs,{who:p.id,text:say(p.id,r[0],r[1]),mood:'sad'});
      ST.dropouts.push(p.id);
      ST.absent[p.id]='갑자기 못 온다고 함';
      ST.morale[p.id]=Math.max(10,ST.morale[p.id]-3);
    }
  });
  if(ST.dropouts.length){
    const remain=us.players.filter(x=>isAvailable(x.id)).length;
    uniqPush(msgs,{who:'lg',text:pickOne([
      '아 진짜 라인업 다시 짜야겠네',
      '발표하자마자 이러면 어떡하냐',
      remain+'명 남았다. 라인업 다시 본다'],rng),mood:'angry'});
    if(remain<=9&&isAvailable('swm'))
      uniqPush(msgs,{who:'swm',text:'인원 빠듯하다. 아무도 더 빠지지 마라',mood:'flat'});
  }

  ST.lastOrder={};
  ST.lineup.forEach((s,i)=>ST.lastOrder[s.id]=i);
  return msgs;
}

     desc:'훈련을 수비로 고정 · 사기 소폭 하락',
     run:()=>{ ST.trainFocus='field';
       us.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-3));

    {id:'scold',label:T('오늘 집중력이 없었어요','오늘 집중력이 없었다'),
     desc:'전원 사기 하락 · 예민한 선수는 크게 삐진다',
     run:()=>{ us.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-7));
       const c=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('불만러'));
       if(c&&ST.unhappy&&ST.unhappy[c.id])ST.unhappy[c.id].level=Math.min(4,ST.unhappy[c.id].level+1);
       return react('scold'); }},
    {id:'quiet2',label:'조용히 넘어간다',desc:'변화 없음',run:()=>[]},
  ];
  if(ST.canParty&&!ST.partyDone){
    opts.unshift({id:'party',label:T('오늘 회식 가시죠','오늘 회식 가자'),
      desc:`운영비 ${PARTY_COST}만원 · 사기 크게 상승 · 컨디션 하락 · 갈등 해소 가능`,
      run:null,action:'party'});
  }
  return opts;
}

/* 그날 있었던 일을 읽어서 카톡 줄을 만든다 */
function postFlavor(ST,res,usSide,thSide,uSlots,msgs){
  const us=TBYID['wwzw'], rng=Math.random;
  const won=usSide.runs>thSide.runs, tie=usSide.runs===thSide.runs;
  const diff=Math.abs(usSide.runs-thSide.runs);
  const speak=(id,pair,mood)=>{ if(!id||!isAvailable(id))return;
    uniqPush(msgs,{who:id,text:say(id,pair[0],pair[1]),mood:mood||'flat'}); };
  const anyone=(ex)=>{ const c=us.players.filter(p=>isAvailable(p.id)&&!isMerc(p.id)&&p.id!==ex);
    return c.length?pickOne(c,rng).id:null; };

  /* 1. 경기 내용 */
  let pool=null, mood='flat';
  if(res.mercy) { pool = won?POST_MERCY_WIN:POST_MERCY_LOSS; mood=won?'happy':'sad'; }
  else if(won && diff>=7){ pool=POST_BIGWIN; mood='happy'; }
  else if(won && diff<=2){ pool=POST_CLOSEWIN; mood='happy'; }
  else if(!won && !tie && diff>=8){ pool=POST_BLOWOUT; mood='sad'; }
  else if(!won && !tie && diff<=2){ pool=POST_CLOSELOSS; mood='sad'; }
  if(pool) speak(anyone(), pickOne(pool,rng), mood);

  /* 2. 역전승 — 중간에 뒤지고 있었는지 이닝별 득점으로 본다 */
  if(won && Array.isArray(usSide.line) && Array.isArray(thSide.line)){
    let u=0,t=0,behind=false;
    for(let i=0;i<Math.max(usSide.line.length,thSide.line.length);i++){
      u+=(usSide.line[i]||0); t+=(thSide.line[i]||0);
      if(t-u>=3) behind=true;
    }
    if(behind) speak(anyone(), pickOne(POST_COMEBACK,rng), 'happy');
  }

  /* 3. 개인 성적 */
  uSlots.forEach(sl=>{
    const b=res.box&&res.box[sl.id]; if(!b)return;
    if(b.hr>=1 && rng()<0.9) speak(sl.id, pickOne(POST_HR,rng), 'happy');
    else if(b.h>=3 && rng()<0.7) speak(sl.id, pickOne(POST_MULTI,rng), 'happy');
    else if(b.ab>=3 && b.h===0 && rng()<0.35) speak(sl.id, pickOne(POST_HITLESS,rng), 'sad');
    if(b.sb>=2 && rng()<0.6) speak(sl.id, pickOne(POST_SB,rng), 'happy');
  });
  if((usSide.errs||0)>=3){
    const f=uSlots.filter(x=>isAvailable(x.id));
    if(f.length) speak(pickOne(f,rng).id, pickOne(POST_ERR,rng), 'sad');
  }

  /* 4. 투수 */
  (ST.gameRotation||[]).forEach(pid=>{
    const l=res.pbox&&res.pbox[pid]; if(!l||l.outs<6)return;
    const free=(l.bb||0)+(l.hbp||0);
    if(l.er<=1 && free<=3 && rng()<0.85) speak(pid, pickOne(POST_GEM,rng), 'happy');
    else if(free>=6 && rng()<0.8) speak(pid, pickOne(POST_WILD,rng), 'sad');
  });

  /* 5. 연승·연패 */
  const done=ST.schedule.filter(x=>x.played&&x.result);
  if(done.length>=3){
    const last3=done.slice(-3);
    const allW=last3.every(x=>x.result.us>x.result.them);
    const allL=last3.every(x=>x.result.us<x.result.them);
    const ldr=us.players.find(p=>META[p.id]&&(META[p.id].traits||[]).includes('리더')&&isAvailable(p.id));
    if(allW) speak(ldr?ldr.id:anyone(), pickOne(POST_STREAK_W,rng), 'happy');
    else if(allL) speak(ldr?ldr.id:anyone(), pickOne(POST_STREAK_L,rng), 'angry');
  }

  /* 6. 날씨 */
  const w=POST_WX[ST.weather];
  if(w && rng()<0.45) speak(anyone(), w, 'flat');

  /* 7. 폼이 바뀐 사람의 한마디 */
  us.players.forEach(p=>{
    if(!isAvailable(p.id))return;
    const t=formTag(p.id);
    if(t===FORM_HOT && rng()<0.20)
      speak(p.id, ['요새 진짜 뭘 해도 맞는다','요새 진짜 뭘 해도 맞습니다'], 'happy');
    else if(t===FORM_COLD && rng()<0.20)
      speak(p.id, ['슬럼프인가 싶다 진짜','슬럼프인가 싶습니다 진짜'], 'sad');
  });
}

function buildKakaoPost(ST,res,usSide,thSide,uSlots,milestones){
  const us=TBYID['wwzw'];
  const msgs=[];
  const rng=Math.random;
  const won=usSide.runs>thSide.runs, tie=usSide.runs===thSide.runs;

  msgs.push({who:'lg',type:'notice',
    text:`${won?'승':(tie?'무':'패')} ${usSide.runs} : ${thSide.runs}\n고생했다`});

  (milestones||[]).slice(0,4).forEach(m=>{
    msgs.push({who:'lg',type:'record',text:`📋 ${m.text}`});
    /* 50호·100호는 따로 크게 다룬다 */
    if(m.pid&&(m.mark===50||m.mark===100||m.mark===150||m.mark===200)){
      msgs.push({who:'lg',type:'record',
        text:`🎉 ${nameOf(m.pid)} ${m.mark}${m.label==='삼진'?'번째 삼진':`호 ${m.label}`} 달성`});
      const crowd=us.players.filter(p=>p.id!==m.pid&&isAvailable(p.id));
      if(crowd.length){
        const a=pickOne(crowd,rng);
        uniqPush(msgs,{who:a.id,text:sayTo(a.id,m.pid,...pickOne(MILE_BIG_CHEER,rng)),mood:'happy'});
        const rest=crowd.filter(p=>p.id!==a.id);
        if(rest.length){
          const b2=pickOne(rest,rng);
          uniqPush(msgs,{who:b2.id,text:sayTo(b2.id,m.pid,...pickOne(MILE_BIG_TEASE,rng)),mood:'happy'});
        }
        uniqPush(msgs,{who:m.pid,text:say(m.pid,...pickOne(MILE_BIG_REPLY,rng)),mood:'happy'});
      }
    }
    /* 큰 기록이면 축하 + 놀리기 */
    else if(m.mark>=25&&m.pid){
      const others=us.players.filter(p=>p.id!==m.pid&&isAvailable(p.id));
      if(others.length){
        const a=pickOne(others,rng);
        uniqPush(msgs,{who:a.id,text:sayTo(a.id,m.pid,
          pickOne(['오 축하한다 ㅋㅋ','이걸 하네','대단하다 진짜'],rng),
          pickOne(['축하드립니다!','대단하십니다','축하드려요 ㅎㅎ'],rng)),mood:'happy'});
        const rest=others.filter(p=>p.id!==a.id);
        if(rest.length&&rng()<0.6){
          const b=pickOne(rest,rng);
          uniqPush(msgs,{who:b.id,text:sayTo(b.id,m.pid,
            pickOne(['근데 내야안타 몇 개냐','경기를 많이 나갔으니까','오늘 한 잔 사라'],rng),
            pickOne(['내야안타도 포함인가요 ㅋㅋ','한 잔 사주셔야죠'],rng)),mood:'happy'});
          uniqPush(msgs,{who:m.pid,text:say(m.pid,'기록은 기록이다','기록은 기록이죠 ㅎㅎ'),mood:'happy'});
        }
      }
    }
  });
  if((milestones||[]).length){
    const m0=milestones[0];
    if(m0.pid){
      const cg=us.players.find(p=>p.id!==m0.pid&&isAvailable(p.id));
      if(cg)uniqPush(msgs,{who:cg.id,text:sayTo(cg.id,m0.pid,'ㅋㅋ 축하한다','축하드립니다!'),mood:'happy'});
    }
  }

  let best=null,bv=-1e9;
  uSlots.forEach(s=>{ const b=res.box[s.id]; if(!b)return;
    const v=b.h*2+b.rbi*2+b.r+b.sb-b.k*0.5; if(v>bv){bv=v;best=s.id;} });

  if(won){
    if(best)uniqPush(msgs,{who:best,text:say(best,
      pickOne(['오늘 손 맛 좋았다 ㅋㅋ','배트가 잘 돌더라','오랜만에 좀 맞았다','오늘 공이 잘 보였다'],rng),
      pickOne(['오늘 좀 맞았습니다 ㅎㅎ','공이 잘 보였습니다','운이 좋았습니다','오랜만에 좀 쳤네요'],rng)),mood:'happy'});
    if(best&&rng()<0.6){
      const tz=us.players.find(p=>META[p.id]&&META[p.id].friends.includes(best));
      if(tz){
        uniqPush(msgs,{who:tz.id,text:sayTo(tz.id,best,
          pickOne(['오늘은 운이었다 ㅋㅋ','내야안타 몇 개냐 그거','자꾸 그러면 다음에 못 친다'],rng),
          pickOne(['오늘은 운이 좋으셨네요 ㅋㅋ','내야안타 아니었나요'],rng)),mood:'happy'});
        uniqPush(msgs,{who:best,text:say(best,'운도 실력이다','운도 실력이죠 ㅎㅎ'),mood:'happy'});
      }
    }
  } else if(tie){
    uniqPush(msgs,{who:'swm',text:pickOne(['아쉽다 다음에 잡자','한 점만 더 냈으면','비긴 것도 나쁘진 않다',
      '이기고 있었는데 아깝다','무승부는 뭔가 애매하다','그래도 안 진 게 어디냐',
      '마지막 이닝만 막았으면','다음엔 확실하게 끝내자'],rng),mood:'flat'});
  } else {
    const fp=ST.lastFreePass||0;

      `오늘 공짜진루 ${fp}개다. 이러면 못 이긴다`,

      '내가 몇 번을 말하냐 공짜진루'],rng),mood:'angry'});
    else uniqPush(msgs,{who:'swm',text:pickOne([

function doAfterParty(ST){
  const us=TBYID['wwzw'];
  const joined=[], msgs=[];
  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||ST.injury[p.id])return;
    if(m.drink>=2||Math.random()<0.5){
      joined.push(p.id);
      const drop=m.drink>=3?24:m.drink===2?13:m.drink===1?6:0;
      ST.cond[p.id]=Math.max(25,ST.cond[p.id]-drop);
      ST.morale[p.id]=Math.min(100,ST.morale[p.id]+14);
      if(ST.unhappy&&ST.unhappy[p.id])ST.unhappy[p.id].level=Math.max(0,ST.unhappy[p.id].level-1);
    } else ST.morale[p.id]=Math.min(100,ST.morale[p.id]+5);
  });
  let resolved=false;
  if(ST.feud&&joined.includes('kig')&&joined.includes('khg')){
    resolved=true; ST.feud=null;
    if(ST.pendingAbsent){delete ST.pendingAbsent['lsm'];delete ST.pendingAbsent['ksn'];}
    ['kig','khg','lsm','ksn'].forEach(id=>ST.morale[id]=Math.min(100,ST.morale[id]+12));
    msgs.push({who:'ujh',text:'형제 둘이 술 마시더니 풀렸네 ㅋㅋ',mood:'happy'});
  }
  if(Math.random()<0.20&&joined.length>=3){
    const heavy=joined.filter(id=>META[id]&&META[id].drink>=3);
    const cars=joined.filter(id=>META[id]&&META[id].car);
    if(heavy.length&&cars.length){
      const a=pickOne(heavy);
      const bs=cars.filter(x=>x!==a);
      if(bs.length){
        const b=pickOne(bs);
        ST.cond[a]=Math.max(18,ST.cond[a]-16); ST.morale[a]=Math.max(12,ST.morale[a]-14);
        ST.cond[b]=Math.max(18,ST.cond[b]-8);  ST.morale[b]=Math.max(12,ST.morale[b]-18);
        msgs.push({who:b,text:sayTo(b,a,`${nameOf(a)} 내 차에 토했다 진짜`,`${nameOf(a)}님이 제 차에 토하셨습니다...`),mood:'angry'});
        msgs.push({who:a,text:sayTo(a,b,'미안하다 세차비 줄게','죄송합니다 세차비 드리겠습니다'),mood:'sad'});
      }
    }
  }
  ST.partyDone=true;
  return {joined,resolved,msgs};
}

function rollMysteryEvent(ST, uSlots){
  // 사회인야구에서 성장은 흔치 않다. 훈련을 해야 확률이 오른다.
  const f=ST.trainFocus||'none';
  let chance = f==='none' ? 0.02 : (f==='hard' ? 0.11 : 0.06);
  if(ST.lessonBoost){ chance+=0.14; ST.lessonBoost=false; }
  if(Math.random()>=chance)return null;
  const us=TBYID['wwzw'];
  const cands=uSlots.map(s=>us.players.find(p=>p.id===s.id)).filter(Boolean);
  if(!cands.length)return null;
  let tgt=null;
  if(ST.lessonTarget){ tgt=cands.find(x=>x.id===ST.lessonTarget); ST.lessonTarget=null; }
  if(!tgt)tgt=pickOne(cands);
  const p=tgt;
  const room=effPA(p.id)-effCA(p.id);
  const r=Math.random();
  if(r<0.40&&room>0.5)return {pid:p.id,name:p.name,kind:'up',delta:0.8+Math.random()*1.6};
  if(r<0.58&&room>1.5)return {pid:p.id,name:p.name,kind:'big',delta:2.0+Math.random()*2.0};
  if(r<0.84)return {pid:p.id,name:p.name,kind:'down',delta:-(0.5+Math.random()*1.2)};
  return {pid:p.id,name:p.name,kind:'none',delta:0};
}
function applyMystery(ST,my){
  const us=TBYID['wwzw'];
  const p=us.players.find(x=>x.id===my.pid);
  if(!p||!my.delta)return null;
  const KN={con:'컨택',pow:'파워',eye:'선구',spd:'주루',def:'수비',arm:'어깨'};
  const k=pickOne(Object.keys(KN));
  const before=Math.round(p[k]);
  p[k]=Math.max(12,Math.min(80,p[k]+my.delta));
  ST.ca[my.pid]=calcCA(p);
  finalizeTeam(us); buildPitcherPool();
  return {stat:KN[k],before,after:Math.round(p[k])};
}

const LESSON_COST = 60;      // 사설 레슨은 원래 비싸다. 회당 6만원 × 10회권 수준
function doLesson(ST, pid){
  const cost=LESSON_COST;
  if(ST.budget<cost) return {ok:false,msg:`운영비가 부족하다 (${cost}만원 필요)`};
  ST.budget-=cost;
  ST.lessonBoost=true;
  ST.lessonTarget=pid;
  ST.morale[pid]=Math.min(100,ST.morale[pid]+6);
  return {ok:true,msg:`${nameOf(pid)} 레슨 등록 — 다음 경기 후 결과가 나온다`};
}

function myGrade(){

  const b=ST.bat[me]||blankBat();
  if(!b.pa) return null;
  const lgw=leagueWoba();
  const w=wrcPlus(b,lgw);

/* 면담 개시 판정 — 시즌 중 최대 2회, 4경기 이상 뛰었을 때 */
function rollBossTalk(){
  if(ST.bossTalk) return;                        // 이미 대기 중
  if((ST.bossTalkCount||0)>=2) return;
  const played=ST.schedule.filter(x=>x.played).length;
  if(played<4) return;
  const last=ST.bossTalkAt!=null?ST.bossTalkAt:-99;
  if(played-last<5) return;                      // 최소 5경기 간격
  const g=myGrade(); if(!g||g.pa<8) return;
  const boss=bossId(); if(!boss) return;
  if(Math.random()<0.55){
    ST.bossTalk={boss, tier:g.tier, wrc:g.wrc, pa:g.pa,
      avg:g.avg, ops:g.ops, step:0, log:[]};
    const pool = g.tier==='good'?BOSS_GOOD:(g.tier==='mid'?BOSS_MID:BOSS_BAD);
    const pair=pickOne(pool);
    ST.bossTalk.log.push({who:boss, text:sayTo(boss, ST.playerId, pair[0], pair[1])});
    ST.bossTalk.log.push({who:boss, type:'notice',
      text:`${g.pa}타석 · 타율 ${fmt3(g.avg)} · OPS ${g.ops.toFixed(3)} · wRC+ ${g.wrc}\n리그 평균은 100이다`});
  }
}

   팀 재정 — 장비 · 리그 가입비 · 회비
   ---------------------------------------------------------
   운영비로 장비를 사고, 시즌이 끝나면 다음 시즌 리그 가입비(350만원)를
   내야 한다. 모자라면 회비를 걷어야 하고 그러면 단톡방이 뒤집어진다.
   다들 내긴 낸다. 사회인야구가 원래 그렇다.

/* ================= 버전 =================
   세이브에 마지막으로 돌린 버전을 남겨두고, 접속했을 때 다르면 알려준다.
   애들이 "업데이트된 거 맞냐"고 물을 때 상단 배지만 보면 되게 하려는 것이다.
   같은 링크면 기록은 그대로 남는다 — 버전이 올라가도 세이브는 안 건드린다.   */
const APP_VERSION = '1.2.0';
const APP_VERSION_NOTE = '불만이 쌓이면 실제로 괴롭힌다 — 보이콧·카풀 거부·저격·이탈';
/* '1.2.3' → 10203 로 바꿔서 크기 비교 */
function verNum(v){
  const a=String(v||'0.0.0').split('.').map(x=>parseInt(x,10)||0);
  return (a[0]||0)*10000+(a[1]||0)*100+(a[2]||0);
}
function checkVersion(){
  const badge=document.getElementById('appver');
  const prev=ST?ST.appVer:null;
  const fresh = prev && verNum(prev)<verNum(APP_VERSION);
  if(badge){
    badge.textContent='v'+APP_VERSION;
    badge.classList.toggle('new', !!fresh);
    badge.title = fresh ? `${prev} → ${APP_VERSION} 로 업데이트됨` : `버전 ${APP_VERSION}`;
  }
  if(fresh){
    ST.notices=ST.notices||[];
    ST.notices.push({type:'update',title:`업데이트 v${APP_VERSION}`,
      body:`${prev} 에서 올라왔다. ${APP_VERSION_NOTE}`,
      effect:'기록은 그대로다'});
    setTimeout(()=>toast(`v${APP_VERSION} 로 업데이트됨`),1200);
  }
  if(ST) ST.appVer=APP_VERSION;
  return fresh;
}

/* ================= 장비 =================
   장비는 소모품이다. 한 번 사면 끝이 아니라 쓸수록 닳고, 다 닳으면 등급이 내려간다.
   같은 걸 또 사면 버리는 게 아니라 등급이 올라간다 — 좋은 걸로 바꿔 다는 셈이다.
   ST.gear[id] = {lv:1~3, wear:0~100}                                     */
const GEAR_MAX_LV = 3;
function gearSlot(id){
  if(!ST.gear)ST.gear={};
  const v=ST.gear[id];
  if(v===true) return (ST.gear[id]={lv:1,wear:0});        // 예전 세이브 보정
  if(!v||typeof v!=='object') return null;
  return v;
}
function gearLv(id){ const g=gearSlot(id); return g?g.lv:0; }
function gearWear(id){ const g=gearSlot(id); return g?g.wear:0; }
function gearOwned(id){ return gearLv(id)>0; }
function gearDef(id){ return GEAR_ITEMS.find(g=>g.id===id); }
/* 다음 등급 값 — 올릴수록 비싸진다 */
function gearCost(id){
  const d=gearDef(id); if(!d)return 0;
  return Math.round(d.cost*(1+0.55*gearLv(id)));
}
/* 닳으면 성능도 같이 떨어진다. 80% 넘게 닳으면 절반만 먹는다. */
function gearPower(id){
  const lv=gearLv(id); if(!lv)return 0;
  const w=gearWear(id);
  const cond = w>=80 ? 0.5 : (w>=50 ? 0.8 : 1);
  return lv*cond;
}
function gearLabel(id){
  const lv=gearLv(id);
  if(!lv)return '없음';
  return ['','기본','보강','최상'][Math.min(3,lv)];
}
/* 장비로 얻는 훈련 배수 */
function gearTrainMul(kind){
  let m=1;
  GEAR_ITEMS.forEach(g=>{
    const pw=gearPower(g.id); if(!pw)return;
    if(g.eff.train)m*=1+(g.eff.train-1)*pw;
    if(g.eff.bat&&kind==='bat')m*=1+(g.eff.bat-1)*pw;
  });
  return m;
}
function gearInjMul(){
  let m=1;
  GEAR_ITEMS.forEach(g=>{
    const pw=gearPower(g.id); if(!pw||!g.eff.inj)return;
    m*=1-(1-g.eff.inj)*pw;
  });
  return Math.max(0.55,m);
}
/* 한 등급 올린다(사거나 강화하거나). 값은 이미 치른 뒤에 부른다. */
function gearBuy(id){
  if(!ST.gear)ST.gear={};
  const g=gearSlot(id);
  if(!g){ ST.gear[id]={lv:1,wear:0}; return 1; }
  g.lv=Math.min(GEAR_MAX_LV,g.lv+1); g.wear=0;
  return g.lv;
}
/* 경기 한 번 치를 때마다 닳는다. 다 닳으면 등급이 하나 내려간다. */
function gearWearTick(){
  const msgs=[];
  GEAR_ITEMS.forEach(d=>{
    const g=gearSlot(d.id); if(!g)return;
    g.wear += d.wear*(0.75+Math.random()*0.5);
    if(g.wear>=100){
      g.lv--; g.wear=0;
      if(g.lv<=0){ delete ST.gear[d.id];
        msgs.push({who:'ksh',type:'notice',text:`${d.name} — 다 써서 못 쓰게 됐다. 다시 사야 한다`}); }
      else msgs.push({who:'ksh',type:'notice',text:`${d.name} — 낡아서 ${gearLabel(d.id)} 등급으로 내려갔다`});
    }
  });
  return msgs;
}

/* 회비 걷기 — 부족한 금액을 인원수로 나눠 걷는다 */
/* 선수단 총 가치 → 회비 경감.
   좋은 선수가 많으면 대회 초청·스폰서·용병 수입이 붙어서 회비를 덜 걷는다.
   가치 400만원을 기준으로 최대 30%까지 깎인다.                        */
function squadValue(){
  return TBYID['wwzw'].players.reduce((a,p)=>
    a + (isMerc(p.id)?0:playerValue(p,META[p.id],ST.bat[p.id])), 0);
}
function duesRelief(){
  const v=squadValue();
  return Math.max(0, Math.min(0.30, (v-150)/250*0.30));
}
function collectDues(need){
  const us=TBYID['wwzw'];
  const n=us.players.filter(p=>!isMerc(p.id)).length||1;
  const relief=duesRelief();
  const cut=Math.round(need*relief);
  const per=Math.ceil(Math.max(1,need-cut)/n);
  const total=per*n;
  ST.budget+=total;
  ST.duesCount=(ST.duesCount||0)+1;
  const msgs=[{who:'lg',type:'notice',
    text:`회비 ${per}만원씩 걷습니다 (${n}명 · ${total}만원)`
      +(cut>0?`\n선수단 가치가 높아 ${cut}만원은 초청·스폰서로 메웠다 (-${(relief*100).toFixed(0)}%)`:'')
      +`\n${pickOne(DUES_LEAD)}`}];
  // 다들 투덜대지만 결국 낸다. 자주 걷을수록, 많이 걷을수록 사기가 깎인다.
  let drop = 3 + Math.min(6, (ST.duesCount||1)-1)*2;
  drop = Math.max(1, Math.round(drop*(1-relief)));
  const spk=speakers(ST, null, 3+((Math.random()*2)|0), Math.random);
  spk.forEach((p,i)=>{
    const pool = i===0?DUES_ANGRY:(Math.random()<0.5?DUES_ANGRY:DUES_OK);
    msgs.push({who:p.id, text:line(p.id, ST.playerId, pool.map(x=>x[0]), pool.map(x=>x[1]), Math.random),
      mood: pool===DUES_ANGRY?'angry':'ok'});
  });
  us.players.forEach(p=>{
    if(isMerc(p.id))return;
    ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-drop);
    if(ST.bond)ST.bond[p.id]=Math.max(0,(ST.bond[p.id]!=null?ST.bond[p.id]:50)-2);
    // 세 번째부터는 돈 얘기가 불씨로 쌓인다
    if((ST.duesCount||0)>=3) addSpark(ST,p.id,'회비',1);
  });
  msgs.push({who:'lg',type:'notice',
    text:`전원 사기 -${drop} · 걷은 돈 ${total}만원`
      +((ST.duesCount||0)>=3?'\n또 걷었다. 슬슬 눈치가 보인다':'')});
  return {per,n,total,drop,msgs,cut};
}

/* ================= 폼 — 슬럼프와 뜨거운 감각 =================
   몇 타석 연속 못 치면 눈이 내리고(🌨️), 연속으로 맞히면 방망이가 뜨겁다(🔥).
   경기 기록에서 누적으로 세기 때문에 경기를 건너뛰어도 이어진다.        */
const FORM_HOT='🔥', FORM_COLD='🌨️';
const HOT_HITS=5;      // 최근 안타 5개가 이어지면 뜨겁다
const COLD_AB=8;       // 무안타 타수 8개가 이어지면 슬럼프
const HOT_APP=2;       // 투수는 두 번 연속 잘 던지면
const COLD_APP=2;      // 두 번 연속 무너지면

function formSlot(pid){
  if(!ST.form)ST.form={};
  if(!ST.form[pid])ST.form[pid]={hot:0,cold:0,phot:0,pcold:0};
  return ST.form[pid];
}
/* '' | '🔥' | '👀' */
function formTag(pid){
  const f=(ST&&ST.form)?ST.form[pid]:null; if(!f)return '';
  if(f.hot>=HOT_HITS||f.phot>=HOT_APP)return FORM_HOT;
  if(f.cold>=COLD_AB||f.pcold>=COLD_APP)return FORM_COLD;
  return '';
}
function formLabel(pid){
  const t=formTag(pid);
  if(t===FORM_HOT)return '감각이 올라와 있다';
  if(t===FORM_COLD)return '슬럼프다';
  return '';
}
/* 타격 배수 */
function formBatMul(pid){
  const f=(ST&&ST.form)?ST.form[pid]:null; if(!f)return 1;
  if(f.hot>=HOT_HITS)return 1.08;
  if(f.cold>=COLD_AB)return 0.92;
  return 1;
}
/* 투구 배수 */
function formPitMul(pid){
  const f=(ST&&ST.form)?ST.form[pid]:null; if(!f)return 1;
  if(f.phot>=HOT_APP)return 1.07;
  if(f.pcold>=COLD_APP)return 0.93;
  return 1;
}
/* 경기가 끝나면 그날 성적으로 폼을 갱신한다 */
function updateForm(ST, res, uSlots){
  if(!ST.form)ST.form={};
  const msgs=[];
  const before={};
  TBYID['wwzw'].players.forEach(p=>{ before[p.id]=formTag(p.id); });

  uSlots.forEach(sl=>{
    const b=res.box&&res.box[sl.id]; if(!b||!b.ab)return;
    const f=formSlot(sl.id);
    if(b.h>0){ f.cold=0; f.hot+=b.h; }
    else { f.hot=0; f.cold+=b.ab; }
  });
  (ST.gameRotation||[]).forEach(pid=>{
    const l=res.pbox&&res.pbox[pid]; if(!l||l.outs<3)return;
    const f=formSlot(pid);
    const free=(l.bb||0)+(l.hbp||0);
    if(l.er<=1&&free<=2){ f.pcold=0; f.phot++; }
    else if(l.er>=3||free>=4){ f.phot=0; f.pcold++; }
    else { f.phot=0; f.pcold=0; }
  });

  /* 상태가 바뀐 사람만 단톡에 알린다 */
  TBYID['wwzw'].players.forEach(p=>{
    const now=formTag(p.id);
    if(now===before[p.id])return;
    if(now===FORM_HOT) msgs.push({who:p.id,type:'notice',
      text:`${FORM_HOT} ${p.name} — 감각이 올라왔다`});
    else if(now===FORM_COLD) msgs.push({who:p.id,type:'notice',
      text:`${FORM_COLD} ${p.name} — 슬럼프다`});
    else if(before[p.id]) msgs.push({who:p.id,type:'notice',
      text:`${p.name} — 폼이 평소로 돌아왔다`});
  });
  return msgs;
}
/* 주간 버프에 폼을 얹는다. ST.buff 는 매주 초기화되므로 여기서 다시 붙인다. */
function applyFormBuff(ST){
  if(!ST.form)return;
  TBYID['wwzw'].players.forEach(p=>{
    const m=formBatMul(p.id); if(m===1)return;
    const cur=ST.buff[p.id];
    if(cur) cur.all=(cur.all||1)*m;
    else ST.buff[p.id]={all:m,label:m>1?'뜨거운 감각':'슬럼프'};
  });
}

function blankSnap(){
  const st=ST.stand['wwzw']||{w:0,l:0,t:0};
  const o={bat:{},pit:{},rec:{w:st.w,l:st.l,t:st.t},lg:{},lgp:{}};
  TBYID['wwzw'].players.forEach(p=>o.bat[p.id]={...(ST.bat[p.id]||blankBat())});
  TBYID['wwzw'].pitchers.forEach(p=>o.pit[p.id]={...(ST.pit[p.id]||blankPit())});
  // 리그 전체 시상을 위해 남의 팀 기록도 같이 찍어둔다
  Object.keys(ST.lgBat||{}).forEach(id=>o.lg[id]={...ST.lgBat[id]});
  Object.keys(ST.lgPit||{}).forEach(id=>o.lgp[id]={...ST.lgPit[id]});
  return o;
}
/* 리그 전체(우리 포함)에서 구간 1위를 뽑는다.
   남의 팀 기록은 ST.lgBat / ST.lgPit 에 쌓인다.                        */
function leagueOwner(pid){
  for(const t of TEAMS){
    if(t.players.some(p=>p.id===pid)||(t.pitchers||[]).some(p=>p.id===pid))return t;
  }
  return null;
}
function leagueName(pid){
  for(const t of TEAMS){
    const p=t.players.find(x=>x.id===pid)||(t.pitchers||[]).find(x=>x.id===pid);
    if(p)return p.name;
  }
  return '?';
}
function leagueAwards(snap){
  const BK=['g','pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb'];
  const PK=['g','outs','h','r','er','bb','hbp','k','w'];
  const B={}, P={};
  Object.keys(ST.lgBat||{}).forEach(id=>{
    const t=leagueOwner(id); if(!t)return;
    B[id]=snapDiff(ST.lgBat[id], snap&&snap.lg&&snap.lg[id], BK);
  });
  // 우리 팀은 ST.bat 을 쓴다
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;
    B[p.id]=snapDiff(ST.bat[p.id]||blankBat(), snap&&snap.bat&&snap.bat[p.id], BK);
  });
  Object.keys(ST.lgPit||{}).forEach(id=>{
    P[id]=snapDiff(ST.lgPit[id], snap&&snap.lgp&&snap.lgp[id], PK);
  });
  TBYID['wwzw'].pitchers.forEach(p=>{
    P[p.id]=snapDiff(ST.pit[p.id]||blankPit(), snap&&snap.pit&&snap.pit[p.id], PK);
  });
  const opsOf=b=>{
    const ab=b.ab||0, pa=b.pa||0; if(!pa)return 0;
    const tb=(b.h||0)+(b.d2||0)+2*(b.d3||0)+3*(b.hr||0);
    return (((b.h||0)+(b.bb||0)+(b.hbp||0))/pa) + (ab?tb/ab:0);
  };
  const pick=(obj,filt,score)=>{
    const ids=Object.keys(obj).filter(id=>filt(obj[id]));
    if(!ids.length)return null;
    return ids.sort((a,b)=>score(obj[b])-score(obj[a]))[0];
  };
  const out=[];
  const mvp=pick(B,b=>b.pa>=6,opsOf);
  if(mvp)out.push({kind:'lgmvp',label:'리그 구간 MVP',pid:mvp,value:`OPS ${opsOf(B[mvp]).toFixed(3)}`});
  const avgId=pick(B,b=>b.ab>=8,b=>b.h/b.ab);
  if(avgId&&avgId!==mvp)out.push({kind:'lgavg',label:'리그 타율상',pid:avgId,value:`타율 ${fmt3(B[avgId].h/B[avgId].ab)}`});
  const pitId=pick(P,l=>l.outs>=9,l=>-((l.er*7)/(l.outs/3)));
  if(pitId)out.push({kind:'lgpit',label:'리그 투수상',pid:pitId,
    value:`ERA ${(P[pitId].outs?((P[pitId].er*7)/(P[pitId].outs/3)):0).toFixed(2)}`});
  return out;
}
/* 다른 팀이 우리 선수를 극찬한다 */
const OPP_PRAISE=[
  '그 선수 진짜 물건이네요. 축하드립니다',
  '기록 보고 깜짝 놀랐습니다. 저희 팀에 없는 유형이라',
  '솔직히 부럽습니다. 우리 팀에 한 명만 있었으면',
  '다음에 붙을 때 그 선수부터 피해야겠네요 ㅋㅋ',
  '4부에서 저런 기록이 나오나요. 대단합니다',
  '스카우트 보내야 하나 진지하게 고민했습니다',
];
function snapDiff(now, then, keys){
  const o={}; keys.forEach(k=>o[k]=(now[k]||0)-((then&&then[k])||0)); return o;
}
/* 구간 성적을 뽑아 상을 정한다 */
function runMiniAwards(ST){
  const us=TBYID['wwzw'];
  const snap=ST.awardSnap;
  const B={}, P={};
  const BK=['g','pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb'];
  const PK=['g','outs','h','r','er','bb','hbp','k','w'];
  us.players.forEach(p=>{ if(!isMerc(p.id)) B[p.id]=snapDiff(ST.bat[p.id]||blankBat(),snap&&snap.bat[p.id],BK); });
  us.pitchers.forEach(p=>{ P[p.id]=snapDiff(ST.pit[p.id]||blankPit(),snap&&snap.pit[p.id],PK); });

  const won=[];
  const give=(kind,pid,value)=>{ if(!pid||won.some(w=>w.pid===pid))return; won.push({kind,pid,value}); };
  const best=(obj,filt,score)=>{
    const ids=Object.keys(obj).filter(id=>filt(obj[id]));
    if(!ids.length)return null;
    return ids.sort((a,b)=>score(obj[b])-score(obj[a]))[0];
  };
  const opsOf=b=>{
    const ab=b.ab||0, pa=b.pa||0; if(!pa)return 0;
    const tb=(b.h||0)+(b.d2||0)+2*(b.d3||0)+3*(b.hr||0);
    return (((b.h||0)+(b.bb||0)+(b.hbp||0))/pa) + (ab?tb/ab:0);
  };
  /* 감독상은 감독(이건)만 받는다. 구간 팀 성적이 5할 이상이면 준다.
     나머지 선수의 몫은 '팀 공헌상'으로 따로 뺐다. */
  const mgrP=us.players.find(p=>META[p.id]&&(META[p.id].traits||[]).includes('감독'));
  const stNow=ST.stand['wwzw']||{w:0,l:0,t:0};
  const rec0=(snap&&snap.rec)||{w:0,l:0,t:0};
  const gw=(stNow.w||0)-(rec0.w||0), gl=(stNow.l||0)-(rec0.l||0), gt=(stNow.t||0)-(rec0.t||0);
  let mgrGiven=false;
  if(mgrP && (gw+gl+gt)>0 && gw>=gl){
    won.push({kind:'mgr',pid:mgrP.id,value:`${gw}승 ${gl}패${gt?` ${gt}무`:''}`});
    mgrGiven=true;
  }
  const noMgr={}; Object.keys(B).forEach(id=>{ if(!mgrP||id!==mgrP.id) noMgr[id]=B[id]; });

  give('mvp', best(B,b=>b.pa>=5,opsOf), null);
  give('avg', best(B,b=>b.ab>=6,b=>b.h/b.ab), null);
  give('bat', best(B,b=>b.h>=1,b=>(b.h||0)*1.0+(b.rbi||0)*0.8), null);
  give('sb',  best(B,b=>(b.sb||0)>=2,b=>b.sb), null);
  give('pit', best(P,l=>l.outs>=6,l=>-((l.er*7)/(l.outs/3))), null);
  give('team', best(noMgr,b=>b.pa>=4,b=>(b.rbi||0)+(b.r||0)), null);

  /* 값 문구 채우기 */
  won.forEach(w=>{
    const b=B[w.pid], l=P[w.pid];
    if(w.kind==='mvp') w.value=`OPS ${opsOf(b).toFixed(3)}`;
    else if(w.kind==='avg') w.value=`타율 ${fmt3(b.h/b.ab)}`;
    else if(w.kind==='bat') w.value=`${b.h}안타 ${b.rbi}타점`;
    else if(w.kind==='sb') w.value=`${b.sb}도루`;
    else if(w.kind==='pit') w.value=`ERA ${(l.outs?((l.er*7)/(l.outs/3)):0).toFixed(2)}`;
    else if(w.kind==='team') w.value=`${b.rbi}타점 ${b.r}득점`;
    /* 감독상 값은 위에서 이미 넣었다 */
  });

  const at=ST.schedule.filter(x=>x.played&&!x.po).length;
  if(!Array.isArray(ST.hall))ST.hall=[];
  if(!ST.awardBonus)ST.awardBonus={};
  const msgs=[];
  const meId=ST.playerId||MYID;

  won.forEach(w=>{
    const label=MINI_LABELS[w.kind]||'수상';
    ST.hall.push({season:ST.seasonNo||1, year:ST.year||2026, at, kind:w.kind,
      label, pid:w.pid, name:nameOf(w.pid), value:w.value, scope:'구간'});
    ST.awardBonus[w.pid]=(ST.awardBonus[w.pid]||0)+1;
    ST.morale[w.pid]=Math.min(100,(ST.morale[w.pid]||70)+7);
    if(ST.bond&&w.pid!==meId)ST.bond[w.pid]=Math.min(100,(ST.bond[w.pid]||50)+1);
    msgs.push({who:'lg',type:'notice',
      text:`${at}경기 구간 시상 — ${label}\n${nameOf(w.pid)} · ${w.value}\n사기 +7 · 몸값 상승`});
    /* 축하 — 이건이 하고, 이건이 받으면 송승민이 한다 */
    const cheerer = (w.pid==='lg') ? 'swm' : 'lg';
    if(us.players.some(x=>x.id===cheerer)){
      const c=pickOne(AWARD_CHEER);
      msgs.push({who:cheerer, text:sayTo(cheerer, w.pid, c[0], c[1]), mood:'happy'});
    }
    /* 아주 가끔 다른 팀에서도 축하가 온다 */
    if(Math.random()<0.22){
      const other=TEAMS.filter(t=>t.id!=='wwzw');
      const t=pickOne(other);
      const l2=pickOne(AWARD_OPP);
      msgs.push({who:'lg',type:'notice',text:`${t.name}에서 단톡방에 연락이 왔다\n"${l2[0]}"`});
    }
  });

  /* ---- 리그 전체 구간 수상 ---- 남의 팀 누가 받았는지도 알려준다 */
  const lgw=leagueAwards(snap);
  if(lgw.length){
    msgs.push({who:'lg',type:'notice',
      text:`리그 ${at}경기 구간 수상\n`+lgw.map(a=>{
        const t=leagueOwner(a.pid);
        return `${a.label} — ${leagueName(a.pid)} (${t?t.name:'?'}) ${a.value}`;
      }).join('\n')});
    lgw.forEach(a=>{
      const ours=us.players.some(x=>x.id===a.pid);
      if(!ours)return;
      /* 우리 선수가 리그 상을 받았다 — 남의 팀이 극찬한다 */
      ST.hall=ST.hall||[];
      ST.hall.push({season:ST.seasonNo||1,year:ST.year||2026,at,kind:a.kind,
        label:a.label,pid:a.pid,name:nameOf(a.pid),value:a.value,scope:'리그'});
      ST.awardBonus[a.pid]=(ST.awardBonus[a.pid]||0)+2;
      ST.morale[a.pid]=Math.min(100,(ST.morale[a.pid]||70)+10);
      us.players.forEach(q=>ST.morale[q.id]=Math.min(100,(ST.morale[q.id]||70)+3));
      const others=TEAMS.filter(t=>t.id!=='wwzw');
      const n=1+((Math.random()*2)|0);
      for(let i=0;i<n;i++){
        const t=pickOne(others);
        msgs.push({who:'lg',type:'notice',
          text:`${t.name} 감독\n"${nameOf(a.pid)} 선수, ${pickOne(OPP_PRAISE)}"`});
      }
      msgs.push({who:'lg',type:'notice',text:`${nameOf(a.pid)} 리그 수상 — 전원 사기 +3 · 본인 +10`});
      if(a.pid===meId) ST.awardReply={label:a.label, value:a.value};
    });
  }

  /* 내가 받았으면 대답을 골라야 한다 */
  const mine=won.find(w=>w.pid===meId);
  if(mine && !ST.awardReply) ST.awardReply={label:MINI_LABELS[mine.kind]||'수상', value:mine.value};

  ST.awardSnap=blankSnap();
  return msgs;
}
/* 대답을 고르면 팀 분위기가 달라진다 */
function answerAward(k){
  const r=AWARD_REPLIES.find(x=>x.k===k); if(!r)return;
  const us=TBYID['wwzw'], meId=ST.playerId||MYID;
  ST.kakao=ST.kakao||[];
  ST.kakao.push({who:meId, text:sayTo(meId,'lg',r.line[0],r.line[1]),
    mood:r.k==='brag'?'flat':'happy'});
  us.players.forEach(p=>{
    if(p.id===meId){ if(r.self)ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+r.self); return; }
    ST.morale[p.id]=Math.max(10,Math.min(100,(ST.morale[p.id]||70)+r.mor));
    if(ST.bond)ST.bond[p.id]=Math.max(0,Math.min(100,(ST.bond[p.id]||50)+(r.bond||0)));
  });
  ST.kakao.push({who:'lg',type:'notice',text:`${r.d}`});
  ST.awardReply=null;
  saveGame(true);
}

function buildAwards(ST){
  const us=TBYID['wwzw'];
  const A=[];
  const qual=us.players.filter(p=>(ST.bat[p.id]||{}).pa>=20);
  const pick=(list,fn,label,fmt)=>{
    if(!list.length)return;
    const b=list.slice().sort((x,y)=>fn(y)-fn(x))[0];
    A.push({label,name:b.name,value:fmt(b)});
  };
  pick(qual,p=>ops(ST.bat[p.id]),'시즌 MVP',p=>`OPS ${ops(ST.bat[p.id]).toFixed(3)}`);
  pick(qual,p=>avg(ST.bat[p.id]),'타격상',p=>`타율 ${fmt3(avg(ST.bat[p.id]))}`);
  pick(us.players,p=>(ST.bat[p.id]||{}).rbi||0,'타점상',p=>`${ST.bat[p.id].rbi}타점`);
  pick(us.players,p=>(ST.bat[p.id]||{}).sb||0,'도루상',p=>`${ST.bat[p.id].sb}도루`);
  pick(us.players,p=>(ST.bat[p.id]||{}).g||0,'개근상',p=>`${ST.bat[p.id].g}경기`);
  const pit=us.pitchers.filter(p=>(ST.pit[p.id]||{}).outs>=21);
  if(pit.length){
    const b=pit.slice().sort((x,y)=>era(ST.pit[x.id])-era(ST.pit[y.id]))[0];
    A.push({label:'투수상',name:b.name,value:`ERA ${era(ST.pit[b.id]).toFixed(2)}`});
    const w=pit.slice().sort((x,y)=>ST.pit[y.id].w-ST.pit[x.id].w)[0];
    A.push({label:'다승상',name:w.name,value:`${ST.pit[w.id].w}승`});
  }
  /* 리그 전체 시즌 1위 — 남의 팀이 받았어도 보여준다 */
  leagueAwards(null).forEach(a=>{
    const t=leagueOwner(a.pid);
    A.push({label:a.label.replace('구간 ',''),name:`${leagueName(a.pid)} (${t?t.name:'?'})`,value:a.value,
      league:true, ours:us.players.some(x=>x.id===a.pid)});
  });
  const gr=us.players.map(p=>({p,g:(ST.ca[p.id]||0)-((ST.caStart&&ST.caStart[p.id])||(ST.ca[p.id]||0))}))
    .sort((a,b)=>b.g-a.g)[0];
  if(gr&&gr.g>0.5)A.push({label:'최다 성장',name:gr.p.name,value:`+${gr.g.toFixed(1)}`});
  pick(qual,p=>(ST.bat[p.id]||{}).bb||0,'선구안상',p=>`${ST.bat[p.id].bb}볼넷`);
  const dr=us.players.filter(p=>META[p.id]&&META[p.id].drink>=3);
  if(dr.length)A.push({label:'주당상',name:pickOne(dr).name,value:'회식 개근'});
  return A;
}

/* 불만 단계 → 대사 풀 키 */
function meetTier(lv){ return lv>=3?'high':(lv>=2?'mid':'ok'); }

/* 오프닝 한 줄 생성. 특성 전용 대사가 있으면 40% 확률로 그걸 쓴다 */
function meetOpenLine(ST, pid){
  const m=META[pid]||{traits:[]};
  const lv=(ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0;
  let pool=null;
  const tr=(m.traits||[]).find(t=>MEET_TRAIT_OPEN[t]);
  if(tr && Math.random()<0.4) pool=MEET_TRAIT_OPEN[tr];
  if(!pool) pool=MEET_OPEN[meetTier(lv)];
  const pair=pickOne(pool);
  return sayTo(pid, ST.playerId, pair[0], pair[1]);
}
function meetReplyLine(ST, pid, key){
  const pair=pickOne(MEET_REPLY[key]);
  return sayTo(pid, ST.playerId, pair[0], pair[1]);
}

/* ---------------------------------------------------------
   약속 검사 — commitGame 에서 매 경기 호출한다.
   starters : 이번 경기 선발 출전 명단(id 배열, 타순 순서)
   played   : 실제로 경기에 나온 id 집합
   absent   : 결장자 판정용 (부상/불참). 결장은 위반으로 치지 않는다.
   반환값은 단톡방에 붙일 메시지 배열.
   --------------------------------------------------------- */
function checkPromises(ST, starters, playedIds, absentIds){
  const msgs=[];
  if(!ST.promise) return msgs;
  Object.keys(ST.promise).forEach(pid=>{
    const pr=ST.promise[pid];
    if(!pr) { delete ST.promise[pid]; return; }
    // 이적·방출로 로스터에서 빠진 선수의 약속은 그냥 없앤다
    if(!TBYID['wwzw'].players.some(q=>q.id===pid)) { delete ST.promise[pid]; return; }
    // 결장(부상·개인사정)한 경기는 약속 계산에서 통째로 빼준다
    if(absentIds.indexOf(pid)>=0) return;

    const idx=starters.indexOf(pid);
    let kept;
    if(pr.type==='order') kept = idx>=0 && (idx+1)<=(pr.orderMax||3);
    else kept = idx>=0 || playedIds.indexOf(pid)>=0;

    if(kept){
      pr.games--;
      if(pr.games<=0){
        ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+15);
        ST.unhappy[pid]={level:0,streak:0};
        const pair=pickOne(MEET_PROMISE_MSG.done);
        msgs.push({who:pid,text:sayTo(pid,ST.playerId,pair[0],pair[1]),mood:'happy'});
        delete ST.promise[pid];
      }
    } else {
      // 위반 — 사기 대폭 하락 + 언해피 즉시 2단계.
      // 두 번째부터는 신뢰가 무너져서 곧바로 최후통첩으로 간다.
      ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-20);
      const u=ST.unhappy[pid]||{level:0,streak:0};
      u.level=Math.min(4,u.level+2); u.streak=0;
      ST.unhappy[pid]=u;
      const pair=pickOne(pr.type==='order'?MEET_PROMISE_MSG.break_order:MEET_PROMISE_MSG.break_start);
      msgs.push({who:pid,text:sayTo(pid,ST.playerId,pair[0],pair[1]),mood:'angry'});
      ST.broken=ST.broken||{}; ST.broken[pid]=(ST.broken[pid]||0)+1;
      /* 친한 사람들도 "쟤 말 안 지키네" 하고 본다 */
      (META[pid]&&META[pid].friends||[]).forEach(f=>{
        if(TBYID['wwzw'].players.some(q=>q.id===f)) addSpark(ST,f,'분위기',1);
      });
      if(ST.broken[pid]>=2){
        u.level=4;
        ST.ultimatum=ST.ultimatum||{};
        if(ST.ultimatum[pid]==null)ST.ultimatum[pid]=2;
        msgs.push({who:pid,type:'notice',
          text:`약속 파기 ${ST.broken[pid]}회 — ${nameOf(pid)} 신뢰 붕괴\n이적 요구 단계 · ${ST.ultimatum[pid]}경기 안에 못 풀면 나간다`});
      } else {
        msgs.push({who:pid,type:'notice',text:`약속 파기 — ${nameOf(pid)} 사기 -20 · 불만 2단계 상승\n친한 선수들도 지켜보고 있다`});
      }
      delete ST.promise[pid];
    }
  });
  return msgs;
}

/* 경기 결과에 실린 고진선 이벤트를 사기·컨디션·단톡에 반영한다.
   반환값은 단톡방(경기 후)에 붙일 메시지 배열.                      */
function applyGojin(ST, gj){
  const msgs=[];
  if(!gj||!gj.log||!gj.log.length) return msgs;
  const us=TBYID['wwzw'];

  if(gj.threw){
    msgs.push({who:'khg',type:'notice',
      text:'고진선이 자기 팀 실책에 공을 패대기쳤다\n안산 사기 하락 · 우리 타격 소폭 상승'});
  }
  if(gj.cleared){
    // 양 팀 컨디션이 깎이지만 우리 사기는 오히려 오른다
    us.players.forEach(p=>{
      ST.cond[p.id]=Math.max(20,(ST.cond[p.id]||70)-6);
      ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+8);
    });
    msgs.push({who:'lg',type:'notice',
      text:'벤치클리어링\n양 팀 컨디션 -6 · 우리 팀 사기 +8'});
    const line=pickOne(GOJIN_CLEAR_MSG);
    if(us.players.some(p=>p.id===line[0]))
      msgs.push({who:line[0],text:line[1],mood:'angry'});
  }
  // 두 명이 같은 핑계를 대면 김이 새니 중복 없이 뽑는다
  const exPool=GOJIN_EXCUSE.slice();
  (gj.mocked||[]).forEach(m=>{
    if(!us.players.some(p=>p.id===m.pid))return;
    ST.morale[m.pid]=Math.max(10,(ST.morale[m.pid]||70)-10);
    const ex=exPool.length?exPool.splice((Math.random()*exPool.length)|0,1)[0]:pickOne(GOJIN_EXCUSE);
    msgs.push({who:m.pid,text:say(m.pid,ex[0],ex[1]),mood:'sad'});
    if(m.woke){
      // 각성했으면 사기 하락분을 되돌려주고 조금 더 얹는다
      ST.morale[m.pid]=Math.min(100,(ST.morale[m.pid]||70)+18);
      const wk=pickOne(GOJIN_WAKE_MSG);
      msgs.push({who:m.pid,text:say(m.pid,wk[0],wk[1]),mood:'happy'});
      msgs.push({who:m.pid,type:'notice',text:`${nameOf(m.pid)} 각성 — 사기 회복 +8`});
    } else {
      msgs.push({who:m.pid,type:'notice',text:`${nameOf(m.pid)} 사기 -10`});
    }
  });
  return msgs;
}
