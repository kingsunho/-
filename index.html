<script>
/* =========================================================
   LiveGame — 이닝 단위로 진행되며 판단 지점에서 멈춘다
   ========================================================= */
'use strict';

function newBoxL(){return {pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}
function newPitL(){return {outs:0,h:0,r:0,er:0,bb:0,k:0,hbp:0,sbA:0,bf:0};}

function LiveGame(cfg){
  this.INN = cfg.innings || 7;
  this.rng = cfg.rng;
  this.userIsHome = cfg.userIsHome;
  this.log = [];
  this.box = {}; this.pbox = {};
  this.injuries = [];
  this.over = false; this.mercy = false;
  this.inning = 1; this.half = 0;
  this.outs = 0; this.bases = [null,null,null];
  this.pending = null;
  this.usedPH = {};       // 대타 사용 기록
  this.park = cfg.park || {hr:1,d2:1,d3:1,err:1,babip:1};
  this.gearPenalty = cfg.gearPenalty||0;
  this.buff = cfg.buff||{};
  this.form = cfg.form||{};          // 투수 폼 배수 {pid:0.93~1.07}
  this.benchPool = cfg.benchPool||[];   // 나왔는데 라인업엔 못 든 사람들
  this.dpCount=0; this.assists=0; this.wp=0;
  this.hot = !!cfg.hot;
  this.timeouts = 5;      // 공격 작전 지시 가능 횟수
  this.defTimeouts = 3;   // 수비 판단(고의4구·시프트) 가능 횟수
  this.myId = cfg.myId||null;      // 플레이어가 고른 선수 — 피드 강조용
  this.tacTTL = {bat:0, run:0};    // 공격 지시 잔여 타석. 0이 되면 자동 해제된다
  this.shiftTTL = 0;               // 수비 시프트 잔여 타석
  this._buntRun = false;

  const mk = (team, slots, rot, tac, cond, isUser) => {
    const s = {team, slots: slots.map(x=>({...x})), rot: rot.slice(), tac:{...tac}, tacBase:{...tac},
      cond:cond||{},
      isUser, order:0, pIdx:0, runs:0, hits:0, errs:0, bbs:0, sbAllowed:0, line:[]};
    const c = s.slots.find(x=>x.pos==='C');
    const cp = c ? team.players.find(p=>p.id===c.id) : null;
    s.cArm = (cp ? cp.arm : 45) - (isUser?(cfg.gearPenalty||0):0);
    s.slots.forEach(sl=>{ this.box[sl.id]=this.box[sl.id]||newBoxL(); });
    s.rot.forEach(pid=>{ this.pbox[pid]=this.pbox[pid]||newPitL(); });
    return s;
  };
  this.away = mk(cfg.away, cfg.awayLineup, cfg.awayRotation, cfg.awayTactics, cfg.awayCond, !cfg.userIsHome);
  this.home = mk(cfg.home, cfg.homeLineup, cfg.homeRotation, cfg.homeTactics, cfg.homeCond, cfg.userIsHome);
  this.sides = [this.away, this.home];
  /* 안산유나이티드전 한정 — 고진선 특수 이벤트.
     실제로 그 팀 에이스가 자기 팀 실책에 화내고 상대 벤치에 시비를 걸었다.
     로스터에 고진선이 실제로 있어야 발동한다.                          */
  const opT=(this.userIsHome?this.away:this.home).team;
  const hasGo = opT && opT.id==='ansanutd' &&
    ((opT.players||[]).some(x=>x.name==='고진선')||(opT.pitchers||[]).some(x=>x.name==='고진선'));
  this.gojin = hasGo ? {log:[],mocked:[],threw:false,cleared:false} : null;
  this.gojinUs = 1;      // 우리 팀 BABIP 배수 (패대기·벤치클리어링 여파)
  this.gojinOpp = 1;     // 안산 BABIP 배수
  this.gojinWake = {};   // 각성 예약 {pid:true} — 두 명이 동시에 예약될 수 있다
  this.highlights = [];  // 이닝별 주요 장면 (2루타·3루타·홈런·도루자·병살타)
  this.friction = {log:[],hbp:false,cleared:false,drunk:null,by:null,up:false,pending:false};
  this.drunkIds = cfg.drunkIds||[];   // 전날 마신 사람들
  this.fricUs = 1;       // 마찰 여파로 붙는 우리 BABIP 배수
  this.fricOpp = 1;
  this.mgr = {left:3, boost:1, log:[]};  // 감독 액션
  this.log.push({t:'inning', inning:1, half:0, text:`1회 초 · ${this.away.team.name} 공격`});
  this.startedInning = true;
  this.checkPitcherChange(this.home);
}

/* 주요 장면 기록. 경기 후 하이라이트 표에 그대로 쓴다. */
LiveGame.prototype.hl = function(kind, side, name, detail){
  this.highlights.push({
    inning:this.inning, half:this.half, kind,
    team:side.team.name, us:!!side.isUser, name, detail:detail||''
  });
};

LiveGame.prototype.off = function(){ return this.sides[this.half]; };
LiveGame.prototype.def = function(){ return this.sides[1-this.half]; };
LiveGame.prototype.userSide = function(){ return this.userIsHome ? this.home : this.away; };
LiveGame.prototype.oppSide = function(){ return this.userIsHome ? this.away : this.home; };
LiveGame.prototype.curPitcher = function(s){
  const pid = s.rot[Math.min(s.pIdx, s.rot.length-1)];
  const p = s.team.pitchers.find(x=>x.id===pid) || s.team.pitchers[0];
  if(!p) return p;
  const mm = (typeof META!=='undefined') ? META[p.id] : null;
  let out=p;
  if(s.isUser && mm && mm.traits.includes('더위약함') && this.hot){
    const outs = (this.pbox[p.id]||{}).outs||0;
    if(outs > 6) out = {...out, stf: Math.round(out.stf*0.62), ctl: Math.round(out.ctl*0.78)};
  }
  // 폼 — 연속으로 두들겨 맞으면 공이 안 들어가고, 잘 던지면 손끝이 산다
  if(s.isUser && this.form && this.form[p.id]!=null && this.form[p.id]!==1){
    const fm=this.form[p.id];
    out = {...out, stf: Math.round(out.stf*fm), ctl: Math.round(out.ctl*fm)};
  }
  return out;
};
LiveGame.prototype.batter = function(){
  const s=this.off(); const slot=s.slots[s.order%9];
  return s.team.players.find(p=>p.id===slot.id);
};

LiveGame.prototype.checkPitcherChange = function(s){
  const p=this.curPitcher(s), l=this.pbox[p.id];
  const hk=s.tac.hook||'normal';
  const mul = hk==='quick'?0.72:(hk==='long'?1.30:1);
  const lim=Math.round((6+(p.sta-28)*0.40)*mul);
  const bbLim = hk==='quick'?4:(hk==='long'?9:7);
  const rLim  = hk==='quick'?5:(hk==='long'?12:9);
  if((l.outs>=lim||l.bb+l.hbp>=bbLim||l.r>=rLim) && s.pIdx<s.rot.length-1){
    if(s.isUser){
      // 유저 팀이면 교체 여부를 물어본다
      this.pending={kind:'pitcherChange', side:s, from:p.name, to:this.curPitcherNext(s)};
      return true;
    }
    s.pIdx++;
    this.log.push({t:'sub',text:`투수 교체 · ${s.team.name}: ${p.name} → ${this.curPitcher(s).name}`});
  }
  return false;
};
LiveGame.prototype.curPitcherNext = function(s){
  const pid=s.rot[Math.min(s.pIdx+1,s.rot.length-1)];
  const p=s.team.pitchers.find(x=>x.id===pid);
  return p?p.name:'—';
};

/* 판단 지점 탐지 */
LiveGame.prototype.detectDecision = function(){
  if(this.pending) return this.pending;
  const off=this.off();

  /* 우리가 수비 중일 때의 판단 지점 — 투수 교체·고의4구·시프트 */
  if(!off.isUser && this.def().isUser){
    if(this.defTimeouts<=0) return null;
    const usD=this.userSide(), thD=this.oppSide();
    const dd=usD.runs-thD.runs;
    const rispD=this.bases[1]||this.bases[2];
    const pitD=this.curPitcher(this.def()), plD=this.pbox[pitD.id];
    if(rispD && this.outs<2 && this.rng()<0.30) return {kind:'defense', label:'실점 위기'};
    if((plD.bb+plD.hbp)>=3 && this.rng()<0.35) return {kind:'defense', label:'투수가 흔들린다'};
    if(plD.r>=4 && this.rng()<0.30) return {kind:'defense', label:'투수 난조'};
    if(this.inning>=this.INN-2 && Math.abs(dd)<=2 && this.outs<2 && this.rng()<0.22)
      return {kind:'defense', label:'후반 승부처'};
    return null;
  }

  if(!off.isUser) return null;
  if(this.timeouts<=0) return null;

  const us=this.userIsHome?this.home:this.away;
  const th=this.userIsHome?this.away:this.home;
  const diff = us.runs - th.runs;
  const risp = this.bases[1]||this.bases[2];
  const onBase = this.bases[0]||risp;
  const late = this.inning >= this.INN-2;
  const close = Math.abs(diff)<=4;

  // 득점권
  if(risp && this.outs<2){
    if(this.rng() < (close?0.55:0.30)) return {kind:'situation', label:'득점권 기회'};
  }
  // 주자 1루
  if(this.bases[0] && !this.bases[1] && this.outs<2){
    if(this.rng() < (late&&close?0.45:0.22)) return {kind:'situation', label:'주자 1루'};
  }
  // 후반 승부처
  if(late && close && this.outs<2){
    if(this.rng() < 0.25) return {kind:'situation', label:'승부처'};
  }
  // 이닝 선두타자
  if(!onBase && this.outs===0 && this.inning>=2){
    if(this.rng() < 0.14) return {kind:'situation', label:'이닝 선두타자'};
  }
  // 한 번도 안 썼으면 후반에 반드시 한 번
  if(this.timeouts===5 && this.inning>=this.INN-1 && this.outs<2){
    return {kind:'situation', label:'마지막 기회'};
  }
  return null;
};

/* 지시 유효기간 관리
   ---------------------------------------------------------
   예전에는 '적극 스윙' 을 한 번 누르면 경기가 끝날 때까지 유지돼서
   초구 스윙만 무한 반복됐다. 이제 타석 수를 세서 자동으로 풀린다.
   해제하면 라인업 화면에서 정한 기본 전술(tacBase)로 돌아간다.        */
LiveGame.prototype.tickTactics = function(offWasUser){
  const s=this.userSide();
  // 시프트는 우리가 수비할 때만 닳는다
  if(this.shiftTTL>0 && !offWasUser){
    this.shiftTTL--;
    if(this.shiftTTL===0) this.log.push({t:'sub',text:'수비 시프트 해제 — 지시 종료'});
  }
  if(!offWasUser) return;
  if(this.tacTTL.bat>0){
    this.tacTTL.bat--;
    if(this.tacTTL.bat===0){
      const back=s.tacBase.bat||'normal';
      if(s.tac.bat!==back){ s.tac.bat=back; this._buntRun=false;
        this.log.push({t:'sub',text:'타격 지시 종료 — 평소대로'}); }
    }
  }
  if(this.tacTTL.run>0){
    this.tacTTL.run--;
    if(this.tacTTL.run===0){
      const back=s.tacBase.run||'normal';
      if(s.tac.run!==back){ s.tac.run=back;
        this.log.push({t:'sub',text:'주루 지시 종료 — 평소대로'}); }
    }
  }
};

/* 한 타석 진행 — 실제 계산은 stepPA, step 은 지시 만료를 처리하는 껍데기 */
LiveGame.prototype.step = function(){
  if(this.over) return {done:true};
  if(this.pending) return {pending:this.pending};
  const offWasUser=this.off().isUser;
  this._paDone=false;
  const r=this.stepPA();
  if(this._paDone) this.tickTactics(offWasUser);
  return r;
};

LiveGame.prototype.stepPA = function(){
  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  const bl=this.box[bat.id];
  const rng=this.rng;
  const events=[];

  // 도루
  if(this.bases[0] && !this.bases[1]){
    const rn=off.team.players.find(x=>x.id===this.bases[0]);
    if(rn){
      let runMul=1;
      if(off.tac.run==='aggressive')runMul=1.6;
      else if(off.tac.run==='hold')runMul=0.12;
      const att=clamp(LG.SB_PER_PA*5.64*off.team.tend.sb*runMul*Math.exp((rn.spd-46)*0.020),0,0.85);
      if(rng()<att){
        const su=clamp(LG.SB_SUCCESS+(rn.spd-50)*0.0030-(def.cArm-46)*0.0060,0.45,0.99);
        if(rng()<su){
          this.bases[1]=this.bases[0];this.bases[0]=null;
          this.box[rn.id].sb++;pl.sbA++;def.sbAllowed++;
          events.push({text:`${rn.name} 2루 도루 성공`,cls:'sb'});
        }else{
          this.bases[0]=null;this.outs++;this.box[rn.id].cs++;
          events.push({text:`${rn.name} 도루 실패`,cls:'out'});
          this.hl('cs',off,rn.name,'2루 도루 실패');
          if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
        }
      }
    }
  }

  /* 폭투 — 주자가 있고 제구가 나쁠수록 */
  if((this.bases[0]||this.bases[1]||this.bases[2]) && rng() < clamp(0.009+(42-pit.ctl)*0.0009, 0.002, 0.038)){
    for(let b=2;b>=0;b--){
      if(!this.bases[b])continue;
      if(b===2){ this.box[this.bases[2]].r++; off.runs++; this.curIR++; pl.r++; pl.er++; this.bases[2]=null; }
      else { this.bases[b+1]=this.bases[b]; this.bases[b]=null; }
    }
    this.wp=(this.wp||0)+1;
    events.push({text:`${pit.name} 폭투`,cls:'err'});
  }

  pl.bf++; bl.pa++;
  this._paDone=true;                       // 이 타석이 소비됐다 → 지시 카운트 차감
  // 플레이어가 고른 선수의 타석은 피드에서 따로 알려준다
  if(this.myId && bat.id===this.myId) this.log.push({t:'me',text:`▶ ${bat.name} 타석`});
  const cond = off.cond[bat.id];
  let batE = bat;
  /* 포수부담 — 포수로 출전하면 타격이 떨어진다 */
  const mySlot = off.slots[(off.order)%9];
  const mm = (typeof META!=='undefined') ? META[bat.id] : null;
  if(off.isUser && mm && mm.traits.includes('포수부담') && mySlot && mySlot.pos==='C'){
    batE = {...batE, con: batE.con*0.86, pow: batE.pow*0.86};
  }
  const bf = off.isUser && this.buff ? this.buff[bat.id] : null;
  if(bf){
    batE = {...bat};
    if(bf.pow) batE.pow = Math.min(80, bat.pow*bf.pow);
    if(bf.spd) batE.spd = Math.min(80, bat.spd*bf.spd);
    if(bf.all){ batE.con=bat.con*bf.all; batE.pow=bat.pow*bf.all; batE.spd=bat.spd*bf.all; }
  }
  /* ---- 고진선 이벤트 ---- 순서 중요: 각성 판정을 놀림보다 먼저 해야
     이번 타석이 아니라 '다음 타석'에 버프가 붙는다.                    */
  if(this.gojin){
    if(off.isUser && this.gojinWake[bat.id]){
      batE={...batE, con:Math.min(80,batE.con*1.22), pow:Math.min(80,batE.pow*1.22)};
      this.log.push({t:'gojin',text:`${bat.name} 눈빛이 달라졌다`});
      const mk=this.gojin.mocked.find(m=>m.pid===bat.id);
      if(mk)mk.woke=true;
      delete this.gojinWake[bat.id];
    }
    // 그날 무안타인 우리 타자를 놀린다 (경기당 최대 2명, 같은 선수 1번)
    if(off.isUser && bl.ab>=2 && bl.h===0 && this.gojin.mocked.length<2
       && !this.gojin.mocked.some(m=>m.pid===bat.id) && rng()<0.30){
      this.gojin.mocked.push({pid:bat.id,woke:false});
      this.gojin.log.push('mock');
      this.log.push({t:'gojin',text:pickOne(GOJIN_MOCK,rng)[0].replace('${n}',bat.name)});
      if(rng()<0.35){ this.gojinWake[bat.id]=true;   // 확률적 각성
        this.log.push({t:'gojin',text:`${bat.name}이(가) 배트를 고쳐 잡았다`}); }
      else this.log.push({t:'gojin',text:`${bat.name}이(가) 아무 말도 못 했다`});
    }
    // 안산이 3점 이상 지고 있으면 시비를 건다 → 벤치클리어링 (경기당 1회)
    if(!this.gojin.cleared && this.inning>=3
       && (this.oppSide().runs - this.userSide().runs) <= -3 && rng()<0.10){
      this.gojin.cleared=true;
      this.gojin.log.push('clear');
      this.log.push({t:'gojin',text:pickOne(GOJIN_CLEAR,rng)});
      this.log.push({t:'gojin',text:'벤치클리어링 — 양 팀이 그라운드로 몰려나왔다'});
      this.log.push({t:'gojin',text:'심판이 경고만 주고 경기를 재개했다'});
      this.gojinOpp*=0.94; this.gojinUs*=0.96;   // 양 팀 다 흔들린다
    }
  }

  /* ---- 경기 중 마찰 ---- 상대가 누구든 일어난다 */
  if(off.isUser || def.isUser){
    const usS=this.userSide(), thS=this.oppSide();
    const diff=usS.runs-thS.runs;
    // 전날 마신 김인규가 흥분한다
    if(!this.friction.drunk && this.inning>=3 && this.drunkIds.indexOf('kig')>=0
       && usS.slots.some(x=>x.id==='kig') && rng()<0.004){   // 경기당 약 13%
      this.friction.drunk='kig'; this.friction.log.push('drunk');
      this.log.push({t:'fric',text:pickOne(FRIC_KIG_DRUNK,rng)});
      this.friction.pending=true;
    }
    // 김한규가 있으면 벤치클리어링으로 번진다.
    // 판정은 딱 한 번만 한다 — 매 타석 굴리면 결국 100% 터진다.
    if(this.friction.pending && !this.friction.cleared){
      this.friction.pending=false;
      if(rng()<0.42){
      this.friction.cleared=true; this.friction.log.push('clear');
      const khg = usS.slots.some(x=>x.id==='khg');
      this.log.push({t:'fric',text: khg?pickOne(FRIC_KHG_CLEAR,rng)
        :'양 팀 선수들이 그라운드로 몰려나왔다'});
      this.log.push({t:'fric',text:pickOne(FRIC_CLEAR_END,rng)});
      this.friction.by = khg?'khg':(this.friction.drunk||'kig');
      this.fricUs*=0.97; this.fricOpp*=0.95;   // 양 팀 다 흔들린다
      } else {
        this.log.push({t:'fric',text:'주변에서 말려서 더 커지지는 않았다'});
      }
    }
    // 사구 뒤에도 번질 수 있다
    if(this.friction.hbp && !this.friction.cleared && !this.friction.pending
       && diff<=-3 && this.inning>=4 && rng()<0.004){
      this.friction.pending=true;
    }
    // 분위기 상승 — 크게 앞설 때
    if(!this.friction.up && off.isUser && diff>=3 && this.inning>=3 && rng()<0.012){
      this.friction.up=true; this.friction.log.push('up');
      this.log.push({t:'fric',text:pickOne(FRIC_UP,rng)});
      this.fricUs*=1.05;
    }
  }

  let pitE = pit;
  if(pit.heatFade && pl.outs>=6){
    const over=Math.min(12,pl.outs-6);
    pitE={...pit, stf:Math.max(14,pit.stf-8-over*1.6), ctl:Math.max(10,pit.ctl-5-over*1.1)};
  }
  /* 수비 시프트 — 정면 타구는 잘 잡히지만 반대쪽으로 빠지면 장타가 된다.
     simPA 를 고치지 않고 구장 배수(park)만 갈아끼워서 표현한다.        */
  let parkE=this.park;
  if(def.isUser && this.shiftTTL>0){
    parkE={...this.park, babip:this.park.babip*0.92,
           d2:this.park.d2*1.18, err:this.park.err*1.06};
  }
  // 고진선 이벤트 여파 — 공격 중인 쪽에 해당하는 배수를 곱한다
  const gjM = (off.isUser ? this.gojinUs : this.gojinOpp)
            * (off.isUser ? this.fricUs : this.fricOpp)
            * (off.isUser ? (this.mgr.boost||1) : 1);
  if(gjM!==1) parkE={...parkE, babip:parkE.babip*gjM};
  const res = simPA(batE, pitE, off.team, def.team, rng, off.tac, cond, parkE);
  // 번트 앤 런은 주자가 한 베이스 더 간다
  const advOdds = (off.isUser && this._buntRun) ? 0.62 : 0.35;

  const score=(rid,e)=>{ if(!rid)return; this.box[rid].r++; off.runs++; this.curIR++; pl.r++; if(e)pl.er++; };
  const adv=(n,e)=>{ for(let b=2;b>=0;b--){ if(this.bases[b]){ const nb=b+n;
    if(nb>=3){score(this.bases[b],e);bl.rbi++;} else this.bases[nb]=this.bases[b]; this.bases[b]=null; } } };

  if(res.type==='K'){ bl.ab++;bl.k++;pl.k++;pl.outs++;this.outs++;
    events.push({text:`${bat.name} 삼진`,cls:'out'}); }
  else if(res.type==='BB'||res.type==='HBP'){
    const isBB=res.type==='BB';
    if(isBB){bl.bb++;pl.bb++;off.bbs++;}else{
      bl.hbp++;pl.hbp++;
      // 우리 타자가 맞으면 벤치가 험악해진다 (경기당 1회)
      if(off.isUser && !this.friction.hbp && rng()<0.35){
        this.friction.hbp=true; this.friction.log.push('hbp');
        this.log.push({t:'fric',text:pickOne(FRIC_HBP,rng).replace('{n}',bat.name)});
        this.log.push({t:'fric',text:pickOne(FRIC_HBP_AFTER,rng)});
        this.fricUs*=1.04; this.fricOpp*=0.97;
      }
    }
    if(this.bases[0]&&this.bases[1]&&this.bases[2]){score(this.bases[2],true);bl.rbi++;this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]){this.bases[1]=this.bases[0];}
    this.bases[0]=bat.id;
    events.push({text:`${bat.name} ${isBB?'볼넷':'몸에 맞는 공'}`,cls:'bb'});
  }
  else if(res.type==='E'){ bl.ab++;def.errs++;adv(1,false);this.bases[0]=bat.id;
    events.push({text:`${bat.name} 상대 실책 출루`,cls:'err'});
    // 안산 야수가 실책하면 고진선이 폭발한다 (경기당 1회)
    if(this.gojin && !this.gojin.threw && !def.isUser && rng()<0.65){
      this.gojin.threw=true;
      this.gojin.log.push('throw');
      this.log.push({t:'gojin',text:pickOne(GOJIN_THROW,rng)});
      this.log.push({t:'gojin',text:pickOne(GOJIN_THROW_AFTER,rng)});
      this.gojinOpp*=0.92; this.gojinUs*=1.05;
    } }
  else if(res.type==='OUT'){
    bl.ab++;pl.outs++;this.outs++;
    const dpB = def.isUser ? (typeof dpBonus==='function'?dpBonus(def.slots).bonus:0) : 0;
    // 번트 앤 런은 굴러가면 주자가 걸릴 위험이 조금 더 크다
    const dpRisk = 0.030 + dpB + ((off.isUser&&this._buntRun)?0.050:0);
    if(res.gb&&this.bases[0]&&this.outs<3&&rng()<dpRisk){this.bases[0]=null;pl.outs++;this.outs++;
      this.dpCount=(this.dpCount||0)+1;
      events.push({text:`${bat.name} 병살타`,cls:'out'});
      this.hl('dp',off,bat.name,'');}
    else if(this.bases[2]&&this.outs<3&&!res.gb&&rng()<0.30){
      // 홈보살 특성 보유 외야수가 있으면 잡아낸다
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(of && rng()<0.10){
        this.bases[2]=null; pl.outs++; this.outs++;
        events.push({text:`${bat.name} 뜬공 — ${of.name} 홈 보살! 주자 아웃`,cls:'sb'});
        this.assists=(this.assists||0)+1;
        this.assistBy=of.id;
      } else {
        score(this.bases[2],true);bl.rbi++;this.bases[2]=null;
        events.push({text:`${bat.name} 희생플라이 · 1점`,cls:'score'});
      }
    }
    else events.push({text:`${bat.name} ${res.gb?'땅볼':'뜬공'} 아웃`,cls:'out'});
  }
  else{
    bl.ab++;bl.h++;pl.h++;off.hits++;
    if(res.type==='1B'){
      // 3루 주자 홈 쇄도 — 홈보살 특성 판정
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(this.bases[2]&&of&&this.outs<2&&rng()<0.10){
        const r3=this.bases[2]; this.bases[2]=null;
        this.box[r3]&&(this.box[r3].cs=this.box[r3].cs);
        pl.outs++; this.outs++;
        this.assists=(this.assists||0)+1; this.assistBy=of.id;
        events.push({text:`${bat.name} 안타 — ${of.name} 홈 보살! 3루 주자 아웃`,cls:'sb'});
        if(this.outs<3){ adv(rng()<advOdds?2:1,true); this.bases[0]=bat.id; }
      } else {
        adv(rng()<advOdds?2:1,true);this.bases[0]=bat.id;
        events.push({text:`${bat.name} 안타`,cls:'hit'});
      }
    }
    else if(res.type==='2B'){bl.d2++;adv(2,true);this.bases[1]=bat.id;
      events.push({text:`${bat.name} 2루타`,cls:'hit'});
      this.hl('d2',off,bat.name,'');}
    else if(res.type==='3B'){bl.d3++;adv(3,true);this.bases[2]=bat.id;
      events.push({text:`${bat.name} 3루타`,cls:'hit'});
      this.hl('d3',off,bat.name,'');}
    else{bl.hr++;let c=1;for(let b=0;b<3;b++)if(this.bases[b]){score(this.bases[b],true);c++;this.bases[b]=null;}
      score(bat.id,true);bl.rbi+=c;
      events.push({text:`${bat.name} 홈런! ${c}점`,cls:'hr'});
      this.hl('hr',off,bat.name,c>1?`${c}점 홈런`:'솔로 홈런');}
  }

  off.order++;
  // 내가 고른 선수가 주인공인 플레이는 표시를 달아 피드에서 강조한다
  const meP = this.myId ? (off.team.players.find(p=>p.id===this.myId)||def.team.players.find(p=>p.id===this.myId)) : null;
  const meName = meP ? meP.name : null;
  events.forEach(e=>{
    const mine = !!(meName && (e.text.indexOf(meName)===0 || e.text.indexOf('— '+meName)>=0));
    this.log.push({t:'play', me:mine, ...e});
    if(mine && (e.cls==='hr'||e.text.indexOf('3루타')>=0))
      this.log.push({t:'me',text:pickOne(['벤치가 뒤집어졌다','더그아웃에서 다 뛰어나왔다','오늘 주인공이다'])});
  });

  // 끝내기
  if(this.half===1 && this.inning>=this.INN && this.home.runs>this.away.runs){
    this.finish(); return {events, done:true};
  }
  if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
  return {events};
};

LiveGame.prototype.endHalf = function(){
  const off=this.off();
  off.line.push(this.curIR||0);
  this.curIR=0;
  this.outs=0; this.bases=[null,null,null];

  if(this.half===0){
    this.half=1;
    // 홈팀 리드 중 마지막 이닝 말 스킵
    if(this.inning>=this.INN && this.home.runs>this.away.runs){ this.home.line.push(null); this.finish(); return; }
    this.log.push({t:'inning',inning:this.inning,half:1,
      text:`${this.inning}회 말${this.inning>this.INN?' (연장)':''} · ${this.home.team.name} 공격`});
    this.checkPitcherChange(this.away);
    this.benchRotation();
  } else {
    // 이닝 종료
    const diff=Math.abs(this.away.runs-this.home.runs);
    if((this.inning>=4&&diff>=10)||(this.inning>=6&&diff>=7)){ this.mercy=true; this.finish(); return; }
    if(this.inning>=this.INN && this.away.runs!==this.home.runs){ this.finish(); return; }
    if(this.inning>=this.INN+3){ this.finish(); return; }
    this.inning++; this.half=0;
    this.log.push({t:'inning',inning:this.inning,half:0,
      text:`${this.inning}회 초${this.inning>this.INN?' (연장)':''} · ${this.away.team.name} 공격`});
    this.checkPitcherChange(this.home);
    this.benchRotation();          // 나온 사람은 한 번은 타석에 세운다
  }
};

/* 사회인야구는 나온 사람을 그냥 앉혀두지 않는다.
   경기 후반이 되면 벤치에서 기다린 사람을 한 번은 타석에 세운다.
   대신 잘 치고 있는 사람을 빼지는 않는다 — 그날 무안타인 사람과 바꾼다.
   (선발 투수는 건드리지 않는다)                                        */
LiveGame.prototype.benchRotation = function(){
  const us=this.userSide(); if(!us||!us.isUser) return;
  if(this.inning < Math.max(4, this.INN-2)) return;      // 5회부터
  if(this._benchDone==null) this._benchDone=0;
  if(this._benchDone>=3) return;                          // 한 경기 세 명까지
  const team=us.team;
  const inGame=new Set(us.slots.map(x=>x.id));
  const cand=(this.benchPool||[]).filter(id=>!inGame.has(id));
  if(!cand.length) return;

  // 그날 무안타인 야수 중에서 타수가 제일 많은 사람을 뺀다
  let outIdx=-1, outAb=0;
  us.slots.forEach((sl,i)=>{
    if(sl.pos==='P') return;                              // 투수는 안 뺀다
    const b=this.box[sl.id]; if(!b) return;
    if(b.h>0) return;                                     // 안타 친 사람은 그대로 둔다
    if(b.ab>=1 && b.ab>outAb){ outAb=b.ab; outIdx=i; }
  });
  if(outIdx<0) return;

  const pos=us.slots[outIdx].pos;
  const inId=cand.find(id=>{
    const f=(typeof posFit==='function')?posFit(id,pos):1;
    return pos==='DH'||f>0;
  }) || cand[0];
  if(!inId) return;
  const outId=us.slots[outIdx].id;
  const inP=team.players.find(p=>p.id===inId);
  if(!inP) return;

  us.slots[outIdx]={id:inId,pos};
  if(!this.box[inId]) this.box[inId]=blankBat();
  this._benchDone=(this._benchDone||0)+1;
  this.subs=this.subs||[];
  this.subs.push({in:inId,out:outId,pos,inning:this.inning});
  this.log.push({t:'sub',
    text:`교체 · ${this.nameOf(outId)}(${outAb}타수 무안타) → ${this.nameOf(inId)} (${POSNAMES[pos]||pos})`});
};
LiveGame.prototype.nameOf = function(id){
  const p=(this.home.team.players.concat(this.away.team.players)).find(x=>x.id===id);
  return p?p.name:'?';
};

LiveGame.prototype.finish = function(){
  if(this.over) return;
  this.over=true;
  // 부상 판정
  const us=this.userSide();
  if(this.rng()<0.085){
    const cands=us.slots.map(x=>us.team.players.find(p=>p.id===x.id)).filter(Boolean);
    const v=cands[(this.rng()*cands.length)|0];
    if(v) this.injuries.push({id:v.id, roll:this.rng()});
  }
  const tie=this.away.runs===this.home.runs;
  const awayWin=this.away.runs>this.home.runs;
  const win=awayWin?this.away:this.home, lose=awayWin?this.home:this.away;
  this.result={
    away:{team:this.away.team,runs:this.away.runs,hits:this.away.hits,errs:this.away.errs,bbs:this.away.bbs,sbAllowed:this.away.sbAllowed,line:this.away.line},
    home:{team:this.home.team,runs:this.home.runs,hits:this.home.hits,errs:this.home.errs,bbs:this.home.bbs,sbAllowed:this.home.sbAllowed,line:this.home.line},
    box:this.box, pbox:this.pbox, log:this.log, tie,
    winner:tie?null:(awayWin?this.away.team.id:this.home.team.id),
    wp:tie?null:win.rot[0],
    lp:tie?null:lose.rot[Math.min(lose.pIdx,lose.rot.length-1)],
    innings:this.inning, mercy:this.mercy, injuries:this.injuries,
    dpCount:this.dpCount||0, assists:this.assists||0, assistBy:this.assistBy||null,
    wpCount:this.wp||0,          // 폭투 수. wp(승리투수 id)와 키가 겹치면 안 된다
    gojin:this.gojin,
    friction:this.friction,
    highlights:this.highlights,
  };
};

/* 전술 적용 */
LiveGame.prototype.pitcherOptions = function(){
  const s=this.userSide();
  return s.rot.slice(this.userSide().pIdx+1);
};
LiveGame.prototype.applyDecision = function(choice){
  const s=this.userSide();
  const p=this.pending;
  this.pending=null;
  if(p && p.kind==='pitcherChange'){
    if(choice==='change'){
      const old=this.curPitcher(p.side).name;
      p.side.pIdx++;
      this.log.push({t:'sub',text:`투수 교체 · ${old} → ${this.curPitcher(p.side).name}`});
    } else {
      this.log.push({t:'sub',text:`교체 없이 계속 간다`});
      p.side._stay=(p.side._stay||0)+1;
    }
    return;
  }
  /* ---- 수비 판단 ---- */
  if(choice==='pchange'){                      // 투수 교체는 작전 횟수를 안 먹는다
    if(!this.userPitcherChange()) this.log.push({t:'sub',text:'바꿀 투수가 없다'});
    return;
  }
  if(choice==='ibb'){ this.defTimeouts--; this.intentionalWalk(); return; }
  if(choice==='shift'){ this.defTimeouts--; this.setShift(true); return; }
  if(choice==='unshift'){ this.setShift(false); return; }
  if(choice==='defnone'){ this.defTimeouts--; this.log.push({t:'sub',text:'그대로 간다'}); return; }

  /* ---- 공격 작전 ---- 전부 유효 타석 수가 붙는다 (무한 지속 버그 수정) */
  this.timeouts--;
  if(choice==='bunt'){
    s.tac.bat='contact'; this._buntRun=false; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 번트 · 진루타 지시 (1타석)'});
  } else if(choice==='buntrun'){
    s.tac.bat='contact'; s.tac.run='aggressive'; this._buntRun=true;
    this.tacTTL.bat=1; this.tacTTL.run=1;
    this.log.push({t:'sub',text:'작전: 번트 앤 런 (1타석)'});
  } else if(choice==='steal'){
    s.tac.run='aggressive'; this.tacTTL.run=2;
    this.log.push({t:'sub',text:'작전: 적극 주루 지시 (2타석)'});
  } else if(choice==='patient'){
    s.tac.bat='patient'; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 공 많이 보기 (1타석)'});
  } else if(choice==='swing'){
    s.tac.bat='aggressive'; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 초구부터 적극 타격 (1타석)'});
  } else if(choice==='hold'){
    s.tac.run='hold'; this.tacTTL.run=2;
    this.log.push({t:'sub',text:'작전: 주루 자제 (2타석)'});
  } else if(choice==='normal'){
    s.tac.bat=s.tacBase.bat||'normal'; s.tac.run=s.tacBase.run||'normal';
    this.tacTTL.bat=0; this.tacTTL.run=0; this._buntRun=false;
    this.log.push({t:'sub',text:'작전: 지시 해제'});
  }
};

/* 유저가 직접 투수를 바꾼다 */
LiveGame.prototype.userPitcherChange = function(){
  const s=this.userSide();
  if(s.pIdx>=s.rot.length-1) return false;
  const old=this.curPitcher(s).name;
  s.pIdx++;
  const now=this.curPitcher(s).name;
  this.log.push({t:'sub',text: this.off().isUser
    ? `투수 교체 예고 · ${old} → ${now} (다음 수비부터)`
    : `투수 교체 · ${old} → ${now}`});
  return true;
};

/* 고의4구 — 한 타석을 그냥 내준다.
   볼넷이므로 공짜진루 지수(볼넷+도루허용+폭투)에 그대로 잡힌다.
   13경기 무예외로 14 이하면 승, 16 이상이면 패였다. 공짜로 주는 게 아니다. */
LiveGame.prototype.intentionalWalk = function(){
  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  if(!bat){ this.pending=null; return; }
  const bl=this.box[bat.id]=this.box[bat.id]||newBoxL();
  pl.bf++; bl.pa++; bl.bb++; pl.bb++; off.bbs++;
  if(this.bases[0]&&this.bases[1]&&this.bases[2]){       // 만루면 밀어내기 실점
    this.box[this.bases[2]].r++; off.runs++; this.curIR=(this.curIR||0)+1;
    pl.r++; pl.er++; bl.rbi++;
    this.bases[2]=this.bases[1]; this.bases[1]=this.bases[0];
    this.log.push({t:'play',cls:'score',text:`고의4구 밀어내기 · 1점`});
  }
  else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
  else if(this.bases[0]){this.bases[1]=this.bases[0];}
  this.bases[0]=bat.id;
  off.order++;
  this.log.push({t:'sub',text:`고의4구 · ${bat.name}을(를) 거른다`});
  this.pending=null;
  this.tickTactics(false);
};

/* =========================================================
   감독 액션 — FM 의 벤치 반응
   ---------------------------------------------------------
   물통 차기 · 박수 · 심판 어필 · 조용히 지켜보기.
   경기당 3번. 지금 지고 있냐 이기고 있냐에 따라 결과가 다르다.
   ========================================================= */
LiveGame.prototype.mgrAction = function(kind){
  if(this.mgr.left<=0) return {ok:false, text:'더 할 수 있는 게 없다'};
  const rng=this.rng;
  const us=this.userSide(), th=this.oppSide();
  const diff=us.runs-th.runs;
  this.mgr.left--;
  let text='', sub='', d=0;

  if(kind==='bottle'){
    // 물통 차기 — 지고 있을 때 효과가 크고, 이기고 있으면 역효과
    const good = diff<0 ? 0.62 : (diff===0?0.45:0.25);
    if(rng()<good){
      d=+0.06; this.mgr.boost=(this.mgr.boost||1)*1.06;
      text=pickOne(['감독이 물통을 걷어찼다','감독이 물통을 발로 날렸다','감독이 아이스박스를 쳤다'],rng);
      sub=pickOne(['벤치가 조용해지더니 눈빛이 달라졌다','선수들이 정신을 차렸다','더그아웃 공기가 팽팽해졌다'],rng);
    } else {
      d=-0.04; this.mgr.boost=(this.mgr.boost||1)*0.96;
      text=pickOne(['감독이 물통을 걷어찼다','감독이 헬멧 통을 밀어버렸다'],rng);
      sub=pickOne(['다들 눈치만 본다. 분위기가 더 굳었다','선수들이 위축됐다','심판이 이쪽을 쳐다본다'],rng);
    }
  }
  else if(kind==='clap'){
    d=+0.03; this.mgr.boost=(this.mgr.boost||1)*1.03;
    text=pickOne(['감독이 크게 박수를 친다','감독이 파이팅을 외쳤다','감독이 하나하나 손뼉을 마주쳤다'],rng);
    sub=pickOne(['벤치가 따라 소리를 낸다','분위기가 조금 올라왔다','타석 들어가는 선수 표정이 낫다'],rng);
  }
  else if(kind==='umpire'){
    // 심판 어필 — 판정이 유리해질 수도, 역효과일 수도
    const r=rng();
    if(r<0.40){
      d=+0.05; this.mgr.boost=(this.mgr.boost||1)*1.05;
      text='감독이 심판에게 스트라이크 존을 항의했다';
      sub='심판이 고개를 끄덕였다. 다음 타석부터 존이 조금 넓어진 느낌이다';
    } else if(r<0.80){
      text='감독이 심판에게 항의했다';
      sub='심판이 손을 저었다. 달라진 건 없다';
    } else {
      d=-0.05; this.mgr.boost=(this.mgr.boost||1)*0.95;
      this.mgr.warned=true;
      text='감독이 심판에게 강하게 항의했다';
      sub='경고를 받았다. 한 번 더 하면 퇴장이다';
    }
  }
  else { // watch
    this.mgr.left++;                       // 지켜보기는 횟수를 안 쓴다
    text='감독이 팔짱을 끼고 그라운드를 본다';
    sub='아무 말도 하지 않았다';
  }
  this.log.push({t:'mgr',text:text});
  this.log.push({t:'mgr',text:'— '+sub});
  this.mgr.log.push(kind);
  return {ok:true, text:text+' — '+sub, delta:d};
};

/* 수비 시프트 — 3타석 동안 유지되고 자동으로 풀린다 */
LiveGame.prototype.setShift = function(on){
  this.shiftTTL = on?3:0;
  this.log.push({t:'sub',text: on
    ? '수비 시프트 — 당겨치는 쪽으로 몰았다 (3타석)'
    : '수비 시프트 해제'});
};

/* 수비 위치 변경 */
LiveGame.prototype.swapPos = function(idxA, idxB){
  const s=this.userSide();
  const t=s.slots[idxA].pos; s.slots[idxA].pos=s.slots[idxB].pos; s.slots[idxB].pos=t;
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idxA)} ${POSNAMES[s.slots[idxA].pos]} / ${this.nameOfSlot(idxB)} ${POSNAMES[s.slots[idxB].pos]}`});
};
LiveGame.prototype.nameOfSlot = function(i){
  const s=this.userSide();
  const p=s.team.players.find(x=>x.id===s.slots[i].id);
  return p?p.name:'?';
};
LiveGame.prototype.movePos = function(idx, pos){
  const s=this.userSide();
  const other=s.slots.findIndex((x,i)=>i!==idx&&x.pos===pos);
  if(other>=0) s.slots[other].pos=s.slots[idx].pos;
  s.slots[idx].pos=pos;
  this.recalcDef();
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idx)} → ${POSNAMES[pos]}`});
};
LiveGame.prototype.recalcDef = function(){
  const s=this.userSide();
  const c=s.slots.find(x=>x.pos==='C');
  const cp=c?s.team.players.find(p=>p.id===c.id):null;
  s.cArm=(cp?cp.arm:45)-this.gearPenalty;
  if(typeof recalcTeamDefense==='function') recalcTeamDefense(s.team, s.slots, this.gearPenalty);
};

/* 대타 */
LiveGame.prototype.pinchHit = function(newId){
  const s=this.userSide();
  const idx=s.order%9;
  const oldId=s.slots[idx].id;
  const oldP=s.team.players.find(p=>p.id===oldId);
  const newP=s.team.players.find(p=>p.id===newId);
  s.slots[idx].id=newId;
  this.box[newId]=this.box[newId]||newBoxL();
  this.usedPH[oldId]=true;
  this.pending=null;
  this.log.push({t:'sub',text:`대타 · ${oldP.name} → ${newP.name}`});
};

</script>
<script>
/* =========================================================
   우완좌완 야구 매니저 v2 — UI
   ========================================================= */
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};

/* ================= 플레이타임 =================
   숫자만 던져주면 감이 안 온다. '2시간 12분' 보다 '영화 한 편 봤다'가 와닿는다.
   그래서 구간마다 시간·거리에 빗댄 문장을 하나씩 붙여둔다.                 */
const PLAYTIME_SCALE=[
  [0,       '이제 막 시작했다. 캐치볼 첫 공 던진 정도다.'],
  [3*60,    '몸 푸는 시간. 러닝 한 바퀴 돌았다.'],
  [5*60,    '컵라면 익는 시간. 뚜껑 열면 딱이다.'],
  [10*60,   '학교 쉬는시간 하나. 매점 갔다 오면 끝나는 시간이다.'],
  [20*60,   '쉬는시간 두 번. 걸어서 1.5km — 집에서 편의점 갔다 온 거리다.'],
  [30*60,   '점심시간 하나. 걸어서 2.5km — 안산 호수공원 반 바퀴다.'],
  [45*60,   '수업 한 교시. 슬슬 눈꺼풀이 무거워질 무렵이다.'],
  [60*60,   '한 시간. 안산에서 서울 강남까지 지하철로 가는 시간이다. 앉아서 갔으면 한숨 잤다.'],
  [80*60,   '축구 한 경기 풀타임. 전후반에 추가시간까지 다 뛰었다.'],
  [90*60,   '경기 5회쯤. 슬슬 투수 바꿔야 하나 고민할 때다.'],
  [2*3600,  '영화 한 편. 서울에서 대전까지 KTX로 갔다 돌아온 시간이다.'],
  [3*3600,  '서울에서 부산까지 KTX. 이미 도착해서 밀면 시켜놓고 기다리는 중이다.'],
  [4*3600,  '사회인야구 한 경기 + 뒤풀이까지. 또는 인천에서 도쿄 갔다 오는 비행 시간.'],
  [5*3600,  '인천에서 방콕 가는 비행기 안. 기내식이 두 번 나왔다.'],
  [6*3600,  '서울-부산 KTX 왕복. 당일치기 출장 하나 다녀온 셈이다.'],
  [8*3600,  '직장인 하루 근무. 야근 없이 칼퇴한 하루를 통으로 여기에 썼다.'],
  [10*3600, '인천에서 두바이. 비행기에서 영화 네 편 볼 시간이다.'],
  [12*3600, '밤 10시에 자서 아침 10시에 일어난 셈. 잠 대신 야구했다.'],
  [15*3600, '인천에서 뉴욕 직항. 태평양을 통째로 건넜다.'],
  [20*3600, '쉬지 않고 걸으면 서울에서 천안까지 간다. 80km다.'],
  [24*3600, '하루를 통째로. 지구 반대편 어디든 비행기로 닿는 시간이다.'],
  [2*86400, '주말 이틀. 금요일 밤부터 일요일 밤까지 논 셈이다.'],
  [3*86400, '택배가 제주도까지 갔다가 돌아올 시간이다.'],
  [5*86400, '월화수목금. 한 주 근무시간(40시간)의 세 배를 여기에 썼다.'],
  [7*86400, '일주일. 정규시즌 한 주가 통째로 지나갔다.'],
  [14*86400,'2주. 신병교육대 절반을 여기서 보냈다.'],
  [30*86400,'한 달. 이쯤 되면 취미가 아니라 직업이다. 회비는 냈냐?'],
];
function fmtPlaySec(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
  if(d>0) return `${d}일 ${h}시간 ${m}분`;
  if(h>0) return `${h}시간 ${m}분`;
  if(m>0) return `${m}분`;
  return `${sec}초`;
}
function playTimeLine(sec){
  sec=Math.max(0,Math.floor(sec||0));
  let out=PLAYTIME_SCALE[0][1];
  for(let i=0;i<PLAYTIME_SCALE.length;i++){ if(sec>=PLAYTIME_SCALE[i][0]) out=PLAYTIME_SCALE[i][1]; }
  return out;
}
/* 5초마다 더한다. 탭이 뒤로 가 있으면 세지 않는다 — 켜놓기만 한 시간은 플레이가 아니다.
   5분마다 한 번씩 조용히 저장해서 브라우저를 그냥 닫아도 시간이 날아가지 않게 한다. */
let ptTimer=null, ptSavedAt=0;
function startPlayClock(){
  if(ptTimer)clearInterval(ptTimer);
  ptTimer=setInterval(()=>{
    if(!ST)return;
    if(typeof document.hidden!=='undefined'&&document.hidden)return;
    ST.playSec=(ST.playSec||0)+5;
    devTickTime();
    if((ST.playSec-ptSavedAt)>=300){ ptSavedAt=ST.playSec; saveGame(true); }
    const a=document.getElementById('pt-val'); if(a)a.textContent=fmtPlaySec(ST.playSec);
    const b=document.getElementById('pt-line'); if(b)b.textContent=playTimeLine(ST.playSec);
  },5000);
}
const POSNAMES = {C:'포수','1B':'1루','2B':'2루','3B':'3루',SS:'유격',LF:'좌익',CF:'중견',RF:'우익',DH:'지타',P:'투수'};
const ALLPOS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

function avg(b){return b.ab?b.h/b.ab:0;}
function obp(b){return b.pa?(b.h+b.bb+b.hbp)/b.pa:0;}
function slg(b){const tb=b.h+b.d2+b.d3*2+b.hr*3;return b.ab?tb/b.ab:0;}
function ops(b){return obp(b)+slg(b);}
function fmt3(v){return v.toFixed(3).replace(/^0\./,'.');}

/* ================= 내 선수 성장 =================
   내가 고른 선수는 한계가 따로 없다. 대신 그냥 오르지는 않는다.
   경기에 나가고, 훈련에 나가고, 실제로 붙잡고 있은 시간만큼만 열린다.
   바로 캐리하면 금방 질리니까 천천히, 대신 끝까지 간다.

   투자 1점당 잠재치 +0.16. 능력치 상한(80)까지 가려면 대략:
     한 시즌 개근(22경기 + 훈련 22회) = 약 35점 → +5.6
   즉 두세 시즌을 꾸준히 굴려야 리그 최상위에 닿는다.
   게다가 열린 잠재치를 실제 능력치로 바꾸려면 훈련을 또 몰아줘야 한다.  */
const DEV_PER_GAME  = 1.0;    // 라인업에 들어 경기를 뛰면
const DEV_PER_TRAIN = 0.6;    // 훈련에 나오면
const DEV_PER_20MIN = 0.15;   // 실제로 붙잡고 있은 시간 20분마다
const DEV_TO_PA     = 0.16;   // 투자 1점 → 잠재치

function devSlot(){
  if(!ST.dev)ST.dev={pts:0,games:0,trains:0,minTick:0};
  return ST.dev;
}
function devBonus(pid){
  if(pid!==(ST.playerId||MYID))return 0;
  const d=(ST&&ST.dev)?ST.dev:null;
  return d ? d.pts*DEV_TO_PA : 0;
}
/* 경기·훈련·플레이타임을 투자 점수로 환산한다 */
function devEarn(kind){
  const d=devSlot();
  if(kind==='game'){ d.games++; d.pts+=DEV_PER_GAME; }
  else if(kind==='train'){ d.trains++; d.pts+=DEV_PER_TRAIN; }
}
/* 플레이타임은 20분 단위로 끊어서 준다 */
function devTickTime(){
  const d=devSlot();
  const ticks=Math.floor((ST.playSec||0)/1200);
  if(ticks>(d.minTick||0)){
    d.pts += (ticks-(d.minTick||0))*DEV_PER_20MIN;
    d.minTick=ticks;
  }
}

function effCA(pid){const b=ST&&ST.ca?ST.ca[pid]:null; if(b!=null)return b;
  const p=TBYID['wwzw'].players.find(x=>x.id===pid); return p?calcCA(p):30;}
function effPA(pid){
  const p=TBYID['wwzw'].players.find(x=>x.id===pid); if(!p)return 40;
  return Math.min(80, calcPA(p,META[pid]) + devBonus(pid));
}
function condLabel(v){return v>=85?'최상':v>=70?'양호':v>=55?'보통':v>=40?'저하':'최악';}

function moraleLabel(v){return v>=85?'매우 높음':v>=70?'좋음':v>=55?'보통':v>=40?'불만':'매우 불만';}

function valDelta(pid, now){
  const prev=(ST.valuePrev&&ST.valuePrev[pid]);
  if(prev==null) return '';
  const d=now-prev;
  if(Math.abs(d)<0.15) return '';
  return d>0 ? `<i class="vup">▲${d.toFixed(1)}</i>` : `<i class="vdn">▼${Math.abs(d).toFixed(1)}</i>`;
}

function autoFixLineup(){
  if(!ST.lineup)return;
  const t=TBYID['wwzw'];
  const bad=ST.lineup.filter(s=>!isAvailable(s.id));
  if(!bad.length){ sanitizeRotation(); return; }
  const avail=t.players.filter(p=>isAvailable(p.id));
  if(avail.length>=9){
    const pool=avail.filter(p=>!ST.lineup.some(x=>x.id===p.id));
    bad.forEach(b=>{
      const i=ST.lineup.findIndex(x=>x.id===b.id);
      if(i<0)return;
      const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
      if(rep){ ST.lineup[i].id=rep.id; pool.splice(pool.indexOf(rep),1); }
    });
    // 포지션 적합도 재정리
    optimizePositions();
  }
  sanitizeRotation();
}

/* 라인업 인원 그대로 두고 포지션만 최적 배치 */
function optimizePositions(){
  const t=TBYID['wwzw'];
  const ids=ST.lineup.map(s=>s.id);
  const needP = !ST.useDH;
  const slots = needP ? ['P','C','1B','2B','3B','SS','LF','CF','RF']
                      : ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
  // 헝가리안 대신 탐욕: 적합도 높은 순으로 배정
  const pairs=[];
  ids.forEach(id=>slots.forEach(pos=>pairs.push({id,pos,v:pos==='DH'?30:posFit(id,pos)})));
  pairs.sort((a,b)=>b.v-a.v);
  const usedId=new Set(), usedPos=new Set(), assign={};
  pairs.forEach(p=>{
    if(p.v<=0)return;
    if(usedId.has(p.id)||usedPos.has(p.pos))return;
    assign[p.id]=p.pos; usedId.add(p.id); usedPos.add(p.pos);
  });
  // 남은 인원은 빈 자리에 강제 배치
  ids.forEach(id=>{
    if(assign[id])return;
    const free=slots.find(x=>!usedPos.has(x));
    if(free){assign[id]=free;usedPos.add(free);}
  });
  ST.lineup.forEach(s=>{ if(assign[s.id])s.pos=assign[s.id]; });
  syncStarter();
}

function recommendLineup(){
  const t=TBYID['wwzw'];
  const pool=t.players.filter(p=>isAvailable(p.id));
  const use=pool.length>=9?pool:t.players;
  const sc=p=>p.con*1.1+p.pow*0.9+p.eye*0.7+p.spd*0.5+(ST&&ST.cond?(ST.cond[p.id]-70)*0.25:0);
  const sorted=use.slice().sort((a,b)=>sc(b)-sc(a));
  const used=new Set(); const slots=[];
  const c=sorted.find(p=>p.pos.includes('C'));
  if(c){slots.push({id:c.id,pos:'C'});used.add('C');}
  for(const p of sorted){
    if(slots.length>=9)break;
    if(slots.some(s=>s.id===p.id))continue;
    const pos=p.pos.find(x=>x!=='P'&&!used.has(x))||ALLPOS.find(x=>!used.has(x));
    if(!pos)break; used.add(pos); slots.push({id:p.id,pos});
  }
  const byId=id=>t.players.find(p=>p.id===id);
  const pool2=slots.slice(); const order=[];
  const take=fn=>{let bi=0,bv=-1e9;pool2.forEach((s,i)=>{const v=fn(byId(s.id));if(v>bv){bv=v;bi=i;}});return pool2.splice(bi,1)[0];};
  order.push(take(p=>p.con*1.2+p.spd*1.4));
  order.push(take(p=>p.con*1.3+p.spd*1.0));
  order.push(take(p=>p.con*1.0+p.pow*1.2));
  order.push(take(p=>p.pow*1.6));
  order.push(take(p=>p.pow*1.2+p.con*0.7));
  while(pool2.length) order.push(take(p=>p.con+p.pow+p.eye*0.5));
  return order;
}
function buildPitcherPool(){
  // 사회인야구는 누구나 던진다. 포지션 등급 P를 기준으로 구위/제구/체력 산출
  const t=TBYID['wwzw'];
  t.pitchers = t.players.map(p=>{
    const m=META[p.id];
    const pf = m&&m.pos ? (m.pos['P']||25) : 25;
    if(p.pitch) return {id:p.id,name:p.name,stf:p.pitch.stf,ctl:p.pitch.ctl,sta:p.pitch.sta};
    return {id:p.id,name:p.name,
      stf:Math.round(clamp(pf*0.55+p.arm*0.45,18,75)),
      ctl:Math.round(clamp(pf*0.75+p.eye*0.25-8,15,70)),
      sta:Math.round(clamp(pf*0.6+22,22,62))};
  });
  return t.pitchers;
}
function recommendRotation(){
  const t=TBYID['wwzw'];
  buildPitcherPool();
  return t.pitchers.slice()
    .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
    .slice(0,6).map(p=>p.id);
}
function recalcTeamDefense(team, slots, gearPenalty){
  if(!team.isUser) return;
  let sum=0;
  slots.forEach(sl=>{
    const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const m=META[sl.id];
    const fit=posFit(sl.id, sl.pos);
    let penalty = fit<=0 ? 22 : Math.max(0,(45-fit)*0.55);
    if(m){
      /* 좁은 범위 — 내야에서 특히 손해 */
      if(m.traits.includes('좁은범위')&&['2B','3B','SS'].includes(sl.pos)) penalty+=9;
      /* 외야 미숙 */
      if(m.traits.includes('외야미숙')&&['LF','CF','RF'].includes(sl.pos)) penalty+=8;
    }
    sum += Math.max(15, p.def - penalty);
  });
  team._slotDef = sum/Math.max(1,slots.length);
  team._errMod = 1 + Math.max(0,(46-team._slotDef))*0.020 + (gearPenalty?0.05:0);
}

function aiLineup(team){
  const s=team.players.slice().sort((a,b)=>(b.con+b.pow+b.eye+b.spd*0.4)-(a.con+a.pow+a.eye+a.spd*0.4));
  const u=new Set(),o=[];
  for(const p of s){if(o.length>=9)break;const pos=p.pos.find(x=>!u.has(x))||ALLPOS.find(x=>!u.has(x));if(!pos)break;u.add(pos);o.push({id:p.id,pos});}
  // AI도 수비 배치에 따른 손실을 반영 (우리만 최적화 이득 보지 않게)
  let sum=0;
  o.forEach(sl=>{ const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const fit=(p.pos&&p.pos.indexOf(sl.pos)>=0)?50:32;
    sum+=Math.max(15,p.def-Math.max(0,(45-fit)*0.55)); });
  team._slotDef=sum/Math.max(1,o.length);
  return o;
}
function aiRotation(t){return t.pitchers.slice().sort((a,b)=>(b.stf+b.ctl+b.sta)-(a.stf+a.ctl+a.sta)).map(p=>p.id);}

/* ---------- 저장 ---------- */
/* 아티팩트 밖(브라우저)에서는 localStorage 로 떨어진다.
   file:// 로 직접 열면 오리진이 opaque 라 여기서 예외가 난다 — 그때는 저장이 안 되고
   내보내기로 옮겨야 한다. */
const STORE = (typeof window.storage!=='undefined') ? window.storage : {
  set:(k,v)=>{ localStorage.setItem(k,v); return Promise.resolve(); },
  get:(k)=>Promise.resolve({value:localStorage.getItem(k)})
};
/* 자동 저장 + 백업 한 벌.
   저장이 깨졌을 때를 대비해 '직전 세이브'를 따로 남긴다.
   저장 전 현재 값을 백업으로 밀어 넣는 방식이라 항상 한 세대 전이 남는다. */
let lastSaveAt=null, lastSaveOk=true;
async function saveGame(silent){
  try{
    // 직전에 저장돼 있던 내용을 백업 슬롯으로 옮긴다
    try{
      const prev=await STORE.get('wwzw_v5',false);
      if(prev&&prev.value) await STORE.set('wwzw_v5_bak',prev.value,false);
    }catch(e){/* 백업 실패는 본 저장을 막지 않는다 */}
    await STORE.set('wwzw_v5',JSON.stringify(ST),false);
    lastSaveAt=Date.now(); lastSaveOk=true;
    if(!silent)toast('저장 완료');
  }catch(e){
    lastSaveOk=false;
    toast('저장 실패 — 더보기에서 파일로 저장해라');
  }
}
async function loadGame(){
  try{
    const r=await STORE.get('wwzw_v5',false);
    if(r&&r.value){
      const d=JSON.parse(r.value);
      if(d&&d.v===5) return d;
    }
  }catch(e){}
  return null;
}
/* 본 세이브가 깨졌을 때 쓰는 백업 슬롯 */
async function loadBackup(){
  try{
    const r=await STORE.get('wwzw_v5_bak',false);
    if(!r||!r.value)return null;
    const d=JSON.parse(r.value);
    return (d&&d.v===5)?d:null;
  }catch(e){return null;}
}
async function restoreBackup(){
  const d=await loadBackup();
  if(!d){ toast('백업이 없다'); return false; }
  ST=d; normalizeState(); await saveGame(true); go('home');
  toast(`백업 복구 완료 — ${d.round}차전 시점`);
  return true;
}
/* ---------- 내보내기 / 불러오기 ---------- */
async function exportSave(){
  const data=JSON.stringify(ST);
  const st=ST.stand['wwzw'];
  const fname=`우완좌완_${st.w}승${st.l}패_${ST.round}차전.json`;
  /* 아티팩트 안에서는 <a download> 가 막혀 있다. 호스트가 주는 저장 통로를 먼저 써본다. */
  try{
    const dl = (window.claude&&window.claude.use) ? await window.claude.use('downloads') : null;
    if(dl){
      try{ await dl.save({filename:fname,data}); toast('세이브 파일 저장됨'); }
      catch(err){
        if(err&&err.code==='declined') toast('저장을 취소했다');
        else toast('파일 저장이 안 된다 — 코드 복사를 써라');
      }
      return;
    }
  }catch(e){/* 통로가 없으면 아래 일반 다운로드로 간다 */}
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
  toast('세이브 파일 저장됨');
}
function copySave(){
  const data=JSON.stringify(ST);
  const ta=document.createElement('textarea');
  ta.value=data; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok){ toast('세이브 코드 복사됨'); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(data).then(()=>toast('세이브 코드 복사됨'),()=>toast('복사 실패')); }
  else toast('복사 실패 — 파일 저장을 써라');
}
function importFromText(txt){
  try{
    const d=JSON.parse(txt);
    if(!d||d.v!==5){ toast('세이브 형식이 맞지 않는다'); return false; }
    ST=d; normalizeState(); saveGame(true); go('home'); toast('불러오기 완료');
    return true;
  }catch(e){ toast('불러오기 실패 — 코드를 확인해라'); return false; }
}
function importSaveFile(file){
  const r=new FileReader();
  r.onload=()=>importFromText(String(r.result));
  r.onerror=()=>toast('파일을 읽지 못했다');
  r.readAsText(file);
}

function runWeek(){
  if(!ST.notices)ST.notices=[];
  ST.events=[];
  ST.weekSeq=(ST.weekSeq||0)+1;
  const rng=makeRng((ST.seed+ST.round*31337+ST.weekSeq*7717)>>>0);
  Object.keys(ST.injury).forEach(pid=>{
    const inj=ST.injury[pid]; if(!inj)return;
    inj.games--;
    if(inj.games<=0){ST.injury[pid]=null;
      ST.notices.push({type:'recover',title:`${nameOf(pid)} 복귀`,body:`${inj.name}에서 회복했다.`,effect:'출전 가능'});}
  });
  TBYID['wwzw'].players.forEach(p=>{
    const m=META[p.id];
    let rec=(m&&m.traits.includes('성실'))?11:7;
    if(m&&m.traits.includes('안방마님'))rec+=3;   // 궂은일을 해도 몸이 버틴다
    ST.cond[p.id]=Math.min(100,ST.cond[p.id]+rec+((rng()*7)|0)-3);
    ST.morale[p.id]=Math.max(10,Math.min(100,ST.morale[p.id]+(ST.morale[p.id]<70?2:-1)));
  });
  ST.mittMissing=false; ST.scoutBlocked=false;
  // 지난 경기 갈등으로 예고된 결장 반영
  const pend=ST.pendingAbsent||{};
  const evs=rollWeekEvents(ST,rng);
  if(evs.some(e=>e.type==='discharge')) ST.justDischarged=true;
  ST.gameDate=(ST.calendar&&ST.calendar.label)||'';
  Object.keys(pend).forEach(id=>{
    if(ST.injury[id])return;
    evs.push({type:'absent',pid:id,title:`${nameOf(id)} 결장`,
      body:`${nameOf(id)}이(가) ${pend[id]} 안 나온다고 한다.`,effect:'이번 경기 출전 불가'});
  });
  ST.pendingAbsent={};
  const carried=(ST.notices||[]).slice();
  ST.notices=[];
  ST.events=carried.concat(evs);
  const rained=applyWeekEvents(ST,evs);
  // 결장자가 라인업에 있으면 자동 교체
  autoFixLineup();
  ST.kakao=[]; ST.kakaoPost=[]; ST.partyDone=false; ST.weekDone=true;
  ST.sentPre=false; ST.sentPost=false; ST.teamBuff=null; ST.canParty=false; ST.dropouts=[]; ST.lineupDirty=false;
  ST.announced=false;      // 라인업을 단톡방에 올려야 경기로 넘어간다
  const anId=TBYID['wwzw'].players.find(p=>META[p.id]&&META[p.id].traits.includes('분석가'));
  const anUn=anId?((ST.unhappy&&ST.unhappy[anId.id])?ST.unhappy[anId.id].level:0):9;
  ST.oppEvent = (anId&&isAvailable(anId.id)&&anUn<3&&!ST.scoutBlocked)
    ? rollOppEvent(ST,rng,TBYID[ST.schedule[ST.round].opp]) : null;
  ST.park=(ST.schedule[ST.round]||{}).park||'benamul';
  // 주중 훈련일 날씨는 경기날과 별개로 굴린다
  ST.trainRain = rng()<0.24;
  ST.trainPush = false;
  return rained;
}

/* ---------- 선수 선택 ---------- */
function renderPick(){
  const c=$('#view'); c.innerHTML='';
  const head=el('div','card');
  head.innerHTML=`<div class="card-h">누구로 플레이할까</div>
    <p class="muted">고른 선수 시점으로 단톡방이 보인다. 나중에 설정에서 바꿀 수 있다.</p>`;
  c.appendChild(head);
  const us=TBYID['wwzw'];
  const posLabel=p=>{
    const m=META[p.id];
    if(!m||!m.pos)return '';
    return Object.entries(m.pos).filter(([k,v])=>k!=='DH'&&v>0)
      .sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>POSNAMES[k]).join(' · ');
  };
  const roleLabel=p=>{
    const m=META[p.id]; if(!m)return '';
    const show=shownTraits(p.id).filter(t=>['안방마님','리더','감독','에이스','분석가','코치','좌완','유틸','장타형','주루형'].includes(t));
    return show.slice(0,2).join(' · ');
  };
  us.players.forEach(p=>{
    const b=el('button','pickcard'+(MYID===p.id?' on':''));
    b.innerHTML=`<div class="pk-top"><span class="pk-nm">${p.name}</span>
      <span class="pk-age">${posLabel(p)}</span></div>
      <div class="pk-star">${starHTML(effCA(p.id))}<span class="pk-pot">잠재 ${starHTML(effPA(p.id),true)}</span></div>
      ${roleLabel(p)?`<div class="pk-role">${roleLabel(p)}</div>`:''}`;
    b.onclick=async()=>{
      MYID=p.id;
      if(ST){ST.playerId=p.id;await saveGame(true);}
      renderPick();
    };
    c.appendChild(b);
  });
  const go2=el('button','btn primary','이 선수로 시작');
  go2.onclick=async()=>{
    if(!ST||(ST.round===0&&!ST.weekDone)){
      TEAMS=buildAllTeams();TBYID={};TEAMS.forEach(t=>TBYID[t.id]=t);buildPitcherPool();
      ST=newSeason(); ST.playerId=MYID;
      ST.lineup=recommendLineup(); ST.rotation=recommendRotation();
    } else { ST.playerId=MYID; }
    await saveGame(true);
    // 새 게임이면 룰 안내부터 보여준다
    if(!ST.tutDone){ ST.tutStep=0; go('tutorial'); }
    else go('home');
  };
  c.appendChild(go2);
}

    fc.innerHTML=`<div class="card-h">다음 시즌 리그 가입비</div>
      <p class="muted">협회에 <b>${LEAGUE_FEE}만원</b>을 내야 다음 시즌을 뛴다.
      현재 운영비 <b>${ST.budget.toFixed(0)}만원</b>.
      ${need>0?`<span class="warnx">${need}만원이 모자란다.</span>`:'낼 수 있다.'}</p>`;
    if(need>0){
      const n=TBYID['wwzw'].players.filter(p=>!isMerc(p.id)).length||1;
      const b=el('button','btn danger',`회비 걷는다 (인당 ${Math.ceil(need/n)}만원)`);
      b.onclick=()=>{
        const r=collectDues(need);
        ST.kakao=ST.kakao||[];
        r.msgs.forEach(m=>ST.kakao.push(m));
        saveGame(true); go('kakao');
        toast(`회비 ${r.per}만원씩 ${r.n}명 — ${r.total}만원`);
      };
      fc.appendChild(b);
    } else {
      const b=el('button','btn primary',`가입비 ${LEAGUE_FEE}만원 납부`);
      b.onclick=()=>{
        ST.budget-=LEAGUE_FEE; ST.feeDue=false;
        ST.kakao=ST.kakao||[];
        ST.kakao.push({who:'lg',type:'notice',
          text:`다음 시즌 리그 가입비 ${LEAGUE_FEE}만원 납부 완료\n남은 운영비 ${ST.budget.toFixed(0)}만원`});
        saveGame(true); go('home'); toast('가입비 납부 완료');
      };
      fc.appendChild(b);
    }
    c.appendChild(fc);
  }

  // 친구의 술 약속
  if(ST.drinkInvite && TBYID['wwzw'].players.some(p=>p.id===ST.drinkInvite.pid)){
    const pid=ST.drinkInvite.pid;
    const me=ST.playerId||MYID;
    const dc=el('div','card');
    dc.innerHTML=`<div class="card-h">${nameOf(pid)}에게서 연락</div>
      <p class="muted">${ST.drinkInvite.line||sayTo(pid,me,...pickOne(DRINK_INVITE))}</p>
      <div class="pc-prom">지금 우정 ${bondLabel(bondOf(pid))} (${bondOf(pid)})</div>`;
    const g=el('div','tac-grid');
    [['yes','나간다','우정 +12 · 둘 다 사기 +10 / 다음 경기 컨디션 -18'],
     ['no','안 나간다','우정 -10 · 컨디션은 지킨다']].forEach(([k,n,d2])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
      b.onclick=()=>{
        ST.kakao=ST.kakao||[];
        if(k==='yes'){
          bondAdd(pid,12);
          [pid,me].forEach(id=>{
            if(!TBYID['wwzw'].players.some(p=>p.id===id))return;
            ST.morale[id]=Math.min(100,(ST.morale[id]||70)+10);
            ST.cond[id]=Math.max(20,(ST.cond[id]||70)-18);
          });
          if(ST.unhappy[pid])ST.unhappy[pid].level=Math.max(0,ST.unhappy[pid].level-1);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(DRINK_YES)),mood:'happy'});
          toast(`${nameOf(pid)}과(와) 한잔했다 — 사기↑ 컨디션↓`);
        } else {
          bondAdd(pid,-10);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(DRINK_NO)),mood:'sad'});
          toast(`${nameOf(pid)} 약속 거절 — 우정 하락`);
        }
        ST.drinkInvite=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    dc.appendChild(g); c.appendChild(dc);
  }

  // 타팀 영입 제안 — 타순 보장을 요구한다
  if(ST.poach && TBYID['wwzw'].players.some(p=>p.id===ST.poach.pid)){
    const pid=ST.poach.pid, om=ST.poach.orderMax||3;
    const me=ST.playerId||MYID;
    const pc2=el('div','card');
    pc2.innerHTML=`<div class="card-h">타팀 영입 제안 · ${nameOf(pid)}</div>
      <p class="muted">${ST.poach.line||sayTo(pid,me,...pickOne(POACH_LINES))}</p>
      <div class="pc-prom">${om}번 타순 이상 · 5경기 보장을 요구한다</div>`;
    const g=el('div','tac-grid');
    [['keep',`${om}번 타순 이상 약속`,'5경기 보장. 어기면 사기 -20 · 불만 +2'],
     ['no','약속 안 한다','불만 2단계 상승 · 이적 요구로 번질 수 있다']].forEach(([k,n,d2])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
      b.onclick=()=>{
        ST.kakao=ST.kakao||[];
        if(k==='keep'){
          ST.promise=ST.promise||{};
          ST.promise[pid]={type:'order',games:5,orderMax:om};
          ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+12);
          if(ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
          bondAdd(pid,6);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(POACH_STAY)),mood:'happy'});
          toast(`${nameOf(pid)} 잔류 — ${om}번 타순 이상 5경기`);
        } else {
          if(!ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
          ST.unhappy[pid].level=Math.min(4,ST.unhappy[pid].level+2);
          ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-12);
          bondAdd(pid,-12);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(POACH_LEAVE)),mood:'angry'});
          toast(`${nameOf(pid)} 불만 상승`);
        }
        ST.poach=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    pc2.appendChild(g); c.appendChild(pc2);
  }

  // 이적 요구 면담
  if(ST.transferReq){
    const pid=ST.transferReq;
    const tc=el('div','card');
    tc.innerHTML=`<div class="card-h">이적 문의 · ${nameOf(pid)}</div>
      <p class="muted">${nameOf(pid)}이(가) 다른 팀에서 연락이 왔다고 한다. 어떻게 할까?</p>`;
    const g=el('div','tac-grid');
    [['keep','붙잡는다','다음 3경기 선발 약속 · 사기 회복'],
     ['money','회식 한번 쏜다','운영비 20만원 · 사기 소폭 회복'],
     ['let','보낸다','로스터에서 제외']].forEach(([k,n,d])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d}</span>`;
      b.onclick=()=>{
        if(k==='keep'){ ST.unhappy[pid]={level:0,streak:0};
          ST.morale[pid]=Math.min(100,ST.morale[pid]+22); ST.promise=ST.promise||{};
          ST.promise[pid]={type:'start',games:3,orderMax:3};
          toast(`${nameOf(pid)} 잔류 — 3경기 선발 약속`); }
        else if(k==='money'){
          if(ST.budget<20){toast('운영비가 부족하다');return;}
          ST.budget-=20; ST.unhappy[pid].level=Math.max(0,ST.unhappy[pid].level-2);
          ST.morale[pid]=Math.min(100,ST.morale[pid]+14); toast('회식으로 달랬다'); }
        else {
          const us2=TBYID['wwzw'];
          const i=us2.players.findIndex(p=>p.id===pid);
          if(i>=0)us2.players.splice(i,1);
          ST.lineup=ST.lineup.filter(s=>s.id!==pid);
          if(ST.lineup.length<9)ST.lineup=recommendLineup();
          ST.rotation=ST.rotation.filter(x=>x!==pid);
          if(!ST.rotation.length)ST.rotation=recommendRotation();
          finalizeTeam(us2); buildPitcherPool();
          us2.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-6));
          toast(`${nameOf(pid)} 이적`);

        ST.transferReq=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    tc.appendChild(g); c.appendChild(tc);
  }

  if(ST.seasonOver){
    if(!ST.awards){
      ST.awards=buildAwards(ST);
      /* 시즌 시상과 팀 타이틀을 전시장에 남긴다 */

      if(!ST.awardBonus)ST.awardBonus={};

      ST.awards.forEach(a=>{
        const pid=byName[a.name]; if(!pid)return;    // 남의 팀 수상은 전시장에 안 남는다
        ST.hall.push({season:ST.seasonNo||1,year:ST.year||2026,at:null,kind:'season',
          label:a.label,pid,name:a.name,value:a.value,scope:'시즌'});
        ST.awardBonus[pid]=(ST.awardBonus[pid]||0)+1;
      });
      const po=ST.playoff;
      if(po&&po.place&&po.place!=='탈락'){
        const kind = po.place==='우승'?'champ':(po.place==='준우승'?'runner':'third');
        ST.hall.push({season:ST.seasonNo||1,year:ST.year||2026,kind,
          label:`단원리그 C ${po.place}`,pid:null,value:`상금 ${po.prize}만원`,scope:'팀'});
        /* 우승하면 회비 부담이 줄어 다음 시즌 분위기가 좋다 */
        if(po.place==='우승')TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=100);
      }
      saveGame(true);
    }
    const aw=el('div','card');
    aw.appendChild(el('div','card-h','시즌 시상식'));
    ST.awards.forEach(a=>{
      const r=el('div','award');
      if(a.league)r.classList.add('lg'+(a.ours?' ours':''));
      r.innerHTML=`<span class="aw-l">${a.league?'리그 · ':''}${a.label}</span><span class="aw-n">${a.name}</span><span class="aw-v">${a.value}</span>`;
      aw.appendChild(r);
    });
    c.appendChild(aw);
    const d=el('div','card');
    const po=ST.playoff;
    d.innerHTML=`<div class="card-h">시즌 종료</div><p class="muted">정규시즌 ${st.w}승 ${st.l}패 ${st.t}무 · 리그 ${leagueRank('wwzw')}위`
      +(po?`<br>플레이오프 <b>${po.place||'-'}</b>${po.prize?` · 상금 <b>${po.prize}만원</b>`:' · 상금 없음'}`:'')
      +`</p>`;
    const b=el('button','btn primary','새 시즌 시작');
    b.onclick=async()=>{
      const keep={career:ST.career,teamCareer:ST.teamCareer,milestones:ST.milestones,firsts:ST.firsts,
        seasonNo:(ST.seasonNo||1)+1,discharged:ST.discharged,playerId:ST.playerId,
        ratings:{}, budget:ST.budget,
        hall:ST.hall||[], awardBonus:ST.awardBonus||{}, gear:ST.gear||{}, playSec:ST.playSec||0,
        dev:ST.dev||null};
      TBYID['wwzw'].players.forEach(p=>keep.ratings[p.id]={con:p.con,pow:p.pow,eye:p.eye,spd:p.spd,def:p.def,arm:p.arm});
      TEAMS=buildAllTeams();TBYID={};TEAMS.forEach(t=>TBYID[t.id]=t);
      // 능력치 이월
      TBYID['wwzw'].players.forEach(p=>{ const r=keep.ratings[p.id]; if(r)Object.assign(p,r); });
      finalizeTeam(TBYID['wwzw']); buildPitcherPool();
      ST=newSeason();
      Object.assign(ST,{career:keep.career,teamCareer:keep.teamCareer,milestones:keep.milestones,
        firsts:keep.firsts,seasonNo:keep.seasonNo,discharged:keep.discharged,playerId:keep.playerId,
        year:2026+keep.seasonNo-1, budget:Math.round(keep.budget*0.4+120),
        hall:keep.hall, awardBonus:keep.awardBonus, gear:keep.gear, playSec:keep.playSec,
        dev:keep.dev||{pts:0,games:0,trains:0,minTick:0}});
      ST.teamCareer.seasons=(ST.teamCareer.seasons||0)+1;
      normalizeState();
      ST.lineup=recommendLineup();ST.rotation=recommendRotation();
      await saveGame(true);go('home');
      toast(`${ST.seasonNo}년차 시즌 시작`);

    d.appendChild(b); c.appendChild(d); return;

  const next=ST.schedule[ST.round];

  if(!ST.weekDone){
    const card=el('div','card');
    card.innerHTML=`<div class="card-h">${next.round}차전 준비</div>
      <div class="opp-name">${opp.name}</div>
      <div class="opp-ops">${next.homeGame?'홈':'원정'} · 팀 OPS ${opp.ops.toFixed(3)}</div>
      <div class="gdate">${(holidayFor(ST.round, ST.year||2026)||{}).label||''}</div>
      <p class="muted">주간을 시작하면 회식·우취·개인 사정 같은 변수가 확정된다.</p>`;
    const b=el('button','btn primary','이번 주 시작');
    b.onclick=()=>{const r=runWeek();saveGame(true);if(r)toast('우천 취소');go('home');};
    card.appendChild(b); c.appendChild(card); return;

  const card=el('div','card');

    <div class="gdate">${dateLbl}${ST.calendar&&ST.calendar.holiday?` · ${ST.calendar.holiday}`:''} · ${wxN}

    <div class="park"><b>${park.name}</b><span>${park.desc}</span></div>
    <div class="scout">${ST.scoutBlocked?'김한규가 분석 자료를 안 넘겼다. 상대 정보가 없다.':scoutLine(opp)}</div>`;
  if(rain){
    card.appendChild(el('p','muted','우천 취소다. 다음 주로 넘긴다.'));
    const b=el('button','btn','다음 주로');
    b.onclick=()=>{const r=releaseMercs(true);if(r)toast(`우천 취소 — 용병 ${r}명 비용 환불`);
      ST.weekDone=false;ST.events=[];saveGame(true);go('home');};
    card.appendChild(b);
  } else {
    const avail=us.players.filter(p=>isAvailable(p.id)).length;
    if(avail<9){
      card.appendChild(el('div','warn',
        `출전 가능 인원 ${avail}명. 9명이 안 되면 몰수패(0:7)다. 용병을 부르면 채울 수 있다.`));
      const b0=el('button','btn','단톡방에 사정해본다');
      b0.onclick=()=>{
        const cands=us.players.filter(p=>ST.absent&&ST.absent[p.id]);
        if(!cands.length){toast('부를 사람이 없다');return;}
        const p=cands[(Math.random()*cands.length)|0];
        if(Math.random()<0.45){
          delete ST.absent[p.id];
          ST.morale[p.id]=Math.max(10,ST.morale[p.id]-6);
          ST.cond[p.id]=Math.max(25,ST.cond[p.id]-10);
          ST.kakao=ST.kakao||[];
          ST.kakao.push({who:p.id,text:say(p.id,'알겠다 늦게라도 갈게','알겠습니다 늦게라도 가겠습니다'),mood:'flat'});
          ST.lineup=recommendLineup(); applyDHRule();
          toast(`${p.name}이(가) 오기로 했다`);
        } else {
          ST.kakao=ST.kakao||[];
          ST.kakao.push({who:p.id,text:say(p.id,'미안하다 진짜 안 된다','정말 죄송합니다 안 됩니다'),mood:'sad'});
          toast(`${p.name} 못 온다고 한다`);
        }
        saveGame(true); go('home');
      };
      card.appendChild(b0);
      const bm=el('button','btn','용병 부른다');
      bm.onclick=()=>openMercSheet(()=>go('home'));
      card.appendChild(bm);
      const b=el('button','btn danger','몰수패 처리'); b.onclick=forfeit;
      card.appendChild(b);
    } else {
      const b1=el('button','btn','라인업 · 카톡 발표'); b1.onclick=()=>go('lineup');
      const announced0=!!ST.announced;
      const b2=el('button','btn primary',
        ST.lineupDirty?'라인업 다시 확정':(announced0?'경기 시작':'라인업 발표부터'));
      b2.onclick=()=>go(ST.lineupDirty?'lineup':(announced0?'game':'kakao'));
      card.appendChild(b1); card.appendChild(b2);
    }
  }
  c.appendChild(card);

  const recent=ST.schedule.filter(s=>s.played).slice(-5).reverse();
  if(recent.length){
    const rc=el('div','card'); rc.appendChild(el('div','card-h','최근 경기'));
    recent.forEach(s=>{
      const w=s.result.us>s.result.them, t=s.result.us===s.result.them;
      const row=el('div','res-row');
      row.innerHTML=`<span class="badge ${t?'t':(w?'w':'l')}">${t?'무':(w?'승':'패')}</span>
        <span class="res-opp">${TBYID[s.opp].name}</span><span class="res-score">${s.result.us} : ${s.result.them}</span>`;
      rc.appendChild(row);
    });
    c.appendChild(rc);
  }
}

/* =========================================================
   용병 운용
   ---------------------------------------------------------
   용병은 로스터에 상주하지 않는다. ST.mercs 에 담긴 동안만
   TBYID['wwzw'].players 에 얹혀 있다가 경기가 끝나면 빠진다.
   기록(ST.bat)도 같이 지워서 통산기록·시상식에 안 섞이게 한다.
   ========================================================= */
function ensureMercs(){
  const us=TBYID['wwzw'];
  if(!Array.isArray(ST.mercs))ST.mercs=[];
  ST.mercs=ST.mercs.filter(id=>isMerc(id));
  let changed=false;
  ST.mercs.forEach(id=>{
    if(us.players.some(p=>p.id===id))return;
    const m=mercDef(id); if(!m)return;
    us.players.push({id:m.id,name:m.name,bats:m.bats,no:mercNo(m),
      con:m.con,pow:m.pow,eye:m.eye,spd:m.spd,def:m.def,arm:m.arm,
      pos:Object.keys(m.pos).filter(k=>m.pos[k]>0&&k!=='DH'),
      pitch:null,real:null});
    META[m.id]={born:2000,speech:'jon',throws:m.throws,car:false,school:'-',
      drink:1,attend:1.0,loyal:0,pot:0,traits:['용병'],friends:[],rival:null,
      coach:{},pos:{...m.pos},desc:m.desc};
    ST.bat[m.id]=ST.bat[m.id]||blankBat();
    if(ST.cond[m.id]==null)ST.cond[m.id]=70;
    if(ST.morale[m.id]==null)ST.morale[m.id]=60;
    if(ST.injury[m.id]===undefined)ST.injury[m.id]=null;
    ST.ca[m.id]=calcCA(us.players[us.players.length-1]);
    if(ST.caStart)ST.caStart[m.id]=ST.ca[m.id];
    changed=true;
  });
  if(changed){ finalizeTeam(us); buildPitcherPool(); }
  return changed;
}

/* 용병을 부른다. 운영비가 모자라면 못 부른다. */
function hireMerc(id){
  const m=mercDef(id);
  if(!m) return {ok:false,msg:'그런 사람 없다'};
  if(!Array.isArray(ST.mercs))ST.mercs=[];
  if(ST.mercs.indexOf(id)>=0) return {ok:false,msg:`${m.name}은(는) 이미 불렀다`};
  if(ST.budget < m.fee) return {ok:false,msg:`운영비가 부족하다 (${m.fee}만원 필요)`};
  ST.budget-=m.fee;
  ST.mercs.push(id);
  ensureMercs();
  // 용병을 쓰면 팀 분위기가 좋을 리 없다
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;
    ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-3);
  });
  ST.kakao=ST.kakao||[];
  ST.kakao.push({who:'lg',type:'notice',
    text:`용병 ${m.name} 섭외 — ${m.fee}만원 지출\n전원 사기 -3`});
  ST.kakao.push({who:pickOne(['lg','swm','kig']),
    text:pickOne(['또 용병이냐...','9명은 좀 채우자 진짜','내년엔 사람 좀 늘리자',
                  '이러다 매주 용병 부르겠다']),mood:'sad'});
  return {ok:true,msg:`${m.name} 합류 — ${m.fee}만원`};
}

/* 경기가 끝났거나 취소됐을 때 용병을 로스터에서 뺀다.
   refund=true 면(우천 취소 등) 비용을 돌려준다.                       */
function releaseMercs(refund){
  if(!Array.isArray(ST.mercs)||!ST.mercs.length)return 0;
  const us=TBYID['wwzw'];
  let back=0;
  ST.mercs.forEach(id=>{
    const m=mercDef(id);
    if(refund&&m)back+=m.fee;
    const i=us.players.findIndex(p=>p.id===id);
    if(i>=0)us.players.splice(i,1);
    delete ST.bat[id]; delete ST.cond[id]; delete ST.morale[id];
    delete ST.injury[id]; delete ST.ca[id];
    // 리그 순위표·통산기록·시상식에 용병이 남으면 안 된다
    if(ST.lgBat)delete ST.lgBat[id];
    if(ST.lgPit)delete ST.lgPit[id];
    if(ST.career)delete ST.career[id];
    if(ST.caStart)delete ST.caStart[id];
    if(ST.unhappy)delete ST.unhappy[id];
    if(ST.promise)delete ST.promise[id];
    if(ST.meetRound)delete ST.meetRound[id];
    if(ST.buff)delete ST.buff[id];
    if(ST.pit)delete ST.pit[id];
    if(ST.rest)delete ST.rest[id];
    if(ST.meet&&ST.meet.pid===id)ST.meet=null;
    if(ST.mystery&&ST.mystery.id===id)ST.mystery=null;
    delete META[id];
  });
  const n=ST.mercs.length;
  ST.mercs=[];
  ST.budget+=back;
  ST.lineup=(ST.lineup||[]).filter(sl=>!isMerc(sl.id));
  if(ST.lineup.length<9)ST.lineup=recommendLineup();
  ST.rotation=(ST.rotation||[]).filter(x=>!isMerc(x));
  if(!ST.rotation.length)ST.rotation=recommendRotation();
  if(ST.lastLineup)ST.lastLineup=ST.lastLineup.filter(x=>!isMerc(x.id));
  if(ST.trainTarget&&isMerc(ST.trainTarget))ST.trainTarget=null;
  finalizeTeam(us); buildPitcherPool(); applyDHRule();
  return n;
}

function openMercSheet(after){
  const body=$('#sheet-body'); body.innerHTML='';
  const need=Math.max(0,9-TBYID['wwzw'].players.filter(p=>isAvailable(p.id)).length);
  $('#sheet-title').textContent=`용병 섭외 · ${need}명 더 필요`;
  const note=el('div','sheet-note',
    `경기당 비용이 나가고 부를 때마다 전원 사기가 3씩 깎인다. 현재 운영비 ${ST.budget.toFixed(0)}만원.`);
  body.appendChild(note);

    const already=(ST.mercs||[]).indexOf(m.id)>=0;
    const poor=ST.budget<m.fee;
    const r=el('button','pick-row'+(already?' cur':'')+(poor&&!already?' bad':''));
    const canPos=Object.keys(m.pos).filter(k=>k!=='DH'&&m.pos[k]>0);
    r.innerHTML=`<div class="pk-l"><div class="pk-name">${m.name}${already?' · 합류함':''}</div>
      <div class="pk-note">${m.desc}<br>가능 포지션 ${canPos.length?canPos.map(k=>POSNAMES[k]).join('·'):'없음'}</div></div>
      <div class="pk-r"><div class="pk-stat">${m.fee}만원</div></div>`;
    if(!already&&!poor)r.onclick=()=>{
      const res=hireMerc(m.id);

      if(res.ok){ saveGame(true); closeSheet(); if(after)after(); }
    };

}

function forfeit(){
  releaseMercs(true);                 // 경기를 안 했으니 용병 비용은 돌려받는다
  const sch=ST.schedule[ST.round];
  sch.played=true; sch.result={us:0,them:7};
  const u=ST.stand['wwzw'], t=ST.stand[sch.opp];
  u.g++;t.g++;u.l++;t.w++;u.ra+=7;t.rf+=7;
  TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-10));
  if(!sch.po) simOtherGames(sch.opp);
  ST.round++;ST.weekDone=false;ST.events=[];
  if(sch.po) advancePlayoff(false,false,0,7);
  else if(ST.round>=ST.schedule.length) startPlayoff();
  saveGame(true);go('home');toast('몰수패');
}

function scoutLine(opp){
  const b=[];
  if(opp.tend.pow>=1.2)b.push('장타력 상위');
  if(opp.tend.sb>=1.3)b.push('도루 극단적');
  else if(opp.tend.sb<=0.7)b.push('거의 안 뜀');
  if(opp.tend.bb>=1.2)b.push('볼넷 잘 골라냄');
  if(opp.tend.k<=0.7)b.push('삼진 안 당함');
  else if(opp.tend.k>=1.25)b.push('삼진 많음');
  if(opp.tend.err>=1.15)b.push('수비 불안');
  const a=opp.pitchers[0];
  b.push(`선발 ${a.name} (구위 ${a.stf}/제구 ${a.ctl})`);
  return b.join(' · ');
}
/* ================= 플레이오프 =================
   단원리그 C 규정. 정규시즌이 끝나면 상위 4팀이 붙는다.
     준결승  1위 vs 4위 · 2위 vs 3위
     결승    준결승 승자끼리
   상금  우승 50만원 · 준우승 30만원 · 공동 3위(준결승 패자) 각 10만원
   무승부는 정규시즌 순위가 높은 쪽이 올라간다.                        */
const PO_PRIZE={win:50, runner:30, third:10};
function poSeeds(){
  return TEAMS.slice().sort((x,y)=>{
    const A=ST.stand[x.id],B=ST.stand[y.id];
    const pa=A.g?A.w/A.g:0,pb=B.g?B.w/B.g:0;
    if(pb!==pa)return pb-pa; return (B.rf-B.ra)-(A.rf-A.ra);
  }).slice(0,4).map(t=>t.id);
}
/* 우리가 안 낀 경기는 그냥 돌린다. 무승부면 상위 시드가 올라간다. */
function poSim(aId,bId,seedOf){
  const A=TBYID[aId], B=TBYID[bId];
  const rng=makeRng((ST.seed+aId.length*7919+bId.length*104729+ST.round*31)>>>0);
  const r=simGame(A,B,{rng,innings:7,awayLineup:aiLineup(B),awayRotation:aiRotation(B),
    homeLineup:aiLineup(A),homeRotation:aiRotation(A)});
  let winner;
  if(r.tie) winner = seedOf(aId)<seedOf(bId)?aId:bId;
  else winner = r.home.runs>r.away.runs?aId:bId;
  return {winner, loser:winner===aId?bId:aId, hs:r.home.runs, as:r.away.runs, tie:r.tie};
}
function poName(id){ return TBYID[id]?TBYID[id].name:id; }

/* 정규시즌이 끝난 직후 한 번 불린다 */
function startPlayoff(){
  const seeds=poSeeds();
  const seedOf=id=>{const i=seeds.indexOf(id);return i<0?99:i;};
  ST.playoff={seeds, stage:'sf', log:[], prize:0, place:null, done:false};
  const me=seeds.indexOf('wwzw');
  if(me<0){
    /* 우리가 못 올라갔다. 남의 잔치는 돌려서 결과만 본다. */
    const s1=poSim(seeds[0],seeds[3],seedOf), s2=poSim(seeds[1],seeds[2],seedOf);
    const f=poSim(s1.winner,s2.winner,seedOf);
    ST.playoff.log=[
      `준결승 ${poName(seeds[0])} ${s1.hs}:${s1.as} ${poName(seeds[3])} → ${poName(s1.winner)}`,
      `준결승 ${poName(seeds[1])} ${s2.hs}:${s2.as} ${poName(seeds[2])} → ${poName(s2.winner)}`,
      `결승 ${poName(f.winner)} 우승`];
    ST.playoff.done=true; ST.playoff.place='탈락';
    ST.seasonOver=true; ST.feeDue=true;
    ST.notices.push({type:'po',title:'플레이오프 진출 실패',
      body:`정규시즌 ${leagueRank('wwzw')}위. 상위 4팀에 못 들었다.`,
      effect:`${poName(f.winner)} 우승 · 상금 없음`});
    return;
  }
  /* 우리 준결승 상대를 일정 뒤에 붙인다. 나머지는 평소 흐름 그대로다. */
  const opp=seeds[3-me];
  ST.schedule.push({round:ST.schedule.length+1, opp, homeGame:me<2, played:false, result:null,
    park:PARKS[(ST.schedule.length*7+3)%PARKS.length].id, po:'sf'});
  ST.notices.push({type:'po',title:'플레이오프 진출',
    body:`정규시즌 ${me+1}위로 4강에 올랐다. 준결승 상대는 ${poName(opp)}(${seeds.indexOf(opp)+1}위)다.`,
    effect:'우승 50만원 · 준우승 30만원 · 공동 3위 10만원'});
}

/* 플레이오프 경기를 하나 치른 뒤 */
function advancePlayoff(won, tie, myRuns, oppRuns){
  const po=ST.playoff; if(!po||po.done)return [];
  const seeds=po.seeds, seedOf=id=>{const i=seeds.indexOf(id);return i<0?99:i;};
  const me=seeds.indexOf('wwzw');
  const sch=ST.schedule[ST.round-1];
  const msgs=[];
  /* 무승부면 정규시즌 순위가 높은 쪽이 올라간다 */
  const advance = tie ? (seedOf('wwzw')<seedOf(sch.opp)) : won;

  if(po.stage==='sf'){
    po.log.push(`준결승 우완좌완 ${myRuns}:${oppRuns} ${poName(sch.opp)}`
      +(tie?' (무승부 — 정규시즌 순위로 판정)':''));
    if(!advance){
      po.place='공동 3위'; po.prize=PO_PRIZE.third; po.done=true;
      ST.budget+=po.prize;
      msgs.push({who:'lg',type:'notice',
        text:`플레이오프 준결승 탈락 — 공동 3위\n상금 ${PO_PRIZE.third}만원 입금`});
      ST.seasonOver=true; ST.feeDue=true;
      return msgs;
    }
    /* 반대편 준결승을 돌리고 결승 상대를 정한다 */
    const oi=(me<2)?1:0;                       // 우리가 1·4 조면 반대는 2·3 조
    const a=seeds[oi===1?1:0], bb=seeds[oi===1?2:3];
    const other=poSim(a,bb,seedOf);
    po.log.push(`준결승 ${poName(a)} ${other.hs}:${other.as} ${poName(bb)} → ${poName(other.winner)}`);
    po.stage='final';
    ST.schedule.push({round:ST.schedule.length+1, opp:other.winner, homeGame:seedOf('wwzw')<seedOf(other.winner),
      played:false, result:null, park:'singil', po:'final'});
    msgs.push({who:'lg',type:'notice',
      text:`준결승 통과 — 결승 진출\n상대는 ${poName(other.winner)}. 이기면 50만원, 져도 30만원`});
    TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+12));
    return msgs;
  }

  if(po.stage==='final'){
    po.log.push(`결승 우완좌완 ${myRuns}:${oppRuns} ${poName(sch.opp)}`
      +(tie?' (무승부 — 정규시즌 순위로 판정)':''));
    po.done=true;
    if(advance){ po.place='우승'; po.prize=PO_PRIZE.win;
      TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=100);
      msgs.push({who:'lg',type:'notice',text:`단원리그 C 우승\n상금 ${PO_PRIZE.win}만원 입금`});
    } else { po.place='준우승'; po.prize=PO_PRIZE.runner;
      msgs.push({who:'lg',type:'notice',text:`준우승\n상금 ${PO_PRIZE.runner}만원 입금`});
    }
    ST.budget+=po.prize;
    ST.seasonOver=true; ST.feeDue=true;
    return msgs;
  }
  return msgs;
}
/* 정규시즌 경기 수 (플레이오프 제외) */
function regGames(){ return ST.schedule.filter(x=>!x.po).length; }

function leagueRank(id){
  const a=TEAMS.slice().sort((x,y)=>{
    const A=ST.stand[x.id],B=ST.stand[y.id];
    const pa=A.g?A.w/A.g:0,pb=B.g?B.w/B.g:0;
    if(pb!==pa)return pb-pa; return (B.rf-B.ra)-(A.rf-A.ra);
  });
  return a.findIndex(t=>t.id===id)+1;
}

function clayHash(id){
  let h=2166136261;
  for(let i=0;i<(id||'x').length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); }
  return Math.abs(h);
}
/* 같은 선수는 항상 같은 인형이 나오도록 id 로 색과 각도를 정한다 */
function clayAvatar(pid){
  const h=clayHash(pid);
  const L=52+(h%5)*4, hue=19+((h>>3)%14);
  const gid='clay_'+pid;
  const body=`hsl(${hue},34%,${L}%)`;
  const top=`hsl(${hue},36%,${L+10}%)`;
  const dk=`hsl(${hue},32%,${L-15}%)`;
  const dk2=`hsl(${hue},30%,${L-25}%)`;
  const cap=((h>>7)%3)!==0;
  const tilt=(((h>>11)%7)-3);
  return `<svg class="pf-clay" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${body}"/></linearGradient></defs>
    <rect width="120" height="160" fill="#1a2029"/>
    <g transform="rotate(${tilt} 60 84)">
      <path d="M20 160 C23 121 40 106 60 106 C80 106 97 121 100 160 Z" fill="url(#${gid})"/>
      <path d="M50 92 h20 v18 h-20 z" fill="${dk}"/>
      <ellipse cx="60" cy="64" rx="30" ry="34" fill="url(#${gid})"/>
      <ellipse cx="30" cy="68" rx="5" ry="8" fill="${dk}"/>
      <ellipse cx="90" cy="68" rx="5" ry="8" fill="${dk}"/>

/* 포지션 적합도 → 등급. FM 의 포지션 원과 같은 역할이다. */
function posGrade(v, cap){
  if(v<=0)   return (cap>0) ? {t:'훈련 필요',c:'train'} : {t:'불가',c:'no'};
  if(v>=55)  return {t:'주포지션',c:'best'};
  if(v>=45)  return {t:'능숙',   c:'good'};
  if(v>=35)  return {t:'가능',   c:'ok'};
  return {t:'서툼',c:'weak'};
}
const PF_ORDER=['P','C','1B','2B','3B','SS','LF','CF','RF'];

/* 무엇을 훈련시켜야 하는가 */
function trainAdvice(p){
  const KEYS=[['con','컨택','타격 훈련'],['pow','파워','타격 훈련'],
              ['eye','선구','선구안 훈련'],['spd','주루','주루 훈련'],
              ['def','수비','수비 훈련'],['arm','어깨','수비 훈련']];
  const out=[];
  const low=KEYS.slice().sort((a,b)=>p[a[0]]-p[b[0]])[0];
  out.push({h:low[2], d:`${low[1]} ${Math.round(p[low[0]])} — 이 선수가 가진 것 중 가장 낮다. 여기부터 올리는 게 효율이 좋다.`});

  const m=META[p.id]||{traits:[],pos:{}};
  const pit=TBYID['wwzw'].pitchers.find(x=>x.id===p.id);
  /* 투구 훈련은 실제로 마운드에 서는 선수한테만 권한다.
     2루수한테 제구 올리라고 하는 건 조언이 아니다. */
  const isPitcher = !!p.pitch || (m.pos && m.pos.P > 0);
  if(pit && isPitcher && pit.ctl<32)
    out.push({h:'투구 훈련', d:`제구 ${pit.ctl}. 이 팀은 사사구로 무너진다. 마운드에 세울 거면 여기가 먼저다.`});

  /* 포지션 — 주포지션에 남은 여지가 먼저, 없으면 배울 만한 옆자리 */
  const mainPos=PF_ORDER.filter(k=>posFit(p.id,k)>0)
    .sort((x,y)=>posFit(p.id,y)-posFit(p.id,x))[0];
  const NEIGHBOR={ P:['1B','RF','LF'], C:['1B','3B','LF'], '1B':['3B','LF','RF'],
    '2B':['SS','3B','1B'], '3B':['1B','SS','LF'], SS:['2B','3B'],
    LF:['RF','CF','1B'], CF:['LF','RF'], RF:['LF','CF','1B'] };
  let pa2=null;
  if(mainPos){
    const cap=posTrainCap(p.id,mainPos), fit=posFit(p.id,mainPos);
    if(cap-fit>=6) pa2={k:mainPos,fit,cap,how:'주포지션 숙련도가 아직 덜 찼다'};
  }
  if(!pa2){
    const cand=(NEIGHBOR[mainPos]||['1B','LF','RF'])
      .filter(k=>posTrainCap(p.id,k)-posFit(p.id,k)>=6)[0];
    if(cand) pa2={k:cand,fit:posFit(p.id,cand),cap:posTrainCap(p.id,cand),
      how:'새 자리를 열어두면 결장자가 나와도 라인업이 안 무너진다'};
  }
  if(pa2)
    out.push({h:`포지션 적응 — ${POSNAMES[pa2.k]}`,
      d:`${pa2.how}. 지금 ${Math.round(pa2.fit)} → 최대 ${Math.round(pa2.cap)}. 집중 훈련 대상으로 걸어두면 된다.`});

  const ca=effCA(p.id), pa=effPA(p.id);
  if(p.id===(ST.playerId||MYID))
    out.push({h:'내 선수 — 한계 없음',
      d:`현재 ${ca.toFixed(0)} / 지금 열린 잠재 ${pa.toFixed(0)}. 경기와 훈련에 계속 나가면 잠재치가 같이 올라간다. 집중 훈련 대상으로 걸어두면 제일 빨리 큰다.`});
  else if(pa-ca>=8) out.push({h:'성장 여지 있음', d:`현재 ${ca.toFixed(0)} / 잠재 ${pa.toFixed(0)}. 아직 올라갈 자리가 남았다.`});
  else out.push({h:'거의 다 왔다', d:`현재 ${ca.toFixed(0)} / 잠재 ${pa.toFixed(0)}. 큰 성장은 기대하기 어렵다.`});
  return out;
}

/* 능력치 막대 색 — OOTP 처럼 구간별로 색이 다르다 */
function otTier(v){ return v>=65?'t4':v>=50?'t3':v>=35?'t2':'t1'; }
/* 0.667 이닝 → '0.2' (야구식 표기) */
function ipDot(ip){
  const w=Math.floor(ip+1e-6), f=Math.round((ip-w)*3);
  return f?`${w}.${f}`:`${w}`;
}
/* 남은 성장 여지를 여섯 능력치에 고르게 나눴을 때 각자 올라가는 값.
   calcCA 의 가중치 합이 정확히 5.0 이라, 여섯 개를 똑같이 n 씩 올리면
   CA 도 정확히 n 오른다. 그래서 잠재 = 현재 + (잠재CA - 현재CA) 다.
   지어낸 숫자가 아니라 성장 공식에서 그대로 떨어지는 값이다.        */
const CA_W={con:1.3,pow:1.1,eye:0.8,spd:0.7,def:0.7,arm:0.4};
function otPotential(pid,key,cur){
  const room=effPA(pid)-effCA(pid);
  if(room<=0||!CA_W[key])return cur;
  return Math.min(80, cur+room);
}
function otBar(label,cur,pot){
  const c=Math.max(0,Math.min(80,cur)), pp=Math.max(c,Math.min(80,pot==null?c:pot));
  const num = (pot!=null&&Math.round(pp)>Math.round(c))
    ? `${Math.round(c)} / ${Math.round(pp)}` : `${Math.round(c)}`;
  return `<div class="ot-rt"><div class="ot-rt-l">${label}</div>
    <div class="ot-rt-b"><span class="ot-num ${otTier(c)}">${num}</span>
      <div class="ot-bar"><u style="width:${pp/80*100}%"></u>
        <i class="${otTier(c)}" style="width:${c/80*100}%"></i></div></div></div>`;
}
function otRow(k,v,hot){
  return `<div class="ot-r"><span>${k}</span><b${hot?' class="hot"':''}>${v}</b></div>`;
}
function otSec(title,inner,right){
  return `<div class="ot-sec"><div class="ot-h">${title}${right?`<span>${right}</span>`:''}</div>
    <div class="ot-b">${inner}</div></div>`;
}
