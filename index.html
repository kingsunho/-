  TBYID['wwzw'].pitchers.forEach(p=>o.pit[p.id]={...(ST.pit[p.id]||blankPit())});
  // 리그 전체 시상을 위해 남의 팀 기록도 같이 찍어둔다
  Object.keys(ST.lgBat||{}).forEach(id=>o.lg[id]={...ST.lgBat[id]});
  Object.keys(ST.lgPit||{}).forEach(id=>o.lgp[id]={...ST.lgPit[id]});
  return o;
}
/* 리그 전체(우리 포함)에서 구간 1위를 뽑는다.
   남의 팀 기록은 ST.lgBat / ST.lgPit 에 쌓인다.                        */
function leagueOwner(pid){
  for(const t of TEAMS){
    if(t.players.some(p=>p.id===pid)||(t.pitchers||[]).some(p=>p.id===pid))return t;
  }
  return null;
}
function leagueName(pid){
  for(const t of TEAMS){
    const p=t.players.find(x=>x.id===pid)||(t.pitchers||[]).find(x=>x.id===pid);
    if(p)return p.name;
  }
  return '?';
}
function leagueAwards(snap){
  const BK=['g','pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb'];
  const PK=['g','outs','h','r','er','bb','hbp','k','w'];
  const B={}, P={};
  Object.keys(ST.lgBat||{}).forEach(id=>{
    const t=leagueOwner(id); if(!t)return;
    B[id]=snapDiff(ST.lgBat[id], snap&&snap.lg&&snap.lg[id], BK);
  });
  // 우리 팀은 ST.bat 을 쓴다
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;
    B[p.id]=snapDiff(ST.bat[p.id]||blankBat(), snap&&snap.bat&&snap.bat[p.id], BK);
  });
  Object.keys(ST.lgPit||{}).forEach(id=>{
    P[id]=snapDiff(ST.lgPit[id], snap&&snap.lgp&&snap.lgp[id], PK);
  });
  TBYID['wwzw'].pitchers.forEach(p=>{
    P[p.id]=snapDiff(ST.pit[p.id]||blankPit(), snap&&snap.pit&&snap.pit[p.id], PK);
  });
  const opsOf=b=>{
    const ab=b.ab||0, pa=b.pa||0; if(!pa)return 0;
    const tb=(b.h||0)+(b.d2||0)+2*(b.d3||0)+3*(b.hr||0);
    return (((b.h||0)+(b.bb||0)+(b.hbp||0))/pa) + (ab?tb/ab:0);
  };
  const pick=(obj,filt,score)=>{
    const ids=Object.keys(obj).filter(id=>filt(obj[id]));
    if(!ids.length)return null;
    return ids.sort((a,b)=>score(obj[b])-score(obj[a]))[0];
  };
  const out=[];
  const mvp=pick(B,b=>b.pa>=6,opsOf);
  if(mvp)out.push({kind:'lgmvp',label:'리그 구간 MVP',pid:mvp,value:`OPS ${opsOf(B[mvp]).toFixed(3)}`});
  const avgId=pick(B,b=>b.ab>=8,b=>b.h/b.ab);
  if(avgId&&avgId!==mvp)out.push({kind:'lgavg',label:'리그 타율상',pid:avgId,value:`타율 ${fmt3(B[avgId].h/B[avgId].ab)}`});
  const pitId=pick(P,l=>l.outs>=9,l=>-((l.er*7)/(l.outs/3)));
  if(pitId)out.push({kind:'lgpit',label:'리그 투수상',pid:pitId,
    value:`ERA ${(P[pitId].outs?((P[pitId].er*7)/(P[pitId].outs/3)):0).toFixed(2)}`});
  return out;
}
/* 다른 팀이 우리 선수를 극찬한다 */
const OPP_PRAISE=[
  '그 선수 진짜 물건이네요. 축하드립니다',
  '기록 보고 깜짝 놀랐습니다. 저희 팀에 없는 유형이라',
  '솔직히 부럽습니다. 우리 팀에 한 명만 있었으면',
  '다음에 붙을 때 그 선수부터 피해야겠네요 ㅋㅋ',
  '4부에서 저런 기록이 나오나요. 대단합니다',
  '스카우트 보내야 하나 진지하게 고민했습니다',
];
function snapDiff(now, then, keys){
  const o={}; keys.forEach(k=>o[k]=(now[k]||0)-((then&&then[k])||0)); return o;
}
/* 구간 성적을 뽑아 상을 정한다 */
function runMiniAwards(ST){
  const us=TBYID['wwzw'];
  const snap=ST.awardSnap;
  const B={}, P={};
  const BK=['g','pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb'];
  const PK=['g','outs','h','r','er','bb','hbp','k','w'];
  us.players.forEach(p=>{ if(!isMerc(p.id)) B[p.id]=snapDiff(ST.bat[p.id]||blankBat(),snap&&snap.bat[p.id],BK); });
  us.pitchers.forEach(p=>{ P[p.id]=snapDiff(ST.pit[p.id]||blankPit(),snap&&snap.pit[p.id],PK); });

  const won=[];
  /* [제보] "김한규가 ERA 12.68로 투수상을 탔는데 왜 탔는지 모르겠다".
     한 사람이 상을 두 개 받지 않게 이미 받은 사람을 건너뛰는데,
     그 사실이 어디에도 안 보여서 결과만 이상하게 남았다.
     이제 후보 순위를 통째로 들고 다니면서 누가 왜 밀렸는지까지 남긴다. */
  const rank=(obj,filt,score,fmt)=>{
    return Object.keys(obj).filter(id=>filt(obj[id],id))
      .map(id=>({pid:id, s:score(obj[id],id), v:fmt?fmt(obj[id],id):''}))
      .sort((a,b)=>b.s-a.s);
  };
  /* 상은 기록으로만 준다. 한 사람이 여러 개 받아도 그대로 준다 —
     제일 잘한 사람이 MVP 도 타율상도 받는 게 맞다.
     같은 값이면 공동 수상이다.                                     */
  const give=(kind,list,criteria)=>{
    if(!list||!list.length)return;
    const top=list[0].s;
    const co=list.filter(c=>Math.abs(c.s-top)<1e-9);      // 동률 = 공동 수상
    /* 동점자는 같은 등수로 매긴다. 공동 1위가 셋이면 다음은 4등이다. */
    let rk=0, prev=null;
    const podium=list.slice(0,6).map((x,i)=>{
      if(prev===null||Math.abs(x.s-prev)>1e-9){ rk=i+1; prev=x.s; }
      return {rank:rk, pid:x.pid, v:x.v};
    });
    co.forEach(c=>{
      won.push({kind, pid:c.pid, value:c.v, criteria, podium,
        coWith: co.filter(x=>x.pid!==c.pid).map(x=>x.pid),
        skipped:[], cand:list.length});
    });
  };
  const opsOf=b=>{
    const ab=b.ab||0, pa=b.pa||0; if(!pa)return 0;
    const tb=(b.h||0)+(b.d2||0)+2*(b.d3||0)+3*(b.hr||0);
    return (((b.h||0)+(b.bb||0)+(b.hbp||0))/pa) + (ab?tb/ab:0);
  };
  /* 감독상은 감독(이건)만 받는다. 구간 팀 성적이 5할 이상이면 준다.
     나머지 선수의 몫은 '팀 공헌상'으로 따로 뺐다. */
  const mgrP=us.players.find(p=>META[p.id]&&(META[p.id].traits||[]).includes('감독'));
  const stNow=ST.stand['wwzw']||{w:0,l:0,t:0};
  const rec0=(snap&&snap.rec)||{w:0,l:0,t:0};
  const gw=(stNow.w||0)-(rec0.w||0), gl=(stNow.l||0)-(rec0.l||0), gt=(stNow.t||0)-(rec0.t||0);
  let mgrGiven=false;
  if(mgrP && (gw+gl+gt)>0 && gw>=gl){
    won.push({kind:'mgr',pid:mgrP.id,value:`${gw}승 ${gl}패${gt?` ${gt}무`:''}`,
      criteria:'감독(이건) 전용 · 이 구간 팀 성적이 5할 이상이면 준다',
      podium:null, skipped:[], cand:1});
    mgrGiven=true;
  }
  const noMgr={}; Object.keys(B).forEach(id=>{ if(!mgrP||id!==mgrP.id) noMgr[id]=B[id]; });

  /* 타자상·투수상은 안타/ERA 같은 날것 대신 wRC+ · WAR 로 뽑는다.
     타순과 등판 상황에 덜 휘둘리고, 실제로 팀에 얼마나 보탰는지에 가깝다. */
  const eraOf=l=>l.outs?((l.er*7)/(l.outs/3)):99;
  const wbA=(typeof leagueWoba==='function')?leagueWoba():null;   // 이 함수 뒤쪽에 lgw 가 이미 있다
  const erA=(typeof leagueEra==='function')?leagueEra():8.5;
  const warB=(b,id)=>warOf(id,b,wbA);
  give('mvp', rank(B,b=>b.pa>=5,warB,(b,id)=>`WAR ${warB(b,id).toFixed(2)} · OPS ${opsOf(b).toFixed(3)}`),
       '이 구간 WAR 1위 · 5타석 이상 (타격 + 수비 + 포지션)');
  give('avg', rank(B,b=>b.ab>=6,b=>b.h/b.ab,b=>`타율 ${fmt3(b.h/b.ab)} (${b.h}/${b.ab})`),
       '이 구간 타율 1위 · 6타수 이상');
  give('bat', rank(B,b=>b.pa>=5,b=>wrcPlus(b,wbA),
       b=>`wRC+ ${wrcPlus(b,wbA)} · ${b.h}안타 ${b.rbi}타점`),
       '이 구간 wRC+ 1위 · 5타석 이상 (리그 평균 100 기준 타격 생산력)');
  give('sb',  rank(B,b=>(b.sb||0)>=2,b=>b.sb,b=>`${b.sb}도루`),
       '이 구간 도루 1위 · 2개 이상');
  give('pit', rank(P,l=>l.outs>=6,l=>warPit(l,erA),
       l=>`WAR ${warPit(l,erA).toFixed(2)} · ERA ${eraOf(l).toFixed(2)} · ${ipStr(l)}이닝`),
       '이 구간 투수 WAR 1위 · 2이닝 이상 (ERA 만으로는 짧게 던진 사람이 유리해서 이닝을 같이 본다)');
  give('team', rank(noMgr,b=>b.pa>=4,b=>(b.rbi||0)+(b.r||0),b=>`${b.rbi}타점 ${b.r}득점`),
       '타점 + 득점 합계 1위 · 4타석 이상');

  const at=ST.schedule.filter(x=>x.played&&!x.po).length;
  if(!Array.isArray(ST.hall))ST.hall=[];
  if(!ST.awardBonus)ST.awardBonus={};
  const msgs=[];
  const meId=ST.playerId||MYID;

  won.forEach(w=>{
    const label=MINI_LABELS[w.kind]||'수상';
    ST.hall.push({season:ST.seasonNo||1, year:ST.year||2026, at, kind:w.kind,
      label, pid:w.pid, name:nameOf(w.pid), value:w.value, scope:'구간',
      criteria:w.criteria||'', podium:w.podium||null,
      skipped:w.skipped||[], cand:w.cand||0, coWith:w.coWith||[]});
    ST.awardBonus[w.pid]=(ST.awardBonus[w.pid]||0)+1;
    ST.morale[w.pid]=Math.min(100,(ST.morale[w.pid]||70)+7);
    if(ST.bond&&w.pid!==meId)ST.bond[w.pid]=Math.min(100,(ST.bond[w.pid]||50)+1);
    const coTxt=(w.coWith&&w.coWith.length)
      ? `\n${w.coWith.map(nameOf).join(', ')}와(과) 공동 수상` : '';
    msgs.push({who:'lg',type:'notice',
      text:`${at}경기 구간 시상 — ${label}\n${nameOf(w.pid)} · ${w.value}${coTxt}\n사기 +7 · 몸값 상승`});
    /* 축하 — 이건이 하고, 이건이 받으면 송승민이 한다 */
    const cheerer = (w.pid==='lg') ? 'swm' : 'lg';
    if(us.players.some(x=>x.id===cheerer)){
      const c=pickOne(AWARD_CHEER);
      msgs.push({who:cheerer, text:sayTo(cheerer, w.pid, c[0], c[1]), mood:'happy'});
    }
    /* 아주 가끔 다른 팀에서도 축하가 온다 */
    if(Math.random()<0.22){
      const other=TEAMS.filter(t=>t.id!=='wwzw');
      const t=pickOne(other);
      const l2=pickOne(AWARD_OPP);
      msgs.push({who:'lg',type:'notice',text:`${t.name}에서 단톡방에 연락이 왔다\n"${l2[0]}"`});
    }
  });

  /* ---- 리그 전체 구간 수상 ---- 남의 팀 누가 받았는지도 알려준다 */
  const lgw=leagueAwards(snap);
  if(lgw.length){
    msgs.push({who:'lg',type:'notice',
      text:`리그 ${at}경기 구간 수상\n`+lgw.map(a=>{
        const t=leagueOwner(a.pid);
        return `${a.label} — ${leagueName(a.pid)} (${t?t.name:'?'}) ${a.value}`;
      }).join('\n')});
    lgw.forEach(a=>{
      const ours=us.players.some(x=>x.id===a.pid);
      if(!ours)return;
      /* 우리 선수가 리그 상을 받았다 — 남의 팀이 극찬한다 */
      ST.hall=ST.hall||[];
      ST.hall.push({season:ST.seasonNo||1,year:ST.year||2026,at,kind:a.kind,
        label:a.label,pid:a.pid,name:nameOf(a.pid),value:a.value,scope:'리그'});
      ST.awardBonus[a.pid]=(ST.awardBonus[a.pid]||0)+2;
      ST.morale[a.pid]=Math.min(100,(ST.morale[a.pid]||70)+10);
      us.players.forEach(q=>ST.morale[q.id]=Math.min(100,(ST.morale[q.id]||70)+3));
      const others=TEAMS.filter(t=>t.id!=='wwzw');
      const n=1+((Math.random()*2)|0);
      for(let i=0;i<n;i++){
        const t=pickOne(others);
        msgs.push({who:'lg',type:'notice',
          text:`${t.name} 감독\n"${nameOf(a.pid)} 선수, ${pickOne(OPP_PRAISE)}"`});
      }
      msgs.push({who:'lg',type:'notice',text:`${nameOf(a.pid)} 리그 수상 — 전원 사기 +3 · 본인 +10`});
      if(a.pid===meId) ST.awardReply={label:a.label, value:a.value};
    });
  }

  /* 내가 받았으면 대답을 골라야 한다 */
  const mine=won.find(w=>w.pid===meId);
  if(mine && !ST.awardReply) ST.awardReply={label:MINI_LABELS[mine.kind]||'수상', value:mine.value};

  ST.awardSnap=blankSnap();
  return msgs;
}
/* 대답을 고르면 팀 분위기가 달라진다 */
function answerAward(k){
  const r=AWARD_REPLIES.find(x=>x.k===k); if(!r)return;
  const us=TBYID['wwzw'], meId=ST.playerId||MYID;
  ST.kakao=ST.kakao||[];
  ST.kakao.push({who:meId, text:sayTo(meId,'lg',r.line[0],r.line[1]),
    mood:r.k==='brag'?'flat':'happy'});
  us.players.forEach(p=>{
    if(p.id===meId){ if(r.self)ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+r.self); return; }
    ST.morale[p.id]=Math.max(10,Math.min(100,(ST.morale[p.id]||70)+r.mor));
    if(ST.bond)ST.bond[p.id]=Math.max(0,Math.min(100,(ST.bond[p.id]||50)+(r.bond||0)));
  });
  ST.kakao.push({who:'lg',type:'notice',text:`${r.d}`});
  ST.awardReply=null;
  saveGame(true);
}

function buildAwards(ST){
  const us=TBYID['wwzw'];
  const A=[];
  const qual=us.players.filter(p=>(ST.bat[p.id]||{}).pa>=20);
  const pick=(list,fn,label,fmt)=>{
    if(!list.length)return;
    const b=list.slice().sort((x,y)=>fn(y)-fn(x))[0];
    A.push({label,name:b.name,value:fmt(b)});
  };
  const lw=leagueWoba(), le=leagueEra();
  pick(qual,p=>warOf(p.id,ST.bat[p.id],lw),'시즌 MVP',
       p=>`WAR ${warOf(p.id,ST.bat[p.id],lw).toFixed(2)} · OPS ${ops(ST.bat[p.id]).toFixed(3)}`);
  pick(qual,p=>wrcPlus(ST.bat[p.id],lw),'타격상',
       p=>`wRC+ ${wrcPlus(ST.bat[p.id],lw)} · 타율 ${fmt3(avg(ST.bat[p.id]))}`);
  pick(us.players,p=>(ST.bat[p.id]||{}).g||0,'개근상',p=>`${ST.bat[p.id].g}경기`);
  const pit=us.pitchers.filter(p=>(ST.pit[p.id]||{}).outs>=21);
  if(pit.length){
    const b=pit.slice().sort((x,y)=>warPit(ST.pit[y.id],le)-warPit(ST.pit[x.id],le))[0];
    A.push({label:'투수상',name:b.name,
      value:`WAR ${warPit(ST.pit[b.id],le).toFixed(2)} · ERA ${era(ST.pit[b.id]).toFixed(2)}`});
  }

  /* ---- 종합왕 ----
     구간 시상은 WAR·wRC+ 같은 종합 지표로 간다. 그러면 홈런·도루·삼진처럼
     "그냥 많이 한 사람"을 기리는 자리가 사라진다. 그건 시즌 끝에 몰아서 준다.
     야구에서 타이틀홀더라고 부르는 그 자리다.                            */
  const KINGS=[
    {label:'수위타자', min:b=>b.pa>=20, v:b=>avg(b),      f:b=>`타율 ${fmt3(avg(b))}`},
    {label:'홈런왕',   min:b=>b.hr>=1,  v:b=>b.hr,        f:b=>`${b.hr}홈런`},
    {label:'타점왕',   min:b=>b.rbi>=1, v:b=>b.rbi,       f:b=>`${b.rbi}타점`},
    {label:'득점왕',   min:b=>b.r>=1,   v:b=>b.r,         f:b=>`${b.r}득점`},
    {label:'최다안타', min:b=>b.h>=1,   v:b=>b.h,         f:b=>`${b.h}안타`},
    {label:'도루왕',   min:b=>b.sb>=1,  v:b=>b.sb,        f:b=>`${b.sb}도루`},
    {label:'출루왕',   min:b=>b.pa>=20, v:b=>obp(b),      f:b=>`출루율 ${fmt3(obp(b))}`},
    {label:'장타왕',   min:b=>b.ab>=20, v:b=>slg(b),      f:b=>`장타율 ${fmt3(slg(b))}`},
    {label:'선구왕',   min:b=>b.pa>=20, v:b=>bbk(b),      f:b=>`BB/K ${bbk(b).toFixed(2)} (${b.bb}볼넷 ${b.k}삼진)`},
  ];
  const PKINGS=[
    {label:'삼진왕',   min:l=>l.k>=1,     v:l=>l.k,        f:l=>`${l.k}탈삼진`},
    {label:'평균자책왕',min:l=>l.outs>=21, v:l=>-era(l),    f:l=>`ERA ${era(l).toFixed(2)}`},
    {label:'다승왕',   min:l=>l.w>=1,     v:l=>l.w,        f:l=>`${l.w}승`},
    {label:'이닝왕',   min:l=>l.outs>=9,  v:l=>l.outs,     f:l=>`${ipStr(l)}이닝`},
    {label:'WHIP왕',   min:l=>l.outs>=21, v:l=>-whip(l),   f:l=>`WHIP ${whip(l).toFixed(2)}`},
  ];
  const kingOf=(list,get,defs)=>defs.forEach(k=>{
    const c=list.filter(p=>{const o=get(p); return o&&k.min(o);});
    if(!c.length)return;
    const top=Math.max(...c.map(p=>k.v(get(p))));
    const winners=c.filter(p=>Math.abs(k.v(get(p))-top)<1e-9);
    winners.forEach(wp=>A.push({label:k.label,name:wp.name,value:k.f(get(wp)),
      king:true, co:winners.length>1?winners.length:0}));
  });
  kingOf(us.players, p=>ST.bat[p.id], KINGS);
  kingOf(us.pitchers, p=>ST.pit[p.id], PKINGS);
  /* 리그 전체 시즌 1위 — 남의 팀이 받았어도 보여준다 */
  leagueAwards(null).forEach(a=>{
    const t=leagueOwner(a.pid);
    A.push({label:a.label.replace('구간 ',''),name:`${leagueName(a.pid)} (${t?t.name:'?'})`,value:a.value,
      league:true, ours:us.players.some(x=>x.id===a.pid)});
  });
  const gr=us.players.map(p=>({p,g:(ST.ca[p.id]||0)-((ST.caStart&&ST.caStart[p.id])||(ST.ca[p.id]||0))}))
    .sort((a,b)=>b.g-a.g)[0];
  if(gr&&gr.g>0.5)A.push({label:'최다 성장',name:gr.p.name,value:`+${gr.g.toFixed(1)}`});
  pick(qual,p=>(ST.bat[p.id]||{}).bb||0,'선구안상',p=>`${ST.bat[p.id].bb}볼넷`);
  const dr=us.players.filter(p=>META[p.id]&&META[p.id].drink>=3);
  if(dr.length)A.push({label:'주당상',name:pickOne(dr).name,value:'회식 개근'});
  return A;
}

   이걸 상시 기능으로 뺐다. 선수단 화면에서 아무나 불러서

/* 불만 단계 → 대사 풀 키 */
function meetTier(lv){ return lv>=3?'high':(lv>=2?'mid':'ok'); }

/* 오프닝 한 줄 생성. 특성 전용 대사가 있으면 40% 확률로 그걸 쓴다 */
function meetOpenLine(ST, pid){
  const m=META[pid]||{traits:[]};
  const lv=(ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0;
  let pool=null;
  const tr=(m.traits||[]).find(t=>MEET_TRAIT_OPEN[t]);
  if(tr && Math.random()<0.4) pool=MEET_TRAIT_OPEN[tr];
  if(!pool) pool=MEET_OPEN[meetTier(lv)];
  const pair=pickOne(pool);
  return sayTo(pid, ST.playerId, pair[0], pair[1]);
}
function meetReplyLine(ST, pid, key){
  const pair=pickOne(MEET_REPLY[key]);
  return sayTo(pid, ST.playerId, pair[0], pair[1]);
}

/* ---------------------------------------------------------
   약속 검사 — commitGame 에서 매 경기 호출한다.
   starters : 이번 경기 선발 출전 명단(id 배열, 타순 순서)
   played   : 실제로 경기에 나온 id 집합
   absent   : 결장자 판정용 (부상/불참). 결장은 위반으로 치지 않는다.
   반환값은 단톡방에 붙일 메시지 배열.
   --------------------------------------------------------- */
function checkPromises(ST, starters, playedIds, absentIds){
  const msgs=[];
  if(!ST.promise) return msgs;
  Object.keys(ST.promise).forEach(pid=>{
    const pr=ST.promise[pid];
    if(!pr) { delete ST.promise[pid]; return; }
    // 이적·방출로 로스터에서 빠진 선수의 약속은 그냥 없앤다
    if(!TBYID['wwzw'].players.some(q=>q.id===pid)) { delete ST.promise[pid]; return; }
    // 결장(부상·개인사정)한 경기는 약속 계산에서 통째로 빼준다
    if(absentIds.indexOf(pid)>=0) return;

    const idx=starters.indexOf(pid);
    let kept;
    if(pr.type==='order') kept = idx>=0 && (idx+1)<=(pr.orderMax||3);
    else kept = idx>=0 || playedIds.indexOf(pid)>=0;

    if(kept){
      pr.games--;
      if(pr.games<=0){
        ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+15);
        ST.unhappy[pid]={level:0,streak:0};
        const pair=pickOne(MEET_PROMISE_MSG.done);
        msgs.push({who:pid,text:sayTo(pid,ST.playerId,pair[0],pair[1]),mood:'happy'});
        delete ST.promise[pid];
      }
    } else {
      // 위반 — 사기 대폭 하락 + 언해피 즉시 2단계.
      // 두 번째부터는 신뢰가 무너져서 곧바로 최후통첩으로 간다.
      ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-20);
      const u=ST.unhappy[pid]||{level:0,streak:0};
      u.level=Math.min(4,u.level+2); u.streak=0;
      ST.unhappy[pid]=u;
      const pair=pickOne(pr.type==='order'?MEET_PROMISE_MSG.break_order:MEET_PROMISE_MSG.break_start);
      msgs.push({who:pid,text:sayTo(pid,ST.playerId,pair[0],pair[1]),mood:'angry'});
      ST.broken=ST.broken||{}; ST.broken[pid]=(ST.broken[pid]||0)+1;
      /* 친한 사람들도 "쟤 말 안 지키네" 하고 본다 */
      (META[pid]&&META[pid].friends||[]).forEach(f=>{
        if(TBYID['wwzw'].players.some(q=>q.id===f)) addSpark(ST,f,'분위기',1);
      });
      if(ST.broken[pid]>=2){
        u.level=4;
        ST.ultimatum=ST.ultimatum||{};
        if(ST.ultimatum[pid]==null)ST.ultimatum[pid]=2;
        msgs.push({who:pid,type:'notice',
          text:`약속 파기 ${ST.broken[pid]}회 — ${nameOf(pid)} 신뢰 붕괴\n이적 요구 단계 · ${ST.ultimatum[pid]}경기 안에 못 풀면 나간다`});
      } else {
        msgs.push({who:pid,type:'notice',text:`약속 파기 — ${nameOf(pid)} 사기 -20 · 불만 2단계 상승\n친한 선수들도 지켜보고 있다`});
      }
      delete ST.promise[pid];
    }
  });
  return msgs;
}

/* 경기 결과에 실린 고진선 이벤트를 사기·컨디션·단톡에 반영한다.
   반환값은 단톡방(경기 후)에 붙일 메시지 배열.                      */
function applyGojin(ST, gj){
  const msgs=[];
  if(!gj||!gj.log||!gj.log.length) return msgs;
  const us=TBYID['wwzw'];

  if(gj.threw){
    msgs.push({who:'khg',type:'notice',
      text:'고진선이 자기 팀 실책에 공을 패대기쳤다\n안산 사기 하락 · 우리 타격 소폭 상승'});
  }
  if(gj.cleared){
    // 양 팀 컨디션이 깎이지만 우리 사기는 오히려 오른다
    us.players.forEach(p=>{
      ST.cond[p.id]=Math.max(20,(ST.cond[p.id]||70)-6);
      ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+8);
    });
    msgs.push({who:'lg',type:'notice',
      text:'벤치클리어링\n양 팀 컨디션 -6 · 우리 팀 사기 +8'});
    const line=pickOne(GOJIN_CLEAR_MSG);
    if(us.players.some(p=>p.id===line[0]))
      msgs.push({who:line[0],text:line[1],mood:'angry'});
  }
  // 두 명이 같은 핑계를 대면 김이 새니 중복 없이 뽑는다
  const exPool=GOJIN_EXCUSE.slice();
  (gj.mocked||[]).forEach(m=>{
    if(!us.players.some(p=>p.id===m.pid))return;
    ST.morale[m.pid]=Math.max(10,(ST.morale[m.pid]||70)-10);
    const ex=exPool.length?exPool.splice((Math.random()*exPool.length)|0,1)[0]:pickOne(GOJIN_EXCUSE);
    msgs.push({who:m.pid,text:say(m.pid,ex[0],ex[1]),mood:'sad'});
    if(m.woke){
      // 각성했으면 사기 하락분을 되돌려주고 조금 더 얹는다
      ST.morale[m.pid]=Math.min(100,(ST.morale[m.pid]||70)+18);
      const wk=pickOne(GOJIN_WAKE_MSG);
      msgs.push({who:m.pid,text:say(m.pid,wk[0],wk[1]),mood:'happy'});
      msgs.push({who:m.pid,type:'notice',text:`${nameOf(m.pid)} 각성 — 사기 회복 +8`});
    } else {
      msgs.push({who:m.pid,type:'notice',text:`${nameOf(m.pid)} 사기 -10`});
    }
  });
  return msgs;
}

/* 경기 후 마찰 결과를 사기·컨디션·단톡에 반영 */
function applyFriction(ST, fr){
  const msgs=[];
  if(!fr||!fr.log||!fr.log.length)return msgs;
  const us=TBYID['wwzw'];
  if(fr.hbp){
    us.players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+5));
    msgs.push({who:'lg',type:'notice',text:'사구로 벤치가 뭉쳤다\n전원 사기 +5'});
    const spk=speakers(ST,null,2,Math.random);
    spk.forEach(p=>msgs.push({who:p.id,
      text:line(p.id,ST.playerId,
        ['그건 좀 심했다','다음에 우리가 갚자','괜찮냐 진짜','저건 고의 아니냐'],
        ['그건 좀 심했습니다','다음에 우리가 갚죠','괜찮으세요 진짜','저건 고의 아닌가요'],Math.random),
      mood:'angry'}));
  }
  if(fr.cleared){
    us.players.forEach(p=>{
      ST.cond[p.id]=Math.max(20,(ST.cond[p.id]||70)-5);
      ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+9);
    });
    msgs.push({who:'lg',type:'notice',text:'벤치클리어링\n전원 컨디션 -5 · 사기 +9'});
    if(fr.by&&us.players.some(p=>p.id===fr.by)){
      msgs.push({who:fr.by,text:say(fr.by,'나는 잘못한 거 없다','저는 잘못한 거 없습니다'),mood:'angry'});
      const spk=speakers(ST,fr.by,2,Math.random);
      spk.forEach(p=>msgs.push({who:p.id,
        text:line(p.id,ST.playerId,
          ['너 좀 참아라 진짜','다칠 뻔했다','그래도 시원하긴 했다','다음엔 말리자'],
          ['좀 참으세요 진짜','다칠 뻔했습니다','그래도 시원하긴 했습니다','다음엔 말리시죠'],Math.random),
        mood:'flat'}));
    }
  }
  if(fr.drunk&&us.players.some(p=>p.id===fr.drunk)){
    ST.morale[fr.drunk]=Math.max(10,(ST.morale[fr.drunk]||70)-6);
    msgs.push({who:fr.drunk,
      text:say(fr.drunk,'어제 좀 마시긴 했다 미안','어제 좀 마시긴 했습니다 죄송합니다'),mood:'sad'});
    msgs.push({who:fr.drunk,type:'notice',text:`${nameOf(fr.drunk)} 사기 -6 — 경기 전날은 좀 참자`});
  }
  if(fr.up){
    us.players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+4));
    msgs.push({who:'lg',type:'notice',text:'경기 중 분위기를 탔다\n전원 사기 +4'});
  }
  return msgs;
}

/* 약속 요약 문구 (홈 화면·면담 화면 공용) */
function promiseLabel(pr){
  if(!pr) return '';
  return pr.type==='order'
    ? `${pr.orderMax}번 타순 이상 · ${pr.games}경기 남음`
    : `선발 출전 · ${pr.games}경기 남음`;
}

<script>
/* =========================================================
   LiveGame — 이닝 단위로 진행되며 판단 지점에서 멈춘다
   ========================================================= */
'use strict';

function newBoxL(){return {pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}
function newPitL(){return {outs:0,h:0,r:0,er:0,bb:0,k:0,hbp:0,sbA:0,bf:0};}

function LiveGame(cfg){
  this.INN = cfg.innings || 7;
  this.rng = cfg.rng;
  this.userIsHome = cfg.userIsHome;
  this.log = [];
  this.box = {}; this.pbox = {};
  this.injuries = [];
  this.over = false; this.mercy = false;
  this.inning = 1; this.half = 0;
  this.outs = 0; this.bases = [null,null,null];
  this.pending = null;
  this.usedPH = {};       // 대타 사용 기록
  this.park = cfg.park || {hr:1,d2:1,d3:1,err:1,babip:1};
  this.gearPenalty = cfg.gearPenalty||0;
  this.buff = cfg.buff||{};
  this.form = cfg.form||{};          // 투수 폼 배수 {pid:0.93~1.07}
  this.benchPool = cfg.benchPool||[];   // 나왔는데 라인업엔 못 든 사람들
  this.dpCount=0; this.assists=0; this.wp=0;
  /* [버그 이력] 이걸 초기화 안 해서 첫 득점 때 undefined++ 가 NaN 이 됐다.
     endHalf 의 (this.curIR||0) 이 그 NaN 을 0 으로 눌러버려서
     1회 초 득점이 라인스코어에서 통째로 사라졌다.
     "R 은 5점인데 이닝을 더하면 2점"이 여기서 나왔다.            */
  this.curIR=0;                    // 이번 반이닝 득점
  this.hot = !!cfg.hot;
  /* 판단창은 한 타석에 한 번만 뜬다.
     예전에는 지시를 고르고 나면 타석을 진행하기도 전에 같은 상황을 다시 검사해서
     판단창이 곧바로 또 떴다. 유저 입장에서는 "골라도 안 넘어간다"로 보였다.  */
  this.paSeq = 0;         // 완료된 타석 수
  this.lastDecPA = -1;    // 마지막으로 판단을 물어본 타석
  this.timeouts = 5;      // 공격 작전 지시 가능 횟수
  this.defTimeouts = 3;   // 수비 판단(고의4구·시프트) 가능 횟수
  this.myId = cfg.myId||null;      // 플레이어가 고른 선수 — 피드 강조용
  this.tacTTL = {bat:0, run:0};    // 공격 지시 잔여 타석. 0이 되면 자동 해제된다
  this.shiftTTL = 0;               // 수비 시프트 잔여 타석
  this._buntRun = false;

  const mk = (team, slots, rot, tac, cond, isUser) => {
    const s = {team, slots: slots.map(x=>({...x})), rot: rot.slice(), tac:{...tac}, tacBase:{...tac},
      cond:cond||{},
      isUser, order:0, pIdx:0, runs:0, hits:0, errs:0, bbs:0, sbAllowed:0, line:[]};
    const c = s.slots.find(x=>x.pos==='C');
    const cp = c ? team.players.find(p=>p.id===c.id) : null;
    s.cArm = (cp ? cp.arm : 45) - (isUser?(cfg.gearPenalty||0):0);
    s.slots.forEach(sl=>{ this.box[sl.id]=this.box[sl.id]||newBoxL(); });
    s.rot.forEach(pid=>{ this.pbox[pid]=this.pbox[pid]||newPitL(); });
    /* 그날 타석에 선 사람 전원. slots 는 교체되면 덮어써지기 때문에
       선발 타자가 통째로 사라진다. 경기 후 박스스코어와 시즌 누적이
       대타에게 밀려 없어지지 않도록 여기에 따로 쌓아둔다.            */
    s.used = s.slots.map((sl,i)=>({id:sl.id,pos:sl.pos,ord:i,starter:true,inning:1,how:null,forId:null}));
    return s;
  };
  this.away = mk(cfg.away, cfg.awayLineup, cfg.awayRotation, cfg.awayTactics, cfg.awayCond, !cfg.userIsHome);
  this.home = mk(cfg.home, cfg.homeLineup, cfg.homeRotation, cfg.homeTactics, cfg.homeCond, cfg.userIsHome);
  this.sides = [this.away, this.home];
  /* 안산유나이티드전 한정 — 고진선 특수 이벤트.
     실제로 그 팀 에이스가 자기 팀 실책에 화내고 상대 벤치에 시비를 걸었다.
     로스터에 고진선이 실제로 있어야 발동한다.                          */
  const opT=(this.userIsHome?this.away:this.home).team;
  const hasGo = opT && opT.id==='ansanutd' &&
    ((opT.players||[]).some(x=>x.name==='고진선')||(opT.pitchers||[]).some(x=>x.name==='고진선'));
  this.gojin = hasGo ? {log:[],mocked:[],threw:false,cleared:false} : null;
  this.gojinUs = 1;      // 우리 팀 BABIP 배수 (패대기·벤치클리어링 여파)
  this.gojinOpp = 1;     // 안산 BABIP 배수
  this.gojinWake = {};   // 각성 예약 {pid:true} — 두 명이 동시에 예약될 수 있다
  this.highlights = [];  // 이닝별 주요 장면 (2루타·3루타·홈런·도루자·병살타)
  this.feats = [];       // 박스스코어만으로는 못 잡는 진기록 (만루홈런·끝내기)
  this.friction = {log:[],hbp:false,cleared:false,drunk:null,by:null,up:false,pending:false};
  this.drunkIds = cfg.drunkIds||[];   // 전날 마신 사람들
  this.fricUs = 1;       // 마찰 여파로 붙는 우리 BABIP 배수
  this.fricOpp = 1;
  this.mgr = {left:3, boost:1, log:[]};  // 감독 액션
  this.log.push({t:'inning', inning:1, half:0, text:`1회 초 · ${this.away.team.name} 공격`});
  this.startedInning = true;
  this.checkPitcherChange(this.home);
}

/* 주요 장면 기록. 경기 후 하이라이트 표에 그대로 쓴다. */
LiveGame.prototype.hl = function(kind, side, name, detail){
  this.highlights.push({
    inning:this.inning, half:this.half, kind,
    team:side.team.name, us:!!side.isUser, name, detail:detail||''
  });
};

LiveGame.prototype.off = function(){ return this.sides[this.half]; };
LiveGame.prototype.def = function(){ return this.sides[1-this.half]; };
LiveGame.prototype.userSide = function(){ return this.userIsHome ? this.home : this.away; };
LiveGame.prototype.oppSide = function(){ return this.userIsHome ? this.away : this.home; };
LiveGame.prototype.curPitcher = function(s){
  const pid = s.rot[Math.min(s.pIdx, s.rot.length-1)];
  const p = s.team.pitchers.find(x=>x.id===pid) || s.team.pitchers[0];
  if(!p) return p;
  const mm = (typeof META!=='undefined') ? META[p.id] : null;
  let out=p;
  if(s.isUser && mm && mm.traits.includes('더위약함') && this.hot){
    const outs = (this.pbox[p.id]||{}).outs||0;
    if(outs > 6) out = {...out, stf: Math.round(out.stf*0.62), ctl: Math.round(out.ctl*0.78)};
  }
  // 폼 — 연속으로 두들겨 맞으면 공이 안 들어가고, 잘 던지면 손끝이 산다
  if(s.isUser && this.form && this.form[p.id]!=null && this.form[p.id]!==1){
    const fm=this.form[p.id];
    out = {...out, stf: Math.round(out.stf*fm), ctl: Math.round(out.ctl*fm)};
  }
  return out;
};
LiveGame.prototype.batter = function(){
  const s=this.off(); const slot=s.slots[s.order%9];
  return s.team.players.find(p=>p.id===slot.id);
};

LiveGame.prototype.checkPitcherChange = function(s){
  const p=this.curPitcher(s), l=this.pbox[p.id];
  const hk=s.tac.hook||'normal';
  const mul = hk==='quick'?0.72:(hk==='long'?1.30:1);
  const lim=Math.round((6+(p.sta-28)*0.40)*mul);
  const bbLim = hk==='quick'?4:(hk==='long'?9:7);
  const rLim  = hk==='quick'?5:(hk==='long'?12:9);
  if((l.outs>=lim||l.bb+l.hbp>=bbLim||l.r>=rLim) && s.pIdx<s.rot.length-1){
    if(s.isUser){
      // 유저 팀이면 교체 여부를 물어본다
      this.pending={kind:'pitcherChange', side:s, from:p.name, to:this.curPitcherNext(s)};
      return true;
    }
    s.pIdx++;
    this.log.push({t:'sub',text:`투수 교체 · ${s.team.name}: ${p.name} → ${this.curPitcher(s).name}`});
  }
  return false;
};
LiveGame.prototype.curPitcherNext = function(s){
  const pid=s.rot[Math.min(s.pIdx+1,s.rot.length-1)];
  const p=s.team.pitchers.find(x=>x.id===pid);
  return p?p.name:'—';
};

/* 판단 지점 탐지 */
LiveGame.prototype.detectDecision = function(){
  if(this.pending) return this.pending;
  // 이 타석에서 이미 물어봤으면 타석이 끝날 때까지 다시 묻지 않는다
  if(this.paSeq===this.lastDecPA) return null;
  const off=this.off();

  /* 우리가 수비 중일 때의 판단 지점 — 투수 교체·고의4구·시프트 */
  if(!off.isUser && this.def().isUser){
    if(this.defTimeouts<=0) return null;
    const usD=this.userSide(), thD=this.oppSide();
    const dd=usD.runs-thD.runs;
    const rispD=this.bases[1]||this.bases[2];
    const pitD=this.curPitcher(this.def()), plD=this.pbox[pitD.id];
    if(rispD && this.outs<2 && this.rng()<0.30) return {kind:'defense', label:'실점 위기'};
    if((plD.bb+plD.hbp)>=3 && this.rng()<0.35) return {kind:'defense', label:'투수가 흔들린다'};
    if(plD.r>=4 && this.rng()<0.30) return {kind:'defense', label:'투수 난조'};
    if(this.inning>=this.INN-2 && Math.abs(dd)<=2 && this.outs<2 && this.rng()<0.22)
      return {kind:'defense', label:'후반 승부처'};
    return null;
  }

  if(!off.isUser) return null;
  if(this.timeouts<=0) return null;

  const us=this.userIsHome?this.home:this.away;
  const th=this.userIsHome?this.away:this.home;
  const diff = us.runs - th.runs;
  const risp = this.bases[1]||this.bases[2];
  const onBase = this.bases[0]||risp;
  const late = this.inning >= this.INN-2;
  const close = Math.abs(diff)<=4;

  // 득점권
  if(risp && this.outs<2){
    if(this.rng() < (close?0.55:0.30)) return {kind:'situation', label:'득점권 기회'};
  }
  // 주자 1루
  if(this.bases[0] && !this.bases[1] && this.outs<2){
    if(this.rng() < (late&&close?0.45:0.22)) return {kind:'situation', label:'주자 1루'};
  }
  // 후반 승부처
  if(late && close && this.outs<2){
    if(this.rng() < 0.25) return {kind:'situation', label:'승부처'};
  }
  // 이닝 선두타자
  if(!onBase && this.outs===0 && this.inning>=2){
    if(this.rng() < 0.14) return {kind:'situation', label:'이닝 선두타자'};
  }
  // 한 번도 안 썼으면 후반에 반드시 한 번
  if(this.timeouts===5 && this.inning>=this.INN-1 && this.outs<2){
    return {kind:'situation', label:'마지막 기회'};
  }
  return null;
};

/* 지시 유효기간 관리
   ---------------------------------------------------------
   예전에는 '적극 스윙' 을 한 번 누르면 경기가 끝날 때까지 유지돼서
   초구 스윙만 무한 반복됐다. 이제 타석 수를 세서 자동으로 풀린다.
   해제하면 라인업 화면에서 정한 기본 전술(tacBase)로 돌아간다.        */
LiveGame.prototype.tickTactics = function(offWasUser){
  const s=this.userSide();
  // 시프트는 우리가 수비할 때만 닳는다
  if(this.shiftTTL>0 && !offWasUser){
    this.shiftTTL--;
    if(this.shiftTTL===0) this.log.push({t:'sub',text:'수비 시프트 해제 — 지시 종료'});
  }
  if(!offWasUser) return;
  if(this.tacTTL.bat>0){
    this.tacTTL.bat--;
    if(this.tacTTL.bat===0){
      const back=s.tacBase.bat||'normal';
      if(s.tac.bat!==back){ s.tac.bat=back; this._buntRun=false;
        this.log.push({t:'sub',text:'타격 지시 종료 — 평소대로'}); }
    }
  }
  if(this.tacTTL.run>0){
    this.tacTTL.run--;
    if(this.tacTTL.run===0){
      const back=s.tacBase.run||'normal';
      if(s.tac.run!==back){ s.tac.run=back;
        this.log.push({t:'sub',text:'주루 지시 종료 — 평소대로'}); }
    }
  }
};

/* 한 타석 진행 — 실제 계산은 stepPA, step 은 지시 만료를 처리하는 껍데기 */
LiveGame.prototype.step = function(){
  if(this.over) return {done:true};
  if(this.pending) return {pending:this.pending};
  const offWasUser=this.off().isUser;
  this._paDone=false;
  const r=this.stepPA();
  if(this._paDone){ this.paSeq++; this.tickTactics(offWasUser); }
  return r;
};

LiveGame.prototype.stepPA = function(){
  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  const bl=this.box[bat.id];
  const rng=this.rng;
  const events=[];

  // 도루
  if(this.bases[0] && !this.bases[1]){
    const rn=off.team.players.find(x=>x.id===this.bases[0]);
    if(rn){
      let runMul=1;
      if(off.tac.run==='aggressive')runMul=1.6;
      else if(off.tac.run==='hold')runMul=0.12;
      /* 똥차 — 발이 느려서 애초에 스타트를 끊지 않는다 */
      const rmm=(typeof META!=='undefined')?META[rn.id]:null;
      if(rmm && rmm.traits.includes('똥차')) runMul*=0.35;
      const att=clamp(LG.SB_PER_PA*5.64*off.team.tend.sb*runMul*Math.exp((rn.spd-46)*0.020),0,0.85);
      if(rng()<att){
        const su=clamp(LG.SB_SUCCESS+(rn.spd-50)*0.0030-(def.cArm-46)*0.0060,0.45,0.99);
        if(rng()<su){
          this.bases[1]=this.bases[0];this.bases[0]=null;
          this.box[rn.id].sb++;pl.sbA++;def.sbAllowed++;
          events.push({text:`${rn.name} 2루 도루 성공`,cls:'sb'});
        }else{
          /* 도루 저지도 투수가 기록한 아웃이다. 이닝(IP)에 들어가야 한다.
             예전에는 이걸 빼먹어서 3이닝을 던지고도 2.2 / 3.1 처럼
             이닝이 실제 경기와 어긋났다. */
          this.bases[0]=null;this.outs++;pl.outs++;this.box[rn.id].cs++;
          events.push({text:`${rn.name} 도루 실패`,cls:'out'});
          this.hl('cs',off,rn.name,'2루 도루 실패');
          if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
        }
      }
    }
  }

  /* 폭투 — 주자가 있고 제구가 나쁠수록 */
  if((this.bases[0]||this.bases[1]||this.bases[2]) && rng() < clamp(0.009+(42-pit.ctl)*0.0009, 0.002, 0.038)){
    for(let b=2;b>=0;b--){
      if(!this.bases[b])continue;
      if(b===2){ this.box[this.bases[2]].r++; off.runs++; this.curIR=(this.curIR||0)+1; pl.r++; pl.er++; this.bases[2]=null; }
      else { this.bases[b+1]=this.bases[b]; this.bases[b]=null; }
    }
    this.wp=(this.wp||0)+1;
    events.push({text:`${pit.name} 폭투`,cls:'err'});
  }

  pl.bf++; bl.pa++;
  this._paDone=true;                       // 이 타석이 소비됐다 → 지시 카운트 차감
  // 플레이어가 고른 선수의 타석은 피드에서 따로 알려준다
  if(this.myId && bat.id===this.myId) this.log.push({t:'me',text:`▶ ${bat.name} 타석`});
  const cond = off.cond[bat.id];
  let batE = bat;
  /* 포수부담 — 포수로 출전하면 타격이 떨어진다 */
  const mySlot = off.slots[(off.order)%9];
  const mm = (typeof META!=='undefined') ? META[bat.id] : null;
  if(off.isUser && mm && mm.traits.includes('포수부담') && mySlot && mySlot.pos==='C'){
    batE = {...batE, con: batE.con*0.86, pow: batE.pow*0.86};
  }
  const bf = off.isUser && this.buff ? this.buff[bat.id] : null;
  if(bf){
    batE = {...bat};
    if(bf.pow) batE.pow = Math.min(80, bat.pow*bf.pow);
    if(bf.spd) batE.spd = Math.min(80, bat.spd*bf.spd);
    if(bf.all){ batE.con=bat.con*bf.all; batE.pow=bat.pow*bf.all; batE.spd=bat.spd*bf.all; }
  }
  /* ---- 고진선 이벤트 ---- 순서 중요: 각성 판정을 놀림보다 먼저 해야
     이번 타석이 아니라 '다음 타석'에 버프가 붙는다.                    */
  if(this.gojin){
    if(off.isUser && this.gojinWake[bat.id]){
      batE={...batE, con:Math.min(80,batE.con*1.22), pow:Math.min(80,batE.pow*1.22)};
      this.log.push({t:'gojin',text:`${bat.name} 눈빛이 달라졌다`});
      const mk=this.gojin.mocked.find(m=>m.pid===bat.id);
      if(mk)mk.woke=true;
      delete this.gojinWake[bat.id];
    }
    // 그날 무안타인 우리 타자를 놀린다 (경기당 최대 2명, 같은 선수 1번)
    if(off.isUser && bl.ab>=2 && bl.h===0 && this.gojin.mocked.length<2
       && !this.gojin.mocked.some(m=>m.pid===bat.id) && rng()<0.30){
      this.gojin.mocked.push({pid:bat.id,woke:false});
      this.gojin.log.push('mock');
      this.log.push({t:'gojin',text:pickOne(GOJIN_MOCK,rng)[0].replace('${n}',bat.name)});
      if(rng()<0.35){ this.gojinWake[bat.id]=true;   // 확률적 각성
        this.log.push({t:'gojin',text:`${bat.name}이(가) 배트를 고쳐 잡았다`}); }
      else this.log.push({t:'gojin',text:`${bat.name}이(가) 아무 말도 못 했다`});
    }
    // 안산이 3점 이상 지고 있으면 시비를 건다 → 벤치클리어링 (경기당 1회)
    if(!this.gojin.cleared && this.inning>=3
       && (this.oppSide().runs - this.userSide().runs) <= -3 && rng()<0.10){
      this.gojin.cleared=true;
      this.gojin.log.push('clear');
      this.log.push({t:'gojin',text:pickOne(GOJIN_CLEAR,rng)});
      this.log.push({t:'gojin',text:'벤치클리어링 — 양 팀이 그라운드로 몰려나왔다'});
      this.log.push({t:'gojin',text:'심판이 경고만 주고 경기를 재개했다'});
      this.gojinOpp*=0.94; this.gojinUs*=0.96;   // 양 팀 다 흔들린다
    }
  }

  /* ---- 경기 중 마찰 ---- 상대가 누구든 일어난다 */
  if(off.isUser || def.isUser){
    const usS=this.userSide(), thS=this.oppSide();
    const diff=usS.runs-thS.runs;
    // 전날 마신 김인규가 흥분한다
    if(!this.friction.drunk && this.inning>=3 && this.drunkIds.indexOf('kig')>=0
       && usS.slots.some(x=>x.id==='kig') && rng()<0.004){   // 경기당 약 13%
      this.friction.drunk='kig'; this.friction.log.push('drunk');
      this.log.push({t:'fric',text:pickOne(FRIC_KIG_DRUNK,rng)});
      this.friction.pending=true;
    }
    // 김한규가 있으면 벤치클리어링으로 번진다.
    // 판정은 딱 한 번만 한다 — 매 타석 굴리면 결국 100% 터진다.
    if(this.friction.pending && !this.friction.cleared){
      this.friction.pending=false;
      if(rng()<0.42){
      this.friction.cleared=true; this.friction.log.push('clear');
      const khg = usS.slots.some(x=>x.id==='khg');
      this.log.push({t:'fric',text: khg?pickOne(FRIC_KHG_CLEAR,rng)
        :'양 팀 선수들이 그라운드로 몰려나왔다'});
      this.log.push({t:'fric',text:pickOne(FRIC_CLEAR_END,rng)});
      this.friction.by = khg?'khg':(this.friction.drunk||'kig');
      this.fricUs*=0.97; this.fricOpp*=0.95;   // 양 팀 다 흔들린다
      } else {
        this.log.push({t:'fric',text:'주변에서 말려서 더 커지지는 않았다'});
      }
    }
    // 사구 뒤에도 번질 수 있다
    if(this.friction.hbp && !this.friction.cleared && !this.friction.pending
       && diff<=-3 && this.inning>=4 && rng()<0.004){
      this.friction.pending=true;
    }
    // 분위기 상승 — 크게 앞설 때
    if(!this.friction.up && off.isUser && diff>=3 && this.inning>=3 && rng()<0.012){
      this.friction.up=true; this.friction.log.push('up');
      this.log.push({t:'fric',text:pickOne(FRIC_UP,rng)});
      this.fricUs*=1.05;
    }
  }

  let pitE = pit;
  if(pit.heatFade && pl.outs>=6){
    const over=Math.min(12,pl.outs-6);
    pitE={...pit, stf:Math.max(14,pit.stf-8-over*1.6), ctl:Math.max(10,pit.ctl-5-over*1.1)};
  }
  /* 수비 시프트 — 정면 타구는 잘 잡히지만 반대쪽으로 빠지면 장타가 된다.
     simPA 를 고치지 않고 구장 배수(park)만 갈아끼워서 표현한다.        */
  let parkE=this.park;
  if(def.isUser && this.shiftTTL>0){
    parkE={...this.park, babip:this.park.babip*0.92,
           d2:this.park.d2*1.18, err:this.park.err*1.06};
  }
  // 고진선 이벤트 여파 — 공격 중인 쪽에 해당하는 배수를 곱한다
  const gjM = (off.isUser ? this.gojinUs : this.gojinOpp)
            * (off.isUser ? this.fricUs : this.fricOpp)
            * (off.isUser ? (this.mgr.boost||1) : 1);
  if(gjM!==1) parkE={...parkE, babip:parkE.babip*gjM};
  /* 똑딱이 — 배트에 맞히는 건 잘하는데(삼진 적음) 담장 근처를 못 간다 */
  const pmods = (mm && mm.traits.includes('똑딱이')) ? {k:0.82, pow:0.55} : null;
  const res = simPA(batE, pitE, off.team, def.team, rng, off.tac, cond, parkE, pmods);
  // 번트 앤 런은 주자가 한 베이스 더 간다
  const advOdds = (off.isUser && this._buntRun) ? 0.62 : 0.35;

  const score=(rid,e)=>{ if(!rid)return; this.box[rid].r++; off.runs++; this.curIR=(this.curIR||0)+1; pl.r++; if(e)pl.er++; };
  const adv=(n,e)=>{ for(let b=2;b>=0;b--){ if(this.bases[b]){ const nb=b+n;
    if(nb>=3){score(this.bases[b],e);bl.rbi++;} else this.bases[nb]=this.bases[b]; this.bases[b]=null; } } };

  if(res.type==='K'){ bl.ab++;bl.k++;pl.k++;pl.outs++;this.outs++;
    events.push({text:`${bat.name} 삼진`,cls:'out'}); }
  else if(res.type==='BB'||res.type==='HBP'){
    const isBB=res.type==='BB';
    if(isBB){bl.bb++;pl.bb++;off.bbs++;}else{
      bl.hbp++;pl.hbp++;
      // 우리 타자가 맞으면 벤치가 험악해진다 (경기당 1회)
      if(off.isUser && !this.friction.hbp && rng()<0.35){
        this.friction.hbp=true; this.friction.log.push('hbp');
        this.log.push({t:'fric',text:pickOne(FRIC_HBP,rng).replace('{n}',bat.name)});
        this.log.push({t:'fric',text:pickOne(FRIC_HBP_AFTER,rng)});
        this.fricUs*=1.04; this.fricOpp*=0.97;
      }
    }
    if(this.bases[0]&&this.bases[1]&&this.bases[2]){score(this.bases[2],true);bl.rbi++;this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]){this.bases[1]=this.bases[0];}
    this.bases[0]=bat.id;
    events.push({text:`${bat.name} ${isBB?'볼넷':'몸에 맞는 공'}`,cls:'bb'});
  }
  else if(res.type==='E'){ bl.ab++;def.errs++;adv(1,false);this.bases[0]=bat.id;
    events.push({text:`${bat.name} 상대 실책 출루`,cls:'err'});
    // 안산 야수가 실책하면 고진선이 폭발한다 (경기당 1회)
    if(this.gojin && !this.gojin.threw && !def.isUser && rng()<0.65){
      this.gojin.threw=true;
      this.gojin.log.push('throw');
      this.log.push({t:'gojin',text:pickOne(GOJIN_THROW,rng)});
      this.log.push({t:'gojin',text:pickOne(GOJIN_THROW_AFTER,rng)});
      this.gojinOpp*=0.92; this.gojinUs*=1.05;
    } }
  else if(res.type==='OUT'){
    bl.ab++;pl.outs++;this.outs++;
    const dpB = def.isUser ? (typeof dpBonus==='function'?dpBonus(def.slots).bonus:0) : 0;
    // 번트 앤 런은 굴러가면 주자가 걸릴 위험이 조금 더 크다
    const dpRisk = 0.030 + dpB + ((off.isUser&&this._buntRun)?0.050:0)
      + ((mm && mm.traits.includes('똥차'))?0.045:0);   // 똥차는 1루에서 못 산다
    if(res.gb&&this.bases[0]&&this.outs<3&&rng()<dpRisk){this.bases[0]=null;pl.outs++;this.outs++;
      this.dpCount=(this.dpCount||0)+1;
      events.push({text:`${bat.name} 병살타`,cls:'out'});
      this.hl('dp',off,bat.name,'');}
    else if(this.bases[2]&&this.outs<3&&!res.gb&&rng()<0.30){
      // 홈보살 특성 보유 외야수가 있으면 잡아낸다
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(of && rng()<0.10){
        this.bases[2]=null; pl.outs++; this.outs++;
        events.push({text:`${bat.name} 뜬공 — ${of.name} 홈 보살! 주자 아웃`,cls:'sb'});
        this.assists=(this.assists||0)+1;
        this.assistBy=of.id;
      } else {
        score(this.bases[2],true);bl.rbi++;this.bases[2]=null;
        events.push({text:`${bat.name} 희생플라이 · 1점`,cls:'score'});
      }
    }
    else events.push({text:`${bat.name} ${res.gb?'땅볼':'뜬공'} 아웃`,cls:'out'});
  }
  else{
    bl.ab++;bl.h++;pl.h++;off.hits++;
    if(res.type==='1B'){
      // 3루 주자 홈 쇄도 — 홈보살 특성 판정
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(this.bases[2]&&of&&this.outs<2&&rng()<0.10){
        const r3=this.bases[2]; this.bases[2]=null;
        this.box[r3]&&(this.box[r3].cs=this.box[r3].cs);
        pl.outs++; this.outs++;
        this.assists=(this.assists||0)+1; this.assistBy=of.id;
        events.push({text:`${bat.name} 안타 — ${of.name} 홈 보살! 3루 주자 아웃`,cls:'sb'});
        if(this.outs<3){ adv(rng()<advOdds?2:1,true); this.bases[0]=bat.id; }
      } else {
        adv(rng()<advOdds?2:1,true);this.bases[0]=bat.id;
        events.push({text:`${bat.name} 안타`,cls:'hit'});
      }
    }
    else if(res.type==='2B'){bl.d2++;adv(2,true);this.bases[1]=bat.id;
      events.push({text:`${bat.name} 2루타`,cls:'hit'});
      this.hl('d2',off,bat.name,'');}
    else if(res.type==='3B'){bl.d3++;adv(3,true);this.bases[2]=bat.id;
      events.push({text:`${bat.name} 3루타`,cls:'hit'});
      this.hl('d3',off,bat.name,'');}
    else{bl.hr++;let c=1;for(let b=0;b<3;b++)if(this.bases[b]){score(this.bases[b],true);c++;this.bases[b]=null;}
      score(bat.id,true);bl.rbi+=c;
      const slam=(c===4);
      events.push({text:slam?`${bat.name} 만루홈런!! 4점`:`${bat.name} 홈런! ${c}점`,cls:'hr'});
      this.hl('hr',off,bat.name,slam?'만루홈런':(c>1?`${c}점 홈런`:'솔로 홈런'));
      if(slam) this.feats.push({kind:'만루홈런',pid:bat.id,us:!!off.isUser,
        detail:`${this.inning}회 ${this.half===0?'초':'말'}`});}
  }

  off.order++;
  // 내가 고른 선수가 주인공인 플레이는 표시를 달아 피드에서 강조한다
  const meP = this.myId ? (off.team.players.find(p=>p.id===this.myId)||def.team.players.find(p=>p.id===this.myId)) : null;
  const meName = meP ? meP.name : null;
  events.forEach(e=>{
    const mine = !!(meName && (e.text.indexOf(meName)===0 || e.text.indexOf('— '+meName)>=0));
    this.log.push({t:'play', me:mine, ...e});
    if(mine && (e.cls==='hr'||e.text.indexOf('3루타')>=0))
      this.log.push({t:'me',text:pickOne(['벤치가 뒤집어졌다','더그아웃에서 다 뛰어나왔다','오늘 주인공이다'])});
  });

  // 끝내기
  if(this.half===1 && this.inning>=this.INN && this.home.runs>this.away.runs){
    /* [버그 이력] 여기서 바로 finish() 로 빠져서 endHalf 를 안 거쳤다.
       그래서 끝내기로 낸 점수가 라인스코어에 통째로 안 찍혔다.
       R 은 12점인데 이닝을 더하면 8점이던 게 이것 때문이다.        */
    this.off().line.push(this.curIR||0);
    this.curIR=0;
    this.finish(); return {events, done:true};
  }
  if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
  return {events};
};

LiveGame.prototype.endHalf = function(){
  const off=this.off();
  off.line.push(this.curIR||0);
  this.curIR=0;
  this.outs=0; this.bases=[null,null,null];

  if(this.half===0){
    this.half=1;
    // 홈팀 리드 중 마지막 이닝 말 스킵
    if(this.inning>=this.INN && this.home.runs>this.away.runs){ this.home.line.push(null); this.finish(); return; }
    this.log.push({t:'inning',inning:this.inning,half:1,
      text:`${this.inning}회 말${this.inning>this.INN?' (연장)':''} · ${this.home.team.name} 공격`});
    this.checkPitcherChange(this.away);
    this.benchRotation();
  } else {
    // 이닝 종료
    const diff=Math.abs(this.away.runs-this.home.runs);
    if((this.inning>=4&&diff>=10)||(this.inning>=6&&diff>=7)){ this.mercy=true; this.finish(); return; }
    if(this.inning>=this.INN && this.away.runs!==this.home.runs){ this.finish(); return; }
    if(this.inning>=this.INN+3){ this.finish(); return; }
    this.inning++; this.half=0;
    this.log.push({t:'inning',inning:this.inning,half:0,
      text:`${this.inning}회 초${this.inning>this.INN?' (연장)':''} · ${this.away.team.name} 공격`});
    this.checkPitcherChange(this.home);
    this.benchRotation();          // 나온 사람은 한 번은 타석에 세운다
  }
};

/* 사회인야구는 나온 사람을 그냥 앉혀두지 않는다.
   경기 후반이 되면 벤치에서 기다린 사람을 한 번은 타석에 세운다.
   대신 잘 치고 있는 사람을 빼지는 않는다 — 그날 무안타인 사람과 바꾼다.
   (선발 투수는 건드리지 않는다)                                        */
LiveGame.prototype.benchRotation = function(){
  const us=this.userSide(); if(!us||!us.isUser) return;
  if(this.inning < Math.max(4, this.INN-2)) return;      // 5회부터
  if(this._benchDone==null) this._benchDone=0;
  if(this._benchDone>=3) return;                          // 한 경기 세 명까지
  const team=us.team;
  const inGame=new Set(us.slots.map(x=>x.id));
  const cand=(this.benchPool||[]).filter(id=>!inGame.has(id));
  if(!cand.length) return;

  // 그날 무안타인 야수 중에서 타수가 제일 많은 사람을 뺀다
  let outIdx=-1, outAb=0;
  us.slots.forEach((sl,i)=>{
    if(sl.pos==='P') return;                              // 투수는 안 뺀다
    const b=this.box[sl.id]; if(!b) return;
    if(b.h>0) return;                                     // 안타 친 사람은 그대로 둔다
    if(b.ab>=1 && b.ab>outAb){ outAb=b.ab; outIdx=i; }
  });
  if(outIdx<0) return;

  const pos=us.slots[outIdx].pos;
  const inId=cand.find(id=>{
    const f=(typeof posFit==='function')?posFit(id,pos):1;
    return pos==='DH'||f>0;
  }) || cand[0];
  if(!inId) return;
  const outId=us.slots[outIdx].id;
  const inP=team.players.find(p=>p.id===inId);
  if(!inP) return;

  us.slots[outIdx]={id:inId,pos};
  if(!this.box[inId]) this.box[inId]=newBoxL();
  this.noteSub(us,outIdx,inId,outId,pos,'교체');
  this._benchDone=(this._benchDone||0)+1;
  this.subs=this.subs||[];
  this.subs.push({in:inId,out:outId,pos,inning:this.inning});
  this.log.push({t:'sub',
    text:`교체 · ${this.nameOf(outId)}(${outAb}타수 무안타) → ${this.nameOf(inId)} (${POSNAMES[pos]||pos})`});
};
/* 교체로 들어온 사람을 그날 출전 명단에 남긴다. 타순(ord)은 그대로 물려받는다. */
LiveGame.prototype.noteSub = function(side, idx, inId, outId, pos, how){
  side.used = side.used || [];
  side.used.push({id:inId,pos,ord:idx,starter:false,inning:this.inning,how:how||'교체',forId:outId});
};

LiveGame.prototype.nameOf = function(id){
  const p=(this.home.team.players.concat(this.away.team.players)).find(x=>x.id===id);
  return p?p.name:'?';
};

LiveGame.prototype.finish = function(){
  if(this.over) return;
  this.over=true;
  // 부상 판정
  const us=this.userSide();
  if(this.rng()<0.085){
    const cands=us.slots.map(x=>us.team.players.find(p=>p.id===x.id)).filter(Boolean);
    const v=cands[(this.rng()*cands.length)|0];
    if(v) this.injuries.push({id:v.id, roll:this.rng()});
  }
  const tie=this.away.runs===this.home.runs;
  const awayWin=this.away.runs>this.home.runs;
  const win=awayWin?this.away:this.home, lose=awayWin?this.home:this.away;
  /* 끝내기 — 홈이 마지막 말 공격에서 뒤집어 이겼으면.
     그 이닝 득점을 빼면 이기고 있지 않았어야 한다. */
  if(!tie && !awayWin && this.half===1){
    const li=this.home.line.length-1;
    const last=li>=0?(this.home.line[li]||0):0;
    if(last>0 && (this.home.runs-last) <= this.away.runs){
      this.feats.push({kind:'끝내기',pid:null,us:!!this.home.isUser,
        detail:`${this.inning}회 말 · ${last}점`});
    }
  }
  this.result={
    away:{team:this.away.team,runs:this.away.runs,hits:this.away.hits,errs:this.away.errs,bbs:this.away.bbs,sbAllowed:this.away.sbAllowed,line:this.away.line,used:this.away.used||[],slots:this.away.slots,rot:this.away.rot},
    home:{team:this.home.team,runs:this.home.runs,hits:this.home.hits,errs:this.home.errs,bbs:this.home.bbs,sbAllowed:this.home.sbAllowed,line:this.home.line,used:this.home.used||[],slots:this.home.slots,rot:this.home.rot},
    box:this.box, pbox:this.pbox, log:this.log, tie,
    winner:tie?null:(awayWin?this.away.team.id:this.home.team.id),
    wp:tie?null:win.rot[0],
    lp:tie?null:lose.rot[Math.min(lose.pIdx,lose.rot.length-1)],
    innings:this.inning, mercy:this.mercy, injuries:this.injuries,
    dpCount:this.dpCount||0, assists:this.assists||0, assistBy:this.assistBy||null,
    wpCount:this.wp||0,          // 폭투 수. wp(승리투수 id)와 키가 겹치면 안 된다
    gojin:this.gojin,
    friction:this.friction,
    highlights:this.highlights,
    feats:this.feats||[],
  };
};

/* 전술 적용 */
LiveGame.prototype.pitcherOptions = function(){
  const s=this.userSide();
  return s.rot.slice(this.userSide().pIdx+1);
};
LiveGame.prototype.applyDecision = function(choice){
  const s=this.userSide();
  const p=this.pending;
  this.pending=null;
  this.lastDecPA=this.paSeq;          // 이 타석은 물어봤다
  if(p && p.kind==='pitcherChange'){
    if(choice==='change'){
      const old=this.curPitcher(p.side).name;
      p.side.pIdx++;
      this.log.push({t:'sub',text:`투수 교체 · ${old} → ${this.curPitcher(p.side).name}`});
    } else {
      this.log.push({t:'sub',text:`교체 없이 계속 간다`});
      p.side._stay=(p.side._stay||0)+1;
    }
    return;
  }
  /* ---- 수비 판단 ---- */
  if(choice==='pchange'){                      // 투수 교체는 작전 횟수를 안 먹는다
    if(!this.userPitcherChange()) this.log.push({t:'sub',text:'바꿀 투수가 없다'});
    return;
  }
  if(choice==='ibb'){ this.defTimeouts=Math.max(0,this.defTimeouts-1); this.intentionalWalk(); return; }
  if(choice==='shift'){ this.defTimeouts=Math.max(0,this.defTimeouts-1); this.setShift(true); return; }
  if(choice==='unshift'){ this.setShift(false); return; }
  if(choice==='defnone'){ this.defTimeouts=Math.max(0,this.defTimeouts-1); this.log.push({t:'sub',text:'그대로 간다'}); return; }

  /* ---- 공격 작전 ---- 전부 유효 타석 수가 붙는다 (무한 지속 버그 수정) */
  this.timeouts=Math.max(0,this.timeouts-1);
  if(choice==='bunt'){
    s.tac.bat='contact'; this._buntRun=false; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 번트 · 진루타 지시 (1타석)'});
  } else if(choice==='buntrun'){
    s.tac.bat='contact'; s.tac.run='aggressive'; this._buntRun=true;
    this.tacTTL.bat=1; this.tacTTL.run=1;
    this.log.push({t:'sub',text:'작전: 번트 앤 런 (1타석)'});
  } else if(choice==='steal'){
    s.tac.run='aggressive'; this.tacTTL.run=2;
    this.log.push({t:'sub',text:'작전: 적극 주루 지시 (2타석)'});
  } else if(choice==='patient'){
    s.tac.bat='patient'; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 공 많이 보기 (1타석)'});
  } else if(choice==='swing'){
    s.tac.bat='aggressive'; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 초구부터 적극 타격 (1타석)'});
  } else if(choice==='hold'){
    s.tac.run='hold'; this.tacTTL.run=2;
    this.log.push({t:'sub',text:'작전: 주루 자제 (2타석)'});
  } else if(choice==='normal'){
    s.tac.bat=s.tacBase.bat||'normal'; s.tac.run=s.tacBase.run||'normal';
    this.tacTTL.bat=0; this.tacTTL.run=0; this._buntRun=false;
    this.log.push({t:'sub',text:'작전: 지시 해제'});
  }
};

/* 유저가 직접 투수를 바꾼다 */
LiveGame.prototype.userPitcherChange = function(){
  const s=this.userSide();
  if(s.pIdx>=s.rot.length-1) return false;
  const old=this.curPitcher(s).name;
  s.pIdx++;
  const now=this.curPitcher(s).name;
  this.log.push({t:'sub',text: this.off().isUser
    ? `투수 교체 예고 · ${old} → ${now} (다음 수비부터)`
    : `투수 교체 · ${old} → ${now}`});
  return true;
};

/* 고의4구 — 한 타석을 그냥 내준다.
   볼넷이므로 공짜진루 지수(볼넷+도루허용+폭투)에 그대로 잡힌다.
   13경기 무예외로 14 이하면 승, 16 이상이면 패였다. 공짜로 주는 게 아니다. */
LiveGame.prototype.intentionalWalk = function(){
  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  if(!bat){ this.pending=null; return; }
  const bl=this.box[bat.id]=this.box[bat.id]||newBoxL();
  pl.bf++; bl.pa++; bl.bb++; pl.bb++; off.bbs++;
  if(this.bases[0]&&this.bases[1]&&this.bases[2]){       // 만루면 밀어내기 실점
    this.box[this.bases[2]].r++; off.runs++; this.curIR=(this.curIR||0)+1;
    pl.r++; pl.er++; bl.rbi++;
    this.bases[2]=this.bases[1]; this.bases[1]=this.bases[0];
    this.log.push({t:'play',cls:'score',text:`고의4구 밀어내기 · 1점`});
  }
  else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
  else if(this.bases[0]){this.bases[1]=this.bases[0];}
  this.bases[0]=bat.id;
  off.order++;
  this.log.push({t:'sub',text:`고의4구 · ${bat.name}을(를) 거른다`});
  this.pending=null;
  this.tickTactics(false);
};

/* =========================================================
   감독 액션 — FM 의 벤치 반응
   ---------------------------------------------------------
   물통 차기 · 박수 · 심판 어필 · 조용히 지켜보기.
   경기당 3번. 지금 지고 있냐 이기고 있냐에 따라 결과가 다르다.
   ========================================================= */
LiveGame.prototype.mgrAction = function(kind){
  if(this.mgr.left<=0) return {ok:false, text:'더 할 수 있는 게 없다'};
  const rng=this.rng;
  const us=this.userSide(), th=this.oppSide();
  const diff=us.runs-th.runs;
  this.mgr.left--;
  let text='', sub='', d=0;

  if(kind==='bottle'){
    // 물통 차기 — 지고 있을 때 효과가 크고, 이기고 있으면 역효과
    const good = diff<0 ? 0.62 : (diff===0?0.45:0.25);
    if(rng()<good){
      d=+0.06; this.mgr.boost=(this.mgr.boost||1)*1.06;
      text=pickOne(['감독이 물통을 걷어찼다','감독이 물통을 발로 날렸다','감독이 아이스박스를 쳤다'],rng);
      sub=pickOne(['벤치가 조용해지더니 눈빛이 달라졌다','선수들이 정신을 차렸다','더그아웃 공기가 팽팽해졌다'],rng);
    } else {
      d=-0.04; this.mgr.boost=(this.mgr.boost||1)*0.96;
      text=pickOne(['감독이 물통을 걷어찼다','감독이 헬멧 통을 밀어버렸다'],rng);
      sub=pickOne(['다들 눈치만 본다. 분위기가 더 굳었다','선수들이 위축됐다','심판이 이쪽을 쳐다본다'],rng);
    }
  }
  else if(kind==='clap'){
    d=+0.03; this.mgr.boost=(this.mgr.boost||1)*1.03;
    text=pickOne(['감독이 크게 박수를 친다','감독이 파이팅을 외쳤다','감독이 하나하나 손뼉을 마주쳤다'],rng);
    sub=pickOne(['벤치가 따라 소리를 낸다','분위기가 조금 올라왔다','타석 들어가는 선수 표정이 낫다'],rng);
  }
  else if(kind==='umpire'){
    // 심판 어필 — 판정이 유리해질 수도, 역효과일 수도
    const r=rng();
    if(r<0.40){
      d=+0.05; this.mgr.boost=(this.mgr.boost||1)*1.05;
      text='감독이 심판에게 스트라이크 존을 항의했다';
      sub='심판이 고개를 끄덕였다. 다음 타석부터 존이 조금 넓어진 느낌이다';
    } else if(r<0.80){
      text='감독이 심판에게 항의했다';
      sub='심판이 손을 저었다. 달라진 건 없다';
    } else {
      d=-0.05; this.mgr.boost=(this.mgr.boost||1)*0.95;
      this.mgr.warned=true;
      text='감독이 심판에게 강하게 항의했다';
      sub='경고를 받았다. 한 번 더 하면 퇴장이다';
    }
  }
  else { // watch
    this.mgr.left++;                       // 지켜보기는 횟수를 안 쓴다
    text='감독이 팔짱을 끼고 그라운드를 본다';
    sub='아무 말도 하지 않았다';
  }
  this.log.push({t:'mgr',text:text});
  this.log.push({t:'mgr',text:'— '+sub});
  this.mgr.log.push(kind);
  return {ok:true, text:text+' — '+sub, delta:d};
};

/* 수비 시프트 — 3타석 동안 유지되고 자동으로 풀린다 */
LiveGame.prototype.setShift = function(on){
  this.shiftTTL = on?3:0;
  this.log.push({t:'sub',text: on
    ? '수비 시프트 — 당겨치는 쪽으로 몰았다 (3타석)'
    : '수비 시프트 해제'});
};

/* 수비 위치 변경 */
LiveGame.prototype.swapPos = function(idxA, idxB){
  const s=this.userSide();
  const t=s.slots[idxA].pos; s.slots[idxA].pos=s.slots[idxB].pos; s.slots[idxB].pos=t;
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idxA)} ${POSNAMES[s.slots[idxA].pos]} / ${this.nameOfSlot(idxB)} ${POSNAMES[s.slots[idxB].pos]}`});
};
LiveGame.prototype.nameOfSlot = function(i){
  const s=this.userSide();
  const p=s.team.players.find(x=>x.id===s.slots[i].id);
  return p?p.name:'?';
};
LiveGame.prototype.movePos = function(idx, pos){
  const s=this.userSide();
  const other=s.slots.findIndex((x,i)=>i!==idx&&x.pos===pos);
  if(other>=0) s.slots[other].pos=s.slots[idx].pos;
  s.slots[idx].pos=pos;
  this.recalcDef();
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idx)} → ${POSNAMES[pos]}`});
};
LiveGame.prototype.recalcDef = function(){
  const s=this.userSide();
  const c=s.slots.find(x=>x.pos==='C');
  const cp=c?s.team.players.find(p=>p.id===c.id):null;
  s.cArm=(cp?cp.arm:45)-this.gearPenalty;
  if(typeof recalcTeamDefense==='function') recalcTeamDefense(s.team, s.slots, this.gearPenalty);
};

/* 대타 */
LiveGame.prototype.pinchHit = function(newId){
  const s=this.userSide();
  const idx=s.order%9;
  const oldId=s.slots[idx].id;
  const oldP=s.team.players.find(p=>p.id===oldId);
  const newP=s.team.players.find(p=>p.id===newId);
  s.slots[idx].id=newId;
  this.box[newId]=this.box[newId]||newBoxL();
  this.noteSub(s,idx,newId,oldId,s.slots[idx].pos,'대타');
  this.usedPH[oldId]=true;
  this.pending=null;
  this.log.push({t:'sub',text:`대타 · ${oldP.name} → ${newP.name}`});
};

  if(d>0) return `${d}일 ${h}시간 ${m}분`;

const POSNAMES = {C:'포수','1B':'1루','2B':'2루','3B':'3루',SS:'유격',LF:'좌익',CF:'중견',RF:'우익',DH:'지타',P:'투수'};
const ALLPOS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

let TEAMS=[], TBYID={}, ST=null, LIVE=null, playTimer=null, curView='home';

function avg(b){return b.ab?b.h/b.ab:0;}
function obp(b){return b.pa?(b.h+b.bb+b.hbp)/b.pa:0;}

/* ================= 내 선수 성장 =================
   내가 고른 선수는 한계가 따로 없다. 대신 그냥 오르지는 않는다.
   경기에 나가고, 훈련에 나가고, 실제로 붙잡고 있은 시간만큼만 열린다.
   바로 캐리하면 금방 질리니까 천천히, 대신 끝까지 간다.

   투자 1점당 잠재치 +0.06. 능력치 상한(80)까지 가려면 대략:
     한 시즌 개근(22경기 + 훈련 22회 + 플레이타임) = 약 40점 → +2.4
   즉 대여섯 시즌을 꾸준히 굴려야 리그 최상위에 닿는다.
   게다가 열린 잠재치를 실제 능력치로 바꾸려면 훈련을 또 몰아줘야 한다.
   플레이타임 점수는 경기·훈련 점수의 절반까지만 인정한다 — 켜두기만 해서는 크지 않는다.  */
const DEV_PER_GAME  = 1.0;    // 라인업에 들어 경기를 뛰면
const DEV_PER_TRAIN = 0.5;    // 훈련에 나오면
const DEV_PER_20MIN = 0.10;   // 실제로 붙잡고 있은 시간 20분마다
const DEV_TO_PA     = 0.06;   // 투자 1점 → 잠재치
const DEV_TIME_CAP  = 0.5;    // 플레이타임은 경기·훈련 점수의 이만큼까지만

function devSlot(){
  if(!ST.dev)ST.dev={pts:0,tpts:0,games:0,trains:0,minTick:0};
  if(ST.dev.tpts==null)ST.dev.tpts=0;
  return ST.dev;
}
/* 인정되는 플레이타임 점수 — 나간 만큼만 쳐준다 */
function devTimePts(d){
  if(!d)return 0;
  return Math.min(d.tpts||0, (d.pts||0)*DEV_TIME_CAP);
}
function devTotal(d){ return d ? (d.pts||0)+devTimePts(d) : 0; }
function devBonus(pid){
  if(pid!==(ST.playerId||MYID))return 0;
  const d=(ST&&ST.dev)?ST.dev:null;
  return d ? devTotal(d)*DEV_TO_PA : 0;
}
/* 경기·훈련·플레이타임을 투자 점수로 환산한다 */
function devEarn(kind){
  const d=devSlot();
  if(kind==='game'){ d.games++; d.pts+=DEV_PER_GAME; }
  else if(kind==='train'){ d.trains++; d.pts+=DEV_PER_TRAIN; }
}
/* 플레이타임은 20분 단위로 끊어서 따로 쌓고, 인정은 위 상한까지만 */
function devTickTime(){
  const d=devSlot();
  const ticks=Math.floor((ST.playSec||0)/1200);
  if(ticks>(d.minTick||0)){
    d.tpts=(d.tpts||0) + (ticks-(d.minTick||0))*DEV_PER_20MIN;
    d.minTick=ticks;
  }
}

function effCA(pid){const b=ST&&ST.ca?ST.ca[pid]:null; if(b!=null)return b;
  const p=TBYID['wwzw'].players.find(x=>x.id===pid); return p?calcCA(p):30;}
function effPA(pid){
  const p=TBYID['wwzw'].players.find(x=>x.id===pid); if(!p)return 40;
  return Math.min(80, calcPA(p,META[pid]) + devBonus(pid));
}
function condLabel(v){return v>=85?'최상':v>=70?'양호':v>=55?'보통':v>=40?'저하':'최악';}

}
/* 우리 팀·상대 팀 가리지 않고 투수 이름을 찾는다 (승패투수 표시용) */

/* ---------- 시즌 ---------- */
function newSeason(){

  const ps=initPlayerState();
  return {v:5,seed,round:0,schedule,stand,bat,pit,lgBat,lgPit,rest,

    tactics:{bat:'normal',run:'normal',hook:'normal'},
    budget:120,events:[],kakao:[],lastOrder:{},absent:{},weekDone:false,weekSeq:0,notices:[],injCount:0,
    trainFocus:'none',trainLog:[],seasonOver:false,mittMissing:false,scoutBlocked:false,
    fieldMod:{err:1,cond:0},signed:[],
    playerId:MYID, year:2026, seasonNo:1, discharged:false, justDischarged:false,
    useDH:true, park:'benamul', gearLevel:0, feud:null, pendingAbsent:{},
    unhappy:{}, spark:{}, career:{}, teamCareer:null, milestones:[], firsts:{}, weather:'clear',

    trainTarget:null, trainAttend:[], trainAttendKey:null,  // 집중 훈련
    mercs:[],                                              // 이번 경기 용병

    gear:{}, duesCount:0, gearMeeting:null, feeDue:false,  // 장비·회비
    drunkIds:[],
    bossTalk:null, bossTalkCount:0, bossTalkAt:-99, valuePrev:{},  // 감독 면담·몸값
    tutDone:false, tutStep:0,                              // 튜토리얼
    posTrain:{}, trainPos:null, trainStreak:0,             // 포지션 적응 훈련

    lastLineup:null, oppEvent:null, mystery:null, canParty:false, teamBuff:null,

function autoFixLineup(){
  if(!ST.lineup)return;
  const t=TBYID['wwzw'];
  const bad=ST.lineup.filter(s=>!isAvailable(s.id));
  if(!bad.length){ sanitizeRotation(); return; }
  const avail=t.players.filter(p=>isAvailable(p.id));
  if(avail.length>=9){
    const pool=avail.filter(p=>!ST.lineup.some(x=>x.id===p.id));
    bad.forEach(b=>{
      const i=ST.lineup.findIndex(x=>x.id===b.id);
      if(i<0)return;
      const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
      if(rep){ ST.lineup[i].id=rep.id; pool.splice(pool.indexOf(rep),1); }
    });
    // 포지션 적합도 재정리
    optimizePositions();
  }
  sanitizeRotation();
}

/* 라인업 인원 그대로 두고 포지션만 최적 배치 */
function optimizePositions(){
  const t=TBYID['wwzw'];
  const ids=ST.lineup.map(s=>s.id);
  const needP = !ST.useDH;
  const slots = needP ? ['P','C','1B','2B','3B','SS','LF','CF','RF']
                      : ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
  // 헝가리안 대신 탐욕: 적합도 높은 순으로 배정
  const pairs=[];
  ids.forEach(id=>slots.forEach(pos=>pairs.push({id,pos,v:pos==='DH'?30:posFit(id,pos)})));
  pairs.sort((a,b)=>b.v-a.v);
  const usedId=new Set(), usedPos=new Set(), assign={};
  pairs.forEach(p=>{
    if(p.v<=0)return;
    if(usedId.has(p.id)||usedPos.has(p.pos))return;
    assign[p.id]=p.pos; usedId.add(p.id); usedPos.add(p.pos);
  });
  // 남은 인원은 빈 자리에 강제 배치
  ids.forEach(id=>{
    if(assign[id])return;
    const free=slots.find(x=>!usedPos.has(x));
    if(free){assign[id]=free;usedPos.add(free);}
  });
  ST.lineup.forEach(s=>{ if(assign[s.id])s.pos=assign[s.id]; });
  syncStarter();
}

function recommendLineup(){
  const t=TBYID['wwzw'];
  const pool=t.players.filter(p=>isAvailable(p.id));
  const use=pool.length>=9?pool:t.players;
  const sc=p=>p.con*1.1+p.pow*0.9+p.eye*0.7+p.spd*0.5+(ST&&ST.cond?(ST.cond[p.id]-70)*0.25:0);
  const sorted=use.slice().sort((a,b)=>sc(b)-sc(a));
  const used=new Set(); const slots=[];
  const c=sorted.find(p=>p.pos.includes('C'));
  if(c){slots.push({id:c.id,pos:'C'});used.add('C');}
  for(const p of sorted){
    if(slots.length>=9)break;
    if(slots.some(s=>s.id===p.id))continue;
    const pos=p.pos.find(x=>x!=='P'&&!used.has(x))||ALLPOS.find(x=>!used.has(x));
    if(!pos)break; used.add(pos); slots.push({id:p.id,pos});
  }
  const byId=id=>t.players.find(p=>p.id===id);
  const pool2=slots.slice(); const order=[];
  const take=fn=>{let bi=0,bv=-1e9;pool2.forEach((s,i)=>{const v=fn(byId(s.id));if(v>bv){bv=v;bi=i;}});return pool2.splice(bi,1)[0];};
  order.push(take(p=>p.con*1.2+p.spd*1.4));
  order.push(take(p=>p.con*1.3+p.spd*1.0));
  order.push(take(p=>p.con*1.0+p.pow*1.2));
  order.push(take(p=>p.pow*1.6));
  order.push(take(p=>p.pow*1.2+p.con*0.7));
  while(pool2.length) order.push(take(p=>p.con+p.pow+p.eye*0.5));
  return order;
}
function buildPitcherPool(){
  // 사회인야구는 누구나 던진다. 포지션 등급 P를 기준으로 구위/제구/체력 산출
  const t=TBYID['wwzw'];
  t.pitchers = t.players.map(p=>{
    const m=META[p.id];
    const pf = m&&m.pos ? (m.pos['P']||25) : 25;
    if(p.pitch) return {id:p.id,name:p.name,stf:p.pitch.stf,ctl:p.pitch.ctl,sta:p.pitch.sta};
    return {id:p.id,name:p.name,
      stf:Math.round(clamp(pf*0.55+p.arm*0.45,18,75)),
      ctl:Math.round(clamp(pf*0.75+p.eye*0.25-8,15,70)),
      sta:Math.round(clamp(pf*0.6+22,22,62))};
  });
  return t.pitchers;
}
function recommendRotation(){
  const t=TBYID['wwzw'];
  buildPitcherPool();
  return t.pitchers.slice()
    .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
    .slice(0,6).map(p=>p.id);
}
function recalcTeamDefense(team, slots, gearPenalty){
  if(!team.isUser) return;
  let sum=0;
  slots.forEach(sl=>{
    const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const m=META[sl.id];
    const fit=posFit(sl.id, sl.pos);
    let penalty = fit<=0 ? 22 : Math.max(0,(45-fit)*0.55);
    if(m){
      /* 좁은 범위 — 내야에서 특히 손해 */
      if(m.traits.includes('좁은범위')&&['2B','3B','SS'].includes(sl.pos)) penalty+=9;
      /* 외야 미숙 */
      if(m.traits.includes('외야미숙')&&['LF','CF','RF'].includes(sl.pos)) penalty+=8;
    }
    sum += Math.max(15, p.def - penalty);
  });
  team._slotDef = sum/Math.max(1,slots.length);
  team._errMod = 1 + Math.max(0,(46-team._slotDef))*0.020 + (gearPenalty?0.05:0);
}

function aiLineup(team){
  const s=team.players.slice().sort((a,b)=>(b.con+b.pow+b.eye+b.spd*0.4)-(a.con+a.pow+a.eye+a.spd*0.4));
  const u=new Set(),o=[];
  for(const p of s){if(o.length>=9)break;const pos=p.pos.find(x=>!u.has(x))||ALLPOS.find(x=>!u.has(x));if(!pos)break;u.add(pos);o.push({id:p.id,pos});}
  // AI도 수비 배치에 따른 손실을 반영 (우리만 최적화 이득 보지 않게)
  let sum=0;
  o.forEach(sl=>{ const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const fit=(p.pos&&p.pos.indexOf(sl.pos)>=0)?50:32;
    sum+=Math.max(15,p.def-Math.max(0,(45-fit)*0.55)); });
  team._slotDef=sum/Math.max(1,o.length);
  return o;
}
function aiRotation(t){return t.pitchers.slice().sort((a,b)=>(b.stf+b.ctl+b.sta)-(a.stf+a.ctl+a.sta)).map(p=>p.id);}

/* ================= 세이브 압축 =================
   기기를 옮길 때 붙여넣는 코드가 너무 길었다(46KB).
   가변 폭 LZW 로 압축하고 base64 로 감싸서 1/5 로 줄인다.
   외부 라이브러리 없이 이 파일 안에서 다 돌아간다.
   예전에 뽑아둔 날것 JSON 코드도 그대로 불러올 수 있게 둘 다 받는다.   */
const SAVE_TAG = 'WWZW1:';
function packSave(str){
  const src=new TextEncoder().encode(str);
  const dict=new Map(); let next=256, width=9;
  let acc=0, accN=0; const outBytes=[];
  const push=(code)=>{
    acc=(acc<<width)|code; accN+=width;
    while(accN>=8){ accN-=8; outBytes.push((acc>>accN)&255); }
    acc&=(1<<accN)-1;
  };
  let w=-1;
  for(let i=0;i<src.length;i++){
    const c=src[i];
    if(w<0){ w=c; continue; }
    const k=w*256+c, hit=dict.get(k);
    if(hit!==undefined){ w=hit; continue; }
    push(w);
    if(next<65536){ dict.set(k,next++); if(next>(1<<width) && width<16) width++; }
    w=c;
  }
  if(w>=0) push(w);
  if(accN>0) outBytes.push((acc<<(8-accN))&255);
  const buf=Uint8Array.from(outBytes);
  let bin=''; const CH=0x8000;
  for(let i=0;i<buf.length;i+=CH) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+CH));
  return SAVE_TAG+btoa(bin);
}
function unpackSave(code){
  const b64=String(code).trim().slice(SAVE_TAG.length);
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const dict=[]; for(let i=0;i<256;i++) dict.push([i]);
  let width=9, acc=0, accN=0, bi=0;
  const read=()=>{
    while(accN<width){ if(bi>=bytes.length) return -1; acc=(acc<<8)|bytes[bi++]; accN+=8; }
    accN-=width; const v=(acc>>accN)&((1<<width)-1); acc&=(1<<accN)-1; return v;
  };
  const out=[];
  const c0=read(); if(c0<0) return '';
  let prev=dict[c0].slice();
  for(let j=0;j<prev.length;j++) out.push(prev[j]);
  for(;;){
    if(dict.length+1>(1<<width) && width<16) width++;
    const c=read(); if(c<0) break;
    let entry;
    if(c<dict.length) entry=dict[c];
    else if(c===dict.length) entry=prev.concat(prev[0]);
    else break;
    for(let j=0;j<entry.length;j++) out.push(entry[j]);
    if(dict.length<65536) dict.push(prev.concat(entry[0]));
    prev=entry;
  }
  return new TextDecoder().decode(Uint8Array.from(out));
}
/* 코드 문자열 → 세이브 객체. 압축본과 날것 JSON 둘 다 받는다. */
function decodeSave(txt){
  const t=String(txt||'').trim();
  if(!t) return null;
  try{
    if(t.slice(0,SAVE_TAG.length)===SAVE_TAG) return JSON.parse(unpackSave(t));
    return JSON.parse(t);
  }catch(e){ return null; }
}

/* ---------- 주간 ---------- */
function runWeek(){
  if(!ST.notices)ST.notices=[];
  ST.events=[];
  ST.weekSeq=(ST.weekSeq||0)+1;
  const rng=makeRng((ST.seed+ST.round*31337+ST.weekSeq*7717)>>>0);
  Object.keys(ST.injury).forEach(pid=>{
    const inj=ST.injury[pid]; if(!inj)return;
    inj.games--;
    if(inj.games<=0){ST.injury[pid]=null;
      ST.notices.push({type:'recover',title:`${nameOf(pid)} 복귀`,body:`${inj.name}에서 회복했다.`,effect:'출전 가능'});}
  });
  TBYID['wwzw'].players.forEach(p=>{
    const m=META[p.id];
    let rec=(m&&m.traits.includes('성실'))?11:7;
    if(m&&m.traits.includes('안방마님'))rec+=3;   // 궂은일을 해도 몸이 버틴다
    ST.cond[p.id]=Math.min(100,ST.cond[p.id]+rec+((rng()*7)|0)-3);
    ST.morale[p.id]=Math.max(10,Math.min(100,ST.morale[p.id]+(ST.morale[p.id]<70?2:-1)));
  });
  ST.mittMissing=false; ST.scoutBlocked=false;
  // 지난 경기 갈등으로 예고된 결장 반영
  const pend=ST.pendingAbsent||{};
  const evs=rollWeekEvents(ST,rng);
  if(evs.some(e=>e.type==='discharge')) ST.justDischarged=true;
  ST.gameDate=(ST.calendar&&ST.calendar.label)||'';
  Object.keys(pend).forEach(id=>{
    if(ST.injury[id])return;
    evs.push({type:'absent',pid:id,title:`${nameOf(id)} 결장`,
      body:`${nameOf(id)}이(가) ${pend[id]} 안 나온다고 한다.`,effect:'이번 경기 출전 불가'});
  });
  ST.pendingAbsent={};
  const carried=(ST.notices||[]).slice();
  ST.notices=[];
  ST.events=carried.concat(evs);
  const rained=applyWeekEvents(ST,evs);
  // 결장자가 라인업에 있으면 자동 교체
  autoFixLineup();
  ST.kakao=[]; ST.kakaoPost=[]; ST.partyDone=false; ST.weekDone=true;
  ST.sentPre=false; ST.sentPost=false; ST.teamBuff=null; ST.canParty=false; ST.dropouts=[]; ST.lineupDirty=false;
  ST.announced=false;      // 라인업을 단톡방에 올려야 경기로 넘어간다
  const anId=TBYID['wwzw'].players.find(p=>META[p.id]&&META[p.id].traits.includes('분석가'));
  const anUn=anId?((ST.unhappy&&ST.unhappy[anId.id])?ST.unhappy[anId.id].level:0):9;
  ST.oppEvent = (anId&&isAvailable(anId.id)&&anUn<3&&!ST.scoutBlocked)
    ? rollOppEvent(ST,rng,TBYID[ST.schedule[ST.round].opp]) : null;
  ST.park=(ST.schedule[ST.round]||{}).park||'benamul';
  // 주중 훈련일 날씨는 경기날과 별개로 굴린다
  ST.trainRain = rng()<0.24;
  ST.trainPush = false;
  return rained;
}
