<script>
/* =========================================================
   이벤트 · 카톡 시스템 v4
   ========================================================= */
'use strict';

function pickOne(arr,rng){ return arr[(((rng||Math.random)())*arr.length)|0]; }
function uniqPush(msgs,m){
  if(msgs.some(x=>x.who===m.who&&x.text===m.text))return;
  msgs.push(m);
}

/* ================= 주간 이벤트 ================= */
function rollWeekEvents(ST, rng){
  const evts=[];
  const us=TBYID['wwzw'];
  const alive=us.players.filter(p=>!ST.injury[p.id]);
  ST.calendar=holidayFor(ST.round, ST.year||2026);

  /* 학생 야구부 대관으로 구장 사용 불가 */
  if(rng()<0.06){
    evts.push({type:'postpone',title:'구장 대관 취소',
      body:'중고등학교 야구부가 구장을 쓰게 되어 우리 경기가 밀렸다.',
      effect:'경기 연기 · 전원 컨디션 +5'});
    return evts;
  }
  if(rng()<0.10){
    evts.push({type:'rain',title:'우천 취소',
      body:'아침부터 비가 쏟아졌다. 그라운드 사정으로 경기가 순연됐다.',
      effect:'전원 컨디션 +8 · 투수 휴식 +1'});
    return evts;
  }

  /* 날씨 */
  const wx=rollWeather(rng, (ST.calendar&&ST.calendar.month)||5);
  ST.weather=wx.id;
  if(wx.cancel && rng()<wx.cancel){
    evts.push({type:'rain',title:wx.name+'으로 경기 취소',
      body:wx.desc+' 결국 경기가 순연됐다.',
      effect:'전원 컨디션 +8 · 투수 휴식 +1'});
    return evts;
  }
  if(wx.id!=='clear'){
    evts.push({type:'weather',title:`날씨 · ${wx.name}`,body:wx.desc,
      effect:`컨디션 ${wx.cond} · 실책 ${Math.round(wx.err*100-100)>0?'+':''}${Math.round(wx.err*100-100)}%`});
  }
  if(wx.risk==='탈수'&&rng()<0.30&&alive.length){
    const v=pickOne(alive,rng);
    evts.push({type:'dehydrate',pid:v.id,title:`${v.name} 탈수 증세`,
      body:`${v.name}이(가) 몸을 풀다 어지럽다고 했다.`,effect:'컨디션 대폭 하락'});
  }

  /* 기념일 — 김선우 장교 */
  const cal=ST.calendar;
  /* 김선우는 장교다. 나라 기념일이면 각을 잡고 나온다.
     삼일절·현충일·광복절·국군의 날 전부 해당한다.                    */
  if(cal.holiday==='삼일절'||cal.holiday==='광복절'
     ||cal.holiday==='현충일'||cal.holiday==='국군의 날'){
    if(isAvailable('ksw')){
      const KSW_LINE={
        '삼일절':['김선우가 태극기를 챙겨 왔다. "오늘은 의미가 다릅니다."', 1.30],
        '현충일':['김선우가 조용히 묵념부터 했다. "오늘은 진지하게 하겠습니다."', 1.26],
        '광복절':['김선우가 각 잡고 나타났다. "오늘은 좀 다릅니다."', 1.32],
        '국군의 날':['김선우가 군복 티셔츠를 입고 왔다. "오늘은 제 날입니다."', 1.36],
      };
      const L=KSW_LINE[cal.holiday]||['김선우가 각 잡고 나타났다.',1.30];
      evts.push({type:'holiday',pid:'ksw',title:`${cal.holiday} · 김선우 각성`,
        body:L[0], pow:L[1],
        effect:`김선우 파워 +${Math.round((L[1]-1)*100)}% · 팀 사기 상승`});
    } else evts.push({type:'holiday',title:cal.holiday,body:`${cal.holiday}이다.`,effect:'—'});
  }

  /* 음주 — 금주자 외 전원 랜덤 */
  const drunk=[], clubbed=[];
  alive.forEach(p=>{
    const m=META[p.id]; if(!m)return;
    if(m.traits.includes('금주'))return;          // 김선우·권혁준
    if(rng()<0.16){
      const clubP = p.id==='kig' ? 0.35 : 0.006;   // 김인규만 클럽 자주 간다
      if(rng()<clubP) clubbed.push(p.id);
      else drunk.push(p.id);
    }
  });
  if(clubbed.length){
    evts.push({type:'club',ids:clubbed,title:`${clubbed.map(nameOf).join(', ')} 클럽`,
      body:`${clubbed.map(nameOf).join(', ')}이(가) 새벽까지 클럽에 있었다. 잠을 못 자고 왔다.`,
      effect:'컨디션 대폭 하락 · 사기 소폭 상승'});
  }
  if(drunk.length>=4){
    evts.push({type:'party',ids:drunk,title:'전날 팀 회식',
      body:`${drunk.map(nameOf).join(', ')}이(가) 끝까지 남았다는 목격담이 있다.`,
      effect:'컨디션 하락 · 팀 사기 +4'});
  } else if(drunk.length){
    evts.push({type:'drink',ids:drunk,title:'전날 음주',
      body:`${drunk.map(nameOf).join(', ')}이(가) 어제 한잔했다고 한다.`,effect:'컨디션 하락'});
  }

  /* 음주 사고 */
  if((drunk.length+clubbed.length)>=2&&rng()<0.22){
    const pool=drunk.concat(clubbed);
    const a=pickOne(pool,rng);
    const drivers=us.players.filter(p=>META[p.id]&&META[p.id].car&&p.id!==a);
    if(drivers.length){
      const b=pickOne(drivers,rng).id;
      evts.push({type:'incident',ids:[a,b],title:'음주 사고',
        body:`${nameOf(a)}이(가) ${nameOf(b)} 차에서 토했다. 단톡방이 시끄럽다.`,
        effect:`${nameOf(a)}·${nameOf(b)} 컨디션·사기 하락`});
    }
  }

  /* 친구의 술 약속 — 플레이어에게 직접 오는 연락이다.
     수락하면 우정과 사기가 오르지만 다음 경기 컨디션이 깎인다.       */
  const meId=ST.playerId||'ksh';
  const meM=META[meId];
  if(meM && rng()<0.09){
    const pals=(meM.friends||[]).filter(f=>{
      const fm=META[f];
      return fm && !fm.traits.includes('금주') && us.players.some(p=>p.id===f)
        && !ST.injury[f] && !evts.some(e=>e.type==='absent'&&e.pid===f);
    });
    if(pals.length){
      const f=pickOne(pals,rng);
      evts.push({type:'drinkinvite',pid:f,title:`${nameOf(f)}에게서 연락`,
        body:sayTo(f,meId,...pickOne(DRINK_INVITE,rng)),
        effect:'수락 · 거절을 골라야 한다'});
    }
  }

  /* 축구 언해피 — 형제(김인규·김한규)가 야구보다 축구에 마음이 가 있다.
     개막하자마자 이 소리를 하면 아무 맥락이 없다. 3차전부터 나오게 막아두고,
     나와도 그 자리에서 불만이 되지는 않는다. 불씨로만 남았다가
     벤치·하위타순·대패 같은 게 겹치는 날 터진다.                         */
  if((ST.round||0)>=2){
    ['kig','khg'].forEach(pid=>{
      if(!us.players.some(p=>p.id===pid))return;
      if(ST.injury[pid])return;
      if(evts.some(e=>e.type==='soccer'))return;
      const mm=META[pid]||{traits:[]};
      let pr=(mm.traits||[]).includes('불만러')?0.055:0.032;
      const mo=(ST.morale&&ST.morale[pid]!=null)?ST.morale[pid]:70;
      if(mo>=78)pr*=0.35;          // 팀이 잘 굴러가면 축구 생각이 안 난다
      else if(mo<50)pr*=1.7;       // 재미가 없으면 딴 데로 눈이 간다
      if(rng()<pr){
        evts.push({type:'soccer',pid,title:`${nameOf(pid)} 축구`,
          body:sayTo(pid,ST.playerId||'ksh',...pickOne(SOCCER_LINES,rng)),
          effect:'사기 하락 · 불만 불씨 누적 (당장 불만 단계가 오르지는 않는다)'});
      }
    });
  }

  /* 타팀 영입 제안 — 잘하는데 대우를 못 받는 선수에게 온다 */
  if(rng()<0.06){
    const cands=us.players.filter(p=>{
      if(!us.players.some(q=>q.id===p.id))return false;
      if(ST.injury[p.id])return false;
      if(ST.promise&&ST.promise[p.id])return false;        // 이미 약속한 선수는 빼준다
      const un=(ST.unhappy&&ST.unhappy[p.id])?ST.unhappy[p.id].level:0;
      const bond=(ST.bond&&ST.bond[p.id]!=null)?ST.bond[p.id]:50;
      return effCA(p.id)>=34 && (un>=1 || bond<45);
    });
    if(cands.length){
      const v=pickOne(cands,rng);
      const orderMax=3+((rng()*3)|0);                       // 1~5번 중 보장 요구
      evts.push({type:'poach',pid:v.id,orderMax:Math.min(5,orderMax),
        title:`${v.name} 타팀 영입 제안`,
        body:sayTo(v.id,ST.playerId||'ksh',...pickOne(POACH_LINES,rng)),
        effect:`${Math.min(5,orderMax)}번 타순 이상 보장을 요구한다`});
    }
  }

  /* 김준희 농구 */
  if(isAvailable('kjh')&&rng()<0.18){
    evts.push({type:'basket',pid:'kjh',title:'김준희 농구하고 옴',
      body:'김준희가 오전에 농구를 하고 왔다. 몸이 이미 풀려 있다.',
      effect:'주루 상승 · 체력 소모'});
  }

  /* 개인 사정 */
  const REASON_CAR=['차가 고장났다'];
  const REASON_COMMON=['가족 여행이 잡혔다','여자친구랑 약속이 있다','회사에 일이 생겼다',
    '결혼식 사회를 봐야 한다','장염에 걸렸다','전날 회식이 늦게 끝났다','몸살이 났다',
    '이사를 해야 한다','친구 결혼식에 간다'];
  const REASON_KSW=['부대에 일이 생겼다','당직 근무가 잡혔다','훈련 일정이 잡혔다',
    '휴가가 안 나왔다','비상소집이 걸렸다'];
  const reasonFor=(pid)=>{
    if(pid==='ksw') return pickOne(REASON_KSW,rng);
    const m2=META[pid];
    const pool = (m2&&m2.car) ? REASON_COMMON.concat(REASON_CAR) : REASON_COMMON;
    return pickOne(pool,rng);
  };
  alive.forEach(p=>{
    const m=META[p.id];
    const att = m&&m.attend!=null ? m.attend : 0.85;
    const missP = Math.max(0.02, Math.min(0.34, (1-att)*0.48));
    if(rng()<missP){
      evts.push({type:'absent',pid:p.id,title:`${p.name} 결장`,
        body:`${p.name}이(가) ${reasonFor(p.id)}고 한다.`,effect:'출전 불가'});
    }
  });

  /* 포수 장비 */
  const gm=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('장비담당'));
  if(gm){
    const out=ST.injury[gm.id]||evts.some(e=>e.type==='absent'&&e.pid===gm.id);
    if(out)evts.push({type:'gear',title:'포수 장비 없음',
      body:`포수 장비는 ${gm.name}이(가) 챙겨 오는데 오늘 못 나온다.`,
      effect:'포수 수비 대폭 하락 · 도루 저지 불가'});
    else if(rng()<0.06)evts.push({type:'gear',title:'포수 장비 일부 누락',
      body:`${gm.name}이(가) 레그가드를 빼놓고 왔다.`,effect:'포수 수비 하락'});
  }
  if(rng()<0.035&&isAvailable('yjh')&&!evts.some(e=>e.type==='absent'&&e.pid==='yjh')){
    evts.push({type:'mitt',pid:'yjh',title:'유지효 미트 미지참',
      body:'유지효가 1루 미트를 집에 두고 왔다.',effect:'유지효 수비 하락'});
  }

  /* 배차 — 결장자 반영 (임시 적용해서 판정) */
  const tmpAbsent={};
  evts.filter(x=>x.type==='absent').forEach(x=>tmpAbsent[x.pid]=1);
  const savedAbsent=ST.absent; ST.absent=Object.assign({},savedAbsent||{},tmpAbsent);
  const cp=resolveCarpool(ST);
  ST.absent=savedAbsent;
  ST.carpool=cp;
  const swapped=cp.rides.filter(r=>r.replaced);
  if(swapped.length){
    evts.push({type:'carswap',title:'배차 변경',
      body:swapped.map(r=>`${nameOf(r.origin)}이(가) 못 나와서 ${nameOf(r.driver)}이(가) 대신 태우고 온다.`).join(' '),
      effect:'이동에는 문제 없다'});
  }
  if(cp.stranded.length){
    evts.push({type:'car',ids:cp.stranded,title:'배차 부족',
      body:`${cp.stranded.map(nameOf).join(', ')}이(가) 탈 차가 없다. 대중교통으로 겨우 왔다.`,
      effect:'해당 선수 컨디션 하락'});
  }

  /* 전역 복귀 */
  if(ST.round===0){
    const dc=checkDischarge(ST);
    if(dc){ evts.push(dc); us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+8)); }
  }

  /* 이적 요구 */
  us.players.forEach(p=>{
    const u=ST.unhappy&&ST.unhappy[p.id];
    if(u&&u.level>=3&&rng()<0.30){
      evts.push({type:'transfer',pid:p.id,title:`${p.name} 이적 문의`,
        body:`${p.name}이(가) 다른 팀에서 연락이 왔다고 한다.`,effect:'면담이 필요하다'});
    }
  });

  return evts;
}

function applyWeekEvents(ST,evts){
  const us=TBYID['wwzw'];
  ST.absent={}; ST.fieldMod={err:1,cond:0}; ST.gearLevel=0; ST.mittMissing=false;
  ST.drunkIds=[];      // 전날 마신 사람들 — 경기 중 사고 확률에 쓴다
  ST.buff={}; ST.transferReq=null; ST.drinkInvite=null; ST.poach=null;
  let rained=false;
  const wx=WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0];
  ST.fieldMod.err*=wx.err;

  evts.forEach(e=>{
    switch(e.type){
      case 'postpone':
      case 'rain':
        rained=true;
        us.players.forEach(p=>ST.cond[p.id]=Math.min(100,ST.cond[p.id]+8));
        Object.keys(ST.rest).forEach(k=>ST.rest[k]=Math.min(4,ST.rest[k]+1));
        break;
      case 'weather':
        us.players.forEach(p=>ST.cond[p.id]=Math.max(20,ST.cond[p.id]+wx.cond));
        break;
      case 'party': case 'drink':
        (e.ids||[]).forEach(id=>{ if(ST.drunkIds.indexOf(id)<0)ST.drunkIds.push(id); });
        (e.ids||[]).forEach(id=>{
          const d=META[id]?META[id].drink:1;
          ST.cond[id]=Math.max(22,ST.cond[id]-(d>=3?20+((Math.random()*14)|0):d===2?11:5));
        });
        if(e.type==='party')us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+4));
        break;
      case 'club':
        (e.ids||[]).forEach(id=>{ if(ST.drunkIds.indexOf(id)<0)ST.drunkIds.push(id); });
        (e.ids||[]).forEach(id=>{ ST.cond[id]=Math.max(18,ST.cond[id]-34);
          ST.morale[id]=Math.min(100,ST.morale[id]+6); });
        break;
      case 'incident':
        (e.ids||[]).forEach(id=>{ ST.cond[id]=Math.max(18,ST.cond[id]-14);
          ST.morale[id]=Math.max(12,ST.morale[id]-16); });
        us.players.forEach(p=>ST.morale[p.id]=Math.max(12,ST.morale[p.id]-2));
        break;
      case 'dehydrate': ST.cond[e.pid]=Math.max(18,ST.cond[e.pid]-26); break;
      case 'holiday':
        if(e.pid){ ST.buff[e.pid]={pow:e.pow||1.30,label:'각성'};
          us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+3)); }
        break;
      case 'basket':
        ST.buff[e.pid]={spd:1.18,label:'몸 풀림'};
        ST.cond[e.pid]=Math.max(30,ST.cond[e.pid]-6);
        break;
      case 'absent': ST.absent[e.pid]='개인 사정'; break;
      case 'gear': ST.gearLevel=e.title.includes('없음')?2:1; break;
      case 'mitt': ST.mittMissing=true; break;
      case 'car':
        (e.ids||[]).forEach(id=>ST.cond[id]=Math.max(22,ST.cond[id]-11));
        break;
      case 'transfer': ST.transferReq=e.pid; break;
      case 'drinkinvite': ST.drinkInvite={pid:e.pid,line:e.body}; break;
      case 'poach': ST.poach={pid:e.pid,orderMax:e.orderMax,line:e.body}; break;
      case 'soccer':
        // 축구가 더 재밌다는 소리는 야구 의욕이 떨어졌다는 뜻이다.
        // 다만 이 한마디로 불만 단계를 올리지는 않는다. 불씨로만 남긴다.
        ST.morale[e.pid]=Math.max(10,(ST.morale[e.pid]||70)-6);
        addSpark(ST,e.pid,'축구',1);
        break;
    }
  });
  return rained;
}

/* ================= 친분 연쇄 ================= */
function applyFriendship(ST){
  // 친분은 사기에만 조용히 작용한다. 남 결장에 대해 단톡에서 떠들지 않는다.
  const us=TBYID['wwzw'];
  const inL=new Set(ST.lineup.map(s=>s.id));
  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||!m.friends||!m.friends.length)return;
    if(!inL.has(p.id))return;
    const benched=m.friends.filter(f=>{
      const fp=us.players.find(x=>x.id===f);
      return fp && !inL.has(f) && isAvailable(f);
    }).length;
    const absent=m.friends.filter(f=>ST.absent&&ST.absent[f]).length;
    const together=m.friends.filter(f=>inL.has(f)).length;
    if(benched>=2) ST.morale[p.id]=Math.max(10,ST.morale[p.id]-3);
    if(absent>=2) ST.morale[p.id]=Math.max(10,ST.morale[p.id]-2);
    if(together>=2) ST.morale[p.id]=Math.min(100,ST.morale[p.id]+2);
  });
  return [];
}

/* ================= 불씨 =================
   불만은 한 번에 터지지 않는다. 축구 얘기 한 번 했다고 바로 이적 요구를 하지는 않는다.
   축구·벤치·하위타순·대패 같은 게 '불씨'로 조용히 쌓이다가,
   정작 마음에 안 드는 일이 또 생기는 날 한꺼번에 터진다.
   그래서 축구 이벤트는 불씨만 남기고, 터지는 판정은 경기가 끝난 뒤에 한다.       */
const SPARK_LABEL={축구:'축구',벤치:'벤치',하위타순:'하위 타순',대패:'대패'};
function addSpark(ST,pid,why,amt){
  if(!ST.spark)ST.spark={};
  const sp=ST.spark[pid]||(ST.spark[pid]={n:0,why:[]});
  sp.n=Math.min(6,sp.n+(amt==null?1:amt));
  if(why){
    const i=sp.why.indexOf(why); if(i>=0)sp.why.splice(i,1);
    sp.why.push(why); if(sp.why.length>3)sp.why=sp.why.slice(-3);
  }
  return sp;
}
function sparkOf(ST,pid){
  return (ST&&ST.spark&&ST.spark[pid])?ST.spark[pid]:{n:0,why:[]};
}
/* 몇 개까지 참느냐. 불만러는 빨리 터지고, 성실한 쪽은 오래 참는다. */
function sparkFuse(pid){
  const m=META[pid]||{traits:[]};
  const tr=m.traits||[];
  if(tr.includes('불만러'))return 3;
  if(tr.includes('성실'))return 5;
  return 4;
}
function sparkLabel(sp){
  if(!sp||!sp.n)return '';
  return sp.why.map(w=>SPARK_LABEL[w]||w).join(' · ');
}

/* ================= 언해피 =================
   반환값은 단톡방에 올릴 메시지다. 경기 결과 처리 쪽에서 카톡에 붙인다.       */
function updateUnhappy(ST, uSlots, ctx){
  if(!ST.unhappy)ST.unhappy={};
  if(!ST.spark)ST.spark={};
  ctx=ctx||{};
  const msgs=[];
  const meId=ST.playerId||'ksh';
  const order={}; uSlots.forEach((s,i)=>order[s.id]=i+1);
  TBYID['wwzw'].players.forEach(p=>{
    const m=META[p.id]; if(!m)return;
    if(typeof isMerc==='function'&&isMerc(p.id))return;
    const played=uSlots.some(s=>s.id===p.id);
    const u=ST.unhappy[p.id]||{level:0,streak:0};
    const sp=ST.spark[p.id]||{n:0,why:[]};

    /* 오늘 마음에 안 들었던 것 — 하나만 잡는다 */
    let gripe=null;
    if(!played && !ST.injury[p.id] && !(ST.absent&&ST.absent[p.id])) gripe='벤치';
    else if(played && order[p.id]>=7 && effCA(p.id)>=45) gripe='하위타순';
    else if(played && ctx.blowout && sp.n>=1) gripe='대패';   // 대패는 이미 쌓인 게 있는 사람만 건드린다

    /* 연속 결장 누적 — 불씨와 별개로 도는 원래 규칙.
       불씨 쪽에서 터지는 길이 생겼으니 이쪽은 한 박자 느리게 잡는다. */
    if(played||ST.injury[p.id]){ u.streak=0; if(u.level>0&&Math.random()<0.4)u.level--; }
    else {
      u.streak++;
      const th=m.traits.includes('불만러')?3:(m.born>=2000?4:5);
      if(u.streak>=th){ u.level=Math.min(4,u.level+1); u.streak=0; }
    }

    if(gripe){
      sp.n=Math.min(6,sp.n+1);
      const i=sp.why.indexOf(gripe); if(i>=0)sp.why.splice(i,1);
      sp.why.push(gripe); if(sp.why.length>3)sp.why=sp.why.slice(-3);
    } else if(sp.n>0 && played && Math.random()<0.4){
      sp.n--;                                     // 제대로 쓰이면 조용히 가라앉는다
      if(sp.n<=0)sp.why=[];
    }

    const fuse=sparkFuse(p.id);
    if(gripe && sp.n>=fuse){
      /* 터진다 */
      const jump=sp.n>=fuse+2?2:1;
      u.level=Math.min(4,u.level+jump);
      ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-12);
      const pool=BLOWUP_LINES[gripe]||BLOWUP_LINES['벤치'];
      const pair=pickOne(pool);
      msgs.push({who:p.id,type:'talk',text:sayTo(p.id,meId,pair[0],pair[1]),mood:'angry'});
      msgs.push({who:p.id,type:'notice',
        text:`${p.name} 불만 폭발 — ${unhappyLabel(u.level)}\n쌓여 있던 것: ${sparkLabel(sp)||'—'}`});
      sp.n=0; sp.why=[];
    } else if(gripe && sp.n>=2 && Math.random()<0.45){
      /* 아직 참는 중 — 한마디만 흘린다 */
      const pool=GRUMBLE_LINES[gripe]||GRUMBLE_LINES['벤치'];
      const pair=pickOne(pool);
      msgs.push({who:p.id,type:'talk',text:sayTo(p.id,meId,pair[0],pair[1]),mood:'flat'});
    }

    ST.unhappy[p.id]=u; ST.spark[p.id]=sp;
  });
  return msgs;
}
function unhappyLabel(l){ return ['정상','약간 불만','불만','강한 불만','이적 요구'][Math.min(4,l||0)]; }

        pickOne(['평소대로 가겠습니다','시간 맞춰 가겠습니다','출발하겠습니다'],rng)),mood:'ok'});
    }
  });
  (cp2.stranded||[]).forEach(id=>{
    uniqPush(msgs,{who:id,text:say(id,'나 오늘 차 없는데 누가 좀 태워줘라','저 오늘 차가 없는데 태워주실 분 있나요'),mood:'sad'});
  });

  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||!isAvailable(p.id))return;
    const i=idx(p.id);
    const prev=ST.lastOrder?ST.lastOrder[p.id]:null;
    const jon=speechOf(p.id)==='jon';
    const un=(ST.unhappy&&ST.unhappy[p.id])?ST.unhappy[p.id].level:0;

    if(i<0){
      if(m.traits.includes('불만러')){
        uniqPush(msgs,{who:p.id,text:pickOne([
          '또 벤치네 ㅋ 알겠다','내가 뭘 잘못했는지 모르겠는데','이럴 거면 왜 부르냐',
          '분석은 내가 다 하는데','ㅇㅋ 구경이나 할게','언제까지 이럴 거냐'],rng),mood:'angry'});
        ST.morale[p.id]=Math.max(15,ST.morale[p.id]-12);
      } else if(un>=2){
        uniqPush(msgs,{who:p.id,text:jon?pickOne(['저는 계속 벤치인가요?','언제쯤 나갈 수 있을까요'],rng)
          :pickOne(['나 계속 벤치냐','언제 나가냐 진짜'],rng),mood:'angry'});
        ST.morale[p.id]=Math.max(15,ST.morale[p.id]-9);
      } else if(rng()< (m.traits.includes('과묵')?0.06:0.32)){
        uniqPush(msgs,{who:p.id,text:jon
          ?pickOne(['넵 준비하고 있겠습니다','대기하겠습니다','언제든 말씀하세요','넵 벤치에 있겠습니다'],rng)
          :pickOne(['ㅇㅋ 대기할게','알겠다','부르면 나간다','벤치냐 ㅋㅋ 알겠다'],rng),mood:'flat'});
        ST.morale[p.id]=Math.max(20,ST.morale[p.id]-4);
      }
      return;
    }
    const drop=prev!=null?i-prev:0;
    if(drop>=3){
      if(m.traits.includes('불만러')){
        uniqPush(msgs,{who:p.id,text:`왜 나 ${i+1}번임? 저번엔 ${prev+1}번이었는데`,mood:'angry'});
        ST.morale[p.id]=Math.max(15,ST.morale[p.id]-15);
      } else if(rng()<0.55){
        uniqPush(msgs,{who:p.id,text:jon
          ?pickOne([`${i+1}번이요? 알겠습니다...`,'제가 요즘 안 맞긴 했죠','더 잘하겠습니다','넵...'],rng)
          :pickOne([`나 ${i+1}번이야? ㅋㅋ 알겠다`,'요즘 안 맞긴 하지','뭐 알겠다','ㅋㅋ ㅇㅋ'],rng),mood:'flat'});
        ST.morale[p.id]=Math.max(20,ST.morale[p.id]-(jon?8:5));
      }
    } else if(drop<=-3){
      uniqPush(msgs,{who:p.id,text:say(p.id,`${i+1}번 고맙다 잘해볼게`,`${i+1}번 감사합니다 잘해보겠습니다`),mood:'happy'});
      ST.morale[p.id]=Math.min(100,ST.morale[p.id]+8);
    } else if(ST.cond[p.id]<45){
      const LOWB=['컨디션이 좀 별론데 나갈게','몸이 좀 무겁다','어제 잠을 못 잤다',
        '오늘 살살 하자','일단 나가보고 안 되면 빼줘','허리가 좀 뻐근하네'];
      const LOWJ=['컨디션이 좀 안 좋은데 나가겠습니다','몸이 좀 무겁습니다','어제 잠을 못 잤습니다',
        '일단 나가보겠습니다','안 되면 빼주세요','몸이 덜 풀렸습니다'];
      uniqPush(msgs,{who:p.id,text:pickOne(jon?LOWJ:LOWB,rng),mood:'flat'});
    } else if(rng()< (m.traits.includes('과묵')?0.04:0.20)){
      const BAN=['ㅇㅋ','오늘 이기자','늦지들 마라','ㄱㄱ','ㅇㅇ','간다','몇 시까지지',
        '오늘 날씨 좋네','그라운드 상태 어떻냐','배트 하나 빌려줄 사람','스파이크 챙겼나',
        '오늘 심판 누구냐','물 좀 사갈게','ㅇㅋㅇㅋ'];
      const JON=['넵','알겠습니다','오늘 잘해보겠습니다','ㅇㅋ입니다','넵 가겠습니다',
        '몇 시까지 가면 되나요','오늘 잘 부탁드립니다','일찍 가서 몸 풀겠습니다',
        '물 좀 사가겠습니다','배트 빌릴 수 있을까요','넵넵'];
      uniqPush(msgs,{who:p.id,text:pickOne(jon?JON:BAN,rng),mood:'ok'});
    }
  });

  if(ST.justDischarged){
    uniqPush(msgs,{who:'sjm',text:'전역했습니다. 다시 잘 부탁드립니다',mood:'happy'});
    uniqPush(msgs,{who:'swm',text:'왔냐 ㅋㅋ 이제 좀 쉬겠네',mood:'happy'});
    uniqPush(msgs,{who:'lg',text:'정민이 돌아왔다. 마운드 숨통 트인다',mood:'happy'});
    ST.justDischarged=false;
  }
  if(ST.calendar&&(ST.calendar.holiday==='광복절'||ST.calendar.holiday==='현충일')&&isAvailable('ksw')){
    uniqPush(msgs,{who:'ksw',text:pickOne([
      `오늘 ${ST.calendar.holiday}입니다. 각 잡고 하겠습니다`,
      `${ST.calendar.holiday}이라 오늘은 좀 다릅니다`,
      '오늘만큼은 제대로 하겠습니다'],rng),mood:'happy'});
    if(rng()<0.45)uniqPush(msgs,{who:pickOne(['jms','lg','swm'],rng),
      text:pickOne(['선우 오늘 눈빛 다르다 ㅋㅋ','오늘 선우 믿는다','ㅋㅋ 각 잡혔네'],rng),mood:'happy'});
  }

  /* 분석가 */
  const an=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('분석가')&&isAvailable(p.id));
  if(an){
    const un=(ST.unhappy&&ST.unhappy[an.id])?ST.unhappy[an.id].level:0;
    if(ST.scoutBlocked||un>=3){
      uniqPush(msgs,{who:an.id,text:'이번엔 분석 안 했다. 알아서들 해라',mood:'angry'});
      ST.oppEvent=null;
    } else {
      if(rng()<0.22){
        uniqPush(msgs,{who:an.id,text:pickOne([
          `${park.name}은 ${park.note}`,
          `오늘 ${park.name}이다. ${park.note}`,
          `${park.note}. 참고해라`],rng),mood:'ok'});
      }
      if(ST.oppEvent&&rng()<0.75)uniqPush(msgs,{who:an.id,text:ST.oppEvent.body,mood:'ok'});
      // 안산유나이티드전이면 고진선을 미리 경고한다.
      // 김한규가 언해피 3단계 이상이면 분석 자체를 안 하므로 이 정보도 못 본다.
      if(opp.id==='ansanutd')
        uniqPush(msgs,{who:an.id,text:pickOne(GOJIN_SCOUT,rng),mood:'ok'});
      if(rng()<0.18){
        uniqPush(msgs,{who:an.id,text:pickOne([
          '상대 선발 볼넷 많다. 좀 봐도 된다',
          '상대 포수 어깨 약하다. 뛰어도 된다',
          '오늘 상대 4번 조심해라',
          '상대 수비 실책 많은 팀이다. 발 쓰자'],rng),mood:'ok'});
      }
    }
  }

  /* 친분 연쇄 */
  applyFriendship(ST);

  /* 형제 */
  const bro=rollBrotherEvent(ST,rng);
  ST.feud=null; ST.broGood=false;
  if(bro&&bro.kind==='good'){
    ST.broGood=true;
    bro.lines.forEach(([w,t])=>uniqPush(msgs,{who:w,text:t,mood:'happy'}));
    us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+9));
    ST.buff['kig']={all:1.08,label:'형제의 날'};
    ST.buff['khg']={all:1.08,label:'형제의 날'};
  } else if(bro&&bro.kind==='bad'){
    ST.feud=bro;
    bro.lines.forEach(([w,t])=>uniqPush(msgs,{who:w,text:t,mood:'angry'}));

    /* 중재 — 매번 다른 사람이 다른 말로 */
    const mediators=us.players.filter(p=>p.id!=='kig'&&p.id!=='khg'&&isAvailable(p.id));
    const shuffled=shuffled_(mediators,rng);
    const nMed=1+((rng()*2)|0);                       // 1~2명만 반응
    const MED_BAN=['또 시작이네 ㅋㅋ','둘이 나가서 하고 와라','밥이나 먹고 하자',
      '단톡 알림 좀 꺼야겠다','형제끼리 왜 그러냐','조용히 좀 해라 진짜',
      '이거 몇 번째냐','경기나 하자 제발'];
    const MED_JON=['또 시작이네요 ㅎㅎ','두 분 진정하시죠','밥 먹고 얘기하시죠',
      '알림 좀 꺼두겠습니다','형제끼리 왜 그러세요','경기 앞두고 이러지 마시죠',
      '이거 몇 번째인가요','좀 있다 얘기하시죠'];
    shuffled.slice(0,nMed).forEach(p=>{
      const jon = speechTo(p.id,'kig')==='jon';
      uniqPush(msgs,{who:p.id,text:pickOne(jon?MED_JON:MED_BAN,rng),mood:'flat'});
    });

    /* 감독은 확률적으로만 개입 */
    if(rng()<0.45&&isAvailable('lg')){
      uniqPush(msgs,{who:'lg',text:pickOne([
        '둘 다 그만해라. 한 번만 더 하면 둘 다 뺀다',
        '경기 앞두고 뭐 하는 거냐 진짜',
        '오늘 둘이 따로 앉아라'],rng),mood:'angry'});
    }
    /* 에이스도 확률적으로 */
    if(rng()<0.35&&isAvailable('swm')){
      uniqPush(msgs,{who:'swm',text:pickOne(['적당히들 해라 진짜','그만하고 몸이나 풀어라'],rng),mood:'angry'});
    }

    /* 이탈 — 고정 2명이 아니라 사기 낮은 사람 중 확률적으로 */
    const fedUp=mediators
      .filter(p=>ST.morale[p.id]<72)
      .sort((a,b)=>ST.morale[a.id]-ST.morale[b.id]);
    if(fedUp.length&&rng()<0.55){
      const q=fedUp[0];
      uniqPush(msgs,{who:q.id,text:say(q.id,
        pickOne(['나 이런 분위기면 다음 경기 안 나간다','진짜 정 떨어지네','다음 주엔 빠질게'],rng),
        pickOne(['이런 분위기면 저 다음 경기 안 나가겠습니다','좀 힘드네요...','다음 주는 빠지겠습니다'],rng)),
        mood:'angry'});
      ST.pendingAbsent=ST.pendingAbsent||{};
      ST.pendingAbsent[q.id]='형제 싸움에 질려서';
      ST.morale[q.id]=Math.max(10,ST.morale[q.id]-14);
    }
    us.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-4));
    if(bro.battery){ ST.buff['kig']={all:0.90,label:'배터리 불화'};
      ST.buff['khg']={all:0.88,label:'배터리 불화'}; }
  }

  const avgM=us.players.reduce((s,p)=>s+ST.morale[p.id],0)/us.players.length;
  if(avgM<60){
    const ld=us.players.find(p=>META[p.id]&&META[p.id].traits.includes('리더')&&isAvailable(p.id));
    if(ld){ uniqPush(msgs,{who:ld.id,text:'단톡에서 그만하고 경기장에서 얘기하자',mood:'ok'});
      us.players.forEach(p=>ST.morale[p.id]=Math.min(100,ST.morale[p.id]+6)); }
  }

  /* 번복 불참 — 라인업 발표 뒤에 갑자기 못 온다는 사람 */
  ST.dropouts=[];
  const DROP_COMMON=[
    ['갑자기 회사에서 호출 왔다','회사에서 갑자기 호출이 왔습니다'],
    ['어제 마신 게 아직 안 깼다','어제 마신 게 아직 안 깨서요...'],
    ['허리가 삐끗했다','허리를 삐끗했습니다'],
    ['여자친구가 화났다','여자친구가 화가 나서...'],
    ['늦잠 잤다 미안하다','늦잠 잤습니다 죄송합니다'],
    ['배탈났다','배탈이 났습니다'],
    ['갑자기 일이 생겼다','갑자기 일이 생겼습니다'],
  ];
  const DROP_CAR=[['차가 시동이 안 걸린다','차 시동이 안 걸립니다']];
  const DROP_KSW=[['부대에서 비상 걸렸다','부대에서 비상이 걸렸습니다'],
    ['갑자기 당직으로 바뀌었다','갑자기 당직으로 바뀌었습니다']];
  ST.lineup.slice().forEach(sl=>{
    const p=us.players.find(x=>x.id===sl.id); if(!p)return;
    const mm=META[p.id]; if(!mm)return;
    const att=mm.attend!=null?mm.attend:0.85;
    const dp=Math.max(0.01,Math.min(0.12,(1-att)*0.20));
    if(rng()<dp){
      const pool2 = p.id==='ksw' ? DROP_KSW
        : (mm.car ? DROP_COMMON.concat(DROP_CAR) : DROP_COMMON);
      const r=pickOne(pool2,rng);
      uniqPush(msgs,{who:p.id,text:say(p.id,r[0],r[1]),mood:'sad'});
      ST.dropouts.push(p.id);
      ST.absent[p.id]='갑자기 못 온다고 함';
      ST.morale[p.id]=Math.max(10,ST.morale[p.id]-3);
    }
  });
  if(ST.dropouts.length){
    const remain=us.players.filter(x=>isAvailable(x.id)).length;
    uniqPush(msgs,{who:'lg',text:pickOne([
      '아 진짜 라인업 다시 짜야겠네',
      '발표하자마자 이러면 어떡하냐',
      remain+'명 남았다. 라인업 다시 본다'],rng),mood:'angry'});
    if(remain<=9&&isAvailable('swm'))
      uniqPush(msgs,{who:'swm',text:'인원 빠듯하다. 아무도 더 빠지지 마라',mood:'flat'});
  }

  ST.lastOrder={};
  ST.lineup.forEach((s,i)=>ST.lastOrder[s.id]=i);
  return msgs;
}

/* ================= 카톡: 경기 후 ================= */
function buildKakaoPost(ST,res,usSide,thSide,uSlots,milestones){
  const us=TBYID['wwzw'];
  const msgs=[];
  const rng=Math.random;
  const won=usSide.runs>thSide.runs, tie=usSide.runs===thSide.runs;

  msgs.push({who:'lg',type:'notice',
    text:`${won?'승':(tie?'무':'패')} ${usSide.runs} : ${thSide.runs}\n고생했다`});

  (milestones||[]).slice(0,4).forEach(m=>{
    msgs.push({who:'lg',type:'record',text:`📋 ${m.text}`});
    /* 50호·100호는 따로 크게 다룬다 */
    if(m.pid&&(m.mark===50||m.mark===100||m.mark===150||m.mark===200)){
      msgs.push({who:'lg',type:'record',
        text:`🎉 ${nameOf(m.pid)} ${m.mark}${m.label==='삼진'?'번째 삼진':`호 ${m.label}`} 달성`});
      const crowd=us.players.filter(p=>p.id!==m.pid&&isAvailable(p.id));
      if(crowd.length){
        const a=pickOne(crowd,rng);
        uniqPush(msgs,{who:a.id,text:sayTo(a.id,m.pid,...pickOne(MILE_BIG_CHEER,rng)),mood:'happy'});
        const rest=crowd.filter(p=>p.id!==a.id);
        if(rest.length){
          const b2=pickOne(rest,rng);
          uniqPush(msgs,{who:b2.id,text:sayTo(b2.id,m.pid,...pickOne(MILE_BIG_TEASE,rng)),mood:'happy'});
        }
        uniqPush(msgs,{who:m.pid,text:say(m.pid,...pickOne(MILE_BIG_REPLY,rng)),mood:'happy'});
      }
    }
    /* 큰 기록이면 축하 + 놀리기 */
    else if(m.mark>=25&&m.pid){
      const others=us.players.filter(p=>p.id!==m.pid&&isAvailable(p.id));
      if(others.length){
        const a=pickOne(others,rng);
        uniqPush(msgs,{who:a.id,text:sayTo(a.id,m.pid,
          pickOne(['오 축하한다 ㅋㅋ','이걸 하네','대단하다 진짜'],rng),
          pickOne(['축하드립니다!','대단하십니다','축하드려요 ㅎㅎ'],rng)),mood:'happy'});
        const rest=others.filter(p=>p.id!==a.id);
        if(rest.length&&rng()<0.6){
          const b=pickOne(rest,rng);
          uniqPush(msgs,{who:b.id,text:sayTo(b.id,m.pid,
            pickOne(['근데 내야안타 몇 개냐','경기를 많이 나갔으니까','오늘 한 잔 사라'],rng),
            pickOne(['내야안타도 포함인가요 ㅋㅋ','한 잔 사주셔야죠'],rng)),mood:'happy'});
          uniqPush(msgs,{who:m.pid,text:say(m.pid,'기록은 기록이다','기록은 기록이죠 ㅎㅎ'),mood:'happy'});
        }
      }
    }
  });
  if((milestones||[]).length){
    const m0=milestones[0];
    if(m0.pid){
      const cg=us.players.find(p=>p.id!==m0.pid&&isAvailable(p.id));
      if(cg)uniqPush(msgs,{who:cg.id,text:say(cg.id,'ㅋㅋ 축하한다','축하드립니다!'),mood:'happy'});
    }
  }

  let best=null,bv=-1e9;
  uSlots.forEach(s=>{ const b=res.box[s.id]; if(!b)return;
    const v=b.h*2+b.rbi*2+b.r+b.sb-b.k*0.5; if(v>bv){bv=v;best=s.id;} });

  if(won){
    if(best)uniqPush(msgs,{who:best,text:say(best,
      pickOne(['오늘 손 맛 좋았다 ㅋㅋ','배트가 잘 돌더라','오랜만에 좀 맞았다','오늘 공이 잘 보였다'],rng),
      pickOne(['오늘 좀 맞았습니다 ㅎㅎ','공이 잘 보였습니다','운이 좋았습니다','오랜만에 좀 쳤네요'],rng)),mood:'happy'});
    if(best&&rng()<0.6){
      const tz=us.players.find(p=>META[p.id]&&META[p.id].friends.includes(best));
      if(tz){
        uniqPush(msgs,{who:tz.id,text:say(tz.id,
          pickOne(['오늘은 운이었다 ㅋㅋ','내야안타 몇 개냐 그거','자꾸 그러면 다음에 못 친다'],rng),
          pickOne(['오늘은 운이 좋으셨네요 ㅋㅋ','내야안타 아니었나요'],rng)),mood:'happy'});
        uniqPush(msgs,{who:best,text:say(best,'운도 실력이다','운도 실력이죠 ㅎㅎ'),mood:'happy'});
      }
    }
  } else if(tie){
    uniqPush(msgs,{who:'swm',text:pickOne(['아쉽다 다음에 잡자','한 점만 더 냈으면','비긴 것도 나쁘진 않다'],rng),mood:'flat'});
  } else {
    const fp=ST.lastFreePass||0;
    if(fp>=16&&isAvailable('khg'))uniqPush(msgs,{who:'khg',text:pickOne([
      `오늘 공짜진루 ${fp}개다. 이러면 못 이긴다`,
      '볼넷만 줄여도 이겼다',
      `데이터상 ${fp}개면 진다. 예외가 없다`,
      '내가 몇 번을 말하냐 공짜진루'],rng),mood:'angry'});
    else uniqPush(msgs,{who:'swm',text:pickOne([
      '오늘은 내가 못 막았다 미안하다','제구가 안 잡히더라','다음엔 잘 던질게','오늘 공이 안 들어갔다'],rng),mood:'sad'});
  }

  if(ST.feud && us.players.some(p=>p.id==='kig') && us.players.some(p=>p.id==='khg')
     ){
    const w=['jms','lg','swm','ksh'].filter(isAvailable);
    if(w.length)uniqPush(msgs,{who:pickOne(w,Math.random),
      text:pickOne(['형제끼리 좀 그만 싸워라 진짜','다음엔 둘 따로 앉히자','오늘 분위기 최악이었다'],Math.random),mood:'flat'});
  }
  if(ST.broGood&&isAvailable('jms'))uniqPush(msgs,{who:'jms',text:'오늘 저 둘 보기 좋았다',mood:'happy'});

  (res.injuries||[]).forEach(iv=>{
    uniqPush(msgs,{who:iv.id,text:say(iv.id,'아 나 어디 좀 삐끗한 것 같다','저 어디 좀 삐끗한 것 같습니다'),mood:'sad'});
  });

  us.players.forEach(p=>{
    const u=ST.unhappy&&ST.unhappy[p.id];
    if(u&&u.level>=2&&rng()<0.35){
      uniqPush(msgs,{who:p.id,text:say(p.id,
        '나 계속 이렇게 벤치면 팀 옮기는 것도 생각해봐야겠다',
        '저 계속 이러면 팀 옮기는 것도 생각해봐야 할 것 같습니다'),mood:'angry'});
    }
  });
  return msgs;
}

/* ================= 회식 ================= */
function doAfterParty(ST){
  const us=TBYID['wwzw'];
  const joined=[], msgs=[];
  us.players.forEach(p=>{
    const m=META[p.id]; if(!m||ST.injury[p.id])return;
    if(m.drink>=2||Math.random()<0.5){
      joined.push(p.id);
      const drop=m.drink>=3?24:m.drink===2?13:m.drink===1?6:0;
      ST.cond[p.id]=Math.max(25,ST.cond[p.id]-drop);
      ST.morale[p.id]=Math.min(100,ST.morale[p.id]+14);
      if(ST.unhappy&&ST.unhappy[p.id])ST.unhappy[p.id].level=Math.max(0,ST.unhappy[p.id].level-1);
    } else ST.morale[p.id]=Math.min(100,ST.morale[p.id]+5);
  });
  let resolved=false;
  if(ST.feud&&joined.includes('kig')&&joined.includes('khg')){
    resolved=true; ST.feud=null;
    if(ST.pendingAbsent){delete ST.pendingAbsent['lsm'];delete ST.pendingAbsent['ksn'];}
    ['kig','khg','lsm','ksn'].forEach(id=>ST.morale[id]=Math.min(100,ST.morale[id]+12));
    msgs.push({who:'ujh',text:'형제 둘이 술 마시더니 풀렸네 ㅋㅋ',mood:'happy'});
  }
  if(Math.random()<0.20&&joined.length>=3){
    const heavy=joined.filter(id=>META[id]&&META[id].drink>=3);
    const cars=joined.filter(id=>META[id]&&META[id].car);
    if(heavy.length&&cars.length){
      const a=pickOne(heavy);
      const bs=cars.filter(x=>x!==a);
      if(bs.length){
        const b=pickOne(bs);
        ST.cond[a]=Math.max(18,ST.cond[a]-16); ST.morale[a]=Math.max(12,ST.morale[a]-14);
        ST.cond[b]=Math.max(18,ST.cond[b]-8);  ST.morale[b]=Math.max(12,ST.morale[b]-18);
        msgs.push({who:b,text:say(b,`${nameOf(a)} 내 차에 토했다 진짜`,`${nameOf(a)}님이 제 차에 토하셨습니다...`),mood:'angry'});
        msgs.push({who:a,text:say(a,'미안하다 세차비 줄게','죄송합니다 세차비 드리겠습니다'),mood:'sad'});
      }
    }
  }
  ST.partyDone=true;
  return {joined,resolved,msgs};
}

function rollMysteryEvent(ST, uSlots){
  // 사회인야구에서 성장은 흔치 않다. 훈련을 해야 확률이 오른다.
  const f=ST.trainFocus||'none';
  let chance = f==='none' ? 0.02 : (f==='hard' ? 0.11 : 0.06);
  if(ST.lessonBoost){ chance+=0.14; ST.lessonBoost=false; }
  if(Math.random()>=chance)return null;
  const us=TBYID['wwzw'];
  const cands=uSlots.map(s=>us.players.find(p=>p.id===s.id)).filter(Boolean);
  if(!cands.length)return null;
  let tgt=null;
  if(ST.lessonTarget){ tgt=cands.find(x=>x.id===ST.lessonTarget); ST.lessonTarget=null; }
  if(!tgt)tgt=pickOne(cands);
  const p=tgt;
  const room=effPA(p.id)-effCA(p.id);
  const r=Math.random();
  if(r<0.40&&room>0.5)return {pid:p.id,name:p.name,kind:'up',delta:0.8+Math.random()*1.6};
  if(r<0.58&&room>1.5)return {pid:p.id,name:p.name,kind:'big',delta:2.0+Math.random()*2.0};
  if(r<0.84)return {pid:p.id,name:p.name,kind:'down',delta:-(0.5+Math.random()*1.2)};
  return {pid:p.id,name:p.name,kind:'none',delta:0};
}
function applyMystery(ST,my){
  const us=TBYID['wwzw'];
  const p=us.players.find(x=>x.id===my.pid);
  if(!p||!my.delta)return null;
  const KN={con:'컨택',pow:'파워',eye:'선구',spd:'주루',def:'수비',arm:'어깨'};
  const k=pickOne(Object.keys(KN));
  const before=Math.round(p[k]);
  p[k]=Math.max(12,Math.min(80,p[k]+my.delta));
  ST.ca[my.pid]=calcCA(p);
  finalizeTeam(us); buildPitcherPool();
  return {stat:KN[k],before,after:Math.round(p[k])};
}

function myGrade(){
  const me=ST.playerId||'ksh';
  const b=ST.bat[me]||blankBat();
  if(!b.pa) return null;
  const lgw=leagueWoba();
  const w=wrcPlus(b,lgw);

/* 면담 개시 판정 — 시즌 중 최대 2회, 4경기 이상 뛰었을 때 */
function rollBossTalk(){
  if(ST.bossTalk) return;                        // 이미 대기 중
  if((ST.bossTalkCount||0)>=2) return;
  const played=ST.schedule.filter(x=>x.played).length;
  if(played<4) return;
  const last=ST.bossTalkAt!=null?ST.bossTalkAt:-99;
  if(played-last<5) return;                      // 최소 5경기 간격
  const g=myGrade(); if(!g||g.pa<8) return;
  const boss=bossId(); if(!boss) return;
  if(Math.random()<0.55){
    ST.bossTalk={boss, tier:g.tier, wrc:g.wrc, pa:g.pa,
      avg:g.avg, ops:g.ops, step:0, log:[]};
    const pool = g.tier==='good'?BOSS_GOOD:(g.tier==='mid'?BOSS_MID:BOSS_BAD);
    const pair=pickOne(pool);
    ST.bossTalk.log.push({who:boss, text:sayTo(boss, ST.playerId, pair[0], pair[1])});
    ST.bossTalk.log.push({who:boss, type:'notice',
      text:`${g.pa}타석 · 타율 ${fmt3(g.avg)} · OPS ${g.ops.toFixed(3)} · wRC+ ${g.wrc}\n리그 평균은 100이다`});
  }
}

function gearTrainMul(kind){
  let m=1;
  GEAR_ITEMS.forEach(g=>{
    if(!gearOwned(g.id))return;
    if(g.eff.train)m*=g.eff.train;
    if(g.eff.bat&&kind==='bat')m*=g.eff.bat;
  });

/* 회비 걷기 — 부족한 금액을 인원수로 나눠 걷는다 */
function collectDues(need){
  const us=TBYID['wwzw'];
  const n=us.players.filter(p=>!isMerc(p.id)).length||1;
  const per=Math.ceil(need/n);
  const total=per*n;
  ST.budget+=total;
  ST.duesCount=(ST.duesCount||0)+1;
  const msgs=[{who:'lg',type:'notice',
    text:`회비 ${per}만원씩 걷습니다 (${n}명 · ${total}만원)\n${pickOne(DUES_LEAD)}`}];
  // 다들 투덜대지만 결국 낸다. 사기는 조금씩 깎인다.
  const drop = 3 + Math.min(6, (ST.duesCount||1)-1)*2;
  const spk=speakers(ST, null, 3+((Math.random()*2)|0), Math.random);
  spk.forEach((p,i)=>{
    const pool = i===0?DUES_ANGRY:(Math.random()<0.5?DUES_ANGRY:DUES_OK);
    msgs.push({who:p.id, text:line(p.id, ST.playerId, pool.map(x=>x[0]), pool.map(x=>x[1]), Math.random),
      mood: pool===DUES_ANGRY?'angry':'ok'});
  });
  us.players.forEach(p=>{
    if(isMerc(p.id))return;
    ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-drop);
    if(ST.bond)ST.bond[p.id]=Math.max(0,(ST.bond[p.id]!=null?ST.bond[p.id]:50)-2);
  });
  msgs.push({who:'lg',type:'notice',text:`전원 사기 -${drop} · 걷은 돈 ${total}만원`});
  return {per,n,total,drop,msgs};
}

function buildAwards(ST){
  const us=TBYID['wwzw'];

  const qual=us.players.filter(p=>(ST.bat[p.id]||{}).pa>=20);
  const pick=(list,fn,label,fmt)=>{

    const b=list.slice().sort((x,y)=>fn(y)-fn(x))[0];
    A.push({label,name:b.name,value:fmt(b)});
  };
  pick(qual,p=>ops(ST.bat[p.id]),'시즌 MVP',p=>`OPS ${ops(ST.bat[p.id]).toFixed(3)}`);
  pick(qual,p=>avg(ST.bat[p.id]),'타격상',p=>`타율 ${fmt3(avg(ST.bat[p.id]))}`);
  pick(us.players,p=>(ST.bat[p.id]||{}).rbi||0,'타점상',p=>`${ST.bat[p.id].rbi}타점`);
  pick(us.players,p=>(ST.bat[p.id]||{}).sb||0,'도루상',p=>`${ST.bat[p.id].sb}도루`);
  pick(us.players,p=>(ST.bat[p.id]||{}).g||0,'개근상',p=>`${ST.bat[p.id].g}경기`);
  const pit=us.pitchers.filter(p=>(ST.pit[p.id]||{}).outs>=21);
  if(pit.length){
    const b=pit.slice().sort((x,y)=>era(ST.pit[x.id])-era(ST.pit[y.id]))[0];
    A.push({label:'투수상',name:b.name,value:`ERA ${era(ST.pit[b.id]).toFixed(2)}`});
    const w=pit.slice().sort((x,y)=>ST.pit[y.id].w-ST.pit[x.id].w)[0];
    A.push({label:'다승상',name:w.name,value:`${ST.pit[w.id].w}승`});
  }
  const gr=us.players.map(p=>({p,g:(ST.ca[p.id]||0)-((ST.caStart&&ST.caStart[p.id])||(ST.ca[p.id]||0))}))
    .sort((a,b)=>b.g-a.g)[0];
  if(gr&&gr.g>0.5)A.push({label:'최다 성장',name:gr.p.name,value:`+${gr.g.toFixed(1)}`});
  pick(qual,p=>(ST.bat[p.id]||{}).bb||0,'선구안상',p=>`${ST.bat[p.id].bb}볼넷`);
  const dr=us.players.filter(p=>META[p.id]&&META[p.id].drink>=3);
  if(dr.length)A.push({label:'주당상',name:pickOne(dr).name,value:'회식 개근'});
  return A;
}

/* 불만 단계 → 대사 풀 키 */
function meetTier(lv){ return lv>=3?'high':(lv>=2?'mid':'ok'); }

/* 오프닝 한 줄 생성. 특성 전용 대사가 있으면 40% 확률로 그걸 쓴다 */
function meetOpenLine(ST, pid){
  const m=META[pid]||{traits:[]};
  const lv=(ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0;
  let pool=null;
  const tr=(m.traits||[]).find(t=>MEET_TRAIT_OPEN[t]);
  if(tr && Math.random()<0.4) pool=MEET_TRAIT_OPEN[tr];
  if(!pool) pool=MEET_OPEN[meetTier(lv)];
  const pair=pickOne(pool);
  return sayTo(pid, ST.playerId, pair[0], pair[1]);
}
function meetReplyLine(ST, pid, key){
  const pair=pickOne(MEET_REPLY[key]);
  return sayTo(pid, ST.playerId, pair[0], pair[1]);
}

/* ---------------------------------------------------------
   약속 검사 — commitGame 에서 매 경기 호출한다.
   starters : 이번 경기 선발 출전 명단(id 배열, 타순 순서)
   played   : 실제로 경기에 나온 id 집합
   absent   : 결장자 판정용 (부상/불참). 결장은 위반으로 치지 않는다.
   반환값은 단톡방에 붙일 메시지 배열.
   --------------------------------------------------------- */
function checkPromises(ST, starters, playedIds, absentIds){
  const msgs=[];
  if(!ST.promise) return msgs;
  Object.keys(ST.promise).forEach(pid=>{
    const pr=ST.promise[pid];
    if(!pr) { delete ST.promise[pid]; return; }
    // 이적·방출로 로스터에서 빠진 선수의 약속은 그냥 없앤다
    if(!TBYID['wwzw'].players.some(q=>q.id===pid)) { delete ST.promise[pid]; return; }
    // 결장(부상·개인사정)한 경기는 약속 계산에서 통째로 빼준다
    if(absentIds.indexOf(pid)>=0) return;

    const idx=starters.indexOf(pid);
    let kept;
    if(pr.type==='order') kept = idx>=0 && (idx+1)<=(pr.orderMax||3);
    else kept = idx>=0 || playedIds.indexOf(pid)>=0;

    if(kept){
      pr.games--;
      if(pr.games<=0){
        ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+15);
        ST.unhappy[pid]={level:0,streak:0};
        const pair=pickOne(MEET_PROMISE_MSG.done);
        msgs.push({who:pid,text:sayTo(pid,ST.playerId,pair[0],pair[1]),mood:'happy'});
        delete ST.promise[pid];
      }
    } else {
      // 위반 — 사기 대폭 하락 + 언해피 즉시 2단계
      ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-20);
      const u=ST.unhappy[pid]||{level:0,streak:0};
      u.level=Math.min(4,u.level+2); u.streak=0;
      ST.unhappy[pid]=u;
      const pair=pickOne(pr.type==='order'?MEET_PROMISE_MSG.break_order:MEET_PROMISE_MSG.break_start);
      msgs.push({who:pid,text:sayTo(pid,ST.playerId,pair[0],pair[1]),mood:'angry'});
      msgs.push({who:pid,type:'notice',text:`약속 파기 — ${nameOf(pid)} 사기 -20 · 불만 2단계 상승`});
      delete ST.promise[pid];
    }
  });
  return msgs;
}

/* 경기 결과에 실린 고진선 이벤트를 사기·컨디션·단톡에 반영한다.
   반환값은 단톡방(경기 후)에 붙일 메시지 배열.                      */
function applyGojin(ST, gj){
  const msgs=[];
  if(!gj||!gj.log||!gj.log.length) return msgs;
  const us=TBYID['wwzw'];

  if(gj.threw){
    msgs.push({who:'khg',type:'notice',
      text:'고진선이 자기 팀 실책에 공을 패대기쳤다\n안산 사기 하락 · 우리 타격 소폭 상승'});
  }
  if(gj.cleared){
    // 양 팀 컨디션이 깎이지만 우리 사기는 오히려 오른다
    us.players.forEach(p=>{
      ST.cond[p.id]=Math.max(20,(ST.cond[p.id]||70)-6);
      ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+8);
    });
    msgs.push({who:'lg',type:'notice',
      text:'벤치클리어링\n양 팀 컨디션 -6 · 우리 팀 사기 +8'});
    const line=pickOne(GOJIN_CLEAR_MSG);
    if(us.players.some(p=>p.id===line[0]))
      msgs.push({who:line[0],text:line[1],mood:'angry'});
  }
  // 두 명이 같은 핑계를 대면 김이 새니 중복 없이 뽑는다
  const exPool=GOJIN_EXCUSE.slice();
  (gj.mocked||[]).forEach(m=>{
    if(!us.players.some(p=>p.id===m.pid))return;
    ST.morale[m.pid]=Math.max(10,(ST.morale[m.pid]||70)-10);
    const ex=exPool.length?exPool.splice((Math.random()*exPool.length)|0,1)[0]:pickOne(GOJIN_EXCUSE);
    msgs.push({who:m.pid,text:say(m.pid,ex[0],ex[1]),mood:'sad'});
    if(m.woke){
      // 각성했으면 사기 하락분을 되돌려주고 조금 더 얹는다
      ST.morale[m.pid]=Math.min(100,(ST.morale[m.pid]||70)+18);
      const wk=pickOne(GOJIN_WAKE_MSG);
      msgs.push({who:m.pid,text:say(m.pid,wk[0],wk[1]),mood:'happy'});
      msgs.push({who:m.pid,type:'notice',text:`${nameOf(m.pid)} 각성 — 사기 회복 +8`});
    } else {
      msgs.push({who:m.pid,type:'notice',text:`${nameOf(m.pid)} 사기 -10`});
    }
  });
  return msgs;
}

/* 플레이어와의 우정. 술 약속·면담이 여기에 쌓이고

function bondOf(pid){ return (ST.bond&&ST.bond[pid]!=null)?ST.bond[pid]:50; }
function bondAdd(pid, d){
  if(!ST.bond)ST.bond={};
  ST.bond[pid]=Math.max(0,Math.min(100,bondOf(pid)+d));
  return ST.bond[pid];
}
function bondLabel(v){

/* 경기 후 마찰 결과를 사기·컨디션·단톡에 반영 */
function applyFriction(ST, fr){

    });
    msgs.push({who:'lg',type:'notice',text:'벤치클리어링\n전원 컨디션 -5 · 사기 +9'});
    if(fr.by&&us.players.some(p=>p.id===fr.by)){
      msgs.push({who:fr.by,text:say(fr.by,'나는 잘못한 거 없다','저는 잘못한 거 없습니다'),mood:'angry'});
      const spk=speakers(ST,fr.by,2,Math.random);
      spk.forEach(p=>msgs.push({who:p.id,
        text:line(p.id,ST.playerId,
          ['너 좀 참아라 진짜','다칠 뻔했다','그래도 시원하긴 했다','다음엔 말리자'],
          ['좀 참으세요 진짜','다칠 뻔했습니다','그래도 시원하긴 했습니다','다음엔 말리시죠'],Math.random),
        mood:'flat'}));

  if(fr.drunk&&us.players.some(p=>p.id===fr.drunk)){

    msgs.push({who:fr.drunk,type:'notice',text:`${nameOf(fr.drunk)} 사기 -6 — 경기 전날은 좀 참자`});

    us.players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+4));
    msgs.push({who:'lg',type:'notice',text:'경기 중 분위기를 탔다\n전원 사기 +4'});
  }
  return msgs;
}

/* 약속 요약 문구 (홈 화면·면담 화면 공용) */
function promiseLabel(pr){

  return pr.type==='order'
    ? `${pr.orderMax}번 타순 이상 · ${pr.games}경기 남음`
    : `선발 출전 · ${pr.games}경기 남음`;
}

<script>
/* =========================================================
   LiveGame — 이닝 단위로 진행되며 판단 지점에서 멈춘다
   ========================================================= */
'use strict';

function newBoxL(){return {pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}
function newPitL(){return {outs:0,h:0,r:0,er:0,bb:0,k:0,hbp:0,sbA:0,bf:0};}

function LiveGame(cfg){
  this.INN = cfg.innings || 7;
  this.rng = cfg.rng;
  this.userIsHome = cfg.userIsHome;
  this.log = [];
  this.box = {}; this.pbox = {};
  this.injuries = [];
  this.over = false; this.mercy = false;
  this.inning = 1; this.half = 0;
  this.outs = 0; this.bases = [null,null,null];
  this.pending = null;
  this.usedPH = {};       // 대타 사용 기록
  this.park = cfg.park || {hr:1,d2:1,d3:1,err:1,babip:1};
  this.gearPenalty = cfg.gearPenalty||0;
  this.buff = cfg.buff||{};
  this.dpCount=0; this.assists=0; this.wp=0;
  this.hot = !!cfg.hot;
  this.timeouts = 5;      // 공격 작전 지시 가능 횟수
  this.defTimeouts = 3;   // 수비 판단(고의4구·시프트) 가능 횟수
  this.myId = cfg.myId||null;      // 플레이어가 고른 선수 — 피드 강조용
  this.tacTTL = {bat:0, run:0};    // 공격 지시 잔여 타석. 0이 되면 자동 해제된다
  this.shiftTTL = 0;               // 수비 시프트 잔여 타석
  this._buntRun = false;

  const mk = (team, slots, rot, tac, cond, isUser) => {
    const s = {team, slots: slots.map(x=>({...x})), rot: rot.slice(), tac:{...tac}, tacBase:{...tac},
      cond:cond||{},
      isUser, order:0, pIdx:0, runs:0, hits:0, errs:0, bbs:0, sbAllowed:0, line:[]};
    const c = s.slots.find(x=>x.pos==='C');
    const cp = c ? team.players.find(p=>p.id===c.id) : null;
    s.cArm = (cp ? cp.arm : 45) - (isUser?(cfg.gearPenalty||0):0);
    s.slots.forEach(sl=>{ this.box[sl.id]=this.box[sl.id]||newBoxL(); });
    s.rot.forEach(pid=>{ this.pbox[pid]=this.pbox[pid]||newPitL(); });
    return s;
  };
  this.away = mk(cfg.away, cfg.awayLineup, cfg.awayRotation, cfg.awayTactics, cfg.awayCond, !cfg.userIsHome);
  this.home = mk(cfg.home, cfg.homeLineup, cfg.homeRotation, cfg.homeTactics, cfg.homeCond, cfg.userIsHome);
  this.sides = [this.away, this.home];
  /* 안산유나이티드전 한정 — 고진선 특수 이벤트.
     실제로 그 팀 에이스가 자기 팀 실책에 화내고 상대 벤치에 시비를 걸었다.
     로스터에 고진선이 실제로 있어야 발동한다.                          */
  const opT=(this.userIsHome?this.away:this.home).team;
  const hasGo = opT && opT.id==='ansanutd' &&
    ((opT.players||[]).some(x=>x.name==='고진선')||(opT.pitchers||[]).some(x=>x.name==='고진선'));
  this.gojin = hasGo ? {log:[],mocked:[],threw:false,cleared:false} : null;
  this.gojinUs = 1;      // 우리 팀 BABIP 배수 (패대기·벤치클리어링 여파)
  this.gojinOpp = 1;     // 안산 BABIP 배수
  this.gojinWake = {};   // 각성 예약 {pid:true} — 두 명이 동시에 예약될 수 있다
  this.highlights = [];  // 이닝별 주요 장면 (2루타·3루타·홈런·도루자·병살타)
  this.friction = {log:[],hbp:false,cleared:false,drunk:null,by:null,up:false,pending:false};
  this.drunkIds = cfg.drunkIds||[];   // 전날 마신 사람들
  this.fricUs = 1;       // 마찰 여파로 붙는 우리 BABIP 배수
  this.fricOpp = 1;
  this.mgr = {left:3, boost:1, log:[]};  // 감독 액션
  this.log.push({t:'inning', inning:1, half:0, text:`1회 초 · ${this.away.team.name} 공격`});
  this.startedInning = true;
  this.checkPitcherChange(this.home);
}

/* 주요 장면 기록. 경기 후 하이라이트 표에 그대로 쓴다. */
LiveGame.prototype.hl = function(kind, side, name, detail){
  this.highlights.push({
    inning:this.inning, half:this.half, kind,
    team:side.team.name, us:!!side.isUser, name, detail:detail||''
  });
};

LiveGame.prototype.off = function(){ return this.sides[this.half]; };
LiveGame.prototype.def = function(){ return this.sides[1-this.half]; };
LiveGame.prototype.userSide = function(){ return this.userIsHome ? this.home : this.away; };
LiveGame.prototype.oppSide = function(){ return this.userIsHome ? this.away : this.home; };
LiveGame.prototype.curPitcher = function(s){
  const pid = s.rot[Math.min(s.pIdx, s.rot.length-1)];
  const p = s.team.pitchers.find(x=>x.id===pid) || s.team.pitchers[0];
  if(!p) return p;
  const mm = (typeof META!=='undefined') ? META[p.id] : null;
  if(s.isUser && mm && mm.traits.includes('더위약함') && this.hot){
    const outs = (this.pbox[p.id]||{}).outs||0;
    if(outs > 6) return {...p, stf: Math.round(p.stf*0.62), ctl: Math.round(p.ctl*0.78)};
  }
  return p;
};
LiveGame.prototype.batter = function(){
  const s=this.off(); const slot=s.slots[s.order%9];
  return s.team.players.find(p=>p.id===slot.id);
};

LiveGame.prototype.checkPitcherChange = function(s){
  const p=this.curPitcher(s), l=this.pbox[p.id];
  const hk=s.tac.hook||'normal';
  const mul = hk==='quick'?0.72:(hk==='long'?1.30:1);
  const lim=Math.round((6+(p.sta-28)*0.40)*mul);
  const bbLim = hk==='quick'?4:(hk==='long'?9:7);
  const rLim  = hk==='quick'?5:(hk==='long'?12:9);
  if((l.outs>=lim||l.bb+l.hbp>=bbLim||l.r>=rLim) && s.pIdx<s.rot.length-1){
    if(s.isUser){
      // 유저 팀이면 교체 여부를 물어본다
      this.pending={kind:'pitcherChange', side:s, from:p.name, to:this.curPitcherNext(s)};
      return true;
    }
    s.pIdx++;
    this.log.push({t:'sub',text:`투수 교체 · ${s.team.name}: ${p.name} → ${this.curPitcher(s).name}`});
  }
  return false;
};
LiveGame.prototype.curPitcherNext = function(s){
  const pid=s.rot[Math.min(s.pIdx+1,s.rot.length-1)];
  const p=s.team.pitchers.find(x=>x.id===pid);
  return p?p.name:'—';
};

/* 판단 지점 탐지 */
LiveGame.prototype.detectDecision = function(){
  if(this.pending) return this.pending;
  const off=this.off();

  /* 우리가 수비 중일 때의 판단 지점 — 투수 교체·고의4구·시프트 */
  if(!off.isUser && this.def().isUser){
    if(this.defTimeouts<=0) return null;
    const usD=this.userSide(), thD=this.oppSide();
    const dd=usD.runs-thD.runs;
    const rispD=this.bases[1]||this.bases[2];
    const pitD=this.curPitcher(this.def()), plD=this.pbox[pitD.id];
    if(rispD && this.outs<2 && this.rng()<0.30) return {kind:'defense', label:'실점 위기'};
    if((plD.bb+plD.hbp)>=3 && this.rng()<0.35) return {kind:'defense', label:'투수가 흔들린다'};
    if(plD.r>=4 && this.rng()<0.30) return {kind:'defense', label:'투수 난조'};
    if(this.inning>=this.INN-2 && Math.abs(dd)<=2 && this.outs<2 && this.rng()<0.22)
      return {kind:'defense', label:'후반 승부처'};
    return null;
  }

  if(!off.isUser) return null;
  if(this.timeouts<=0) return null;

  const us=this.userIsHome?this.home:this.away;
  const th=this.userIsHome?this.away:this.home;
  const diff = us.runs - th.runs;
  const risp = this.bases[1]||this.bases[2];
  const onBase = this.bases[0]||risp;
  const late = this.inning >= this.INN-2;
  const close = Math.abs(diff)<=4;

  // 득점권
  if(risp && this.outs<2){
    if(this.rng() < (close?0.55:0.30)) return {kind:'situation', label:'득점권 기회'};
  }
  // 주자 1루
  if(this.bases[0] && !this.bases[1] && this.outs<2){
    if(this.rng() < (late&&close?0.45:0.22)) return {kind:'situation', label:'주자 1루'};
  }
  // 후반 승부처
  if(late && close && this.outs<2){
    if(this.rng() < 0.25) return {kind:'situation', label:'승부처'};
  }
  // 이닝 선두타자
  if(!onBase && this.outs===0 && this.inning>=2){
    if(this.rng() < 0.14) return {kind:'situation', label:'이닝 선두타자'};
  }
  // 한 번도 안 썼으면 후반에 반드시 한 번
  if(this.timeouts===5 && this.inning>=this.INN-1 && this.outs<2){
    return {kind:'situation', label:'마지막 기회'};
  }
  return null;
};

/* 지시 유효기간 관리
   ---------------------------------------------------------
   예전에는 '적극 스윙' 을 한 번 누르면 경기가 끝날 때까지 유지돼서
   초구 스윙만 무한 반복됐다. 이제 타석 수를 세서 자동으로 풀린다.
   해제하면 라인업 화면에서 정한 기본 전술(tacBase)로 돌아간다.        */
LiveGame.prototype.tickTactics = function(offWasUser){
  const s=this.userSide();
  // 시프트는 우리가 수비할 때만 닳는다
  if(this.shiftTTL>0 && !offWasUser){
    this.shiftTTL--;
    if(this.shiftTTL===0) this.log.push({t:'sub',text:'수비 시프트 해제 — 지시 종료'});
  }
  if(!offWasUser) return;
  if(this.tacTTL.bat>0){
    this.tacTTL.bat--;
    if(this.tacTTL.bat===0){
      const back=s.tacBase.bat||'normal';
      if(s.tac.bat!==back){ s.tac.bat=back; this._buntRun=false;
        this.log.push({t:'sub',text:'타격 지시 종료 — 평소대로'}); }
    }
  }
  if(this.tacTTL.run>0){
    this.tacTTL.run--;
    if(this.tacTTL.run===0){
      const back=s.tacBase.run||'normal';
      if(s.tac.run!==back){ s.tac.run=back;
        this.log.push({t:'sub',text:'주루 지시 종료 — 평소대로'}); }
    }
  }
};

/* 한 타석 진행 — 실제 계산은 stepPA, step 은 지시 만료를 처리하는 껍데기 */
LiveGame.prototype.step = function(){
  if(this.over) return {done:true};
  if(this.pending) return {pending:this.pending};
  const offWasUser=this.off().isUser;
  this._paDone=false;
  const r=this.stepPA();
  if(this._paDone) this.tickTactics(offWasUser);
  return r;
};

LiveGame.prototype.stepPA = function(){
  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  const bl=this.box[bat.id];
  const rng=this.rng;
  const events=[];

  // 도루
  if(this.bases[0] && !this.bases[1]){
    const rn=off.team.players.find(x=>x.id===this.bases[0]);
    if(rn){
      let runMul=1;
      if(off.tac.run==='aggressive')runMul=1.6;
      else if(off.tac.run==='hold')runMul=0.12;
      const att=clamp(LG.SB_PER_PA*5.64*off.team.tend.sb*runMul*Math.exp((rn.spd-46)*0.020),0,0.85);
      if(rng()<att){
        const su=clamp(LG.SB_SUCCESS+(rn.spd-50)*0.0030-(def.cArm-46)*0.0060,0.45,0.99);
        if(rng()<su){
          this.bases[1]=this.bases[0];this.bases[0]=null;
          this.box[rn.id].sb++;pl.sbA++;def.sbAllowed++;
          events.push({text:`${rn.name} 2루 도루 성공`,cls:'sb'});
        }else{
          this.bases[0]=null;this.outs++;this.box[rn.id].cs++;
          events.push({text:`${rn.name} 도루 실패`,cls:'out'});
          this.hl('cs',off,rn.name,'2루 도루 실패');
          if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
        }
      }
    }
  }

  /* 폭투 — 주자가 있고 제구가 나쁠수록 */
  if((this.bases[0]||this.bases[1]||this.bases[2]) && rng() < clamp(0.009+(42-pit.ctl)*0.0009, 0.002, 0.038)){
    for(let b=2;b>=0;b--){
      if(!this.bases[b])continue;
      if(b===2){ this.box[this.bases[2]].r++; off.runs++; this.curIR++; pl.r++; pl.er++; this.bases[2]=null; }
      else { this.bases[b+1]=this.bases[b]; this.bases[b]=null; }
    }
    this.wp=(this.wp||0)+1;
    events.push({text:`${pit.name} 폭투`,cls:'err'});
  }

  pl.bf++; bl.pa++;
  this._paDone=true;                       // 이 타석이 소비됐다 → 지시 카운트 차감
  // 플레이어가 고른 선수의 타석은 피드에서 따로 알려준다
  if(this.myId && bat.id===this.myId) this.log.push({t:'me',text:`▶ ${bat.name} 타석`});
  const cond = off.cond[bat.id];
  let batE = bat;
  /* 포수부담 — 포수로 출전하면 타격이 떨어진다 */
  const mySlot = off.slots[(off.order)%9];
  const mm = (typeof META!=='undefined') ? META[bat.id] : null;
  if(off.isUser && mm && mm.traits.includes('포수부담') && mySlot && mySlot.pos==='C'){
    batE = {...batE, con: batE.con*0.86, pow: batE.pow*0.86};
  }
  const bf = off.isUser && this.buff ? this.buff[bat.id] : null;
  if(bf){
    batE = {...bat};
    if(bf.pow) batE.pow = Math.min(80, bat.pow*bf.pow);
    if(bf.spd) batE.spd = Math.min(80, bat.spd*bf.spd);
    if(bf.all){ batE.con=bat.con*bf.all; batE.pow=bat.pow*bf.all; batE.spd=bat.spd*bf.all; }
  }
  /* ---- 고진선 이벤트 ---- 순서 중요: 각성 판정을 놀림보다 먼저 해야
     이번 타석이 아니라 '다음 타석'에 버프가 붙는다.                    */
  if(this.gojin){
    if(off.isUser && this.gojinWake[bat.id]){
      batE={...batE, con:Math.min(80,batE.con*1.22), pow:Math.min(80,batE.pow*1.22)};
      this.log.push({t:'gojin',text:`${bat.name} 눈빛이 달라졌다`});
      const mk=this.gojin.mocked.find(m=>m.pid===bat.id);
      if(mk)mk.woke=true;
      delete this.gojinWake[bat.id];
    }
    // 그날 무안타인 우리 타자를 놀린다 (경기당 최대 2명, 같은 선수 1번)
    if(off.isUser && bl.ab>=2 && bl.h===0 && this.gojin.mocked.length<2
       && !this.gojin.mocked.some(m=>m.pid===bat.id) && rng()<0.30){
      this.gojin.mocked.push({pid:bat.id,woke:false});
      this.gojin.log.push('mock');
      this.log.push({t:'gojin',text:pickOne(GOJIN_MOCK,rng)[0].replace('${n}',bat.name)});
      if(rng()<0.35){ this.gojinWake[bat.id]=true;   // 확률적 각성
        this.log.push({t:'gojin',text:`${bat.name}이(가) 배트를 고쳐 잡았다`}); }
      else this.log.push({t:'gojin',text:`${bat.name}이(가) 아무 말도 못 했다`});
    }
    // 안산이 3점 이상 지고 있으면 시비를 건다 → 벤치클리어링 (경기당 1회)
    if(!this.gojin.cleared && this.inning>=3
       && (this.oppSide().runs - this.userSide().runs) <= -3 && rng()<0.10){
      this.gojin.cleared=true;
      this.gojin.log.push('clear');
      this.log.push({t:'gojin',text:pickOne(GOJIN_CLEAR,rng)});
      this.log.push({t:'gojin',text:'벤치클리어링 — 양 팀이 그라운드로 몰려나왔다'});
      this.log.push({t:'gojin',text:'심판이 경고만 주고 경기를 재개했다'});
      this.gojinOpp*=0.94; this.gojinUs*=0.96;   // 양 팀 다 흔들린다
    }
  }

  /* ---- 경기 중 마찰 ---- 상대가 누구든 일어난다 */
  if(off.isUser || def.isUser){
    const usS=this.userSide(), thS=this.oppSide();
    const diff=usS.runs-thS.runs;
    // 전날 마신 김인규가 흥분한다
    if(!this.friction.drunk && this.inning>=3 && this.drunkIds.indexOf('kig')>=0
       && usS.slots.some(x=>x.id==='kig') && rng()<0.004){   // 경기당 약 13%
      this.friction.drunk='kig'; this.friction.log.push('drunk');
      this.log.push({t:'fric',text:pickOne(FRIC_KIG_DRUNK,rng)});
      this.friction.pending=true;
    }
    // 김한규가 있으면 벤치클리어링으로 번진다.
    // 판정은 딱 한 번만 한다 — 매 타석 굴리면 결국 100% 터진다.
    if(this.friction.pending && !this.friction.cleared){
      this.friction.pending=false;
      if(rng()<0.42){
      this.friction.cleared=true; this.friction.log.push('clear');
      const khg = usS.slots.some(x=>x.id==='khg');
      this.log.push({t:'fric',text: khg?pickOne(FRIC_KHG_CLEAR,rng)
        :'양 팀 선수들이 그라운드로 몰려나왔다'});
      this.log.push({t:'fric',text:pickOne(FRIC_CLEAR_END,rng)});
      this.friction.by = khg?'khg':(this.friction.drunk||'kig');
      this.fricUs*=0.97; this.fricOpp*=0.95;   // 양 팀 다 흔들린다
      } else {
        this.log.push({t:'fric',text:'주변에서 말려서 더 커지지는 않았다'});
      }
    }
    // 사구 뒤에도 번질 수 있다
    if(this.friction.hbp && !this.friction.cleared && !this.friction.pending
       && diff<=-3 && this.inning>=4 && rng()<0.004){
      this.friction.pending=true;
    }
    // 분위기 상승 — 크게 앞설 때
    if(!this.friction.up && off.isUser && diff>=3 && this.inning>=3 && rng()<0.012){
      this.friction.up=true; this.friction.log.push('up');
      this.log.push({t:'fric',text:pickOne(FRIC_UP,rng)});
      this.fricUs*=1.05;
    }
  }

  let pitE = pit;
  if(pit.heatFade && pl.outs>=6){
    const over=Math.min(12,pl.outs-6);
    pitE={...pit, stf:Math.max(14,pit.stf-8-over*1.6), ctl:Math.max(10,pit.ctl-5-over*1.1)};
  }
  /* 수비 시프트 — 정면 타구는 잘 잡히지만 반대쪽으로 빠지면 장타가 된다.
     simPA 를 고치지 않고 구장 배수(park)만 갈아끼워서 표현한다.        */
  let parkE=this.park;
  if(def.isUser && this.shiftTTL>0){
    parkE={...this.park, babip:this.park.babip*0.92,
           d2:this.park.d2*1.18, err:this.park.err*1.06};
  }
  // 고진선 이벤트 여파 — 공격 중인 쪽에 해당하는 배수를 곱한다
  const gjM = (off.isUser ? this.gojinUs : this.gojinOpp)
            * (off.isUser ? this.fricUs : this.fricOpp)
            * (off.isUser ? (this.mgr.boost||1) : 1);
  if(gjM!==1) parkE={...parkE, babip:parkE.babip*gjM};
  const res = simPA(batE, pitE, off.team, def.team, rng, off.tac, cond, parkE);
  // 번트 앤 런은 주자가 한 베이스 더 간다
  const advOdds = (off.isUser && this._buntRun) ? 0.62 : 0.35;

  const score=(rid,e)=>{ if(!rid)return; this.box[rid].r++; off.runs++; this.curIR++; pl.r++; if(e)pl.er++; };
  const adv=(n,e)=>{ for(let b=2;b>=0;b--){ if(this.bases[b]){ const nb=b+n;
    if(nb>=3){score(this.bases[b],e);bl.rbi++;} else this.bases[nb]=this.bases[b]; this.bases[b]=null; } } };

  if(res.type==='K'){ bl.ab++;bl.k++;pl.k++;pl.outs++;this.outs++;
    events.push({text:`${bat.name} 삼진`,cls:'out'}); }
  else if(res.type==='BB'||res.type==='HBP'){
    const isBB=res.type==='BB';
    if(isBB){bl.bb++;pl.bb++;off.bbs++;}else{
      bl.hbp++;pl.hbp++;
      // 우리 타자가 맞으면 벤치가 험악해진다 (경기당 1회)
      if(off.isUser && !this.friction.hbp && rng()<0.35){
        this.friction.hbp=true; this.friction.log.push('hbp');
        this.log.push({t:'fric',text:pickOne(FRIC_HBP,rng).replace('{n}',bat.name)});
        this.log.push({t:'fric',text:pickOne(FRIC_HBP_AFTER,rng)});
        this.fricUs*=1.04; this.fricOpp*=0.97;
      }
    }
    if(this.bases[0]&&this.bases[1]&&this.bases[2]){score(this.bases[2],true);bl.rbi++;this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
    else if(this.bases[0]){this.bases[1]=this.bases[0];}
    this.bases[0]=bat.id;
    events.push({text:`${bat.name} ${isBB?'볼넷':'몸에 맞는 공'}`,cls:'bb'});
  }
  else if(res.type==='E'){ bl.ab++;def.errs++;adv(1,false);this.bases[0]=bat.id;
    events.push({text:`${bat.name} 상대 실책 출루`,cls:'err'});
    // 안산 야수가 실책하면 고진선이 폭발한다 (경기당 1회)
    if(this.gojin && !this.gojin.threw && !def.isUser && rng()<0.65){
      this.gojin.threw=true;
      this.gojin.log.push('throw');
      this.log.push({t:'gojin',text:pickOne(GOJIN_THROW,rng)});
      this.log.push({t:'gojin',text:pickOne(GOJIN_THROW_AFTER,rng)});
      this.gojinOpp*=0.92; this.gojinUs*=1.05;
    } }
  else if(res.type==='OUT'){
    bl.ab++;pl.outs++;this.outs++;
    const dpB = def.isUser ? (typeof dpBonus==='function'?dpBonus(def.slots).bonus:0) : 0;
    // 번트 앤 런은 굴러가면 주자가 걸릴 위험이 조금 더 크다
    const dpRisk = 0.030 + dpB + ((off.isUser&&this._buntRun)?0.050:0);
    if(res.gb&&this.bases[0]&&this.outs<3&&rng()<dpRisk){this.bases[0]=null;pl.outs++;this.outs++;
      this.dpCount=(this.dpCount||0)+1;
      events.push({text:`${bat.name} 병살타`,cls:'out'});
      this.hl('dp',off,bat.name,'');}
    else if(this.bases[2]&&this.outs<3&&!res.gb&&rng()<0.30){
      // 홈보살 특성 보유 외야수가 있으면 잡아낸다
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(of && rng()<0.10){
        this.bases[2]=null; pl.outs++; this.outs++;
        events.push({text:`${bat.name} 뜬공 — ${of.name} 홈 보살! 주자 아웃`,cls:'sb'});
        this.assists=(this.assists||0)+1;
        this.assistBy=of.id;
      } else {
        score(this.bases[2],true);bl.rbi++;this.bases[2]=null;
        events.push({text:`${bat.name} 희생플라이 · 1점`,cls:'score'});
      }
    }
    else events.push({text:`${bat.name} ${res.gb?'땅볼':'뜬공'} 아웃`,cls:'out'});
  }
  else{
    bl.ab++;bl.h++;pl.h++;off.hits++;
    if(res.type==='1B'){
      // 3루 주자 홈 쇄도 — 홈보살 특성 판정
      const of=def.slots.filter(x=>['LF','CF','RF'].includes(x.pos))
        .map(x=>def.team.players.find(p=>p.id===x.id)).filter(Boolean)
        .find(p=>META[p.id]&&META[p.id].traits.includes('홈보살'));
      if(this.bases[2]&&of&&this.outs<2&&rng()<0.10){
        const r3=this.bases[2]; this.bases[2]=null;
        this.box[r3]&&(this.box[r3].cs=this.box[r3].cs);
        pl.outs++; this.outs++;
        this.assists=(this.assists||0)+1; this.assistBy=of.id;
        events.push({text:`${bat.name} 안타 — ${of.name} 홈 보살! 3루 주자 아웃`,cls:'sb'});
        if(this.outs<3){ adv(rng()<advOdds?2:1,true); this.bases[0]=bat.id; }
      } else {
        adv(rng()<advOdds?2:1,true);this.bases[0]=bat.id;
        events.push({text:`${bat.name} 안타`,cls:'hit'});
      }
    }
    else if(res.type==='2B'){bl.d2++;adv(2,true);this.bases[1]=bat.id;
      events.push({text:`${bat.name} 2루타`,cls:'hit'});
      this.hl('d2',off,bat.name,'');}
    else if(res.type==='3B'){bl.d3++;adv(3,true);this.bases[2]=bat.id;
      events.push({text:`${bat.name} 3루타`,cls:'hit'});
      this.hl('d3',off,bat.name,'');}
    else{bl.hr++;let c=1;for(let b=0;b<3;b++)if(this.bases[b]){score(this.bases[b],true);c++;this.bases[b]=null;}
      score(bat.id,true);bl.rbi+=c;
      events.push({text:`${bat.name} 홈런! ${c}점`,cls:'hr'});
      this.hl('hr',off,bat.name,c>1?`${c}점 홈런`:'솔로 홈런');}
  }

  off.order++;
  // 내가 고른 선수가 주인공인 플레이는 표시를 달아 피드에서 강조한다
  const meP = this.myId ? (off.team.players.find(p=>p.id===this.myId)||def.team.players.find(p=>p.id===this.myId)) : null;
  const meName = meP ? meP.name : null;
  events.forEach(e=>{
    const mine = !!(meName && (e.text.indexOf(meName)===0 || e.text.indexOf('— '+meName)>=0));
    this.log.push({t:'play', me:mine, ...e});
    if(mine && (e.cls==='hr'||e.text.indexOf('3루타')>=0))
      this.log.push({t:'me',text:pickOne(['벤치가 뒤집어졌다','더그아웃에서 다 뛰어나왔다','오늘 주인공이다'])});
  });

  // 끝내기
  if(this.half===1 && this.inning>=this.INN && this.home.runs>this.away.runs){
    this.finish(); return {events, done:true};
  }
  if(this.outs>=3){ this.endHalf(); return {events, half:true}; }
  return {events};
};

LiveGame.prototype.endHalf = function(){
  const off=this.off();
  off.line.push(this.curIR||0);
  this.curIR=0;
  this.outs=0; this.bases=[null,null,null];

  if(this.half===0){
    this.half=1;
    // 홈팀 리드 중 마지막 이닝 말 스킵
    if(this.inning>=this.INN && this.home.runs>this.away.runs){ this.home.line.push(null); this.finish(); return; }
    this.log.push({t:'inning',inning:this.inning,half:1,
      text:`${this.inning}회 말${this.inning>this.INN?' (연장)':''} · ${this.home.team.name} 공격`});
    this.checkPitcherChange(this.away);
  } else {
    // 이닝 종료
    const diff=Math.abs(this.away.runs-this.home.runs);
    if((this.inning>=4&&diff>=10)||(this.inning>=6&&diff>=7)){ this.mercy=true; this.finish(); return; }
    if(this.inning>=this.INN && this.away.runs!==this.home.runs){ this.finish(); return; }
    if(this.inning>=this.INN+3){ this.finish(); return; }
    this.inning++; this.half=0;
    this.log.push({t:'inning',inning:this.inning,half:0,
      text:`${this.inning}회 초${this.inning>this.INN?' (연장)':''} · ${this.away.team.name} 공격`});
    this.checkPitcherChange(this.home);
  }
};

LiveGame.prototype.finish = function(){
  if(this.over) return;
  this.over=true;
  // 부상 판정
  const us=this.userSide();
  if(this.rng()<0.085){
    const cands=us.slots.map(x=>us.team.players.find(p=>p.id===x.id)).filter(Boolean);
    const v=cands[(this.rng()*cands.length)|0];
    if(v) this.injuries.push({id:v.id, roll:this.rng()});
  }
  const tie=this.away.runs===this.home.runs;
  const awayWin=this.away.runs>this.home.runs;
  const win=awayWin?this.away:this.home, lose=awayWin?this.home:this.away;
  this.result={
    away:{team:this.away.team,runs:this.away.runs,hits:this.away.hits,errs:this.away.errs,bbs:this.away.bbs,sbAllowed:this.away.sbAllowed,line:this.away.line},
    home:{team:this.home.team,runs:this.home.runs,hits:this.home.hits,errs:this.home.errs,bbs:this.home.bbs,sbAllowed:this.home.sbAllowed,line:this.home.line},
    box:this.box, pbox:this.pbox, log:this.log, tie,
    winner:tie?null:(awayWin?this.away.team.id:this.home.team.id),
    wp:tie?null:win.rot[0],
    lp:tie?null:lose.rot[Math.min(lose.pIdx,lose.rot.length-1)],
    innings:this.inning, mercy:this.mercy, injuries:this.injuries,
    dpCount:this.dpCount||0, assists:this.assists||0, assistBy:this.assistBy||null,
    wpCount:this.wp||0,          // 폭투 수. wp(승리투수 id)와 키가 겹치면 안 된다
    gojin:this.gojin,
    friction:this.friction,
    highlights:this.highlights,
  };
};

/* 전술 적용 */
LiveGame.prototype.pitcherOptions = function(){
  const s=this.userSide();
  return s.rot.slice(this.userSide().pIdx+1);
};
LiveGame.prototype.applyDecision = function(choice){
  const s=this.userSide();
  const p=this.pending;
  this.pending=null;
  if(p && p.kind==='pitcherChange'){
    if(choice==='change'){
      const old=this.curPitcher(p.side).name;
      p.side.pIdx++;
      this.log.push({t:'sub',text:`투수 교체 · ${old} → ${this.curPitcher(p.side).name}`});
    } else {
      this.log.push({t:'sub',text:`교체 없이 계속 간다`});
      p.side._stay=(p.side._stay||0)+1;
    }
    return;
  }
  /* ---- 수비 판단 ---- */
  if(choice==='pchange'){                      // 투수 교체는 작전 횟수를 안 먹는다
    if(!this.userPitcherChange()) this.log.push({t:'sub',text:'바꿀 투수가 없다'});
    return;
  }
  if(choice==='ibb'){ this.defTimeouts--; this.intentionalWalk(); return; }
  if(choice==='shift'){ this.defTimeouts--; this.setShift(true); return; }
  if(choice==='unshift'){ this.setShift(false); return; }
  if(choice==='defnone'){ this.defTimeouts--; this.log.push({t:'sub',text:'그대로 간다'}); return; }

  /* ---- 공격 작전 ---- 전부 유효 타석 수가 붙는다 (무한 지속 버그 수정) */
  this.timeouts--;
  if(choice==='bunt'){
    s.tac.bat='contact'; this._buntRun=false; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 번트 · 진루타 지시 (1타석)'});
  } else if(choice==='buntrun'){
    s.tac.bat='contact'; s.tac.run='aggressive'; this._buntRun=true;
    this.tacTTL.bat=1; this.tacTTL.run=1;
    this.log.push({t:'sub',text:'작전: 번트 앤 런 (1타석)'});
  } else if(choice==='steal'){
    s.tac.run='aggressive'; this.tacTTL.run=2;
    this.log.push({t:'sub',text:'작전: 적극 주루 지시 (2타석)'});
  } else if(choice==='patient'){
    s.tac.bat='patient'; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 공 많이 보기 (1타석)'});
  } else if(choice==='swing'){
    s.tac.bat='aggressive'; this.tacTTL.bat=1;
    this.log.push({t:'sub',text:'작전: 초구부터 적극 타격 (1타석)'});
  } else if(choice==='hold'){
    s.tac.run='hold'; this.tacTTL.run=2;
    this.log.push({t:'sub',text:'작전: 주루 자제 (2타석)'});
  } else if(choice==='normal'){
    s.tac.bat=s.tacBase.bat||'normal'; s.tac.run=s.tacBase.run||'normal';
    this.tacTTL.bat=0; this.tacTTL.run=0; this._buntRun=false;
    this.log.push({t:'sub',text:'작전: 지시 해제'});
  }
};

/* 유저가 직접 투수를 바꾼다 */
LiveGame.prototype.userPitcherChange = function(){
  const s=this.userSide();
  if(s.pIdx>=s.rot.length-1) return false;
  const old=this.curPitcher(s).name;
  s.pIdx++;
  const now=this.curPitcher(s).name;
  this.log.push({t:'sub',text: this.off().isUser
    ? `투수 교체 예고 · ${old} → ${now} (다음 수비부터)`
    : `투수 교체 · ${old} → ${now}`});
  return true;
};

/* 고의4구 — 한 타석을 그냥 내준다.
   볼넷이므로 공짜진루 지수(볼넷+도루허용+폭투)에 그대로 잡힌다.
   13경기 무예외로 14 이하면 승, 16 이상이면 패였다. 공짜로 주는 게 아니다. */
LiveGame.prototype.intentionalWalk = function(){
  const off=this.off(), def=this.def();
  const pit=this.curPitcher(def), pl=this.pbox[pit.id];
  const slot=off.slots[off.order%9];
  const bat=off.team.players.find(p=>p.id===slot.id);
  if(!bat){ this.pending=null; return; }
  const bl=this.box[bat.id]=this.box[bat.id]||newBoxL();
  pl.bf++; bl.pa++; bl.bb++; pl.bb++; off.bbs++;
  if(this.bases[0]&&this.bases[1]&&this.bases[2]){       // 만루면 밀어내기 실점
    this.box[this.bases[2]].r++; off.runs++; this.curIR=(this.curIR||0)+1;
    pl.r++; pl.er++; bl.rbi++;
    this.bases[2]=this.bases[1]; this.bases[1]=this.bases[0];
    this.log.push({t:'play',cls:'score',text:`고의4구 밀어내기 · 1점`});
  }
  else if(this.bases[0]&&this.bases[1]){this.bases[2]=this.bases[1];this.bases[1]=this.bases[0];}
  else if(this.bases[0]){this.bases[1]=this.bases[0];}
  this.bases[0]=bat.id;
  off.order++;
  this.log.push({t:'sub',text:`고의4구 · ${bat.name}을(를) 거른다`});
  this.pending=null;
  this.tickTactics(false);
};

/* =========================================================
   감독 액션 — FM 의 벤치 반응
   ---------------------------------------------------------
   물통 차기 · 박수 · 심판 어필 · 조용히 지켜보기.
   경기당 3번. 지금 지고 있냐 이기고 있냐에 따라 결과가 다르다.
   ========================================================= */
LiveGame.prototype.mgrAction = function(kind){
  if(this.mgr.left<=0) return {ok:false, text:'더 할 수 있는 게 없다'};
  const rng=this.rng;
  const us=this.userSide(), th=this.oppSide();
  const diff=us.runs-th.runs;
  this.mgr.left--;
  let text='', sub='', d=0;

  if(kind==='bottle'){
    // 물통 차기 — 지고 있을 때 효과가 크고, 이기고 있으면 역효과
    const good = diff<0 ? 0.62 : (diff===0?0.45:0.25);
    if(rng()<good){
      d=+0.06; this.mgr.boost=(this.mgr.boost||1)*1.06;
      text=pickOne(['감독이 물통을 걷어찼다','감독이 물통을 발로 날렸다','감독이 아이스박스를 쳤다'],rng);
      sub=pickOne(['벤치가 조용해지더니 눈빛이 달라졌다','선수들이 정신을 차렸다','더그아웃 공기가 팽팽해졌다'],rng);
    } else {
      d=-0.04; this.mgr.boost=(this.mgr.boost||1)*0.96;
      text=pickOne(['감독이 물통을 걷어찼다','감독이 헬멧 통을 밀어버렸다'],rng);
      sub=pickOne(['다들 눈치만 본다. 분위기가 더 굳었다','선수들이 위축됐다','심판이 이쪽을 쳐다본다'],rng);
    }
  }
  else if(kind==='clap'){
    d=+0.03; this.mgr.boost=(this.mgr.boost||1)*1.03;
    text=pickOne(['감독이 크게 박수를 친다','감독이 파이팅을 외쳤다','감독이 하나하나 손뼉을 마주쳤다'],rng);
    sub=pickOne(['벤치가 따라 소리를 낸다','분위기가 조금 올라왔다','타석 들어가는 선수 표정이 낫다'],rng);
  }
  else if(kind==='umpire'){
    // 심판 어필 — 판정이 유리해질 수도, 역효과일 수도
    const r=rng();
    if(r<0.40){
      d=+0.05; this.mgr.boost=(this.mgr.boost||1)*1.05;
      text='감독이 심판에게 스트라이크 존을 항의했다';
      sub='심판이 고개를 끄덕였다. 다음 타석부터 존이 조금 넓어진 느낌이다';
    } else if(r<0.80){
      text='감독이 심판에게 항의했다';
      sub='심판이 손을 저었다. 달라진 건 없다';
    } else {
      d=-0.05; this.mgr.boost=(this.mgr.boost||1)*0.95;
      this.mgr.warned=true;
      text='감독이 심판에게 강하게 항의했다';
      sub='경고를 받았다. 한 번 더 하면 퇴장이다';
    }
  }
  else { // watch
    this.mgr.left++;                       // 지켜보기는 횟수를 안 쓴다
    text='감독이 팔짱을 끼고 그라운드를 본다';
    sub='아무 말도 하지 않았다';
  }
  this.log.push({t:'mgr',text:text});
  this.log.push({t:'mgr',text:'— '+sub});
  this.mgr.log.push(kind);
  return {ok:true, text:text+' — '+sub, delta:d};
};

/* 수비 시프트 — 3타석 동안 유지되고 자동으로 풀린다 */
LiveGame.prototype.setShift = function(on){
  this.shiftTTL = on?3:0;
  this.log.push({t:'sub',text: on
    ? '수비 시프트 — 당겨치는 쪽으로 몰았다 (3타석)'
    : '수비 시프트 해제'});
};

/* 수비 위치 변경 */
LiveGame.prototype.swapPos = function(idxA, idxB){
  const s=this.userSide();
  const t=s.slots[idxA].pos; s.slots[idxA].pos=s.slots[idxB].pos; s.slots[idxB].pos=t;
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idxA)} ${POSNAMES[s.slots[idxA].pos]} / ${this.nameOfSlot(idxB)} ${POSNAMES[s.slots[idxB].pos]}`});
};
LiveGame.prototype.nameOfSlot = function(i){
  const s=this.userSide();
  const p=s.team.players.find(x=>x.id===s.slots[i].id);
  return p?p.name:'?';
};
LiveGame.prototype.movePos = function(idx, pos){
  const s=this.userSide();
  const other=s.slots.findIndex((x,i)=>i!==idx&&x.pos===pos);
  if(other>=0) s.slots[other].pos=s.slots[idx].pos;
  s.slots[idx].pos=pos;
  this.recalcDef();
  this.pending=null;
  this.log.push({t:'sub',text:`수비 변경 · ${this.nameOfSlot(idx)} → ${POSNAMES[pos]}`});
};
LiveGame.prototype.recalcDef = function(){
  const s=this.userSide();
  const c=s.slots.find(x=>x.pos==='C');
  const cp=c?s.team.players.find(p=>p.id===c.id):null;
  s.cArm=(cp?cp.arm:45)-this.gearPenalty;
  if(typeof recalcTeamDefense==='function') recalcTeamDefense(s.team, s.slots, this.gearPenalty);
};

/* 대타 */
LiveGame.prototype.pinchHit = function(newId){
  const s=this.userSide();
  const idx=s.order%9;
  const oldId=s.slots[idx].id;
  const oldP=s.team.players.find(p=>p.id===oldId);
  const newP=s.team.players.find(p=>p.id===newId);
  s.slots[idx].id=newId;
  this.box[newId]=this.box[newId]||newBoxL();
  this.usedPH[oldId]=true;
  this.pending=null;
  this.log.push({t:'sub',text:`대타 · ${oldP.name} → ${newP.name}`});
};

</script>
<script>

/* ================= 플레이타임 =================
   숫자만 던져주면 감이 안 온다. '2시간 12분' 보다 '영화 한 편 봤다'가 와닿는다.
   그래서 구간마다 시간·거리에 빗댄 문장을 하나씩 붙여둔다.                 */
const PLAYTIME_SCALE=[

  [3*86400, '택배가 제주도까지 갔다가 돌아올 시간이다.'],
  [5*86400, '월화수목금. 한 주 근무시간(40시간)의 세 배를 여기에 썼다.'],
  [7*86400, '일주일. 정규시즌 한 주가 통째로 지나갔다.'],
  [14*86400,'2주. 신병교육대 절반을 여기서 보냈다.'],
  [30*86400,'한 달. 이쯤 되면 취미가 아니라 직업이다. 회비는 냈냐?'],

function fmtPlaySec(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
  if(d>0) return `${d}일 ${h}시간 ${m}분`;
  if(h>0) return `${h}시간 ${m}분`;
  if(m>0) return `${m}분`;
  return `${sec}초`;
}
function playTimeLine(sec){
  sec=Math.max(0,Math.floor(sec||0));
  let out=PLAYTIME_SCALE[0][1];
  for(let i=0;i<PLAYTIME_SCALE.length;i++){ if(sec>=PLAYTIME_SCALE[i][0]) out=PLAYTIME_SCALE[i][1]; }
  return out;
}
/* 5초마다 더한다. 탭이 뒤로 가 있으면 세지 않는다 — 켜놓기만 한 시간은 플레이가 아니다.
   5분마다 한 번씩 조용히 저장해서 브라우저를 그냥 닫아도 시간이 날아가지 않게 한다. */
let ptTimer=null, ptSavedAt=0;
function startPlayClock(){
  if(ptTimer)clearInterval(ptTimer);
  ptTimer=setInterval(()=>{
    if(!ST)return;
    if(typeof document.hidden!=='undefined'&&document.hidden)return;
    ST.playSec=(ST.playSec||0)+5;
    if((ST.playSec-ptSavedAt)>=300){ ptSavedAt=ST.playSec; saveGame(true); }
    const a=document.getElementById('pt-val'); if(a)a.textContent=fmtPlaySec(ST.playSec);
    const b=document.getElementById('pt-line'); if(b)b.textContent=playTimeLine(ST.playSec);
  },5000);
}
const POSNAMES = {C:'포수','1B':'1루','2B':'2루','3B':'3루',SS:'유격',LF:'좌익',CF:'중견',RF:'우익',DH:'지타',P:'투수'};
const ALLPOS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

let TEAMS=[], TBYID={}, ST=null, LIVE=null, playTimer=null, curView='home';
let MYID='ksh';

function avg(b){return b.ab?b.h/b.ab:0;}
function obp(b){return b.pa?(b.h+b.bb+b.hbp)/b.pa:0;}
function slg(b){const tb=b.h+b.d2+b.d3*2+b.hr*3;return b.ab?tb/b.ab:0;}
function ops(b){return obp(b)+slg(b);}
function fmt3(v){return v.toFixed(3).replace(/^0\./,'.');}
function era(p){return p.outs?(p.er*7)/(p.outs/3):0;}
function ipStr(p){return Math.floor(p.outs/3)+(p.outs%3?'.'+(p.outs%3):'');}
function blankBat(){return {g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,k:0,rbi:0,r:0,sb:0,cs:0};}
function blankPit(){return {g:0,gs:0,w:0,l:0,outs:0,h:0,r:0,er:0,bb:0,k:0,hbp:0,sbA:0};}

function effCA(pid){const b=ST&&ST.ca?ST.ca[pid]:null; if(b!=null)return b;
  const p=TBYID['wwzw'].players.find(x=>x.id===pid); return p?calcCA(p):30;}
function effPA(pid){const p=TBYID['wwzw'].players.find(x=>x.id===pid); return p?calcPA(p,META[pid]):40;}
function condLabel(v){return v>=85?'최상':v>=70?'양호':v>=55?'보통':v>=40?'저하':'최악';}
function condCls(v){return v>=70?'ok':v>=55?'mid':v>=40?'low':'bad';}
function moraleLabel(v){return v>=85?'매우 높음':v>=70?'좋음':v>=55?'보통':v>=40?'불만':'매우 불만';}
function isAvailable(pid){
  if(!ST) return true;
  if(ST.injury && ST.injury[pid]) return false;
  if(ST.absent && ST.absent[pid]) return false;
  return true;
}
function nameOf(pid){const p=TBYID['wwzw'].players.find(x=>x.id===pid);return p?p.name:pid;}
/* 몸값 변동 화살표 — 지난 경기 대비 */
function valDelta(pid, now){
  const prev=(ST.valuePrev&&ST.valuePrev[pid]);
  if(prev==null) return '';
  const d=now-prev;
  if(Math.abs(d)<0.15) return '';
  return d>0 ? `<i class="vup">▲${d.toFixed(1)}</i>` : `<i class="vdn">▼${Math.abs(d).toFixed(1)}</i>`;
}
/* 우리 팀·상대 팀 가리지 않고 투수 이름을 찾는다 (승패투수 표시용) */
function pitcherName(pid){
  for(const t of TEAMS){
    const p=(t.pitchers||[]).find(x=>x.id===pid)||(t.players||[]).find(x=>x.id===pid);
    if(p)return p.name;
  }
  return pid;
}
function isMe(pid){ return pid===(ST?ST.playerId:MYID); }

/* ---------- 시즌 ---------- */
function newSeason(){
  const seed=(Date.now()^(Math.random()*1e9))>>>0;
  const rng=makeRng(seed);
  const opps=TEAMS.filter(t=>t.id!=='wwzw').map(t=>t.id);
  for(let i=opps.length-1;i>0;i--){const j=(rng()*(i+1))|0;[opps[i],opps[j]]=[opps[j],opps[i]];}
  const schedule=opps.map((o,i)=>({round:i+1,opp:o,homeGame:i%2===0,played:false,result:null,park:PARKS[(i*7+3)%PARKS.length].id}));
  const stand={}; TEAMS.forEach(t=>stand[t.id]={w:0,l:0,t:0,rf:0,ra:0,g:0});
  const bat={},pit={},lgBat={},lgPit={},rest={};
  const us=TBYID['wwzw'];
