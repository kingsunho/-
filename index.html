    if(hotL.length)parts.push(`${FORM_HOT} <b>${hotL.map(p=>p.name).join(', ')}</b>`);
    if(coldL.length)parts.push(`${FORM_COLD} <b>${coldL.map(p=>p.name).join(', ')}</b>`);
    fl.innerHTML='<b>폼</b> — '+parts.join(' &nbsp;/&nbsp; ')
      +'<br>뜨거운 선수는 위 타순, 슬럼프는 아래로 내려라.';
    mood.appendChild(fl);
  }

  // 불씨 — 아직 불만은 아닌데 쌓이는 중인 것들. 터지기 전에 손 쓰라는 신호다.
  const spk=us.players.filter(p=>{
    const sp=sparkOf(ST,p.id);
    return sp.n>=2 && !(ST.unhappy&&ST.unhappy[p.id]&&ST.unhappy[p.id].level>=2);
  });
  if(spk.length){
    const line=el('p','muted');
    const top=spk.slice().sort((a,b)=>sparkOf(ST,b.id).n-sparkOf(ST,a.id).n);
    const shown=top.slice(0,3).map(p=>{
      const sp=sparkOf(ST,p.id);
      return `${p.name}(${sparkLabel(sp)} · ${sp.n}/${sparkFuse(p.id)})`;
    }).join(', ');
    line.innerHTML='<b>불만 조짐</b> — '+shown+(top.length>3?` 외 ${top.length-3}명`:'')
      +'<br>아직 참는 중이다. 이 상태에서 또 벤치에 두거나 하위타순에 넣으면 터진다.';
    mood.appendChild(line);
  }
  c.appendChild(mood);

  // 내가 상을 받았다 — 뭐라고 대답할지 고른다
  if(ST.awardReply){
    const ar=el('div','card po-card');
    ar.appendChild(el('div','card-h','수상'));
    ar.appendChild(el('p','muted',''));
    ar.lastChild.innerHTML=`단톡방이 시끄럽다. <b>${nameOf(ST.playerId||MYID)}</b>이(가) `+
      `<b>${ST.awardReply.label}</b>을(를) 받았다. ${ST.awardReply.value||''}<br>뭐라고 할까.`;
    AWARD_REPLIES.forEach(r=>{
      const b=el('button','sendopt');
      b.innerHTML=`<b>${r.label}</b><span>${r.d}</span>`;
      b.onclick=()=>{ answerAward(r.k); go('kakao'); };
      ar.appendChild(b);
    });
    c.appendChild(ar);
  }

  // 플레이오프
  if(ST.playoff){
    const po=ST.playoff;
    const pc2=el('div','card po-card');
    pc2.appendChild(el('div','card-h','단원리그 C 플레이오프'));
    const seedList=el('div','po-seeds');
    po.seeds.forEach((id,i)=>{
      const r=el('div','po-seed'+(id==='wwzw'?' me':''));
      r.innerHTML=`<b>${i+1}</b><span>${poName(id)}</span>`;
      seedList.appendChild(r);
    });
    pc2.appendChild(seedList);
    po.log.forEach(l=>pc2.appendChild(el('div','po-log',l)));
    if(po.done){
      pc2.appendChild(el('div','po-fin',
        po.place==='탈락' ? '플레이오프 진출 실패' : `${po.place} · 상금 ${po.prize}만원`));
    } else {
      const nx=ST.schedule[ST.round];
      pc2.appendChild(el('div','po-next',
        `${po.stage==='final'?'결승':'준결승'} 상대 ${nx?poName(nx.opp):'-'}`));
    }
    pc2.appendChild(el('p','muted','우승 50만원 · 준우승 30만원 · 공동 3위 10만원. 무승부는 정규시즌 순위가 높은 팀이 올라간다.'));
    c.appendChild(pc2);
  }

  // 전시장
  const meId0=ST.playerId||MYID;
  const myHall=(ST.hall||[]).filter(h=>h.pid===meId0).length;
  const hc=el('div','card');
  hc.innerHTML=`<div class="card-h">전시장</div>
    <p class="muted"><b>${nameOf(meId0)}</b> 수상 <b>${myHall}</b>개 · 팀 타이틀 <b>${(ST.hall||[]).filter(h=>h.scope==='팀').length}</b>개</p>`;
  const hb=el('button','btn','트로피 보러 가기');
  hb.onclick=()=>{hallWho=meId0;go('hall');};
  hc.appendChild(hb);
  c.appendChild(hc);

  // 플레이타임
  const ptc=el('div','card');
  ptc.innerHTML=`<div class="card-h">플레이타임</div>
    <div class="pt-big" id="pt-val">${fmtPlaySec(ST.playSec)}</div>
    <p class="muted" id="pt-line">${playTimeLine(ST.playSec)}</p>`;
  c.appendChild(ptc);

  // 면담에서 한 약속 — 라인업 짜기 전에 보이게 홈에 띄운다
  const proms=Object.keys(ST.promise||{}).filter(pid=>us.players.some(p=>p.id===pid));
  if(proms.length){
    const pc=el('div','card');
    pc.appendChild(el('div','card-h','약속한 것'));
    proms.forEach(pid=>{
      const r=el('div','prom-row');
      r.innerHTML=`<span>${nameOf(pid)}</span><b>${promiseLabel(ST.promise[pid])}</b>`;
      pc.appendChild(r);
    });
    pc.appendChild(el('p','muted','약속을 어기면 사기 -20에 불만이 2단계 오른다. 결장한 경기는 세지 않는다.'));
    c.appendChild(pc);
  }

  // ??? 이벤트
  if(ST.mystery){
    const my=ST.mystery;
    const mc=el('div','card mystery');
    mc.innerHTML=`<div class="card-h">???</div>
      <div class="my-q">?</div>
      <p class="muted">경기가 끝나고 ${my.name}에게 뭔가 일어난 것 같다.</p>`;
    const b=el('button','btn primary','확인한다');
    b.onclick=()=>{
      const r=applyMystery(ST,my);
      let msg;
      if(!r) msg=`${my.name}은(는) 별일 없었다.`;
      else if(r.after>r.before) msg=`${my.name} ${r.stat} ${r.before} → ${r.after} 상승!`;
      else msg=`${my.name} ${r.stat} ${r.before} → ${r.after} 하락...`;
      ST.mystery=null;
      ST.mysteryResult=msg;
      saveGame(true); go('home'); toast(msg);
    };
    mc.appendChild(b);
    c.appendChild(mc);
  }
  if(ST.mysteryResult){
    c.appendChild(el('div','card',ST.mysteryResult));
    ST.mysteryResult=null;
  }


  /* ---- 감독 면담 ---- 내 성적을 두고 감독이 부른다 */
  if(ST.bossTalk){
    const B=ST.bossTalk;
    const bc=el('div','card');
    bc.innerHTML=`<div class="card-h">${nameOf(B.boss)}에게서 카톡</div>`;
    const room=el('div','kakao');
    B.log.forEach(m=>{
      const mine=m.who===(ST.playerId||MYID);
      const wd=el('div','kmsg'+(mine?' mine':'')+(m.type==='notice'?' notice':''));
      wd.innerHTML=`${(mine||m.type==='notice')?'':`<div class="kname">${nameOf(m.who)}</div>`}`+
        `<div class="kbub ${B.tier==='bad'&&!m.type?'angry':(B.tier==='good'&&!m.type?'happy':'')}">`+
        `${String(m.text).replace(/\n/g,'<br>')}</div>`;
      room.appendChild(wd);
    });
    bc.appendChild(room);
    if(B.step===0){
      const box=el('div','card sendbox');
      box.appendChild(el('div','card-h','뭐라고 답할까'));
      [['humble','더 열심히 하겠다고 한다','사기 +6 · 감독 호감 +8'],
       ['fight','자신 있다고 받아친다','사기 +10 / 성적이 나쁘면 역효과'],
       ['excuse','사정이 있었다고 한다','사기 -4 · 감독 호감 -6']].forEach(([k,n,d2])=>{
        const b=el('button','sendopt bossopt');
        b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
        b.onclick=()=>{
          const me=ST.playerId||MYID;
          B.log.push({who:me,text:n});
          const rep2=pickOne(BOSS_REPLY[k][B.tier]);
          B.log.push({who:B.boss,text:rep2});
          let dm=0, db=0;
          if(k==='humble'){dm=6;db=8;}
          else if(k==='fight'){dm=B.tier==='bad'?-6:10;db=B.tier==='bad'?-4:6;}
          else {dm=-4;db=-6;}
          ST.morale[me]=Math.max(10,Math.min(100,(ST.morale[me]||70)+dm));
          if(ST.bond)bondAdd(B.boss,db);
          B.log.push({who:B.boss,type:'notice',
            text:`내 사기 ${dm>=0?'+':''}${dm} · ${nameOf(B.boss)}와의 우정 ${db>=0?'+':''}${db}`});
          B.step=1;
          ST.bossTalkCount=(ST.bossTalkCount||0)+1;
          ST.bossTalkAt=ST.schedule.filter(x=>x.played).length;
          saveGame(true); go('home');
        };
        box.appendChild(b);
      });
      bc.appendChild(box);
    } else {
      const done=el('button','btn primary','대화 종료');
      done.onclick=()=>{ST.bossTalk=null;saveGame(true);go('home');};
      bc.appendChild(done);
    }
    c.appendChild(bc);
  }

  /* ---- 시즌 초 장비 구매 안건 ---- 사자는 쪽과 아끼자는 쪽이 갈린다 */
  if(ST.round===0 && !ST.gearMeeting){
    ST.gearMeeting={done:false};
  }
  if(ST.gearMeeting && !ST.gearMeeting.done){
    const gc=el('div','card');
    gc.innerHTML=`<div class="card-h">시즌 준비 · 장비 안건</div>
      <p class="muted">단톡방에서 뭘 살지로 말이 오간다. 운영비 <b>${ST.budget.toFixed(0)}만원</b>.
      시즌이 끝나면 다음 시즌 리그 가입비 <b>${LEAGUE_FEE}만원</b>을 내야 한다. 다 쓰면 회비를 걷어야 한다.</p>`;
    GEAR_ITEMS.forEach(g=>{
      const lv=gearLv(g.id), cost=gearCost(g.id), maxed=lv>=GEAR_MAX_LV, poor=ST.budget<cost;
      const b=el('button','sendopt'+(maxed?' bought':''));
      const forL=pickOne(GEAR_FOR), agL=pickOne(GEAR_AGAINST);
      const a=speakers(ST,null,2,Math.random);
      b.innerHTML=`<b>${lv?`${g.name} 강화 (${gearLabel(g.id)} → ${['','기본','보강','최상'][Math.min(3,lv+1)]})`:g.name} · ${maxed?'최상 등급':cost+'만원'}</b>`+
        `<span>${g.desc}<br>${g.effect}${lv?` · 지금 ${gearLabel(g.id)} 등급`:''}`+
        (maxed?'':`<br><i class="gfor">${a[0]?nameOf(a[0].id)+': ':''}${a[0]?sayTo(a[0].id,ST.playerId,forL[0],forL[1]):''}</i>`+
             `<br><i class="gag">${a[1]?nameOf(a[1].id)+': ':''}${a[1]?sayTo(a[1].id,ST.playerId,agL[0],agL[1]):''}</i>`)+
        `</span>`;
      if(!maxed&&!poor)b.onclick=()=>{
        ST.budget-=cost;
        const nl=gearBuy(g.id);
        if(g.eff.gear)ST.gearLevel=0;
        TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+5));
        ST.kakao=ST.kakao||[];
        ST.kakao.push({who:'lg',type:'notice',
          text:`${g.name} ${nl>1?'강화':'구매'} — ${cost}만원\n${gearLabel(g.id)} 등급\n전원 사기 +5`});
        saveGame(true); go('home'); toast(`${g.name} ${gearLabel(g.id)}`);
      };
      else if(poor&&!maxed) b.onclick=()=>toast(`운영비가 부족하다 (${cost}만원 필요)`);
      gc.appendChild(b);
    });
    const done=el('button','btn','장비 얘기 마무리');
    done.onclick=()=>{ST.gearMeeting.done=true;saveGame(true);go('home');toast('시즌 준비 완료');};
    gc.appendChild(done);
    c.appendChild(gc);
  }

  /* ---- 시즌 말 리그 가입비 ---- 모자라면 회비를 걷어야 한다 */
  if(ST.feeDue){
    const need=Math.max(0, LEAGUE_FEE-ST.budget);
    const fc=el('div','card');
    fc.innerHTML=`<div class="card-h">다음 시즌 리그 가입비</div>
      <p class="muted">협회에 <b>${LEAGUE_FEE}만원</b>을 내야 다음 시즌을 뛴다.
      현재 운영비 <b>${ST.budget.toFixed(0)}만원</b>.
      ${need>0?`<span class="warnx">${need}만원이 모자란다.</span>`:'낼 수 있다.'}</p>`;
    if(need>0){
      const n=TBYID['wwzw'].players.filter(p=>!isMerc(p.id)).length||1;
      const b=el('button','btn danger',`회비 걷는다 (인당 ${Math.ceil(need/n)}만원)`);
      b.onclick=()=>{
        const r=collectDues(need);
        ST.kakao=ST.kakao||[];
        r.msgs.forEach(m=>ST.kakao.push(m));
        saveGame(true); go('kakao');
        toast(`회비 ${r.per}만원씩 ${r.n}명 — ${r.total}만원`);
      };
      fc.appendChild(b);
    } else {
      const b=el('button','btn primary',`가입비 ${LEAGUE_FEE}만원 납부`);
      b.onclick=()=>{
        ST.budget-=LEAGUE_FEE; ST.feeDue=false;
        ST.kakao=ST.kakao||[];
        ST.kakao.push({who:'lg',type:'notice',
          text:`다음 시즌 리그 가입비 ${LEAGUE_FEE}만원 납부 완료\n남은 운영비 ${ST.budget.toFixed(0)}만원`});
        saveGame(true); go('home'); toast('가입비 납부 완료');
      };
      fc.appendChild(b);
    }
    c.appendChild(fc);
  }

  // 친구의 술 약속
  if(ST.drinkInvite && TBYID['wwzw'].players.some(p=>p.id===ST.drinkInvite.pid)){
    const pid=ST.drinkInvite.pid;
    const me=ST.playerId||MYID;
    const dc=el('div','card');
    dc.innerHTML=`<div class="card-h">${nameOf(pid)}에게서 연락</div>
      <p class="muted">${ST.drinkInvite.line||sayTo(pid,me,...pickOne(DRINK_INVITE))}</p>
      <div class="pc-prom">지금 우정 ${bondLabel(bondOf(pid))} (${bondOf(pid)})</div>`;
    const g=el('div','tac-grid');
    [['yes','나간다','우정 +12 · 둘 다 사기 +10 / 다음 경기 컨디션 -18'],
     ['no','안 나간다','우정 -10 · 컨디션은 지킨다']].forEach(([k,n,d2])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
      b.onclick=()=>{
        ST.kakao=ST.kakao||[];
        if(k==='yes'){
          bondAdd(pid,12);
          [pid,me].forEach(id=>{
            if(!TBYID['wwzw'].players.some(p=>p.id===id))return;
            ST.morale[id]=Math.min(100,(ST.morale[id]||70)+10);
            ST.cond[id]=Math.max(20,(ST.cond[id]||70)-18);
          });
          if(ST.unhappy[pid])ST.unhappy[pid].level=Math.max(0,ST.unhappy[pid].level-1);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(DRINK_YES)),mood:'happy'});
          toast(`${nameOf(pid)}과(와) 한잔했다 — 사기↑ 컨디션↓`);
        } else {
          bondAdd(pid,-10);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(DRINK_NO)),mood:'sad'});
          toast(`${nameOf(pid)} 약속 거절 — 우정 하락`);
        }
        ST.drinkInvite=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    dc.appendChild(g); c.appendChild(dc);
  }

  // 타팀 영입 제안 — 타순 보장을 요구한다
  if(ST.poach && TBYID['wwzw'].players.some(p=>p.id===ST.poach.pid)){
    const pid=ST.poach.pid, om=ST.poach.orderMax||3;
    const me=ST.playerId||MYID;
    const pc2=el('div','card');
    pc2.innerHTML=`<div class="card-h">타팀 영입 제안 · ${nameOf(pid)}</div>
      <p class="muted">${ST.poach.line||sayTo(pid,me,...pickOne(POACH_LINES))}</p>
      <div class="pc-prom">${om}번 타순 이상 · 5경기 보장을 요구한다</div>`;
    const g=el('div','tac-grid');
    [['keep',`${om}번 타순 이상 약속`,'5경기 보장. 어기면 사기 -20 · 불만 +2'],
     ['no','약속 안 한다','불만 2단계 상승 · 이적 요구로 번질 수 있다']].forEach(([k,n,d2])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
      b.onclick=()=>{
        ST.kakao=ST.kakao||[];
        if(k==='keep'){
          ST.promise=ST.promise||{};
          ST.promise[pid]={type:'order',games:5,orderMax:om};
          ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+12);
          if(ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
          bondAdd(pid,6);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(POACH_STAY)),mood:'happy'});
          toast(`${nameOf(pid)} 잔류 — ${om}번 타순 이상 5경기`);
        } else {
          if(!ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
          ST.unhappy[pid].level=Math.min(4,ST.unhappy[pid].level+2);
          ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-12);
          bondAdd(pid,-12);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(POACH_LEAVE)),mood:'angry'});
          toast(`${nameOf(pid)} 불만 상승`);
        }
        ST.poach=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    pc2.appendChild(g); c.appendChild(pc2);
  }

  // 이적 요구 면담
  if(ST.transferReq){
    const pid=ST.transferReq;
    const tc=el('div','card');
    tc.innerHTML=`<div class="card-h">이적 문의 · ${nameOf(pid)}</div>
      <p class="muted">${nameOf(pid)}이(가) 다른 팀에서 연락이 왔다고 한다. 어떻게 할까?</p>`;
    const g=el('div','tac-grid');
    [['keep','붙잡는다','다음 3경기 선발 약속 · 사기 회복'],
     ['money','회식 한번 쏜다','운영비 20만원 · 사기 소폭 회복'],
     ['let','보낸다','로스터에서 제외']].forEach(([k,n,d])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d}</span>`;
      b.onclick=()=>{
        if(k==='keep'){ ST.unhappy[pid]={level:0,streak:0};
          ST.morale[pid]=Math.min(100,ST.morale[pid]+22); ST.promise=ST.promise||{};
          ST.promise[pid]={type:'start',games:3,orderMax:3};
          toast(`${nameOf(pid)} 잔류 — 3경기 선발 약속`); }
        else if(k==='money'){
          if(ST.budget<20){toast('운영비가 부족하다');return;}
          ST.budget-=20; ST.unhappy[pid].level=Math.max(0,ST.unhappy[pid].level-2);
          ST.morale[pid]=Math.min(100,ST.morale[pid]+14); toast('회식으로 달랬다'); }
        else {
          const us2=TBYID['wwzw'];
          const i=us2.players.findIndex(p=>p.id===pid);
          if(i>=0)us2.players.splice(i,1);
          ST.lineup=ST.lineup.filter(s=>s.id!==pid);
          if(ST.lineup.length<9)ST.lineup=recommendLineup();
          ST.rotation=ST.rotation.filter(x=>x!==pid);
          if(!ST.rotation.length)ST.rotation=recommendRotation();
          finalizeTeam(us2); buildPitcherPool();
          us2.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-6));
          toast(`${nameOf(pid)} 이적`);
        }
        ST.transferReq=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    tc.appendChild(g); c.appendChild(tc);
  }

  if(ST.seasonOver){
    if(!ST.awards){
      ST.awards=buildAwards(ST);
      /* 시즌 시상과 팀 타이틀을 전시장에 남긴다 */
      if(!Array.isArray(ST.hall))ST.hall=[];

/* =========================================================
   용병 운용
   ---------------------------------------------------------
   용병은 로스터에 상주하지 않는다. ST.mercs 에 담긴 동안만
   TBYID['wwzw'].players 에 얹혀 있다가 경기가 끝나면 빠진다.
   기록(ST.bat)도 같이 지워서 통산기록·시상식에 안 섞이게 한다.
   ========================================================= */
function ensureMercs(){
  const us=TBYID['wwzw'];
  if(!Array.isArray(ST.mercs))ST.mercs=[];
  ST.mercs=ST.mercs.filter(id=>isMerc(id));
  let changed=false;
  ST.mercs.forEach(id=>{
    if(us.players.some(p=>p.id===id))return;
    const m=mercDef(id); if(!m)return;
    us.players.push({id:m.id,name:m.name,bats:m.bats,no:mercNo(m),
      con:m.con,pow:m.pow,eye:m.eye,spd:m.spd,def:m.def,arm:m.arm,
      pos:Object.keys(m.pos).filter(k=>m.pos[k]>0&&k!=='DH'),
      pitch:null,real:null});
    META[m.id]={born:2000,speech:'jon',throws:m.throws,car:false,school:'-',
      drink:1,attend:1.0,loyal:0,pot:0,traits:['용병'],friends:[],rival:null,
      coach:{},pos:{...m.pos},desc:m.desc};
    ST.bat[m.id]=ST.bat[m.id]||blankBat();
    if(ST.cond[m.id]==null)ST.cond[m.id]=70;
    if(ST.morale[m.id]==null)ST.morale[m.id]=60;
    if(ST.injury[m.id]===undefined)ST.injury[m.id]=null;
    ST.ca[m.id]=calcCA(us.players[us.players.length-1]);
    if(ST.caStart)ST.caStart[m.id]=ST.ca[m.id];
    changed=true;
  });
  if(changed){ finalizeTeam(us); buildPitcherPool(); }
  return changed;
}

/* 용병을 부른다. 운영비가 모자라면 못 부른다. */
function hireMerc(id){
  const m=mercDef(id);
  if(!m) return {ok:false,msg:'그런 사람 없다'};
  if(!Array.isArray(ST.mercs))ST.mercs=[];
  if(ST.mercs.indexOf(id)>=0) return {ok:false,msg:`${m.name}은(는) 이미 불렀다`};
  if(ST.budget < m.fee) return {ok:false,msg:`운영비가 부족하다 (${m.fee}만원 필요)`};
  ST.budget-=m.fee;
  ST.mercs.push(id);
  ensureMercs();
  // 용병을 쓰면 팀 분위기가 좋을 리 없다
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;
    ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-3);
  });
  ST.kakao=ST.kakao||[];
  ST.kakao.push({who:'lg',type:'notice',
    text:`용병 ${m.name} 섭외 — ${m.fee}만원 지출\n전원 사기 -3`});
  ST.kakao.push({who:pickOne(['lg','swm','kig']),
    text:pickOne(['또 용병이냐...','9명은 좀 채우자 진짜','내년엔 사람 좀 늘리자',
                  '이러다 매주 용병 부르겠다']),mood:'sad'});
  return {ok:true,msg:`${m.name} 합류 — ${m.fee}만원`};
}

/* 경기가 끝났거나 취소됐을 때 용병을 로스터에서 뺀다.
   refund=true 면(우천 취소 등) 비용을 돌려준다.                       */
function releaseMercs(refund){
  if(!Array.isArray(ST.mercs)||!ST.mercs.length)return 0;
  const us=TBYID['wwzw'];
  let back=0;
  ST.mercs.forEach(id=>{
    const m=mercDef(id);
    if(refund&&m)back+=m.fee;
    const i=us.players.findIndex(p=>p.id===id);
    if(i>=0)us.players.splice(i,1);
    delete ST.bat[id]; delete ST.cond[id]; delete ST.morale[id];
    delete ST.injury[id]; delete ST.ca[id];
    // 리그 순위표·통산기록·시상식에 용병이 남으면 안 된다
    if(ST.lgBat)delete ST.lgBat[id];
    if(ST.lgPit)delete ST.lgPit[id];
    if(ST.career)delete ST.career[id];
    if(ST.caStart)delete ST.caStart[id];
    if(ST.unhappy)delete ST.unhappy[id];
    if(ST.promise)delete ST.promise[id];
    if(ST.meetRound)delete ST.meetRound[id];
    if(ST.buff)delete ST.buff[id];
    if(ST.pit)delete ST.pit[id];
    if(ST.rest)delete ST.rest[id];
    if(ST.meet&&ST.meet.pid===id)ST.meet=null;
    if(ST.mystery&&ST.mystery.id===id)ST.mystery=null;
    delete META[id];
  });
  const n=ST.mercs.length;
  ST.mercs=[];
  ST.budget+=back;
  ST.lineup=(ST.lineup||[]).filter(sl=>!isMerc(sl.id));
  if(ST.lineup.length<9)ST.lineup=recommendLineup();
  ST.rotation=(ST.rotation||[]).filter(x=>!isMerc(x));
  if(!ST.rotation.length)ST.rotation=recommendRotation();
  if(ST.lastLineup)ST.lastLineup=ST.lastLineup.filter(x=>!isMerc(x.id));
  if(ST.trainTarget&&isMerc(ST.trainTarget))ST.trainTarget=null;
  finalizeTeam(us); buildPitcherPool(); applyDHRule();
  return n;
}

/* 용병 섭외 시트 */
function openMercSheet(after){
  const body=$('#sheet-body'); body.innerHTML='';
  const need=Math.max(0,9-TBYID['wwzw'].players.filter(p=>isAvailable(p.id)).length);
  $('#sheet-title').textContent=`용병 섭외 · ${need}명 더 필요`;
  const note=el('div','sheet-note',
    `경기당 비용이 나가고 부를 때마다 전원 사기가 3씩 깎인다. 현재 운영비 ${ST.budget.toFixed(0)}만원.`);
  body.appendChild(note);
  MERCS.forEach(m=>{
    const already=(ST.mercs||[]).indexOf(m.id)>=0;
    const poor=ST.budget<m.fee;
    const r=el('button','pick-row'+(already?' cur':'')+(poor&&!already?' bad':''));
    const canPos=Object.keys(m.pos).filter(k=>k!=='DH'&&m.pos[k]>0);
    r.innerHTML=`<div class="pk-l"><div class="pk-name">${m.name}${already?' · 합류함':''}</div>
      <div class="pk-note">${m.desc}<br>가능 포지션 ${canPos.length?canPos.map(k=>POSNAMES[k]).join('·'):'없음'}</div></div>
      <div class="pk-r"><div class="pk-stat">${m.fee}만원</div></div>`;
    if(!already&&!poor)r.onclick=()=>{
      const res=hireMerc(m.id);
      toast(res.msg);
      if(res.ok){ saveGame(true); closeSheet(); if(after)after(); }
    };
    body.appendChild(r);
  });
  $('#sheet').classList.add('open');
}

function forfeit(){
  releaseMercs(true);                 // 경기를 안 했으니 용병 비용은 돌려받는다
  const sch=ST.schedule[ST.round];
  sch.played=true; sch.result={us:0,them:7};
  const u=ST.stand['wwzw'], t=ST.stand[sch.opp];
  u.g++;t.g++;u.l++;t.w++;u.ra+=7;t.rf+=7;
  TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-10));
  if(!sch.po) simOtherGames(sch.opp);
  ST.round++;ST.weekDone=false;ST.events=[];
  if(sch.po) advancePlayoff(false,false,0,7);
  else if(ST.round>=ST.schedule.length) startPlayoff();
  saveGame(true);go('home');toast('몰수패');
}

function scoutLine(opp){
  const b=[];
  if(opp.tend.pow>=1.2)b.push('장타력 상위');
  if(opp.tend.sb>=1.3)b.push('도루 극단적');
  else if(opp.tend.sb<=0.7)b.push('거의 안 뜀');
  if(opp.tend.bb>=1.2)b.push('볼넷 잘 골라냄');
  if(opp.tend.k<=0.7)b.push('삼진 안 당함');
  else if(opp.tend.k>=1.25)b.push('삼진 많음');
  if(opp.tend.err>=1.15)b.push('수비 불안');
  const a=opp.pitchers[0];
  b.push(`선발 ${a.name} (구위 ${a.stf}/제구 ${a.ctl})`);
  return b.join(' · ');
}
/* ================= 플레이오프 =================
   단원리그 C 규정. 정규시즌이 끝나면 상위 4팀이 붙는다.
     준결승  1위 vs 4위 · 2위 vs 3위
     결승    준결승 승자끼리
   상금  우승 50만원 · 준우승 30만원 · 공동 3위(준결승 패자) 각 10만원
   무승부는 정규시즌 순위가 높은 쪽이 올라간다.                        */
const PO_PRIZE={win:50, runner:30, third:10};
function poSeeds(){
  return TEAMS.slice().sort((x,y)=>{
    const A=ST.stand[x.id],B=ST.stand[y.id];
    const pa=A.g?A.w/A.g:0,pb=B.g?B.w/B.g:0;
    if(pb!==pa)return pb-pa; return (B.rf-B.ra)-(A.rf-A.ra);
  }).slice(0,4).map(t=>t.id);
}
/* 우리가 안 낀 경기는 그냥 돌린다. 무승부면 상위 시드가 올라간다. */
function poSim(aId,bId,seedOf){
  const A=TBYID[aId], B=TBYID[bId];
  const rng=makeRng((ST.seed+aId.length*7919+bId.length*104729+ST.round*31)>>>0);
  const r=simGame(A,B,{rng,innings:7,awayLineup:aiLineup(B),awayRotation:aiRotation(B),
    homeLineup:aiLineup(A),homeRotation:aiRotation(A)});
  let winner;
  if(r.tie) winner = seedOf(aId)<seedOf(bId)?aId:bId;
  else winner = r.home.runs>r.away.runs?aId:bId;
  return {winner, loser:winner===aId?bId:aId, hs:r.home.runs, as:r.away.runs, tie:r.tie};
}
function poName(id){ return TBYID[id]?TBYID[id].name:id; }

/* 정규시즌이 끝난 직후 한 번 불린다 */
function startPlayoff(){
  const seeds=poSeeds();
  const seedOf=id=>{const i=seeds.indexOf(id);return i<0?99:i;};
  ST.playoff={seeds, stage:'sf', log:[], prize:0, place:null, done:false};
  const me=seeds.indexOf('wwzw');
  if(me<0){
    /* 우리가 못 올라갔다. 남의 잔치는 돌려서 결과만 본다. */
    const s1=poSim(seeds[0],seeds[3],seedOf), s2=poSim(seeds[1],seeds[2],seedOf);
    const f=poSim(s1.winner,s2.winner,seedOf);
    ST.playoff.log=[
      `준결승 ${poName(seeds[0])} ${s1.hs}:${s1.as} ${poName(seeds[3])} → ${poName(s1.winner)}`,
      `준결승 ${poName(seeds[1])} ${s2.hs}:${s2.as} ${poName(seeds[2])} → ${poName(s2.winner)}`,
      `결승 ${poName(f.winner)} 우승`];
    ST.playoff.done=true; ST.playoff.place='탈락';
    ST.seasonOver=true; ST.feeDue=true;
    ST.notices.push({type:'po',title:'플레이오프 진출 실패',
      body:`정규시즌 ${leagueRank('wwzw')}위. 상위 4팀에 못 들었다.`,
      effect:`${poName(f.winner)} 우승 · 상금 없음`});
    return;
  }
  /* 우리 준결승 상대를 일정 뒤에 붙인다. 나머지는 평소 흐름 그대로다. */
  const opp=seeds[3-me];
  ST.schedule.push({round:ST.schedule.length+1, opp, homeGame:me<2, played:false, result:null,
    park:PARKS[(ST.schedule.length*7+3)%PARKS.length].id, po:'sf'});
  ST.notices.push({type:'po',title:'플레이오프 진출',
    body:`정규시즌 ${me+1}위로 4강에 올랐다. 준결승 상대는 ${poName(opp)}(${seeds.indexOf(opp)+1}위)다.`,
    effect:'우승 50만원 · 준우승 30만원 · 공동 3위 10만원'});
}

/* 플레이오프 경기를 하나 치른 뒤 */
function advancePlayoff(won, tie, myRuns, oppRuns){
  const po=ST.playoff; if(!po||po.done)return [];
  const seeds=po.seeds, seedOf=id=>{const i=seeds.indexOf(id);return i<0?99:i;};
  const me=seeds.indexOf('wwzw');
  const sch=ST.schedule[ST.round-1];
  const msgs=[];
  /* 무승부면 정규시즌 순위가 높은 쪽이 올라간다 */
  const advance = tie ? (seedOf('wwzw')<seedOf(sch.opp)) : won;

  if(po.stage==='sf'){
    po.log.push(`준결승 우완좌완 ${myRuns}:${oppRuns} ${poName(sch.opp)}`
      +(tie?' (무승부 — 정규시즌 순위로 판정)':''));
    if(!advance){
      po.place='공동 3위'; po.prize=PO_PRIZE.third; po.done=true;
      ST.budget+=po.prize;
      msgs.push({who:'lg',type:'notice',
        text:`플레이오프 준결승 탈락 — 공동 3위\n상금 ${PO_PRIZE.third}만원 입금`});
      ST.seasonOver=true; ST.feeDue=true;
      return msgs;
    }
    /* 반대편 준결승을 돌리고 결승 상대를 정한다 */
    const oi=(me<2)?1:0;                       // 우리가 1·4 조면 반대는 2·3 조
    const a=seeds[oi===1?1:0], bb=seeds[oi===1?2:3];
    const other=poSim(a,bb,seedOf);
    po.log.push(`준결승 ${poName(a)} ${other.hs}:${other.as} ${poName(bb)} → ${poName(other.winner)}`);
    po.stage='final';
    ST.schedule.push({round:ST.schedule.length+1, opp:other.winner, homeGame:seedOf('wwzw')<seedOf(other.winner),
      played:false, result:null, park:'singil', po:'final'});
    msgs.push({who:'lg',type:'notice',
      text:`준결승 통과 — 결승 진출\n상대는 ${poName(other.winner)}. 이기면 50만원, 져도 30만원`});
    TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+12));
    return msgs;
  }

  if(po.stage==='final'){
    po.log.push(`결승 우완좌완 ${myRuns}:${oppRuns} ${poName(sch.opp)}`
      +(tie?' (무승부 — 정규시즌 순위로 판정)':''));
    po.done=true;
    if(advance){ po.place='우승'; po.prize=PO_PRIZE.win;
      TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=100);
      msgs.push({who:'lg',type:'notice',text:`단원리그 C 우승\n상금 ${PO_PRIZE.win}만원 입금`});
    } else { po.place='준우승'; po.prize=PO_PRIZE.runner;
      msgs.push({who:'lg',type:'notice',text:`준우승\n상금 ${PO_PRIZE.runner}만원 입금`});
    }
    ST.budget+=po.prize;
    ST.seasonOver=true; ST.feeDue=true;
    return msgs;
  }
  return msgs;
}
/* 정규시즌 경기 수 (플레이오프 제외) */
function regGames(){ return ST.schedule.filter(x=>!x.po).length; }

function leagueRank(id){
  const a=TEAMS.slice().sort((x,y)=>{
    const A=ST.stand[x.id],B=ST.stand[y.id];
    const pa=A.g?A.w/A.g:0,pb=B.g?B.w/B.g:0;
    if(pb!==pa)return pb-pa; return (B.rf-B.ra)-(A.rf-A.ra);
  });
  return a.findIndex(t=>t.id===id)+1;
}

function clayHash(id){
  let h=2166136261;
  for(let i=0;i<(id||'x').length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); }
  return Math.abs(h);
}
/* 같은 선수는 항상 같은 인형이 나오도록 id 로 색과 각도를 정한다 */
function clayAvatar(pid){
  const h=clayHash(pid);
  const L=52+(h%5)*4, hue=19+((h>>3)%14);
  const gid='clay_'+pid;
  const body=`hsl(${hue},34%,${L}%)`;
  const top=`hsl(${hue},36%,${L+10}%)`;
  const dk=`hsl(${hue},32%,${L-15}%)`;
  const dk2=`hsl(${hue},30%,${L-25}%)`;
  const cap=((h>>7)%3)!==0;
  const tilt=(((h>>11)%7)-3);
  return `<svg class="pf-clay" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${body}"/></linearGradient></defs>
    <rect width="120" height="160" fill="#1a2029"/>
    <g transform="rotate(${tilt} 60 84)">
      <path d="M20 160 C23 121 40 106 60 106 C80 106 97 121 100 160 Z" fill="url(#${gid})"/>
      <path d="M50 92 h20 v18 h-20 z" fill="${dk}"/>
      <ellipse cx="60" cy="64" rx="30" ry="34" fill="url(#${gid})"/>
      <ellipse cx="30" cy="68" rx="5" ry="8" fill="${dk}"/>
      <ellipse cx="90" cy="68" rx="5" ry="8" fill="${dk}"/>
      <ellipse cx="49" cy="64" rx="4.4" ry="3.2" fill="${dk2}"/>
      <ellipse cx="71" cy="64" rx="4.4" ry="3.2" fill="${dk2}"/>
      <path d="M60 68 q3.5 8 -2 10.5" stroke="${dk}" fill="none" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M52 85 q8 5 16 0" stroke="${dk2}" fill="none" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="41" cy="49" rx="9" ry="6" fill="#fff" opacity=".07"/>
      <ellipse cx="84" cy="124" rx="13" ry="8" fill="#000" opacity=".09"/>
      <ellipse cx="34" cy="132" rx="10" ry="7" fill="#fff" opacity=".05"/>
      ${cap?`<path d="M31 54 a29 29 0 0 1 58 0 z" fill="#1b2438"/>
        <path d="M88 54 q17 2 18 9 q-19 3 -34 -2 z" fill="#26314c"/>
        <circle cx="60" cy="27" r="3.4" fill="#26314c"/>`:''}
    </g></svg>`;
}
/* 화면에 띄우지 않는 특성.
   실제 사람이 하는 게임이라 대놓고 라벨로 붙이면 곤란한 것들이다.
   엔진에서는 그대로 돌아가고 표시만 뺀다.                              */
const HIDDEN_TRAITS=['불만러'];
function shownTraits(pid){
  const m=META[pid]; if(!m)return [];
  return (m.traits||[]).filter(t=>HIDDEN_TRAITS.indexOf(t)<0);
}
/* 별명 — 선수를 한마디로 설명하는 특성 하나를 골라 쓴다 */
const NICK_TRAITS=['안방마님','리더','감독','에이스','분석가','코치','좌완','유틸','장타형','주루형','과묵','노력파'];
function nickOf(pid){
  return shownTraits(pid).find(t=>NICK_TRAITS.indexOf(t)>=0)||'';
}
function avatarHTML(pid){
  return PHOTOS[pid]
    ? `<img class="pf-photo" src="${PHOTOS[pid]}" alt="${nameOf(pid)}">`
    : clayAvatar(pid);
}

/* 포지션 적합도 → 등급. FM 의 포지션 원과 같은 역할이다. */
function posGrade(v, cap){
  if(v<=0)   return (cap>0) ? {t:'훈련 필요',c:'train'} : {t:'불가',c:'no'};
  if(v>=55)  return {t:'주포지션',c:'best'};
  if(v>=45)  return {t:'능숙',   c:'good'};
  if(v>=35)  return {t:'가능',   c:'ok'};
  return {t:'서툼',c:'weak'};
}
const PF_ORDER=['P','C','1B','2B','3B','SS','LF','CF','RF'];

/* 무엇을 훈련시켜야 하는가 */
function trainAdvice(p){
  const KEYS=[['con','컨택','타격 훈련'],['pow','파워','타격 훈련'],
              ['eye','선구','선구안 훈련'],['spd','주루','주루 훈련'],
              ['def','수비','수비 훈련'],['arm','어깨','수비 훈련']];
  const out=[];
  const low=KEYS.slice().sort((a,b)=>p[a[0]]-p[b[0]])[0];
  out.push({h:low[2], d:`${low[1]} ${Math.round(p[low[0]])} — 이 선수가 가진 것 중 가장 낮다. 여기부터 올리는 게 효율이 좋다.`});

  const m=META[p.id]||{traits:[],pos:{}};
  const pit=TBYID['wwzw'].pitchers.find(x=>x.id===p.id);
  /* 투구 훈련은 실제로 마운드에 서는 선수한테만 권한다.
     2루수한테 제구 올리라고 하는 건 조언이 아니다. */
  const isPitcher = !!p.pitch || (m.pos && m.pos.P > 0);
  if(pit && isPitcher && pit.ctl<32)
    out.push({h:'투구 훈련', d:`제구 ${pit.ctl}. 이 팀은 사사구로 무너진다. 마운드에 세울 거면 여기가 먼저다.`});

  /* 포지션 — 주포지션에 남은 여지가 먼저, 없으면 배울 만한 옆자리 */
  const mainPos=PF_ORDER.filter(k=>posFit(p.id,k)>0)
    .sort((x,y)=>posFit(p.id,y)-posFit(p.id,x))[0];
  const NEIGHBOR={ P:['1B','RF','LF'], C:['1B','3B','LF'], '1B':['3B','LF','RF'],
    '2B':['SS','3B','1B'], '3B':['1B','SS','LF'], SS:['2B','3B'],
    LF:['RF','CF','1B'], CF:['LF','RF'], RF:['LF','CF','1B'] };
  let pa2=null;
  if(mainPos){
    const cap=posTrainCap(p.id,mainPos), fit=posFit(p.id,mainPos);
    if(cap-fit>=6) pa2={k:mainPos,fit,cap,how:'주포지션 숙련도가 아직 덜 찼다'};
  }
  if(!pa2){
    const cand=(NEIGHBOR[mainPos]||['1B','LF','RF'])
      .filter(k=>posTrainCap(p.id,k)-posFit(p.id,k)>=6)[0];
    if(cand) pa2={k:cand,fit:posFit(p.id,cand),cap:posTrainCap(p.id,cand),
      how:'새 자리를 열어두면 결장자가 나와도 라인업이 안 무너진다'};
  }
  if(pa2)
    out.push({h:`포지션 적응 — ${POSNAMES[pa2.k]}`,
      d:`${pa2.how}. 지금 ${Math.round(pa2.fit)} → 최대 ${Math.round(pa2.cap)}. 집중 훈련 대상으로 걸어두면 된다.`});

  const ca=effCA(p.id), pa=effPA(p.id);
  if(p.id===(ST.playerId||MYID))
    out.push({h:'내 선수 — 한계 없음',
      d:`현재 ${ca.toFixed(0)} / 지금 열린 잠재 ${pa.toFixed(0)}. 경기와 훈련에 계속 나가면 잠재치가 같이 올라간다. 집중 훈련 대상으로 걸어두면 제일 빨리 큰다.`});
  else if(pa-ca>=8) out.push({h:'성장 여지 있음', d:`현재 ${ca.toFixed(0)} / 잠재 ${pa.toFixed(0)}. 아직 올라갈 자리가 남았다.`});
  else out.push({h:'거의 다 왔다', d:`현재 ${ca.toFixed(0)} / 잠재 ${pa.toFixed(0)}. 큰 성장은 기대하기 어렵다.`});
  return out;
}

const DRINK_LABEL=['안 마신다','가끔 마신다','자주 마신다','끝까지 남는다'];
function personaLines(pid){
  const m=META[pid]; if(!m)return [];
  const out=[];
  out.push(['출석', `${Math.round((m.attend!=null?m.attend:0.85)*100)}%`
    + (m.attend<0.6?' — 자주 빠진다':m.attend>=0.85?' — 웬만하면 나온다':'')]);
  out.push(['회식', DRINK_LABEL[Math.min(3,m.drink||0)]]);
  out.push(['이동', m.car?'차가 있다. 다른 선수를 태우고 온다':'차가 없다. 누군가 태워줘야 한다']);
  if(m.school) out.push(['출신', m.school]);
  if(pid===(ST.playerId||MYID)) out.push(['나와의 관계','나']);
  else {
    const bd=bondOf(pid);
    out.push(['나와의 관계', `${bondLabel(bd)} (${Math.round(bd)})`]);
  }
  return out;
}

  } else {
    add(otSec('트로피','<p class="ot-note">아직 받은 상이 없다. 5경기마다 구간 시상이 있고, 시즌이 끝나면 시상식이 있다.</p>'));

  }

    teamFeats.slice().reverse().forEach(f=>{

  const cr=ST.career&&ST.career[who];

       <tbody><tr><td>${cr.g||0}</td><td>${cr.pa||0}</td><td>${cr.h||0}</td><td>${cr.hr||0}</td><td>${cr.rbi||0}</td><td>${cr.sb||0}</td></tr></tbody></table></div>`));

  c.appendChild(wrap);

  const act=el('div','btn-row');

  const bk=el('button','btn','홈으로'); bk.onclick=()=>go('home');
  act.appendChild(pb); act.appendChild(bk); c.appendChild(act);
}

        <span class="pod-p">${nmLink(c.pid,nameOf(c.pid))}</span>
        <span class="pod-v">${c.v||''}</span>
        <span class="pod-t">${meRow?(co?'공동 수상':'수상'):(co?'공동 수상':'')}</span>

/* ================= 선수 카드 (FM 식) =================
   표 안의 이름을 누르면 열린다. 우리 팀이든 상대 팀이든 똑같이 뜬다.
   상대 팀 선수는 META·성장 데이터가 없으니 능력치와 기록만 보여준다.   */
function findAnyPlayer(pid){
  /* 상대 팀은 같은 사람이라도 타자 엔트리와 투수 엔트리의 id 가 다르다
     (ansanutd_3 / ansanutd_p0). 그래서 id 로 못 찾으면 이름으로 이어 붙인다. */
  for(const t of (TEAMS||[])){
    const b=(t.players||[]).find(x=>x.id===pid);
    if(b) return {p:b, team:t,
      pit:(t.pitchers||[]).find(x=>x.id===pid||x.name===b.name)||null};
  }
  for(const t of (TEAMS||[])){
    const q=(t.pitchers||[]).find(x=>x.id===pid);
    if(q) return {p:(t.players||[]).find(x=>x.name===q.name)||null, team:t, pit:q};
  }
  return null;
}

/* 경기 후 결과 화면에서 부를 때는 그날 기록도 같이 넘긴다 */
let cardGameBox=null;      // {box, pbox} — 결과 화면이 살아 있는 동안만 채워둔다

function openPlayerCard(pid){
  const f=findAnyPlayer(pid);
  const body=$('#sheet-body'); if(!body) return;
  body.innerHTML='';
  if(!f){ $('#sheet-title').textContent='선수'; body.appendChild(el('p','muted','기록을 찾을 수 없다.'));
    $('#sheet').classList.add('open'); return; }

  const p=f.p, pit=f.pit, team=f.team, ours=team.id==='wwzw';
  const nm=p?p.name:pit.name;
  $('#sheet-title').textContent=`${nm} · ${team.name}`;

  /* 투수로 볼지 타자로 볼지 — 오늘 던졌으면 무조건 투수 카드다.
     투타 겸업(송승민·이건)은 던진 날엔 투수, 안 던진 날엔 타자로 연다. */
  const todayPit=(typeof LIVE!=='undefined'&&LIVE&&cardGameBox&&cardGameBox.pbox
                  &&cardGameBox.pbox[pid]&&cardGameBox.pbox[pid].bf)?true:false;
  const seasonPit=(ST&&ST.lgPit&&ST.lgPit[pid]&&ST.lgPit[pid].outs>0)?true:false;
  const pitFirst = !!pit && (todayPit || !p || seasonPit
                   || (ours&&META[pid]&&(META[pid].pos||{}).P>=45));

  const m=(ours&&typeof META!=='undefined'&&META[pid])?META[pid]:null;
  const main=p?PF_ORDER.filter(k=>ours?posFit(pid,k)>0:(p.pos||[]).includes(k))
                        .sort((x,y)=>ours?(posFit(pid,y)-posFit(pid,x)):0)[0]:null;

  /* ---- 머리 ---- */
  const top=el('div','pcs-top');
  top.innerHTML=`<div class="pcs-av">${ours?avatarHTML(pid):clayAvatar(pid)}</div>
    <div>
      <div class="pcs-n1">${nm}${p&&p.no!=null?`<i>#${p.no}</i>`:''}${ours&&formTag(pid)?`<span class="ftag">${formTag(pid)}</span>`:''}</div>
      <div class="pcs-n2">${team.name} · ${pitFirst?'투수':(p?(main?POSNAMES[main]:'지명타자'):'투수')}`+
      `${p?` · 타 ${p.bats==='L'?'좌':'우'}`:''}${m?` · ${2026-m.born}세`:''}</div>
      ${ours&&nickOf(pid)?`<div class="pcs-n2">'${nickOf(pid)}'</div>`:''}
    </div>`;
  body.appendChild(top);

  /* ---- 오늘 경기 ---- */
  const gb=(typeof LIVE!=='undefined'&&LIVE)?cardGameBox:null;   // 확정 전 경기만 '오늘'이다
  if(gb){
    const b=gb.box&&gb.box[pid], l=gb.pbox&&gb.pbox[pid];
    const decTag = (gb.wp===pid?' <b>승</b>':(gb.lp===pid?' <b>패</b>':''));
    const batLine = (b&&b.pa)
      ? `<div><b>${b.ab}타수 ${b.h}안타</b> · ${b.rbi}타점 ${b.r}득점`+
        `${b.d2?` · 2루타 ${b.d2}`:''}${b.d3?` · 3루타 ${b.d3}`:''}${b.hr?` · 홈런 ${b.hr}`:''}`+
        `${b.bb?` · 볼넷 ${b.bb}`:''}${b.hbp?` · 사구 ${b.hbp}`:''}${b.k?` · 삼진 ${b.k}`:''}`+
        `${b.sb?` · 도루 ${b.sb}`:''}${b.cs?` · 도루자 ${b.cs}`:''}</div>` : '';
    const pitLine = (l&&l.bf)
      ? `<div><b>${ipStr(l)}이닝 ${l.er}자책</b>${decTag} · ${l.h}피안타 ${l.r}실점 `+
        `${(l.bb||0)+(l.hbp||0)}사사구 ${l.k}삼진 · 상대 ${l.bf}타자`+
        `<br><span class="pcs-n2">ERA ${era(l).toFixed(2)} · WHIP ${whip(l).toFixed(2)}`+
        `${l.sbA?` · 도루 허용 ${l.sbA}`:''}</span></div>` : '';
    const parts=(pitFirst?[pitLine,batLine]:[batLine,pitLine]).filter(Boolean);
    const t=parts.map((x,i)=>i?x.replace('<div>','<div style="margin-top:6px">'):x).join('');
    if(t) body.appendChild(Object.assign(el('div','pcs-today'),{innerHTML:'<div class="pcs-n2" style="margin:0 0 4px">오늘 경기</div>'+t}));
  }

  const grid=el('div','ot-grid');
  const add=html=>{ const d=document.createElement('div'); d.innerHTML=html; if(d.firstElementChild)grid.appendChild(d.firstElementChild); };

  /* ---- 능력치 ---- 투수면 피칭을 위에 세운다 ---- */
  const addBatRating=()=>{
    if(!p) return;
    let bat='';
    [['컨택','con'],['파워','pow'],['선구','eye'],['주루','spd'],['수비','def'],['어깨','arm']]
      .forEach(([n,k])=>{ bat+=otBar(n, p[k], ours?otPotential(pid,k,p[k]):null); });
    add(otSec('배팅 레이팅', bat, ours?'현재 / 잠재':'현재'));
  };
  const addPitRating=()=>{
    if(!pit) return;
    let pb='';
    pb+=otBar('구위', pit.stf, null);
    pb+=otBar('제구', pit.ctl, null);
    pb+=otBar('체력', pit.sta, null);
    add(otSec('피칭 레이팅', pb));
  };
  if(pitFirst){ addPitRating(); addBatRating(); }
  else { addBatRating(); addPitRating(); }

  /* ---- 상태 (우리 팀만) ---- */
  if(ours){
    const injv=ST&&ST.injury&&ST.injury[pid];
    add(otSec('상태',
      otRow('컨디션', condLabel((ST.cond&&ST.cond[pid])||70))+
      otRow('사기', moraleLabel((ST.morale&&ST.morale[pid])||70))+
      (injv?otRow('부상', `${injv.name} · ${injv.games}경기 결장`, true):'')+
      (formTag(pid)?otRow('폼', `${formTag(pid)} ${formLabel(pid)}`):'')));
  }

  /* ---- 올 시즌 (리그 누적은 모든 선수에게 쌓인다) ---- */
  const lgw=(typeof leagueWoba==='function')?leagueWoba():null;

/* 표 안의 <td class="nm"> 안에 넣을 이름 조각. data-pid 를 달아두고
   표 전체에 위임 클릭을 걸면 행마다 핸들러를 달 필요가 없다. */
function nmLink(pid,text){ return `<span class="nml" data-pid="${pid}">${text}</span>`; }
function wireNames(root){
  if(!root) return root;
  root.addEventListener('click', ev=>{
    const t=ev.target.closest('.nml'); if(!t) return;
    ev.stopPropagation();
    const pid=t.getAttribute('data-pid'); if(pid) openPlayerCard(pid);
  });
  return root;
}

/* 능력치 막대 색 — OOTP 처럼 구간별로 색이 다르다 */
function otTier(v){ return v>=65?'t4':v>=50?'t3':v>=35?'t2':'t1'; }
/* 0.667 이닝 → '0.2' (야구식 표기) */
function ipDot(ip){
  const w=Math.floor(ip+1e-6), f=Math.round((ip-w)*3);
  return f?`${w}.${f}`:`${w}`;
}
/* 남은 성장 여지를 여섯 능력치에 고르게 나눴을 때 각자 올라가는 값.
   calcCA 의 가중치 합이 정확히 5.0 이라, 여섯 개를 똑같이 n 씩 올리면
   CA 도 정확히 n 오른다. 그래서 잠재 = 현재 + (잠재CA - 현재CA) 다.
   지어낸 숫자가 아니라 성장 공식에서 그대로 떨어지는 값이다.        */
const CA_W={con:1.3,pow:1.1,eye:0.8,spd:0.7,def:0.7,arm:0.4};
function otPotential(pid,key,cur){
  const room=effPA(pid)-effCA(pid);
  if(room<=0||!CA_W[key])return cur;
  return Math.min(80, cur+room);
}
function otBar(label,cur,pot){
  const c=Math.max(0,Math.min(80,cur)), pp=Math.max(c,Math.min(80,pot==null?c:pot));
  const num = (pot!=null&&Math.round(pp)>Math.round(c))
    ? `${Math.round(c)} / ${Math.round(pp)}` : `${Math.round(c)}`;
  return `<div class="ot-rt"><div class="ot-rt-l">${label}</div>
    <div class="ot-rt-b"><span class="ot-num ${otTier(c)}">${num}</span>
      <div class="ot-bar"><u style="width:${pp/80*100}%"></u>
        <i class="${otTier(c)}" style="width:${c/80*100}%"></i></div></div></div>`;
}
function otRow(k,v,hot){
  return `<div class="ot-r"><span>${k}</span><b${hot?' class="hot"':''}>${v}</b></div>`;
}
function otSec(title,inner,right){
  return `<div class="ot-sec"><div class="ot-h">${title}${right?`<span>${right}</span>`:''}</div>
    <div class="ot-b">${inner}</div></div>`;
}

  const lgw=leagueWoba();
  const list=us.players.slice().sort((a,b)=>{
    if(squadSort==='war')return warOf(b.id,ST.bat[b.id]||blankBat(),lgw)-warOf(a.id,ST.bat[a.id]||blankBat(),lgw);
    if(squadSort==='ca')return effCA(b.id)-effCA(a.id);
    if(squadSort==='val')return playerValue(b,META[b.id],ST.bat[b.id])-playerValue(a,META[a.id],ST.bat[a.id]);
    if(squadSort==='cond')return (ST.cond[b.id]||0)-(ST.cond[a.id]||0);
    return (ST.morale[b.id]||0)-(ST.morale[a.id]||0);
  });

  let total=0;
  list.forEach(p=>{
    const m=META[p.id]||{born:1999,traits:[],desc:''};
    const ca=effCA(p.id), pa=effPA(p.id);
    const val=playerValue(p,m,ST.bat[p.id]); total+=val;
    const b=ST.bat[p.id]||blankBat();
    const injv=ST.injury[p.id];
    const abs=ST.absent&&ST.absent[p.id];
    const card=el('div','pcard tapcard'+(injv?' injured':''));
    card.onclick=(ev)=>{ if(ev.target.closest('button'))return; openPlayer(p.id); };
    card.innerHTML=`
      <div class="pc-top">
        <div class="pc-id"><span class="pc-name">${p.name}</span>${p.no!=null?`<span class="pc-no">#${p.no}</span>`:''}${formTag(p.id)?`<span class="ftag" title="${formLabel(p.id)}">${formTag(p.id)}</span>`:''}
          <span class="pc-age">${2026-m.born}세</span>
          ${p.bats==='L'?'<span class="lh">좌</span>':''}
          ${injv?`<span class="tagx">${injv.name} ${injv.games}경기</span>`:''}
          ${abs&&!injv?`<span class="tagx">${abs}</span>`:''}</div>
        <div class="pc-val">${wonStr(val)}${valDelta(p.id,val)}</div>
      </div>
      <div class="pc-stars"><span class="lbl">현재</span>${starHTML(ca)}<span class="lbl">잠재</span>${starHTML(pa,true)}</div>
      <div class="pc-traits">${shownTraits(p.id).filter(t=>!['카풀','좌투','금주'].includes(t)).map(t=>`<span class="trait">${t}</span>`).join('')}</div>
      <div class="pc-bars">
        <div><span>컨디션</span><div class="mini"><i class="${condCls(ST.cond[p.id]||70)}" style="width:${ST.cond[p.id]||70}%"></i></div><b>${condLabel(ST.cond[p.id]||70)}</b></div>
        <div><span>사기</span><div class="mini"><i class="${(ST.morale[p.id]||70)>=70?'ok':(ST.morale[p.id]||70)>=50?'mid':'bad'}" style="width:${ST.morale[p.id]||70}%"></i></div><b>${moraleLabel(ST.morale[p.id]||70)}</b></div>
      </div>
      <div class="pc-rate"><span>컨택 ${Math.round(p.con)}</span><span>파워 ${Math.round(p.pow)}</span><span>선구 ${Math.round(p.eye)}</span><span>주루 ${Math.round(p.spd)}</span><span>수비 ${Math.round(p.def)}</span><span>어깨 ${Math.round(p.arm)}</span></div>
      <div class="pc-stat">${b.pa?`${b.g}경기 ${fmt3(avg(b))} · OPS ${ops(b).toFixed(3)} · ${b.hr}홈런 ${b.rbi}타점 ${b.sb}도루`:'출전 기록 없음'}</div>
      ${b.pa?`<div class="pc-adv">wRC+ <b>${wrcPlus(b,lgw)}</b> · WAR <b>${warOf(p.id,b,lgw).toFixed(2)}</b> · ISO ${fmt3(iso(b))} · BB/K ${bbk(b).toFixed(2)}</div>`:''}
      <div class="pc-att">출석 성향 ${Math.round((m.attend!=null?m.attend:0.85)*100)}%${(m.attend!=null&&m.attend<0.6)?' · 자주 빠진다':''}</div>
      <div class="pc-desc">${m.desc||''}</div>`;
    // 진행 중인 약속을 카드에 바로 보여준다
    const pr=ST.promise&&ST.promise[p.id];
    if(pr) card.appendChild(el('div','pc-prom','약속: '+promiseLabel(pr)));
    // 훈련으로 적응한 포지션이 있으면 알려준다
    const trained=Object.keys((ST.posTrain&&ST.posTrain[p.id])||{})
      .filter(k=>posTrained(p.id,k)>=1);
    if(trained.length)
      card.appendChild(el('div','pc-prom','포지션 적응: '+
        trained.map(k=>`${POSNAMES[k]} ${Math.round(posFit(p.id,k))}`).join(' · ')));
    if(isMerc(p.id)){
      // 용병은 오늘 하루짜리다. 면담도 훈련도 없다.
      card.appendChild(el('div','pc-prom',`오늘 경기 한정 용병 · ${mercDef(p.id).fee}만원`));
    } else {
      // 면담 버튼 — 불만 2단계 이상이면 빨갛게 표시해서 눈에 띄게 한다
      const act=el('div','pc-act');
      const un=(ST.unhappy&&ST.unhappy[p.id])?ST.unhappy[p.id].level:0;
      const pb=el('button','mbtn','프로필');
      pb.onclick=()=>openPlayer(p.id);
      act.appendChild(pb);
      // 나 자신과 면담할 수는 없다
      if(p.id!==(ST.playerId||MYID)){
        const mb=el('button','mbtn'+(un>=2?' hot':''),
          un>=2?`면담 · ${unhappyLabel(un)}`:`면담 · ${bondLabel(bondOf(p.id))}`);
        mb.onclick=()=>openMeet(p.id);
        act.appendChild(mb);
      }
      card.appendChild(act);
    }
    c.appendChild(card);
  });

  const sum=el('div','card');
  const fee=350;
  sum.innerHTML=`<div class="card-h">선수단 총 가치</div><div class="fp-num">${wonStr(total)}</div>
    <p class="muted">리그비가 팀당 <b>${fee}만원</b>, 23팀 전체 자금이 8,050만원이다.<br>
    이 선수단은 리그비의 <b>${(total/fee*100).toFixed(0)}%</b> 수준이다.<br>
    가장 비싼 선수도 회식 몇 번 값이다. 사회인야구니까.</p>`;
  c.appendChild(sum);
}

/* ---------- 라인업 ---------- */
function renderLineup(){
  const c=$('#view'); c.innerHTML='';
  const t=TBYID['wwzw'];

  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const head=el('div','card');
  head.appendChild(el('div','card-h','타순 · 수비'));
  head.appendChild(el('div','park-mini',`${(ST.calendar&&ST.calendar.label)||''} · ${park.name} — ${park.note}`));
  // 선발 투수의 진실은 로테이션 1번이다. 헷갈리지 않게 위에 못박아 둔다.
  const gr0=gameRotation()[0];
  const spRow=el('div','starter-row');
  spRow.innerHTML=`<span>오늘 선발 투수</span><b>${gr0?nameOf(gr0):'—'}</b>`+
    (ST.useDH?'<i>지명타자 사용 중 — 투수는 타순에 안 선다</i>'
             :'<i>지명타자 미사용 — 투수가 타순에 들어간다</i>');
  head.appendChild(spRow);
  if(ST._starterMoved){
    head.appendChild(el('div','warn',
      `${nameOf(ST._starterMoved)}을(를) 선발로 올렸다. 지명타자를 쓰는 중이라 타순에는 안 선다.`));
    ST._starterMoved=null;
  }
  const dhRow=el('div','dh-row');
  dhRow.innerHTML=`<span>지명타자 사용</span>`;
  const dhBtn=el('button','toggle'+(ST.useDH?' on':''), ST.useDH?'사용':'미사용');
  dhBtn.onclick=()=>{ ST.useDH=!ST.useDH; applyDHRule(); saveGame(true); renderLineup();
    toast(ST.useDH?'지명타자 사용':'투수가 타석에 선다'); };
  dhRow.appendChild(dhBtn);
  head.appendChild(dhRow);
  const br=el('div','btn-row');
  const b1=el('button','btn','추천 라인업');
  b1.onclick=()=>{ST.lineup=recommendLineup();optimizePositions();applyDHRule();sanitizeRotation();
    saveGame(true);renderLineup();toast('추천 라인업 · 포지션 최적화');};
  const b0=el('button','btn','지난 경기 그대로');
  b0.onclick=()=>{
    if(!ST.lastLineup){toast('저장된 지난 라인업이 없다');return;}
    const bad=ST.lastLineup.filter(x=>!isAvailable(x.id));
    ST.lineup=ST.lastLineup.map(x=>({id:x.id,pos:x.pos}));
    if(bad.length){
      // 결장자는 벤치에서 대체
      const pool=TBYID['wwzw'].players.filter(p=>isAvailable(p.id)&&!ST.lineup.some(s2=>s2.id===p.id));
      bad.forEach(b=>{
        const i=ST.lineup.findIndex(s2=>s2.id===b.id);
        const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
        if(rep){ST.lineup[i].id=rep.id;pool.splice(pool.indexOf(rep),1);}
      });
      toast(`${bad.length}명 결장 — 자동 교체함`);
    } else toast('지난 라인업 적용');
    applyDHRule(); saveGame(true); renderLineup();
  };
  const b2=el('button','btn','카톡 발표');
  b2.onclick=()=>{
    ST.kakao=buildKakaoPre(ST); ST.announced=true;
    /* 발표 직후 빠지는 사람이 생기면 자동으로 메우지 않는다.
       감독이 직접 라인업을 다시 확정해야 경기로 넘어간다.
       (예전에는 몰래 채워 넣어서 화면과 실제가 어긋났다)             */
    if(ST.dropouts&&ST.dropouts.length) ST.lineupDirty=true;
    saveGame(true);go('kakao');
  };
  br.appendChild(b0);br.appendChild(b1); head.appendChild(br);
  const br2=el('div','btn-row');
  if(ST.lineupDirty){
    const okb=el('button','btn primary','라인업 확정');
    okb.onclick=()=>{
      const bad=ST.lineup.filter(x=>!isAvailable(x.id));
      if(bad.length){ toast(`${bad.map(x=>nameOf(x.id)).join(', ')}은(는) 못 나온다`); return; }
      const ids=ST.lineup.map(x=>x.id);
      if(ids.some((x,i)=>ids.indexOf(x)!==i)){ toast('같은 사람이 두 번 들어가 있다'); return; }
      resolveStarterField();
      ST.lineupDirty=false;
      ST.announced=true;          // 수정본을 올렸으니 발표한 것으로 친다
      ST.kakao=ST.kakao||[];
      ST.kakao.push({who:'lg',type:'notice',
        text:'라인업 수정\n\n'+ST.lineup.map((s2,i)=>{
          const n=jerseyNo(s2.id);
          return `${i+1}. ${n!=null?n+' ':''}${nameOf(s2.id)} (${POSNAMES[s2.pos]})`;
        }).join('\n')+`\n선발 ${nameOf((gameRotation()||[])[0]||ST.rotation[0])}`});
      saveGame(true); go('kakao'); toast('라인업 확정');
    };
    br2.appendChild(okb);
  } else br2.appendChild(b2);
  head.appendChild(br2);
  c.appendChild(head);

  const lfx=resolveStarterField();   // 투수와 야수가 겹치면 여기서 정리한다
  if(lfx&&lfx.benched)
    c.appendChild(el('div','warn',
      `${nameOf(lfx.benched)}은(는) 오늘 선발이라 타순에서 뺐다. `+
      `${POSNAMES[lfx.pos]} 자리는 ${nameOf(lfx.filled)}이(가) 들어갔다.`));
  else if(lfx&&lfx.dhLost)
    c.appendChild(el('div','warn',
      `벤치에 사람이 모자라서 오늘은 지명타자를 못 쓴다. ${nameOf(lfx.starter)}이(가) 타순에도 든다.`));
  if(ST.lineupDirty){
    const w=el('div','warn');
    const bad=ST.lineup.filter(x=>!isAvailable(x.id)).map(x=>nameOf(x.id));
    w.innerHTML=`발표 뒤에 못 온다는 사람이 생겼다${bad.length?` — <b>${bad.join(', ')}</b>`:''}.<br>`+
      `라인업을 고치고 아래 <b>라인업 확정</b>을 눌러야 경기로 넘어간다.`;
    c.appendChild(w);
    const fixb=el('button','btn','빈자리 자동으로 채우기');
    fixb.onclick=()=>{ autoFixLineup(); applyDHRule(); saveGame(true); renderLineup(); toast('자동으로 채웠다. 확인하고 확정해라'); };
    c.appendChild(fixb);
  }
  const list=el('div','lineup');
  ST.lineup.forEach((s,i)=>{
    const p=t.players.find(x=>x.id===s.id);
    if(!p) return;
    const b=ST.bat[p.id]||blankBat();
    const bad=!isAvailable(p.id);
    const row=el('div','lp-row'+(bad?' bad':''));
    row.innerHTML=`<div class="lp-n">${i+1}</div>
      <div class="lp-main"><div class="lp-name">${p.no!=null?`<span class="pc-no">#${p.no}</span> `:''}${p.name}${formTag(p.id)?`<span class="ftag">${formTag(p.id)}</span>`:''}${p.bats==='L'?'<span class="lh">좌</span>':''}${bad?'<span class="tagx">출전 불가</span>':''}</div>
      <div class="lp-stat">${condLabel(ST.cond[p.id]||70)} · ${b.pa?`${fmt3(avg(b))} OPS ${ops(b).toFixed(3)}`:'기록 없음'}</div></div>
      <button class="pos-badge">${POSNAMES[s.pos]}</button>
      <div class="lp-ctl"><button class="up">▲</button><button class="dn">▼</button></div>`;
    row.querySelector('.lp-main').onclick=()=>openPicker(i);
    row.querySelector('.lp-n').onclick=()=>openPicker(i);
    row.querySelector('.pos-badge').onclick=e=>{e.stopPropagation();openPosPicker(i);};
    row.querySelector('.up').onclick=e=>{e.stopPropagation();if(i>0){const a=ST.lineup;[a[i-1],a[i]]=[a[i],a[i-1]];saveGame(true);renderLineup();}};
    row.querySelector('.dn').onclick=e=>{e.stopPropagation();const a=ST.lineup;if(i<8){[a[i+1],a[i]]=[a[i],a[i+1]];saveGame(true);renderLineup();}};
    list.appendChild(row);
  });
  c.appendChild(list);

  const dup={}; ST.lineup.forEach(s=>dup[s.pos]=(dup[s.pos]||0)+1);
  const d=Object.keys(dup).filter(k=>dup[k]>1);
  if(d.length)c.appendChild(el('div','warn',`포지션 중복: ${d.map(x=>POSNAMES[x]).join(', ')} — 수비가 약해진다`));
  if(ST.lineup.some(s=>!isAvailable(s.id)))c.appendChild(el('div','warn','출전 불가 선수가 라인업에 있다. 교체해야 경기를 시작할 수 있다.'));

  const bench=t.players.filter(p=>!ST.lineup.some(s=>s.id===p.id));
  const bc=el('div','card');
  bc.appendChild(el('div','card-h',`벤치 (${bench.length}명)`));
  bench.forEach(p=>{
    const iv=ST.injury[p.id];
    const row=el('div','bench-row'+(isAvailable(p.id)?'':' bad'));
    row.innerHTML=`<span class="bn">${p.name}</span>
      <span class="bs">${iv?iv.name+' '+iv.games+'경기':((ST.absent&&ST.absent[p.id])||condLabel(ST.cond[p.id]||70))}</span>
      ${starHTML(effCA(p.id))}`;
    bc.appendChild(row);
  });
  if(!bench.length)bc.appendChild(el('p','muted','벤치가 비어 있다.'));
  c.appendChild(bc);

  const pc=el('div','card');
  pc.appendChild(el('div','card-h','투수 로테이션'));
  pc.appendChild(el('p','muted',
    '위에서부터 선발 · 첫 번째 불펜 · 두 번째 불펜 순으로 올라간다. '+
    '이번 주에 못 나오는 투수는 그 경기만 건너뛰고, 로테이션에서 사라지지 않는다.'));
  const gRot=gameRotation();
  ST.rotation.forEach((pid,i)=>{
    const p=t.pitchers.find(x=>x.id===pid); if(!p)return;
    const s2=ST.pit[pid]||blankPit();
    const out=!isAvailable(pid);
    const gi=gRot.indexOf(pid);
    const row=el('div','pt-row'+(out?' bad':''));
    const roleNow = out ? '이번 주 결장' : (gi===0?'오늘 선발':`오늘 ${gi+1}번째`);
    row.innerHTML=`<div class="pt-n">${i===0?'선발':i+'번'}</div>
      <div class="pt-main"><div class="pt-name">${p.name}</div>
      <div class="pt-stat">${s2.outs?`${s2.w}승 ${s2.l}패 ERA ${era(s2).toFixed(2)} ${ipStr(s2)}이닝`:'등판 없음'}</div>
      <div class="pt-role">${roleNow}</div></div>
      <div class="pt-rate">구위 ${p.stf}<br>제구 ${p.ctl}<br>${restLabel(pid)}</div>
      <div class="pt-ctl"><button class="up"${i===0?' disabled':''}>▲</button>`+
      `<button class="dn"${i===ST.rotation.length-1?' disabled':''}>▼</button>`+
      `<button class="rm" title="로테이션에서 뺀다">×</button></div>`;
    row.querySelector('.up').onclick=()=>{if(i>0){const a=ST.rotation;[a[i-1],a[i]]=[a[i],a[i-1]];syncStarter();saveGame(true);renderLineup();}};
    row.querySelector('.dn').onclick=()=>{const a=ST.rotation;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];syncStarter();saveGame(true);renderLineup();}};
    row.querySelector('.rm').onclick=()=>{
      if(ST.rotation.length<=1){toast('투수가 최소 한 명은 있어야 한다');return;}
      ST.rotation=ST.rotation.filter(x=>x!==pid);
      syncStarter(); saveGame(true); renderLineup(); toast(`${p.name} 로테이션에서 제외`);
    };
    pc.appendChild(row);
  });

  /* 로테이션에 없는 투수를 다시 넣는 버튼.
     이게 없어서 한 번 빠진 투수를 되살릴 방법이 없었다.              */
  const spare=t.pitchers.filter(p=>ST.rotation.indexOf(p.id)<0);
  const addb=el('button','btn',`투수 추가 (대기 ${spare.length}명)`);
  addb.onclick=()=>{
    if(!spare.length){toast('모든 투수가 이미 로테이션에 있다');return;}
    const body=$('#sheet-body'); body.innerHTML='';
    $('#sheet-title').textContent='로테이션에 넣을 투수';
    body.appendChild(el('div','sheet-note',
      '사회인야구는 누구나 던진다. 포지션 적합도가 낮아도 넣을 수는 있다.'));
    spare.slice().sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
      .forEach(p=>{
        const fit=posFit(p.id,'P');
        const out=!isAvailable(p.id);
        const r=el('button','pick-row'+(fit<=0?' bad':''));
        r.innerHTML=`<div class="pk-l"><div class="pk-name">${p.name}</div>
          <div class="pk-note">${fit<=0?'투수 경험 없음 — 크게 불리하다':`투수 적합도 ${fit}`}`+
          `${out?' · 이번 주 결장(다음 주부터 등판)':''}</div></div>
          <div class="pk-r"><div class="pk-stat">구위 ${p.stf} 제구 ${p.ctl}</div></div>`;
        r.onclick=()=>{
          ST.rotation.push(p.id);
          closeSheet(); syncStarter(); saveGame(true); renderLineup();
          toast(`${p.name} 로테이션 추가 — ${ST.rotation.length}번`);
        };
        body.appendChild(r);
      });
    $('#sheet').classList.add('open');
  };
  pc.appendChild(addb);
  const rcb=el('button','btn','추천 로테이션으로 되돌리기');
  rcb.onclick=()=>{ST.rotation=recommendRotation();syncStarter();saveGame(true);renderLineup();toast('추천 로테이션');};
  pc.appendChild(rcb);
  c.appendChild(pc);

  const tc=el('div','card');
  tc.appendChild(el('div','card-h','팀 전술'));
  [['bat','타격 방침',[['patient','공 많이 보기','볼넷↑ 삼진↑'],['normal','기본',''],['aggressive','적극 타격','볼넷↓ 장타↑'],['contact','정확히 맞히기','삼진↓ 장타↓']]],
   ['run','주루 방침',[['hold','자제','도루 거의 안 함'],['normal','기본',''],['aggressive','적극','도루 시도 60%↑']]],

function syncStarter(){
  // 라인업에 투수 자리가 있으면 선발 투수를 자동으로 그 자리에 넣는다
  const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
  if(pIdx<0)return;
  const sp=ST.rotation[0];
  if(ST.lineup[pIdx].id===sp)return;
  const dup=ST.lineup.findIndex(s=>s.id===sp);
  if(dup>=0&&dup!==pIdx){
    const tmp=ST.lineup[pIdx].id;
    ST.lineup[pIdx].id=sp;
    ST.lineup[dup].id=tmp;
  } else {
    ST.lineup[pIdx].id=sp;
  }
}
/* 지명타자를 쓰면 투수는 타순 밖에 있는 게 원칙이다.
   그런데 결장이 겹치면 이미 야수로 들어가 있는 사람이 마운드에 올라간다.
   그러면 한 사람이 3루와 투수를 동시에 맡는 꼴이 되고, 화면에도 두 번 뜬다.

   [버그 이력] 송승민 결장 → 다음 투수도 결장 → 이미 3루수로 들어가 있던
   김한규가 선발이 되면서 '김한규 3루 / 김한규 투수' 가 됐다.

   이때는 그 사람의 수비 위치를 P 로 바꾸고, 비는 야수 자리를 지명타자나
   벤치에서 메운다. 메울 사람이 정말 없으면 선발을 다른 투수로 바꾼다.     */
function resolveStarterField(){
  if(!ST.lineup) return null;
  const t=TBYID['wwzw'];
  const rot=gameRotation();
  const sp=rot&&rot[0]; if(!sp) return null;
  const i=ST.lineup.findIndex(s=>s.id===sp);
  if(i<0) return null;                        // 타순 밖 — 정상
  const pos=ST.lineup[i].pos;
  if(pos==='P') return null;                  // 이미 투수 자리
  const bench=()=>t.players.filter(q=>isAvailable(q.id)&&!ST.lineup.some(x=>x.id===q.id));
  const otherP=()=>{
    const alt=rot.find(id=>id!==sp && !ST.lineup.some(x=>x.id===id));
    if(!alt) return null;
    ST.rotation=[alt].concat((ST.rotation||[]).filter(x=>x!==alt));
    return {starter:alt, swapped:sp};
  };

  /* [버그 이력] 지명타자를 켜놨는데도 투수가 타석에 섰다.
     송승민처럼 포수 겸 에이스인 선수가 선발이면 여기서 그 사람을 P 로 바꾸고
     지명타자 자리를 헐어 그 포지션을 메웠다. 결과적으로 라인업 화면을 한 번
     여는 것만으로 지타가 사라지고 투수가 9번 타순에 들어갔다.
     지명타자를 쓰는 동안에는 선발 투수를 아예 타순 밖으로 빼고,
     그 타순은 벤치에서 채워서 '타자 9명 + 타순 밖 투수' 를 지킨다.        */
  if(ST.useDH){
    const pool=bench();
    // 지타 자리였다면 수비 부담이 없으니 제일 잘 치는 사람으로 채운다
    const rep = pos==='DH'
      ? pool.slice().sort((a,b)=>effCA(b.id)-effCA(a.id))[0]
      : pool.filter(q=>posFit(q.id,pos)>0).sort((a,b)=>posFit(b.id,pos)-posFit(a.id,pos))[0];
    if(rep){
      ST.lineup[i]={id:rep.id, pos};
      return {starter:sp, filled:rep.id, pos, from:'bench', benched:sp};
    }
    // 벤치에 메울 사람이 없다 — 다른 투수를 세워서라도 지타를 지킨다
    const sw=otherP(); if(sw) return sw;
    // 그것도 안 되면 어쩔 수 없이 지타를 포기하고 투수가 타순에 든다
    const dh=ST.lineup.findIndex(s=>s.pos==='DH');
    if(dh>=0 && dh!==i && posFit(ST.lineup[dh].id,pos)>0){
      ST.lineup[dh].pos=pos; ST.lineup[i].pos='P';
      return {starter:sp, filled:ST.lineup[dh].id, pos, from:'DH', dhLost:true};
    }
    ST.lineup[i].pos='P';
    return {starter:sp, filled:null, pos, from:'none', dhLost:true};
  }

  /* 지명타자 미사용 — 투수도 타순에 서야 한다 */
  if(pos==='DH'){ ST.lineup[i].pos='P'; return {starter:sp,filled:null,from:'DH'}; }
  // 1) 지명타자가 그 자리를 볼 수 있으면 지타가 나간다
  const dh=ST.lineup.findIndex(s=>s.pos==='DH');
  if(dh>=0 && posFit(ST.lineup[dh].id,pos)>0){
    ST.lineup[dh].pos=pos; ST.lineup[i].pos='P';
    return {starter:sp, filled:ST.lineup[dh].id, pos, from:'DH'};
  }
  // 2) 벤치에서 그 자리를 볼 수 있는 사람을 올린다 (지타 자리와 맞바꾼다)
  const rep=bench().filter(q=>posFit(q.id,pos)>0).sort((a,b)=>posFit(b.id,pos)-posFit(a.id,pos))[0];
  if(rep && dh>=0){
    const outId=ST.lineup[dh].id;
    ST.lineup[dh].id=rep.id; ST.lineup[dh].pos=pos; ST.lineup[i].pos='P';
    return {starter:sp, filled:rep.id, pos, from:'bench', out:outId};
  }
  if(rep){
    ST.lineup[i].pos='P';
    // 지타가 없으면 타순 밖 수비 교대는 불가능하니 그냥 P 로 두고 자리를 비운다
    return {starter:sp, filled:null, pos, from:'none'};
  }
  // 3) 아무도 못 메우면 다른 투수를 선발로 세운다
  const sw=otherP(); if(sw) return sw;
  ST.lineup[i].pos='P';
  return {starter:sp, filled:null, pos, from:'none'};
}

function applyDHRule(){
  const t=TBYID['wwzw'];
  const sp=ST.rotation[0];
  const used=()=>ST.lineup.map(x=>x.pos);
  const freePos=(exclude)=>ALLPOS.concat(['P']).filter(x=>x!=='DH'&&!ST.lineup.some((s,i)=>i!==exclude&&s.pos===x));

  if(!ST.useDH){
    // 투수가 반드시 타순에 들어간다
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    const spIdx=ST.lineup.findIndex(s=>s.id===sp);
    if(spIdx>=0){
      // 이미 라인업에 있으면 그 자리를 P로
      if(pIdx>=0&&pIdx!==spIdx) ST.lineup[pIdx].pos=freePos(pIdx).find(x=>x!=='P')||'RF';
      ST.lineup[spIdx].pos='P';
    } else {
      // DH 자리를 투수로 교체, 없으면 마지막 타순
      let slot=ST.lineup.findIndex(s=>s.pos==='DH');
      if(slot<0) slot=8;
      ST.lineup[slot]={id:sp,pos:'P'};
    }
  } else {
    /* DH 사용 중에는 투수가 타순에 서지 않는다.
       그런데 유저가 타순의 누군가를 'P' 로 지정했다면
       "이 사람을 선발로 쓰겠다"는 뜻이므로 로테이션 1번으로 올려주고
       타순에서는 지명타자(또는 빈 야수 자리)로 되돌린다.
       예전에는 그냥 지워버려서 아무 일도 안 일어난 것처럼 보였다.    */
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    if(pIdx>=0){
      const who=ST.lineup[pIdx].id;
      if(TBYID['wwzw'].pitchers.some(p=>p.id===who)&&ST.rotation[0]!==who){
        ST.rotation=[who].concat((ST.rotation||[]).filter(x=>x!==who));
        ST._starterMoved=who;         // 화면에서 안내 문구를 띄우기 위한 표시
      }
      const hasDH=ST.lineup.some(s=>s.pos==='DH');
      ST.lineup[pIdx].pos = hasDH ? (freePos(pIdx).find(x=>posFit(who,x)>0)||'RF') : 'DH';
    }
  }
  syncStarter();
  // DH 미사용인데 DH 슬롯이 남아 있으면 야수 자리로 전환
  if(!ST.useDH){
    ST.lineup.forEach((s,i)=>{
      if(s.pos!=='DH')return;
      const cand=ALLPOS.filter(x=>x!=='DH'&&!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos=cand.find(x=>posFit(s.id,x)>0)||cand[0]||'RF';
    });
  }
  // 포지션 중복 정리
  const seen={};
  ST.lineup.forEach((s,i)=>{
    if(seen[s.pos]){
      const cand=ALLPOS.concat(ST.useDH?[]:['P']).filter(x=>!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos = cand.find(x=>posFit(s.id,x)>0) || cand[0] || s.pos;
    }
    seen[s.pos]=true;
  });
}

function restLabel(pid){
  const r=ST.rest&&ST.rest[pid]!==undefined?ST.rest[pid]:3;
  if(!isAvailable(pid))return '<b class="dead">불가</b>';
  if(r>=2)return '<b class="ok">정상</b>';
  if(r===1)return '<b class="tired">피로</b>';
  return '<b class="dead">과부하</b>';
}

function openPicker(idx){
  const t=TBYID['wwzw'];
  $('#sheet-title').textContent=`${idx+1}번 타자`;
  const body=$('#sheet-body'); body.innerHTML='';
  const inL=new Set(ST.lineup.map(s=>s.id));
  t.players.forEach(p=>{
    const cur=ST.lineup[idx].id===p.id;
    const used=inL.has(p.id)&&!cur;
    const ok=isAvailable(p.id);
    const iv=ST.injury[p.id];
    const row=el('button','pick-row'+(cur?' cur':'')+(used?' used':'')+(ok?'':' bad'));
    row.innerHTML=`<div class="pk-l"><div class="pk-name">${p.no!=null?`<span class="pc-no">#${p.no}</span> `:''}${p.name}${formTag(p.id)?`<span class="ftag">${formTag(p.id)}</span>`:''}${p.bats==='L'?'<span class="lh">좌</span>':''}</div>
      <div class="pk-note">${iv?iv.name:((ST.absent&&ST.absent[p.id])||(META[p.id]?META[p.id].desc:''))}</div></div>
      <div class="pk-r">${starHTML(effCA(p.id))}<div class="pk-stat">${condLabel(ST.cond[p.id]||70)}</div></div>`;
    row.onclick=()=>{
      const wasP = ST.lineup[idx].pos==='P';
      const o=ST.lineup.findIndex(s=>s.id===p.id);
      if(o>=0&&o!==idx){const tmp=ST.lineup[o].id;ST.lineup[o].id=ST.lineup[idx].id;ST.lineup[idx].id=tmp;}
      else ST.lineup[idx].id=p.id;
      // 타순의 투수 자리를 바꿨으면 선발도 그 사람으로 따라간다
      if(wasP && TBYID['wwzw'].pitchers.some(x=>x.id===p.id)) setStarter(p.id);
      closeSheet();saveGame(true);renderLineup();
    };
    body.appendChild(row);
  });
  $('#sheet').classList.add('open');
}
function openPosPicker(idx){
  const t=TBYID['wwzw'];
  const p=t.players.find(x=>x.id===ST.lineup[idx].id);
  $('#sheet-title').textContent=`${p.name} 수비 위치`;
  const body=$('#sheet-body'); body.innerHTML='';
  const taken={}; ST.lineup.forEach((s,i)=>{if(i!==idx)taken[s.pos]=true;});
  /* 투수(P)는 지명타자를 쓰든 안 쓰든 항상 고를 수 있다.
     고르면 '선발 지정'으로 해석해서 로테이션 1번으로 올린다.
     예전에는 DH 사용 중이면 P 가 목록에 없거나 골라도 조용히 지워져서
     "투수로 바꿨는데 아무 일도 안 일어난다"는 문제가 있었다.          */
  const isP = TBYID['wwzw'].pitchers.some(x=>x.id===p.id);
  const list = (ST.useDH ? ALLPOS : ALLPOS.filter(x=>x!=='DH')).concat(['P']);
  list.forEach(pos=>{
    const starter = ST.rotation[0]===p.id;
    const fitV = pos==='P' ? (isP?Math.max(1,basePosFit(p.id,'P')):0) : posFit(p.id,pos);
    const fit=fitV>=45;
    const cur = pos==='P' ? starter : ST.lineup[idx].pos===pos;
    const row=el('button','pick-row'+(cur?' cur':'')+(pos!=='P'&&taken[pos]?' used':''));
    const note = pos==='P'
      ? (!isP ? '투수로 등록되지 않은 선수다'
              : (starter?'이미 오늘 선발이다':(ST.useDH?'선발로 지정한다 (타순에는 안 선다)':'선발로 지정한다')))
      : (fitV<=0?'불가 (좌투)':fit?'주 포지션':'익숙하지 않다 — 수비 하락');
    row.innerHTML=`<div class="pk-l"><div class="pk-name">${POSNAMES[pos]}</div>
      <div class="pk-note">${note}`+
      `${pos!=='P'&&posTrained(p.id,pos)>=1?` · 훈련 +${Math.round(posTrained(p.id,pos))}`:''}</div></div>
      <div class="pk-r"><div class="pk-stat">${pos==='P'?(isP?'선발':'—'):(taken[pos]?'중복':(fitV>0?fitV:'—'))}</div></div>`;
    if(fitV<=0) row.classList.add('bad');
    row.onclick=()=>{
      if(pos==='P'){
        if(!isP){toast(`${p.name}은(는) 투수 로테이션에 없다. 로테이션에서 먼저 추가해라`);return;}
        setStarter(p.id);
        closeSheet(); saveGame(true); renderLineup();
        toast(ST.useDH?`${p.name} 선발 지정 — 지명타자를 쓰는 중이라 타순에는 안 선다`
                      :`${p.name} 선발 지정`);
        return;
      }
      const o=ST.lineup.findIndex((s,i)=>i!==idx&&s.pos===pos);
      if(o>=0)ST.lineup[o].pos=ST.lineup[idx].pos;
      ST.lineup[idx].pos=pos;
      closeSheet();saveGame(true);renderLineup();
    };
    body.appendChild(row);
  });
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');}

  b:`안산시야구소프트볼협회 <b>4부리그</b>에서 뛰는 사회인야구팀 <b>우완좌완</b>의

  b:`<b>타순</b> — 앞 번호일수록 타석에 자주 선다. 잘 치는 사람을 앞에 둔다.<br>

function renderTutorial(){
  const c=$('#view'); c.innerHTML='';
  const i=Math.max(0,Math.min(TUTORIAL.length-1, ST.tutStep||0));
  const t=TUTORIAL[i];
  const g=GUIDES[t.who||'ian'];
  if(g){
    const gw=el('div','tut-guide');
    gw.innerHTML=`<div class="tg-pic"><img src="${g.img}" alt="${g.name}"></div>
      <div class="tg-talk"><div class="tg-nm">${g.name}<span>${g.tag}</span></div>
        <p>${t.say||''}</p></div>`;
    c.appendChild(gw);
  }
  const head=el('div','card');
  head.innerHTML=`<div class="card-h">${t.t}</div>
    <div class="tut-body">${t.b}</div>
    <div class="tut-dots">${TUTORIAL.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
  c.appendChild(head);
  const row=el('div','btn-row');
  if(i>0){
    const pv=el('button','btn','← 이전');
    pv.onclick=()=>{ST.tutStep=i-1;renderTutorial();};
    row.appendChild(pv);
  }
  if(i<TUTORIAL.length-1){
    const nx=el('button','btn primary','다음 →');
    nx.onclick=()=>{ST.tutStep=i+1;saveGame(true);renderTutorial();};
    row.appendChild(nx);
  } else {
    const done=el('button','btn primary','시작한다');
    done.onclick=()=>{ST.tutDone=true;ST.tutStep=0;saveGame(true);go('home');toast('설정에서 다시 볼 수 있다');};
    row.appendChild(done);
  }
  c.appendChild(row);
  const skip=el('button','btn',`${i+1} / ${TUTORIAL.length} · 건너뛴다`);
  skip.onclick=()=>{ST.tutDone=true;ST.tutStep=0;saveGame(true);go('home');};
  c.appendChild(skip);
}

/* ---------- 면담 ---------- */
/* 면담은 선수당 주 1회. 라운드가 넘어가면 다시 부를 수 있다. */
function openMeet(pid){
  if(pid===(ST.playerId||MYID)){ toast('나 자신과 면담할 수는 없다'); return; }
  if(!ST.meetRound)ST.meetRound={};
  const resuming = ST.meet && ST.meet.pid===pid && !ST.meet.done;
  if(!resuming && ST.meetRound[pid]===ST.round){
    toast(`${nameOf(pid)}과(와)는 이번 주에 이미 면담했다`); return;
  }
  if(!resuming){
    ST.meet={pid,done:false,log:[{who:pid,text:meetOpenLine(ST,pid),
      mood:((ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0)>=2?'angry':'flat'}]};
  }
  go('meet');
}

  if(!ST.meet){ go('squad'); return; }
  const pid=ST.meet.pid;
  const p=TBYID['wwzw'].players.find(x=>x.id===pid);
  if(!p){ ST.meet=null; go('squad'); return; }
  const un=(ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0;

  const head=el('div','card');
  head.innerHTML=`<div class="card-h meet-head"><span>면담 · ${p.name}</span>
      <span class="meet-lv">${unhappyLabel(un)}</span></div>
    <p class="muted">사기 ${moraleLabel(ST.morale[pid]||70)} · 우정 ${bondLabel(bondOf(pid))} · 컨디션 ${condLabel(ST.cond[pid]||70)}
      · 출석 성향 ${Math.round(((META[pid]&&META[pid].attend)!=null?META[pid].attend:0.85)*100)}%</p>`;

  const room=el('div','kakao');
  ST.meet.log.forEach(m=>{

    const w=el('div','kmsg'+(mine?' mine':'')+(m.type==='notice'?' notice':''));
    w.innerHTML=`${(mine||m.type==='notice')?'':`<div class="kname">${p.name}</div>`}`+
      `<div class="kbub ${m.mood||''}">${String(m.text).replace(/\n/g,'<br>')}</div>`;
