/* 능력치 막대 색 — OOTP 처럼 구간별로 색이 다르다 */
function otTier(v){ return v>=65?'t4':v>=50?'t3':v>=35?'t2':'t1'; }
/* 0.667 이닝 → '0.2' (야구식 표기) */
function ipDot(ip){
  const w=Math.floor(ip+1e-6), f=Math.round((ip-w)*3);
  return f?`${w}.${f}`:`${w}`;
}
/* 남은 성장 여지를 여섯 능력치에 고르게 나눴을 때 각자 올라가는 값.
   calcCA 의 가중치 합이 정확히 5.0 이라, 여섯 개를 똑같이 n 씩 올리면
   CA 도 정확히 n 오른다. 그래서 잠재 = 현재 + (잠재CA - 현재CA) 다.
   지어낸 숫자가 아니라 성장 공식에서 그대로 떨어지는 값이다.        */
const CA_W={con:1.3,pow:1.1,eye:0.8,spd:0.7,def:0.7,arm:0.4};
function otPotential(pid,key,cur){
  const room=effPA(pid)-effCA(pid);
  if(room<=0||!CA_W[key])return cur;
  return Math.min(80, cur+room);
}
function otBar(label,cur,pot){
  const c=Math.max(0,Math.min(80,cur)), pp=Math.max(c,Math.min(80,pot==null?c:pot));
  const num = (pot!=null&&Math.round(pp)>Math.round(c))
    ? `${Math.round(c)} / ${Math.round(pp)}` : `${Math.round(c)}`;
  return `<div class="ot-rt"><div class="ot-rt-l">${label}</div>
    <div class="ot-rt-b"><span class="ot-num ${otTier(c)}">${num}</span>
      <div class="ot-bar"><u style="width:${pp/80*100}%"></u>
        <i class="${otTier(c)}" style="width:${c/80*100}%"></i></div></div></div>`;
}
function otRow(k,v,hot){
  return `<div class="ot-r"><span>${k}</span><b${hot?' class="hot"':''}>${v}</b></div>`;
}
function otSec(title,inner,right){
  return `<div class="ot-sec"><div class="ot-h">${title}${right?`<span>${right}</span>`:''}</div>
    <div class="ot-b">${inner}</div></div>`;
}

  } else rec+='<p class="ot-note">올해 지금까지 타석 기록 없음.</p>';
  if(pl&&pl.outs){
    rec+=`<div class="ot-tbl"><table><thead><tr><th>G</th><th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>ERA</th></tr></thead>
      <tbody><tr><td>${pl.g}</td><td>${ipStr(pl)}</td><td>${pl.h}</td><td>${pl.er}</td><td>${pl.bb+pl.hbp}</td><td>${pl.k}</td><td>${era(pl).toFixed(2)}</td></tr></tbody></table></div>`;
  }
  add(otSec('올 시즌 기록', rec));

  /* ---- 산출 근거 ---- */
  if(p.real){
    const r=p.real;
    let src=`<div class="ot-tbl"><table><thead><tr><th>G</th><th>PA</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>BB</th><th>HBP</th><th>K</th><th>SB</th><th>RBI</th><th>R</th></tr></thead>
      <tbody><tr><td>${r.g}</td><td>${r.pa}</td><td>${r.ab}</td><td>${r.h}</td><td>${r.d2}</td><td>${r.d3}</td><td>${r.hr}</td><td>${r.bb}</td><td>${r.hbp}</td><td>${r.k}</td><td>${r.sb}</td><td>${r.rbi}</td><td>${r.r}</td></tr></tbody></table></div>`;
    if(p.realPit){
      const q=p.realPit;
      src+=`<div class="ot-tbl"><table><thead><tr><th>G</th><th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>ERA</th></tr></thead>
        <tbody><tr><td>${q.g}</td><td>${ipDot(q.ip)}</td><td>${q.h}</td><td>${q.er}</td><td>${q.bb}</td><td>${q.k}</td><td>${q.era.toFixed(2)}</td></tr></tbody></table></div>`;
    }
    if(p.note) src+=`<p class="ot-note">${p.note}</p>`;
    add(otSec('능력치 산출 근거 · 실제 2026 기록', src));
  }

  wrap.appendChild(grid);
  c.appendChild(wrap);

  const act=el('div','btn-row');
  if(!isMerc(p.id) && p.id!==meId){
    const mb=el('button','btn primary','면담'); mb.onclick=()=>openMeet(p.id); act.appendChild(mb);
  }
  const hb2=el('button','btn','전시장'); hb2.onclick=()=>{hallWho=p.id;go('hall');}; act.appendChild(hb2);
  const bk=el('button','btn','선수단으로'); bk.onclick=()=>go('squad'); act.appendChild(bk);
  c.appendChild(act);
}

function renderSquad(){
  const c=$('#view'); c.innerHTML='';
  const tabs=el('div','subtabs');
  [['ca','능력'],['val','가치'],['war','WAR'],['cond','컨디션'],['morale','사기']].forEach(([k,n])=>{
    const b=el('button','subtab'+(squadSort===k?' on':''),n);
    b.onclick=()=>{squadSort=k;renderSquad();}; tabs.appendChild(b);
  });
  c.appendChild(tabs);

  const us=TBYID['wwzw'];
  const lgw=leagueWoba();
  const list=us.players.slice().sort((a,b)=>{
    if(squadSort==='war')return warOf(b.id,ST.bat[b.id]||blankBat(),lgw)-warOf(a.id,ST.bat[a.id]||blankBat(),lgw);
    if(squadSort==='ca')return effCA(b.id)-effCA(a.id);
    if(squadSort==='val')return playerValue(b,META[b.id],ST.bat[b.id])-playerValue(a,META[a.id],ST.bat[a.id]);
    if(squadSort==='cond')return (ST.cond[b.id]||0)-(ST.cond[a.id]||0);
    return (ST.morale[b.id]||0)-(ST.morale[a.id]||0);
  });

  let total=0;
  list.forEach(p=>{
    const m=META[p.id]||{born:1999,traits:[],desc:''};
    const ca=effCA(p.id), pa=effPA(p.id);
    const val=playerValue(p,m,ST.bat[p.id]); total+=val;
    const b=ST.bat[p.id]||blankBat();
    const injv=ST.injury[p.id];
    const abs=ST.absent&&ST.absent[p.id];
    const card=el('div','pcard tapcard'+(injv?' injured':''));
    card.onclick=(ev)=>{ if(ev.target.closest('button'))return; openPlayer(p.id); };
    card.innerHTML=`
      <div class="pc-top">
        <div class="pc-id"><span class="pc-name">${p.name}</span>${p.no!=null?`<span class="pc-no">#${p.no}</span>`:''}${formTag(p.id)?`<span class="ftag" title="${formLabel(p.id)}">${formTag(p.id)}</span>`:''}
          <span class="pc-age">${2026-m.born}세</span>
          ${p.bats==='L'?'<span class="lh">좌</span>':''}
          ${injv?`<span class="tagx">${injv.name} ${injv.games}경기</span>`:''}
          ${abs&&!injv?`<span class="tagx">${abs}</span>`:''}</div>
        <div class="pc-val">${wonStr(val)}${valDelta(p.id,val)}</div>
      </div>
      <div class="pc-stars"><span class="lbl">현재</span>${starHTML(ca)}<span class="lbl">잠재</span>${starHTML(pa,true)}</div>
      <div class="pc-traits">${shownTraits(p.id).filter(t=>!['카풀','좌투','금주'].includes(t)).map(t=>`<span class="trait">${t}</span>`).join('')}</div>
      <div class="pc-bars">
        <div><span>컨디션</span><div class="mini"><i class="${condCls(ST.cond[p.id]||70)}" style="width:${ST.cond[p.id]||70}%"></i></div><b>${condLabel(ST.cond[p.id]||70)}</b></div>
        <div><span>사기</span><div class="mini"><i class="${(ST.morale[p.id]||70)>=70?'ok':(ST.morale[p.id]||70)>=50?'mid':'bad'}" style="width:${ST.morale[p.id]||70}%"></i></div><b>${moraleLabel(ST.morale[p.id]||70)}</b></div>
      </div>
      <div class="pc-rate"><span>컨택 ${Math.round(p.con)}</span><span>파워 ${Math.round(p.pow)}</span><span>선구 ${Math.round(p.eye)}</span><span>주루 ${Math.round(p.spd)}</span><span>수비 ${Math.round(p.def)}</span><span>어깨 ${Math.round(p.arm)}</span></div>
      <div class="pc-stat">${b.pa?`${b.g}경기 ${fmt3(avg(b))} · OPS ${ops(b).toFixed(3)} · ${b.hr}홈런 ${b.rbi}타점 ${b.sb}도루`:'출전 기록 없음'}</div>
      ${b.pa?`<div class="pc-adv">wRC+ <b>${wrcPlus(b,lgw)}</b> · WAR <b>${warOf(p.id,b,lgw).toFixed(2)}</b> · ISO ${fmt3(iso(b))} · BB/K ${bbk(b).toFixed(2)}</div>`:''}
      <div class="pc-att">출석 성향 ${Math.round((m.attend!=null?m.attend:0.85)*100)}%${(m.attend!=null&&m.attend<0.6)?' · 자주 빠진다':''}</div>
      <div class="pc-desc">${m.desc||''}</div>`;
    // 진행 중인 약속을 카드에 바로 보여준다
    const pr=ST.promise&&ST.promise[p.id];
    if(pr) card.appendChild(el('div','pc-prom','약속: '+promiseLabel(pr)));
    // 훈련으로 적응한 포지션이 있으면 알려준다
    const trained=Object.keys((ST.posTrain&&ST.posTrain[p.id])||{})
      .filter(k=>posTrained(p.id,k)>=1);
    if(trained.length)
      card.appendChild(el('div','pc-prom','포지션 적응: '+
        trained.map(k=>`${POSNAMES[k]} ${Math.round(posFit(p.id,k))}`).join(' · ')));
    if(isMerc(p.id)){
      // 용병은 오늘 하루짜리다. 면담도 훈련도 없다.
      card.appendChild(el('div','pc-prom',`오늘 경기 한정 용병 · ${mercDef(p.id).fee}만원`));
    } else {
      // 면담 버튼 — 불만 2단계 이상이면 빨갛게 표시해서 눈에 띄게 한다
      const act=el('div','pc-act');
      const un=(ST.unhappy&&ST.unhappy[p.id])?ST.unhappy[p.id].level:0;
      const pb=el('button','mbtn','프로필');
      pb.onclick=()=>openPlayer(p.id);
      act.appendChild(pb);
      // 나 자신과 면담할 수는 없다
      if(p.id!==(ST.playerId||MYID)){
        const mb=el('button','mbtn'+(un>=2?' hot':''),
          un>=2?`면담 · ${unhappyLabel(un)}`:`면담 · ${bondLabel(bondOf(p.id))}`);
        mb.onclick=()=>openMeet(p.id);
        act.appendChild(mb);
      }
      card.appendChild(act);
    }
    c.appendChild(card);
  });

  const sum=el('div','card');
  const fee=350;
  sum.innerHTML=`<div class="card-h">선수단 총 가치</div><div class="fp-num">${wonStr(total)}</div>
    <p class="muted">리그비가 팀당 <b>${fee}만원</b>, 23팀 전체 자금이 8,050만원이다.<br>
    이 선수단은 리그비의 <b>${(total/fee*100).toFixed(0)}%</b> 수준이다.<br>
    가장 비싼 선수도 회식 몇 번 값이다. 사회인야구니까.</p>`;
  c.appendChild(sum);
}

/* ---------- 라인업 ---------- */
function renderLineup(){
  const c=$('#view'); c.innerHTML='';
  const t=TBYID['wwzw'];

  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const head=el('div','card');
  head.appendChild(el('div','card-h','타순 · 수비'));
  head.appendChild(el('div','park-mini',`${(ST.calendar&&ST.calendar.label)||''} · ${park.name} — ${park.note}`));
  // 선발 투수의 진실은 로테이션 1번이다. 헷갈리지 않게 위에 못박아 둔다.
  const gr0=gameRotation()[0];
  const spRow=el('div','starter-row');
  spRow.innerHTML=`<span>오늘 선발 투수</span><b>${gr0?nameOf(gr0):'—'}</b>`+
    (ST.useDH?'<i>지명타자 사용 중 — 투수는 타순에 안 선다</i>'
             :'<i>지명타자 미사용 — 투수가 타순에 들어간다</i>');
  head.appendChild(spRow);
  if(ST._starterMoved){
    head.appendChild(el('div','warn',
      `${nameOf(ST._starterMoved)}을(를) 선발로 올렸다. 지명타자를 쓰는 중이라 타순에는 안 선다.`));
    ST._starterMoved=null;
  }
  const dhRow=el('div','dh-row');
  dhRow.innerHTML=`<span>지명타자 사용</span>`;
  const dhBtn=el('button','toggle'+(ST.useDH?' on':''), ST.useDH?'사용':'미사용');
  dhBtn.onclick=()=>{ ST.useDH=!ST.useDH; applyDHRule(); saveGame(true); renderLineup();
    toast(ST.useDH?'지명타자 사용':'투수가 타석에 선다'); };
  dhRow.appendChild(dhBtn);
  head.appendChild(dhRow);
  const br=el('div','btn-row');
  const b1=el('button','btn','추천 라인업');
  b1.onclick=()=>{ST.lineup=recommendLineup();optimizePositions();applyDHRule();sanitizeRotation();
    saveGame(true);renderLineup();toast('추천 라인업 · 포지션 최적화');};
  const b0=el('button','btn','지난 경기 그대로');
  b0.onclick=()=>{
    if(!ST.lastLineup){toast('저장된 지난 라인업이 없다');return;}
    const bad=ST.lastLineup.filter(x=>!isAvailable(x.id));
    ST.lineup=ST.lastLineup.map(x=>({id:x.id,pos:x.pos}));
    if(bad.length){
      // 결장자는 벤치에서 대체
      const pool=TBYID['wwzw'].players.filter(p=>isAvailable(p.id)&&!ST.lineup.some(s2=>s2.id===p.id));
      bad.forEach(b=>{
        const i=ST.lineup.findIndex(s2=>s2.id===b.id);
        const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
        if(rep){ST.lineup[i].id=rep.id;pool.splice(pool.indexOf(rep),1);}
      });
      toast(`${bad.length}명 결장 — 자동 교체함`);
    } else toast('지난 라인업 적용');
    applyDHRule(); saveGame(true); renderLineup();
  };
  const b2=el('button','btn','카톡 발표');
  b2.onclick=()=>{
    ST.kakao=buildKakaoPre(ST); ST.announced=true;
    /* 발표 직후 빠지는 사람이 생기면 자동으로 메우지 않는다.
       감독이 직접 라인업을 다시 확정해야 경기로 넘어간다.
       (예전에는 몰래 채워 넣어서 화면과 실제가 어긋났다)             */
    if(ST.dropouts&&ST.dropouts.length) ST.lineupDirty=true;
    saveGame(true);go('kakao');
  };
  br.appendChild(b0);br.appendChild(b1); head.appendChild(br);
  const br2=el('div','btn-row');
  if(ST.lineupDirty){
    const okb=el('button','btn primary','라인업 확정');
    okb.onclick=()=>{
      const bad=ST.lineup.filter(x=>!isAvailable(x.id));
      if(bad.length){ toast(`${bad.map(x=>nameOf(x.id)).join(', ')}은(는) 못 나온다`); return; }
      const ids=ST.lineup.map(x=>x.id);
      if(ids.some((x,i)=>ids.indexOf(x)!==i)){ toast('같은 사람이 두 번 들어가 있다'); return; }
      resolveStarterField();
      ST.lineupDirty=false;
      ST.announced=true;          // 수정본을 올렸으니 발표한 것으로 친다
      ST.kakao=ST.kakao||[];
      ST.kakao.push({who:'lg',type:'notice',
        text:'라인업 수정\n\n'+ST.lineup.map((s2,i)=>{
          const n=jerseyNo(s2.id);
          return `${i+1}. ${n!=null?n+' ':''}${nameOf(s2.id)} (${POSNAMES[s2.pos]})`;
        }).join('\n')+`\n선발 ${nameOf((gameRotation()||[])[0]||ST.rotation[0])}`});
      saveGame(true); go('kakao'); toast('라인업 확정');
    };
    br2.appendChild(okb);
  } else br2.appendChild(b2);
  head.appendChild(br2);
  c.appendChild(head);

  resolveStarterField();          // 투수와 야수가 겹치면 여기서 정리한다
  if(ST.lineupDirty){
    const w=el('div','warn');
    const bad=ST.lineup.filter(x=>!isAvailable(x.id)).map(x=>nameOf(x.id));
    w.innerHTML=`발표 뒤에 못 온다는 사람이 생겼다${bad.length?` — <b>${bad.join(', ')}</b>`:''}.<br>`+
      `라인업을 고치고 아래 <b>라인업 확정</b>을 눌러야 경기로 넘어간다.`;
    c.appendChild(w);
    const fixb=el('button','btn','빈자리 자동으로 채우기');
    fixb.onclick=()=>{ autoFixLineup(); applyDHRule(); saveGame(true); renderLineup(); toast('자동으로 채웠다. 확인하고 확정해라'); };
    c.appendChild(fixb);
  }
  const list=el('div','lineup');
  ST.lineup.forEach((s,i)=>{
    const p=t.players.find(x=>x.id===s.id);
    if(!p) return;
    const b=ST.bat[p.id]||blankBat();
    const bad=!isAvailable(p.id);
    const row=el('div','lp-row'+(bad?' bad':''));
    row.innerHTML=`<div class="lp-n">${i+1}</div>
      <div class="lp-main"><div class="lp-name">${p.no!=null?`<span class="pc-no">#${p.no}</span> `:''}${p.name}${formTag(p.id)?`<span class="ftag">${formTag(p.id)}</span>`:''}${p.bats==='L'?'<span class="lh">좌</span>':''}${bad?'<span class="tagx">출전 불가</span>':''}</div>
      <div class="lp-stat">${condLabel(ST.cond[p.id]||70)} · ${b.pa?`${fmt3(avg(b))} OPS ${ops(b).toFixed(3)}`:'기록 없음'}</div></div>
      <button class="pos-badge">${POSNAMES[s.pos]}</button>
      <div class="lp-ctl"><button class="up">▲</button><button class="dn">▼</button></div>`;
    row.querySelector('.lp-main').onclick=()=>openPicker(i);
    row.querySelector('.lp-n').onclick=()=>openPicker(i);
    row.querySelector('.pos-badge').onclick=e=>{e.stopPropagation();openPosPicker(i);};
    row.querySelector('.up').onclick=e=>{e.stopPropagation();if(i>0){const a=ST.lineup;[a[i-1],a[i]]=[a[i],a[i-1]];saveGame(true);renderLineup();}};
    row.querySelector('.dn').onclick=e=>{e.stopPropagation();const a=ST.lineup;if(i<8){[a[i+1],a[i]]=[a[i],a[i+1]];saveGame(true);renderLineup();}};
    list.appendChild(row);
  });
  c.appendChild(list);

  const dup={}; ST.lineup.forEach(s=>dup[s.pos]=(dup[s.pos]||0)+1);
  const d=Object.keys(dup).filter(k=>dup[k]>1);
  if(d.length)c.appendChild(el('div','warn',`포지션 중복: ${d.map(x=>POSNAMES[x]).join(', ')} — 수비가 약해진다`));
  if(ST.lineup.some(s=>!isAvailable(s.id)))c.appendChild(el('div','warn','출전 불가 선수가 라인업에 있다. 교체해야 경기를 시작할 수 있다.'));

  const bench=t.players.filter(p=>!ST.lineup.some(s=>s.id===p.id));
  const bc=el('div','card');
  bc.appendChild(el('div','card-h',`벤치 (${bench.length}명)`));
  bench.forEach(p=>{
    const iv=ST.injury[p.id];
    const row=el('div','bench-row'+(isAvailable(p.id)?'':' bad'));
    row.innerHTML=`<span class="bn">${p.name}</span>
      <span class="bs">${iv?iv.name+' '+iv.games+'경기':((ST.absent&&ST.absent[p.id])||condLabel(ST.cond[p.id]||70))}</span>
      ${starHTML(effCA(p.id))}`;
    bc.appendChild(row);
  });
  if(!bench.length)bc.appendChild(el('p','muted','벤치가 비어 있다.'));
  c.appendChild(bc);

  const pc=el('div','card');
  pc.appendChild(el('div','card-h','투수 로테이션'));
  pc.appendChild(el('p','muted',
    '위에서부터 선발 · 첫 번째 불펜 · 두 번째 불펜 순으로 올라간다. '+
    '이번 주에 못 나오는 투수는 그 경기만 건너뛰고, 로테이션에서 사라지지 않는다.'));
  const gRot=gameRotation();
  ST.rotation.forEach((pid,i)=>{
    const p=t.pitchers.find(x=>x.id===pid); if(!p)return;
    const s2=ST.pit[pid]||blankPit();
    const out=!isAvailable(pid);
    const gi=gRot.indexOf(pid);
    const row=el('div','pt-row'+(out?' bad':''));
    const roleNow = out ? '이번 주 결장' : (gi===0?'오늘 선발':`오늘 ${gi+1}번째`);
    row.innerHTML=`<div class="pt-n">${i===0?'선발':i+'번'}</div>
      <div class="pt-main"><div class="pt-name">${p.name}</div>
      <div class="pt-stat">${s2.outs?`${s2.w}승 ${s2.l}패 ERA ${era(s2).toFixed(2)} ${ipStr(s2)}이닝`:'등판 없음'}</div>
      <div class="pt-role">${roleNow}</div></div>
      <div class="pt-rate">구위 ${p.stf}<br>제구 ${p.ctl}<br>${restLabel(pid)}</div>
      <div class="pt-ctl"><button class="up"${i===0?' disabled':''}>▲</button>`+
      `<button class="dn"${i===ST.rotation.length-1?' disabled':''}>▼</button>`+
      `<button class="rm" title="로테이션에서 뺀다">×</button></div>`;
    row.querySelector('.up').onclick=()=>{if(i>0){const a=ST.rotation;[a[i-1],a[i]]=[a[i],a[i-1]];syncStarter();saveGame(true);renderLineup();}};
    row.querySelector('.dn').onclick=()=>{const a=ST.rotation;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];syncStarter();saveGame(true);renderLineup();}};
    row.querySelector('.rm').onclick=()=>{
      if(ST.rotation.length<=1){toast('투수가 최소 한 명은 있어야 한다');return;}
      ST.rotation=ST.rotation.filter(x=>x!==pid);
      syncStarter(); saveGame(true); renderLineup(); toast(`${p.name} 로테이션에서 제외`);
    };
    pc.appendChild(row);
  });

  /* 로테이션에 없는 투수를 다시 넣는 버튼.
     이게 없어서 한 번 빠진 투수를 되살릴 방법이 없었다.              */
  const spare=t.pitchers.filter(p=>ST.rotation.indexOf(p.id)<0);
  const addb=el('button','btn',`투수 추가 (대기 ${spare.length}명)`);
  addb.onclick=()=>{

function syncStarter(){
  // 라인업에 투수 자리가 있으면 선발 투수를 자동으로 그 자리에 넣는다
  const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
  if(pIdx<0)return;
  const sp=ST.rotation[0];
  if(ST.lineup[pIdx].id===sp)return;
  const dup=ST.lineup.findIndex(s=>s.id===sp);
  if(dup>=0&&dup!==pIdx){
    const tmp=ST.lineup[pIdx].id;
    ST.lineup[pIdx].id=sp;
    ST.lineup[dup].id=tmp;
  } else {
    ST.lineup[pIdx].id=sp;
  }
}
/* 지명타자를 쓰면 투수는 타순 밖에 있는 게 원칙이다.
   그런데 결장이 겹치면 이미 야수로 들어가 있는 사람이 마운드에 올라간다.
   그러면 한 사람이 3루와 투수를 동시에 맡는 꼴이 되고, 화면에도 두 번 뜬다.

   [버그 이력] 송승민 결장 → 다음 투수도 결장 → 이미 3루수로 들어가 있던
   김한규가 선발이 되면서 '김한규 3루 / 김한규 투수' 가 됐다.

   이때는 그 사람의 수비 위치를 P 로 바꾸고, 비는 야수 자리를 지명타자나
   벤치에서 메운다. 메울 사람이 정말 없으면 선발을 다른 투수로 바꾼다.     */
function resolveStarterField(){
  if(!ST.lineup) return null;
  const t=TBYID['wwzw'];
  const rot=gameRotation();
  const sp=rot&&rot[0]; if(!sp) return null;
  const i=ST.lineup.findIndex(s=>s.id===sp);
  if(i<0) return null;                        // 타순 밖 — 정상
  const pos=ST.lineup[i].pos;
  if(pos==='P') return null;                  // 이미 투수 자리
  if(pos==='DH'){ ST.lineup[i].pos='P'; return {starter:sp,filled:null,from:'DH'}; }

  // 1) 지명타자가 그 자리를 볼 수 있으면 지타가 나간다
  const dh=ST.lineup.findIndex(s=>s.pos==='DH');
  if(dh>=0 && posFit(ST.lineup[dh].id,pos)>0){
    ST.lineup[dh].pos=pos; ST.lineup[i].pos='P';
    return {starter:sp, filled:ST.lineup[dh].id, pos, from:'DH'};
  }
  // 2) 벤치에서 그 자리를 볼 수 있는 사람을 올린다 (지타 자리와 맞바꾼다)
  const bench=t.players.filter(q=>isAvailable(q.id)&&!ST.lineup.some(x=>x.id===q.id));
  const rep=bench.filter(q=>posFit(q.id,pos)>0).sort((a,b)=>posFit(b.id,pos)-posFit(a.id,pos))[0];
  if(rep && dh>=0){
    const outId=ST.lineup[dh].id;
    ST.lineup[dh].id=rep.id; ST.lineup[dh].pos=pos; ST.lineup[i].pos='P';
    return {starter:sp, filled:rep.id, pos, from:'bench', out:outId};
  }
  if(rep){
    ST.lineup[i].pos='P';
    // 지타가 없으면 타순 밖 수비 교대는 불가능하니 그냥 P 로 두고 자리를 비운다
    return {starter:sp, filled:null, pos, from:'none'};
  }
  // 3) 아무도 못 메우면 다른 투수를 선발로 세운다
  const alt=rot.find(id=>id!==sp && !ST.lineup.some(x=>x.id===id));
  if(alt){
    ST.rotation=[alt].concat((ST.rotation||[]).filter(x=>x!==alt));
    return {starter:alt, swapped:sp};
  }
  ST.lineup[i].pos='P';
  return {starter:sp, filled:null, pos, from:'none'};
}

function applyDHRule(){
  const t=TBYID['wwzw'];
  const sp=ST.rotation[0];
  const used=()=>ST.lineup.map(x=>x.pos);
  const freePos=(exclude)=>ALLPOS.concat(['P']).filter(x=>x!=='DH'&&!ST.lineup.some((s,i)=>i!==exclude&&s.pos===x));

  if(!ST.useDH){
    // 투수가 반드시 타순에 들어간다
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    const spIdx=ST.lineup.findIndex(s=>s.id===sp);
    if(spIdx>=0){
      // 이미 라인업에 있으면 그 자리를 P로
      if(pIdx>=0&&pIdx!==spIdx) ST.lineup[pIdx].pos=freePos(pIdx).find(x=>x!=='P')||'RF';
      ST.lineup[spIdx].pos='P';
    } else {
      // DH 자리를 투수로 교체, 없으면 마지막 타순
      let slot=ST.lineup.findIndex(s=>s.pos==='DH');
      if(slot<0) slot=8;
      ST.lineup[slot]={id:sp,pos:'P'};
    }
  } else {
    /* DH 사용 중에는 투수가 타순에 서지 않는다.
       그런데 유저가 타순의 누군가를 'P' 로 지정했다면
       "이 사람을 선발로 쓰겠다"는 뜻이므로 로테이션 1번으로 올려주고
       타순에서는 지명타자(또는 빈 야수 자리)로 되돌린다.
       예전에는 그냥 지워버려서 아무 일도 안 일어난 것처럼 보였다.    */
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    if(pIdx>=0){
      const who=ST.lineup[pIdx].id;
      if(TBYID['wwzw'].pitchers.some(p=>p.id===who)&&ST.rotation[0]!==who){
        ST.rotation=[who].concat((ST.rotation||[]).filter(x=>x!==who));
        ST._starterMoved=who;         // 화면에서 안내 문구를 띄우기 위한 표시
      }
      const hasDH=ST.lineup.some(s=>s.pos==='DH');
      ST.lineup[pIdx].pos = hasDH ? (freePos(pIdx).find(x=>posFit(who,x)>0)||'RF') : 'DH';
    }
  }
  syncStarter();
  // DH 미사용인데 DH 슬롯이 남아 있으면 야수 자리로 전환
  if(!ST.useDH){
    ST.lineup.forEach((s,i)=>{
      if(s.pos!=='DH')return;
      const cand=ALLPOS.filter(x=>x!=='DH'&&!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos=cand.find(x=>posFit(s.id,x)>0)||cand[0]||'RF';
    });
  }
  // 포지션 중복 정리
  const seen={};
  ST.lineup.forEach((s,i)=>{
    if(seen[s.pos]){
      const cand=ALLPOS.concat(ST.useDH?[]:['P']).filter(x=>!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos = cand.find(x=>posFit(s.id,x)>0) || cand[0] || s.pos;
    }
    seen[s.pos]=true;
  });
}

function restLabel(pid){
  const r=ST.rest&&ST.rest[pid]!==undefined?ST.rest[pid]:3;
  if(!isAvailable(pid))return '<b class="dead">불가</b>';
  if(r>=2)return '<b class="ok">정상</b>';
  if(r===1)return '<b class="tired">피로</b>';
  return '<b class="dead">과부하</b>';
}

function openPicker(idx){
  const t=TBYID['wwzw'];
  $('#sheet-title').textContent=`${idx+1}번 타자`;
  const body=$('#sheet-body'); body.innerHTML='';
  const inL=new Set(ST.lineup.map(s=>s.id));
  t.players.forEach(p=>{
    const cur=ST.lineup[idx].id===p.id;
    const used=inL.has(p.id)&&!cur;
    const ok=isAvailable(p.id);
    const iv=ST.injury[p.id];
    const row=el('button','pick-row'+(cur?' cur':'')+(used?' used':'')+(ok?'':' bad'));
    row.innerHTML=`<div class="pk-l"><div class="pk-name">${p.no!=null?`<span class="pc-no">#${p.no}</span> `:''}${p.name}${formTag(p.id)?`<span class="ftag">${formTag(p.id)}</span>`:''}${p.bats==='L'?'<span class="lh">좌</span>':''}</div>
      <div class="pk-note">${iv?iv.name:((ST.absent&&ST.absent[p.id])||(META[p.id]?META[p.id].desc:''))}</div></div>
      <div class="pk-r">${starHTML(effCA(p.id))}<div class="pk-stat">${condLabel(ST.cond[p.id]||70)}</div></div>`;
    row.onclick=()=>{
      const wasP = ST.lineup[idx].pos==='P';
      const o=ST.lineup.findIndex(s=>s.id===p.id);
      if(o>=0&&o!==idx){const tmp=ST.lineup[o].id;ST.lineup[o].id=ST.lineup[idx].id;ST.lineup[idx].id=tmp;}
      else ST.lineup[idx].id=p.id;
      // 타순의 투수 자리를 바꿨으면 선발도 그 사람으로 따라간다
      if(wasP && TBYID['wwzw'].pitchers.some(x=>x.id===p.id)) setStarter(p.id);
      closeSheet();saveGame(true);renderLineup();
    };
    body.appendChild(row);
  });
  $('#sheet').classList.add('open');
}
function openPosPicker(idx){
  const t=TBYID['wwzw'];
  const p=t.players.find(x=>x.id===ST.lineup[idx].id);
  $('#sheet-title').textContent=`${p.name} 수비 위치`;
  const body=$('#sheet-body'); body.innerHTML='';
  const taken={}; ST.lineup.forEach((s,i)=>{if(i!==idx)taken[s.pos]=true;});
  /* 투수(P)는 지명타자를 쓰든 안 쓰든 항상 고를 수 있다.
     고르면 '선발 지정'으로 해석해서 로테이션 1번으로 올린다.
     예전에는 DH 사용 중이면 P 가 목록에 없거나 골라도 조용히 지워져서
     "투수로 바꿨는데 아무 일도 안 일어난다"는 문제가 있었다.          */
  const isP = TBYID['wwzw'].pitchers.some(x=>x.id===p.id);
  const list = (ST.useDH ? ALLPOS : ALLPOS.filter(x=>x!=='DH')).concat(['P']);
  list.forEach(pos=>{
    const starter = ST.rotation[0]===p.id;
    const fitV = pos==='P' ? (isP?Math.max(1,basePosFit(p.id,'P')):0) : posFit(p.id,pos);
    const fit=fitV>=45;
    const cur = pos==='P' ? starter : ST.lineup[idx].pos===pos;
    const row=el('button','pick-row'+(cur?' cur':'')+(pos!=='P'&&taken[pos]?' used':''));
    const note = pos==='P'
      ? (!isP ? '투수로 등록되지 않은 선수다'
              : (starter?'이미 오늘 선발이다':(ST.useDH?'선발로 지정한다 (타순에는 안 선다)':'선발로 지정한다')))
      : (fitV<=0?'불가 (좌투)':fit?'주 포지션':'익숙하지 않다 — 수비 하락');
    row.innerHTML=`<div class="pk-l"><div class="pk-name">${POSNAMES[pos]}</div>
      <div class="pk-note">${note}`+
      `${pos!=='P'&&posTrained(p.id,pos)>=1?` · 훈련 +${Math.round(posTrained(p.id,pos))}`:''}</div></div>
      <div class="pk-r"><div class="pk-stat">${pos==='P'?(isP?'선발':'—'):(taken[pos]?'중복':(fitV>0?fitV:'—'))}</div></div>`;
    if(fitV<=0) row.classList.add('bad');
    row.onclick=()=>{
      if(pos==='P'){
        if(!isP){toast(`${p.name}은(는) 투수 로테이션에 없다. 로테이션에서 먼저 추가해라`);return;}
        setStarter(p.id);
        closeSheet(); saveGame(true); renderLineup();
        toast(ST.useDH?`${p.name} 선발 지정 — 지명타자를 쓰는 중이라 타순에는 안 선다`
                      :`${p.name} 선발 지정`);
        return;
      }
      const o=ST.lineup.findIndex((s,i)=>i!==idx&&s.pos===pos);
      if(o>=0)ST.lineup[o].pos=ST.lineup[idx].pos;
      ST.lineup[idx].pos=pos;
      closeSheet();saveGame(true);renderLineup();
    };
    body.appendChild(row);
  });
  $('#sheet').classList.add('open');
}

function renderTutorial(){
  const c=$('#view'); c.innerHTML='';
  const i=Math.max(0,Math.min(TUTORIAL.length-1, ST.tutStep||0));
  const t=TUTORIAL[i];
  const g=GUIDES[t.who||'ian'];
  if(g){
    const gw=el('div','tut-guide');
    gw.innerHTML=`<img src="${g.img}" alt="${g.name}">
      <div class="tg-talk"><div class="tg-nm">${g.name}<span>${g.tag}</span></div>
        <p>${t.say||''}</p></div>`;
    c.appendChild(gw);
  }
  const head=el('div','card');
  head.innerHTML=`<div class="card-h">${t.t}</div>
    <div class="tut-body">${t.b}</div>
    <div class="tut-dots">${TUTORIAL.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
  c.appendChild(head);
  const row=el('div','btn-row');
  if(i>0){
    const pv=el('button','btn','← 이전');
    pv.onclick=()=>{ST.tutStep=i-1;renderTutorial();};
    row.appendChild(pv);
  }
  if(i<TUTORIAL.length-1){
    const nx=el('button','btn primary','다음 →');
    nx.onclick=()=>{ST.tutStep=i+1;saveGame(true);renderTutorial();};
    row.appendChild(nx);
  } else {
    const done=el('button','btn primary','시작한다');
    done.onclick=()=>{ST.tutDone=true;ST.tutStep=0;saveGame(true);go('home');toast('설정에서 다시 볼 수 있다');};
    row.appendChild(done);
  }
  c.appendChild(row);
  const skip=el('button','btn',`${i+1} / ${TUTORIAL.length} · 건너뛴다`);
  skip.onclick=()=>{ST.tutDone=true;ST.tutStep=0;saveGame(true);go('home');};
  c.appendChild(skip);
}

/* ---------- 면담 ---------- */
/* 면담은 선수당 주 1회. 라운드가 넘어가면 다시 부를 수 있다. */
function openMeet(pid){
  if(pid===(ST.playerId||MYID)){ toast('나 자신과 면담할 수는 없다'); return; }
  if(!ST.meetRound)ST.meetRound={};
  const resuming = ST.meet && ST.meet.pid===pid && !ST.meet.done;
  if(!resuming && ST.meetRound[pid]===ST.round){
    toast(`${nameOf(pid)}과(와)는 이번 주에 이미 면담했다`); return;
  }
  if(!resuming){
    ST.meet={pid,done:false,log:[{who:pid,text:meetOpenLine(ST,pid),
      mood:((ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0)>=2?'angry':'flat'}]};
  }
  go('meet');
}

function renderMeet(){
  const c=$('#view'); c.innerHTML='';
  if(!ST.meet){ go('squad'); return; }
  const pid=ST.meet.pid;
  const p=TBYID['wwzw'].players.find(x=>x.id===pid);
  if(!p){ ST.meet=null; go('squad'); return; }
  const un=(ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0;

  const head=el('div','card');
  head.innerHTML=`<div class="card-h meet-head"><span>면담 · ${p.name}</span>
      <span class="meet-lv">${unhappyLabel(un)}</span></div>
    <p class="muted">사기 ${moraleLabel(ST.morale[pid]||70)} · 우정 ${bondLabel(bondOf(pid))} · 컨디션 ${condLabel(ST.cond[pid]||70)}
      · 출석 성향 ${Math.round(((META[pid]&&META[pid].attend)!=null?META[pid].attend:0.85)*100)}%</p>`;
  const pr0=ST.promise&&ST.promise[pid];
  if(pr0) head.appendChild(el('div','pc-prom','진행 중인 약속: '+promiseLabel(pr0)));
  c.appendChild(head);

  const room=el('div','kakao');
  ST.meet.log.forEach(m=>{
    const mine=isMe(m.who)||m.who===ST.playerId;
    const w=el('div','kmsg'+(mine?' mine':'')+(m.type==='notice'?' notice':''));
    w.innerHTML=`${(mine||m.type==='notice')?'':`<div class="kname">${p.name}</div>`}`+
      `<div class="kbub ${m.mood||''}">${String(m.text).replace(/\n/g,'<br>')}</div>`;
    room.appendChild(w);
  });
  c.appendChild(room);

  if(!ST.meet.done){
    const box=el('div','card sendbox');
    box.appendChild(el('div','card-h','뭐라고 할까'));
    const opts=[
      {k:'start', label:'약속한다 — 다음 5경기 선발 보장',
       desc:'지키면 사기 +15 · 불만 초기화. 어기면 사기 -20 · 불만 +2'},
      {k:'order', label:'약속한다 — 다음 5경기 5번 타순 이상',
       desc:'5번 안쪽 보장. 어기면 더 크게 삐진다'},
      {k:'calm',  label:'달랜다',
       desc:'60% 확률로 사기 +8 · 불만 1단계 감소. 실패하면 아무 변화 없음'},
      {k:'ignore',label:'무시한다',
       desc:'본인 사기 -10 · 불만 1단계 상승. 대신 팀 기강이 잡힌다'},
    ];
    opts.forEach(o=>{
      const b=el('button','sendopt');
      b.innerHTML=`<b>${o.label}</b><span>${o.desc}</span>`;
      b.onclick=()=>doMeet(o.k);
      box.appendChild(b);
    });
    c.appendChild(box);
    const back=el('button','btn','그냥 나간다');
    back.onclick=()=>{ ST.meet=null; go('squad'); };
    c.appendChild(back);
  } else {
    const back=el('button','btn primary','선수단으로');
    back.onclick=()=>{ ST.meet=null; go('squad'); };
    c.appendChild(back);
  }
}

function doMeet(kind){
  const pid=ST.meet.pid, log=ST.meet.log;
  if(!ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
  const u=ST.unhappy[pid];
  let tip='';

  if(kind==='start'||kind==='order'){
    log.push({who:ST.playerId,
      text:kind==='order'?'다음 5경기 5번 타순 안으로 쓴다':'다음 5경기 선발로 쓴다',mood:'ok'});
    ST.promise=ST.promise||{};
    ST.promise[pid]={type:kind,games:5,orderMax:5};
    ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+10);
    u.level=Math.max(0,u.level-1); u.streak=0;
    log.push({who:pid,text:meetReplyLine(ST,pid,kind),mood:'happy'});
    log.push({who:pid,type:'notice',text:`약속 성립 — ${promiseLabel(ST.promise[pid])}`});
    tip='약속했다. 라인업 짤 때 잊지 마라';
  }
  else if(kind==='calm'){
    log.push({who:ST.playerId,text:'조금만 더 기다려봐라. 기회는 온다',mood:'ok'});
    // 불만이 클수록 달래기가 잘 안 먹힌다 (기본 60% · 3단계 이상이면 40%)
    // 술 약속 등으로 쌓인 우정이 있으면 말이 먹힌다 (±15%p)
    const rate = (u.level>=3?0.40:0.60) + (bondOf(pid)-50)*0.003;
    if(Math.random()<rate){
      ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+8);
      u.level=Math.max(0,u.level-1); u.streak=0; bondAdd(pid,3);
      log.push({who:pid,text:meetReplyLine(ST,pid,'soothe_ok'),mood:'happy'});
      log.push({who:pid,type:'notice',text:`달래기 성공 — 사기 +8 · 불만 ${unhappyLabel(u.level)}`});
      tip='잘 달랬다';
    } else {
      log.push({who:pid,text:meetReplyLine(ST,pid,'soothe_no'),mood:'sad'});
      log.push({who:pid,type:'notice',text:'달래기 실패 — 변화 없음'});
      tip='안 먹혔다';
    }
  }
  else {
    log.push({who:ST.playerId,text:'그런 얘기 들을 시간 없다. 실력으로 보여라',mood:'angry'});
    ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-10);
    u.level=Math.min(4,u.level+1); u.streak=0;
    log.push({who:pid,text:meetReplyLine(ST,pid,'ignore'),mood:'angry'});
    bondAdd(pid,-8);
    // 기강 효과 — 나머지 선수는 "감독이 단호하다"고 받아들인다.
    // 별도 스탯을 만들면 엔진까지 건드려야 해서 사기 소폭 상승 + 불만 누적 리셋으로 처리한다.
    let n=0;
    TBYID['wwzw'].players.forEach(q=>{
      if(q.id===pid)return;
      ST.morale[q.id]=Math.min(100,(ST.morale[q.id]||70)+2);
      if(ST.unhappy[q.id])ST.unhappy[q.id].streak=0;
      n++;
    });
    log.push({who:pid,type:'notice',
      text:`${nameOf(pid)} 사기 -10 · 불만 ${unhappyLabel(u.level)}\n나머지 ${n}명 사기 +2 (팀 기강)`});
    tip='단호하게 잘랐다';
  }

  ST.meet.done=true;
  if(!ST.meetRound)ST.meetRound={};
  ST.meetRound[pid]=ST.round;
  saveGame(true); renderMeet(); toast(tip);
}

function renderKakao(){
  const c=$('#view'); c.innerHTML='';
  const played=ST.schedule[ST.round]&&ST.schedule[ST.round].played;
  const phase = (ST.kakaoPost&&ST.kakaoPost.length)?'post':'pre';

  const head=el('div','card');
  head.innerHTML='<div class="card-h">우완좌완 에이스방</div>';
  /* 발표는 그 주에 딱 한 번이다.
     [버그 이력] 예전에는 phase 만 보고 버튼을 다시 띄웠다. 그래서 발표를 계속
     다시 눌러 반응이 마음에 들 때까지 굴릴 수 있었다. 발표된 뒤에는 안 띄운다. */
  const announced = !!ST.announced;
  if(phase==='pre' && !announced && !played){
    const b=el('button','btn','라인업 발표');
    b.onclick=()=>{
      if(ST.announced)return;                          // 두 번 눌러도 한 번만
      ST.kakao=buildKakaoPre(ST); ST.announced=true; ST.sentPre=false; saveGame(true); renderKakao();
    };
    head.appendChild(b);
  } else if(phase==='pre' && announced){
    head.appendChild(el('p','muted','이번 주 라인업은 이미 발표했다. 다시 짜려면 라인업 화면에서 고쳐라.'));
  }
  c.appendChild(head);

  if(ST.dropouts&&ST.dropouts.length){
    const avail=TBYID['wwzw'].players.filter(p=>isAvailable(p.id)).length;
    c.appendChild(el('div','warn',
      `발표 후 ${ST.dropouts.map(nameOf).join(', ')}이(가) 못 온다고 했다. `+
      (avail>=9?'라인업을 자동으로 채웠다. 확인해라.':`출전 가능 ${avail}명 — 몰수패 위기다.`)));
  }
  const all=(ST.kakao||[]).concat(ST.kakaoPost||[]);
  if(!all.length){
    c.appendChild(el('p','muted','아직 발표하지 않았다. 위 버튼을 누르면 단톡방에 라인업이 올라간다.'));
    return;
  }

  const room=el('div','kakao');
  all.forEach(m=>{
    const p=TBYID['wwzw'].players.find(x=>x.id===m.who);
    const nm=p?p.name:'?';
    const mine=isMe(m.who);
    const w=el('div','kmsg'+(mine?' mine':'')+(m.type==='notice'?' notice':'')+(m.type==='record'?' record':''));
    w.innerHTML=`${(mine||m.type==='notice'||m.type==='record')?'':`<div class="kname">${nm}</div>`}<div class="kbub ${m.mood||''}">${String(m.text).replace(/\n/g,'<br>')}</div>`;
    room.appendChild(w);
  });
  c.appendChild(room);

  // 발신 선택지
  const sent = phase==='pre' ? ST.sentPre : ST.sentPost;
  if(!sent){
    const box=el('div','card sendbox');
    box.appendChild(el('div','card-h','뭐라고 보낼까'));
    const opts=kakaoOptions(ST,phase);
    opts.forEach(o=>{
      const b=el('button','sendopt');
      b.innerHTML=`<b>${o.label}</b><span>${o.desc}</span>`;
      b.onclick=()=>{
        const mine={who:ST.playerId,text:o.label,mood:'ok'};
        if(o.action==='party'){
          if(ST.budget<PARTY_COST){toast(`회식비가 부족하다 (${PARTY_COST}만원 필요)`);return;}
          ST.budget-=PARTY_COST;
          (phase==='pre'?ST.kakao:ST.kakaoPost).push(mine);
          const r=doAfterParty(ST);
          ST.kakaoPost.push({who:'lg',type:'notice',text:`회식비 ${PARTY_COST}만원 지출 · 남은 운영비 ${ST.budget.toFixed(0)}만원`});
          ST.kakaoPost.push({who:'lg',text:`${r.joined.length}명 모였다. 오늘 잘했다`,mood:'happy'});
          (r.msgs||[]).forEach(m=>ST.kakaoPost.push(m));
          ST.sentPost=true;
          saveGame(true); renderKakao(); toast('회식 · 사기↑ 컨디션↓');
          return;
        }
        (phase==='pre'?ST.kakao:ST.kakaoPost).push(mine);
        const reply=o.run?o.run():[];
        reply.forEach(m=>(phase==='pre'?ST.kakao:ST.kakaoPost).push(m));
        if(phase==='pre')ST.sentPre=true; else ST.sentPost=true;
        saveGame(true); renderKakao();
      };
      box.appendChild(b);
    });
    c.appendChild(box);
  }

  if(!played){
    /* 카톡에 라인업을 올려야 경기로 넘어간다. 발표 없이 경기부터 하는 건 순서가 아니다. */
    if(!announced){
      c.appendChild(el('p','muted','라인업을 먼저 발표해야 경기로 넘어간다.'));
    } else if(ST.lineupDirty){
      c.appendChild(el('div','warn','못 온다는 사람이 생겼다. 라인업을 다시 확정해야 경기로 넘어간다.'));
      const lb=el('button','btn primary','라인업 고치러 가기'); lb.onclick=()=>go('lineup');
      c.appendChild(lb);
    } else {
      const g=el('button','btn primary','경기 시작'); g.onclick=()=>go('game');
      c.appendChild(g);
    }
  } else {
    const g=el('button','btn primary','다음 주로'); g.onclick=()=>go('home');
    c.appendChild(g);
  }
}

/* ---------- 경기 ---------- */
function renderGame(){
  const c=$('#view'); c.innerHTML='';
  if(ST.seasonOver){c.appendChild(el('div','card','시즌이 끝났다.'));return;}
  if(!ST.weekDone){c.appendChild(el('div','card','홈에서 이번 주를 먼저 시작해라.'));return;}
  if(!ST.announced){
    c.appendChild(el('div','card','단톡방에 라인업을 먼저 발표해야 한다.'));
    const kb=el('button','btn primary','단톡방으로'); kb.onclick=()=>go('kakao');
    c.appendChild(kb); return;
  }
  if(ST.lineupDirty){
    c.appendChild(el('div','card','발표 뒤에 못 온다는 사람이 생겼다. 라인업을 다시 확정해야 한다.'));
    const lb=el('button','btn primary','라인업으로'); lb.onclick=()=>go('lineup');
    c.appendChild(lb); return;
  }
  if(ST.events&&ST.events.some(e=>e.type==='rain'||e.type==='postpone')){c.appendChild(el('div','card','우천 취소된 주다.'));return;}

  const avail=TBYID['wwzw'].players.filter(p=>isAvailable(p.id)).length;
  const bad=ST.lineup.filter(s=>!isAvailable(s.id));
  if(bad.length){
    if(avail>=9){
      // 벤치에서 자동 보충
      const pool=TBYID['wwzw'].players.filter(p=>isAvailable(p.id)&&!ST.lineup.some(x=>x.id===p.id));
      bad.forEach(b2=>{
        const i=ST.lineup.findIndex(x=>x.id===b2.id);
        const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
        if(rep){ST.lineup[i].id=rep.id;pool.splice(pool.indexOf(rep),1);}
      });
      applyDHRule(); saveGame(true);
      c.appendChild(el('div','warn',
        bad.map(x=>nameOf(x.id)).join(', ')+'이(가) 빠져서 라인업을 자동으로 채웠다.'));
    } else {
      c.appendChild(el('div','warn',
        `출전 가능 인원이 ${avail}명뿐이다. 9명을 못 채우면 몰수패(0:7)다. 용병을 부르면 채울 수 있다.`));
      const b0=el('button','btn','단톡방에 사정해본다');
      b0.onclick=()=>{
        const cands=TBYID['wwzw'].players.filter(p=>ST.absent&&ST.absent[p.id]);
        if(!cands.length){toast('부를 사람이 없다');return;}
        const p=cands[(Math.random()*cands.length)|0];
        ST.kakao=ST.kakao||[];
        if(Math.random()<0.45){
          delete ST.absent[p.id];
          ST.morale[p.id]=Math.max(10,ST.morale[p.id]-6);
          ST.cond[p.id]=Math.max(25,ST.cond[p.id]-10);
          ST.kakao.push({who:p.id,text:say(p.id,'알겠다 늦게라도 갈게','알겠습니다 늦게라도 가겠습니다'),mood:'flat'});
          ST.lineup=recommendLineup(); applyDHRule();
          toast(`${p.name}이(가) 오기로 했다`);
        } else {
          ST.kakao.push({who:p.id,text:say(p.id,'미안하다 진짜 안 된다','정말 죄송합니다 안 됩니다'),mood:'sad'});
          toast(`${p.name} 못 온다고 한다`);
        }
        saveGame(true); go('game');
      };
      const bm2=el('button','btn','용병 부른다');
      bm2.onclick=()=>openMercSheet(()=>go('game'));
      c.appendChild(bm2);
      const b1=el('button','btn danger','몰수패 처리'); b1.onclick=forfeit;
      c.appendChild(b0); c.appendChild(b1);
      return;
    }
  }

  const next=ST.schedule[ST.round], opp=TBYID[next.opp];
  const head=el('div','card');
  head.innerHTML=`<div class="card-h">${next.po?(next.po==='final'?'단원리그 C 결승':'단원리그 C 준결승'):next.round+'차전'}</div>
    <div class="vs"><span>${next.homeGame?opp.name:'우완좌완'}</span><b>vs</b><span>${next.homeGame?'우완좌완':opp.name}</span></div>
    <div class="gdate">${(ST.calendar&&ST.calendar.label)||''} · ${(PARKS.find(p=>p.id===ST.park)||PARKS[0]).name} · ${(WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0]).name}</div>
    <div class="daterow"><b>${(ST.calendar&&ST.calendar.label)||''}</b><span>${((WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0]).name)}</span></div>
    <p class="muted">${next.homeGame?'홈':'원정'} · 7이닝 · 콜드게임 있음</p>
    <div class="scout">${ST.scoutBlocked?'상대 정보 없음':scoutLine(opp)}</div>`;
  c.appendChild(head);

  const fx=resolveStarterField();
  if(fx&&fx.filled)
    c.appendChild(el('div','warn',
      `${nameOf(fx.starter)}이(가) 마운드에 올라가서 ${POSNAMES[fx.pos]}는 ${nameOf(fx.filled)}이(가) 본다.`));
  else if(fx&&fx.swapped)
    c.appendChild(el('div','warn',
      `${nameOf(fx.swapped)}은(는) 이미 야수로 나가 있어서 선발을 ${nameOf(fx.starter)}(으)로 바꿨다.`));
  const sp=TBYID['wwzw'].pitchers.find(x=>x.id===gameRotation()[0])
    ||TBYID['wwzw'].pitchers.find(x=>x.id===ST.rotation[0]);
  const rr=(ST.rest&&sp)?ST.rest[sp.id]:3;
  if(!sp){c.appendChild(el('div','card','던질 사람이 없다.'));return;}
  if(rr<2)c.appendChild(el('div','warn',`선발 ${sp.name}이(가) ${rr===0?'과부하 상태다':'피로하다'}. 구위·제구가 떨어진다.`));

  /* [버그 이력] 경기가 끝나고 결과를 확정하기 전에 이 버튼을 또 누르면
     경기가 통째로 다시 돌아갔다. 마음에 드는 결과가 나올 때까지 굴릴 수 있었다.
     이제 한 번 시작하면 버튼이 사라지고, 끝난 경기는 결과 화면만 다시 연다.   */
  const st=el('div','stage'); st.id='stage';
  if(LIVE && LIVE.over){
    // 결과를 아직 확정하지 않은 경기가 있다 — 다시 시작이 아니라 결과로 보낸다
    c.appendChild(el('div','warn','치른 경기의 결과를 아직 확정하지 않았다.'));
    const rb=el('button','btn primary','결과 보기');
    rb.onclick=()=>{ c.appendChild(st); showResult(); };
    c.appendChild(rb); c.appendChild(st);
    return;
  }
  LIVE=null;                                  // 중간에 나갔던 경기는 버린다
  const ctrl=el('div','btn-row');
  const b1=el('button','btn primary','직접 지휘');
  const b2=el('button','btn','자동 진행');
  const lock=fn=>()=>{ if(!ctrl.parentNode)return; ctrl.remove(); fn(); };
  b1.onclick=lock(()=>startLive(true)); b2.onclick=lock(()=>startLive(false));
  ctrl.appendChild(b1);ctrl.appendChild(b2); c.appendChild(ctrl);
  c.appendChild(st);
}

/* ST.rotation 자체의 유효성만 정리한다.
   로스터에 없는 id(이적·방출·용병)만 걸러내고, 결장자는 건드리지 않는다.

   [버그 이력] 예전에는 여기서 결장자를 지우고 ST.rotation 을 통째로
   덮어썼다. 그래서 늦잠으로 한 경기 빠진 투수가 다음 주에 돌아와도
   로테이션에 없었고, UI 에 '추가' 버튼도 없어서 되살릴 방법이 없었다.
   "투수가 사라진다"는 제보가 전부 이것 때문이다.                      */
function sanitizeRotation(){
  const t=TBYID['wwzw'];
  ST.rotation=(ST.rotation||[]).filter(id=>t.pitchers.some(p=>p.id===id));
  // 중복 제거
  ST.rotation=ST.rotation.filter((id,i)=>ST.rotation.indexOf(id)===i);
  if(!ST.rotation.length)ST.rotation=recommendRotation();
  return ST.rotation;
}

/* 이번 경기에 실제로 쓸 등판 순서.
   결장·부상자를 '이 경기에서만' 건너뛴다. ST.rotation 은 그대로 둔다.

   선발 투수의 유일한 진실은 ST.rotation[0] 이다.
   예전에는 라인업의 P 슬롯과 로테이션 1번이 따로 놀아서
   "타순에 보이는 투수와 실제 등판 투수가 다르다"는 문제가 있었다.
   지금은 setStarter() 가 양쪽을 한꺼번에 맞춘다.                      */
function gameRotation(){
  const t=TBYID['wwzw'];
  sanitizeRotation();
  let rot=ST.rotation.filter(id=>isAvailable(id));
  if(!rot.length){
    // 설정한 투수가 전부 결장이면 나온 사람 중에서 급히 채운다
    rot=t.pitchers.filter(p=>isAvailable(p.id))
      .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
      .slice(0,6).map(p=>p.id);
  }
  return rot;
}

/* 선발 투수 지정 — 로테이션 1번으로 올리고 라인업까지 맞춘다.
   라인업 포지션 시트에서 'P' 를 고르면 이걸 부른다.                   */
function setStarter(pid){
  const t=TBYID['wwzw'];
  if(!t.pitchers.some(p=>p.id===pid)) return false;
  ST.rotation=[pid].concat((ST.rotation||[]).filter(x=>x!==pid));
  applyDHRule();
  return true;
}

function makeLive(){
  sanitizeRotation();
  ST.gameRotation=gameRotation();     // 이번 경기 등판 순서 스냅샷
  /* 지명타자를 안 쓰면 타순의 투수 자리에 '실제로 던질 사람'이 앉아야 한다.
     로테이션 1번이 그날 결장이면 타순 투수와 등판 투수가 어긋났었다.     */
  if(!ST.useDH && ST.gameRotation.length){
    const sp=ST.gameRotation[0];
    const pIdx=ST.lineup.findIndex(x=>x.pos==='P');
    if(pIdx>=0 && ST.lineup[pIdx].id!==sp){
      const dup=ST.lineup.findIndex(x=>x.id===sp);
      if(dup>=0 && dup!==pIdx){ ST.lineup[dup].pos=ST.lineup[pIdx].pos; }
      ST.lineup[pIdx].id=sp; ST.lineup[pIdx].pos='P';
    }
  }
  const next=ST.schedule[ST.round];
  const opp=TBYID[next.opp];
  const raw=TBYID['wwzw'];
  const hotDay = ST.weather==='hot'||ST.weather==='humid';
  const us={...raw, pitchers: raw.pitchers.map(p=>{
    const r=ST.rest[p.id]!==undefined?ST.rest[p.id]:3;
    let f=r>=2?1:(r===1?0.86:0.70);
    let np = f===1?{...p}:{...p,stf:Math.round(p.stf*f),ctl:Math.round(p.ctl*f),sta:Math.round(p.sta*f)};
    const mm=META[p.id];
    if(hotDay&&mm&&mm.traits.includes('더위약함')){
      np.sta = Math.min(np.sta, 26);          // 약 2이닝에서 한계
      np.heatFade = true;
    }
    return np;
  })};
  const rng=makeRng((ST.seed+ST.round*7919+(Date.now()%100000))>>>0);
  const uLine=ST.lineup.map(s=>({id:s.id,pos:s.pos}));
  // 약속(면담) 검사에 쓸 선발 라인업 스냅샷. 대타로 교체돼도 선발은 선발이다.
  ST.gameStarters = uLine.map(x=>x.id);
  const cond={};
  raw.players.forEach(p=>{
    let cv=(ST.cond[p.id]||70)+((ST.morale[p.id]||70)-70)*0.18;
    if(ST.mittMissing&&p.id==='yjh')cv-=6;
    const mm=META[p.id];
    const sl=uLine.find(x=>x.id===p.id);
    if(mm&&sl&&mm.traits.includes('포수부담')&&sl.pos==='C') cv-=14;
    const bf=ST.buff&&ST.buff[p.id];
    if(bf){ if(bf.all)cv*=bf.all; if(bf.pow)cv+=(bf.pow-1)*40; if(bf.spd)cv+=(bf.spd-1)*30; }
    cond[p.id]=Math.max(20,Math.min(100,cv));
  });
  const neutral={bat:'normal',run:'normal',hook:'normal'};
  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const gearPenalty = ST.gearLevel===2?30:(ST.gearLevel===1?10:0);
  recalcTeamDefense(us, uLine, gearPenalty);
  us._errMod = (raw._errMod||1) * (ST.fieldMod?ST.fieldMod.err:1) * ((ST.teamBuff&&ST.teamBuff.err)||1);
  // 상대팀 변수 반영
  const oe=ST.oppEvent?ST.oppEvent.eff:null;
  const oppMod = {...opp};
  if(oe){
    oppMod.tend={...opp.tend};
    if(oe.oppB) oppMod.tend.babip=opp.tend.babip*(1+oe.oppB);
    if(oe.oppE) oppMod.tend.err=opp.tend.err*oe.oppE;
    if(oe.oppP){ oppMod.pitchers=opp.pitchers.map(p=>({...p,
      stf:Math.max(18,p.stf+oe.oppP), ctl:Math.max(15,p.ctl+Math.round(oe.oppP*0.6))})); }
    oppMod.mean=opp.mean; oppMod._errMod=opp._errMod;
  }
  return new LiveGame({
    innings:7,rng,userIsHome:next.homeGame,
    home: next.homeGame?us:oppMod,
    away: next.homeGame?oppMod:us,
    homeLineup: next.homeGame?uLine:aiLineup(oppMod),
    awayLineup: next.homeGame?aiLineup(oppMod):uLine,
    homeRotation: next.homeGame?ST.gameRotation.slice():aiRotation(oppMod),
    awayRotation: next.homeGame?aiRotation(oppMod):ST.gameRotation.slice(),
    homeTactics: next.homeGame?{...ST.tactics}:neutral,
    awayTactics: next.homeGame?neutral:{...ST.tactics},
    homeCond: next.homeGame?cond:{},
    awayCond: next.homeGame?{}:cond,
    park, gearPenalty, buff: ST.buff||{}, hot: ST.weather==='hot',
    form: (function(){const o={};TBYID['wwzw'].pitchers.forEach(x=>{const m=formPitMul(x.id);if(m!==1)o[x.id]=m;});return o;})(),
    benchPool: TBYID['wwzw'].players
      .filter(p=>isAvailable(p.id) && !uLine.some(s=>s.id===p.id)
        && !(ST.gameRotation||[]).includes(p.id))
      .map(p=>p.id),
    myId: ST.playerId||MYID,          // 내 선수 연출용
    drunkIds: (ST.drunkIds||[]).slice(),
  });
}

function startLive(manual){
  const sch0=ST.schedule[ST.round];
  if(!sch0 || sch0.played){ toast('이미 끝난 경기다'); return; }
  if(LIVE && LIVE.over){ toast('결과를 먼저 확정해라'); return; }
  LIVE=makeLive(); LIVE.manual=manual;
  const stage=$('#stage'); stage.innerHTML='';
  const sb=el('div','scoreboard');
  sb.innerHTML=`<div class="sb-team"><span id="sb-tn">상대</span><b id="sb-them">0</b></div>
    <div class="sb-mid"><div id="sb-inn">1회 초</div><div class="sb-out" id="sb-out"></div></div>
    <div class="sb-team"><span>우완좌완</span><b id="sb-us">0</b></div>`;
  stage.appendChild(sb);
  const dia=el('div','diamond');
  dia.innerHTML=`<div class="base b2" id="bs2"></div><div class="base b3" id="bs3"></div><div class="base b1" id="bs1"></div><div class="base bh"></div>`;
  stage.appendChild(dia);
  const dec=el('div','decision'); dec.id='decision'; stage.appendChild(dec);
  const feed=el('div','feed'); feed.id='feed'; stage.appendChild(feed);
  const ctl=el('div','btn-row'); ctl.id='livectl'; stage.appendChild(ctl);
  $('#sb-tn').textContent=(LIVE.userIsHome?LIVE.away:LIVE.home).team.name;
  LIVE._logSeen=0;
  flushLog();
  updateLiveUI();
  runLive();
}

function updateLiveUI(){
  if(!LIVE)return;
  const us=LIVE.userIsHome?LIVE.home:LIVE.away;
  const th=LIVE.userIsHome?LIVE.away:LIVE.home;
  const a=$('#sb-us'),b=$('#sb-them'),i=$('#sb-inn'),o=$('#sb-out');
  if(a)a.textContent=us.runs; if(b)b.textContent=th.runs;
  if(i)i.textContent=`${LIVE.inning}회 ${LIVE.half===0?'초':'말'}`;
  if(o)o.textContent='●'.repeat(LIVE.outs)+'○'.repeat(Math.max(0,2-LIVE.outs));
  ['bs1','bs2','bs3'].forEach((id,k)=>{const e=$('#'+id);if(e)e.classList.toggle('on',!!LIVE.bases[k]);});
}

function flushLog(){
  const feed=$('#feed'); if(!feed||!LIVE)return;
  const fresh=LIVE.log.slice(LIVE._logSeen||0);
  LIVE._logSeen=LIVE.log.length;
  fresh.forEach(l=>{
    const cls=l.t==='inning'?'inn':(l.t==='sub'?'sub':(l.t==='me'?'meline':(l.t==='gojin'?'gojin':(l.t==='fric'?'fric':(l.t==='mgr'?'mgr':(l.cls||''))))));
    const d=el('div','fl '+cls+(l.me?' me':'')); d.textContent=l.text; feed.appendChild(d);
  });
  while(feed.children.length>50)feed.removeChild(feed.firstChild);
  feed.scrollTop=feed.scrollHeight;
}

function runLive(){
  clearInterval(playTimer);
  if(!LIVE.manual){
    // 자동 진행: 즉시 계산
    let guard=0;
    while(!LIVE.over && guard++<2000){
      if(LIVE.pending) LIVE.applyDecision('change');
      LIVE.step();
    }
    flushLog(); updateLiveUI(); showResult(); return;
  }
  const speed=520;
  playTimer=setInterval(()=>{
    if(!LIVE){clearInterval(playTimer);return;}
    if(LIVE.over){clearInterval(playTimer);showResult();return;}
    if(LIVE.manual){
      const d=LIVE.pending||LIVE.detectDecision();
      if(d){clearInterval(playTimer);showDecision(d);return;}
    } else if(LIVE.pending){ LIVE.applyDecision('change'); }
    LIVE.step();
    flushLog(); updateLiveUI();
    if(LIVE.over){clearInterval(playTimer);showResult();}
  },speed);
}

/* 판단창을 닫고 경기를 다시 굴린다 */
function decDone(box){ box.classList.remove('on'); box.innerHTML=''; flushLog(); updateLiveUI(); runLive(); }

/* 감독 액션 버튼 — 물통 차기 등. 판단창 양쪽에 붙는다 */
function mgrBtn(box){
  const b=el('button','decb wide alt');
  b.innerHTML=`<b>감독 액션 (남은 ${LIVE.mgr.left}회)</b><span>물통 차기 · 박수 · 심판 어필</span>`;
  b.onclick=()=>{
    const body=$('#sheet-body'); body.innerHTML='';
    $('#sheet-title').textContent='감독 액션';
    const us=LIVE.userSide(), th=LIVE.oppSide();
    const diff=us.runs-th.runs;
    body.appendChild(el('div','sheet-note',
      `${LIVE.inning}회 · ${diff>0?'+':''}${diff}점. `+
      (diff<0?'지고 있을 때는 물통을 차는 게 먹힐 확률이 높다.'
             :'이기고 있을 때 화를 내면 오히려 위축된다.')+
      ` 남은 횟수 ${LIVE.mgr.left}회.`));
    [['bottle','물통을 걷어찬다',`분위기 반전. 지고 있으면 62% 성공, 이기고 있으면 25%`],
     ['clap','크게 박수를 친다','무난하게 사기 +3%'],
     ['umpire','심판에게 어필한다','40% 유리 / 20% 경고'],
     ['watch','조용히 지켜본다','횟수를 쓰지 않는다']].forEach(([k,n,d2])=>{
      const r=el('button','pick-row'+(LIVE.mgr.left<=0&&k!=='watch'?' bad':''));
      r.innerHTML=`<div class="pk-l"><div class="pk-name">${n}</div>
        <div class="pk-note">${d2}</div></div>`;
      if(LIVE.mgr.left>0||k==='watch')r.onclick=()=>{
        const res=LIVE.mgrAction(k);
        closeSheet(); toast(res.text.length>40?res.text.slice(0,40)+'…':res.text);
        decDone(box);
      };
      body.appendChild(r);
    });
    $('#sheet').classList.add('open');
  };
  return b;
}

/* '투수 교체' 상시 버튼 — 공격 중에도 미리 예고해 둘 수 있다 */
function pchangeBtn(box){
  const s=LIVE.userSide();
  if(s.pIdx>=s.rot.length-1) return null;
  const cur=LIVE.curPitcher(s);
  const nxt=LIVE.curPitcherNext(s);
  const l=LIVE.pbox[cur.id]||{};
  const b=el('button','decb wide alt');
  b.innerHTML=`<b>투수 교체 → ${nxt}</b><span>${cur.name} ${ipStr(l)}이닝 ${l.r||0}실점 ${l.bb||0}볼넷 · 작전 횟수 안 씀</span>`;
  b.onclick=()=>{ LIVE.applyDecision('pchange'); decDone(box); };
  return b;
}

function showDecision(d){
  const box=$('#decision'); if(!box)return;
  box.innerHTML=''; box.classList.add('on');
  const us=LIVE.userIsHome?LIVE.home:LIVE.away;
  const th=LIVE.userIsHome?LIVE.away:LIVE.home;

  /* ---------- 수비 판단 ---------- */
  if(d.kind==='defense'){
    const off=LIVE.off();
    const slot=off.slots[off.order%9];
    const bat=off.team.players.find(x=>x.id===slot.id);
    const bs=LIVE.bases.map((b,i)=>b?['1루','2루','3루'][i]:null).filter(Boolean).join('·')||'주자 없음';
    const diff=us.runs-th.runs;
    box.innerHTML=`<div class="dec-t">${d.label} · 남은 수비 판단 ${LIVE.defTimeouts}회</div>
      <div class="dec-b">${LIVE.inning}회 ${LIVE.outs}아웃 · ${bs} · ${diff>0?'+':''}${diff}점<br>
        상대 타석 <b>${bat?bat.name:'—'}</b> · 마운드 <b>${LIVE.curPitcher(LIVE.def()).name}</b></div>`;
    const g=el('div','dec-g');
    const pb=pchangeBtn(box); if(pb)g.appendChild(pb);

    // 고의4구 — 1루가 비어 있어야 의미가 있다
    if(!LIVE.bases[0]&&(LIVE.bases[1]||LIVE.bases[2])){
      const ib=el('button','decb wide');
      ib.innerHTML=`<b>고의4구</b><span>${bat?bat.name:'이 타자'}을(를) 거르고 다음 타자와 붙는다 · 볼넷이라 공짜진루 지수 +1</span>`;
      ib.onclick=()=>{ LIVE.applyDecision('ibb'); decDone(box); };
      g.appendChild(ib);
    }
    // 수비 시프트
    const sh=el('button','decb wide'+(LIVE.shiftTTL>0?' on':''));
    sh.innerHTML=LIVE.shiftTTL>0
      ? `<b>시프트 해제</b><span>남은 ${LIVE.shiftTTL}타석 · 지금 푼다</span>`
      : `<b>수비 시프트</b><span>3타석 · 인플레이 타구를 더 잡지만 빠지면 2루타가 된다</span>`;
    sh.onclick=()=>{ LIVE.applyDecision(LIVE.shiftTTL>0?'unshift':'shift'); decDone(box); };
    g.appendChild(sh);

    g.appendChild(mgrBtn(box));
    const nb=el('button','decb wide');
    nb.innerHTML=`<b>그대로 간다</b><span>지시 없음</span>`;
    nb.onclick=()=>{ LIVE.applyDecision('defnone'); decDone(box); };
    g.appendChild(nb);
    box.appendChild(g);
    return;
  }

  if(d.kind==='pitcherChange'){
    box.innerHTML=`<div class="dec-t">투수 교체 판단</div>
      <div class="dec-b">${d.from}이(가) 한계다. ${d.to}(으)로 바꿀까?</div>`;
    const g=el('div','dec-g');
    [['change',`${d.to} 투입`],['stay',`${d.from} 계속`]].forEach(([v,n])=>{
      const b=el('button','decb',n);
      b.onclick=()=>{LIVE.applyDecision(v);box.classList.remove('on');box.innerHTML='';flushLog();runLive();};
      g.appendChild(b);
    });
    box.appendChild(g); return;
  }

  const bat=LIVE.batter();
  const diff=us.runs-th.runs;
  const bs=LIVE.bases.map((b,i)=>b?['1루','2루','3루'][i]:null).filter(Boolean).join('·')||'주자 없음';
  const isMine=bat&&bat.id===(ST.playerId||MYID);
  const ttl=[];
  if(LIVE.tacTTL.bat>0)ttl.push(`타격 지시 ${LIVE.tacTTL.bat}타석 남음`);
  if(LIVE.tacTTL.run>0)ttl.push(`주루 지시 ${LIVE.tacTTL.run}타석 남음`);
  box.innerHTML=`<div class="dec-t">${d.label} · 남은 작전 ${LIVE.timeouts}회</div>
    <div class="dec-b">${LIVE.inning}회 ${LIVE.outs}아웃 · ${bs} · ${diff>0?'+':''}${diff}점<br>
      타석 <b class="${isMine?'meb':''}">${bat.name}</b>${isMine?' <span class="metag">내 선수</span>':''}
      ${ttl.length?`<br><i class="ttlx">${ttl.join(' · ')}</i>`:''}</div>`;
  const g=el('div','dec-g');
  [['patient','공 보고 가기','볼넷↑ · 1타석'],['swing','적극 타격','장타↑ · 1타석'],
   ['bunt','진루 우선','삼진↓ · 1타석'],['buntrun','번트 앤 런','주자 한 베이스 더 · 병살 위험'],
   ['steal','뛰어라','도루↑ · 2타석'],['hold','주루 자제','도루 안 함 · 2타석'],
   ['normal','지시 해제','기본 전술로']]
  .forEach(([v,n,s])=>{
    const b=el('button','decb');
    b.innerHTML=`<b>${n}</b>${s?`<span>${s}</span>`:''}`;
    b.onclick=()=>{LIVE.applyDecision(v);decDone(box);};
    g.appendChild(b);
  });
  const pb2=pchangeBtn(box); if(pb2)g.appendChild(pb2);
  g.appendChild(mgrBtn(box));

  // 수비 위치 변경
  const dz=el('button','decb wide alt');
  dz.innerHTML=`<b>수비 위치 변경</b><span>지금 포지션을 바꾼다</span>`;
  dz.onclick=()=>{
    const body=$('#sheet-body'); body.innerHTML='';
    $('#sheet-title').textContent='누구를 옮길까';
    us.slots.forEach((sl,i)=>{
      const p=us.team.players.find(x=>x.id===sl.id); if(!p)return;
      const r=el('button','pick-row');
      const fit=posFit(sl.id,sl.pos);
      r.innerHTML=`<div class="pk-l"><div class="pk-name">${p.name}</div>
        <div class="pk-note">현재 ${POSNAMES[sl.pos]} · 적합도 ${fit>0?fit:'불가'}</div></div>
        <div class="pk-r"><div class="pk-stat">수비 ${Math.round(p.def)}</div></div>`;
      r.onclick=()=>{
        body.innerHTML=''; $('#sheet-title').textContent=`${p.name} 새 위치`;
        ALLPOS.filter(x=>x!=='DH').forEach(pos=>{
          const f=posFit(sl.id,pos);
          const rr=el('button','pick-row'+(f<=0?' bad':''));
          rr.innerHTML=`<div class="pk-l"><div class="pk-name">${POSNAMES[pos]}</div>
            <div class="pk-note">${f<=0?'불가':f>=45?'주 포지션':'익숙하지 않다'}</div></div>
            <div class="pk-r"><div class="pk-stat">${f>0?f:'—'}</div></div>`;
          if(f>0) rr.onclick=()=>{LIVE.movePos(i,pos);closeSheet();box.classList.remove('on');box.innerHTML='';flushLog();runLive();};
          body.appendChild(rr);
        });
      };
      body.appendChild(r);
    });
    $('#sheet').classList.add('open');
  };
  g.appendChild(dz);

  const bench=TBYID['wwzw'].players.filter(p=>
    !us.slots.some(s=>s.id===p.id)&&isAvailable(p.id)&&!LIVE.usedPH[p.id]);
  if(bench.length&&LIVE.inning>=4){
    const ph=el('button','decb wide');
    ph.innerHTML=`<b>대타 기용</b><span>${bat.name} 대신</span>`;
    ph.onclick=()=>{
      const body=$('#sheet-body'); body.innerHTML='';
      $('#sheet-title').textContent='대타 선택';
      bench.forEach(p=>{
        const r=el('button','pick-row');
        r.innerHTML=`<div class="pk-l"><div class="pk-name">${p.name}</div>
          <div class="pk-note">${condLabel(ST.cond[p.id]||70)} · ${META[p.id]?META[p.id].traits.join(' '):''}</div></div>
          <div class="pk-r">${starHTML(effCA(p.id))}</div>`;
        r.onclick=()=>{LIVE.pinchHit(p.id);closeSheet();box.classList.remove('on');box.innerHTML='';flushLog();runLive();};
        body.appendChild(r);
      });
      $('#sheet').classList.add('open');
    };
    g.appendChild(ph);
  }
  box.appendChild(g);
}

function showResult(){
  LIVE.finish();
  const res=LIVE.result;
  const next=ST.schedule[ST.round];
  const usSide=next.homeGame?res.home:res.away;
  const thSide=next.homeGame?res.away:res.home;
  const stage=$('#stage');
  const dec=$('#decision'); if(dec){dec.innerHTML='';dec.classList.remove('on');}
  const lc=$('#livectl'); if(lc)lc.innerHTML='';
  flushLog(); updateLiveUI();
  const si=$('#sb-inn'); if(si)si.textContent=res.mercy?'콜드게임':'경기 종료';

  const ls=el('div','linescore');
  const n=Math.max(res.away.line.length,res.home.line.length);
  let h='<tr><th></th>'; for(let i=0;i<n;i++)h+=`<th>${i+1}</th>`;
  h+='<th class="rr">R</th><th>H</th><th>E</th></tr>';
  const row=s=>{let x=`<tr><td class="tn">${s.team.name}</td>`;
    for(let i=0;i<n;i++){const v=s.line[i];x+=`<td>${v==null?'-':v}</td>`;}
    return x+`<td class="rr">${s.runs}</td><td>${s.hits}</td><td>${s.errs}</td></tr>`;};
  ls.innerHTML=`<table>${h}${row(res.away)}${row(res.home)}</table>`;
  stage.appendChild(ls);

  /* ---- 경기 하이라이트 ---- 몇 회에 누가 뭘 했는지 */
  const HLN={hr:'홈런',d3:'3루타',d2:'2루타',dp:'병살타',cs:'도루자'};
  const HLC={hr:'hl-hr',d3:'hl-x',d2:'hl-x',dp:'hl-o',cs:'hl-o'};
  const hls=res.highlights||[];
  const hc=el('div','card');
  hc.appendChild(el('div','card-h','경기 하이라이트'));

  // 승리 · 패배투수
  const decRow=el('div','hl-dec');
  const wpn=res.wp?pitcherName(res.wp):null, lpn=res.lp?pitcherName(res.lp):null;
  decRow.innerHTML = res.tie
    ? '<span class="hl-lbl">무승부</span><span class="hl-val">승패 없음</span>'
    : `<span class="hl-lbl">승리투수</span><span class="hl-val">${wpn||'—'}</span>`+
      `<span class="hl-lbl">패전투수</span><span class="hl-val">${lpn||'—'}</span>`;
  hc.appendChild(decRow);

  if(hls.length){
    const tb=el('table','box hl-tbl');
    tb.innerHTML='<tr><th>이닝</th><th>기록</th><th>선수</th><th>팀</th></tr>';
    hls.forEach(x=>{
      const tr=el('tr',x.us?'me':'');
      tr.innerHTML=`<td>${x.inning}회 ${x.half===0?'초':'말'}</td>`+
        `<td class="${HLC[x.kind]||''}">${HLN[x.kind]||x.kind}${x.detail?`<i>${x.detail}</i>`:''}</td>`+
        `<td class="nm">${x.name}</td><td class="tm">${x.team}</td>`;
      tb.appendChild(tr);
    });
    hc.appendChild(tb);
  } else {
    hc.appendChild(el('p','muted','장타·병살·도루자 없이 끝났다.'));
  }
  // 우리 팀 요약 한 줄
  const mine=hls.filter(x=>x.us);
  if(mine.length){
    const cnt=k=>mine.filter(x=>x.kind===k).length;
    hc.appendChild(el('p','muted',
      `우완좌완 — 2루타 ${cnt('d2')} · 3루타 ${cnt('d3')} · 홈런 ${cnt('hr')} · 병살타 ${cnt('dp')} · 도루자 ${cnt('cs')}`));
  }
  stage.appendChild(hc);

  const uSlots=(next.homeGame?LIVE.home:LIVE.away).slots;
  const bx=el('div','card'); bx.appendChild(el('div','card-h','우완좌완 타격'));
  const tb=el('table','box');
  tb.innerHTML='<tr><th>타자</th><th>타수</th><th>안타</th><th>타점</th><th>득점</th><th>도루</th><th>삼진</th></tr>';
  uSlots.forEach(s=>{
    const p=TBYID['wwzw'].players.find(x=>x.id===s.id); if(!p)return;
    const b=res.box[s.id]||{};
    const tr=el('tr');
    tr.innerHTML=`<td class="nm">${p.name}<i>${POSNAMES[s.pos]}</i></td><td>${b.ab||0}</td><td>${b.h||0}</td><td>${b.rbi||0}</td><td>${b.r||0}</td><td>${b.sb||0}</td><td>${b.k||0}</td>`;
    tb.appendChild(tr);
  });
  bx.appendChild(tb); stage.appendChild(bx);

  const pb=el('div','card'); pb.appendChild(el('div','card-h','우완좌완 투수'));
  const pt=el('table','box');
  pt.innerHTML='<tr><th>투수</th><th>이닝</th><th>피안타</th><th>실점</th><th>자책</th><th>사사구</th><th>삼진</th></tr>';
  ST.rotation.forEach(pid=>{
    const l=res.pbox[pid]; if(!l||!l.bf)return;
    const p=TBYID['wwzw'].pitchers.find(x=>x.id===pid); if(!p)return;
    const tr=el('tr');
    tr.innerHTML=`<td class="nm">${p.name}</td><td>${ipStr(l)}</td><td>${l.h}</td><td>${l.r}</td><td>${l.er}</td><td>${l.bb+l.hbp}</td><td>${l.k}</td>`;
    pt.appendChild(tr);
  });
  pb.appendChild(pt); stage.appendChild(pb);

  if(res.assists||res.dpCount){
    const ex=el('div','card');
    ex.appendChild(el('div','card-h','수비 하이라이트'));
    if(res.assists) ex.appendChild(el('div','res-row',
      `${nameOf(res.assistBy)} 홈 보살 ${res.assists}개 — 3루 주자를 잡아냈다`));
    if(res.dpCount){
      const syn=dpBonus((next.homeGame?LIVE.home:LIVE.away).slots).syn;
      ex.appendChild(el('div','res-row',
        `병살 ${res.dpCount}개${syn?` · ${syn.name} ${syn.label} 발동`:''}`));
    }
    stage.appendChild(ex);
  }
  const wA=(ST.gameRotation&&ST.gameRotation.length?ST.gameRotation:ST.rotation)
    .reduce((a,pid)=>a+((res.pbox[pid]&&res.pbox[pid].bb)||0),0);
  const wpN=res.wpCount||0;
  const idx=wA+usSide.sbAllowed+wpN;
  const fp=el('div','card fpcard');
  fp.innerHTML=`<div class="card-h">공짜진루 지수</div><div class="fp-num ${idx<=14?'good':'bad'}">${idx}</div>
    <p class="muted">볼넷 ${wA} + 도루 허용 ${usSide.sbAllowed} + 폭투 ${wpN}<br>실제 13경기 무예외: 14 이하 승 / 16 이상 패</p>`;
  stage.appendChild(fp);

  const btn=el('button','btn primary','결과 확정');
  btn.onclick=()=>{ commitGame(res,usSide,thSide,uSlots); };
  stage.appendChild(btn);
}

function commitGame(res,usSide,thSide,uSlots){
  const sch0=ST.schedule[ST.round];
  if(!sch0 || sch0.played){ toast('이미 확정된 경기다'); go('kakao'); return; }
  const sch=ST.schedule[ST.round];
  if(sch.played){go('home');return;}
  // 이번 경기 결장자(부상·개인사정)를 경기 중 부상이 반영되기 전에 미리 잡아둔다.
  // 결장한 경기는 약속 위반으로 치지 않기 때문이다.
  const absentIds=TBYID['wwzw'].players.filter(p=>!isAvailable(p.id)).map(p=>p.id);
  sch.played=true; sch.result={us:usSide.runs,them:thSide.runs};

  uSlots.forEach(s=>{
    const b=res.box[s.id]; if(!b)return;
    const acc=ST.bat[s.id]; if(!acc)return;
    acc.g++; ['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>acc[k]+=b[k]||0);
    const lg=ST.lgBat[s.id];
    if(lg){lg.g++;['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>lg[k]+=b[k]||0);}
    ST.cond[s.id]=Math.max(20,(ST.cond[s.id]||70)-(8+(b.pa||0)*1.2));
  });
  const gRot=(ST.gameRotation&&ST.gameRotation.length)?ST.gameRotation:ST.rotation;
  gRot.forEach((pid,i)=>{
    const l=res.pbox[pid]; if(!l||!l.bf)return;
    const acc=ST.pit[pid]; if(!acc)return;
    acc.g++; if(i===0)acc.gs++;
    ['outs','h','r','er','bb','k','hbp','sbA'].forEach(k=>acc[k]+=l[k]||0);
    if(res.wp===pid)acc.w++; if(res.lp===pid)acc.l++;
  });

  accrueLgPit(res);                  // 상대 투수 기록도 리그 순위에 들어간다

  const won=usSide.runs>thSide.runs, tie=usSide.runs===thSide.runs;
  TBYID['wwzw'].players.forEach(p=>{
    const played=uSlots.some(s=>s.id===p.id);
    let d=won?6:(tie?1:-4); if(!played)d-=1;
    ST.morale[p.id]=Math.max(10,Math.min(100,(ST.morale[p.id]||70)+d));
  });

  if(!ST.notices)ST.notices=[];
  (res.injuries||[]).forEach(iv=>{
    const inj=rollInjury(iv.id,iv.roll);
    ST.injury[iv.id]=inj;
    ST.injCount=(ST.injCount||0)+1;
    ST.notices.push({type:'injury',title:`${nameOf(iv.id)} 부상`,
      body:`경기 중 ${inj.name}이(가) 발생했다.`,effect:`${inj.games}경기 결장`});
  });

  TBYID['wwzw'].pitchers.forEach(p=>{ST.rest[p.id]=Math.min(4,(ST.rest[p.id]||3)+1);});
  gRot.forEach(pid=>{
    const l=res.pbox[pid];
    if(l&&l.outs>=6)ST.rest[pid]=0; else if(l&&l.outs>0)ST.rest[pid]=1;
  });

  const u=ST.stand['wwzw'], t=ST.stand[sch.opp];
  u.g++;t.g++;u.rf+=usSide.runs;u.ra+=thSide.runs;t.rf+=thSide.runs;t.ra+=usSide.runs;
  if(tie){u.t++;t.t++;}else if(won){u.w++;t.l++;}else{u.l++;t.w++;}
  /* 경기 수익 — 이기면 그날 회비가 덜 나간다.
     승리 수당 개념으로 운영비에 남는 돈이 커진다. */
  ST.budget += sch.po ? (won?18:8) : (won?14:(tie?8:4));

  ST.lastFreePass = gRot.reduce((a,pid)=>a+((res.pbox[pid]&&res.pbox[pid].bb)||0),0)
    +usSide.sbAllowed+(res.wpCount||0);
  ST.lastLineup = uSlots.map(s=>({id:s.id,pos:s.pos}));
  // 몸값 추이 — 지난 경기 대비 얼마나 올랐는지 보여주기 위해 스냅샷을 남긴다
  if(!ST.valuePrev)ST.valuePrev={};
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;
    ST.valuePrev[p.id]=playerValue(p,META[p.id],ST.bat[p.id]);
  });
  const unhMsgs = updateUnhappy(ST, uSlots, {blowout: (thSide.runs-usSide.runs)>=10, won, tie});
  const starters = (ST.gameStarters&&ST.gameStarters.length)?ST.gameStarters:uSlots.map(s=>s.id);
  const promiseMsgs = checkPromises(ST, starters, uSlots.map(s=>s.id), absentIds);
  const dpCount = res.dpCount||0;
  const miles = accrueCareer(ST,res,uSlots,won,tie,dpCount);
  ST.canParty = won;
  ST.kakaoPost = buildKakaoPost(ST,res,usSide,thSide,uSlots,miles);
  applyGojin(ST,res.gojin).forEach(m=>ST.kakaoPost.push(m));
  applyFriction(ST,res.friction).forEach(m=>ST.kakaoPost.push(m));
  promiseMsgs.forEach(m=>ST.kakaoPost.push(m));
  unhMsgs.forEach(m=>ST.kakaoPost.push(m));
  ST.sentPost=false;
  ST.partyDone = !won;
  ST.mystery = rollMysteryEvent(ST, uSlots);
  rollBossTalk();                    // 내 성적을 보고 감독이 부를지 판정
  if(!sch.po) simOtherGames(sch.opp);   // 플레이오프는 네 팀만 뛴다
  applyTraining();
  const mn=releaseMercs(false);       // 용병은 그날로 끝이다
  if(mn)ST.kakaoPost.push({who:'lg',type:'notice',text:`용병 ${mn}명 오늘까지. 다음 주엔 사람 좀 채우자`});
  gearWearTick().forEach(m=>ST.kakaoPost.push(m));   // 장비는 쓸수록 닳는다
  updateForm(ST,res,uSlots).forEach(m=>ST.kakaoPost.push(m));   // 슬럼프·뜨거운 감각
  // 내 선수가 실제로 뛰었으면 성장 투자로 쌓인다
  if(uSlots.some(x=>x.id===(ST.playerId||MYID))) devEarn('game');
  devTickTime();
  // 정규시즌 5경기마다 구간 시상
  if(!sch.po){
    const gp=ST.schedule.filter(x=>x.played&&!x.po).length;
    if(gp>0 && gp%5===0) runMiniAwards(ST).forEach(m=>ST.kakaoPost.push(m));
  }
  ST.round++; ST.weekDone=false; ST.events=[];
  if(sch.po){
    advancePlayoff(won,tie,usSide.runs,thSide.runs).forEach(m=>ST.kakaoPost.push(m));
  } else if(ST.round>=ST.schedule.length){
    startPlayoff();                      // 정규시즌 끝 — 상위 4팀은 플레이오프로 간다
  }
  saveGame(true); LIVE=null;
  go('kakao');
  toast(sch.po&&ST.playoff&&ST.playoff.place==='우승' ? '우승!'
    : (tie?'무승부':(won?'승리':'패배')));
}

function simOtherGames(exclude){
  const rest=TEAMS.filter(t=>t.id!=='wwzw'&&t.id!==exclude);
  const rng=makeRng((ST.seed+ST.round*104729)>>>0);
  for(let i=rest.length-1;i>0;i--){const j=(rng()*(i+1))|0;[rest[i],rest[j]]=[rest[j],rest[i]];}
  for(let i=0;i+1<rest.length;i+=2){
    const a=rest[i],h=rest[i+1];
    const r=simGame(h,a,{rng,innings:7,awayLineup:aiLineup(a),awayRotation:aiRotation(a),
      homeLineup:aiLineup(h),homeRotation:aiRotation(h)});
    const sa=ST.stand[a.id],sh=ST.stand[h.id];
    sa.g++;sh.g++;sa.rf+=r.away.runs;sa.ra+=r.home.runs;sh.rf+=r.home.runs;sh.ra+=r.away.runs;
    if(r.tie){sa.t++;sh.t++;}else if(r.away.runs>r.home.runs){sa.w++;sh.l++;}else{sh.w++;sa.l++;}
    for(const pid in r.box){const lg=ST.lgBat[pid];if(!lg)continue;const b=r.box[pid];
      if(b.pa>0)lg.g++;['pa','ab','h','d2','d3','hr','bb','hbp','k','rbi','r','sb','cs'].forEach(k=>lg[k]+=b[k]||0);}
    accrueLgPit(r);
  }
}

/* 리그 투수 기록 누적 — 우리 경기·타팀 경기 양쪽에서 부른다.
   ST.pit 은 우리 투수만 담기 때문에 리그 순위를 내려면 따로 모아야 한다. */
function accrueLgPit(r){
  if(!ST.lgPit)ST.lgPit={};
  const tie=!!r.tie;
  for(const pid in r.pbox){
    const l=r.pbox[pid];
    if(!l||!l.bf)continue;
    const a=ST.lgPit[pid]||(ST.lgPit[pid]=blankPit());
    a.g++;
    ['outs','h','r','er','bb','k','hbp','sbA'].forEach(k=>a[k]+=l[k]||0);
    if(!tie){ if(r.wp===pid)a.w++; if(r.lp===pid)a.l++; }
  }
}

/* ---------- 훈련 ---------- */
const TRAININGS=[
  {k:'none',n:'훈련 없음',d:'컨디션 회복에 집중',eff:'컨디션 +6'},
  {k:'bat',n:'타격 훈련',d:'배팅장에서 스윙을 다듬는다',eff:'컨택·파워 성장'},
  {k:'field',n:'수비 훈련',d:'펑고와 송구 반복',eff:'수비·어깨 성장'},
  {k:'run',n:'주루 훈련',d:'슬라이딩과 리드 연습',eff:'주루 성장'},
  {k:'eye',n:'선구안 훈련',d:'존 설정과 볼 판단',eff:'선구 성장'},
  {k:'pitch',n:'투구 훈련',d:'퀵모션과 제구 위주',eff:'투수 제구 성장'},
  {k:'hard',n:'강도 높은 전체 훈련',d:'전 부문을 몰아친다',eff:'성장 큼 · 부상 위험'},
  {k:'pos', n:'포지션 적응 훈련',d:'집중 대상을 새 자리에 세워본다',eff:'선택한 포지션 적합도 상승'},
];
/* ---------- 훈련 참석 ----------
   실제로 평일 훈련에 매주 나오는 사람은 정해져 있다.
   나머지는 출석 성향(attend)을 기준으로 매주 새로 뽑는다.
   경기보다 훈련 출석이 낮은 게 사회인야구 현실이라 0.55를 곱한다.        */
/* 사회인야구는 훈련을 경기보다 훨씬 덜 나온다.
   상시조라고 해도 매주 100% 나오지는 않는다.                        */
const TRAIN_REGULARS=['ksh','kjh','kig','khg','lg','swm','khj'];   // 그나마 자주 온다
const TRAIN_REG_P = 0.82;                                          // 상시조 기본 참석률
const TRAIN_SOMETIMES={yjh:0.30, ujh:0.26};                        // 가끔 온다
const TRAIN_OTHER_MUL = 0.34;                                      // 나머지는 경기 출석의 34%
/* 연속으로 훈련을 잡으면 점점 안 나온다 */
function trainFatigue(){
  const st=ST.trainStreak||0;
  return st<=1?1:(st===2?0.82:(st===3?0.66:0.52));
}
const hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);

function trainAttendKey(){
  return (ST.round||0)+'_'+(ST.weekSeq||0)+'_'+(ST.trainStreak||0)
    +'_'+(ST.trainRain?1:0)+'_'+(ST.trainPush?1:0)+'_'+(ST.trainFocus||'none');
}

/* 이번 주 훈련 참석자 id 배열. 같은 주 안에서는 항상 같은 명단이 나온다. */
function trainAttendList(){
  const key=trainAttendKey();
  if(ST.trainAttendKey===key && Array.isArray(ST.trainAttend))
    return ST.trainAttend.filter(id=>TBYID['wwzw'].players.some(p=>p.id===id));
  // 우취 재시도 때 같은 명단이 반복되지 않도록 weekSeq 를 시드에 섞는다
  const rng=makeRng((ST.seed+(ST.round||0)*6551+(ST.weekSeq||0)*7717+991)>>>0);
  const list=[];
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;                               // 용병은 그날 하루만 온다
    if(ST.injury&&ST.injury[p.id])return;                 // 부상자는 훈련에 못 나온다
    let prob;
    if(TRAIN_REGULARS.indexOf(p.id)>=0) prob=TRAIN_REG_P;
    else if(hasOwn(TRAIN_SOMETIMES,p.id)) prob=TRAIN_SOMETIMES[p.id];
    else { const m=META[p.id]; prob=((m&&m.attend!=null)?m.attend:0.85)*TRAIN_OTHER_MUL; }
    if(ST.absent&&ST.absent[p.id]) prob*=0.3;             // 그 주 개인사정이면 훈련도 대개 빠진다
    prob*=trainFatigue();                                 // 매주 부르면 점점 안 나온다
    if(ST.trainRain) prob*=(ST.trainPush?0.45:0);         // 비 오는 날은 강행해도 절반 이하
    if(rng()<prob) list.push(p.id);
  });
  ST.trainAttend=list; ST.trainAttendKey=key;
  return list;
}
function trainAttends(pid){ return trainAttendList().indexOf(pid)>=0; }

function coachBonus(kind){
  // kind: 'inf'(내야수비) 'out'(외야수비) 'all'(전체수비) 'bat'(타격)
  const us=TBYID['wwzw'];
  const att=trainAttendList();
  let best=1;
  us.players.forEach(p=>{
    if(att.indexOf(p.id)<0)return;   // 훈련에 안 나온 코치는 지도할 수 없다
    const m=META[p.id]; if(!m||!m.coach||ST.injury[p.id])return;
    const v=m.coach[kind]||(kind!=='bat'?(m.coach.all||0):0);
    if(v) best=Math.max(best, 1+(v-40)/100);
  });
  return best;
}
function coachNames(kind){
  const us=TBYID['wwzw'];
  const att=trainAttendList();
  return us.players.filter(p=>{
    if(att.indexOf(p.id)<0)return false;
    const m=META[p.id]; if(!m||!m.coach)return false;
    return m.coach[kind]||(kind!=='bat'&&m.coach.all);
  }).map(p=>p.name);
}
function applyTraining(){
  const f=ST.trainFocus||'none';
  const us=TBYID['wwzw'];
  const att=trainAttendList();
  const gains=[];
  const KN={con:'컨택',pow:'파워',eye:'선구',spd:'주루',def:'수비',arm:'어깨'};

  // 훈련 없음 = 전원 휴식. 나온 사람만 쉬는 게 아니니 참석 여부와 무관하다.
  if(f==='none'){
    us.players.forEach(p=>ST.cond[p.id]=Math.min(100,(ST.cond[p.id]||70)+6));
    ST.trainLog=['훈련 없이 쉬었다 — 전원 컨디션 +6'];
    ST.trainStreak=0;                       // 쉬면 피로가 풀린다
    return;
  }
  // 비 오는 날인데 강행 안 했으면 훈련이 취소된 것이다
  if(ST.trainRain && !ST.trainPush){
    us.players.forEach(p=>ST.cond[p.id]=Math.min(100,(ST.cond[p.id]||70)+4));
    ST.trainLog=['비로 훈련 취소 — 전원 컨디션 +4'];
    ST.trainStreak=0;
    return;
  }
  ST.trainStreak=(ST.trainStreak||0)+1;     // 연속으로 부르면 다음 주 참석률이 떨어진다

  /* ---- 포지션 적응 훈련 ---- 능력치 대신 포지션 적합도를 올린다 */
  if(f==='pos'){
    let tg=ST.trainTarget, tp=ST.trainPos;
    if(tg&&!us.players.some(p=>p.id===tg))tg=null;
    if(!tg||!tp){ ST.trainLog=['대상과 포지션을 정해야 훈련이 된다']; return; }
    if(att.indexOf(tg)<0){ ST.trainLog=[`${nameOf(tg)}이(가) 훈련에 안 나왔다 — 포지션 훈련 무산`]; return; }
    const cap=posTrainCap(tg,tp);
    if(cap<=0){ ST.trainLog=[`${nameOf(tg)}은(는) ${POSNAMES[tp]}을(를) 볼 수 없다`]; return; }
    if(!ST.posTrain)ST.posTrain={};
    if(!ST.posTrain[tg])ST.posTrain[tg]={};
    const before=posFit(tg,tp);
    if(before>=cap){ ST.trainLog=[`${nameOf(tg)} ${POSNAMES[tp]} 적응 완료 (${before}) — 더는 안 오른다`]; return; }
    const m=META[tg];
    let gain=1.6;
    if(m&&m.traits.includes('노력파'))gain*=1.3;
    if(m&&m.traits.includes('미완성'))gain*=1.2;
    if(m&&m.traits.includes('수비약점'))gain*=0.6;
    if(m&&m.traits.includes('외야미숙')&&['LF','CF','RF'].indexOf(tp)>=0)gain*=0.5;
    gain*=coachBonus(['C','1B','2B','3B','SS','P'].indexOf(tp)>=0?'inf':'out');
    gain*=((ST.morale[tg]||70)/70)*(0.6+Math.random()*0.8);
    ST.posTrain[tg][tp]=(ST.posTrain[tg][tp]||0)+gain;
    const after=posFit(tg,tp);
    gains.push(`${nameOf(tg)} ${POSNAMES[tp]} 적합도 ${Math.round(before)} → ${Math.round(after)} (한계 ${cap})`);
    // 나온 사람들은 몸을 좀 쓴다
    att.forEach(pid=>ST.cond[pid]=Math.max(25,(ST.cond[pid]||70)-4));
    const skip=us.players.filter(p=>att.indexOf(p.id)<0&&!ST.injury[p.id]);
    if(skip.length)gains.push(`불참 ${skip.length}명 — ${skip.map(p=>p.name).join(', ')}`);
    finalizeTeam(us);
    ST.trainLog=gains.slice(0,7);
    return;
  }

  // 집중 대상이 그 주 훈련에 안 나왔으면 집중 효과가 통째로 날아간다
  let tgt=ST.trainTarget;
  if(tgt&&!us.players.some(p=>p.id===tgt))tgt=null;
  if(tgt&&att.indexOf(tgt)<0){
    gains.push(`${nameOf(tgt)}이(가) 훈련에 안 나왔다 — 집중 훈련 무산`);
    tgt=null;
  }
  if(!tgt) gains.push('집중 대상 미지정 — 전원 곁다리 성장만');

  if(att.indexOf(ST.playerId||MYID)>=0) devEarn('train');   // 내가 훈련에 나왔다
  att.forEach(pid=>{
    const p=us.players.find(x=>x.id===pid); if(!p)return;
    if(ST.injury[pid])return;
    const pa=effPA(pid), ca=effCA(pid);
    if(ca>=pa)return;
    const m=META[pid];
    let rate=0.30;
    if(f==='field'){
      // 내야/외야 구분해서 코치 효과 적용
      const mainPos=(ST.lineup.find(x=>x.id===pid)||{}).pos||'RF';
      const isInf=['C','1B','2B','3B','SS','P'].includes(mainPos);
      rate*=coachBonus(isInf?'inf':'out');
    } else if(f==='bat'){
      rate*=coachBonus('bat');
    } else if(f==='hard'){
      rate*=coachBonus('all');
    }
    if(m&&m.traits.includes('노력파'))rate*=1.25;
    if(m&&m.traits.includes('미완성'))rate*=1.30;
    if(pid===(ST.playerId||MYID))rate*=1.30;   // 내가 붙잡고 하는 선수다
    if(f==='hard')rate*=1.9;
    rate*=gearTrainMul(f);                  // 산 장비만큼 훈련이 잘 된다
    // 1명 집중 훈련 — 지정한 선수만 제대로 크고 나머지는 곁다리로 조금 큰다.
    // 집중 대상은 한 시즌(22경기) 몰아주면 CA +4~5, 즉 잠재 여지의 1/4~1/3이 찬다.
    // 팀 전체 성장 총량은 예전(전원 균등)보다 낮다 — 고르는 게 이 시스템의 핵심이라 의도한 것이다.
    rate *= (pid===tgt ? 3.4 : 0.35);
    rate*=((ST.morale[pid]||70)/70);
    const g=Math.min(pa-ca, rate*(0.35+Math.random()*0.85));
    if(g<=0)return;
    const key=f==='bat'?(Math.random()<0.5?'con':'pow'):f==='field'?(Math.random()<0.6?'def':'arm')
      :f==='run'?'spd':f==='eye'?'eye':f==='pitch'?null:['con','pow','eye','spd','def'][(Math.random()*5)|0];
    if(key&&p[key]<80)p[key]=Math.min(80,p[key]+g);
    if(f==='pitch'&&p.pitch){
      p.pitch.ctl=Math.min(80,p.pitch.ctl+g*0.9);
      const pp=us.pitchers.find(x=>x.id===pid); if(pp)pp.ctl=Math.round(p.pitch.ctl);
    }
    ST.ca[pid]=calcCA(p);
    if(pid===tgt) gains.unshift(`${p.name} ${key?KN[key]:'제구'} +${g.toFixed(2)} (집중)`);
    else if(g>=0.25) gains.push(`${p.name} ${key?KN[key]:'제구'} 상승`);
  });

  // 강도 높은 훈련은 나온 사람만 몸이 축나고 다친다
  if(f==='hard'){
    att.forEach(pid=>{
      ST.cond[pid]=Math.max(20,(ST.cond[pid]||70)-9);
      if(!ST.injury[pid]&&Math.random()<0.045*gearInjMul()){
        const inj=rollInjury(pid,Math.random());
        ST.injury[pid]=inj;
        gains.push(`${nameOf(pid)} 훈련 중 ${inj.name} (${inj.games}경기)`);
      }
    });
  }
  const skipped=us.players.filter(p=>att.indexOf(p.id)<0&&!ST.injury[p.id]);
  if(skipped.length) gains.push(`불참 ${skipped.length}명 — ${skipped.map(p=>p.name).join(', ')} 성장 없음`);
  finalizeTeam(us);
  ST.trainLog=gains.slice(0,7);
}

/* =========================================================
   영입 — 삼국지 등용 방식
   ---------------------------------------------------------
   버튼 한 번으로 되는 게 아니라 카톡으로 몇 마디 주고받아야 한다.
   그냥 찔러보면 성공률 0.1%. 대화를 잘 풀어야 확률이 올라간다.
   ========================================================= */
const RECRUIT_BASE = 0.001;     // 아무 노력 없이 찔렀을 때의 확률
const RECRUIT_MAX  = 0.62;      // 대화를 완벽하게 풀었을 때의 상한

/* 단계별 선택지. good=호감, bad=역효과, 각 항목 [라벨, 설명, 델타] */
const RECRUIT_STEPS = [
  { q:['어떻게 말을 꺼낼까'],
    opts:[
      ['같이 야구하고 싶다고 솔직하게 말한다','진심이 제일 잘 먹힌다',       +14],
      ['우리 팀 분위기를 자랑한다','회식·단톡 얘기로 분위기를 판다',        +8],
      ['지금 팀에서 대우가 별로지 않냐고 묻는다','잘 먹히면 크지만 기분 상할 수 있다', 0],
      ['일단 밥부터 사겠다고 한다','무난하다',                              +6],
    ]},
  { q:['상대가 뜸을 들인다. 뭘 내밀까'],
    opts:[
      ['주전 자리를 약속한다','확실하지만 약속을 지켜야 한다',              +16],
      ['타순 상위를 약속한다','비슷하다',                                   +12],
      ['돈 얘기를 꺼낸다','사회인야구에서 돈 얘기는 위험하다',              -6],
      ['편하게 생각하라고 한다','부담을 줄여준다',                          +7],
    ]},
  { q:['마지막이다. 어떻게 마무리할까'],
    opts:[
      ['다음 경기 한번 보러 오라고 한다','직접 보게 만든다',                +15],
      ['단톡방에 미리 초대한다','친해지면 넘어온다',                        +11],
      ['오늘 답을 달라고 한다','밀어붙인다. 도박이다',                      -4],
      ['천천히 생각해보라고 한다','여지를 남긴다',                          +6],
    ]},
];
/* 상대 반응 대사 */
const RECRUIT_REACT = {
  hi:['오 진짜요? 생각해볼게요','말씀 감사합니다','솔깃하네요','안 그래도 고민 중이었어요',
      '형들 좋다는 얘기는 들었습니다','재밌겠는데요'],
  mid:['음... 좀 더 생각해볼게요','바로는 답 못 드리겠네요','팀에 얘기는 해봐야죠',
       '나쁘진 않은데요','고민 좀 해보겠습니다'],
  lo:['글쎄요...','지금은 좀 어렵습니다','여기도 나쁘지 않아서요','죄송한데 못 갈 것 같아요',
      '그런 얘기는 좀 그렇네요'],
};

function recruitFavorStart(p, fromTeam){
  // 우리 성적이 좋고 사기가 높으면 처음부터 호감이 있다.
  // 상대 팀이 잘나가면 굳이 옮길 이유가 없다.
  const us=TBYID['wwzw'], st=ST.stand['wwzw'];
  const winPct=st.g?st.w/st.g:0.3;
  const theirs=ST.stand[fromTeam.id]||{w:0,g:0};
  const theirPct=theirs.g?theirs.w/theirs.g:0.5;
  const avgM=us.players.reduce((a,x)=>a+(ST.morale[x.id]||70),0)/us.players.length;
  let f = 18 + winPct*26 - theirPct*18 + (avgM-60)*0.30;
  return Math.max(2, Math.min(55, Math.round(f)));
}
function recruitChance(favor){
  const t=Math.max(0,Math.min(1,favor/100));
  return RECRUIT_BASE + (RECRUIT_MAX-RECRUIT_BASE)*Math.pow(t,1.35);
}

/* 접촉 시작 */
function startRecruit(p, fromTeam, val){
  const us=TBYID['wwzw'];
  if(us.players.length>=18){toast('로스터가 꽉 찼다 (18명)');return;}
  if(us.players.some(x=>x.id==='new_'+p.id)){toast('이미 영입한 선수다');return;}
  const cost=val*1.5;
  ST.recruit={
    pid:p.id, name:p.name, team:fromTeam.id, teamName:fromTeam.name,
    cost, step:0, favor:recruitFavorStart(p,fromTeam), done:false,
    log:[{who:'me',text:`${p.name}님, 잠깐 얘기 좀 할 수 있을까요`}]
  };
  ST.recruit.log.push({who:'them',text:pickOne(['네 말씀하세요','무슨 일이신가요','아 안녕하세요'])});
  go('recruit');
}

function recruitPick(i){
  const R=ST.recruit; if(!R||R.done)return;
  const step=RECRUIT_STEPS[R.step];
  const o=step.opts[i]; if(!o)return;
  R.log.push({who:'me',text:o[0]});
  // 델타에 약간의 운을 섞는다
  const roll=(Math.random()*10-4)|0;
  R.favor=Math.max(0,Math.min(100,R.favor+o[2]+roll));
  const tier=R.favor>=58?'hi':(R.favor>=32?'mid':'lo');
