function autoFixLineup(){
  if(!ST.lineup)return;
  const t=TBYID['wwzw'];
  const bad=ST.lineup.filter(s=>!isAvailable(s.id));
  if(!bad.length){ sanitizeRotation(); return; }
  const avail=t.players.filter(p=>isAvailable(p.id));
  if(avail.length>=9){
    const pool=avail.filter(p=>!ST.lineup.some(x=>x.id===p.id));
    bad.forEach(b=>{
      const i=ST.lineup.findIndex(x=>x.id===b.id);
      if(i<0)return;
      const rep=pool.find(p=>posFit(p.id,ST.lineup[i].pos)>0)||pool[0];
      if(rep){ ST.lineup[i].id=rep.id; pool.splice(pool.indexOf(rep),1); }
    });
    // 포지션 적합도 재정리
    optimizePositions();
  }
  sanitizeRotation();
}

/* 라인업 인원 그대로 두고 포지션만 최적 배치 */
function optimizePositions(){
  const t=TBYID['wwzw'];
  const ids=ST.lineup.map(s=>s.id);
  const needP = !ST.useDH;
  const slots = needP ? ['P','C','1B','2B','3B','SS','LF','CF','RF']
                      : ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
  // 헝가리안 대신 탐욕: 적합도 높은 순으로 배정
  const pairs=[];
  ids.forEach(id=>slots.forEach(pos=>pairs.push({id,pos,v:pos==='DH'?30:posFit(id,pos)})));
  pairs.sort((a,b)=>b.v-a.v);
  const usedId=new Set(), usedPos=new Set(), assign={};
  pairs.forEach(p=>{
    if(p.v<=0)return;
    if(usedId.has(p.id)||usedPos.has(p.pos))return;
    assign[p.id]=p.pos; usedId.add(p.id); usedPos.add(p.pos);
  });
  // 남은 인원은 빈 자리에 강제 배치
  ids.forEach(id=>{
    if(assign[id])return;
    const free=slots.find(x=>!usedPos.has(x));
    if(free){assign[id]=free;usedPos.add(free);}
  });
  ST.lineup.forEach(s=>{ if(assign[s.id])s.pos=assign[s.id]; });
  syncStarter();
}

function recommendLineup(){
  const t=TBYID['wwzw'];
  const pool=t.players.filter(p=>isAvailable(p.id));
  const use=pool.length>=9?pool:t.players;
  const sc=p=>p.con*1.1+p.pow*0.9+p.eye*0.7+p.spd*0.5+(ST&&ST.cond?(ST.cond[p.id]-70)*0.25:0);
  const sorted=use.slice().sort((a,b)=>sc(b)-sc(a));
  const used=new Set(); const slots=[];
  const c=sorted.find(p=>p.pos.includes('C'));
  if(c){slots.push({id:c.id,pos:'C'});used.add('C');}
  for(const p of sorted){
    if(slots.length>=9)break;
    if(slots.some(s=>s.id===p.id))continue;
    const pos=p.pos.find(x=>x!=='P'&&!used.has(x))||ALLPOS.find(x=>!used.has(x));
    if(!pos)break; used.add(pos); slots.push({id:p.id,pos});
  }
  const byId=id=>t.players.find(p=>p.id===id);
  const pool2=slots.slice(); const order=[];
  const take=fn=>{let bi=0,bv=-1e9;pool2.forEach((s,i)=>{const v=fn(byId(s.id));if(v>bv){bv=v;bi=i;}});return pool2.splice(bi,1)[0];};
  order.push(take(p=>p.con*1.2+p.spd*1.4));
  order.push(take(p=>p.con*1.3+p.spd*1.0));
  order.push(take(p=>p.con*1.0+p.pow*1.2));
  order.push(take(p=>p.pow*1.6));
  order.push(take(p=>p.pow*1.2+p.con*0.7));
  while(pool2.length) order.push(take(p=>p.con+p.pow+p.eye*0.5));
  return order;
}
function buildPitcherPool(){
  // 사회인야구는 누구나 던진다. 포지션 등급 P를 기준으로 구위/제구/체력 산출
  const t=TBYID['wwzw'];
  t.pitchers = t.players.map(p=>{
    const m=META[p.id];
    const pf = m&&m.pos ? (m.pos['P']||25) : 25;
    if(p.pitch) return {id:p.id,name:p.name,stf:p.pitch.stf,ctl:p.pitch.ctl,sta:p.pitch.sta};
    return {id:p.id,name:p.name,
      stf:Math.round(clamp(pf*0.55+p.arm*0.45,18,75)),
      ctl:Math.round(clamp(pf*0.75+p.eye*0.25-8,15,70)),
      sta:Math.round(clamp(pf*0.6+22,22,62))};
  });
  return t.pitchers;
}
function recommendRotation(){
  const t=TBYID['wwzw'];
  buildPitcherPool();
  return t.pitchers.slice()
    .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
    .slice(0,6).map(p=>p.id);
}
function recalcTeamDefense(team, slots, gearPenalty){
  if(!team.isUser) return;
  let sum=0;
  slots.forEach(sl=>{
    const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const m=META[sl.id];
    const fit=posFit(sl.id, sl.pos);
    let penalty = fit<=0 ? 22 : Math.max(0,(45-fit)*0.55);
    if(m){
      /* 좁은 범위 — 내야에서 특히 손해 */
      if(m.traits.includes('좁은범위')&&['2B','3B','SS'].includes(sl.pos)) penalty+=9;
      /* 외야 미숙 */
      if(m.traits.includes('외야미숙')&&['LF','CF','RF'].includes(sl.pos)) penalty+=8;
    }
    sum += Math.max(15, p.def - penalty);
  });
  team._slotDef = sum/Math.max(1,slots.length);
  team._errMod = 1 + Math.max(0,(46-team._slotDef))*0.020 + (gearPenalty?0.05:0);
}

function aiLineup(team){
  const s=team.players.slice().sort((a,b)=>(b.con+b.pow+b.eye+b.spd*0.4)-(a.con+a.pow+a.eye+a.spd*0.4));
  const u=new Set(),o=[];
  for(const p of s){if(o.length>=9)break;const pos=p.pos.find(x=>!u.has(x))||ALLPOS.find(x=>!u.has(x));if(!pos)break;u.add(pos);o.push({id:p.id,pos});}
  // AI도 수비 배치에 따른 손실을 반영 (우리만 최적화 이득 보지 않게)
  let sum=0;
  o.forEach(sl=>{ const p=team.players.find(x=>x.id===sl.id); if(!p)return;
    const fit=(p.pos&&p.pos.indexOf(sl.pos)>=0)?50:32;
    sum+=Math.max(15,p.def-Math.max(0,(45-fit)*0.55)); });
  team._slotDef=sum/Math.max(1,o.length);
  return o;
}
function aiRotation(t){return t.pitchers.slice().sort((a,b)=>(b.stf+b.ctl+b.sta)-(a.stf+a.ctl+a.sta)).map(p=>p.id);}

/* ---------- 저장 ---------- */
/* 아티팩트 밖(브라우저)에서는 localStorage 로 떨어진다.
   file:// 로 직접 열면 오리진이 opaque 라 여기서 예외가 난다 — 그때는 저장이 안 되고
   내보내기로 옮겨야 한다. */
const STORE = (typeof window.storage!=='undefined') ? window.storage : {
  set:(k,v)=>{ localStorage.setItem(k,v); return Promise.resolve(); },
  get:(k)=>Promise.resolve({value:localStorage.getItem(k)})
};
/* 자동 저장 + 백업 한 벌.
   저장이 깨졌을 때를 대비해 '직전 세이브'를 따로 남긴다.
   저장 전 현재 값을 백업으로 밀어 넣는 방식이라 항상 한 세대 전이 남는다. */
let lastSaveAt=null, lastSaveOk=true;
async function saveGame(silent){
  try{
    // 직전에 저장돼 있던 내용을 백업 슬롯으로 옮긴다
    try{
      const prev=await STORE.get('wwzw_v5',false);
      if(prev&&prev.value) await STORE.set('wwzw_v5_bak',prev.value,false);
    }catch(e){/* 백업 실패는 본 저장을 막지 않는다 */}
    await STORE.set('wwzw_v5',JSON.stringify(ST),false);
    lastSaveAt=Date.now(); lastSaveOk=true;
    if(!silent)toast('저장 완료');
  }catch(e){
    lastSaveOk=false;
    toast('저장 실패 — 더보기에서 파일로 저장해라');
  }
}
async function loadGame(){
  try{
    const r=await STORE.get('wwzw_v5',false);
    if(r&&r.value){
      const d=JSON.parse(r.value);
      if(d&&d.v===5) return d;
    }
  }catch(e){}
  return null;
}
/* 본 세이브가 깨졌을 때 쓰는 백업 슬롯 */
async function loadBackup(){
  try{
    const r=await STORE.get('wwzw_v5_bak',false);
    if(!r||!r.value)return null;
    const d=JSON.parse(r.value);
    return (d&&d.v===5)?d:null;
  }catch(e){return null;}
}
async function restoreBackup(){
  const d=await loadBackup();
  if(!d){ toast('백업이 없다'); return false; }
  ST=d; normalizeState(); await saveGame(true); go('home');
  toast(`백업 복구 완료 — ${d.round}차전 시점`);
  return true;
}
/* ---------- 내보내기 / 불러오기 ---------- */
async function exportSave(){
  const data=JSON.stringify(ST);
  const st=ST.stand['wwzw'];
  const fname=`우완좌완_${st.w}승${st.l}패_${ST.round}차전.json`;
  /* 아티팩트 안에서는 <a download> 가 막혀 있다. 호스트가 주는 저장 통로를 먼저 써본다. */
  try{
    const dl = (window.claude&&window.claude.use) ? await window.claude.use('downloads') : null;
    if(dl){
      try{ await dl.save({filename:fname,data}); toast('세이브 파일 저장됨'); }
      catch(err){
        if(err&&err.code==='declined') toast('저장을 취소했다');
        else toast('파일 저장이 안 된다 — 코드 복사를 써라');
      }
      return;
    }
  }catch(e){/* 통로가 없으면 아래 일반 다운로드로 간다 */}
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
  toast('세이브 파일 저장됨');
}
function copySave(){
  const data=JSON.stringify(ST);
  const ta=document.createElement('textarea');
  ta.value=data; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok){ toast('세이브 코드 복사됨'); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(data).then(()=>toast('세이브 코드 복사됨'),()=>toast('복사 실패')); }
  else toast('복사 실패 — 파일 저장을 써라');
}
function importFromText(txt){
  try{
    const d=JSON.parse(txt);
    if(!d||d.v!==5){ toast('세이브 형식이 맞지 않는다'); return false; }
    ST=d; normalizeState(); saveGame(true); go('home'); toast('불러오기 완료');
    return true;
  }catch(e){ toast('불러오기 실패 — 코드를 확인해라'); return false; }
}
function importSaveFile(file){
  const r=new FileReader();
  r.onload=()=>importFromText(String(r.result));
  r.onerror=()=>toast('파일을 읽지 못했다');
  r.readAsText(file);
}

/* ---------- 주간 ---------- */
function runWeek(){
  if(!ST.notices)ST.notices=[];
  ST.events=[];
  ST.weekSeq=(ST.weekSeq||0)+1;
  const rng=makeRng((ST.seed+ST.round*31337+ST.weekSeq*7717)>>>0);
  Object.keys(ST.injury).forEach(pid=>{
    const inj=ST.injury[pid]; if(!inj)return;
    inj.games--;
    if(inj.games<=0){ST.injury[pid]=null;
      ST.notices.push({type:'recover',title:`${nameOf(pid)} 복귀`,body:`${inj.name}에서 회복했다.`,effect:'출전 가능'});}
  });
  TBYID['wwzw'].players.forEach(p=>{
    const m=META[p.id];
    let rec=(m&&m.traits.includes('성실'))?11:7;
    if(m&&m.traits.includes('안방마님'))rec+=3;   // 궂은일을 해도 몸이 버틴다
    ST.cond[p.id]=Math.min(100,ST.cond[p.id]+rec+((rng()*7)|0)-3);
    ST.morale[p.id]=Math.max(10,Math.min(100,ST.morale[p.id]+(ST.morale[p.id]<70?2:-1)));
  });
  ST.mittMissing=false; ST.scoutBlocked=false;
  // 지난 경기 갈등으로 예고된 결장 반영
  const pend=ST.pendingAbsent||{};
  const evs=rollWeekEvents(ST,rng);
  if(evs.some(e=>e.type==='discharge')) ST.justDischarged=true;
  ST.gameDate=(ST.calendar&&ST.calendar.label)||'';
  Object.keys(pend).forEach(id=>{
    if(ST.injury[id])return;
    evs.push({type:'absent',pid:id,title:`${nameOf(id)} 결장`,
      body:`${nameOf(id)}이(가) ${pend[id]} 안 나온다고 한다.`,effect:'이번 경기 출전 불가'});
  });
  ST.pendingAbsent={};
  const carried=(ST.notices||[]).slice();
  ST.notices=[];
  ST.events=carried.concat(evs);
  const rained=applyWeekEvents(ST,evs);
  // 결장자가 라인업에 있으면 자동 교체
  autoFixLineup();
  ST.kakao=[]; ST.kakaoPost=[]; ST.partyDone=false; ST.weekDone=true;
  ST.sentPre=false; ST.sentPost=false; ST.teamBuff=null; ST.canParty=false; ST.dropouts=[];
  const anId=TBYID['wwzw'].players.find(p=>META[p.id]&&META[p.id].traits.includes('분석가'));
  const anUn=anId?((ST.unhappy&&ST.unhappy[anId.id])?ST.unhappy[anId.id].level:0):9;
  ST.oppEvent = (anId&&isAvailable(anId.id)&&anUn<3&&!ST.scoutBlocked)
    ? rollOppEvent(ST,rng,TBYID[ST.schedule[ST.round].opp]) : null;
  ST.park=(ST.schedule[ST.round]||{}).park||'benamul';
  // 주중 훈련일 날씨는 경기날과 별개로 굴린다
  ST.trainRain = rng()<0.24;
  ST.trainPush = false;
  return rained;
}

  const avgM=us.players.reduce((s,p)=>s+(ST.morale[p.id]||70),0)/us.players.length;
  const avgC=us.players.reduce((s,p)=>s+(ST.cond[p.id]||70),0)/us.players.length;
  const mood=el('div','card');
  mood.innerHTML=`<div class="card-h">팀 상태</div>
    <div class="tend-row"><span class="tn">사기</span><div class="tbar"><div class="${avgM>=70?'g':'r'}" style="width:${avgM}%"></div></div><span class="tv">${avgM.toFixed(0)}</span></div>
    <div class="tend-row"><span class="tn">컨디션</span><div class="tbar"><div class="${avgC>=70?'g':'r'}" style="width:${avgC}%"></div></div><span class="tv">${avgC.toFixed(0)}</span></div>`;
  const inj=us.players.filter(p=>ST.injury[p.id]);
  if(inj.length)mood.appendChild(el('p','muted','부상: '+inj.map(p=>`${p.name}(${ST.injury[p.id].name} ${ST.injury[p.id].games}경기)`).join(', ')));
  const unh=us.players.filter(p=>ST.unhappy&&ST.unhappy[p.id]&&ST.unhappy[p.id].level>=2);
  if(unh.length)mood.appendChild(el('div','warn','불만: '+unh.map(p=>`${p.name}(${unhappyLabel(ST.unhappy[p.id].level)})`).join(', ')));
  // 불씨 — 아직 불만은 아닌데 쌓이는 중인 것들. 터지기 전에 손 쓰라는 신호다.
  const spk=us.players.filter(p=>{
    const sp=sparkOf(ST,p.id);
    return sp.n>=2 && !(ST.unhappy&&ST.unhappy[p.id]&&ST.unhappy[p.id].level>=2);
  });
  if(spk.length){
    const line=el('p','muted');
    const top=spk.slice().sort((a,b)=>sparkOf(ST,b.id).n-sparkOf(ST,a.id).n);
    const shown=top.slice(0,3).map(p=>{
      const sp=sparkOf(ST,p.id);
      return `${p.name}(${sparkLabel(sp)} · ${sp.n}/${sparkFuse(p.id)})`;
    }).join(', ');
    line.innerHTML='<b>불만 조짐</b> — '+shown+(top.length>3?` 외 ${top.length-3}명`:'')
      +'<br>아직 참는 중이다. 이 상태에서 또 벤치에 두거나 하위타순에 넣으면 터진다.';
    mood.appendChild(line);
  }
  c.appendChild(mood);

  // 플레이타임
  const ptc=el('div','card');
  ptc.innerHTML=`<div class="card-h">플레이타임</div>
    <div class="pt-big" id="pt-val">${fmtPlaySec(ST.playSec)}</div>
    <p class="muted" id="pt-line">${playTimeLine(ST.playSec)}</p>`;
  c.appendChild(ptc);

  // 면담에서 한 약속 — 라인업 짜기 전에 보이게 홈에 띄운다
  const proms=Object.keys(ST.promise||{}).filter(pid=>us.players.some(p=>p.id===pid));
  if(proms.length){
    const pc=el('div','card');
    pc.appendChild(el('div','card-h','약속한 것'));
    proms.forEach(pid=>{
      const r=el('div','prom-row');
      r.innerHTML=`<span>${nameOf(pid)}</span><b>${promiseLabel(ST.promise[pid])}</b>`;
      pc.appendChild(r);
    });
    pc.appendChild(el('p','muted','약속을 어기면 사기 -20에 불만이 2단계 오른다. 결장한 경기는 세지 않는다.'));
    c.appendChild(pc);
  }

  // ??? 이벤트
  if(ST.mystery){
    const my=ST.mystery;
    const mc=el('div','card mystery');
    mc.innerHTML=`<div class="card-h">???</div>
      <div class="my-q">?</div>
      <p class="muted">경기가 끝나고 ${my.name}에게 뭔가 일어난 것 같다.</p>`;
    const b=el('button','btn primary','확인한다');
    b.onclick=()=>{
      const r=applyMystery(ST,my);
      let msg;
      if(!r) msg=`${my.name}은(는) 별일 없었다.`;
      else if(r.after>r.before) msg=`${my.name} ${r.stat} ${r.before} → ${r.after} 상승!`;
      else msg=`${my.name} ${r.stat} ${r.before} → ${r.after} 하락...`;
      ST.mystery=null;
      ST.mysteryResult=msg;
      saveGame(true); go('home'); toast(msg);
    };
    mc.appendChild(b);
    c.appendChild(mc);
  }
  if(ST.mysteryResult){
    c.appendChild(el('div','card',ST.mysteryResult));
    ST.mysteryResult=null;
  }


  /* ---- 감독 면담 ---- 내 성적을 두고 감독이 부른다 */
  if(ST.bossTalk){
    const B=ST.bossTalk;
    const bc=el('div','card');
    bc.innerHTML=`<div class="card-h">${nameOf(B.boss)}에게서 카톡</div>`;
    const room=el('div','kakao');
    B.log.forEach(m=>{
      const mine=m.who===(ST.playerId||MYID);
      const wd=el('div','kmsg'+(mine?' mine':'')+(m.type==='notice'?' notice':''));
      wd.innerHTML=`${(mine||m.type==='notice')?'':`<div class="kname">${nameOf(m.who)}</div>`}`+
        `<div class="kbub ${B.tier==='bad'&&!m.type?'angry':(B.tier==='good'&&!m.type?'happy':'')}">`+
        `${String(m.text).replace(/\n/g,'<br>')}</div>`;
      room.appendChild(wd);
    });
    bc.appendChild(room);
    if(B.step===0){
      const box=el('div','card sendbox');
      box.appendChild(el('div','card-h','뭐라고 답할까'));
      [['humble','더 열심히 하겠다고 한다','사기 +6 · 감독 호감 +8'],
       ['fight','자신 있다고 받아친다','사기 +10 / 성적이 나쁘면 역효과'],
       ['excuse','사정이 있었다고 한다','사기 -4 · 감독 호감 -6']].forEach(([k,n,d2])=>{
        const b=el('button','sendopt bossopt');
        b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
        b.onclick=()=>{
          const me=ST.playerId||MYID;
          B.log.push({who:me,text:n});
          const rep2=pickOne(BOSS_REPLY[k][B.tier]);
          B.log.push({who:B.boss,text:rep2});
          let dm=0, db=0;
          if(k==='humble'){dm=6;db=8;}
          else if(k==='fight'){dm=B.tier==='bad'?-6:10;db=B.tier==='bad'?-4:6;}
          else {dm=-4;db=-6;}
          ST.morale[me]=Math.max(10,Math.min(100,(ST.morale[me]||70)+dm));
          if(ST.bond)bondAdd(B.boss,db);
          B.log.push({who:B.boss,type:'notice',
            text:`내 사기 ${dm>=0?'+':''}${dm} · ${nameOf(B.boss)}와의 우정 ${db>=0?'+':''}${db}`});
          B.step=1;
          ST.bossTalkCount=(ST.bossTalkCount||0)+1;
          ST.bossTalkAt=ST.schedule.filter(x=>x.played).length;
          saveGame(true); go('home');
        };
        box.appendChild(b);
      });
      bc.appendChild(box);
    } else {
      const done=el('button','btn primary','대화 종료');
      done.onclick=()=>{ST.bossTalk=null;saveGame(true);go('home');};
      bc.appendChild(done);
    }
    c.appendChild(bc);
  }

  /* ---- 시즌 초 장비 구매 안건 ---- 사자는 쪽과 아끼자는 쪽이 갈린다 */
  if(ST.round===0 && !ST.gearMeeting){
    ST.gearMeeting={done:false};
  }
  if(ST.gearMeeting && !ST.gearMeeting.done){
    const gc=el('div','card');
    gc.innerHTML=`<div class="card-h">시즌 준비 · 장비 안건</div>
      <p class="muted">단톡방에서 뭘 살지로 말이 오간다. 운영비 <b>${ST.budget.toFixed(0)}만원</b>.
      시즌이 끝나면 다음 시즌 리그 가입비 <b>${LEAGUE_FEE}만원</b>을 내야 한다. 다 쓰면 회비를 걷어야 한다.</p>`;
    GEAR_ITEMS.forEach(g=>{
      const own=gearOwned(g.id), poor=ST.budget<g.cost;
      const b=el('button','sendopt'+(own?' bought':''));
      const forL=pickOne(GEAR_FOR), agL=pickOne(GEAR_AGAINST);
      const a=speakers(ST,null,2,Math.random);
      b.innerHTML=`<b>${g.name} · ${g.cost}만원${own?' (구매함)':''}</b>`+
        `<span>${g.desc}<br>${g.effect}`+
        (own?'':`<br><i class="gfor">${a[0]?nameOf(a[0].id)+': ':''}${a[0]?sayTo(a[0].id,ST.playerId,forL[0],forL[1]):''}</i>`+
             `<br><i class="gag">${a[1]?nameOf(a[1].id)+': ':''}${a[1]?sayTo(a[1].id,ST.playerId,agL[0],agL[1]):''}</i>`)+
        `</span>`;
      if(!own&&!poor)b.onclick=()=>{
        ST.budget-=g.cost;
        ST.gear=ST.gear||{}; ST.gear[g.id]=true;
        if(g.eff.gear)ST.gearLevel=0;
        TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.min(100,(ST.morale[p.id]||70)+5));
        ST.kakao=ST.kakao||[];
        ST.kakao.push({who:'lg',type:'notice',text:`${g.name} 구매 — ${g.cost}만원\n전원 사기 +5`});
        saveGame(true); go('home'); toast(`${g.name} 구매`);
      };
      else if(poor&&!own) b.onclick=()=>toast(`운영비가 부족하다 (${g.cost}만원 필요)`);
      gc.appendChild(b);
    });
    const done=el('button','btn','장비 얘기 마무리');
    done.onclick=()=>{ST.gearMeeting.done=true;saveGame(true);go('home');toast('시즌 준비 완료');};
    gc.appendChild(done);
    c.appendChild(gc);
  }

  /* ---- 시즌 말 리그 가입비 ---- 모자라면 회비를 걷어야 한다 */
  if(ST.feeDue){
    const need=Math.max(0, LEAGUE_FEE-ST.budget);
    const fc=el('div','card');
    fc.innerHTML=`<div class="card-h">다음 시즌 리그 가입비</div>
      <p class="muted">협회에 <b>${LEAGUE_FEE}만원</b>을 내야 다음 시즌을 뛴다.
      현재 운영비 <b>${ST.budget.toFixed(0)}만원</b>.
      ${need>0?`<span class="warnx">${need}만원이 모자란다.</span>`:'낼 수 있다.'}</p>`;
    if(need>0){
      const n=TBYID['wwzw'].players.filter(p=>!isMerc(p.id)).length||1;
      const b=el('button','btn danger',`회비 걷는다 (인당 ${Math.ceil(need/n)}만원)`);
      b.onclick=()=>{
        const r=collectDues(need);
        ST.kakao=ST.kakao||[];
        r.msgs.forEach(m=>ST.kakao.push(m));
        saveGame(true); go('kakao');
        toast(`회비 ${r.per}만원씩 ${r.n}명 — ${r.total}만원`);
      };
      fc.appendChild(b);
    } else {
      const b=el('button','btn primary',`가입비 ${LEAGUE_FEE}만원 납부`);
      b.onclick=()=>{
        ST.budget-=LEAGUE_FEE; ST.feeDue=false;
        ST.kakao=ST.kakao||[];
        ST.kakao.push({who:'lg',type:'notice',
          text:`다음 시즌 리그 가입비 ${LEAGUE_FEE}만원 납부 완료\n남은 운영비 ${ST.budget.toFixed(0)}만원`});
        saveGame(true); go('home'); toast('가입비 납부 완료');
      };
      fc.appendChild(b);
    }
    c.appendChild(fc);
  }

  // 친구의 술 약속
  if(ST.drinkInvite && TBYID['wwzw'].players.some(p=>p.id===ST.drinkInvite.pid)){
    const pid=ST.drinkInvite.pid;
    const me=ST.playerId||MYID;
    const dc=el('div','card');
    dc.innerHTML=`<div class="card-h">${nameOf(pid)}에게서 연락</div>
      <p class="muted">${ST.drinkInvite.line||sayTo(pid,me,...pickOne(DRINK_INVITE))}</p>
      <div class="pc-prom">지금 우정 ${bondLabel(bondOf(pid))} (${bondOf(pid)})</div>`;
    const g=el('div','tac-grid');
    [['yes','나간다','우정 +12 · 둘 다 사기 +10 / 다음 경기 컨디션 -18'],
     ['no','안 나간다','우정 -10 · 컨디션은 지킨다']].forEach(([k,n,d2])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
      b.onclick=()=>{
        ST.kakao=ST.kakao||[];
        if(k==='yes'){
          bondAdd(pid,12);
          [pid,me].forEach(id=>{
            if(!TBYID['wwzw'].players.some(p=>p.id===id))return;
            ST.morale[id]=Math.min(100,(ST.morale[id]||70)+10);
            ST.cond[id]=Math.max(20,(ST.cond[id]||70)-18);
          });
          if(ST.unhappy[pid])ST.unhappy[pid].level=Math.max(0,ST.unhappy[pid].level-1);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(DRINK_YES)),mood:'happy'});
          toast(`${nameOf(pid)}과(와) 한잔했다 — 사기↑ 컨디션↓`);
        } else {
          bondAdd(pid,-10);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(DRINK_NO)),mood:'sad'});
          toast(`${nameOf(pid)} 약속 거절 — 우정 하락`);
        }
        ST.drinkInvite=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    dc.appendChild(g); c.appendChild(dc);
  }

  // 타팀 영입 제안 — 타순 보장을 요구한다
  if(ST.poach && TBYID['wwzw'].players.some(p=>p.id===ST.poach.pid)){
    const pid=ST.poach.pid, om=ST.poach.orderMax||3;
    const me=ST.playerId||MYID;
    const pc2=el('div','card');
    pc2.innerHTML=`<div class="card-h">타팀 영입 제안 · ${nameOf(pid)}</div>
      <p class="muted">${ST.poach.line||sayTo(pid,me,...pickOne(POACH_LINES))}</p>
      <div class="pc-prom">${om}번 타순 이상 · 5경기 보장을 요구한다</div>`;
    const g=el('div','tac-grid');
    [['keep',`${om}번 타순 이상 약속`,'5경기 보장. 어기면 사기 -20 · 불만 +2'],
     ['no','약속 안 한다','불만 2단계 상승 · 이적 요구로 번질 수 있다']].forEach(([k,n,d2])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d2}</span>`;
      b.onclick=()=>{
        ST.kakao=ST.kakao||[];
        if(k==='keep'){
          ST.promise=ST.promise||{};
          ST.promise[pid]={type:'order',games:5,orderMax:om};
          ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+12);
          if(ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
          bondAdd(pid,6);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(POACH_STAY)),mood:'happy'});
          toast(`${nameOf(pid)} 잔류 — ${om}번 타순 이상 5경기`);
        } else {
          if(!ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
          ST.unhappy[pid].level=Math.min(4,ST.unhappy[pid].level+2);
          ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-12);
          bondAdd(pid,-12);
          ST.kakao.push({who:pid,text:sayTo(pid,me,...pickOne(POACH_LEAVE)),mood:'angry'});
          toast(`${nameOf(pid)} 불만 상승`);
        }
        ST.poach=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    pc2.appendChild(g); c.appendChild(pc2);
  }

  // 이적 요구 면담
  if(ST.transferReq){
    const pid=ST.transferReq;
    const tc=el('div','card');
    tc.innerHTML=`<div class="card-h">이적 문의 · ${nameOf(pid)}</div>
      <p class="muted">${nameOf(pid)}이(가) 다른 팀에서 연락이 왔다고 한다. 어떻게 할까?</p>`;
    const g=el('div','tac-grid');
    [['keep','붙잡는다','다음 3경기 선발 약속 · 사기 회복'],
     ['money','회식 한번 쏜다','운영비 20만원 · 사기 소폭 회복'],
     ['let','보낸다','로스터에서 제외']].forEach(([k,n,d])=>{
      const b=el('button','tac'); b.innerHTML=`<b>${n}</b><span>${d}</span>`;
      b.onclick=()=>{
        if(k==='keep'){ ST.unhappy[pid]={level:0,streak:0};
          ST.morale[pid]=Math.min(100,ST.morale[pid]+22); ST.promise=ST.promise||{};
          ST.promise[pid]={type:'start',games:3,orderMax:3};
          toast(`${nameOf(pid)} 잔류 — 3경기 선발 약속`); }
        else if(k==='money'){
          if(ST.budget<20){toast('운영비가 부족하다');return;}
          ST.budget-=20; ST.unhappy[pid].level=Math.max(0,ST.unhappy[pid].level-2);
          ST.morale[pid]=Math.min(100,ST.morale[pid]+14); toast('회식으로 달랬다'); }
        else {
          const us2=TBYID['wwzw'];
          const i=us2.players.findIndex(p=>p.id===pid);
          if(i>=0)us2.players.splice(i,1);
          ST.lineup=ST.lineup.filter(s=>s.id!==pid);
          if(ST.lineup.length<9)ST.lineup=recommendLineup();
          ST.rotation=ST.rotation.filter(x=>x!==pid);
          if(!ST.rotation.length)ST.rotation=recommendRotation();
          finalizeTeam(us2); buildPitcherPool();
          us2.players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-6));
          toast(`${nameOf(pid)} 이적`);
        }
        ST.transferReq=null; saveGame(true); go('home');
      };
      g.appendChild(b);
    });
    tc.appendChild(g); c.appendChild(tc);
  }

  if(ST.seasonOver){
    if(!ST.awards) ST.awards=buildAwards(ST);
    const aw=el('div','card');
    aw.appendChild(el('div','card-h','시즌 시상식'));
    ST.awards.forEach(a=>{
      const r=el('div','award');
      r.innerHTML=`<span class="aw-l">${a.label}</span><span class="aw-n">${a.name}</span><span class="aw-v">${a.value}</span>`;
      aw.appendChild(r);
    });
    c.appendChild(aw);
    const d=el('div','card');
    d.innerHTML=`<div class="card-h">시즌 종료</div><p class="muted">최종 ${st.w}승 ${st.l}패 ${st.t}무 · 리그 ${leagueRank('wwzw')}위</p>`;
    const b=el('button','btn primary','새 시즌 시작');
    b.onclick=async()=>{
      const keep={career:ST.career,teamCareer:ST.teamCareer,milestones:ST.milestones,firsts:ST.firsts,
        seasonNo:(ST.seasonNo||1)+1,discharged:ST.discharged,playerId:ST.playerId,
        ratings:{}, budget:ST.budget};
      TBYID['wwzw'].players.forEach(p=>keep.ratings[p.id]={con:p.con,pow:p.pow,eye:p.eye,spd:p.spd,def:p.def,arm:p.arm});
      TEAMS=buildAllTeams();TBYID={};TEAMS.forEach(t=>TBYID[t.id]=t);
      // 능력치 이월
      TBYID['wwzw'].players.forEach(p=>{ const r=keep.ratings[p.id]; if(r)Object.assign(p,r); });
      finalizeTeam(TBYID['wwzw']); buildPitcherPool();
      ST=newSeason();
      Object.assign(ST,{career:keep.career,teamCareer:keep.teamCareer,milestones:keep.milestones,
        firsts:keep.firsts,seasonNo:keep.seasonNo,discharged:keep.discharged,playerId:keep.playerId,
        year:2026+keep.seasonNo-1, budget:Math.round(keep.budget*0.4+120)});
      ST.teamCareer.seasons=(ST.teamCareer.seasons||0)+1;
      normalizeState();
      ST.lineup=recommendLineup();ST.rotation=recommendRotation();
      await saveGame(true);go('home');
      toast(`${ST.seasonNo}년차 시즌 시작`);
    };
    d.appendChild(b); c.appendChild(d); return;
  }

  const next=ST.schedule[ST.round];
  const opp=TBYID[next.opp];

  if(!ST.weekDone){
    const card=el('div','card');
    card.innerHTML=`<div class="card-h">${next.round}차전 준비</div>
      <div class="opp-name">${opp.name}</div>
      <div class="opp-ops">${next.homeGame?'홈':'원정'} · 팀 OPS ${opp.ops.toFixed(3)}</div>
      <div class="gdate">${(holidayFor(ST.round, ST.year||2026)||{}).label||''}</div>
      <p class="muted">주간을 시작하면 회식·우취·개인 사정 같은 변수가 확정된다.</p>`;
    const b=el('button','btn primary','이번 주 시작');
    b.onclick=()=>{const r=runWeek();saveGame(true);if(r)toast('우천 취소');go('home');};
    card.appendChild(b); c.appendChild(card); return;
  }

  if(ST.events&&ST.events.length){
    const ec=el('div','card');
    ec.appendChild(el('div','card-h','이번 주 소식'));
    ST.events.forEach(e=>{
      const row=el('div','evt evt-'+e.type);
      row.innerHTML=`<div class="evt-t">${e.title}</div><div class="evt-b">${e.body}</div><div class="evt-e">${e.effect}</div>`;
      ec.appendChild(row);
    });
    c.appendChild(ec);
  }

  const rain=ST.events&&ST.events.some(e=>e.type==='rain'||e.type==='postpone');
  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const wxN=(WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0]).name;
  const dateLbl=(ST.calendar&&ST.calendar.label)||'';
  const card=el('div','card');
  card.innerHTML=`<div class="card-h">${next.round}차전 · ${next.homeGame?'홈':'원정'}</div>
    <div class="gdate">${dateLbl}${ST.calendar&&ST.calendar.holiday?` · ${ST.calendar.holiday}`:''} · ${wxN}
      <i class="gapx">${gapLabel(ST.round, ST.year||2026)}</i></div>
    <div class="opp-name">${opp.name}</div>
    <div class="opp-ops">팀 OPS ${opp.ops.toFixed(3)} · 타율 ${fmt3(opp.avg)}</div>
    <div class="park"><b>${park.name}</b><span>${park.desc}</span></div>
    <div class="scout">${ST.scoutBlocked?'김한규가 분석 자료를 안 넘겼다. 상대 정보가 없다.':scoutLine(opp)}</div>`;
  if(rain){
    card.appendChild(el('p','muted','우천 취소다. 다음 주로 넘긴다.'));
    const b=el('button','btn','다음 주로');
    b.onclick=()=>{const r=releaseMercs(true);if(r)toast(`우천 취소 — 용병 ${r}명 비용 환불`);
      ST.weekDone=false;ST.events=[];saveGame(true);go('home');};
    card.appendChild(b);
  } else {
    const avail=us.players.filter(p=>isAvailable(p.id)).length;
    if(avail<9){
      card.appendChild(el('div','warn',
        `출전 가능 인원 ${avail}명. 9명이 안 되면 몰수패(0:7)다. 용병을 부르면 채울 수 있다.`));
      const b0=el('button','btn','단톡방에 사정해본다');
      b0.onclick=()=>{
        const cands=us.players.filter(p=>ST.absent&&ST.absent[p.id]);
        if(!cands.length){toast('부를 사람이 없다');return;}
        const p=cands[(Math.random()*cands.length)|0];
        if(Math.random()<0.45){
          delete ST.absent[p.id];
          ST.morale[p.id]=Math.max(10,ST.morale[p.id]-6);
          ST.cond[p.id]=Math.max(25,ST.cond[p.id]-10);
          ST.kakao=ST.kakao||[];
          ST.kakao.push({who:p.id,text:say(p.id,'알겠다 늦게라도 갈게','알겠습니다 늦게라도 가겠습니다'),mood:'flat'});
          ST.lineup=recommendLineup(); applyDHRule();
          toast(`${p.name}이(가) 오기로 했다`);
        } else {
          ST.kakao=ST.kakao||[];
          ST.kakao.push({who:p.id,text:say(p.id,'미안하다 진짜 안 된다','정말 죄송합니다 안 됩니다'),mood:'sad'});

        saveGame(true); go('home');
      };
      card.appendChild(b0);

      const b2=el('button','btn primary','경기 시작'); b2.onclick=()=>go('game');
      card.appendChild(b1); card.appendChild(b2);

  }
  c.appendChild(card);

  const recent=ST.schedule.filter(s=>s.played).slice(-5).reverse();
  if(recent.length){
    const rc=el('div','card'); rc.appendChild(el('div','card-h','최근 경기'));

      rc.appendChild(row);
    });
    c.appendChild(rc);
  }
}

/* =========================================================
   용병 운용
   ---------------------------------------------------------
   용병은 로스터에 상주하지 않는다. ST.mercs 에 담긴 동안만
   TBYID['wwzw'].players 에 얹혀 있다가 경기가 끝나면 빠진다.
   기록(ST.bat)도 같이 지워서 통산기록·시상식에 안 섞이게 한다.
   ========================================================= */
function ensureMercs(){
  const us=TBYID['wwzw'];
  if(!Array.isArray(ST.mercs))ST.mercs=[];
  ST.mercs=ST.mercs.filter(id=>isMerc(id));
  let changed=false;
  ST.mercs.forEach(id=>{
    if(us.players.some(p=>p.id===id))return;
    const m=mercDef(id); if(!m)return;
    us.players.push({id:m.id,name:m.name,bats:m.bats,
      con:m.con,pow:m.pow,eye:m.eye,spd:m.spd,def:m.def,arm:m.arm,
      pos:Object.keys(m.pos).filter(k=>m.pos[k]>0&&k!=='DH'),
      pitch:null,real:null});
    META[m.id]={born:2000,speech:'jon',throws:m.throws,car:false,school:'-',
      drink:1,attend:1.0,loyal:0,pot:0,traits:['용병'],friends:[],rival:null,
      coach:{},pos:{...m.pos},desc:m.desc};
    ST.bat[m.id]=ST.bat[m.id]||blankBat();
    if(ST.cond[m.id]==null)ST.cond[m.id]=70;
    if(ST.morale[m.id]==null)ST.morale[m.id]=60;
    if(ST.injury[m.id]===undefined)ST.injury[m.id]=null;
    ST.ca[m.id]=calcCA(us.players[us.players.length-1]);
    if(ST.caStart)ST.caStart[m.id]=ST.ca[m.id];
    changed=true;
  });
  if(changed){ finalizeTeam(us); buildPitcherPool(); }
  return changed;
}

/* 용병을 부른다. 운영비가 모자라면 못 부른다. */
function hireMerc(id){
  const m=mercDef(id);
  if(!m) return {ok:false,msg:'그런 사람 없다'};
  if(!Array.isArray(ST.mercs))ST.mercs=[];
  if(ST.mercs.indexOf(id)>=0) return {ok:false,msg:`${m.name}은(는) 이미 불렀다`};
  if(ST.budget < m.fee) return {ok:false,msg:`운영비가 부족하다 (${m.fee}만원 필요)`};
  ST.budget-=m.fee;
  ST.mercs.push(id);
  ensureMercs();
  // 용병을 쓰면 팀 분위기가 좋을 리 없다
  TBYID['wwzw'].players.forEach(p=>{
    if(isMerc(p.id))return;
    ST.morale[p.id]=Math.max(10,(ST.morale[p.id]||70)-3);
  });
  ST.kakao=ST.kakao||[];
  ST.kakao.push({who:'lg',type:'notice',
    text:`용병 ${m.name} 섭외 — ${m.fee}만원 지출\n전원 사기 -3`});
  ST.kakao.push({who:pickOne(['lg','swm','kig']),
    text:pickOne(['또 용병이냐...','9명은 좀 채우자 진짜','내년엔 사람 좀 늘리자',
                  '이러다 매주 용병 부르겠다']),mood:'sad'});
  return {ok:true,msg:`${m.name} 합류 — ${m.fee}만원`};
}

/* 경기가 끝났거나 취소됐을 때 용병을 로스터에서 뺀다.
   refund=true 면(우천 취소 등) 비용을 돌려준다.                       */
function releaseMercs(refund){
  if(!Array.isArray(ST.mercs)||!ST.mercs.length)return 0;
  const us=TBYID['wwzw'];
  let back=0;
  ST.mercs.forEach(id=>{
    const m=mercDef(id);
    if(refund&&m)back+=m.fee;
    const i=us.players.findIndex(p=>p.id===id);
    if(i>=0)us.players.splice(i,1);
    delete ST.bat[id]; delete ST.cond[id]; delete ST.morale[id];
    delete ST.injury[id]; delete ST.ca[id];
    // 리그 순위표·통산기록·시상식에 용병이 남으면 안 된다
    if(ST.lgBat)delete ST.lgBat[id];
    if(ST.lgPit)delete ST.lgPit[id];
    if(ST.career)delete ST.career[id];
    if(ST.caStart)delete ST.caStart[id];
    if(ST.unhappy)delete ST.unhappy[id];
    if(ST.promise)delete ST.promise[id];
    if(ST.meetRound)delete ST.meetRound[id];
    if(ST.buff)delete ST.buff[id];
    if(ST.pit)delete ST.pit[id];
    if(ST.rest)delete ST.rest[id];
    if(ST.meet&&ST.meet.pid===id)ST.meet=null;
    if(ST.mystery&&ST.mystery.id===id)ST.mystery=null;
    delete META[id];
  });
  const n=ST.mercs.length;
  ST.mercs=[];
  ST.budget+=back;
  ST.lineup=(ST.lineup||[]).filter(sl=>!isMerc(sl.id));
  if(ST.lineup.length<9)ST.lineup=recommendLineup();
  ST.rotation=(ST.rotation||[]).filter(x=>!isMerc(x));
  if(!ST.rotation.length)ST.rotation=recommendRotation();
  if(ST.lastLineup)ST.lastLineup=ST.lastLineup.filter(x=>!isMerc(x.id));
  if(ST.trainTarget&&isMerc(ST.trainTarget))ST.trainTarget=null;
  finalizeTeam(us); buildPitcherPool(); applyDHRule();
  return n;
}

/* 용병 섭외 시트 */
function openMercSheet(after){
  const body=$('#sheet-body'); body.innerHTML='';
  const need=Math.max(0,9-TBYID['wwzw'].players.filter(p=>isAvailable(p.id)).length);
  $('#sheet-title').textContent=`용병 섭외 · ${need}명 더 필요`;
  const note=el('div','sheet-note',
    `경기당 비용이 나가고 부를 때마다 전원 사기가 3씩 깎인다. 현재 운영비 ${ST.budget.toFixed(0)}만원.`);
  body.appendChild(note);
  MERCS.forEach(m=>{
    const already=(ST.mercs||[]).indexOf(m.id)>=0;
    const poor=ST.budget<m.fee;
    const r=el('button','pick-row'+(already?' cur':'')+(poor&&!already?' bad':''));
    const canPos=Object.keys(m.pos).filter(k=>k!=='DH'&&m.pos[k]>0);
    r.innerHTML=`<div class="pk-l"><div class="pk-name">${m.name}${already?' · 합류함':''}</div>
      <div class="pk-note">${m.desc}<br>가능 포지션 ${canPos.length?canPos.map(k=>POSNAMES[k]).join('·'):'없음'}</div></div>
      <div class="pk-r"><div class="pk-stat">${m.fee}만원</div></div>`;
    if(!already&&!poor)r.onclick=()=>{
      const res=hireMerc(m.id);
      toast(res.msg);
      if(res.ok){ saveGame(true); closeSheet(); if(after)after(); }
    };
    body.appendChild(r);
  });
  $('#sheet').classList.add('open');
}

function forfeit(){
  releaseMercs(true);                 // 경기를 안 했으니 용병 비용은 돌려받는다
  const sch=ST.schedule[ST.round];
  sch.played=true; sch.result={us:0,them:7};
  const u=ST.stand['wwzw'], t=ST.stand[sch.opp];
  u.g++;t.g++;u.l++;t.w++;u.ra+=7;t.rf+=7;
  TBYID['wwzw'].players.forEach(p=>ST.morale[p.id]=Math.max(10,ST.morale[p.id]-10));
  simOtherGames(sch.opp);
  ST.round++;ST.weekDone=false;ST.events=[];
  if(ST.round>=ST.schedule.length)ST.seasonOver=true;
  saveGame(true);go('home');toast('몰수패');
}

function scoutLine(opp){
  const b=[];
  if(opp.tend.pow>=1.2)b.push('장타력 상위');
  if(opp.tend.sb>=1.3)b.push('도루 극단적');
  else if(opp.tend.sb<=0.7)b.push('거의 안 뜀');
  if(opp.tend.bb>=1.2)b.push('볼넷 잘 골라냄');
  if(opp.tend.k<=0.7)b.push('삼진 안 당함');
  else if(opp.tend.k>=1.25)b.push('삼진 많음');
  if(opp.tend.err>=1.15)b.push('수비 불안');
  const a=opp.pitchers[0];
  b.push(`선발 ${a.name} (구위 ${a.stf}/제구 ${a.ctl})`);
  return b.join(' · ');
}
function leagueRank(id){
  const a=TEAMS.slice().sort((x,y)=>{
    const A=ST.stand[x.id],B=ST.stand[y.id];
    const pa=A.g?A.w/A.g:0,pb=B.g?B.w/B.g:0;
    if(pb!==pa)return pb-pa; return (B.rf-B.ra)-(A.rf-A.ra);
  });
  return a.findIndex(t=>t.id===id)+1;
}

function clayHash(id){
  let h=2166136261;
  for(let i=0;i<(id||'x').length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); }
  return Math.abs(h);
}
/* 같은 선수는 항상 같은 인형이 나오도록 id 로 색과 각도를 정한다 */
function clayAvatar(pid){
  const h=clayHash(pid);
  const L=52+(h%5)*4, hue=19+((h>>3)%14);
  const gid='clay_'+pid;
  const body=`hsl(${hue},34%,${L}%)`;
  const top=`hsl(${hue},36%,${L+10}%)`;
  const dk=`hsl(${hue},32%,${L-15}%)`;
  const dk2=`hsl(${hue},30%,${L-25}%)`;
  const cap=((h>>7)%3)!==0;
  const tilt=(((h>>11)%7)-3);
  return `<svg class="pf-clay" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${body}"/></linearGradient></defs>
    <rect width="120" height="160" fill="#1a2029"/>
    <g transform="rotate(${tilt} 60 84)">
      <path d="M20 160 C23 121 40 106 60 106 C80 106 97 121 100 160 Z" fill="url(#${gid})"/>
      <path d="M50 92 h20 v18 h-20 z" fill="${dk}"/>
      <ellipse cx="60" cy="64" rx="30" ry="34" fill="url(#${gid})"/>
      <ellipse cx="30" cy="68" rx="5" ry="8" fill="${dk}"/>
      <ellipse cx="90" cy="68" rx="5" ry="8" fill="${dk}"/>
      <ellipse cx="49" cy="64" rx="4.4" ry="3.2" fill="${dk2}"/>
      <ellipse cx="71" cy="64" rx="4.4" ry="3.2" fill="${dk2}"/>
      <path d="M60 68 q3.5 8 -2 10.5" stroke="${dk}" fill="none" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M52 85 q8 5 16 0" stroke="${dk2}" fill="none" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="41" cy="49" rx="9" ry="6" fill="#fff" opacity=".07"/>
      <ellipse cx="84" cy="124" rx="13" ry="8" fill="#000" opacity=".09"/>
      <ellipse cx="34" cy="132" rx="10" ry="7" fill="#fff" opacity=".05"/>
      ${cap?`<path d="M31 54 a29 29 0 0 1 58 0 z" fill="#1b2438"/>
        <path d="M88 54 q17 2 18 9 q-19 3 -34 -2 z" fill="#26314c"/>
        <circle cx="60" cy="27" r="3.4" fill="#26314c"/>`:''}
    </g></svg>`;

   실제 사람이 하는 게임이라 대놓고 라벨로 붙이면 곤란한 것들이다.
   엔진에서는 그대로 돌아가고 표시만 뺀다.                              */
const HIDDEN_TRAITS=['불만러'];
function shownTraits(pid){
  const m=META[pid]; if(!m)return [];
  return (m.traits||[]).filter(t=>HIDDEN_TRAITS.indexOf(t)<0);

function nickOf(pid){

function avatarHTML(pid){

/* 포지션 적합도 → 등급. FM 의 포지션 원과 같은 역할이다. */
function posGrade(v, cap){
  if(v<=0)   return (cap>0) ? {t:'훈련 필요',c:'train'} : {t:'불가',c:'no'};
  if(v>=55)  return {t:'주포지션',c:'best'};
  if(v>=45)  return {t:'능숙',   c:'good'};
  if(v>=35)  return {t:'가능',   c:'ok'};
  return {t:'서툼',c:'weak'};
}
const PF_ORDER=['P','C','1B','2B','3B','SS','LF','CF','RF'];

/* 무엇을 훈련시켜야 하는가 */
function trainAdvice(p){
  const KEYS=[['con','컨택','타격 훈련'],['pow','파워','타격 훈련'],
              ['eye','선구','선구안 훈련'],['spd','주루','주루 훈련'],
              ['def','수비','수비 훈련'],['arm','어깨','수비 훈련']];
  const out=[];
  const low=KEYS.slice().sort((a,b)=>p[a[0]]-p[b[0]])[0];
  out.push({h:low[2], d:`${low[1]} ${Math.round(p[low[0]])} — 이 선수가 가진 것 중 가장 낮다. 여기부터 올리는 게 효율이 좋다.`});

  const m=META[p.id]||{traits:[],pos:{}};
  const pit=TBYID['wwzw'].pitchers.find(x=>x.id===p.id);
  /* 투구 훈련은 실제로 마운드에 서는 선수한테만 권한다.
     2루수한테 제구 올리라고 하는 건 조언이 아니다. */
  const isPitcher = !!p.pitch || (m.pos && m.pos.P > 0);
  if(pit && isPitcher && pit.ctl<32)
    out.push({h:'투구 훈련', d:`제구 ${pit.ctl}. 이 팀은 사사구로 무너진다. 마운드에 세울 거면 여기가 먼저다.`});

  /* 포지션 — 주포지션에 남은 여지가 먼저, 없으면 배울 만한 옆자리 */
  const mainPos=PF_ORDER.filter(k=>posFit(p.id,k)>0)
    .sort((x,y)=>posFit(p.id,y)-posFit(p.id,x))[0];
  const NEIGHBOR={ P:['1B','RF','LF'], C:['1B','3B','LF'], '1B':['3B','LF','RF'],
    '2B':['SS','3B','1B'], '3B':['1B','SS','LF'], SS:['2B','3B'],
    LF:['RF','CF','1B'], CF:['LF','RF'], RF:['LF','CF','1B'] };
  let pa2=null;
  if(mainPos){
    const cap=posTrainCap(p.id,mainPos), fit=posFit(p.id,mainPos);
    if(cap-fit>=6) pa2={k:mainPos,fit,cap,how:'주포지션 숙련도가 아직 덜 찼다'};
  }
  if(!pa2){
    const cand=(NEIGHBOR[mainPos]||['1B','LF','RF'])
      .filter(k=>posTrainCap(p.id,k)-posFit(p.id,k)>=6)[0];
    if(cand) pa2={k:cand,fit:posFit(p.id,cand),cap:posTrainCap(p.id,cand),
      how:'새 자리를 열어두면 결장자가 나와도 라인업이 안 무너진다'};
  }
  if(pa2)
    out.push({h:`포지션 적응 — ${POSNAMES[pa2.k]}`,
      d:`${pa2.how}. 지금 ${Math.round(pa2.fit)} → 최대 ${Math.round(pa2.cap)}. 집중 훈련 대상으로 걸어두면 된다.`});

  const ca=effCA(p.id), pa=effPA(p.id);
  if(pa-ca>=8) out.push({h:'성장 여지 있음', d:`현재 ${ca.toFixed(0)} / 잠재 ${pa.toFixed(0)}. 아직 올라갈 자리가 남았다.`});
  else out.push({h:'거의 다 왔다', d:`현재 ${ca.toFixed(0)} / 잠재 ${pa.toFixed(0)}. 큰 성장은 기대하기 어렵다.`});
  return out;
}

const DRINK_LABEL=['안 마신다','가끔 마신다','자주 마신다','끝까지 남는다'];
function personaLines(pid){
  const m=META[pid]; if(!m)return [];
  const out=[];
  out.push(['출석', `${Math.round((m.attend!=null?m.attend:0.85)*100)}%`
    + (m.attend<0.6?' — 자주 빠진다':m.attend>=0.85?' — 웬만하면 나온다':'')]);
  out.push(['회식', DRINK_LABEL[Math.min(3,m.drink||0)]]);
  out.push(['이동', m.car?'차가 있다. 다른 선수를 태우고 온다':'차가 없다. 누군가 태워줘야 한다']);
  if(m.school) out.push(['출신', m.school]);
  if(pid===(ST.playerId||MYID)) out.push(['나와의 관계','나']);
  else {
    const bd=bondOf(pid);
    out.push(['나와의 관계', `${bondLabel(bd)} (${Math.round(bd)})`]);
  }
  return out;
}

let profileId=null;
function openPlayer(pid){ profileId=pid; go('player'); }

/* 능력치 막대 색 — OOTP 처럼 구간별로 색이 다르다 */
function otTier(v){ return v>=65?'t4':v>=50?'t3':v>=35?'t2':'t1'; }
/* 0.667 이닝 → '0.2' (야구식 표기) */
function ipDot(ip){
  const w=Math.floor(ip+1e-6), f=Math.round((ip-w)*3);
  return f?`${w}.${f}`:`${w}`;
}
/* 남은 성장 여지를 여섯 능력치에 고르게 나눴을 때 각자 올라가는 값.
   calcCA 의 가중치 합이 정확히 5.0 이라, 여섯 개를 똑같이 n 씩 올리면
   CA 도 정확히 n 오른다. 그래서 잠재 = 현재 + (잠재CA - 현재CA) 다.
   지어낸 숫자가 아니라 성장 공식에서 그대로 떨어지는 값이다.        */
const CA_W={con:1.3,pow:1.1,eye:0.8,spd:0.7,def:0.7,arm:0.4};
function otPotential(pid,key,cur){
  const room=effPA(pid)-effCA(pid);
  if(room<=0||!CA_W[key])return cur;
  return Math.min(80, cur+room);
}
function otBar(label,cur,pot){
  const c=Math.max(0,Math.min(80,cur)), pp=Math.max(c,Math.min(80,pot==null?c:pot));
  const num = (pot!=null&&Math.round(pp)>Math.round(c))
    ? `${Math.round(c)} / ${Math.round(pp)}` : `${Math.round(c)}`;
  return `<div class="ot-rt"><div class="ot-rt-l">${label}</div>
    <div class="ot-rt-b"><span class="ot-num ${otTier(c)}">${num}</span>
      <div class="ot-bar"><u style="width:${pp/80*100}%"></u>
        <i class="${otTier(c)}" style="width:${c/80*100}%"></i></div></div></div>`;
}
function otRow(k,v,hot){
  return `<div class="ot-r"><span>${k}</span><b${hot?' class="hot"':''}>${v}</b></div>`;
}
function otSec(title,inner,right){
  return `<div class="ot-sec"><div class="ot-h">${title}${right?`<span>${right}</span>`:''}</div>
    <div class="ot-b">${inner}</div></div>`;
}

function syncStarter(){
  // 라인업에 투수 자리가 있으면 선발 투수를 자동으로 그 자리에 넣는다
  const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
  if(pIdx<0)return;
  const sp=ST.rotation[0];
  if(ST.lineup[pIdx].id===sp)return;
  const dup=ST.lineup.findIndex(s=>s.id===sp);
  if(dup>=0&&dup!==pIdx){
    const tmp=ST.lineup[pIdx].id;
    ST.lineup[pIdx].id=sp;
    ST.lineup[dup].id=tmp;
  } else {
    ST.lineup[pIdx].id=sp;
  }
}
function applyDHRule(){
  const t=TBYID['wwzw'];
  const sp=ST.rotation[0];
  const used=()=>ST.lineup.map(x=>x.pos);
  const freePos=(exclude)=>ALLPOS.concat(['P']).filter(x=>x!=='DH'&&!ST.lineup.some((s,i)=>i!==exclude&&s.pos===x));

  if(!ST.useDH){
    // 투수가 반드시 타순에 들어간다
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    const spIdx=ST.lineup.findIndex(s=>s.id===sp);
    if(spIdx>=0){
      // 이미 라인업에 있으면 그 자리를 P로
      if(pIdx>=0&&pIdx!==spIdx) ST.lineup[pIdx].pos=freePos(pIdx).find(x=>x!=='P')||'RF';
      ST.lineup[spIdx].pos='P';
    } else {
      // DH 자리를 투수로 교체, 없으면 마지막 타순
      let slot=ST.lineup.findIndex(s=>s.pos==='DH');
      if(slot<0) slot=8;
      ST.lineup[slot]={id:sp,pos:'P'};
    }
  } else {
    /* DH 사용 중에는 투수가 타순에 서지 않는다.
       그런데 유저가 타순의 누군가를 'P' 로 지정했다면
       "이 사람을 선발로 쓰겠다"는 뜻이므로 로테이션 1번으로 올려주고
       타순에서는 지명타자(또는 빈 야수 자리)로 되돌린다.
       예전에는 그냥 지워버려서 아무 일도 안 일어난 것처럼 보였다.    */
    const pIdx=ST.lineup.findIndex(s=>s.pos==='P');
    if(pIdx>=0){
      const who=ST.lineup[pIdx].id;
      if(TBYID['wwzw'].pitchers.some(p=>p.id===who)&&ST.rotation[0]!==who){
        ST.rotation=[who].concat((ST.rotation||[]).filter(x=>x!==who));
        ST._starterMoved=who;         // 화면에서 안내 문구를 띄우기 위한 표시
      }
      const hasDH=ST.lineup.some(s=>s.pos==='DH');
      ST.lineup[pIdx].pos = hasDH ? (freePos(pIdx).find(x=>posFit(who,x)>0)||'RF') : 'DH';
    }
  }
  syncStarter();
  // DH 미사용인데 DH 슬롯이 남아 있으면 야수 자리로 전환
  if(!ST.useDH){
    ST.lineup.forEach((s,i)=>{
      if(s.pos!=='DH')return;
      const cand=ALLPOS.filter(x=>x!=='DH'&&!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos=cand.find(x=>posFit(s.id,x)>0)||cand[0]||'RF';
    });
  }
  // 포지션 중복 정리
  const seen={};
  ST.lineup.forEach((s,i)=>{
    if(seen[s.pos]){
      const cand=ALLPOS.concat(ST.useDH?[]:['P']).filter(x=>!ST.lineup.some((y,j)=>j!==i&&y.pos===x));
      s.pos = cand.find(x=>posFit(s.id,x)>0) || cand[0] || s.pos;
    }
    seen[s.pos]=true;
  });
}

function restLabel(pid){
  const r=ST.rest&&ST.rest[pid]!==undefined?ST.rest[pid]:3;
  if(!isAvailable(pid))return '<b class="dead">불가</b>';
  if(r>=2)return '<b class="ok">정상</b>';
  if(r===1)return '<b class="tired">피로</b>';
  return '<b class="dead">과부하</b>';
}

function openPicker(idx){
  const t=TBYID['wwzw'];
  $('#sheet-title').textContent=`${idx+1}번 타자`;
  const body=$('#sheet-body'); body.innerHTML='';
  const inL=new Set(ST.lineup.map(s=>s.id));
  t.players.forEach(p=>{
    const cur=ST.lineup[idx].id===p.id;
    const used=inL.has(p.id)&&!cur;
    const ok=isAvailable(p.id);
    const iv=ST.injury[p.id];
    const row=el('button','pick-row'+(cur?' cur':'')+(used?' used':'')+(ok?'':' bad'));
    row.innerHTML=`<div class="pk-l"><div class="pk-name">${p.name}${p.bats==='L'?'<span class="lh">좌</span>':''}</div>
      <div class="pk-note">${iv?iv.name:((ST.absent&&ST.absent[p.id])||(META[p.id]?META[p.id].desc:''))}</div></div>
      <div class="pk-r">${starHTML(effCA(p.id))}<div class="pk-stat">${condLabel(ST.cond[p.id]||70)}</div></div>`;
    row.onclick=()=>{
      const o=ST.lineup.findIndex(s=>s.id===p.id);
      if(o>=0&&o!==idx){const tmp=ST.lineup[o].id;ST.lineup[o].id=ST.lineup[idx].id;ST.lineup[idx].id=tmp;}
      else ST.lineup[idx].id=p.id;
      closeSheet();saveGame(true);renderLineup();

function openPosPicker(idx){
  const t=TBYID['wwzw'];
  const p=t.players.find(x=>x.id===ST.lineup[idx].id);
  $('#sheet-title').textContent=`${p.name} 수비 위치`;
  const body=$('#sheet-body'); body.innerHTML='';
  const taken={}; ST.lineup.forEach((s,i)=>{if(i!==idx)taken[s.pos]=true;});
  /* 투수(P)는 지명타자를 쓰든 안 쓰든 항상 고를 수 있다.
     고르면 '선발 지정'으로 해석해서 로테이션 1번으로 올린다.
     예전에는 DH 사용 중이면 P 가 목록에 없거나 골라도 조용히 지워져서
     "투수로 바꿨는데 아무 일도 안 일어난다"는 문제가 있었다.          */
  const isP = TBYID['wwzw'].pitchers.some(x=>x.id===p.id);
  const list = (ST.useDH ? ALLPOS : ALLPOS.filter(x=>x!=='DH')).concat(['P']);
  list.forEach(pos=>{
    const starter = ST.rotation[0]===p.id;
    const fitV = pos==='P' ? (isP?Math.max(1,basePosFit(p.id,'P')):0) : posFit(p.id,pos);
    const fit=fitV>=45;
    const cur = pos==='P' ? starter : ST.lineup[idx].pos===pos;
    const row=el('button','pick-row'+(cur?' cur':'')+(pos!=='P'&&taken[pos]?' used':''));
    const note = pos==='P'
      ? (!isP ? '투수로 등록되지 않은 선수다'
              : (starter?'이미 오늘 선발이다':(ST.useDH?'선발로 지정한다 (타순에는 안 선다)':'선발로 지정한다')))
      : (fitV<=0?'불가 (좌투)':fit?'주 포지션':'익숙하지 않다 — 수비 하락');
    row.innerHTML=`<div class="pk-l"><div class="pk-name">${POSNAMES[pos]}</div>
      <div class="pk-note">${note}`+
      `${pos!=='P'&&posTrained(p.id,pos)>=1?` · 훈련 +${Math.round(posTrained(p.id,pos))}`:''}</div></div>
      <div class="pk-r"><div class="pk-stat">${pos==='P'?(isP?'선발':'—'):(taken[pos]?'중복':(fitV>0?fitV:'—'))}</div></div>`;
    if(fitV<=0) row.classList.add('bad');
    row.onclick=()=>{
      if(pos==='P'){
        if(!isP){toast(`${p.name}은(는) 투수 로테이션에 없다. 로테이션에서 먼저 추가해라`);return;}
        setStarter(p.id);
        closeSheet(); saveGame(true); renderLineup();
        toast(ST.useDH?`${p.name} 선발 지정 — 지명타자를 쓰는 중이라 타순에는 안 선다`
                      :`${p.name} 선발 지정`);
        return;
      }
      const o=ST.lineup.findIndex((s,i)=>i!==idx&&s.pos===pos);
      if(o>=0)ST.lineup[o].pos=ST.lineup[idx].pos;
      ST.lineup[idx].pos=pos;
      closeSheet();saveGame(true);renderLineup();
    };
    body.appendChild(row);
  });
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');}

function renderTutorial(){
  const c=$('#view'); c.innerHTML='';
  const i=Math.max(0,Math.min(TUTORIAL.length-1, ST.tutStep||0));

  const head=el('div','card');
  head.innerHTML=`<div class="card-h">${t.t}</div>
    <div class="tut-body">${t.b}</div>
    <div class="tut-dots">${TUTORIAL.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
  c.appendChild(head);
  const row=el('div','btn-row');
  if(i>0){
    const pv=el('button','btn','← 이전');
    pv.onclick=()=>{ST.tutStep=i-1;renderTutorial();};

  if(i<TUTORIAL.length-1){

  c.appendChild(row);

}

function openMeet(pid){
  if(!ST.meetRound)ST.meetRound={};
  const resuming = ST.meet && ST.meet.pid===pid && !ST.meet.done;
  if(!resuming && ST.meetRound[pid]===ST.round){
    toast(`${nameOf(pid)}과(와)는 이번 주에 이미 면담했다`); return;
  }
  if(!resuming){
    ST.meet={pid,done:false,log:[{who:pid,text:meetOpenLine(ST,pid),
      mood:((ST.unhappy&&ST.unhappy[pid])?ST.unhappy[pid].level:0)>=2?'angry':'flat'}]};
  }
  go('meet');
}

  const head=el('div','card');
  head.innerHTML=`<div class="card-h meet-head"><span>면담 · ${p.name}</span>
      <span class="meet-lv">${unhappyLabel(un)}</span></div>
    <p class="muted">사기 ${moraleLabel(ST.morale[pid]||70)} · 우정 ${bondLabel(bondOf(pid))} · 컨디션 ${condLabel(ST.cond[pid]||70)}
      · 출석 성향 ${Math.round(((META[pid]&&META[pid].attend)!=null?META[pid].attend:0.85)*100)}%</p>`;

    w.innerHTML=`${(mine||m.type==='notice')?'':`<div class="kname">${p.name}</div>`}`+

    const opts=[
      {k:'start', label:'약속한다 — 다음 5경기 선발 보장',
       desc:'지키면 사기 +15 · 불만 초기화. 어기면 사기 -20 · 불만 +2'},
      {k:'order', label:'약속한다 — 다음 5경기 5번 타순 이상',
       desc:'5번 안쪽 보장. 어기면 더 크게 삐진다'},
      {k:'calm',  label:'달랜다',
       desc:'60% 확률로 사기 +8 · 불만 1단계 감소. 실패하면 아무 변화 없음'},
      {k:'ignore',label:'무시한다',
       desc:'본인 사기 -10 · 불만 1단계 상승. 대신 팀 기강이 잡힌다'},
    ];
    opts.forEach(o=>{
      const b=el('button','sendopt');
      b.innerHTML=`<b>${o.label}</b><span>${o.desc}</span>`;
      b.onclick=()=>doMeet(o.k);
      box.appendChild(b);
    });

    back.onclick=()=>{ ST.meet=null; go('squad'); };

    const back=el('button','btn primary','선수단으로');
    back.onclick=()=>{ ST.meet=null; go('squad'); };
    c.appendChild(back);
  }
}

function doMeet(kind){
  const pid=ST.meet.pid, log=ST.meet.log;
  if(!ST.unhappy[pid])ST.unhappy[pid]={level:0,streak:0};
  const u=ST.unhappy[pid];
  let tip='';

  if(kind==='start'||kind==='order'){
    log.push({who:ST.playerId,
      text:kind==='order'?'다음 5경기 5번 타순 안으로 쓴다':'다음 5경기 선발로 쓴다',mood:'ok'});
    ST.promise=ST.promise||{};
    ST.promise[pid]={type:kind,games:5,orderMax:5};
    ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+10);
    u.level=Math.max(0,u.level-1); u.streak=0;
    log.push({who:pid,text:meetReplyLine(ST,pid,kind),mood:'happy'});
    log.push({who:pid,type:'notice',text:`약속 성립 — ${promiseLabel(ST.promise[pid])}`});
    tip='약속했다. 라인업 짤 때 잊지 마라';
  }
  else if(kind==='calm'){
    log.push({who:ST.playerId,text:'조금만 더 기다려봐라. 기회는 온다',mood:'ok'});
    // 불만이 클수록 달래기가 잘 안 먹힌다 (기본 60% · 3단계 이상이면 40%)
    // 술 약속 등으로 쌓인 우정이 있으면 말이 먹힌다 (±15%p)
    const rate = (u.level>=3?0.40:0.60) + (bondOf(pid)-50)*0.003;
    if(Math.random()<rate){
      ST.morale[pid]=Math.min(100,(ST.morale[pid]||70)+8);
      u.level=Math.max(0,u.level-1); u.streak=0; bondAdd(pid,3);
      log.push({who:pid,text:meetReplyLine(ST,pid,'soothe_ok'),mood:'happy'});
      log.push({who:pid,type:'notice',text:`달래기 성공 — 사기 +8 · 불만 ${unhappyLabel(u.level)}`});
      tip='잘 달랬다';
    } else {
      log.push({who:pid,text:meetReplyLine(ST,pid,'soothe_no'),mood:'sad'});
      log.push({who:pid,type:'notice',text:'달래기 실패 — 변화 없음'});
      tip='안 먹혔다';
    }
  }
  else {
    log.push({who:ST.playerId,text:'그런 얘기 들을 시간 없다. 실력으로 보여라',mood:'angry'});
    ST.morale[pid]=Math.max(10,(ST.morale[pid]||70)-10);
    u.level=Math.min(4,u.level+1); u.streak=0;
    log.push({who:pid,text:meetReplyLine(ST,pid,'ignore'),mood:'angry'});
    bondAdd(pid,-8);
    // 기강 효과 — 나머지 선수는 "감독이 단호하다"고 받아들인다.
    // 별도 스탯을 만들면 엔진까지 건드려야 해서 사기 소폭 상승 + 불만 누적 리셋으로 처리한다.
    let n=0;
    TBYID['wwzw'].players.forEach(q=>{
      if(q.id===pid)return;
      ST.morale[q.id]=Math.min(100,(ST.morale[q.id]||70)+2);
      if(ST.unhappy[q.id])ST.unhappy[q.id].streak=0;
      n++;
    });
    log.push({who:pid,type:'notice',
      text:`${nameOf(pid)} 사기 -10 · 불만 ${unhappyLabel(u.level)}\n나머지 ${n}명 사기 +2 (팀 기강)`});
    tip='단호하게 잘랐다';
  }

  ST.meet.done=true;
  if(!ST.meetRound)ST.meetRound={};
  ST.meetRound[pid]=ST.round;
  saveGame(true); renderMeet(); toast(tip);
}

/* ---------- 카톡 ---------- */
function renderKakao(){
  const c=$('#view'); c.innerHTML='';
  const played=ST.schedule[ST.round]&&ST.schedule[ST.round].played;
  const phase = (ST.kakaoPost&&ST.kakaoPost.length)?'post':'pre';

  const head=el('div','card');
  head.innerHTML='<div class="card-h">우완좌완 에이스방</div>';
  if(phase==='pre'){
    const b=el('button','btn','라인업 발표');
    b.onclick=()=>{ST.kakao=buildKakaoPre(ST);ST.sentPre=false;saveGame(true);renderKakao();};
    head.appendChild(b);
  }
  c.appendChild(head);

  if(ST.dropouts&&ST.dropouts.length){
    const avail=TBYID['wwzw'].players.filter(p=>isAvailable(p.id)).length;
    c.appendChild(el('div','warn',
      `발표 후 ${ST.dropouts.map(nameOf).join(', ')}이(가) 못 온다고 했다. `+
      (avail>=9?'라인업을 자동으로 채웠다. 확인해라.':`출전 가능 ${avail}명 — 몰수패 위기다.`)));
  }
  const all=(ST.kakao||[]).concat(ST.kakaoPost||[]);
  if(!all.length){
    c.appendChild(el('p','muted','아직 발표하지 않았다. 위 버튼을 누르면 단톡방에 라인업이 올라간다.'));
    return;
  }

  const room=el('div','kakao');
  all.forEach(m=>{
    const p=TBYID['wwzw'].players.find(x=>x.id===m.who);
    const nm=p?p.name:'?';
    const mine=isMe(m.who);
    const w=el('div','kmsg'+(mine?' mine':'')+(m.type==='notice'?' notice':'')+(m.type==='record'?' record':''));
    w.innerHTML=`${(mine||m.type==='notice'||m.type==='record')?'':`<div class="kname">${nm}</div>`}<div class="kbub ${m.mood||''}">${String(m.text).replace(/\n/g,'<br>')}</div>`;
    room.appendChild(w);
  });
  c.appendChild(room);

  // 발신 선택지
  const sent = phase==='pre' ? ST.sentPre : ST.sentPost;
  if(!sent){
    const box=el('div','card sendbox');
    box.appendChild(el('div','card-h','뭐라고 보낼까'));
    const opts=kakaoOptions(ST,phase);
    opts.forEach(o=>{
      const b=el('button','sendopt');
      b.innerHTML=`<b>${o.label}</b><span>${o.desc}</span>`;
      b.onclick=()=>{
        const mine={who:ST.playerId,text:o.label,mood:'ok'};
        if(o.action==='party'){
          if(ST.budget<PARTY_COST){toast(`회식비가 부족하다 (${PARTY_COST}만원 필요)`);return;}
          ST.budget-=PARTY_COST;
          (phase==='pre'?ST.kakao:ST.kakaoPost).push(mine);
          const r=doAfterParty(ST);
          ST.kakaoPost.push({who:'lg',type:'notice',text:`회식비 ${PARTY_COST}만원 지출 · 남은 운영비 ${ST.budget.toFixed(0)}만원`});
          ST.kakaoPost.push({who:'lg',text:`${r.joined.length}명 모였다. 오늘 잘했다`,mood:'happy'});
          (r.msgs||[]).forEach(m=>ST.kakaoPost.push(m));
          ST.sentPost=true;
          saveGame(true); renderKakao(); toast('회식 · 사기↑ 컨디션↓');
          return;
        }
        (phase==='pre'?ST.kakao:ST.kakaoPost).push(mine);
        const reply=o.run?o.run():[];
        reply.forEach(m=>(phase==='pre'?ST.kakao:ST.kakaoPost).push(m));
        if(phase==='pre')ST.sentPre=true; else ST.sentPost=true;
        saveGame(true); renderKakao();
      };
      box.appendChild(b);
    });
    c.appendChild(box);
  }

  if(!played){
    const g=el('button','btn primary','경기 시작'); g.onclick=()=>go('game');
    c.appendChild(g);
  } else {
    const g=el('button','btn primary','다음 주로'); g.onclick=()=>go('home');
    c.appendChild(g);
  }
}

          ST.kakao.push({who:p.id,text:say(p.id,'알겠다 늦게라도 갈게','알겠습니다 늦게라도 가겠습니다'),mood:'flat'});
          ST.lineup=recommendLineup(); applyDHRule();
          toast(`${p.name}이(가) 오기로 했다`);

          ST.kakao.push({who:p.id,text:say(p.id,'미안하다 진짜 안 된다','정말 죄송합니다 안 됩니다'),mood:'sad'});

      };
      const bm2=el('button','btn','용병 부른다');

  }

  const next=ST.schedule[ST.round], opp=TBYID[next.opp];

  head.innerHTML=`<div class="card-h">${next.round}차전</div>
    <div class="vs"><span>${next.homeGame?opp.name:'우완좌완'}</span><b>vs</b><span>${next.homeGame?'우완좌완':opp.name}</span></div>
    <div class="gdate">${(ST.calendar&&ST.calendar.label)||''} · ${(PARKS.find(p=>p.id===ST.park)||PARKS[0]).name} · ${(WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0]).name}</div>
    <div class="daterow"><b>${(ST.calendar&&ST.calendar.label)||''}</b><span>${((WEATHERS.find(w=>w.id===ST.weather)||WEATHERS[0]).name)}</span></div>
    <p class="muted">${next.homeGame?'홈':'원정'} · 7이닝 · 콜드게임 있음</p>
    <div class="scout">${ST.scoutBlocked?'상대 정보 없음':scoutLine(opp)}</div>`;
  c.appendChild(head);

  const sp=TBYID['wwzw'].pitchers.find(x=>x.id===ST.rotation[0]);
  const rr=ST.rest?ST.rest[sp.id]:3;
  if(rr<2)c.appendChild(el('div','warn',`선발 ${sp.name}이(가) ${rr===0?'과부하 상태다':'피로하다'}. 구위·제구가 떨어진다.`));

/* ST.rotation 자체의 유효성만 정리한다.
   로스터에 없는 id(이적·방출·용병)만 걸러내고, 결장자는 건드리지 않는다.

   [버그 이력] 예전에는 여기서 결장자를 지우고 ST.rotation 을 통째로
   덮어썼다. 그래서 늦잠으로 한 경기 빠진 투수가 다음 주에 돌아와도
   로테이션에 없었고, UI 에 '추가' 버튼도 없어서 되살릴 방법이 없었다.
   "투수가 사라진다"는 제보가 전부 이것 때문이다.                      */
function sanitizeRotation(){
  const t=TBYID['wwzw'];
  ST.rotation=(ST.rotation||[]).filter(id=>t.pitchers.some(p=>p.id===id));
  // 중복 제거
  ST.rotation=ST.rotation.filter((id,i)=>ST.rotation.indexOf(id)===i);
  if(!ST.rotation.length)ST.rotation=recommendRotation();
  return ST.rotation;
}

/* 이번 경기에 실제로 쓸 등판 순서.
   결장·부상자를 '이 경기에서만' 건너뛴다. ST.rotation 은 그대로 둔다.

   선발 투수의 유일한 진실은 ST.rotation[0] 이다.
   예전에는 라인업의 P 슬롯과 로테이션 1번이 따로 놀아서
   "타순에 보이는 투수와 실제 등판 투수가 다르다"는 문제가 있었다.
   지금은 setStarter() 가 양쪽을 한꺼번에 맞춘다.                      */
function gameRotation(){
  const t=TBYID['wwzw'];
  sanitizeRotation();
  let rot=ST.rotation.filter(id=>isAvailable(id));
  if(!rot.length){
    // 설정한 투수가 전부 결장이면 나온 사람 중에서 급히 채운다
    rot=t.pitchers.filter(p=>isAvailable(p.id))
      .sort((a,b)=>(b.stf*1.1+b.ctl*1.3+b.sta*0.8)-(a.stf*1.1+a.ctl*1.3+a.sta*0.8))
      .slice(0,6).map(p=>p.id);
  }
  return rot;
}

/* 선발 투수 지정 — 로테이션 1번으로 올리고 라인업까지 맞춘다.
   라인업 포지션 시트에서 'P' 를 고르면 이걸 부른다.                   */
function setStarter(pid){
  const t=TBYID['wwzw'];
  if(!t.pitchers.some(p=>p.id===pid)) return false;
  ST.rotation=[pid].concat((ST.rotation||[]).filter(x=>x!==pid));
  applyDHRule();
  return true;
}

function makeLive(){
  sanitizeRotation();
  ST.gameRotation=gameRotation();     // 이번 경기 등판 순서 스냅샷
  /* 지명타자를 안 쓰면 타순의 투수 자리에 '실제로 던질 사람'이 앉아야 한다.
     로테이션 1번이 그날 결장이면 타순 투수와 등판 투수가 어긋났었다.     */
  if(!ST.useDH && ST.gameRotation.length){
    const sp=ST.gameRotation[0];
    const pIdx=ST.lineup.findIndex(x=>x.pos==='P');
    if(pIdx>=0 && ST.lineup[pIdx].id!==sp){
      const dup=ST.lineup.findIndex(x=>x.id===sp);
      if(dup>=0 && dup!==pIdx){ ST.lineup[dup].pos=ST.lineup[pIdx].pos; }
      ST.lineup[pIdx].id=sp; ST.lineup[pIdx].pos='P';
    }
  }
  const next=ST.schedule[ST.round];
  const opp=TBYID[next.opp];
  const raw=TBYID['wwzw'];
  const hotDay = ST.weather==='hot'||ST.weather==='humid';
  const us={...raw, pitchers: raw.pitchers.map(p=>{
    const r=ST.rest[p.id]!==undefined?ST.rest[p.id]:3;
    let f=r>=2?1:(r===1?0.86:0.70);
    let np = f===1?{...p}:{...p,stf:Math.round(p.stf*f),ctl:Math.round(p.ctl*f),sta:Math.round(p.sta*f)};
    const mm=META[p.id];
    if(hotDay&&mm&&mm.traits.includes('더위약함')){
      np.sta = Math.min(np.sta, 26);          // 약 2이닝에서 한계
      np.heatFade = true;
    }
    return np;
  })};
  const rng=makeRng((ST.seed+ST.round*7919+(Date.now()%100000))>>>0);
  const uLine=ST.lineup.map(s=>({id:s.id,pos:s.pos}));
  // 약속(면담) 검사에 쓸 선발 라인업 스냅샷. 대타로 교체돼도 선발은 선발이다.
  ST.gameStarters = uLine.map(x=>x.id);
  const cond={};
  raw.players.forEach(p=>{
    let cv=(ST.cond[p.id]||70)+((ST.morale[p.id]||70)-70)*0.18;
    if(ST.mittMissing&&p.id==='yjh')cv-=6;
    const mm=META[p.id];
    const sl=uLine.find(x=>x.id===p.id);
    if(mm&&sl&&mm.traits.includes('포수부담')&&sl.pos==='C') cv-=14;
    const bf=ST.buff&&ST.buff[p.id];
    if(bf){ if(bf.all)cv*=bf.all; if(bf.pow)cv+=(bf.pow-1)*40; if(bf.spd)cv+=(bf.spd-1)*30; }
    cond[p.id]=Math.max(20,Math.min(100,cv));
  });
  const neutral={bat:'normal',run:'normal',hook:'normal'};
  const park=PARKS.find(p=>p.id===ST.park)||PARKS[0];
  const gearPenalty = ST.gearLevel===2?30:(ST.gearLevel===1?10:0);
  recalcTeamDefense(us, uLine, gearPenalty);
  us._errMod = (raw._errMod||1) * (ST.fieldMod?ST.fieldMod.err:1) * ((ST.teamBuff&&ST.teamBuff.err)||1);
  // 상대팀 변수 반영
  const oe=ST.oppEvent?ST.oppEvent.eff:null;
  const oppMod = {...opp};
  if(oe){
    oppMod.tend={...opp.tend};
    if(oe.oppB) oppMod.tend.babip=opp.tend.babip*(1+oe.oppB);
    if(oe.oppE) oppMod.tend.err=opp.tend.err*oe.oppE;
    if(oe.oppP){ oppMod.pitchers=opp.pitchers.map(p=>({...p,
      stf:Math.max(18,p.stf+oe.oppP), ctl:Math.max(15,p.ctl+Math.round(oe.oppP*0.6))})); }
    oppMod.mean=opp.mean; oppMod._errMod=opp._errMod;
  }
  return new LiveGame({
    innings:7,rng,userIsHome:next.homeGame,
    home: next.homeGame?us:oppMod,
    away: next.homeGame?oppMod:us,
    homeLineup: next.homeGame?uLine:aiLineup(oppMod),
    awayLineup: next.homeGame?aiLineup(oppMod):uLine,
    homeRotation: next.homeGame?ST.gameRotation.slice():aiRotation(oppMod),
    awayRotation: next.homeGame?aiRotation(oppMod):ST.gameRotation.slice(),
    homeTactics: next.homeGame?{...ST.tactics}:neutral,
    awayTactics: next.homeGame?neutral:{...ST.tactics},
    homeCond: next.homeGame?cond:{},
    awayCond: next.homeGame?{}:cond,
    park, gearPenalty, buff: ST.buff||{}, hot: ST.weather==='hot',
    myId: ST.playerId||MYID,          // 내 선수 연출용
    drunkIds: (ST.drunkIds||[]).slice(),
  });
}

  sb.innerHTML=`<div class="sb-team"><span id="sb-tn">상대</span><b id="sb-them">0</b></div>
    <div class="sb-mid"><div id="sb-inn">1회 초</div><div class="sb-out" id="sb-out"></div></div>
    <div class="sb-team"><span>우완좌완</span><b id="sb-us">0</b></div>`;
  stage.appendChild(sb);
  const dia=el('div','diamond');
  dia.innerHTML=`<div class="base b2" id="bs2"></div><div class="base b3" id="bs3"></div><div class="base b1" id="bs1"></div><div class="base bh"></div>`;
  stage.appendChild(dia);
  const dec=el('div','decision'); dec.id='decision'; stage.appendChild(dec);
  const feed=el('div','feed'); feed.id='feed'; stage.appendChild(feed);

function updateLiveUI(){
  if(!LIVE)return;
  const us=LIVE.userIsHome?LIVE.home:LIVE.away;
  const th=LIVE.userIsHome?LIVE.away:LIVE.home;
  const a=$('#sb-us'),b=$('#sb-them'),i=$('#sb-inn'),o=$('#sb-out');
  if(a)a.textContent=us.runs; if(b)b.textContent=th.runs;
  if(i)i.textContent=`${LIVE.inning}회 ${LIVE.half===0?'초':'말'}`;
  if(o)o.textContent='●'.repeat(LIVE.outs)+'○'.repeat(Math.max(0,2-LIVE.outs));
  ['bs1','bs2','bs3'].forEach((id,k)=>{const e=$('#'+id);if(e)e.classList.toggle('on',!!LIVE.bases[k]);});
}

function flushLog(){
  const feed=$('#feed'); if(!feed||!LIVE)return;
  const fresh=LIVE.log.slice(LIVE._logSeen||0);
  LIVE._logSeen=LIVE.log.length;
  fresh.forEach(l=>{
    const cls=l.t==='inning'?'inn':(l.t==='sub'?'sub':(l.t==='me'?'meline':(l.t==='gojin'?'gojin':(l.t==='fric'?'fric':(l.t==='mgr'?'mgr':(l.cls||''))))));
    const d=el('div','fl '+cls+(l.me?' me':'')); d.textContent=l.text; feed.appendChild(d);
  });
  while(feed.children.length>50)feed.removeChild(feed.firstChild);
  feed.scrollTop=feed.scrollHeight;
}

function runLive(){
  clearInterval(playTimer);
  if(!LIVE.manual){
    // 자동 진행: 즉시 계산
    let guard=0;
    while(!LIVE.over && guard++<2000){
      if(LIVE.pending) LIVE.applyDecision('change');
      LIVE.step();
    }
    flushLog(); updateLiveUI(); showResult(); return;
  }
  const speed=520;
  playTimer=setInterval(()=>{
    if(!LIVE){clearInterval(playTimer);return;}
    if(LIVE.over){clearInterval(playTimer);showResult();return;}
    if(LIVE.manual){
      const d=LIVE.pending||LIVE.detectDecision();
      if(d){clearInterval(playTimer);showDecision(d);return;}
    } else if(LIVE.pending){ LIVE.applyDecision('change'); }
    LIVE.step();
    flushLog(); updateLiveUI();
    if(LIVE.over){clearInterval(playTimer);showResult();}
  },speed);
}

/* 판단창을 닫고 경기를 다시 굴린다 */
function decDone(box){ box.classList.remove('on'); box.innerHTML=''; flushLog(); updateLiveUI(); runLive(); }

/* 감독 액션 버튼 — 물통 차기 등. 판단창 양쪽에 붙는다 */
function mgrBtn(box){
  const b=el('button','decb wide alt');
  b.innerHTML=`<b>감독 액션 (남은 ${LIVE.mgr.left}회)</b><span>물통 차기 · 박수 · 심판 어필</span>`;
  b.onclick=()=>{
    const body=$('#sheet-body'); body.innerHTML='';
    $('#sheet-title').textContent='감독 액션';
    const us=LIVE.userSide(), th=LIVE.oppSide();
    const diff=us.runs-th.runs;
    body.appendChild(el('div','sheet-note',
      `${LIVE.inning}회 · ${diff>0?'+':''}${diff}점. `+
      (diff<0?'지고 있을 때는 물통을 차는 게 먹힐 확률이 높다.'
             :'이기고 있을 때 화를 내면 오히려 위축된다.')+
      ` 남은 횟수 ${LIVE.mgr.left}회.`));
    [['bottle','물통을 걷어찬다',`분위기 반전. 지고 있으면 62% 성공, 이기고 있으면 25%`],
     ['clap','크게 박수를 친다','무난하게 사기 +3%'],
     ['umpire','심판에게 어필한다','40% 유리 / 20% 경고'],
     ['watch','조용히 지켜본다','횟수를 쓰지 않는다']].forEach(([k,n,d2])=>{
      const r=el('button','pick-row'+(LIVE.mgr.left<=0&&k!=='watch'?' bad':''));
      r.innerHTML=`<div class="pk-l"><div class="pk-name">${n}</div>
        <div class="pk-note">${d2}</div></div>`;
      if(LIVE.mgr.left>0||k==='watch')r.onclick=()=>{
        const res=LIVE.mgrAction(k);
        closeSheet(); toast(res.text.length>40?res.text.slice(0,40)+'…':res.text);
        decDone(box);
      };
      body.appendChild(r);

  };
  return b;
}

/* '투수 교체' 상시 버튼 — 공격 중에도 미리 예고해 둘 수 있다 */
function pchangeBtn(box){
  const s=LIVE.userSide();

  const nxt=LIVE.curPitcherNext(s);
